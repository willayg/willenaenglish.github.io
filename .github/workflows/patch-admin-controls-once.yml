name: Patch admin controls once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/patch-admin-controls-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Load current admin controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Teachers/admin/index.html')
          text = p.read_text()
          text = text.replace('/Teachers/admin/student-drawer.js?v=20260806a', '/Teachers/admin/student-drawer.js?v=20260806e')
          loader = '<script src="/Teachers/admin/admin-class-manager.js?v=20260806a"></script>'
          if loader not in text:
              text = text.replace('</body>', loader + '\n</body>')
          p.write_text(text)
          PY
      - name: Commit page patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Load current admin student and class controls"
          git push origin staging
