name: Bust corrected AI Coach data source cache
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/bump-coach-needs-progress-db-once.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump Coach cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'v2-ai-coach-needs\.js\?v=[^"<]+','v2-ai-coach-needs.js?v=20260819-progressdb1',s,count=1)
          if not n: raise SystemExit('Coach script tag not found')
          p.write_text(s)
          PY
          grep 'v2-ai-coach-needs.js' students/study-v2/index.html
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/index.html
          git diff --cached --quiet || git commit -m "Bust AI Coach progress database cache"
          git push origin HEAD:staging
