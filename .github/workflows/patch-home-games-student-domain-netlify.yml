name: Patch homepage Games student domain (Netlify)

on:
  push:
    branches: [Netlify]
    paths:
      - '.github/workflows/patch-home-games-student-domain-netlify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Netlify
      - name: Patch Games links
        run: |
          sed -i "s|href=\"students/dashboard.html\"|href=\"https://students.willenaenglish.com/students/dashboard.html\"|g" index.html
          sed -i "s|location.href='students/dashboard.html'|location.href='https://students.willenaenglish.com/students/dashboard.html'|g" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Route homepage Games to students domain"
          git push origin HEAD:Netlify
