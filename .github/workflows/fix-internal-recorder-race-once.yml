name: Fix internal recorder duplicate attempt race once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/fix-internal-recorder-race-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Patch recorder race and fresh-run reset
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('free-level-test/js/test-recording.js')
          text = path.read_text()
          text = text.replace(
              "var answers=[],answerIds=new Set(),bankMap=new Map(),attempt=null,startAt=0,finalized=false,lastQuestionAt=0,finishPromise=null,finishRequested=false,recoveredFinishedTest=false;",
              "var answers=[],answerIds=new Set(),bankMap=new Map(),attempt=null,attemptPromise=null,startAt=0,finalized=false,lastQuestionAt=0,finishPromise=null,finishRequested=false,recoveredFinishedTest=false;",
              1,
          )
          text = text.replace(
              "function clearAttempt(){attempt=null;sessionStorage.removeItem(attemptKey());try{localStorage.removeItem(attemptKey());localStorage.removeItem(stateKey())}catch(_){}}",
              "function clearAttempt(){attempt=null;attemptPromise=null;sessionStorage.removeItem(attemptKey());try{localStorage.removeItem(attemptKey());localStorage.removeItem(stateKey())}catch(_){}}",
              1,
          )

          old = """function ensureAttempt(){
 if(attempt)return Promise.resolve(attempt);
 var saved=loadSaved();
 if(saved&&saved.id&&(internal()||saved.session_token)){attempt=saved;return Promise.resolve(attempt)}
 var c=candidate();
 if(!internal()&&(!c||!c.id||!c.registration_token))return Promise.reject(new Error('Candidate session missing'));
 startAt=Date.now();
 var body={action:'start',setup:setupGuess(),language:document.documentElement.lang||'ko'};
 if(internal()){body.test_version='2026-08-v1';body.total_questions=Number(context().setup&&context().setup.length)||null}
 else{body.candidate_id=c.id;body.registration_token=c.registration_token}
 return post(body).then(function(j){saveAttempt(j.attempt||{id:j.attempt_id});return attempt});
}"""
          new = """function ensureAttempt(){
 if(attempt)return Promise.resolve(attempt);
 if(attemptPromise)return attemptPromise;
 var saved=loadSaved();
 if(saved&&saved.id&&(internal()||saved.session_token)){attempt=saved;return Promise.resolve(attempt)}
 var c=candidate();
 if(!internal()&&(!c||!c.id||!c.registration_token))return Promise.reject(new Error('Candidate session missing'));
 startAt=startAt||Date.now();
 var body={action:'start',setup:setupGuess(),language:document.documentElement.lang||'ko'};
 if(internal()){body.test_version='2026-08-v1';body.total_questions=Number(context().setup&&context().setup.length)||null}
 else{body.candidate_id=c.id;body.registration_token=c.registration_token}
 attemptPromise=post(body).then(function(j){saveAttempt(j.attempt||{id:j.attempt_id});return attempt}).finally(function(){attemptPromise=null});
 return attemptPromise;
}
function beginNewAttempt(){
 answers=[];answerIds.clear();finalized=false;finishPromise=null;finishRequested=false;recoveredFinishedTest=false;clearAttempt();startAt=Date.now();persistState();return ensureAttempt();
}"""
          if old not in text:
              raise SystemExit('ensureAttempt block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "window.WillenaLevelTestRecorder={start:ensureAttempt,finish:finishIfReady,recover:recoverFinishedTest,getAnswers:function(){return answers.slice()}};",
              "window.WillenaLevelTestRecorder={start:ensureAttempt,begin:beginNewAttempt,finish:finishIfReady,recover:recoverFinishedTest,getAnswers:function(){return answers.slice()}};",
              1,
          )
          path.write_text(text)

          path = Path('students/level-test/level-test.js')
          text = path.read_text()
          old = "if(key==='length')setTimeout(function(){if(window.WillenaLevelTestRecorder)window.WillenaLevelTestRecorder.start().catch(function(error){console.warn('[StudentLevelTest] attempt start failed',error)})},0);"
          new = "if(key==='length')setTimeout(function(){if(window.WillenaLevelTestRecorder){var begin=window.WillenaLevelTestRecorder.begin||window.WillenaLevelTestRecorder.start;begin().catch(function(error){console.warn('[StudentLevelTest] attempt start failed',error)})}},0);"
          if old not in text:
              raise SystemExit('level-test start hook not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('students/level-test/index.html')
          text = path.read_text()
          import re
          text = re.sub(r'level-test\.js\?v=[^\"]+', 'level-test.js?v=20260807-race1', text)
          text = re.sub(r'test-recording\.js\?v=[^\"]+', 'test-recording.js?v=20260807-race1', text)
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-level-test/js/test-recording.js students/level-test/level-test.js students/level-test/index.html
          git diff --cached --quiet || git commit -m "Fix duplicate internal level test attempts"
          git push origin staging
