name: Deploy Shared Audio Worker from Students

on:
  workflow_dispatch:
  push:
    branches:
      - students
    paths:
      - 'cloudflare-workers/get-audio-urls/**'
      - '.github/workflows/deploy-free-talking-audio-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-get-audio-urls-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: cloudflare-workers/get-audio-urls
        run: npm ci
      - name: Deploy existing R2-bound audio Worker
        working-directory: cloudflare-workers/get-audio-urls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
