name: Run Daily Study immediate Next once
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/run-daily-study-immediate-next-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - run: python tools/patch_daily_study_immediate_next.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add students/study-v2/v2-daily.js students/study-v2/index.html
          git commit -m "Make Daily Study Next immediate"
          git push origin staging
