name: Patch admin forms once
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/patch-admin-forms-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Patch admin page assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Teachers/admin/index.html')
          s=p.read_text()
          css='<link href="/Teachers/admin/admin-form-layout.css?v=20260806a" rel="stylesheet">'
          if css not in s:
              s=s.replace('<link href="/Teachers/admin/student-drawer.css?v=20260806a" rel="stylesheet">','<link href="/Teachers/admin/student-drawer.css?v=20260806a" rel="stylesheet">\n'+css)
          s=s.replace('/Teachers/admin/admin-class-manager.js?v=20260806a','/Teachers/admin/admin-class-manager.js?v=20260806b')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Load aligned admin forms and class books"
          git push origin staging
