name: Temporary fix student login dashboard redirect

on:
  push:
    paths:
      - '.github/workflows/temp-fix-student-login-dashboard.yml'

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch login fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/login.html')
          s = p.read_text(encoding='utf-8')
          old = "return '/students/profile.html';"
          new = "return '/students/dashboard-v2/';"
          if old not in s:
              print('Fallback already updated; nothing to do.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Updated login fallback to dashboard-v2.')
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- students/login.html; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/login.html
          git commit -m 'fix: send student login to dashboard by default'
          git push origin HEAD:main
