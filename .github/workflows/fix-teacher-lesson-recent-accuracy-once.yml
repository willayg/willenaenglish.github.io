name: Fix teacher lesson recent accuracy once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-teacher-lesson-recent-accuracy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Use student Test Prep recent-accuracy backend contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('Teachers/dashboard-v2/naesin-lesson-progress.js')
          s=p.read_text()

          helper="""async function teacherRecentStats(planId){
  const t=token();if(!planId||!t)return[];
  const r=await fetch('https://fiieuiktlsivwfgyivai.supabase.co/rest/v1/rpc/test_prep_teacher_card_stats',{method:'POST',headers:{Authorization:`Bearer ${t}`,apikey:TRACKING_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_plan_id:planId}),credentials:'omit',cache:'no-store'});
  if(!r.ok)throw new Error(`Recent stats ${r.status}`);
  const rows=await r.json().catch(()=>[]);return Array.isArray(rows)?rows:[];
}
function mergeTeacherRecentStats(d,rows){
  const map=d?.summary?.by_lesson_practice;if(!map||!Array.isArray(rows))return;
  rows.forEach(row=>{let box=row?.attempted_question_ids?.by_practice;if(typeof box==='string'){try{box=JSON.parse(box)}catch{box=null}}if(!box||typeof box!=='object')return;Object.entries(box).forEach(([practice,stats])=>{const key=`${row.unit_key}||${practice}`,target=map[key];if(!target||!stats||typeof stats!=='object')return;target.recent_accuracy=stats.recent_accuracy??null;target.recent_count=Number(stats.recent_count||0);});});
}"""

          new_fetch="""async function fetchAll(){const h=authHeaders();const [d,groups,w]=await Promise.all([json(`${INSIGHTS}?${new URLSearchParams({action:'student_detail',student_id:ctx.sid,group_id:ctx.gid})}`,{headers:h,credentials:'omit'}),json(`${GROUP}?action=teacher_groups`,{headers:h,credentials:'omit'}),json(`${WRONG}?${new URLSearchParams({student_id:ctx.sid})}`,{headers:h,credentials:'omit'}).catch(()=>({items:[]}))]);detail=d;group=(groups.groups||[]).find(x=>String(x.group?.id)===String(ctx.gid))?.group||null;wrongItems=w.items||[];if(!group)throw new Error('시험 범위를 찾지 못했습니다.');const planId=detail?.exams?.[0]?.plan_id||null;if(planId){const recent=await teacherRecentStats(planId).catch(e=>{console.warn('teacher recent stats unavailable',e);return[]});mergeTeacherRecentStats(detail,recent);}}"""

          if 'function teacherRecentStats(planId)' not in s:
              pat=r'^async function fetchAll\(\)\{.*$'
              m=re.search(pat,s,re.M)
              if not m: raise SystemExit('fetchAll line not found')
              s=s[:m.start()]+helper+'\n'+new_fetch+s[m.end():]
          else:
              s=re.sub(r'^async function fetchAll\(\)\{.*$',new_fetch,s,count=1,flags=re.M)
          p.write_text(s)

          p=Path('Teachers/dashboard-v2/index.html')
          s=p.read_text()
          s2=re.sub(r'(\.\/naesin-lesson-progress\.js\?v=)[^"\']+',r'\g<1>20260908-recentexact1',s,count=1)
          if s2==s and './naesin-lesson-progress.js' in s:
              s2=s.replace('./naesin-lesson-progress.js','./naesin-lesson-progress.js?v=20260908-recentexact1',1)
          p.write_text(s2)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/dashboard-v2/naesin-lesson-progress.js Teachers/dashboard-v2/index.html
          git diff --cached --quiet || git commit -m "Fix teacher lesson recent accuracy to match Test Prep"
          git push origin HEAD:staging
