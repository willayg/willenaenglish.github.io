name: Deploy Student Session Worker Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-student-session-worker-once.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out teachers branch
        uses: actions/checkout@v4
        with:
          ref: teachers
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Supabase auth Worker
        working-directory: cloudflare-workers/supabase-auth
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
