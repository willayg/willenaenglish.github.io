name: Patch dashboard persistent auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-persistent-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch main dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = """        const who = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=whoami&_=${Date.now()}`);\n        console.log('[Dashboard] Auth check response:', who.status, who.statusText);\n        const w = await who.json();\n        console.log('[Dashboard] Auth data:', w);\n        if (!w.success) {\n          console.log('[Dashboard] Not logged in, redirecting to signin');\n          // Not logged in - redirect to login\n          location.replace('/students/signin.html?next=' + encodeURIComponent(location.pathname));\n        } else {\n          console.log('[Dashboard] User is logged in:', w.user_id || w.id);\n        }\n"""
          new = """        async function checkWhoami() {\n          const r = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=whoami&_=${Date.now()}`, { cache: 'no-store' });\n          const d = await r.json().catch(() => ({}));\n          return { response: r, data: d };\n        }\n\n        let auth = await checkWhoami();\n        console.log('[Dashboard] Auth check response:', auth.response.status, auth.response.statusText);\n\n        if (!auth.response.ok || !auth.data.success) {\n          console.log('[Dashboard] Access token unavailable/expired; trying persistent session refresh');\n          const refresh = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`, { cache: 'no-store' });\n          const rd = await refresh.json().catch(() => ({}));\n          if (refresh.ok && rd && rd.success) {\n            if (rd.access_token && WillenaAPI.setLocalTokens) WillenaAPI.setLocalTokens(rd.access_token, '');\n            auth = await checkWhoami();\n          }\n        }\n\n        console.log('[Dashboard] Auth data:', auth.data);\n        if (!auth.response.ok || !auth.data.success) {\n          console.log('[Dashboard] No persistent session, redirecting to signin');\n          location.replace('/students/signin.html?next=' + encodeURIComponent(location.pathname));\n        } else {\n          console.log('[Dashboard] User is logged in:', auth.data.user_id || auth.data.id);\n        }\n"""
          if old not in s:
              raise SystemExit('main auth block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/dashboard.html
          git commit -m "Recover persistent student session before signin" || true
          git push origin main

      - name: Patch students branch
        run: |
          git fetch origin students
          git checkout -B students origin/students
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = """        const who = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=whoami&_=${Date.now()}`);\n        console.log('[Dashboard] Auth check response:', who.status, who.statusText);\n        const w = await who.json();\n        console.log('[Dashboard] Auth data:', w);\n        if (!w.success) {\n          console.log('[Dashboard] Not logged in, redirecting to signin');\n          // Not logged in - redirect to login\n          location.replace('/students/signin.html?next=' + encodeURIComponent(location.pathname));\n        } else {\n          console.log('[Dashboard] User is logged in:', w.user_id || w.id);\n        }\n"""
          new = """        async function checkWhoami() {\n          const r = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=whoami&_=${Date.now()}`, { cache: 'no-store' });\n          const d = await r.json().catch(() => ({}));\n          return { response: r, data: d };\n        }\n\n        let auth = await checkWhoami();\n        console.log('[Dashboard] Auth check response:', auth.response.status, auth.response.statusText);\n\n        if (!auth.response.ok || !auth.data.success) {\n          console.log('[Dashboard] Access token unavailable/expired; trying persistent session refresh');\n          const refresh = await WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`, { cache: 'no-store' });\n          const rd = await refresh.json().catch(() => ({}));\n          if (refresh.ok && rd && rd.success) {\n            if (rd.access_token && WillenaAPI.setLocalTokens) WillenaAPI.setLocalTokens(rd.access_token, '');\n            auth = await checkWhoami();\n          }\n        }\n\n        console.log('[Dashboard] Auth data:', auth.data);\n        if (!auth.response.ok || !auth.data.success) {\n          console.log('[Dashboard] No persistent session, redirecting to signin');\n          location.replace('/students/signin.html?next=' + encodeURIComponent(location.pathname));\n        } else {\n          console.log('[Dashboard] User is logged in:', auth.data.user_id || auth.data.id);\n        }\n"""
          if old not in s:
              raise SystemExit('students auth block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git add students/dashboard.html
          git commit -m "Recover persistent student session before signin" || true
          git push origin students
