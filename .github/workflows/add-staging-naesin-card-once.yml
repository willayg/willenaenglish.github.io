name: Add staging naesin card once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/add-staging-naesin-card-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Insert static card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '''          <a href="/Games/english_arcade/emoji-match.html?autostart=1" class="wa-option-card wa-mix-match"'''
          if 'id="naesinHitCard"' not in s:
              start = s.find(marker)
              if start == -1:
                  raise SystemExit('Mix Match card not found')
              end = s.find('</a>', start)
              if end == -1:
                  raise SystemExit('Mix Match closing tag not found')
              end += len('</a>')
              card = '''\n\n          <a id="naesinHitCard" href="https://students.willenaenglish.com/students/test-prep-app/" class="wa-option-card" style="text-decoration:none;color:inherit;background:#343d44;border:3px solid #59d7db;border-radius:16px;padding:18px 14px;display:flex;align-items:center;justify-content:center;cursor:pointer;grid-column:span 2;min-height:96px;box-sizing:border-box;">\n            <span style="font-size:1.5rem;font-weight:800;color:white;letter-spacing:.02em;">내신 명중</span>\n          </a>'''
              s = s[:end] + card + s[end:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/add-staging-naesin-card-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/dashboard.html .github/workflows/add-staging-naesin-card-once.yml
          git commit -m "Restore staging 내신 명중 card linked to students app"
          git push origin staging
