name: Install Teacher Insights Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/install-teacher-insights-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire teacher insights into progress-summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-workers/progress-summary/src/index.js')
          s=p.read_text()
          imp="import { handleTeacherInsights } from './teacher-insights.js';"
          if imp not in s:
              anchor='const ALLOWED_ORIGINS = ['
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor, imp+'\n\n'+anchor, 1)
          old="const section = (url.searchParams.get('section') || 'kpi').toLowerCase();\n    \n    try {"
          new="const section = (url.searchParams.get('section') || 'kpi').toLowerCase();\n    \n    try {\n      if (section.startsWith('teacher_')) {\n        return await handleTeacherInsights({ request, env, userId, section, origin, jsonResponse, supabaseSelect });\n      }"
          if 'handleTeacherInsights({ request, env, userId' not in s:
              if old not in s: raise SystemExit('route anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate worker syntax
        working-directory: cloudflare-workers/progress-summary
        run: npx --yes wrangler@4.119.0 deploy --dry-run
      - name: Commit installed route and remove one-off workflow
        run: |
          rm .github/workflows/install-teacher-insights-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-workers/progress-summary/src/index.js cloudflare-workers/progress-summary/src/teacher-insights.js .github/workflows/install-teacher-insights-once.yml
          git diff --cached --quiet || git commit -m "Wire teacher insights into progress worker"
          git push origin HEAD:staging
      - name: Deploy progress-summary Worker
        working-directory: cloudflare-workers/progress-summary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy
