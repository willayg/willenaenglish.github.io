name: Deploy API Gateway Worker

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: staging
  push:
    branches: [staging]
    paths:
      - 'cloudflare-workers/proxy/**'
      - '.github/workflows/deploy-workers-proxy.yml'

permissions:
  contents: write

concurrency:
  group: deploy-api-gateway-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Choose ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy live API gateway Worker
        working-directory: cloudflare-workers/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy
      - name: Record successful staging deployment
        shell: bash
        run: |
          mkdir -p .deploy-status
          printf 'commit=%s\ndeployed_at=%s\n' "${{ steps.ref.outputs.value }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-status/willena-proxy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/willena-proxy.txt
          git diff --cached --quiet || git commit -m "Record API gateway deployment"
          git push origin HEAD:staging
