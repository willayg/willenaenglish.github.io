name: Patch admin classes direct cookie auth once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/patch-admin-classes-cookie-auth-direct-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Allow persistent Willena cookie
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-workers/admin-classes/src/index.js')
          s = p.read_text()
          old = """function bearer(req) {
  const value = req.headers.get('Authorization') || '';
  return value.startsWith('Bearer ') ? value.slice(7).trim() : '';
}"""
          new = """function bearer(req) {
  const value = req.headers.get('Authorization') || '';
  if (value.startsWith('Bearer ')) return value.slice(7).trim();
  const cookie = req.headers.get('Cookie') || '';
  const match = cookie.match(/(?:^|;\\s*)sb_access=([^;]+)/);
  return match ? decodeURIComponent(match[1]) : '';
}"""
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit('bearer function not found')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-workers/admin-classes/src/index.js
          git diff --cached --quiet || git commit -m "Allow admin classes to use persistent Willena cookie"
          git push origin staging
