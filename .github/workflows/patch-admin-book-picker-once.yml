name: Patch admin book picker once
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/patch-admin-book-picker-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Patch admin book picker assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Teachers/admin/index.html')
          s=p.read_text()
          s=s.replace('/Teachers/admin/admin-form-layout.css?v=20260806a','/Teachers/admin/admin-form-layout.css?v=20260806b')
          s=s.replace('/Teachers/admin/admin-class-manager.js?v=20260806b','/Teachers/admin/admin-class-manager.js?v=20260806c')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Load curriculum-backed class book picker"
          git push origin staging
