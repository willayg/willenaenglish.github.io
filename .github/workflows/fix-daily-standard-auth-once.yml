name: Fix Daily Study cookie auth
on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/fix-daily-standard-auth-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Patch Daily Study
        run: |
          sed -i "s#var ENDPOINT='https://willena-proxy.willena.workers.dev/api/daily-study';#var ENDPOINT='https://api.willenaenglish.com/api/daily-study';#" students/study-v2/v2-daily.js
          sed -i "/var token=await dailyAccessToken();/d" students/study-v2/v2-daily.js
          sed -i "s/credentials:'omit'/credentials:'include'/" students/study-v2/v2-daily.js
          sed -i "/if(token)opts.headers.Authorization='Bearer '+token;/d" students/study-v2/v2-daily.js
          sed -i "s#./v2-daily.js?v=20260817-dailypersist3#./v2-daily.js?v=20260817-cookieauth1#" students/study-v2/index.html
          grep "var ENDPOINT" students/study-v2/v2-daily.js
          grep "credentials:'include'" students/study-v2/v2-daily.js | head -1
      - name: Commit Daily Study fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/v2-daily.js students/study-v2/index.html
          git commit -m "Use persistent cookie auth for Daily Study"
          git push origin HEAD:staging
