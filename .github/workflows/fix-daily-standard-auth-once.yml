name: Fix Daily Study standard auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-standard-auth-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Make Daily Study use normal WillenaAPI auth path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('students/study-v2/v2-daily.js')
          s = p.read_text()
          s = s.replace("var ENDPOINT='https://willena-proxy.willena.workers.dev/api/daily-study';",
                        "var ENDPOINT='/.netlify/functions/daily_study_v2';")
          pattern = re.compile(r"async function dailyAccessToken\(\)\{.*?\n\}\nasync function request\(method,body\)\{.*?\n\}\n", re.S)
          replacement = """async function request(method,body){
  try{if(global.WillenaStudyV2AuthReady)await global.WillenaStudyV2AuthReady;}catch(_){}
  var url=ENDPOINT+'?date='+encodeURIComponent(activeDate())+'&track='+encodeURIComponent(activeTrack())+'&_='+Date.now();
  var opts={method:method,credentials:'include',cache:'no-store',headers:{Accept:'application/json'}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  var fn=global.WillenaAPI&&typeof global.WillenaAPI.fetch==='function'?global.WillenaAPI.fetch.bind(global.WillenaAPI):fetch;
  var r=await fn(url,opts),d=await r.json().catch(function(){return{};});
  if(!r.ok)throw new Error(d.error||('Daily Study request failed ('+r.status+')'));
  ingestProgress(d);
  return d;
}
"""
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Daily Study request block not found')
          p.write_text(s2)

          p = Path('students/study-v2/auth-guard.js')
          p.write_text("""(function(){
'use strict';
var NEXT='/students/study-v2/';
var LOGIN='/students/signin.html?next='+encodeURIComponent(NEXT);
function authFetch(path,options){
  return (window.WillenaAPI?WillenaAPI.fetch:fetch)(path,Object.assign({credentials:'include',cache:'no-store'},options||{}));
}
async function whoami(){
  try{var r=await authFetch('/.netlify/functions/supabase_auth?action=whoami&_='+Date.now());var d=await r.json().catch(function(){return{}});return !!(r.ok&&d&&d.success);}catch(_){return false;}
}
async function refresh(){
  try{var r=await authFetch('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now());var d=await r.json().catch(function(){return{}});if(!r.ok||!d||!d.success)return false;if(d.access_token&&window.WillenaAPI&&WillenaAPI.setLocalTokens)WillenaAPI.setLocalTokens(d.access_token,d.refresh_token||'');try{window.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}return true;}catch(_){return false;}
}
async function guard(){if(await whoami())return true;if(await refresh()&&await whoami())return true;location.replace(LOGIN);return false;}
window.WillenaStudyV2AuthReady=guard();
})();
""")

          p = Path('cloudflare-workers/proxy/src/index.js')
          s = p.read_text()
          needle = """    const functionName = extractFunctionName(url.pathname);
    let response;

    if (functionName && PREFER_CF_WORKER.has(functionName)) {"""
          repl = """    const functionName = extractFunctionName(url.pathname);
    let response;

    if (functionName === 'daily_study_v2') {
      response = await routeDailyStudy(request, env);
    } else if (functionName && PREFER_CF_WORKER.has(functionName)) {"""
          if needle not in s:
              raise SystemExit('Gateway function routing block not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          p = Path('students/study-v2/index.html')
          s = p.read_text()
          s = s.replace('./auth-guard.js?v=20260817-dailypersist3','./auth-guard.js?v=20260817-standardauth1')
          s = s.replace('./v2-daily.js?v=20260817-dailypersist3','./v2-daily.js?v=20260817-standardauth1')
          p.write_text(s)
          PY

      - name: Commit fix to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/v2-daily.js students/study-v2/auth-guard.js students/study-v2/index.html cloudflare-workers/proxy/src/index.js
          git diff --cached --quiet || git commit -m "Use standard gateway auth for Daily Study"
          git push origin HEAD:staging
