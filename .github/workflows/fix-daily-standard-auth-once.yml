name: Fix Daily Study persistent cookie auth once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-daily-standard-auth-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Route Daily Study through cookie-authenticated API gateway
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('students/study-v2/v2-daily.js')
          s = p.read_text()

          a = "var ENDPOINT='https://willena-proxy.willena.workers.dev/api/daily-study';"
          b = "var ENDPOINT='https://api.willenaenglish.com/api/daily-study';"
          if a not in s:
              raise SystemExit('direct Daily Study endpoint not found')
          s = s.replace(a, b, 1)

          a = """  var token=await dailyAccessToken();
  var url=ENDPOINT+'?date='+encodeURIComponent(activeDate())+'&track='+encodeURIComponent(activeTrack())+'&_='+Date.now();
  var opts={method:method,credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}};
  if(token)opts.headers.Authorization='Bearer '+token;
"""
          b = """  var url=ENDPOINT+'?date='+encodeURIComponent(activeDate())+'&track='+encodeURIComponent(activeTrack())+'&_='+Date.now();
  var opts={method:method,credentials:'include',cache:'no-store',headers:{Accept:'application/json'}};
"""
          if a not in s:
              raise SystemExit('bearer Daily Study request block not found')
          s = s.replace(a, b, 1)
          p.write_text(s)

          p = Path('students/study-v2/index.html')
          h = p.read_text()
          old = './v2-daily.js?v=20260817-dailypersist3'
          new = './v2-daily.js?v=20260817-cookieauth1'
          if old not in h:
              raise SystemExit('Daily Study cache-bust tag not found')
          p.write_text(h.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/v2-daily.js students/study-v2/index.html
          git commit -m "Use persistent cookie auth for Daily Study"
          git push origin HEAD:staging
