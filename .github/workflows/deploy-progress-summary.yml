name: Deploy Progress Summary Worker

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'cloudflare-workers/progress-summary/**'
      - '.github/workflows/deploy-progress-summary.yml'

permissions:
  contents: write

concurrency:
  group: deploy-progress-summary
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy progress-summary Worker
        working-directory: cloudflare-workers/progress-summary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy
      - name: Record successful deployment
        run: |
          mkdir -p .deploy-status
          printf 'commit=%s\ndeployed_at=%s\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-status/progress-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/progress-summary.txt
          git diff --cached --quiet || git commit -m "Record progress-summary deployment"
          git push origin HEAD:staging
