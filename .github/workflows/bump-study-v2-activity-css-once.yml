name: Bump Study V2 activity CSS once
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/bump-study-v2-activity-css-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump CSS cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          old='./v2-activity-ux.css?v=20260816-heroclean1'
          new='./v2-activity-ux.css?v=20260817-instructioncard1'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/study-v2/index.html
          git commit -m 'Bust Study V2 activity CSS cache'
          git push origin HEAD:staging
