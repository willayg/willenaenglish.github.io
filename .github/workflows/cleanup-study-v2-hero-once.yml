name: Clean Study V2 hero once

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/cleanup-study-v2-hero-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Apply cleanup
        run: python .github/scripts/cleanup-study-v2-hero.py
      - name: Commit cleanup
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Clean Study V2 hero ownership and tablet layout'
          git push origin HEAD:staging
      - name: Trigger staging deploy
        env:
          CF_PAGES_STAGING_HOOK: ${{ secrets.CF_PAGES_STAGING_HOOK }}
        run: |
          if [ -n "$CF_PAGES_STAGING_HOOK" ]; then
            curl -fsS -X POST "$CF_PAGES_STAGING_HOOK"
          fi
