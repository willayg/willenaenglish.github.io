name: Fix naesin student API once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-naesin-student-api-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Cache bust naesin script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Teachers/dashboard-v2/index.html')
          s=p.read_text()
          old='./naesin.js?v=20260826-3'
          new='./naesin.js?v=20260826-4'
          if old not in s:
              raise SystemExit('Expected naesin cache-bust reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/dashboard-v2/index.html
          git diff --cached --quiet || git commit -m "Cache bust naesin student API fix"
          git push origin HEAD:staging

# trigger cache bust 2026-08-26
