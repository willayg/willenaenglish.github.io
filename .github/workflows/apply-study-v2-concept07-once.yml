name: Apply Study V2 Concept 07 tablet hero once

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/apply-study-v2-concept07-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Apply Concept 07
        run: python .github/scripts/apply-study-v2-concept07.py

      - name: Commit result
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Match Study V2 tablet hero to Concept 07'
          git push origin staging
