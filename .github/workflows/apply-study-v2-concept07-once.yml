name: Apply Study V2 Concept 07 tablet hero once

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/apply-study-v2-concept07-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Match live tablet hero to Concept 07
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('students/study-v2/v2-daily-journey.css')
          css = css_path.read_text()

          pattern = re.compile(
              r'@media \(min-width:760px\) and \(max-width:1024px\)\{.*?\n\}\n\n/\* Very short wide screens',
              re.S,
          )

          replacement = '''@media (min-width:760px) and (max-width:1024px){
  /* Concept 07: Daily Rail Hero. Keep this deliberately close to the concept prototype. */
  .book-hero.daily-inline .study-v2-top-actions{
    grid-template-columns:230px repeat(3,minmax(0,1fr));
    grid-template-rows:minmax(172px,auto) 82px;
    gap:10px;
    width:100%;
    margin:0;
    padding:0 18px 18px 0;
    overflow:hidden;
    border:2px solid var(--arcade-pink);
    border-radius:28px;
    background:#fff;
    box-shadow:0 10px 28px rgba(38,74,79,.06);
  }

  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary{
    grid-column:1;
    grid-row:1 / 3;
    align-self:stretch;
    min-height:272px;
    padding:22px;
    border:0;
    border-right:1px solid #f3d7e4;
    border-radius:26px 0 0 26px;
    background:linear-gradient(180deg,#fff3f8,#fff);
    box-shadow:none;
  }
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary:hover,
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary:focus-visible{
    border-color:#f3d7e4;
    background:linear-gradient(180deg,#fff3f8,#fff);
    box-shadow:none;
  }

  .book-hero.daily-inline .daily-rail-today{
    font-size:.72rem;
    margin-bottom:9px;
  }
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary strong{
    font-size:1.42rem;
    line-height:1.12;
  }
  .book-hero.daily-inline #dailyWorkoutCard .daily-streak-status{
    display:block;
    margin-top:10px;
    font-size:.78rem;
  }
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary .progress-ring{
    width:96px;
    height:96px;
    flex:0 0 96px;
    margin:18px auto 0;
    box-shadow:none;
  }
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary .progress-ring:after{inset:11px}
  .book-hero.daily-inline #dailyWorkoutCard.study-v2-daily-primary .progress-ring span{font-size:.95rem}

  .book-hero.daily-inline .daily-rail-main{
    grid-column:2 / 5;
    grid-row:1;
    justify-content:flex-start;
    padding:22px 22px 6px;
  }
  .book-hero.daily-inline .daily-rail-headline{
    font-size:1.48rem;
    line-height:1.12;
  }
  .book-hero.daily-inline .daily-rail-sub{
    margin-top:7px;
    font-size:.82rem;
  }
  .book-hero.daily-inline .daily-rail-progress{
    margin-top:15px;
    gap:7px;
  }
  .book-hero.daily-inline .daily-rail-segment{height:7px}

  .book-hero.daily-inline .study-v2-top-actions>#practiceHeroBtn{grid-column:2;grid-row:2}
  .book-hero.daily-inline .study-v2-top-actions>#bookPracticeBtn{grid-column:3;grid-row:2}
  .book-hero.daily-inline .study-v2-top-actions>#bookStudyBtn{grid-column:4;grid-row:2}
  .book-hero.daily-inline .study-v2-top-actions>.study-v2-action-card:not(#dailyWorkoutCard){
    min-height:80px;
    padding:14px 15px;
    gap:12px;
    border-radius:18px;
    box-shadow:none;
  }
  .book-hero.daily-inline .study-v2-top-actions>.study-v2-action-card:not(#dailyWorkoutCard):before{
    width:44px;
    height:44px;
    flex:0 0 44px;
    border-radius:15px;
    background-size:24px 24px;
  }
  .book-hero.daily-inline .study-v2-top-actions>.study-v2-action-card:not(#dailyWorkoutCard)>strong{
    font-size:.98rem;
    line-height:1.15;
  }
  .book-hero.daily-inline .study-v2-top-actions>.study-v2-action-card:not(#dailyWorkoutCard)>small{display:none}

  .header-skill-mastery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Very short wide screens'''

          css, count = pattern.subn(replacement, css, count=1)
          if count != 1:
              raise SystemExit('Current tablet hero block not found')
          css_path.write_text(css)

          index_path = Path('students/study-v2/index.html')
          index = index_path.read_text()
          old = './v2-daily-journey.css?v=20260816-heroclean1'
          new = './v2-daily-journey.css?v=20260816-concept07-1'
          if old not in index:
              raise SystemExit('Expected Daily Journey asset version not found')
          index_path.write_text(index.replace(old, new, 1))

          Path('.github/workflows/apply-study-v2-concept07-once.yml').unlink()
          PY

      - name: Commit Concept 07 tablet hero
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Match Study V2 tablet hero to Concept 07'
          git push origin staging
