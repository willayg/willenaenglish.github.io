name: Roll back theme bars and hide Daily title once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-theme-bars-hide-daily-title-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Remove theme bars and bust Daily session header cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          s=re.sub(r'\n?<script src="\./v2-daily-theme-bars\.js\?v=[^"]+"></script>', '', s, count=1)
          s=re.sub(r'<script src="\./v2-daily-session-polish\.js\?v=[^"]+"></script>', '<script src="./v2-daily-session-polish.js?v=20260819-noheader1"></script>', s, count=1)
          p.write_text(s)
          PY

      - name: Commit to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/index.html
          git diff --cached --quiet || git commit -m "Remove Daily theme bars and hide session title"
          git push origin HEAD:staging
