name: Patch homepage Games clean URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-games-clean-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Games links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://students.willenaenglish.com/students/dashboard.html'
          new = 'https://students.willenaenglish.com/students/dashboard'
          count = s.count(old)
          if count < 1:
              raise SystemExit('Expected Games link not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use clean student dashboard URL from homepage'
          git push origin main
