name: Fix admin classes live gateway once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-admin-classes-live-gateway-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Patch real Worker and gateway
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('cloudflare-workers/admin-classes/src/index.js')
          s = worker.read_text()
          old = """function bearer(req) {
  const value = req.headers.get('Authorization') || '';
  return value.startsWith('Bearer ') ? value.slice(7).trim() : '';
}"""
          new = """function bearer(req) {
  const value = req.headers.get('Authorization') || '';
  if (value.startsWith('Bearer ')) return value.slice(7).trim();
  const cookie = req.headers.get('Cookie') || '';
  const match = cookie.match(/(?:^|;\\s*)sb_access=([^;]+)/);
  return match ? decodeURIComponent(match[1]) : '';
}"""
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('admin classes bearer function not found')
          worker.write_text(s)

          proxy = Path('cloudflare-workers/proxy/src/index.js')
          s = proxy.read_text()
          old_map = "  student_level_test: 'STUDENT_LEVEL_TEST',\n};"
          new_map = "  student_level_test: 'STUDENT_LEVEL_TEST',\n  admin_classes: 'ADMIN_CLASSES',\n};"
          if old_map in s:
              s = s.replace(old_map, new_map)
          elif "admin_classes: 'ADMIN_CLASSES'" not in s:
              raise SystemExit('gateway binding map not found')
          proxy.write_text(s)

          wrangler = Path('cloudflare-workers/proxy/wrangler.toml')
          s = wrangler.read_text()
          binding = '''\n[[services]]\nbinding = "ADMIN_CLASSES"\nservice = "admin-classes"\n'''
          if 'binding = "ADMIN_CLASSES"' not in s:
              marker = '\n[vars]\n'
              if marker not in s:
                  raise SystemExit('gateway vars marker not found')
              s = s.replace(marker, binding + marker)
          wrangler.write_text(s)
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-workers/admin-classes/src/index.js cloudflare-workers/proxy/src/index.js cloudflare-workers/proxy/wrangler.toml
          git diff --cached --quiet || git commit -m "Route admin classes through live gateway binding"
          git push origin staging

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure admin Worker secrets
        working-directory: cloudflare-workers/admin-classes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCORES_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTENT_KEY: ${{ secrets.CONTENT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SCORES_KEY"
          test -n "$CONTENT_KEY"
          printf '%s' "$SCORES_KEY" | npx wrangler secret put SCORES_SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "$CONTENT_KEY" | npx wrangler secret put CONTENT_SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy admin classes Worker
        working-directory: cloudflare-workers/admin-classes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy live API gateway
        working-directory: cloudflare-workers/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
