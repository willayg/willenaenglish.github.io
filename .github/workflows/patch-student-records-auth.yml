name: Patch Student Records Auth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-student-records-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: student-records-whoami-fix
          fetch-depth: 0
      - name: Patch records auth route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('students/records.js')
          text = path.read_text()
          old = "FN('supabase_auth') + '?action=whoami'"
          new = "FN('supabase_auth') + '?action=whoami_student'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 legacy records whoami call, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff --exit-code -- . ':!students/records.js' || {
            echo 'Unexpected files changed'
            exit 1
          }
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/records.js
          git commit -m "Use student session repair in records tracker"
          git push origin HEAD:student-records-whoami-fix
