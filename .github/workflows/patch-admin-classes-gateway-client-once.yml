name: Patch admin classes gateway client once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/patch-admin-classes-gateway-client-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Point class UI to authenticated gateway route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old_urls = [
              "https://admin-classes.willena.workers.dev",
              "https://admin-classes-api.willenaenglish.com",
          ]
          target = "/.netlify/functions/admin_classes"

          for filename in ["admin-class-manager.js", "admin-class-drawer.js"]:
              path = Path("Teachers/admin") / filename
              text = path.read_text()
              for old in old_urls:
                  text = text.replace(old, target)
              if f"const apiUrl='{target}';" not in text:
                  raise SystemExit(f"API URL was not updated in {path}")
              path.write_text(text)

          index = Path("Teachers/admin/index.html")
          text = index.read_text()
          text = re.sub(r'(/Teachers/admin/admin-class-manager\.js\?v=)[^"\']+', r'\g<1>20260806g', text)
          text = re.sub(r'(/Teachers/admin/admin-class-drawer\.js\?v=)[^"\']+', r'\g<1>20260806d', text)
          index.write_text(text)
          PY

      - name: Commit gateway client patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/admin-class-manager.js Teachers/admin/admin-class-drawer.js Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Use authenticated gateway for admin classes"
          git push origin staging
