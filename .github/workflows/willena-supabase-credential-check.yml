name: Willena Supabase credential check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Supabase credentials (without printing values)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL: configured"
          else
            echo "::warning::SUPABASE_URL is not configured"
          fi
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY: configured"
          elif [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY: configured (legacy)"
          else
            echo "::error::No Supabase administrative secret is configured"
            exit 1
          fi
          echo "Credential presence check passed. No account creation was attempted."
