name: Cache bust Study V2 settings center
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-settings-center2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump settings css cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          s=s.replace('./v2-settings.css?v=20260819-settingscenter1','./v2-settings.css?v=20260820-settingscenter2')
          p.write_text(s)
          PY
      - name: Commit staging change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students/study-v2/index.html
          git diff --cached --quiet || git commit -m 'Cache bust Study V2 settings center fix'
          git push origin HEAD:staging
# retrigger
