name: Deploy Get Audio URLs Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-workers/get-audio-urls/**'
      - '.github/workflows/deploy-get-audio-urls.yml'

permissions:
  contents: read

concurrency:
  group: deploy-get-audio-urls-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        working-directory: cloudflare-workers/get-audio-urls
        run: npm install

      - name: Restore OpenAI secret
        working-directory: cloudflare-workers/get-audio-urls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API: ${{ secrets.OPENAI_API }}
        run: |
          test -n "$OPENAI_API" || (echo 'Missing OPENAI_API repository secret' && exit 1)
          printf '%s' "$OPENAI_API" | npx wrangler secret put OPENAI_API

      - name: Deploy Worker
        working-directory: cloudflare-workers/get-audio-urls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
