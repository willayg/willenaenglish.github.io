name: Reorder test prep stations once
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/reorder-test-prep-stations-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Reorder stations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/test-prep-app/student-ux-v4.js')
          s=p.read_text()
          old=""" {k:'communication',label:'Communication',desc:'핵심 대화 표현'},\n {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},\n {k:'grammar',label:'Grammar',desc:'핵심 문법'},"""
          new=""" {k:'communication',label:'Communication',desc:'핵심 대화 표현'},\n {k:'grammar',label:'Grammar',desc:'핵심 문법'},\n {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},"""
          if old not in s:
              raise SystemExit('expected station block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add students/test-prep-app/student-ux-v4.js
          git commit -m 'Move 본문외우기 below Grammar'
          git rm .github/workflows/reorder-test-prep-stations-once.yml
          git commit -m 'Remove one-shot station reorder workflow'
          git push origin staging
