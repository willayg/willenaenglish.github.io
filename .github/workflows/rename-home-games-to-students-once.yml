name: Rename homepage Games to Students once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-home-games-to-students-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('data-i18n="Games">\n      Games\n    </a>', 'data-i18n="Students">\n      Students\n    </a>')
          s = s.replace('data-i18n="Games">Games</button>', 'data-i18n="Students">Students</button>')
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/rename-home-games-to-students-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/rename-home-games-to-students-once.yml
          git commit -m 'Rename homepage Games to Students'
          git push
