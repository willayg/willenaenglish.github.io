name: Add Daily Study session polish once
on:
  push:
    branches: [staging]
jobs:
  patch:
    if: github.event.head_commit.message == 'Bust Daily Study polish cache'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Patch Study V2 index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./v2-daily-session-polish.js?v=20260818-coachmatch1','./v2-daily-session-polish.js?v=20260818-loopfix1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add students/study-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust Daily Study polish script cache"
          git push origin HEAD:staging
