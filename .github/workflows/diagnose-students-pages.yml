name: Diagnose students Pages routing
# audit-run-20260930

on:
  push:
    branches: [students]
    paths:
      - '.github/workflows/diagnose-students-pages.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare Pages project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ.get('CF_API_TOKEN','')
          account=os.environ.get('CF_ACCOUNT_ID','')
          if not token or not account:
              print(json.dumps({'error':'missing_cloudflare_credentials'}))
              raise SystemExit(0)
          for project in ('students','willenaenglish-github-io'):
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.load(r)
                  result=data.get('result') or {}
                  print(json.dumps({'candidate':project,'success':data.get('success'),
                    'name':result.get('name'),'subdomain':result.get('subdomain'),
                    'production_branch':result.get('production_branch'),
                    'domains':result.get('domains')},ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try:
                      obj=json.loads(body)
                      issues=[{'code':x.get('code'),'message':x.get('message')} for x in obj.get('errors',[])]
                  except Exception:
                      issues=[{'message':'Non-JSON HTTP error'}]
                  print(json.dumps({'candidate':project,'http_status':e.code,'errors':issues}))
              except Exception as e:
                  print(json.dumps({'candidate':project,'exception':type(e).__name__}))

          PY
