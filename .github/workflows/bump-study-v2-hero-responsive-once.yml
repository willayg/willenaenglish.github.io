name: Bump Study V2 Hero Responsive Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/bump-study-v2-hero-responsive-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump hero card stylesheet cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          old='./v2-hero-icon-cards.css?v=20260820-align2'
          new='./v2-hero-icon-cards.css?v=20260821-stack1'
          if old not in s:
              raise SystemExit('hero stylesheet cache key not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add students/study-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Cache bust responsive Study V2 hero cards"
          git push origin staging
