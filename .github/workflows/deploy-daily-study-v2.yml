name: Deploy Daily Study V2 Worker

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'cloudflare-workers/daily-study-v2/**'
      - '.github/workflows/deploy-daily-study-v2.yml'

permissions:
  contents: read

concurrency:
  group: deploy-daily-study-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Supabase service key
        working-directory: cloudflare-workers/daily-study-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_KEY" || (echo 'Missing SUPABASE_SERVICE_ROLE_KEY' && exit 1)
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx wrangler secret put SUPABASE_SERVICE_KEY
      - name: Deploy Daily Study V2 Worker
        working-directory: cloudflare-workers/daily-study-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
