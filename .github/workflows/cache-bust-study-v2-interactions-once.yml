name: Restore Study V2 hero baseline once

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/cache-bust-study-v2-interactions-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Restore last known-good hero files
        run: |
          git checkout 8c8c44d7d5bf7852b1150eadbedd04258ca1a77a -- \
            students/study-v2/index.html \
            students/study-v2/v2-top-layout.css \
            students/study-v2/v2-daily-rail-impact.css \
            students/study-v2/v2-daily-rail-impact.js \
            students/study-v2/v2-daily-spark.css

          git rm -f students/study-v2/v2-tablet-hero.css || true
          git rm -f .github/workflows/cache-bust-study-v2-interactions-once.yml

      - name: Commit clean rollback
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Restore Study V2 hero to clean pre-tablet baseline'
          git push origin staging

      - name: Trigger staging deploy hook
        env:
          CF_PAGES_STAGING_HOOK: ${{ secrets.CF_PAGES_STAGING_HOOK }}
        run: |
          if [ -n "$CF_PAGES_STAGING_HOOK" ]; then curl -fsS -X POST "$CF_PAGES_STAGING_HOOK"; fi
