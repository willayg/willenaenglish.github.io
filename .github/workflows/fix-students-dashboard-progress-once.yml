name: Fix students dashboard duplicate progress once

on:
  push:
    branches: [students]
    paths:
      - '.github/workflows/fix-students-dashboard-progress-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: students
      - name: Remove duplicate progress declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text(encoding='utf-8')
          needle = "          // Progress bar\n          const progress = typeof a.completion_pct === 'number' ? a.completion_pct : (a.completion || 0);\n"
          if needle not in s:
              raise SystemExit('Expected duplicate progress declaration not found')
          s = s.replace(needle, "          // Progress bar\n", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-students-dashboard-progress-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/dashboard.html .github/workflows/fix-students-dashboard-progress-once.yml
          git commit -m "Fix duplicate dashboard progress declaration"
          git push origin students