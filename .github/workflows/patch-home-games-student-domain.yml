name: Patch homepage Games student domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-games-student-domain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point Games links at student domain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('href="students/dashboard.html"', 'href="https://students.willenaenglish.com/students/dashboard.html"')
          s = s.replace("onclick=\"location.href='students/dashboard.html'\"", "onclick=\"location.href='https://students.willenaenglish.com/students/dashboard.html'\"")
          p.write_text(s)
          PY
          grep -n "students.willenaenglish.com/students/dashboard.html" index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Route homepage Games to student domain"
          git push origin HEAD:main
