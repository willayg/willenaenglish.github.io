name: Cache-bust Skills Listening Fix Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/cachebust-skills-listen-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump audio loading stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/study-v2/index.html')
          s=p.read_text()
          s=s.replace('./v2-audio-loading.css?v=20260822-audio-loading3','./v2-audio-loading.css?v=20260822-skillslisten1')
          p.write_text(s)
          PY
      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/cachebust-skills-listen-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/index.html .github/workflows/cachebust-skills-listen-once.yml
          git diff --cached --quiet || git commit -m "Cache-bust Skills listening control"
          git push origin HEAD:staging
