name: Deploy Teacher Class Fix Now

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/deploy-teacher-class-fix-now.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        working-directory: cloudflare-workers/progress-summary
        run: npx --yes wrangler@4.119.0 deploy --dry-run
      - name: Deploy
        working-directory: cloudflare-workers/progress-summary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy
      - name: Record deployment
        run: |
          mkdir -p .deploy-status
          printf 'commit=%s\ndeployed_at=%s\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-status/teacher-class-fix.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/teacher-class-fix.txt
          git diff --cached --quiet || git commit -m "Record teacher class fix deployment"
          git push origin HEAD:staging
