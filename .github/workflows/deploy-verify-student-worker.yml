name: Deploy Verify Student Worker

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'cloudflare-workers/verify-student/**'
      - '.github/workflows/deploy-verify-student-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-verify-student-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy verified student login worker
        working-directory: cloudflare-workers/verify-student
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy
