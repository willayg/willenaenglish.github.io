name: Deploy Student Level Test Workers

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: staging
  push:
    branches:
      - staging
    paths:
      - 'cloudflare-workers/student-level-test/**'
      - 'cloudflare-workers/proxy/**'
      - '.github/workflows/deploy-student-level-test.yml'

permissions:
  contents: read

concurrency:
  group: deploy-student-level-test-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Choose deployment ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install student Worker dependencies
        working-directory: cloudflare-workers/student-level-test
        run: npm install

      - name: Deploy student level test Worker
        working-directory: cloudflare-workers/student-level-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy API gateway Worker
        working-directory: cloudflare-workers/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
