name: Patch admin classes Worker client once
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/patch-admin-classes-worker-client-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Point class UI to dedicated Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = "https://admin-classes.willena.workers.dev"
          for name in ["admin-class-manager.js", "admin-class-drawer.js"]:
              p = Path("Teachers/admin") / name
              s = p.read_text()
              old = "const apiUrl='/.netlify/functions/admin_classes';"
              new = f"const apiUrl='{worker}';"
              if old not in s and new not in s:
                  raise SystemExit(f"Expected API declaration missing in {p}")
              p.write_text(s.replace(old, new))
          p = Path("Teachers/admin/index.html")
          s = p.read_text()
          s = s.replace('/Teachers/admin/admin-class-manager.js?v=20260806d', '/Teachers/admin/admin-class-manager.js?v=20260806e')
          s = s.replace('/Teachers/admin/admin-class-drawer.js?v=20260806a', '/Teachers/admin/admin-class-drawer.js?v=20260806b')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/admin-class-manager.js Teachers/admin/admin-class-drawer.js Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Use dedicated admin classes Worker"
          git push origin staging
