name: Patch student dashboard whoami once

on:
  push:
    paths:
      - '.github/workflows/patch-students-whoami-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: students
      - name: Patch dashboard auth action
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text()
          old = 'action=whoami_student'
          new = 'action=whoami'
          if old not in s:
              raise SystemExit('Expected whoami_student call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/dashboard.html
          git commit -m "Use standard whoami on student dashboard"
          git push origin HEAD:students
