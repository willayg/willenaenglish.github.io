name: Patch legacy student whoami actions once

on:
  push:
    paths:
      - '.github/workflows/patch-students-whoami-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: students
      - name: Patch legacy student auth actions
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('students'), Path('Games')]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                      continue
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  if 'action=whoami_student' in s:
                      p.write_text(s.replace('action=whoami_student', 'action=whoami'))
                      changed.append(str(p))

          print('Patched files:')
          for p in changed:
              print(p)
          if not changed:
              raise SystemExit('No whoami_student references found')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students Games
          git commit -m "Use standard whoami across student apps"
          git push origin HEAD:students
