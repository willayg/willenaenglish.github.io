name: Fix staging dashboard card and progress once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-staging-dashboard-card-progress-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Remove card and duplicate progress declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text(encoding='utf-8')

          card = '''\n          <a id="naesinHitCard" href="https://students.willenaenglish.com/students/test-prep-app/" class="wa-option-card" style="text-decoration:none;color:inherit;background:#343d44;border:3px solid #59d7db;border-radius:16px;padding:18px 14px;display:flex;align-items:center;justify-content:center;cursor:pointer;grid-column:span 2;min-height:96px;box-sizing:border-box;">\n            <span style="font-size:1.5rem;font-weight:800;color:white;letter-spacing:.02em;">내신 명중</span>\n          </a>'''
          if card in s:
              s = s.replace(card, '', 1)

          needle = "          // Progress bar\n          const progress = typeof a.completion_pct === 'number' ? a.completion_pct : (a.completion || 0);\n"
          if needle not in s:
              raise SystemExit('Expected duplicate progress declaration not found')
          s = s.replace(needle, "          // Progress bar\n", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-staging-dashboard-card-progress-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/dashboard.html .github/workflows/fix-staging-dashboard-card-progress-once.yml
          git commit -m "Stabilize staging dashboard and remove broken card"
          git push origin staging