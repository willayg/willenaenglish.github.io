name: Fix vocab card hydration once
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/fix-vocab-card-hydration-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Patch vocab card hydration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/test-prep-app/vocab-practice.js')
          s=p.read_text()
          old="async function modeItems(nextMode){if(reviewMode)return items;if(nextMode==='cards'){const ids=await window.WillenaVocabCardControls?.getRemainingIds?.();if(Array.isArray(ids)){const wanted=new Set(ids.map(String));return items.filter(x=>wanted.has(String(x.id)))}}return items}"
          new="async function modeItems(nextMode){if(reviewMode)return items;if(nextMode==='cards'){const controls=window.WillenaVocabCardControls;if(controls?.getRemainingIds){let ids=null;for(let attempt=0;attempt<12;attempt++){if(attempt===0&&controls.reload)try{await controls.reload()}catch{}ids=await controls.getRemainingIds();if(Array.isArray(ids)){const wanted=new Set(ids.map(String));return items.filter(x=>wanted.has(String(x.id)))}await new Promise(r=>setTimeout(r,150))}console.warn('[test-prep] vocab card progress hydration timed out; preserving full queue fallback')}}return items}"
          if old not in s:
              raise SystemExit('modeItems target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/fix-vocab-card-hydration-once.yml
          git add students/test-prep-app/vocab-practice.js .github/workflows/fix-vocab-card-hydration-once.yml
          git commit -m "Fix vocab card progress hydration after refresh"
          git push
