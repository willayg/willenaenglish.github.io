name: Fix Study V2 short-height tablet override once

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/fix-study-v2-short-height-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix short-height breakpoint and cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('students/study-v2/v2-daily-journey.css')
          s = css.read_text()
          old = '@media (min-width:760px) and (max-height:650px){'
          new = '@media (min-width:760px) and (max-height:500px){'
          if old not in s:
              raise SystemExit('short-height rule not found')
          css.write_text(s.replace(old, new, 1))

          idx = Path('students/study-v2/index.html')
          h = idx.read_text()
          oldv = './v2-daily-journey.css?v=20260816-concept07-ring3'
          newv = './v2-daily-journey.css?v=20260816-concept07-ring4'
          if oldv not in h:
              raise SystemExit('asset version not found')
          idx.write_text(h.replace(oldv, newv, 1))

          Path('.github/workflows/fix-study-v2-short-height-once.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Stop short-height layout shrinking tablet progress ring'
          git push origin staging
