name: Trigger Cloudflare Pages preview deploy hooks

on:
  push:
    branches:
      - teachers
      - students
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to trigger (teachers|students)"
        required: true
        default: "teachers"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy hook (teachers)
        if: steps.branch.outputs.value == 'teachers'
        env:
          CF_PAGES_TEACHERS_HOOK: ${{ secrets.CF_PAGES_TEACHERS_HOOK }}
        run: |
          if [ -z "$CF_PAGES_TEACHERS_HOOK" ]; then
            echo "::warning::Missing secret CF_PAGES_TEACHERS_HOOK - skipping teachers deploy hook"
            exit 0
          fi
          curl -fsS -X POST "$CF_PAGES_TEACHERS_HOOK"

      # Cloudflare Pages GitHub integration already deploys every commit to
      # students.willenaenglish-github-io.pages.dev. A second direct Wrangler
      # deployment used an unrelated token without Pages permissions and made
      # successful student deploys appear to fail.
      - name: Student branch deployment is handled by Cloudflare Git integration
        if: steps.branch.outputs.value == 'students'
        run: |
          echo "Cloudflare Pages Git integration deploys the students branch."
          echo "Preview URL: https://students.willenaenglish-github-io.pages.dev"
          echo "See the Cloudflare Pages check on this commit for actual deployment status."

      - name: Trigger deploy hook (staging)
        if: steps.branch.outputs.value == 'staging'
        env:
          CF_PAGES_STAGING_HOOK: ${{ secrets.CF_PAGES_STAGING_HOOK }}
        run: |
          if [ -z "$CF_PAGES_STAGING_HOOK" ]; then
            echo "::warning::Missing secret CF_PAGES_STAGING_HOOK - skipping staging deploy hook"
            exit 0
          fi
          curl -fsS -X POST "$CF_PAGES_STAGING_HOOK"
