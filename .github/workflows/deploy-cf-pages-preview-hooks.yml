name: Trigger Cloudflare Pages preview deploy hooks

on:
  push:
    branches:
      - teachers
      - students
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to trigger (teachers|students)"
        required: true
        default: "teachers"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages Git integration deploys teachers on every push.
      # Keep the hook for explicit manual dispatch only; do not duplicate builds.
      - name: Teachers deployment is handled by Cloudflare Git integration
        if: steps.branch.outputs.value == 'teachers' && github.event_name == 'push'
        run: |
          echo "Cloudflare Pages Git integration deploys the teachers branch."
          echo "Preview URL: https://teachers.willenaenglish-github-io.pages.dev"
          echo "See the Cloudflare Pages check on this commit for actual deployment status."

      - name: Trigger deploy hook (teachers, manual only)
        if: steps.branch.outputs.value == 'teachers' && github.event_name == 'workflow_dispatch'
        env:
          CF_PAGES_TEACHERS_HOOK: ${{ secrets.CF_PAGES_TEACHERS_HOOK }}
        run: |
          if [ -z "$CF_PAGES_TEACHERS_HOOK" ]; then
            echo "::error::Missing secret CF_PAGES_TEACHERS_HOOK - cannot deploy teachers"
            exit 1
          fi
          curl -fsS -X POST "$CF_PAGES_TEACHERS_HOOK"

      - name: Trigger deploy hook (students)
        if: steps.branch.outputs.value == 'students'
        env:
          CF_PAGES_STUDENTS_HOOK: ${{ secrets.CF_PAGES_STUDENTS_HOOK }}
        run: |
          if [ -z "$CF_PAGES_STUDENTS_HOOK" ]; then
            echo "::error::Missing secret CF_PAGES_STUDENTS_HOOK - cannot deploy students"
            exit 1
          fi
          curl -fsS -X POST "$CF_PAGES_STUDENTS_HOOK"

      - name: Trigger deploy hook (staging)
        if: steps.branch.outputs.value == 'staging'
        env:
          CF_PAGES_STAGING_HOOK: ${{ secrets.CF_PAGES_STAGING_HOOK }}
        run: |
          if [ -z "$CF_PAGES_STAGING_HOOK" ]; then
            echo "::error::Missing secret CF_PAGES_STAGING_HOOK - cannot deploy staging"
            exit 1
          fi
          curl -fsS -X POST "$CF_PAGES_STAGING_HOOK"
