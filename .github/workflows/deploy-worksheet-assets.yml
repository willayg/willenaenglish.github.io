name: Deploy Worksheet Assets Worker

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: worksheet-storage-audit
  push:
    branches:
      - worksheet-storage-audit
    paths:
      - 'cloudflare-workers/worksheet-assets/**'
      - '.github/workflows/deploy-worksheet-assets.yml'

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Choose ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Worker tests
        working-directory: cloudflare-workers/worksheet-assets
        run: node --test src/index.test.js

      - name: Validate Worker bundle
        working-directory: cloudflare-workers/worksheet-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        working-directory: cloudflare-workers/worksheet-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test custom domain
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/worksheet-assets-body -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://teachers.willenaenglish.com' \
              -H 'Access-Control-Request-Method: POST' \
              https://worksheet-assets.willenaenglish.com/ || true)
            if [ "$code" = "200" ]; then
              echo "Worker smoke test passed"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            cat /tmp/worksheet-assets-body || true
            sleep 10
          done
          echo "Worker smoke test failed"
          exit 1
