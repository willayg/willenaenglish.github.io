name: Patch teacher tool session bootstrap once

on:
  push:
    paths:
      - '.github/workflows/patch-teachers-whoami-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teachers
      - name: Patch tool bootstraps
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Teachers/tools/student_tracker/student_tracker.html')
          s = p.read_text()
          old = '<script src="main.js?v=20260330a"></script>'
          new = '<script type="module">import { ensureAuthRefresh, ensureTeacherSession } from "/Teachers/auth-refresh.js?v=20260817e"; ensureAuthRefresh(); await ensureTeacherSession(); await import("./main.js?v=20260817e");</script>'
          if old in s:
              p.write_text(s.replace(old, new, 1))

          p = Path('Teachers/tools/manage_students.html')
          s = p.read_text()
          old = '<script type="module" src="./manage_students.js?v=20260302c"></script>'
          new = '<script type="module">import { ensureAuthRefresh, ensureTeacherSession } from "/Teachers/auth-refresh.js?v=20260817e"; ensureAuthRefresh(); await ensureTeacherSession(); await import("./manage_students.js?v=20260817e");</script>'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/tools/student_tracker/student_tracker.html Teachers/tools/manage_students.html
          git commit -m "Wait for persistent teacher session before tool startup"
          git push origin HEAD:teachers
