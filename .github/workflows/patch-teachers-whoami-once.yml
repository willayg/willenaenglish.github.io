name: Restore Manage Students staging bootstrap once

on:
  push:
    paths:
      - '.github/workflows/patch-teachers-whoami-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teachers
          fetch-depth: 1
      - name: Restore staging Manage Students bootstrap
        run: |
          git fetch origin staging --depth=1
          git checkout origin/staging -- Teachers/tools/manage_students.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/tools/manage_students.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Match Manage Students auth bootstrap to staging"
          git push origin HEAD:teachers
