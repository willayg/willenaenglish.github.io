name: Patch legacy teacher whoami actions once

on:
  push:
    paths:
      - '.github/workflows/patch-teachers-whoami-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teachers
      - name: Patch legacy teacher auth actions
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('Teachers')
          changed = []
          if root.exists():
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                      continue
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  if 'action=whoami_teacher' in s:
                      p.write_text(s.replace('action=whoami_teacher', 'action=whoami'))
                      changed.append(str(p))

          print('Patched files:')
          for p in changed:
              print(p)
          if not changed:
              raise SystemExit('No whoami_teacher references found')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers
          git commit -m "Use standard whoami across teacher apps"
          git push origin HEAD:teachers
