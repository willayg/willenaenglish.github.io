name: Fix Daily Study worker token bridge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-worker-token-bridge-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Patch shared auth bridge and Daily Study transport
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Shared auth Worker: expose a worker token only to an already-authenticated
          # Willena browser session. Use the valid access cookie as-is; refresh only if
          # that cookie has expired and the persistent refresh cookie is valid.
          p = Path('cloudflare-workers/supabase-auth/src/index.js')
          s = p.read_text()
          marker = "      // ===== WHOAMI (verify cookie session and return user basics) =====\n"
          if "action === 'worker_token'" not in s:
              block = r'''      // ===== WORKER TOKEN BRIDGE =====
      // Daily Study's state service lives on workers.dev, which cannot receive
      // .willenaenglish.com cookies. Exchange the already-authenticated Willena
      // cookie session for the same short-lived access token. Do not rotate the
      // refresh token unless the access cookie is actually expired.
      if (action === 'worker_token' && request.method === 'GET') {
        const cookieHeader = request.headers.get('Cookie') || '';
        const cookies = parseCookies(cookieHeader);
        const accessToken = cookies['sb_access'] || '';

        if (accessToken) {
          const user = await verifyToken(env, accessToken);
          if (user) {
            return jsonResponse({ success: true, access_token: accessToken, source: 'access_cookie' }, 200, origin);
          }
        }

        const refreshToken = cookies['sb_refresh'] || '';
        if (!refreshToken) {
          return jsonResponse({ success: false, error: 'Not signed in' }, 401, origin);
        }

        try {
          const resp = await fetch(`${env.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': env.SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({ refresh_token: refreshToken }),
          });
          const data = await resp.json();
          if (!resp.ok || !data.access_token) {
            return jsonResponse({ success: false, error: 'Not signed in' }, 401, origin);
          }

          const newCookies = [
            makeCookie('sb_access', data.access_token, cookieOpts),
            makeCookie('sb_refresh', data.refresh_token || refreshToken, cookieOpts),
          ];
          return jsonResponse({ success: true, access_token: data.access_token, source: 'refresh_cookie' }, 200, origin, newCookies);
        } catch {
          return jsonResponse({ success: false, error: 'Not signed in' }, 401, origin);
        }
      }

'''
              if marker not in s:
                  raise SystemExit('supabase-auth WHOAMI marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)

          # 2) Study V2 page guard: use the same cookie auth algorithm as the rest
          # of the app. It no longer owns or intercepts Daily Study bearer tokens.
          p = Path('students/study-v2/auth-guard.js')
          p.write_text(r'''(function(){
'use strict';
var NEXT='/students/study-v2/';
var LOGIN='/students/signin.html?next='+encodeURIComponent(NEXT);

function authFetch(path,options){
  var fn=window.WillenaAPI&&typeof window.WillenaAPI.fetch==='function'?window.WillenaAPI.fetch.bind(window.WillenaAPI):window.fetch.bind(window);
  return fn(path,Object.assign({credentials:'include',cache:'no-store'},options||{}));
}
async function whoami(){
  try{
    var r=await authFetch('/.netlify/functions/supabase_auth?action=whoami&_='+Date.now());
    var d=await r.json().catch(function(){return{}});
    return !!(r.ok&&d&&d.success);
  }catch(_){return false;}
}
async function refresh(){
  try{
    var r=await authFetch('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now());
    var d=await r.json().catch(function(){return{}});
    if(!r.ok||!d||!d.success)return false;
    if(d.access_token&&window.WillenaAPI&&window.WillenaAPI.setLocalTokens){
      window.WillenaAPI.setLocalTokens(d.access_token,'');
    }
    try{window.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}
    return true;
  }catch(_){return false;}
}
async function guard(){
  if(await whoami())return true;
  if(await refresh()&&await whoami())return true;
  location.replace(LOGIN);
  return false;
}
window.WillenaStudyV2AuthReady=guard();
})();
''')

          # 3) Daily Study: keep the working algorithm/renderer, replace only token
          # acquisition. The shared auth Worker is the single place allowed to
          # recover a workers.dev bearer token.
          p = Path('students/study-v2/v2-daily.js')
          s = p.read_text()
          old = r'''async function dailyAccessToken(){
  var api=global.WillenaAPI,token='';
  try{token=text(api&&api.getLocalAccessToken?api.getLocalAccessToken():localStorage.getItem('sb_access_token'));}catch(_){token='';}
  if(token)return token;
  if(api&&typeof api.fetch==='function'){
    try{
      var r=await api.fetch('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now(),{cache:'no-store'});
      var d=await r.json().catch(function(){return{};});
      if(r.ok&&d&&d.success&&d.access_token){if(api.setLocalTokens)api.setLocalTokens(d.access_token,d.refresh_token||'');return text(d.access_token);}
    }catch(_){}
  }
  return '';
}
async function request(method,body){
  try{if(global.WillenaStudyV2AuthReady)await global.WillenaStudyV2AuthReady;}catch(_){}
  var token=await dailyAccessToken();
  var url=ENDPOINT+'?date='+encodeURIComponent(activeDate())+'&track='+encodeURIComponent(activeTrack())+'&_='+Date.now();
  var opts={method:method,credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}};
  if(token)opts.headers.Authorization='Bearer '+token;
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  var r=await fetch(url,opts),d=await r.json().catch(function(){return{};});
  if(!r.ok)throw new Error(d.error||('Daily Study request failed ('+r.status+')'));
  ingestProgress(d);
  return d;
}
'''
          new = r'''async function dailyAccessToken(forceBridge){
  var api=global.WillenaAPI,token='';
  if(!forceBridge){
    try{token=text(api&&api.getLocalAccessToken?api.getLocalAccessToken():localStorage.getItem('sb_access_token'));}catch(_){token='';}
    if(token)return token;
  }
  if(api&&typeof api.fetch==='function'){
    try{
      var r=await api.fetch('/.netlify/functions/supabase_auth?action=worker_token&_='+Date.now(),{cache:'no-store'});
      var d=await r.json().catch(function(){return{};});
      token=text(d&&d.access_token);
      if(r.ok&&d&&d.success&&token){if(api.setLocalTokens)api.setLocalTokens(token,'');return token;}
    }catch(_){}
  }
  return '';
}
async function request(method,body){
  try{if(global.WillenaStudyV2AuthReady)await global.WillenaStudyV2AuthReady;}catch(_){}
  var token=await dailyAccessToken(false);
  var url=ENDPOINT+'?date='+encodeURIComponent(activeDate())+'&track='+encodeURIComponent(activeTrack())+'&_='+Date.now();
  function optionsFor(t){
    var opts={method:method,credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}};
    if(t)opts.headers.Authorization='Bearer '+t;
    if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    return opts;
  }
  var r=await fetch(url,optionsFor(token));
  if((r.status===401||r.status===403)){
    var fresh=await dailyAccessToken(true);
    if(fresh)r=await fetch(url,optionsFor(fresh));
  }
  var d=await r.json().catch(function(){return{};});
  if(!r.ok)throw new Error(d.error||('Daily Study request failed ('+r.status+')'));
  ingestProgress(d);
  return d;
}
'''
          if old not in s:
              raise SystemExit('Daily Study auth block not found')
          p.write_text(s.replace(old,new,1))

          # 4) Force the browser to load this exact auth/transport pair.
          p = Path('students/study-v2/index.html')
          s = p.read_text()
          s = s.replace('./auth-guard.js?v=20260817-dailypersist3','./auth-guard.js?v=20260817-workerbridge1')
          s = s.replace('./v2-daily.js?v=20260817-dailypersist3','./v2-daily.js?v=20260817-workerbridge1')
          p.write_text(s)
          PY

      - name: Commit to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-workers/supabase-auth/src/index.js students/study-v2/auth-guard.js students/study-v2/v2-daily.js students/study-v2/index.html
          git diff --cached --quiet || git commit -m "Bridge persistent cookie auth to Daily Study worker"
          git push origin HEAD:staging
