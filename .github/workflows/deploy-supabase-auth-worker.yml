name: Deploy Supabase Auth Worker

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'cloudflare-workers/supabase-auth/**'
      - '.github/workflows/deploy-supabase-auth-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-auth-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Supabase auth Worker
        working-directory: cloudflare-workers/supabase-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
