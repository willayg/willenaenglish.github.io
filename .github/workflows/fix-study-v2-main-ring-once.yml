name: Fix Study V2 main ring once

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/fix-study-v2-main-ring-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix actual Concept 07 ring owner
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('students/study-v2/v2-daily-journey.css')
          s = css.read_text()
          old = '''    width:92px;\n    height:92px;\n    flex:0 0 92px;'''
          new = '''    width:150px;\n    height:150px;\n    flex:0 0 150px;'''
          if old not in s:
              raise SystemExit('main 92px ring owner not found')
          s = s.replace(old, new, 1)
          s = s.replace('    inset:11px;', '    inset:16px;', 1)
          s = s.replace('    font-size:.9rem;', '    font-size:1.25rem;', 1)
          css.write_text(s)

          idx = Path('students/study-v2/index.html')
          h = idx.read_text()
          oldv = './v2-daily-journey.css?v=20260816-concept07-ring4'
          newv = './v2-daily-journey.css?v=20260816-concept07-ring5'
          if oldv not in h:
              raise SystemExit('ring4 asset key not found')
          idx.write_text(h.replace(oldv, newv, 1))

          Path('.github/workflows/fix-study-v2-main-ring-once.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'willayg'
          git config user.email 'william.gaule@gmail.com'
          git add -A
          git commit -m 'Enlarge actual Study V2 Concept 07 progress ring owner'
          git push origin staging
