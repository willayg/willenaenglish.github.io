name: Bust admin cache once

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/bust-admin-cache-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Bump admin asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Teachers/admin/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'student-drawer.js?v=20260806e': 'student-drawer.js?v=20260806f',
            'admin-class-manager.js?v=20260806g': 'admin-class-manager.js?v=20260806h',
            'admin-class-drawer.js?v=20260806d': 'admin-class-drawer.js?v=20260806e',
            'admin-account-menu.js?v=20260806a': 'admin-account-menu.js?v=20260806b',
            'admin-form-layout.css?v=20260806d': 'admin-form-layout.css?v=20260806e',
            'student-drawer.css?v=20260806a': 'student-drawer.css?v=20260806b',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Bust admin browser cache"
          git push origin staging
