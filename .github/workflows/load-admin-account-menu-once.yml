name: Load admin account menu once

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/load-admin-account-menu-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Add account menu script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Teachers/admin/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="/Teachers/admin/admin-account-menu.js?v=20260806a"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Load admin account burger menu"
          git push origin staging
