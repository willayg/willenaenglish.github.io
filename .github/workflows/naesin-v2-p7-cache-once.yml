name: Naesin V2 P7 cache bust once
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/naesin-v2-p7-cache-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch dashboard asset revisions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Teachers/dashboard-v2/index.html')
          s=p.read_text()
          s=s.replace('20260912-r8-2','20260912-r9')
          marker='<link rel="stylesheet" href="./naesin-v2/naesin-v2-p6.css?v=20260912-r9">'
          extra='\n<link rel="stylesheet" href="./naesin-v2/naesin-v2-p7.css?v=20260912-r9">'
          if 'naesin-v2-p7.css' not in s:
              s=s.replace(marker, marker+extra)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Teachers/dashboard-v2/index.html
          git commit -m "Cache-bust Naesin V2 R9 P7 assets" || exit 0
          git push origin HEAD:staging
