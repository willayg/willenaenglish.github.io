name: Add students test prep card once
on:
  push:
    branches: [students]
    paths: ['.github/workflows/add-students-test-prep-card-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: students
      - name: Insert static test prep card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/dashboard.html')
          s = p.read_text()
          if 'id="naesinHitCard"' not in s:
              marker = 'href="/Games/english_arcade/emoji-match.html?autostart=1"'
              start = s.find(marker)
              if start < 0:
                  raise SystemExit('Mix Match link not found')
              end = s.find('</a>', start)
              if end < 0:
                  raise SystemExit('Mix Match closing tag not found')
              end += len('</a>')
              card = '''

          <a id="naesinHitCard" href="/students/test-prep-app/" class="wa-option-card" style="text-decoration:none;color:inherit;background:#343d44;border:3px solid #59d7db;border-radius:16px;padding:18px 14px;display:flex;align-items:center;justify-content:center;cursor:pointer;grid-column:span 2;min-height:96px;box-sizing:border-box;">
            <span style="font-size:1.5rem;font-weight:800;color:white;letter-spacing:.02em;text-shadow:0 0 10px rgba(89,215,219,.55);">내신 명중</span>
          </a>'''
              s = s[:end] + card + s[end:]
              p.write_text(s)
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/add-students-test-prep-card-once.yml
          git add students/dashboard.html .github/workflows/add-students-test-prep-card-once.yml
          git commit -m "Add students test prep dashboard card"
          git push
