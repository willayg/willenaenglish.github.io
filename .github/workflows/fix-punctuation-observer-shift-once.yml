name: Fix punctuation observer and shift once
on:
  push:
    branches: [students]
    paths: ['.github/workflows/fix-punctuation-observer-shift-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: students
      - name: Patch punctuation and shift
        run: |
          python - <<'PY'
          from pathlib import Path
          k=Path('students/test-prep-app/seosul-spelling-keyboard.js')
          s=k.read_text()
          a="shift.textContent=caps?'⇧ ON':'⇧'"
          b="shift.textContent='⇧'"
          if a not in s: raise SystemExit('missing shift pattern')
          k.write_text(s.replace(a,b,1))

          p=Path('students/test-prep-app/seosul-punctuation-support.js')
          s=p.read_text()
          a="const card=$('#card')||document.body;new MutationObserver(()=>queueMicrotask(installKeyboard)).observe(card,{childList:true,subtree:true});"
          b="new MutationObserver(()=>queueMicrotask(installKeyboard)).observe(document.body,{childList:true,subtree:true});"
          if a not in s: raise SystemExit('missing punctuation observer pattern')
          p.write_text(s.replace(a,b,1))

          i=Path('students/test-prep-app/index.html')
          s=i.read_text()
          s=s.replace('seosul-spelling-keyboard.js?v=20260831-tabletbig3','seosul-spelling-keyboard.js?v=20260831-shiftfix1')
          s=s.replace('seosul-punctuation-support.js?v=20260831-punct4','seosul-punctuation-support.js?v=20260831-punctfix1')
          i.write_text(s)
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-punctuation-observer-shift-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/test-prep-app/seosul-spelling-keyboard.js students/test-prep-app/seosul-punctuation-support.js students/test-prep-app/index.html .github/workflows/fix-punctuation-observer-shift-once.yml
          git commit -m "Fix punctuation keyboard observer and shift label"
          git push origin students