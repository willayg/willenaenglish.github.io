name: Fix Daily Study direct persistent auth once

# Triggered after registration so the one-off repair actually runs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-direct-persistent-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Patch Daily Study transport and persistent refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('students/study-v2/v2-daily.js')
          s=p.read_text()
          s=s.replace("var API_PATH='/.netlify/functions/daily_study_v2';",
                      "var API_PATH='https://willena-proxy.willena.workers.dev/.netlify/functions/daily_study_v2';")
          old="""async function refreshSession(){
  try{var r=await apiFetch(AUTH_PATH+'?action=refresh&_='+Date.now());var d=await r.json().catch(function(){return{}});if(!r.ok||!d||!d.success)return false;try{global.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}return true;}catch(_){return false;}
}"""
          new="""async function refreshSession(){
  try{
    var r=await apiFetch(AUTH_PATH+'?action=refresh&_='+Date.now());
    var d=await r.json().catch(function(){return{}});
    if(!r.ok||!d||!d.success)return false;
    if(d.access_token&&global.WillenaAPI&&typeof global.WillenaAPI.setLocalTokens==='function'){
      global.WillenaAPI.setLocalTokens(d.access_token,d.refresh_token||'');
    }
    try{global.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}
    return true;
  }catch(_){return false;}
}"""
          if old not in s:
              raise SystemExit('v2-daily refreshSession block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('students/study-v2/auth-guard.js')
          s=p.read_text()
          old="""async function refresh(){
  try{var r=await authFetch('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now());var d=await r.json().catch(function(){return{}});if(!r.ok||!d||!d.success)return false;try{window.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}return true;}catch(_){return false;}
}"""
          new="""async function refresh(){
  try{
    var r=await authFetch('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now());
    var d=await r.json().catch(function(){return{}});
    if(!r.ok||!d||!d.success)return false;
    if(d.access_token&&window.WillenaAPI&&typeof WillenaAPI.setLocalTokens==='function'){
      WillenaAPI.setLocalTokens(d.access_token,d.refresh_token||'');
    }
    try{window.dispatchEvent(new CustomEvent('auth:changed'));}catch(_){}
    return true;
  }catch(_){return false;}
}"""
          if old not in s:
              raise SystemExit('auth-guard refresh block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('students/study-v2/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'\./auth-guard\.js\?v=[^"\']+', './auth-guard.js?v=20260817-directpersist1', s, count=1)
          s=re.sub(r'\./v2-daily\.js\?v=[^"\']+', './v2-daily.js?v=20260817-directpersist1', s, count=1)
          p.write_text(s)
          PY

      - name: Commit to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/v2-daily.js students/study-v2/auth-guard.js students/study-v2/index.html
          git diff --cached --quiet || git commit -m "Fix Daily Study direct persistent auth"
          git pull --rebase origin staging
          git push origin HEAD:staging
