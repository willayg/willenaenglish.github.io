name: Fix Daily Study theme cache once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-theme-cache-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Bust Daily Study theme script cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('students/study-v2/index.html')
          s = p.read_text()
          old = './v2-daily-journey.js?v=20260816-spark1'
          new = './v2-daily-journey.js?v=20260819-theme1'
          if old not in s and new not in s:
              raise SystemExit('Daily Study journey script tag not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit cache bust to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/study-v2/index.html
          git diff --cached --quiet || git commit -m "Bust cache for Daily Study theme switcher"
          git push origin HEAD:staging
