name: Patch admin classes cookie domain once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/patch-admin-classes-cookie-domain-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Configure custom domain and cookie auth
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          wrangler = Path('cloudflare-workers/admin-classes/wrangler.toml')
          text = wrangler.read_text()
          route = 'routes = [{ pattern = "admin-classes-api.willenaenglish.com", custom_domain = true }]'
          if route not in text:
              wrangler.write_text(text.rstrip() + '\n\n' + route + '\n')

          worker = Path('cloudflare-workers/admin-classes/src/index.js')
          text = worker.read_text()
          start = text.index('function bearer(req) {')
          end = text.index('\n}\n\nasync function supabaseFetch', start) + 2
          replacement = '''function bearer(req) {
  const value = req.headers.get('Authorization') || '';
  if (value.startsWith('Bearer ')) return value.slice(7).trim();
  const cookie = req.headers.get('Cookie') || '';
  const match = cookie.match(/(?:^|;\\s*)sb_access=([^;]+)/);
  return match ? decodeURIComponent(match[1]) : '';
}'''
          worker.write_text(text[:start] + replacement + text[end:])

          for filename in ('admin-class-manager.js', 'admin-class-drawer.js'):
              path = Path('Teachers/admin') / filename
              text = path.read_text()
              text = text.replace('https://admin-classes.willena.workers.dev', 'https://admin-classes-api.willenaenglish.com')
              path.write_text(text)

          index = Path('Teachers/admin/index.html')
          text = index.read_text()
          text = text.replace('/Teachers/admin/admin-class-manager.js?v=20260806e', '/Teachers/admin/admin-class-manager.js?v=20260806f')
          text = text.replace('/Teachers/admin/admin-class-drawer.js?v=20260806b', '/Teachers/admin/admin-class-drawer.js?v=20260806c')
          index.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-workers/admin-classes/wrangler.toml cloudflare-workers/admin-classes/src/index.js Teachers/admin/admin-class-manager.js Teachers/admin/admin-class-drawer.js Teachers/admin/index.html
          git diff --cached --quiet || git commit -m "Authenticate admin classes Worker with Willena cookie"
          git push origin staging
