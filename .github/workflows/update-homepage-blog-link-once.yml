name: Update homepage Naver link once

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/update-homepage-blog-link-once.yml

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Connect Naver blog and keep Willena logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-v2.html')
          s = p.read_text(encoding='utf-8')
          assert 'data:image' in s, 'Expected embedded Willena logo not found'
          s = s.replace(
              '<a class="social-card naver" href="#" id="naverPlaceholder">',
              '<a class="social-card naver" href="https://blog.naver.com/willena_english" target="_blank" rel="noopener noreferrer">'
          )
          s = s.replace('<span class="pending">URL TO CONNECT</span>', '<span class="social-arrow">↗</span>')
          s = s.replace("    document.getElementById('naverPlaceholder').addEventListener('click',e=>{e.preventDefault();window.alert('Naver Blog URL만 연결하면 됩니다. 현재는 staging mockup용 자리입니다.')});\n", '')
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/update-homepage-blog-link-once.yml
      - name: Commit homepage link update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html .github/workflows/update-homepage-blog-link-once.yml
          git commit -m "Connect Naver blog on staging homepage"
          git push origin HEAD:staging
