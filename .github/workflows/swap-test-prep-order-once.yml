name: Swap test prep Communication and sentences order

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/swap-test-prep-order-once.yml'

permissions:
  contents: write

jobs:
  patch-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Patch staging order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('students/test-prep-app/student-ux-v4.js')
          s=p.read_text(encoding='utf-8')
          old=""" {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},\n {k:'communication',label:'Communication',desc:'핵심 대화 표현'},"""
          new=""" {k:'communication',label:'Communication',desc:'핵심 대화 표현'},\n {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},"""
          if old not in s:
              raise SystemExit('Expected station order not found on staging')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/swap-test-prep-order-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/test-prep-app/student-ux-v4.js .github/workflows/swap-test-prep-order-once.yml
          git commit -m "Swap Communication and 본문외우기 lesson order"
          git push origin HEAD:staging

      - name: Patch students order
        run: |
          git fetch origin students
          git checkout -B students origin/students
          python - <<'PY'
          from pathlib import Path
          p=Path('students/test-prep-app/student-ux-v4.js')
          s=p.read_text(encoding='utf-8')
          old=""" {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},\n {k:'communication',label:'Communication',desc:'핵심 대화 표현'},"""
          new=""" {k:'communication',label:'Communication',desc:'핵심 대화 표현'},\n {k:'sentences',label:'본문외우기',desc:'본문 문장 완성'},"""
          if old not in s:
              raise SystemExit('Expected station order not found on students')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git add students/test-prep-app/student-ux-v4.js
          git commit -m "Swap Communication and 본문외우기 lesson order"
          git push origin HEAD:students
