<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Willena · 보강</title><script src="/js/api-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/components/teacher-header/teacher-header.css?v=20260919-p2-3"><link rel="stylesheet" href="./makeup.css?v=5-registration"><script type="module" src="./makeup.js?v=5-registration"></script></head>
<body><script>if(new URLSearchParams(location.search).get("embedded")==="1"&&window.parent!==window)document.documentElement.classList.add("makeup-embedded");</script><div id="teacher-header"></div><div id="boot" role="status">Checking staff login… <button id="retryBoot" hidden>Retry</button></div>
<main id="app" hidden><header class="top"><div><h1>보강 <span>Makeup Classes</span></h1></div><div class="actions"><button id="refresh" class="secondary">새로고침</button><button id="add" class="secondary">+ 결석 등록</button><button id="book">+ 보강 예약</button></div></header>
<div id="summary" class="stats" aria-label="Makeup status"></div><section class="panel"><div class="toolbar"><div class="tabs" id="statusTabs" role="group" aria-label="Status"></div><input id="search" type="search" placeholder="학생 이름 검색" aria-label="Search students"></div><div id="classes" class="chips" role="group" aria-label="Classes"></div><p id="message" role="status" aria-live="polite"></p><div id="records"></div></section></main>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><div class="dialogHead"><h2 id="editorTitle">결석 등록</h2><button id="close" class="secondary" type="button" aria-label="Close">×</button></div><div class="editorBody"><div class="editorPicker"><div id="pick"><div class="pick-head"><label for="studentSearch">학생 선택</label><button id="clearSelected" type="button" class="secondary">선택 해제</button></div><input id="studentSearch" type="search" placeholder="영어 이름 / 한글 이름"><div id="pickClasses" class="chips" role="group" aria-label="반 선택"></div><div class="pick-head"><span id="pickCount"></span><button id="selectClass" type="button" class="secondary">표시된 학생 모두 선택</button></div><div id="students" class="studentList"></div></div><p id="selected" class="selected" aria-live="polite"></p><div id="selectedStudents" class="selected-students"></div></div><div class="editorDetails"><label>결석일<input id="missed" type="date" required></label><label>보강 유형</label><div id="editTypes" class="tabs" role="group" aria-label="보강 유형"></div><label>담당 교사</label><div id="teacherButtons" class="tabs" role="group" aria-label="담당 교사"></div><label>결석 사유<input id="reason" maxlength="500" placeholder="선택 사항"></label><label>상태</label><div id="editStatuses" class="tabs" role="group" aria-label="Status"></div><div id="schedule" class="schedule" hidden><label>보강일<input id="makeupDate" type="date"></label><label>시간<input id="makeupTime" type="time"></label></div><label>메모<textarea id="notes" rows="3" maxlength="1000" placeholder="보강 관련 메모"></textarea></label></div></div><div class="editorFooter"><p id="editMessage" role="status" aria-live="polite"></p><div class="actions end"><button type="button" class="secondary" id="cancel">취소</button><button type="submit" id="save">저장</button></div></div></form></dialog></body></html>
