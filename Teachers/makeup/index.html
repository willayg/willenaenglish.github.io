<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Willena · 보강</title><script src="/js/api-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/components/teacher-header/teacher-header.css?v=20260919-p2-3"><link rel="stylesheet" href="./makeup.css?v=1"><script type="module" src="./makeup.js?v=1"></script></head>
<body><div id="teacher-header"></div><div id="boot" role="status">Checking staff login… <button id="retryBoot" hidden>Retry</button></div>
<main id="app" hidden><header class="top"><div><h1>보강 <span>Makeup Classes</span></h1></div><div class="actions"><button id="refresh" class="secondary">새로고침</button><button id="add">+ 결석 등록</button></div></header>
<div id="summary" class="stats" aria-label="Makeup status"></div><section class="panel"><div class="toolbar"><div class="tabs" id="statusTabs" role="group" aria-label="Status"></div><input id="search" type="search" placeholder="학생 이름 검색" aria-label="Search students"></div><div id="classes" class="chips" role="group" aria-label="Classes"></div><p id="message" role="status" aria-live="polite"></p><div id="records"></div></section></main>
<dialog id="editor"><form id="form"><div class="dialogHead"><h2 id="editorTitle">결석 등록</h2><button id="close" class="secondary" type="button" aria-label="Close">×</button></div><div id="pick"><label for="studentSearch">학생 검색</label><input id="studentSearch" type="search" placeholder="이름 또는 반"><div id="students" class="studentList"></div></div><p id="selected" class="selected"></p><label>결석일<input id="missed" type="date" required></label><label>상태</label><div id="editStatuses" class="tabs" role="group" aria-label="Status"></div><div id="schedule" class="schedule" hidden><label>보강일<input id="makeupDate" type="date"></label><label>시간<input id="makeupTime" type="time"></label></div><label>메모<textarea id="notes" rows="3" maxlength="1000" placeholder="보강 관련 메모"></textarea></label><p id="editMessage" role="status"></p><div class="actions end"><button type="button" class="secondary" id="cancel">취소</button><button type="submit" id="save">저장</button></div></form></dialog></body></html>
