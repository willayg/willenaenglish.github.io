<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Teacher Dashboard - Willena English</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('redirect');
      const safeRedirect = requested && requested.startsWith('/') && !/^https?:/i.test(requested)
        ? requested
        : '/Teachers/index.html';
      window.location.replace('https://teachers.willenaenglish.com' + safeRedirect);
    })();
  </script>
</head>
<body>
  <p>Opening the teacher dashboard…</p>
  <p><a href="https://teachers.willenaenglish.com/Teachers/index.html">Continue</a></p>
</body>
</html>
