<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Willena Book Quiz</title>
<link rel="icon" href="/Assets/Images/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#66d6df;--cyan-strong:#25b8c4;--cyan-border:#5ed8df;--cyan-soft:#e9fbfc;--pink:#ff0a8a;--pink-dark:#e60076;--ink:#214b57;--muted:#72818e;--line:#cceff2;--paper:#fff;--good:#20966f;--bad:#c63c58;--shadow:0 22px 54px rgba(39,118,127,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,sans-serif;color:var(--ink)}body{min-height:100vh;background:linear-gradient(145deg,#73dce4 0%,#64d3dc 52%,#74d2d5 100%);overflow-x:hidden}button,select{font:inherit}.app-shell{min-height:100vh;display:flex;flex-direction:column}.app-header{min-height:72px;padding:10px 18px;background:rgba(255,255,255,.96);display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(94,216,223,.5);box-shadow:0 8px 24px rgba(39,118,127,.10);position:sticky;top:0;z-index:20}.brand-logo{height:48px;width:auto;object-fit:contain}.brand-copy{display:flex;flex-direction:column;line-height:1.15}.brand-copy strong{color:var(--cyan-strong)}.brand-copy span{font-size:12px;color:var(--muted)}.header-button{margin-left:auto;border:3px solid var(--cyan-border);background:#fff;color:var(--pink);border-radius:16px;padding:9px 15px;font-weight:800;cursor:pointer}.app-main{flex:1;display:grid;place-items:center;padding:clamp(18px,4vw,42px)}.screen{width:min(920px,100%);padding:clamp(20px,4vw,40px);background:#fff;border-radius:32px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);animation:screenIn .3s ease}@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.045em;margin:14px 0;color:var(--cyan-strong)}h2{font-size:clamp(28px,5vw,44px);line-height:1.15;letter-spacing:-.035em;margin-bottom:22px;color:var(--cyan-strong)}.lead{font-size:17px;line-height:1.65;color:var(--muted)}.eyebrow{display:inline-flex;background:var(--cyan-soft);color:var(--pink);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase}.form-grid{display:grid;gap:18px;margin-top:28px}.field label{display:block;font-size:13px;font-weight:800;color:var(--cyan-strong);margin:0 0 7px 4px}.select{width:100%;min-height:62px;padding:0 18px;border:3px solid var(--cyan-border);border-radius:18px;background:#fff;color:var(--ink);font-weight:700;outline:none}.select:focus{border-color:var(--pink)}.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.type-card{min-height:118px;padding:16px;border:3px solid var(--cyan-border);border-radius:18px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;text-align:left;box-shadow:0 10px 24px rgba(46,150,161,.08)}.type-card strong,.type-card span{display:block}.type-card strong{font-size:18px}.type-card span{margin-top:6px;font-size:12px;line-height:1.4;color:var(--muted);font-weight:600}.type-card.selected{border-color:var(--pink);background:#fff5fa}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border-radius:16px;min-height:54px;padding:0 22px;font-weight:800;cursor:pointer}.btn-primary{border:3px solid var(--cyan-border);background:#fff;color:var(--pink);box-shadow:0 12px 28px rgba(46,150,161,.14)}.btn-primary:disabled{opacity:.45;cursor:not-allowed}.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--cyan-strong)}.question-meta{display:flex;justify-content:space-between;gap:12px;color:var(--cyan-strong);font-size:13px;font-weight:800}.progress{height:11px;background:#e5f7f8;border-radius:999px;overflow:hidden;margin:12px 0 26px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan-strong),var(--pink));transition:width .35s ease}.question-card{text-align:center}.prompt{font-size:clamp(24px,4vw,38px);font-weight:700;line-height:1.35;color:var(--ink);white-space:pre-line}.prompt-note{color:var(--muted);margin-top:-8px;margin-bottom:22px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{min-height:64px;padding:12px 16px;background:#fff;border:3px solid var(--cyan-border);border-radius:18px;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 10px 22px rgba(46,150,161,.08)}.choice:hover{transform:translateY(-1px)}.choice.correct{border-color:var(--good);background:#effcf7;color:var(--good)}.choice.wrong{border-color:var(--bad);background:#fff1f4;color:var(--bad)}.choice:disabled{cursor:default}.feedback{min-height:30px;margin:18px 0 0;font-weight:800}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.scramble-answer,.scramble-bank{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;border-radius:20px;padding:16px;min-height:86px}.scramble-answer{border:3px dashed var(--cyan-border);background:var(--cyan-soft);margin-bottom:18px}.scramble-answer.has-tokens{border-style:solid;background:#fff}.scramble-bank{border:2px solid var(--line);background:#f9feff}.token{border:3px solid var(--cyan-border);background:#fff;color:var(--ink);border-radius:14px;min-height:48px;padding:8px 14px;font-size:17px;font-weight:800;cursor:pointer}.token.chosen{border-color:var(--pink);background:#fff4f9;color:var(--pink-dark)}.result-title{font-size:clamp(42px,8vw,72px);font-weight:800;color:var(--pink);margin:4px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.result-card{background:#fff;border:3px solid var(--cyan-border);border-radius:18px;padding:18px}.result-card span{display:block;color:var(--muted);font-size:13px}.result-card strong{display:block;font-size:24px;margin-top:4px;color:var(--cyan-strong)}.loading{text-align:center;padding:30px}.spinner{width:48px;height:48px;margin:0 auto 18px;border:5px solid var(--cyan-soft);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:var(--bad);font-weight:700}footer{text-align:center;padding:12px;background:rgba(255,255,255,.94);color:var(--cyan-strong);font-size:12px;border-top:1px solid rgba(94,216,223,.5)}
@media(max-width:650px){.app-header{min-height:64px;padding:8px 12px}.brand-logo{height:42px}.brand-copy span{display:none}.header-button{padding:8px 12px}.app-main{padding:12px}.screen{padding:22px 16px;border-radius:24px}.type-grid,.choices,.result-grid{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.type-card{min-height:90px}.choice{border-width:2px}.token{min-height:44px;padding:7px 11px;font-size:15px;border-width:2px}}
</style>
</head>
<body>
<div class="app-shell">
<header class="app-header">
<img src="/Assets/Images/Logo.png" alt="Willena English Academy" class="brand-logo">
<div class="brand-copy"><strong>Willena English</strong><span>Book Quiz MVP</span></div>
<button id="homeBtn" class="header-button" type="button">New Quiz</button>
</header>
<main id="app" class="app-main" aria-live="polite"></main>
<footer>Willena English · Staging curriculum quiz</footer>
</div>
<script>
const SUPABASE_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
const SUPABASE_KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
const app=document.getElementById('app');
const state={books:[],bookData:null,bookId:'',type:'vocab',questions:[],index:0,score:0,answered:false};
const clean=v=>String(v??'').trim();
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
const sample=(a,n)=>shuffle(a).slice(0,n);
const escapeHtml=s=>clean(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

async function rpc(name,body={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers,body:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw new Error(`${name} failed (${r.status})`);return r.json()}
function screen(html){app.innerHTML=`<section class="screen">${html}</section>`}
function setLoading(label='Loading book content…'){screen(`<div class="loading"><div class="spinner"></div><h3>${escapeHtml(label)}</h3></div>`)}

async function init(){setLoading('Loading books…');try{state.books=await rpc('get_quiz_books');renderSetup()}catch(e){screen(`<span class="eyebrow">Connection error</span><h2>Could not load the books</h2><p class="error">${escapeHtml(e.message)}</p><div class="actions"><button class="btn btn-primary" onclick="init()">Try again</button></div>`)}}

function renderSetup(){const groups=state.books.reduce((m,b)=>{(m[b.series_name]??=[]).push(b);return m},{});const options=Object.entries(groups).map(([series,books])=>`<optgroup label="${escapeHtml(series)}">${books.map(b=>`<option value="${b.id}" ${state.bookId===b.id?'selected':''}>${escapeHtml(b.title)} · ${b.vocab_count} words · ${b.pattern_count} patterns</option>`).join('')}</optgroup>`).join('');screen(`<span class="eyebrow">Curriculum-powered</span><h1>Book Quiz</h1><p class="lead">Choose a textbook and instantly generate a 10-question activity from the vocabulary, patterns and example sentences stored in the Willena curriculum database.</p><div class="form-grid"><div class="field"><label for="bookSelect">BOOK</label><select id="bookSelect" class="select"><option value="">Choose a book…</option>${options}</select></div><div class="field"><label>QUIZ TYPE</label><div class="type-grid"><button class="type-card ${state.type==='vocab'?'selected':''}" data-type="vocab"><strong>Vocabulary</strong><span>Korean ↔ English multiple choice</span></button><button class="type-card ${state.type==='grammar'?'selected':''}" data-type="grammar"><strong>Grammar</strong><span>Match examples to stored patterns</span></button><button class="type-card ${state.type==='unscramble'?'selected':''}" data-type="unscramble"><strong>Unscramble</strong><span>Rebuild sentences from the book</span></button></div></div></div><div class="actions"><button id="startBtn" class="btn btn-primary" disabled>Start 10 Questions</button></div>`);
const selectEl=document.getElementById('bookSelect'),start=document.getElementById('startBtn');selectEl.addEventListener('change',()=>{state.bookId=selectEl.value;start.disabled=!state.bookId});document.querySelectorAll('.type-card').forEach(btn=>btn.addEventListener('click',()=>{state.type=btn.dataset.type;document.querySelectorAll('.type-card').forEach(x=>x.classList.toggle('selected',x===btn))}));start.addEventListener('click',startQuiz)}

function uniqueBy(items,key){const seen=new Set();return items.filter(x=>{const v=clean(x[key]).toLowerCase();if(!v||seen.has(v))return false;seen.add(v);return true})}
function makeVocab(data){const pool=uniqueBy(data.vocabulary||[],'text').filter(v=>clean(v.translation_ko));if(pool.length<4)throw new Error('This book does not yet have enough translated vocabulary.');return sample(pool,Math.min(10,pool.length)).map((item,i)=>{const reverse=i%2===1;const answer=reverse?item.translation_ko:item.text;const distractors=sample(pool.filter(x=>x.id!==item.id).map(x=>reverse?x.translation_ko:x.text).filter(Boolean),3);return{kind:'choice',prompt:reverse?`What does “${item.text}” mean?`:`Choose the English word.\n${item.translation_ko}`,answer,choices:shuffle([answer,...distractors]),note:item.part_of_speech||''}})}
function makeGrammar(data){const pool=uniqueBy(data.patterns||[],'name').filter(p=>clean(p.source_text)&&clean(p.name));if(pool.length<4)throw new Error('This book does not yet have enough linked grammar patterns.');return sample(pool,Math.min(10,pool.length)).map(item=>{const distractors=sample(pool.filter(x=>x.id!==item.id).map(x=>x.name),3);return{kind:'choice',prompt:`Which pattern does this example practise?\n“${item.source_text}”`,answer:item.name,choices:shuffle([item.name,...distractors]),note:item.explanation_ko||item.grammar_category||''}})}
function tokenize(text){return clean(text).replace(/([,.!?])/g,' $1').split(/\s+/).filter(Boolean)}
function makeUnscramble(data){const pool=uniqueBy(data.sentences||[],'text').filter(s=>{const n=tokenize(s.text).length;return n>=3&&n<=14});if(pool.length<3)throw new Error('This book does not yet have enough suitable sentences.');return sample(pool,Math.min(10,pool.length)).map(item=>({kind:'unscramble',prompt:'Put the sentence in the correct order.',answer:clean(item.text),tokens:shuffle(tokenize(item.text).map((text,i)=>({id:`${i}-${text}`,text}))),note:item.translation_ko||'',chosen:[]}))}

async function startQuiz(){setLoading();try{state.bookData=await rpc('get_book_quiz_data',{p_book_id:state.bookId});if(!state.bookData?.book)throw new Error('Book not found.');state.questions=state.type==='vocab'?makeVocab(state.bookData):state.type==='grammar'?makeGrammar(state.bookData):makeUnscramble(state.bookData);state.index=0;state.score=0;state.answered=false;renderQuestion()}catch(e){screen(`<span class="eyebrow">Not enough content</span><h2>Quiz unavailable</h2><p class="error">${escapeHtml(e.message)}</p><div class="actions"><button class="btn btn-primary" onclick="renderSetup()">Choose another quiz</button></div>`)}}
function normalizedSentence(tokens){return tokens.map(t=>t.text).join(' ').replace(/\s+([,.!?])/g,'$1').replace(/\s+/g,' ').trim()}
function renderQuestion(){const q=state.questions[state.index],pct=(state.index/state.questions.length)*100;screen(`<div class="question-meta"><span>${escapeHtml(state.bookData.book.title)} · ${escapeHtml(state.type)}</span><span>${state.index+1} / ${state.questions.length}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="question-card"><div class="prompt">${escapeHtml(q.prompt)}</div>${q.note?`<p class="prompt-note">${escapeHtml(q.note)}</p>`:''}${q.kind==='choice'?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${escapeHtml(c)}</button>`).join('')}</div>`:`<div id="answerZone" class="scramble-answer"><span>Tap words below</span></div><div id="tokenBank" class="scramble-bank">${q.tokens.map((t,i)=>`<button class="token" data-token="${i}">${escapeHtml(t.text)}</button>`).join('')}</div><div class="actions"><button id="checkScramble" class="btn btn-primary" disabled>Check Answer</button><button id="clearScramble" class="btn btn-ghost">Clear</button></div>`}<div id="feedback" class="feedback"></div><div id="nextWrap" class="actions" style="justify-content:center;display:none"><button id="nextBtn" class="btn btn-primary">${state.index===state.questions.length-1?'See Result':'Next Question'}</button></div></div>`);if(q.kind==='choice')document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>answerChoice(btn)));else bindScramble(q)}
function finishAnswer(correct,message){state.answered=true;if(correct)state.score++;const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'good':'bad'}`;fb.textContent=correct?'Correct!':message;const wrap=document.getElementById('nextWrap');wrap.style.display='flex';document.getElementById('nextBtn').addEventListener('click',nextQuestion)}
function answerChoice(btn){if(state.answered)return;const q=state.questions[state.index],choice=q.choices[Number(btn.dataset.choice)],correct=choice===q.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const value=q.choices[Number(b.dataset.choice)];if(value===q.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});finishAnswer(correct,`The correct answer is: ${q.answer}`)}
function bindScramble(q){const answerZone=document.getElementById('answerZone'),check=document.getElementById('checkScramble');function draw(){answerZone.classList.toggle('has-tokens',q.chosen.length>0);answerZone.innerHTML=q.chosen.length?q.chosen.map((idx,pos)=>`<button class="token chosen" data-chosen="${pos}">${escapeHtml(q.tokens[idx].text)}</button>`).join(''):'<span>Tap words below</span>';document.querySelectorAll('[data-token]').forEach(b=>b.classList.toggle('chosen',q.chosen.includes(Number(b.dataset.token))));check.disabled=!q.chosen.length;document.querySelectorAll('[data-chosen]').forEach(b=>b.addEventListener('click',()=>{q.chosen.splice(Number(b.dataset.chosen),1);draw()}))}document.querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const idx=Number(b.dataset.token);if(!q.chosen.includes(idx)){q.chosen.push(idx);draw()}}));document.getElementById('clearScramble').addEventListener('click',()=>{q.chosen=[];draw()});check.addEventListener('click',()=>{if(state.answered)return;const built=normalizedSentence(q.chosen.map(i=>q.tokens[i]));const correct=built.toLowerCase()===q.answer.toLowerCase();document.querySelectorAll('.token').forEach(b=>b.disabled=true);check.disabled=true;finishAnswer(correct,`Correct sentence: ${q.answer}`)});draw()}
function nextQuestion(){state.index++;state.answered=false;if(state.index>=state.questions.length)renderResult();else renderQuestion()}
function renderResult(){const total=state.questions.length,pct=Math.round(state.score/total*100);screen(`<span class="eyebrow">Quiz complete</span><h2>${escapeHtml(state.bookData.book.title)}</h2><div class="result-title">${state.score} / ${total}</div><p class="lead">${pct>=90?'Excellent work!':pct>=70?'Good job — one more round will make it stick.':'This book needs another practice round.'}</p><div class="result-grid"><div class="result-card"><span>Score</span><strong>${pct}%</strong></div><div class="result-card"><span>Quiz</span><strong>${escapeHtml(state.type)}</strong></div><div class="result-card"><span>Questions</span><strong>${total}</strong></div></div><div class="actions"><button class="btn btn-primary" onclick="startQuiz()">Try Again</button><button class="btn btn-ghost" onclick="renderSetup()">Choose Another</button></div>`)}
document.getElementById('homeBtn').addEventListener('click',renderSetup);init();
</script>
</body>
</html>
