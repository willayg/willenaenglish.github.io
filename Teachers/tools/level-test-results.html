<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Level Test Results · Willena English</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#71809a;--line:#dde5f1;--bg:#f4f7fb;--brand:#5271ff;--purple:#7357e7;--green:#168a5b;--red:#c83c49;--shadow:0 18px 50px rgba(32,49,83,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:13px;padding:13px 21px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top img{width:42px;height:42px;object-fit:contain}.brand strong{display:block}.brand span{font-size:12px;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{color:#fff;background:linear-gradient(135deg,var(--brand),var(--purple))}.btn.soft{background:#edf1f7;color:#33425d}.shell{max-width:1450px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.hero h1{margin:0;font-size:30px}.hero p{margin:7px 0 0;color:var(--muted)}.stats{display:flex;gap:9px}.stat{min-width:108px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 180px 160px;gap:9px;margin-bottom:13px}.control{width:100%;height:45px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 13px;outline:none}.control:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(82,113,255,.1)}.workspace{display:grid;grid-template-columns:minmax(330px,430px) minmax(0,1fr);gap:17px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0}.list{max-height:calc(100vh - 240px);overflow:auto}.candidate{display:block;width:100%;border:0;border-bottom:1px solid #edf1f6;background:#fff;text-align:left;padding:15px 18px;cursor:pointer}.candidate:hover,.candidate.active{background:#f4f6ff}.row{display:flex;align-items:center;gap:8px}.name{font-weight:800}.badge{margin-left:auto;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge.completed{background:#dff6ec;color:#08764c}.badge.started{background:#fff0cf;color:#8b5900}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}.detail{min-height:520px}.detail-body{padding:20px}.student{display:flex;align-items:center;gap:14px;padding-bottom:17px;border-bottom:1px solid var(--line)}.avatar{width:53px;height:53px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#e9edff,#f4eaff);font-size:23px}.student h2{margin:0 0 4px}.student p{margin:0;color:var(--muted)}.attempt{margin-left:auto;min-width:190px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0}.card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fbfcff}.card strong{display:block;font-size:21px}.card span{font-size:11px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;margin:21px 0 10px}.heading h3{margin:0;font-size:15px}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.skill{border:1px solid var(--line);border-radius:13px;padding:11px}.skill-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.bar{height:7px;margin-top:9px;border-radius:99px;background:#edf1f6;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--purple))}.tabs{display:flex;padding:3px;border-radius:10px;background:#edf1f7}.tabs button{border:0;border-radius:8px;background:transparent;padding:7px 10px;font-size:12px;font-weight:700;color:#63718a;cursor:pointer}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(31,44,70,.1)}.responses{display:grid;gap:9px}.response{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;padding:14px}.response.correct{border-left-color:var(--green)}.rmeta{display:flex;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.pill{padding:3px 7px;border-radius:999px;background:#eef2f7}.prompt{margin:10px 0;font-weight:700;line-height:1.5}.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{padding:10px 11px;border-radius:10px;background:#f4f6f9;font-size:13px}.answer strong{display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;color:var(--muted)}.answer.bad{background:#fff0f1;color:#9f2632}.answer.good{background:#e8f8f0;color:#08764c}.empty,.loading{padding:40px 18px;text-align:center;color:var(--muted)}.error{margin:17px;padding:13px;border-radius:11px;background:#fff0f1;color:#a32834}.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#edf2ff,#f8f1ff)}.login-card{width:min(420px,100%);padding:27px;background:#fff;border:1px solid var(--line);border-radius:23px;box-shadow:0 25px 80px rgba(45,52,90,.18)}.login-card h1{margin:0 0 6px}.login-card p{margin:0 0 20px;color:var(--muted)}.field{display:block;margin-bottom:13px}.field span{display:block;margin-bottom:6px;font-size:12px;font-weight:700}.field input{width:100%;height:49px;border:1px solid var(--line);border-radius:11px;padding:0 12px}.login-error{min-height:20px;margin:8px 0;color:var(--red);font-size:12px}.login-card .btn{width:100%;height:49px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.list{max-height:330px}.hero{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.student{flex-wrap:wrap}.attempt{margin-left:0;width:100%}}@media(max-width:540px){.shell{padding:13px}.top{padding:10px 13px}.hero h1{font-size:24px}.stats{width:100%}.stat{flex:1;min-width:82px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.answers-grid{grid-template-columns:1fr}}
</style>
</head><body>
<div id="login" class="login hidden"><form id="loginForm" class="login-card"><h1>Level Test Admin</h1><p>Use an approved teacher or admin account.</p><label class="field"><span>Email or username</span><input id="user" autocomplete="username" required></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><div id="loginError" class="login-error"></div><button id="loginBtn" class="btn primary">Sign in</button></form></div>
<header class="top"><img src="/Assets/Images/Logo.png" alt="Willena English"><div class="brand"><strong>Level Test Results</strong><span>Prospective student assessments</span></div><div class="actions"><button id="refresh" class="btn soft">Refresh ↻</button><button id="logout" class="btn soft">Sign out</button></div></header>
<main class="shell"><section class="hero"><div><h1>Prospective Students</h1><p>Review attempts, skill results and every incorrect answer.</p></div><div class="stats"><div class="stat"><strong id="total">—</strong><span>Candidates</span></div><div class="stat"><strong id="completed">—</strong><span>Completed</span></div><div class="stat"><strong id="today">—</strong><span>Today</span></div></div></section><section class="filters"><input id="search" class="control" placeholder="Search name, school or grade"><select id="status" class="control"><option value="all">All statuses</option><option value="completed">Completed</option><option value="started">Started</option></select><select id="grade" class="control"><option value="all">All grades</option></select></section><section class="workspace"><aside class="panel"><div class="panel-head"><h2>Students</h2><span id="count"></span></div><div id="list" class="list"><div class="loading">Loading…</div></div></aside><section class="panel detail"><div id="detail"><div class="empty">Select a student to review their test.</div></div></section></section></main>
<script src="/js/api-config.js?v=20260108"></script><script>
(()=>{'use strict';
const ADMIN='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/level-test-admin',KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e',TK='willena_level_test_admin_token',RK='willena_level_test_admin_refresh';let token=localStorage.getItem(TK)||'',rows=[],selected='',data=null,mode='wrong';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?new Intl.DateTimeFormat('en-KR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(d)):'—',day=d=>new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Seoul'}).format(new Date(d));
function apiUrl(path){return window.WillenaAPI?window.WillenaAPI.getApiUrl(path):'https://api.willenaenglish.com'+path}async function auth(action,options={},params={}){const q=new URLSearchParams({action,...params});const r=await fetch(apiUrl('/.netlify/functions/supabase_auth?'+q),{credentials:'include',...options});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Sign in failed');return j}async function admin(params){const r=await fetch(ADMIN+'?'+new URLSearchParams(params),{headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store'}),j=await r.json().catch(()=>({}));if(r.status===401||r.status===403){showLogin();throw Error(j.error||'Please sign in again.')}if(!r.ok||!j.success)throw Error(j.error||'Request failed');return j}
function showLogin(msg=''){$('#login').classList.remove('hidden');$('#loginError').textContent=msg}function hideLogin(){$('#login').classList.add('hidden');$('#loginError').textContent=''}async function signIn(user,password){let email=user.trim();if(!email.includes('@'))email=(await auth('get_email_by_username',{}, {username:email})).email;const j=await auth('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});token=j.access_token||'';if(!token)throw Error('No login token received');localStorage.setItem(TK,token);if(j.refresh_token)localStorage.setItem(RK,j.refresh_token)}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginBtn');b.disabled=true;b.textContent='Signing in…';try{await signIn($('#user').value,$('#password').value);hideLogin();await load()}catch(x){showLogin(x.message)}finally{b.disabled=false;b.textContent='Sign in'}};$('#logout').onclick=async()=>{try{await auth('logout')}catch{}localStorage.removeItem(TK);localStorage.removeItem(RK);token='';showLogin()};$('#refresh').onclick=()=>load(selected);['search','status','grade'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderList));
function stats(){const today=day(new Date);$('#total').textContent=rows.length;$('#completed').textContent=rows.filter(x=>x.status==='completed').length;$('#today').textContent=rows.filter(x=>day(x.created_at)===today).length;const gs=[...new Set(rows.map(x=>x.school_grade).filter(Boolean))].sort(),old=$('#grade').value;$('#grade').innerHTML='<option value="all">All grades</option>'+gs.map(x=>'<option>'+esc(x)+'</option>').join('');if(gs.includes(old))$('#grade').value=old}function filtered(){const q=$('#search').value.trim().toLowerCase(),s=$('#status').value,g=$('#grade').value;return rows.filter(x=>(s==='all'||x.status===s)&&(g==='all'||x.school_grade===g)&&(!q||[x.student_name,x.school_name,x.school_grade].join(' ').toLowerCase().includes(q)))}
function renderList(){const r=filtered();$('#count').textContent=r.length+' shown';$('#list').innerHTML=r.length?r.map(x=>{const a=x.latest_attempt;return `<button class="candidate ${x.id===selected?'active':''}" data-id="${esc(x.id)}"><div class="row"><span class="name">${esc(x.student_name)}</span><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div><div class="meta"><span>${esc(x.school_name)}</span><span>•</span><span>${esc(x.school_grade)}</span></div><div class="meta"><span>${fmt(x.created_at)}</span>${a?`<span>• Level ${esc(a.recommended_level||'—')}</span><span>• ${esc(a.correct_count||0)}/${esc(a.total_questions||0)}</span>`:''}</div></button>`}).join(''):'<div class="empty">No matching students.</div>';document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>select(b.dataset.id))}
async function load(keep=''){try{$('#list').innerHTML='<div class="loading">Loading…</div>';const j=await admin({action:'list',limit:300});rows=j.candidates||[];stats();if(keep&&rows.some(x=>x.id===keep))selected=keep;renderList();if(selected)await select(selected);else if(rows[0])await select(rows[0].id)}catch(x){$('#list').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}async function select(id,attempt=''){selected=id;renderList();$('#detail').innerHTML='<div class="loading">Loading student results…</div>';try{data=await admin({action:'detail',candidate_id:id,...(attempt?{attempt_id:attempt}:{})});renderDetail()}catch(x){$('#detail').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
function renderDetail(){const c=data.candidate,a=data.attempt,attempts=data.attempts||[],skills=data.skills||[];if(!a){$('#detail').innerHTML=`<div class="detail-body"><div class="student"><div class="avatar">🧑‍🎓</div><div><h2>${esc(c.student_name)}</h2><p>${esc(c.school_name)} · ${esc(c.school_grade)}</p></div></div><div class="empty">Registration recorded, but no test attempt has started.</div></div>`;return}const pct=a.total_questions?Math.round(a.correct_count/a.total_questions*100):0;$('#detail').innerHTML=`<div class="detail-body"><div class="student"><div class="avatar">🧑‍🎓</div><div><h2>${esc(c.student_name)}</h2><p>${esc(c.school_name)} · ${esc(c.school_grade)}</p></div><select id="attempt" class="control attempt">${attempts.map((x,i)=>`<option value="${esc(x.id)}" ${x.id===a.id?'selected':''}>Attempt ${attempts.length-i} · ${fmt(x.created_at)}</option>`).join('')}</select></div><div class="cards"><div class="card"><strong>${esc(a.recommended_level||'—')}</strong><span>Recommended level</span></div><div class="card"><strong>${esc(a.correct_count||0)}/${esc(a.total_questions||0)}</strong><span>Correct answers</span></div><div class="card"><strong>${pct}%</strong><span>Accuracy</span></div><div class="card"><strong>${duration(a.duration_seconds)}</strong><span>Duration</span></div></div><div class="heading"><h3>Skill breakdown</h3></div><div class="skills">${skillHtml(skills)}</div><div class="heading"><h3>Question review</h3><div class="tabs"><button data-mode="wrong" class="${mode==='wrong'?'active':''}">Wrong only</button><button data-mode="all" class="${mode==='all'?'active':''}">All answers</button></div></div><div id="responses" class="responses"></div></div>`;$('#attempt').onchange=e=>select(c.id,e.target.value);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderDetail()});renderResponses()}
function skillHtml(s){return s.length?s.map(x=>{const p=Math.round(Number(x.accuracy||0)*100);return `<div class="skill"><div class="skill-top"><span>${esc(label(x.skill))}</span><span>${p}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><div class="meta">${esc(x.correct_count)} / ${esc(x.questions_answered)} correct</div></div>`}).join(''):'<div class="empty">No skill summary available.</div>'}function renderResponses(){const r=mode==='wrong'?(data.wrong_responses||[]):(data.responses||[]);$('#responses').innerHTML=r.length?r.map(x=>`<article class="response ${x.is_correct?'correct':''}"><div class="rmeta"><b>Q${esc(x.question_order)}</b><span class="pill">${esc(label(x.skill||x.question_type))}</span><span>Level ${esc(x.question_level||'—')}</span><span>· ${ms(x.response_ms)}</span></div><div class="prompt">${esc(x.prompt||'(Prompt not captured)')}</div><div class="answers-grid"><div class="answer ${x.is_correct?'':'bad'}"><strong>Student answer</strong>${esc(answer(x.selected_answer))}</div><div class="answer good"><strong>Correct answer</strong>${esc(answer(x.correct_answer))}</div></div></article>`).join(''):`<div class="empty">${mode==='wrong'?'No incorrect answers in this attempt.':'No answers recorded.'}</div>`}
function answer(v){return Array.isArray(v)?v.join(' '):v&&typeof v==='object'?JSON.stringify(v):v==null||v===''?'No answer':String(v)}function label(v){const m={vocabulary:'Vocabulary',grammar:'Grammar',grammar_error:'Grammar',question_response:'Grammar',listening:'Listening',reading:'Reading',sentence_building:'Sentence Building',sentence_unscramble:'Sentence Building'};return m[v]||String(v||'Other').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function duration(s){s=Number(s)||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function ms(v){v=Number(v)||0;return v?((v/1000).toFixed(v<10000?1:0)+'s'):'—'}
if(token)load();else showLogin();
})();
</script></body></html>
