<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Level Test Results · Willena English</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#66d7df;--cyan-dark:#25b9c5;--pink:#ff9fbd;--pink-soft:#fff0f5;--ink:#17243f;--muted:#74819b;--line:#dbe5ef;--bg:#f5fbfc;--green:#14835b;--amber:#9a6500;--red:#c63d4d;--shadow:0 18px 52px rgba(35,64,92,.11)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f3fcfd 0,#fff8fb 100%);color:var(--ink);font-family:Poppins,system-ui,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}
.app-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:13px;min-height:76px;padding:12px clamp(14px,3vw,30px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.logo{width:52px;height:52px;object-fit:contain}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px}.header-actions{margin-left:auto;display:flex;gap:8px}.btn{min-height:46px;border:0;border-radius:16px;padding:0 17px;font-weight:800;cursor:pointer;transition:transform .22s,opacity .22s,box-shadow .22s}.btn:hover{transform:translateY(-2px)}.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-dark));color:#fff;box-shadow:0 9px 22px rgba(37,185,197,.22)}.btn-soft{background:var(--pink-soft);color:#8a4561}.shell{width:min(1440px,100%);margin:auto;padding:clamp(14px,3vw,30px)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h1{font-size:clamp(27px,4vw,42px);line-height:1.12;margin:0}.hero p{color:var(--muted);margin:8px 0 0}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{min-width:108px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--cyan);border-radius:20px;padding:11px 15px;box-shadow:var(--shadow)}.stat:nth-child(2){border-top-color:var(--pink)}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:11px}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px;gap:10px;margin-bottom:15px}.control{width:100%;height:52px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 15px;color:var(--ink);outline:none}.control:focus{border-color:var(--cyan-dark);box-shadow:0 0 0 4px rgba(102,215,223,.18)}
.workspace{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#eefcfd,#fff5f8)}.card-head h2{font-size:16px;margin:0}.student-list{max-height:calc(100vh - 245px);overflow:auto}.student-row{display:block;width:100%;border:0;border-bottom:1px solid #edf2f5;background:#fff;text-align:left;padding:17px 18px;cursor:pointer;transition:background .22s,transform .22s,opacity .22s}.student-row:hover,.student-row.active{background:linear-gradient(90deg,#effcfd,#fff5f8)}.row-top{display:flex;align-items:center;gap:9px}.student-name{font-weight:800}.status{margin-left:auto;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.status.completed{background:#dcf7ec;color:var(--green)}.status.started{background:#fff0cf;color:var(--amber)}.row-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}.empty,.loading{padding:45px 20px;text-align:center;color:var(--muted)}
.detail{min-height:540px}.detail-inner{padding:clamp(16px,3vw,24px)}.student-head{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}.avatar{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#dffbfc,#ffe6ef);display:grid;place-items:center;font-size:25px}.student-head h2{margin:0 0 5px;font-size:23px}.student-head p{margin:0;color:var(--muted)}.attempt-select{margin-left:auto;min-width:205px}.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.result-box{border:1px solid var(--line);border-radius:18px;background:#fbffff;padding:14px}.result-box:nth-child(even){background:#fff8fb}.result-box strong{display:block;font-size:23px}.result-box span{color:var(--muted);font-size:11px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 11px}.section-title h3{margin:0;font-size:17px}.toggle{display:flex;background:#eef9fa;border-radius:13px;padding:3px}.toggle button{border:0;background:transparent;border-radius:10px;padding:8px 11px;color:#68758b;font-size:12px;font-weight:800;cursor:pointer}.toggle button.active{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(37,53,91,.1)}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.skill{border:1px solid var(--line);border-radius:16px;padding:13px}.skill-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.bar{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:inherit}.responses{display:grid;gap:10px}.response{border:1px solid var(--line);border-left:5px solid var(--cyan-dark);border-radius:17px;padding:15px;background:#fff}.response.wrong{border-left-color:var(--pink)}.response-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.pill{background:#eef9fa;border-radius:999px;padding:4px 7px}.question{font-weight:700;line-height:1.5;margin:11px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{border-radius:13px;padding:11px 12px;background:#f4f8fa;font-size:13px}.answer strong{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.answer.student-wrong{background:#fff0f5;color:#9e2f54}.answer.correct-answer{background:#e9fbf7;color:#08714f}.error{margin:20px;border-radius:15px;padding:14px;background:#fff0f5;color:#a4284f}.fade-in{animation:fadeIn .34s ease both}.fade-out{animation:fadeOut .2s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fadeOut{to{opacity:0;transform:translateY(-8px)}}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.student-list{max-height:330px}.hero{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.student-head{align-items:flex-start;flex-wrap:wrap}.attempt-select{margin-left:0;width:100%}}
@media(max-width:560px){.app-header{min-height:66px}.logo{width:43px;height:43px}.header-actions .text{display:none}.shell{padding:12px}.hero h1{font-size:27px}.stats{width:100%}.stat{flex:1;min-width:88px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.result-grid{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.card{border-radius:21px}.detail-inner{padding:15px}.student-list{max-height:300px}.header-actions .btn{padding:0 13px}}
</style>
</head>
<body>
<header class="app-header"><img class="logo" src="/Assets/Images/Logo.png" alt="Willena English"><div class="brand"><strong>Willena English</strong><span>Level Test Results</span></div><div class="header-actions"><button id="backBtn" class="btn btn-soft"><span class="text">Teacher App</span> ←</button><button id="refreshBtn" class="btn btn-primary"><span class="text">Refresh</span> ↻</button></div></header>
<main class="shell fade-in"><section class="hero"><div><h1>Prospective Students</h1><p>Review the same result summary, skill performance and incorrect answers.</p></div><div class="stats"><div class="stat"><strong id="totalStat">—</strong><span>Candidates</span></div><div class="stat"><strong id="completeStat">—</strong><span>Completed</span></div><div class="stat"><strong id="todayStat">—</strong><span>Today</span></div></div></section><section class="filters"><input id="searchInput" class="control" placeholder="Search name, school or grade"><select id="statusFilter" class="control"><option value="all">All statuses</option><option value="completed">Completed</option><option value="started">Started</option></select><select id="gradeFilter" class="control"><option value="all">All grades</option></select></section><section class="workspace"><aside class="card"><div class="card-head"><h2>Students</h2><span id="visibleCount"></span></div><div id="studentList" class="student-list"><div class="loading">Loading results…</div></div></aside><section class="card detail"><div id="detail"><div class="empty">Select a student to view their result.</div></div></section></section></main>
<script>
(function(){'use strict';
var ENDPOINT='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/level-test-admin',KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
var token=localStorage.getItem('sb_access_token')||localStorage.getItem('willena_level_test_admin_token')||localStorage.getItem('access_token')||'';var candidates=[],selectedId='',detailData=null,mode='wrong';
var $=function(s){return document.querySelector(s)};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(v){return v?new Intl.DateTimeFormat('en-KR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(v)):'—'}function day(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}function login(){location.replace('/Teachers/signin.html?redirect='+encodeURIComponent(location.pathname+location.search))}
async function api(params){if(!token){login();throw new Error('Teacher login required')}var r=await fetch(ENDPOINT+'?'+new URLSearchParams(params),{headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json().catch(function(){return{}});if(r.status===401||r.status===403){localStorage.removeItem('sb_access_token');login();throw new Error('Teacher login expired')}if(!r.ok||!d.success)throw new Error(d.error||'Could not load results');return d}
function swap(el,html){el.classList.add('fade-out');setTimeout(function(){el.innerHTML=html;el.classList.remove('fade-out');el.classList.add('fade-in');setTimeout(function(){el.classList.remove('fade-in')},350)},180)}
$('#backBtn').onclick=function(){location.href='/Teachers/index.html'};$('#refreshBtn').onclick=function(){loadList(selectedId)};$('#searchInput').oninput=renderList;$('#statusFilter').onchange=renderList;$('#gradeFilter').onchange=renderList;
function updateStats(){var t=day(new Date());$('#totalStat').textContent=candidates.length;$('#completeStat').textContent=candidates.filter(function(x){return x.status==='completed'}).length;$('#todayStat').textContent=candidates.filter(function(x){return day(x.created_at)===t}).length;var gs=Array.from(new Set(candidates.map(function(x){return x.school_grade}).filter(Boolean))).sort(),old=$('#gradeFilter').value;$('#gradeFilter').innerHTML='<option value="all">All grades</option>'+gs.map(function(g){return'<option value="'+esc(g)+'">'+esc(g)+'</option>'}).join('');if(gs.indexOf(old)>=0)$('#gradeFilter').value=old}
function rows(){var q=$('#searchInput').value.trim().toLowerCase(),s=$('#statusFilter').value,g=$('#gradeFilter').value;return candidates.filter(function(x){return(s==='all'||x.status===s)&&(g==='all'||x.school_grade===g)&&(!q||[x.student_name,x.school_name,x.school_grade].join(' ').toLowerCase().indexOf(q)>=0)})}
function renderList(){var a=rows();$('#visibleCount').textContent=a.length;$('#studentList').innerHTML=a.length?a.map(function(x){var r=x.latest_attempt;return'<button class="student-row '+(x.id===selectedId?'active':'')+'" data-id="'+x.id+'"><div class="row-top"><span class="student-name">'+esc(x.student_name)+'</span><span class="status '+esc(x.status)+'">'+esc(x.status)+'</span></div><div class="row-meta"><span>'+esc(x.school_name)+'</span><span>·</span><span>'+esc(x.school_grade)+'</span>'+(r?'<span>· Level '+esc(r.recommended_level||r.display_level||'—')+'</span>':'')+'</div></button>'}).join(''):'<div class="empty">No matching students.</div>';document.querySelectorAll('.student-row').forEach(function(b){b.onclick=function(){loadDetail(b.dataset.id)}})}
async function loadList(keep){try{$('#studentList').innerHTML='<div class="loading">Loading results…</div>';var d=await api({action:'list',limit:'300'});candidates=d.candidates||[];updateStats();selectedId=keep&&candidates.some(function(x){return x.id===keep})?keep:(candidates[0]&&candidates[0].id||'');renderList();if(selectedId)await loadDetail(selectedId);else $('#detail').innerHTML='<div class="empty">No test results yet.</div>'}catch(e){$('#studentList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadDetail(id,attemptId){selectedId=id;renderList();swap($('#detail'),'<div class="loading">Loading student result…</div>');try{detailData=await api({action:'detail',candidate_id:id,attempt_id:attemptId||''});renderDetail()}catch(e){swap($('#detail'),'<div class="error">'+esc(e.message)+'</div>')}}
function val(v){return Array.isArray(v)?v.join(' '):(v&&typeof v==='object'?JSON.stringify(v):String(v==null?'—':v))}
function renderDetail(){var c=detailData.candidate,a=detailData.attempt,ats=detailData.attempts||[];if(!a){swap($('#detail'),'<div class="detail-inner"><div class="student-head"><div class="avatar">👤</div><div><h2>'+esc(c.student_name)+'</h2><p>'+esc(c.school_name)+' · '+esc(c.school_grade)+'</p></div></div><div class="empty">This student has not completed a recorded attempt.</div></div>');return}var acc=a.total_questions?Math.round(a.correct_count/a.total_questions*100):0,skills=detailData.skills||[],resp=mode==='wrong'?(detailData.wrong_responses||[]):(detailData.responses||[]);var html='<div class="detail-inner"><div class="student-head"><div class="avatar">🎓</div><div><h2>'+esc(c.student_name)+'</h2><p>'+esc(c.school_name)+' · '+esc(c.school_grade)+'</p></div><select id="attemptSelect" class="control attempt-select">'+ats.map(function(x,i){return'<option value="'+x.id+'">'+(i===0?'Latest · ':'')+esc(fmt(x.completed_at||x.created_at))+'</option>'}).join('')+'</select></div><div class="result-grid"><div class="result-box"><strong>Level '+esc(a.recommended_level||a.display_level||'—')+'</strong><span>Recommended</span></div><div class="result-box"><strong>'+esc(a.correct_count||0)+' / '+esc(a.total_questions||0)+'</strong><span>Correct</span></div><div class="result-box"><strong>'+acc+'%</strong><span>Accuracy</span></div><div class="result-box"><strong>'+esc(a.duration_seconds||0)+'s</strong><span>Duration</span></div></div><div class="section-title"><h3>Skill results</h3></div><div class="skills">'+(skills.length?skills.map(function(s){var p=Math.round(Number(s.accuracy)||0);return'<div class="skill"><div class="skill-top"><span>'+esc(s.skill)+'</span><span>'+p+'%</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div></div>'}).join(''):'<div class="empty">No skill summary.</div>')+'</div><div class="section-title"><h3>Answers</h3><div class="toggle"><button data-mode="wrong" class="'+(mode==='wrong'?'active':'')+'">Wrong only</button><button data-mode="all" class="'+(mode==='all'?'active':'')+'">All</button></div></div><div class="responses">'+(resp.length?resp.map(function(r){return'<article class="response '+(r.is_correct?'':'wrong')+'"><div class="response-meta"><strong>#'+esc(r.question_order)+'</strong><span class="pill">'+esc(r.question_type||'question')+'</span><span>Level '+esc(r.question_level||'—')+'</span><span>'+esc(r.response_ms||0)+' ms</span></div><div class="question">'+esc(r.prompt||'Question text unavailable')+'</div><div class="answers"><div class="answer '+(r.is_correct?'':'student-wrong')+'"><strong>Student answer</strong>'+esc(val(r.selected_answer))+'</div><div class="answer correct-answer"><strong>Correct answer</strong>'+esc(val(r.correct_answer))+'</div></div></article>'}).join(''):'<div class="empty">No answers in this view.</div>')+'</div></div>';swap($('#detail'),html);setTimeout(function(){var s=$('#attemptSelect');if(s)s.onchange=function(){loadDetail(c.id,s.value)};document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=b.dataset.mode;renderDetail()}})},220)}
loadList();})();
</script>
</body></html>
