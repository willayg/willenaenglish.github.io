<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Level Test Results · Willena English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#5271ff;--blue2:#4564ec;--ink:#18233b;--muted:#6d7890;--line:#dfe6f2;--bg:#f7f9ff;--green:#17865d;--red:#c83d4a;--shadow:0 18px 55px rgba(37,53,91,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#fff);color:var(--ink);font-family:Poppins,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}
.app-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:13px;min-height:76px;padding:12px clamp(14px,3vw,30px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.logo{width:52px;height:52px;object-fit:contain}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px}.header-actions{margin-left:auto;display:flex;gap:8px}.btn{min-height:44px;border:0;border-radius:13px;padding:0 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.btn-soft{background:#eef2f8;color:#40506b}
.shell{width:min(1440px,100%);margin:auto;padding:clamp(16px,3vw,30px)}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0}.hero p{color:var(--muted);margin:8px 0 0}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{min-width:110px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 15px;box-shadow:0 8px 25px rgba(37,53,91,.06)}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:11px}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px;gap:10px;margin-bottom:15px}.control{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 15px;color:var(--ink);outline:none}.control:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(82,113,255,.1)}
.workspace{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}.card-head h2{font-size:16px;margin:0}.student-list{max-height:calc(100vh - 245px);overflow:auto}.student-row{display:block;width:100%;border:0;border-bottom:1px solid #edf1f7;background:#fff;text-align:left;padding:16px 18px;cursor:pointer}.student-row:hover,.student-row.active{background:#f3f5ff}.row-top{display:flex;align-items:center;gap:9px}.student-name{font-weight:800}.status{margin-left:auto;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.status.completed{background:#dff6ec;color:#08764c}.status.started{background:#fff0cf;color:#8b5900}.row-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}.empty,.loading{padding:45px 20px;text-align:center;color:var(--muted)}
.detail{min-height:540px}.detail-inner{padding:clamp(16px,3vw,24px)}.student-head{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#e9edff,#f5eaff);display:grid;place-items:center;font-size:25px}.student-head h2{margin:0 0 5px;font-size:23px}.student-head p{margin:0;color:var(--muted)}.attempt-select{margin-left:auto;min-width:205px}.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.result-box{border:1px solid var(--line);border-radius:16px;background:#fbfcff;padding:14px}.result-box strong{display:block;font-size:23px}.result-box span{color:var(--muted);font-size:11px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 11px}.section-title h3{margin:0;font-size:17px}.toggle{display:flex;background:#eef2f8;border-radius:12px;padding:3px}.toggle button{border:0;background:transparent;border-radius:9px;padding:8px 11px;color:#68758b;font-size:12px;font-weight:800;cursor:pointer}.toggle button.active{background:#fff;color:var(--ink);box-shadow:0 3px 9px rgba(37,53,91,.1)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.skill{border:1px solid var(--line);border-radius:15px;padding:13px}.skill-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.bar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:inherit}.responses{display:grid;gap:10px}.response{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:16px;padding:15px;background:#fff}.response.wrong{border-left-color:var(--red)}.response-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.pill{background:#eef2f8;border-radius:999px;padding:4px 7px}.question{font-weight:700;line-height:1.5;margin:11px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{border-radius:12px;padding:11px 12px;background:#f5f7fa;font-size:13px}.answer strong{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.answer.student-wrong{background:#fff0f1;color:#9f2632}.answer.correct-answer{background:#e8f8f0;color:#08764c}.error{margin:20px;border-radius:14px;padding:14px;background:#fff0f1;color:#a42834}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.student-list{max-height:330px}.hero{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.student-head{align-items:flex-start;flex-wrap:wrap}.attempt-select{margin-left:0;width:100%}}
@media(max-width:560px){.app-header{min-height:66px}.logo{width:44px;height:44px}.header-actions .text{display:none}.shell{padding:14px}.hero h1{font-size:28px}.stats{width:100%}.stat{flex:1;min-width:90px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.result-grid{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.card{border-radius:20px}.detail-inner{padding:16px}.student-list{max-height:300px}}
</style>
</head>
<body>
<header class="app-header">
<img class="logo" src="/Assets/Images/Logo.png" alt="Willena English">
<div class="brand"><strong>Willena English</strong><span>Level Test Results</span></div>
<div class="header-actions"><button id="backBtn" class="btn btn-soft"><span class="text">Teacher App</span> ←</button><button id="refreshBtn" class="btn btn-primary"><span class="text">Refresh</span> ↻</button></div>
</header>
<main class="shell">
<section class="hero"><div><h1>Prospective Students</h1><p>See the same result summary, skill performance and every incorrect answer.</p></div><div class="stats"><div class="stat"><strong id="totalStat">—</strong><span>Candidates</span></div><div class="stat"><strong id="completeStat">—</strong><span>Completed</span></div><div class="stat"><strong id="todayStat">—</strong><span>Today</span></div></div></section>
<section class="filters"><input id="searchInput" class="control" placeholder="Search name, school or grade"><select id="statusFilter" class="control"><option value="all">All statuses</option><option value="completed">Completed</option><option value="started">Started</option></select><select id="gradeFilter" class="control"><option value="all">All grades</option></select></section>
<section class="workspace"><aside class="card"><div class="card-head"><h2>Students</h2><span id="visibleCount"></span></div><div id="studentList" class="student-list"><div class="loading">Loading results…</div></div></aside><section class="card detail"><div id="detail"><div class="empty">Select a student to view their result.</div></div></section></section>
</main>
<script>
(function(){
'use strict';
var ENDPOINT='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/level-test-admin';
var KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
var token=localStorage.getItem('sb_access_token')||localStorage.getItem('willena_level_test_admin_token')||localStorage.getItem('access_token')||'';
var candidates=[],selectedId='',detailData=null,mode='wrong';
var $=function(s){return document.querySelector(s)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(v){return v?new Intl.DateTimeFormat('en-KR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(v)):'—'}
function todayKey(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}
function requireLogin(){var target=encodeURIComponent(location.pathname+location.search);location.replace('/Teachers/signin.html?redirect='+target)}
async function api(params){if(!token){requireLogin();throw new Error('Teacher login required')}var response=await fetch(ENDPOINT+'?'+new URLSearchParams(params),{headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store'});var data=await response.json().catch(function(){return {}});if(response.status===401||response.status===403){localStorage.removeItem('sb_access_token');requireLogin();throw new Error('Teacher login expired')}if(!response.ok||!data.success)throw new Error(data.error||'Could not load results');return data}
$('#backBtn').onclick=function(){location.href='/Teachers/index.html'};$('#refreshBtn').onclick=function(){loadList(selectedId)};$('#searchInput').oninput=renderList;$('#statusFilter').onchange=renderList;$('#gradeFilter').onchange=renderList;
function updateStats(){var today=todayKey(new Date());$('#totalStat').textContent=candidates.length;$('#completeStat').textContent=candidates.filter(function(x){return x.status==='completed'}).length;$('#todayStat').textContent=candidates.filter(function(x){return todayKey(x.created_at)===today}).length;var grades=Array.from(new Set(candidates.map(function(x){return x.school_grade}).filter(Boolean))).sort();var old=$('#gradeFilter').value;$('#gradeFilter').innerHTML='<option value="all">All grades</option>'+grades.map(function(g){return '<option value="'+esc(g)+'">'+esc(g)+'</option>'}).join('');if(grades.indexOf(old)>=0)$('#gradeFilter').value=old}
function filtered(){var q=$('#searchInput').value.trim().toLowerCase(),status=$('#statusFilter').value,grade=$('#gradeFilter').value;return candidates.filter(function(x){return(status==='all'||x.status===status)&&(grade==='all'||x.school_grade===grade)&&(!q||[x.student_name,x.school_name,x.school_grade].join(' ').toLowerCase().indexOf(q)>=0)})}
function renderList(){var rows=filtered();$('#visibleCount').textContent=rows.length;$('#studentList').innerHTML=rows.length?rows.map(function(x){var a=x.latest_attempt;return '<button class="student-row '+(x.id===selectedId?'active':'')+'" data-id="'+x.id+'"><div class="row-top"><span class="student-name">'+esc(x.student_name)+'</span><span class="status '+esc(x.status)+'">'+esc(x.status)+'</span></div><div class="row-meta"><span>'+esc(x.school_name)+'</span><span>·</span><span>'+esc(x.school_grade)+'</span>'+(a?'<span>· Level '+esc(a.recommended_level||a.display_level||'—')+'</span>':'')+'</div></button>'}).join(''):'<div class="empty">No matching students.</div>';document.querySelectorAll('.student-row').forEach(function(b){b.onclick=function(){loadDetail(b.dataset.id)}})}
async function loadList(keep){try{$('#studentList').innerHTML='<div class="loading">Loading results…</div>';var data=await api({action:'list',limit:'300'});candidates=data.candidates||[];updateStats();selectedId=keep&&candidates.some(function(x){return x.id===keep})?keep:(candidates[0]&&candidates[0].id||'');renderList();if(selectedId)await loadDetail(selectedId);else $('#detail').innerHTML='<div class="empty">No test results yet.</div>'}catch(err){$('#studentList').innerHTML='<div class="error">'+esc(err.message)+'</div>'}}
async function loadDetail(id,attemptId){selectedId=id;renderList();$('#detail').innerHTML='<div class="loading">Loading student result…</div>';try{detailData=await api({action:'detail',candidate_id:id,attempt_id:attemptId||''});renderDetail()}catch(err){$('#detail').innerHTML='<div class="error">'+esc(err.message)+'</div>'}}
function renderDetail(){var c=detailData.candidate,a=detailData.attempt,attempts=detailData.attempts||[];if(!a){$('#detail').innerHTML='<div class="detail-inner"><div class="student-head"><div class="avatar">👤</div><div><h2>'+esc(c.student_name)+'</h2><p>'+esc(c.school_name)+' · '+esc(c.school_grade)+'</p></div></div><div class="empty">This student registered but has not completed a recorded attempt.</div></div>';return}var accuracy=a.total_questions?Math.round((a.correct_count/a.total_questions)*100):0;var skills=detailData.skills||[];var responses=mode==='wrong'?(detailData.wrong_responses||[]):(detailData.responses||[]);$('#detail').innerHTML='<div class="detail-inner"><div class="student-head"><div class="avatar">🎓</div><div><h2>'+esc(c.student_name)+'</h2><p>'+esc(c.school_name)+' · '+esc(c.school_grade)+'</p></div>'+(attempts.length?'<select id="attemptSelect" class="control attempt-select">'+attempts.map(function(x,i){return '<option value="'+x.id+'" '+(x.id===a.id?'selected':'')+'>Attempt '+(attempts.length-i)+' · '+fmt(x.completed_at||x.created_at)+'</option>'}).join('')+'</select>':'')+'</div><div class="result-grid"><div class="result-box"><strong>Level '+esc(a.recommended_level||a.display_level||'—')+'</strong><span>Recommended level</span></div><div class="result-box"><strong>'+esc(a.correct_count)+' / '+esc(a.total_questions)+'</strong><span>Correct answers</span></div><div class="result-box"><strong>'+accuracy+'%</strong><span>Accuracy</span></div><div class="result-box"><strong>'+formatDuration(a.duration_seconds)+'</strong><span>Test time</span></div></div><div class="section-title"><h3>Skill Results</h3></div><div class="skills">'+(skills.length?skills.map(skillHtml).join(''):'<div class="empty">No skill summary saved.</div>')+'</div><div class="section-title"><h3>Question Review</h3><div class="toggle"><button data-mode="wrong" class="'+(mode==='wrong'?'active':'')+'">Wrong only</button><button data-mode="all" class="'+(mode==='all'?'active':'')+'">All answers</button></div></div><div class="responses">'+(responses.length?responses.map(responseHtml).join(''):'<div class="empty">No answers in this view.</div>')+'</div></div>';var select=$('#attemptSelect');if(select)select.onchange=function(){loadDetail(c.id,select.value)};document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=b.dataset.mode;renderDetail()}})}
function skillHtml(s){var pct=Math.round(Number(s.accuracy||0)*100);if(pct<=1&&Number(s.questions_answered)>0)pct=Math.round((Number(s.correct_count||0)/Number(s.questions_answered))*100);return '<div class="skill"><div class="skill-top"><span>'+esc(label(s.skill))+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div></div>'}
function responseHtml(r){var selected=Array.isArray(r.selected_answer)?r.selected_answer.join(' '):r.selected_answer;var correct=Array.isArray(r.correct_answer)?r.correct_answer.join(' '):r.correct_answer;return '<article class="response '+(r.is_correct?'':'wrong')+'"><div class="response-meta"><strong>Question '+esc(r.question_order)+'</strong><span class="pill">'+esc(label(r.question_type))+'</span><span class="pill">Level '+esc(r.question_level)+'</span>'+(r.response_ms?'<span>'+Math.round(r.response_ms/1000)+' sec</span>':'')+'</div><div class="question">'+esc(r.prompt||'Question text unavailable')+'</div><div class="answers"><div class="answer '+(r.is_correct?'':'student-wrong')+'"><strong>Student answer</strong>'+esc(selected||'No answer')+'</div><div class="answer correct-answer"><strong>Correct answer</strong>'+esc(correct||'—')+'</div></div></article>'}
function label(v){return String(v||'').replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()})}
function formatDuration(s){s=Number(s)||0;var m=Math.floor(s/60),sec=s%60;return m?m+'m '+sec+'s':sec+'s'}
loadList();
})();
</script>
</body>
</html>
