<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Level Test Results · Willena English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./level-test-results.css?v=20260802-2">
</head>
<body>
<header class="app-header">
  <img class="logo" src="/Assets/Images/Logo.png" alt="Willena English">
  <div class="brand"><strong>Willena English</strong><span>Level Test Results</span></div>
  <div class="header-actions">
    <button id="backBtn" class="btn btn-soft"><span class="text">Teacher App</span> ←</button>
    <button id="refreshBtn" class="btn btn-primary"><span class="text">Refresh</span> ↻</button>
  </div>
</header>
<main class="shell fade-in">
  <section class="hero">
    <div><h1>Prospective Students</h1><p>Open the student’s full placement report or review their individual answers.</p></div>
    <div class="stats">
      <div class="stat"><strong id="totalStat">—</strong><span>Candidates</span></div>
      <div class="stat"><strong id="completeStat">—</strong><span>Completed</span></div>
      <div class="stat"><strong id="todayStat">—</strong><span>Today</span></div>
    </div>
  </section>
  <section class="filters">
    <input id="searchInput" class="control" placeholder="Search name, school or grade">
    <select id="statusFilter" class="control"><option value="all">All statuses</option><option value="completed">Completed</option><option value="started">Started</option></select>
    <select id="gradeFilter" class="control"><option value="all">All grades</option></select>
  </section>
  <section class="workspace">
    <aside class="card"><div class="card-head"><h2>Students</h2><span id="visibleCount"></span></div><div id="studentList" class="student-list"><div class="loading">Loading results…</div></div></aside>
    <section class="card detail"><div id="detail"><div class="empty">Select a student.</div></div></section>
  </section>
</main>
<script src="./level-test-cookie-auth.js?v=20260802-2"></script>
<script src="./level-test-results.js?v=20260802-3"></script>
</body>
</html>
