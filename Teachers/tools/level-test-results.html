<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Level Test Results · Willena English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./level-test-results.css?v=20260802-3">
<style>.student-avatar{display:none!important}</style>
</head>
<body>
<div class="tool-shell">
  <header class="tool-header">
    <div class="tool-brand">
      <img src="/Assets/Images/Logo.png" alt="Willena English">
      <div><strong>Level Test Results</strong><span>Willena English</span></div>
    </div>
    <div class="tool-header-actions">
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh">↻</button>
      <button id="teacherHomeBtn" class="icon-btn" type="button" aria-label="Teacher tools">☰</button>
    </div>
  </header>

  <main class="tool-card">
    <section id="listView" class="view is-active" aria-labelledby="listTitle">
      <div class="view-heading">
        <div><p class="eyebrow">Placement tests</p><h1 id="listTitle">Students</h1></div>
        <span id="visibleCount" class="count-pill">0</span>
      </div>

      <div class="filter-bar">
        <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Search student, school or grade"></label>
        <select id="statusFilter" class="filter-select" aria-label="Status filter">
          <option value="all">All statuses</option>
          <option value="completed">Completed</option>
          <option value="started">Started</option>
        </select>
        <select id="gradeFilter" class="filter-select" aria-label="Grade filter"><option value="all">All grades</option></select>
      </div>

      <div id="studentList" class="student-grid"><div class="state-card">Loading students…</div></div>
    </section>

    <section id="answersView" class="view" aria-labelledby="answersTitle">
      <div class="answer-topbar">
        <button id="answersBackBtn" class="back-button" type="button">← Back to students</button>
        <div id="answerScore" class="score-pill"></div>
      </div>
      <div class="answer-heading">
        <p class="eyebrow">Answer review</p>
        <h1 id="answersTitle">Student answers</h1>
        <p id="answerStudentMeta"></p>
      </div>
      <div id="answerList" class="answer-list"></div>
    </section>
  </main>
</div>
<script src="./level-test-cookie-auth.js?v=20260802-3"></script>
<script src="./level-test-results.js?v=20260802-8"></script>
</body>
</html>
