<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24343a;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#31434b;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:20px}.top .meta{font-size:12px;opacity:.8}.wrap{max-width:1500px;margin:0 auto;padding:22px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi,.card{background:#fff;border:1px solid #dce9eb;border-radius:18px;box-shadow:0 6px 20px rgba(34,65,72,.06)}.kpi{padding:15px 17px}.kpi b{display:block;font-size:24px}.kpi span{display:block;margin-top:4px;color:#7b8b91;font-size:12px;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar button,.review-btn{border:1px solid #9dd7dc;background:#fff;color:#267f88;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.review-btn{padding:7px 9px;min-width:76px}.status{font-size:13px;color:#708187}.groups{display:grid;gap:16px}.card{overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #e6eff1;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h2{margin:0;font-size:20px}.sub{margin-top:5px;color:#74858b;font-size:12px;font-weight:700}.fresh{font-size:11px;font-weight:800;color:#4b777d;white-space:nowrap}.scroll{overflow-x:auto}.matrix{width:100%;min-width:1140px;border-collapse:collapse;table-layout:fixed}.matrix th,.matrix td{padding:12px 10px;border-bottom:1px solid #edf2f3;border-right:1px solid #edf2f3;text-align:center}.matrix th{background:#f7fbfb;color:#60737a;font-size:12px}.matrix th:first-child,.matrix td:first-child{width:175px;text-align:left;position:sticky;left:0;background:#fff;z-index:2}.matrix th:first-child{background:#f7fbfb;z-index:3}.student-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid #cfe1e4;background:#fff;color:#303041;font-size:15px;font-weight:900;border-radius:13px;padding:10px 12px;cursor:pointer}.student-btn:hover{border-color:#9fd9e0}.score{font-size:18px;font-weight:900}.good{color:#22937e}.mid{color:#ce9229}.low{color:#d65481}.muted{color:#9aa7ab}.small{display:block;margin-top:4px;color:#8b999e;font-size:10px;font-weight:700}.review-main{font-size:17px;font-weight:900;color:#b13d62}.loading{min-height:300px;display:grid;place-items:center;color:#708187;font-weight:800}.err{padding:28px;text-align:center;color:#b13d62;font-weight:800}.lab-tag{display:inline-flex;margin-left:8px;padding:3px 7px;border-radius:999px;background:#eef8fa;color:#278d98;border:1px solid #bfe3e8;font-size:10px;font-weight:900}.na2-detail-modal{height:min(760px,90vh);min-height:min(760px,90vh);max-height:min(760px,90vh)}.lab-note{margin-top:12px;color:#87969b;font-size:10px;text-align:right}.na2-guide-lesson-journey{min-width:0}.na2-guide-journey-stop{cursor:default}.na2-guide-journey-stop:after{display:none}.na2-grammar-row{cursor:default}.na2-grammar-row>i{display:none}.detail-loading{padding:30px;text-align:center;color:#83969c;font-size:12px;font-weight:800}@media(max-width:800px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.top{padding:13px 14px}}

<body>
<header class="top"><div><h1>Naesin Stats Lab</h1><div class="meta">Clean-room prototype · Naesin V2 visual parity · snapshot first, details on demand</div></div><div id="rev">LAB 1.05</div></header>
<main class="wrap">
<section class="summary"><div class="kpi"><b id="loadMs">—</b><span>network + DB ms</span></div><div class="kpi"><b id="groupCount">—</b><span>groups</span></div><div class="kpi"><b id="studentCount">—</b><span>student plans</span></div><div class="kpi"><b id="snapshotAge">—</b><span>oldest snapshot age</span></div></section>
<div class="toolbar"><div class="status" id="status">Loading one snapshot payload…</div><button id="reload" type="button">Refresh now</button></div>

</main>
<div class="na2-detail-bg" id="studentModal"><section class="na2-detail-modal" role="dialog" aria-modal="true"><header class="na2-detail-head"><div class="na2-detail-title"><h2 id="studentTitle">Student</h2><p id="studentSubtitle"></p></div><button class="na2-detail-close" id="studentClose" type="button">×</button></header><nav class="na2-detail-tabs" id="studentTabs"><button data-tab="lessons" class="active">레슨 진도</button><button data-tab="summary">요약</button><button data-tab="wrong">오답</button><button data-tab="activity">활동</button><button data-tab="grammar">문법 패턴</button></nav><div class="na2-detail-body" id="studentBody"></div></section></div>
<script>
(()=>{
'use strict';
const RPC='https://fiieuiktlsivwfgyivai.supabase.co/rest/v1/rpc/test_prep_teacher_dashboard_fast_v1';
const WRONG='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/test-prep-teacher-wrong-detail';
const API_KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
const AUTO_MS=20000;
const practices=[['vocabulary','단어 학습'],['vocab_test','어휘 문제'],['grammar','문법'],['sentences','본문'],['communication','의사소통'],['reading','독해'],['constructed_response','서술형']];
const labels=Object.fromEntries(practices),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>window.WillenaAPI?.getLocalAccessToken?.()||localStorage.getItem('sb_access_token')||'';
let refreshing=false,currentPayload=null,openPlanId=null,openTab='lessons';const wrongCache=new Map();
async function refreshToken(){try{const f=window.WillenaAPI?.fetch||fetch,r=await f('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now(),{credentials:'include',cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.ok&&d?.success&&d.access_token){window.WillenaAPI?.setLocalTokens?.(d.access_token,d.refresh_token||'');return d.access_token}}catch{}return''}
async function accessToken(){return token()||await refreshToken()}
function n(v){return Number.isFinite(Number(v))?Number(v):0}function pct(v){return Number.isFinite(Number(v))?Math.round(Number(v))+'%':'—'}function scoreClass(v){const x=Number(v);return !Number.isFinite(x)?'':x>=80?'score-good':x>=50?'score-mid':'score-low'}function fmtAge(iso){if(!iso)return'—';const ms=Date.now()-new Date(iso).getTime();if(ms<60000)return Math.max(0,Math.round(ms/1000))+'s';if(ms<3600000)return Math.round(ms/60000)+'m';return (ms/3600000).toFixed(1)+'h'}function fmtDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function sec(ms){const x=Number(ms);if(!Number.isFinite(x)||x<=0)return'—';return x<10000?(x/1000).toFixed(1)+'초':Math.round(x/1000)+'초'}
function skillMap(m){return new Map((m?.skills||[]).map(x=>[String(x.practice_type||''),x]))}function studentName(m){const s=m?.student||{};return s.korean_name||s.name||s.username||'Student'}function oldestIso(ms){return ms.map(m=>m.snapshot_updated_at).filter(Boolean).sort()[0]||null}function scoreHTML(v,c){return `<span class="score ${scoreClass(v)}">${pct(v)}</span><span class="small">${n(c)}문항</span>`}function reviewHTML(r={}){return `<button class="review-btn"><span class="review-main">${n(r.active)}</span><span class="small">대기 ${n(r.waiting)} · 총 ${n(r.total)}</span></button>`}
function groupCard(item){const g=item.group||{},members=item.members||[],heads=practices.map(([,l])=>`<th>${l}</th>`).join(''),rows=members.map(m=>{const map=skillMap(m),sum=m.summary||{},today=m.today||{},cells=practices.map(([k])=>`<td data-practice="${k}">${scoreHTML(map.get(k)?.recent_accuracy,map.get(k)?.recent_count)}</td>`).join('');return `<tr data-plan-id="${m.plan_id}"><td><button class="student-btn" data-student>${esc(studentName(m))}<span>›</span></button></td><td data-stat="summary">${scoreHTML(sum.recent150_accuracy,sum.recent150_count)}</td>${cells}<td data-stat="review">${reviewHTML(m.review)}</td><td data-stat="today"><span class="score">${n(today.questions)}</span><span class="small">${pct(today.accuracy)} 정확도</span></td></tr>`}).join('');return `<article class="card" data-group-id="${g.id||g.group_id||''}"><div class="head"><div><h2>${esc(g.school||'학교')}</h2><div class="sub">${esc(g.term||'')}학기 · ${esc(g.exam_type||'')} · ${esc(g.book_label||g.book_key||'')} · <span data-role="member-count">${members.length}</span>명</div></div><div class="fresh" data-role="group-age" data-iso="${oldestIso(members)||''}">snapshot ${fmtAge(oldestIso(members))} old</div></div><div class="scroll"><table class="matrix"><thead><tr><th>학생</th><th>전체 최근</th>${heads}<th>오답</th><th>오늘 활동</th></tr></thead><tbody>${rows}</tbody></table></div></article>`}
async function fetchPayload(){const t0=performance.now();let access=await accessToken();if(!access){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return null}let r=await fetch(RPC,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(r.status===401){access=await refreshToken();if(access)r=await fetch(RPC,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:'{}',cache:'no-store'})}return{r,payload:await r.json().catch(()=>({})),ms:Math.round(performance.now()-t0)}}
function updateTop(p,ms){const gs=Array.isArray(p.groups)?p.groups:[],members=gs.flatMap(g=>g.members||[]),times=members.map(m=>m.snapshot_updated_at).filter(Boolean).sort();$('#loadMs').textContent=ms;$('#groupCount').textContent=gs.length;$('#studentCount').textContent=members.length;$('#snapshotAge').dataset.iso=times[0]||'';$('#snapshotAge').textContent=fmtAge(times[0]);return{groups:gs,members}}
function findContext(pid){for(const item of currentPayload?.groups||[])for(const m of item.members||[])if(String(m.plan_id)===String(pid))return{member:m,group:item.group||{}};return null}
function kpi(value,label,sub='',cls=''){return `<div class="na2-kpi"><strong class="${cls}">${esc(value)}</strong><span>${esc(label)}</span>${sub?`<small>${esc(sub)}</small>`:''}</div>`}
function renderSummary(m){const s=m.summary||{},r=m.review||{},a=m.activity||{},map=new Map((m.skills||[]).map(x=>[x.practice_type,x])),rows=practices.map(([key,label])=>{const x=map.get(key)||{},cov=x.total?Math.round(n(x.completed)/n(x.total)*100):0;return `<div class="na2-skill-row"><div class="na2-skill-name">${label}</div><div class="na2-skill-metric"><strong class="${scoreClass(x.recent_accuracy)}">${pct(x.recent_accuracy)}</strong><small>최근 ${n(x.recent_count)}문항</small></div><div class="na2-skill-metric all"><strong class="${scoreClass(x.unique_accuracy)}">${pct(x.unique_accuracy)}</strong><small>전체 ${n(x.unique_count)}문항</small></div><div class="na2-skill-progress"><progress class="na2-skill-progressbar" max="100" value="${cov}">${cov}%</progress><small>${n(x.completed)} / ${n(x.total)}</small></div></div>`}).join('');return `<div class="na2-kpi-grid">${kpi(pct(s.recent150_accuracy),'최근 150',n(s.recent150_count)+'문항',scoreClass(s.recent150_accuracy))}${kpi(pct(s.unique_accuracy),'전체 정확도',n(s.unique_count)+'문항',scoreClass(s.unique_accuracy))}${kpi(n(r.total),'현재 오답','활성 '+n(r.active)+' · 대기 '+n(r.waiting))}${kpi(n(a.active_days),'최근 10일 학습일',n(a.total_attempts)+'회 시도')}</div><section class="na2-detail-section"><div class="na2-section-head"><h3>영역별 정확도</h3><span>최근 50 / 전체</span></div><div class="na2-skill-list">${rows}</div></section><div class="na2-last-activity">마지막 학습 <strong>${fmtDate(s.last_activity)}</strong></div>`}
function ring(v){const x=Number(v),p=Number.isFinite(x)?Math.max(0,Math.min(100,x)):0,label=Number.isFinite(x)?Math.round(x)+'%':'—';return `<span class="na2-guide-ring-block"><span class="na2-guide-ring"><svg viewBox="0 0 42 42"><circle class="na2-guide-ring-track" cx="21" cy="21" r="17"></circle><circle class="na2-guide-ring-value" cx="21" cy="21" r="17" pathLength="100" stroke-dasharray="${p} 100"></circle></svg><b class="${scoreClass(v)}">${label}</b></span><small>최근 평균</small></span>`}
function renderLessons(m){const rows=(m.lessons||[]).map(l=>{const cov=l.total?Math.round(n(l.completed)/n(l.total)*100):0,wrong=(m.review?.items||[]).filter(x=>String(x.unit_key)===String(l.lesson)).length,chips=(l.practices||[]).filter(p=>n(p.total)>0).map(p=>`<span class="na2-guide-chip">${esc(labels[p.practice_type]||p.practice_type)}</span>`).join('');return `<div class="na2-guide-journey-stop">${ring(l.recent_accuracy)}<span class="na2-guide-journey-main"><b>${esc(l.lesson||'Lesson')}</b></span><span class="na2-guide-journey-side"><span class="na2-guide-journey-metrics"><span class="na2-guide-jm total"><b class="${scoreClass(l.unique_accuracy)}">${pct(l.unique_accuracy)}</b><small>전체 평균</small></span><span class="na2-guide-jm complete"><b>${cov}%</b><small>완료율</small></span><span class="na2-guide-jm wrong"><b>${wrong}</b><small>오답*</small></span></span><span class="na2-guide-chips">${chips}</span></span></div>`}).join('');return `<div class="na2-lessons-tab"><div class="na2-lessons-head"><div><h3>레슨 진도</h3><p>현재 Naesin V2의 레슨 여정 스타일을 그대로 사용합니다.</p></div><span>최근 평균 · 완료율 · 전체 평균 · 오답</span></div><div class="na2-guide-lesson-journey">${rows||'<div class="na2-detail-empty">레슨 데이터가 없습니다.</div>'}</div><div class="lab-note">* 레슨별 오답은 현재 50개 snapshot preview 안에서 보이는 수입니다.</div></div>`}
function activityChart(days){const rows=Array.isArray(days)?days:[];if(!rows.length)return'<div class="na2-detail-empty">활동 데이터가 없습니다.</div>';const vals=rows.map(x=>n(x.attempts)),max=Math.max(1,...vals),w=760,h=210,left=34,right=18,top=24,bottom=50,pw=w-left-right,ph=h-top-bottom,pts=vals.map((v,i)=>({x:left+(rows.length===1?0:pw*i/(rows.length-1)),y:top+ph-(v/max)*ph,v})),line=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '),labelsSvg=rows.map((r,i)=>`<text x="${pts[i].x}" y="${h-14}" text-anchor="middle">${esc(String(r.date||'').slice(5))}</text>`).join(''),dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4"></circle>${p.v?`<text class="value" x="${p.x}" y="${Math.max(14,p.y-10)}" text-anchor="middle">${p.v}</text>`:''}`).join('');return `<div class="na2-chart-wrap"><svg class="na2-activity-chart" viewBox="0 0 ${w} ${h}"><line class="axis" x1="${left}" y1="${top+ph}" x2="${w-right}" y2="${top+ph}"></line><polyline points="${line}"></polyline>${dots}${labelsSvg}</svg></div>`}
function timingCards(m){const rows=(m.response_times||[]).filter(x=>x.practice_type&&x.practice_type!=='vocabulary');if(!rows.length)return'';return `<section class="na2-response-time" style="margin-top:18px"><div class="na2-section-head"><h3>문제 풀이 속도</h3><span>중앙값 · 10분 초과 제외</span></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px">${rows.map(r=>`<article style="padding:15px;border:1px solid #e2ecee;border-radius:14px;background:#fff"><div style="display:flex;justify-content:space-between;gap:12px"><b>${esc(labels[r.practice_type]||r.practice_type)}</b><strong style="font-size:23px;color:#167780">${sec(r.median_response_ms)}</strong></div><small style="display:block;margin-top:5px;color:#7a8a90">${n(r.valid_attempt_count)}문항 · 정답 ${sec(r.median_correct_ms)} · 오답 ${sec(r.median_wrong_ms)}</small><small style="display:block;margin-top:6px;color:#7a8a90">&lt;5초 ${pct(r.fast_under_5s_pct)} · &gt;60초 ${pct(r.slow_over_60s_pct)}</small></article>`).join('')}</div></section>`}
function renderActivity(m){const a=m.activity||{};return `<div class="na2-activity-kpis">${kpi(n(a.total_attempts),'최근 10일 시도')}${kpi(n(a.active_days),'학습한 날')}</div><section class="na2-detail-section"><div class="na2-section-head"><h3>최근 10일 활동</h3><span>시도 수</span></div>${activityChart(a.days)}</section>${timingCards(m)}`}
function renderGrammar(m){const rows=m.grammar_patterns||[];return `<div class="na2-grammar-head"><div><h3>문법 패턴</h3><p>최근 = 최신 50개 고유 문제 · 같은 문제는 가장 최근 답만 반영</p></div><span>${rows.length}개 패턴</span></div><div class="na2-grammar-list">${rows.map(r=>`<div class="na2-grammar-row"><span class="na2-grammar-copy"><b>${esc(String(r.target||'').replaceAll('_',' '))}</b><small>${esc(r.lesson||'')}</small></span><span class="na2-grammar-metric"><b class="${scoreClass(r.recent_accuracy)}">${pct(r.recent_accuracy)}</b><small>최근 ${n(r.recent_count)}문항</small></span><span class="na2-grammar-metric"><b class="${scoreClass(r.unique_accuracy)}">${pct(r.unique_accuracy)}</b><small>전체 ${n(r.unique_count)}문항</small></span><span class="na2-grammar-metric wrong"><b>${n(r.current_wrong)}</b><small>현재 오답</small></span><span class="na2-grammar-metric repeat"><b>${n(r.repeated_wrong)}</b><small>반복 오답</small></span><i>›</i></div>`).join('')||'<div class="na2-detail-empty">문법 패턴 데이터가 없습니다.</div>'}</div>`}
function typeKo(raw){const k=String(raw||'').toLowerCase();if(k.includes('vocab'))return'어휘 문제';if(k.includes('grammar'))return'문법';if(k.includes('commun')||k.includes('dialog'))return'의사소통';if(k.includes('read'))return'독해';if(k.includes('sentence'))return'본문';if(k.includes('construct')||k.includes('writ'))return'서술형';return'기타'}
function exactWrong(r){return `<article class="na2-exact-wrong"><div class="na2-exact-meta"><span>${esc(r.lesson||'Lesson')}</span><span>${esc(typeKo(r.question_type||r.practice_type))}</span>${n(r.wrong_count)>1?`<span class="repeat">${n(r.wrong_count)}회 오답</span>`:''}</div><p>${esc(r.prompt||'Recorded question')}</p>${r.context?`<div class="na2-exact-context">${esc(r.context)}</div>`:''}<div class="na2-answer-row"><div class="na2-answer-box"><small>학생 답</small><strong>${esc(r.selected_display||r.selected_answer||'—')}</strong></div><div class="na2-answer-box ok"><small>정답</small><strong>${esc(r.correct_display||r.correct_answer||'—')}</strong></div></div></article>`}
function renderWrongSnapshot(m){const r=m.review||{};return `<div class="na2-wrong-summary"><div class="na2-wrong-stat"><b>${n(r.total)}</b><span>현재 오답</span></div><div class="na2-wrong-stat"><b>${(r.items||[]).filter(x=>n(x.wrong_count)>1).length}</b><span>반복 오답 preview</span></div><div class="na2-wrong-stat"><b>${new Set((r.items||[]).map(x=>x.question_type)).size}</b><span>오답 유형 preview</span></div></div><div class="detail-loading">Snapshot loaded instantly. Fetching exact question detail…</div>`}
async function loadWrongDetail(m){const key=String(m.plan_id);if(wrongCache.has(key))return wrongCache.get(key);let access=await accessToken();const qs=new URLSearchParams({student_id:String(m.student_id),plan_id:String(m.plan_id),_t:String(Date.now())});const run=t=>fetch(`${WRONG}?${qs}`,{headers:{apikey:API_KEY,Authorization:'Bearer '+t},cache:'no-store'});let r=await run(access);if(r.status===401){access=await refreshToken();if(access)r=await run(access)}const d=await r.json();if(!r.ok||d?.success===false)throw new Error(d?.error||'오답 detail failed');const data={items:Array.isArray(d.items)?d.items:[]};wrongCache.set(key,data);return data}
async function paintWrong(m){const body=$('#studentBody');body.innerHTML=renderWrongSnapshot(m);try{const data=await loadWrongDetail(m);if(openTab!=='wrong'||String(openPlanId)!==String(m.plan_id))return;const items=data.items||[],repeat=items.filter(x=>n(x.wrong_count)>1).length,types=new Set(items.map(x=>x.question_type||x.practice_type)).size;body.innerHTML=`<div class="na2-wrong-summary"><div class="na2-wrong-stat"><b>${items.length}</b><span>현재 오답 detail</span></div><div class="na2-wrong-stat"><b>${repeat}</b><span>반복 오답</span></div><div class="na2-wrong-stat"><b>${types}</b><span>오답 유형</span></div></div><div class="na2-wrong-grid"><section class="na2-detail-section na2-wrong-panel"><div class="na2-section-head"><h3>오답 상태</h3><span>snapshot counts</span></div><div class="na2-wrong-type-list"><div class="na2-wrong-type-row"><div class="na2-wrong-type-label"><span class="kr">활성</span><span class="en">active</span></div><progress class="na2-wrong-type-progress" max="${Math.max(1,n(m.review?.total))}" value="${n(m.review?.active)}"></progress><b>${n(m.review?.active)}</b></div><div class="na2-wrong-type-row"><div class="na2-wrong-type-label"><span class="kr">대기</span><span class="en">waiting</span></div><progress class="na2-wrong-type-progress" max="${Math.max(1,n(m.review?.total))}" value="${n(m.review?.waiting)}"></progress><b>${n(m.review?.waiting)}</b></div></div></section><section class="na2-detail-section na2-wrong-panel"><div class="na2-section-head"><h3>정확한 오답 문제</h3><span>${items.length}문항 · on demand</span></div><div class="na2-exact-wrongs">${items.map(exactWrong).join('')||'<div class="na2-detail-empty">현재 남아 있는 오답이 없습니다.</div>'}</div></section></div>`}catch(e){body.innerHTML=renderWrongSnapshot(m)+`<div class="na2-detail-error"><b>오답 detail을 불러오지 못했습니다.</b><span>${esc(e.message)}</span></div>`}}
function renderModal(){const ctx=findContext(openPlanId);if(!ctx)return;const m=ctx.member,g=ctx.group;$('#studentTitle').textContent=studentName(m);$('#studentSubtitle').innerHTML=`${esc(g.school||'')} · ${esc(g.term||'')}학기 · ${esc(g.book_label||g.book_key||'')} <span class="lab-tag">snapshot ${fmtAge(m.snapshot_updated_at)} · ${esc(m.snapshot_version||'')}</span>`;$('#studentTabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===openTab));if(openTab==='wrong'){paintWrong(m);return}$('#studentBody').innerHTML=openTab==='summary'?renderSummary(m):openTab==='activity'?renderActivity(m):openTab==='grammar'?renderGrammar(m):renderLessons(m)}
function openStudent(pid,tab='lessons'){openPlanId=String(pid);openTab=tab;$('#studentModal').classList.add('open');document.body.classList.add('na2-modal-open');renderModal()}function closeStudent(){openPlanId=null;$('#studentModal').classList.remove('open');document.body.classList.remove('na2-modal-open')}
function bind(){document.querySelectorAll('[data-student]').forEach(b=>b.onclick=e=>openStudent(e.currentTarget.closest('tr').dataset.planId,'lessons'));document.querySelectorAll('[data-stat="review"] .review-btn').forEach(b=>b.onclick=e=>openStudent(e.currentTarget.closest('tr').dataset.planId,'wrong'))}
function sameShape(gs){const rows=[...document.querySelectorAll('tr[data-plan-id]')],incoming=gs.flatMap(g=>g.members||[]);return rows.length===incoming.length&&incoming.every(m=>rows.some(r=>r.dataset.planId===String(m.plan_id)))}
function updateNumbers(gs){for(const item of gs){const members=item.members||[];for(const m of members){const row=[...document.querySelectorAll('tr[data-plan-id]')].find(r=>r.dataset.planId===String(m.plan_id));if(!row)continue;const map=skillMap(m),sum=m.summary||{},today=m.today||{};row.querySelector('[data-stat="summary"]').innerHTML=scoreHTML(sum.recent150_accuracy,sum.recent150_count);for(const[k]of practices)row.querySelector(`[data-practice="${k}"]`).innerHTML=scoreHTML(map.get(k)?.recent_accuracy,map.get(k)?.recent_count);row.querySelector('[data-stat="review"]').innerHTML=reviewHTML(m.review);row.querySelector('[data-stat="today"]').innerHTML=`<span class="score">${n(today.questions)}</span><span class="small">${pct(today.accuracy)} 정확도</span>`}}bind();if(openPlanId)renderModal()}
function renderFull(p,ms){currentPayload=p;const {groups,members}=updateTop(p,ms);$('#groups').innerHTML=groups.map(groupCard).join('')||'<div class="card loading">No active groups.</div>';bind();$('#status').textContent=`Loaded ${groups.length} groups / ${members.length} plans. Snapshot refresh every 20 seconds.`}
async function initialLoad(){const x=await fetchPayload();if(!x)return;if(!x.r.ok){$('#groups').innerHTML=`<div class="card err">${esc(x.payload.error||'Request failed')}</div>`;return}renderFull(x.payload,x.ms)}
async function refreshNumbers(manual=false){if(refreshing)return;refreshing=true;try{if(manual)$('#status').textContent='Refreshing…';const x=await fetchPayload();if(!x||!x.r.ok)return;currentPayload=x.payload;const {groups,members}=updateTop(x.payload,x.ms);if(!sameShape(groups)){renderFull(x.payload,x.ms);return}updateNumbers(groups);$('#status').textContent=`Numbers refreshed · ${groups.length} groups / ${members.length} plans · ${x.ms} ms`}finally{refreshing=false}}
function tick(){const top=$('#snapshotAge');if(top?.dataset.iso)top.textContent=fmtAge(top.dataset.iso);if(openPlanId){const ctx=findContext(openPlanId),tag=$('#studentSubtitle .lab-tag');if(ctx&&tag)tag.textContent=`snapshot ${fmtAge(ctx.member.snapshot_updated_at)} · ${ctx.member.snapshot_version||''}`}}
$('#reload').onclick=()=>refreshNumbers(true);$('#studentClose').onclick=closeStudent;$('#studentModal').onclick=e=>{if(e.target===$('#studentModal'))closeStudent()};$('#studentTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b||!openPlanId)return;openTab=b.dataset.tab;renderModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStudent()});initialLoad();setInterval(()=>refreshNumbers(false),AUTO_MS);setInterval(tick,1000);
})();
</script>
</body>
