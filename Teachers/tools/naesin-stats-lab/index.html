<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24343a;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#31434b;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:20px}.top .meta{font-size:12px;opacity:.8}.wrap{max-width:1500px;margin:0 auto;padding:22px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi,.card{background:#fff;border:1px solid #dce9eb;border-radius:18px;box-shadow:0 6px 20px rgba(34,65,72,.06)}.kpi{padding:15px 17px}.kpi b{display:block;font-size:24px}.kpi span{display:block;margin-top:4px;color:#7b8b91;font-size:12px;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar button,.review-btn{border:1px solid #9dd7dc;background:#fff;color:#267f88;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.review-btn{padding:7px 9px;min-width:76px}.status{font-size:13px;color:#708187}.groups{display:grid;gap:16px}.card{overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #e6eff1;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h2{margin:0;font-size:20px}.sub{margin-top:5px;color:#74858b;font-size:12px;font-weight:700}.fresh{font-size:11px;font-weight:800;color:#4b777d;white-space:nowrap}.scroll{overflow-x:auto}.matrix{width:100%;min-width:1140px;border-collapse:collapse;table-layout:fixed}.matrix th,.matrix td{padding:12px 10px;border-bottom:1px solid #edf2f3;border-right:1px solid #edf2f3;text-align:center}.matrix th{background:#f7fbfb;color:#60737a;font-size:12px}.matrix th:first-child,.matrix td:first-child{width:175px;text-align:left;position:sticky;left:0;background:#fff;z-index:2}.matrix th:first-child{background:#f7fbfb;z-index:3}.student-btn{border:0;background:transparent;padding:0;color:#24343a;font:inherit;font-weight:850;cursor:pointer;text-align:left}.student-btn:hover{text-decoration:underline;color:#267f88}.score{font-size:18px;font-weight:900}.good{color:#22937e}.mid{color:#ce9229}.low{color:#d65481}.muted{color:#9aa7ab}.small{display:block;margin-top:4px;color:#8b999e;font-size:10px;font-weight:700}.review-main{font-size:17px;font-weight:900;color:#b13d62}.loading{min-height:300px;display:grid;place-items:center;color:#708187;font-weight:800}.err{padding:28px;text-align:center;color:#b13d62;font-weight:800}
.modal-bg{display:none;position:fixed;inset:0;z-index:50;background:rgba(24,39,46,.56);padding:18px;align-items:center;justify-content:center}.modal-bg.open{display:flex}.student-modal{width:min(1120px,100%);max-height:92vh;overflow:hidden;background:#f7fafb;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.24);display:flex;flex-direction:column}.modal-head{display:flex;justify-content:space-between;gap:12px;padding:18px 22px;background:#fff;border-bottom:1px solid #e6eff1}.modal-head h3{margin:0;font-size:22px}.close{border:0;background:transparent;font-size:28px;cursor:pointer;color:#60737a}.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #e6eff1}.tabs button{border:1px solid #dce8ea;background:#fff;color:#60737a;border-radius:999px;padding:8px 12px;font-weight:850;white-space:nowrap;cursor:pointer}.tabs button.active{background:#31434b;color:#fff;border-color:#31434b}.student-body{padding:18px 20px 24px;overflow:auto}.detail-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.detail-kpi{background:#fff;border:1px solid #dfeaec;border-radius:15px;padding:14px}.detail-kpi b{display:block;font-size:24px}.detail-kpi span{display:block;color:#73858b;font-size:11px;font-weight:850;margin-top:4px}.detail-kpi small{display:block;color:#95a2a6;font-size:10px;margin-top:4px}.section{background:#fff;border:1px solid #dfeaec;border-radius:17px;padding:16px;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.section-head h4{margin:0;font-size:17px}.section-head span{color:#829198;font-size:11px;font-weight:800}.skill-list,.lesson-list,.pattern-list,.review-list,.timing-grid{display:grid;gap:8px}.skill-row,.lesson-row,.pattern-row,.review-item,.timing-card,.day-card{border:1px solid #e5edef;border-radius:12px;background:#fbfdfd;padding:11px 12px}.skill-row{display:grid;grid-template-columns:145px repeat(3,minmax(0,1fr));gap:10px;align-items:center}.skill-row strong,.lesson-row strong,.pattern-row strong{font-size:13px}.metric b{font-size:16px}.metric small{display:block;font-size:10px;color:#89979c;margin-top:2px}.progress{height:7px;background:#e8eff0;border-radius:99px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:#60aeb4;border-radius:inherit}.lesson-row summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(3,minmax(0,1fr));gap:10px;align-items:center}.lesson-row summary::-webkit-details-marker{display:none}.practice-list{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #e7eff0}.practice-row{display:grid;grid-template-columns:145px repeat(3,minmax(0,1fr));gap:10px;align-items:center;font-size:12px}.activity-days{display:grid;grid-template-columns:repeat(10,minmax(70px,1fr));gap:7px;overflow-x:auto}.day-card{text-align:center;padding:10px 7px}.day-card b{font-size:16px}.day-card span,.day-card small{display:block;font-size:9px;color:#819097;margin-top:3px}.timing-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.timing-card .timing-top{display:flex;justify-content:space-between;gap:10px}.timing-card .timing-top b:last-child{font-size:20px;color:#267f88}.timing-card small{color:#7d8d92}.timing-split{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:#708187}.pattern-row{display:grid;grid-template-columns:minmax(170px,1.5fr) repeat(4,minmax(0,.7fr));gap:10px;align-items:center}.pattern-name small{display:block;color:#89979c;margin-top:3px}.review-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.review-kpi{border:1px solid #e0ebed;border-radius:14px;padding:12px;background:#fff}.review-kpi b{font-size:22px}.review-kpi span{display:block;color:#7a8a90;font-size:11px;font-weight:800;margin-top:3px}.review-note{font-size:12px;color:#72838a;margin:0 0 12px}.review-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.review-item b{font-size:13px}.review-item small{display:block;color:#7a8a90;margin-top:3px}.pill{align-self:start;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#eef5f6;color:#4c7076}.pill.wait{background:#fff5dc;color:#976d14}.empty{padding:20px;text-align:center;color:#839298}.snapshot-tag{font-size:10px;font-weight:850;color:#4f777d}.last-line{margin-top:12px;color:#7c8c91;font-size:11px}
@media(max-width:900px){.detail-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.skill-row,.practice-row{grid-template-columns:120px repeat(3,minmax(85px,1fr))}.pattern-row{grid-template-columns:minmax(140px,1.3fr) repeat(4,minmax(75px,.7fr))}.student-body{padding:14px}.timing-grid{grid-template-columns:1fr}}@media(max-width:800px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.top{padding:13px 14px}.review-kpis{grid-template-columns:repeat(2,1fr)}.modal-bg{padding:0}.student-modal{max-height:100vh;height:100%;border-radius:0}.skill-list,.lesson-list,.pattern-list{overflow-x:auto}.skill-row,.practice-row,.pattern-row,.lesson-row summary{min-width:650px}}
</style>
</head>
<body>
<header class="top"><div><h1>Naesin Stats Lab</h1><div class="meta">Clean-room prototype · one authenticated request · snapshot-backed student modal</div></div><div id="rev">LAB 1.04</div></header>
<main class="wrap">
<section class="summary"><div class="kpi"><b id="loadMs">—</b><span>network + DB ms</span></div><div class="kpi"><b id="groupCount">—</b><span>groups</span></div><div class="kpi"><b id="studentCount">—</b><span>student plans</span></div><div class="kpi"><b id="snapshotAge">—</b><span>oldest snapshot age</span></div></section>
<div class="toolbar"><div class="status" id="status">Loading one snapshot payload…</div><button id="reload" type="button">Refresh now</button></div>
<section class="groups" id="groups"><div class="card loading">Loading all groups together…</div></section>
</main>
<div class="modal-bg" id="studentModal"><section class="student-modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3 id="studentTitle">Student</h3><div class="sub" id="studentSubtitle"></div></div><button class="close" id="studentClose" type="button">×</button></div><nav class="tabs" id="studentTabs"><button data-tab="lessons" class="active">레슨 진도</button><button data-tab="summary">요약</button><button data-tab="wrong">오답</button><button data-tab="activity">활동</button><button data-tab="grammar">문법 패턴</button></nav><div class="student-body" id="studentBody"></div></section></div>
<script>
(()=>{
'use strict';
const RPC='https://fiieuiktlsivwfgyivai.supabase.co/rest/v1/rpc/test_prep_teacher_dashboard_fast_v1';
const API_KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
const AUTO_MS=20000;
const practices=[['vocabulary','단어 학습'],['vocab_test','어휘 문제'],['grammar','문법'],['sentences','본문'],['communication','의사소통'],['reading','독해'],['constructed_response','서술형']];
const practiceLabels=Object.fromEntries(practices);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>window.WillenaAPI?.getLocalAccessToken?.()||localStorage.getItem('sb_access_token')||'';
let refreshing=false,currentPayload=null,openStudentPlanId=null,openTab='lessons';
async function refreshToken(){try{const f=window.WillenaAPI?.fetch||fetch;const r=await f('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now(),{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.ok&&d?.success&&d.access_token){window.WillenaAPI?.setLocalTokens?.(d.access_token,d.refresh_token||'');return d.access_token}}catch{}return''}
async function accessToken(){return token()||await refreshToken()}
function scoreClass(n){n=Number(n);return !Number.isFinite(n)?'muted':n>=80?'good':n>=50?'mid':'low'}
function pct(n){return Number.isFinite(Number(n))?Math.round(Number(n))+'%':'—'}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function sec(ms){const x=Number(ms);if(!Number.isFinite(x)||x<=0)return'—';const s=x/1000;return s<10?s.toFixed(1)+'s':Math.round(s)+'s'}
function skillMap(m){return new Map((m?.skills||[]).map(x=>[String(x.practice_type||''),x]))}
function fmtAge(iso){if(!iso)return'—';const ms=Date.now()-new Date(iso).getTime();if(ms<60000)return Math.max(0,Math.round(ms/1000))+'s';if(ms<3600000)return Math.round(ms/60000)+'m';return (ms/3600000).toFixed(1)+'h'}
function fmtDate(iso){if(!iso)return'—';const d=new Date(iso);return Number.isNaN(d.getTime())?'—':d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function oldestIso(members){return members.map(m=>m.snapshot_updated_at).filter(Boolean).sort()[0]||null}
function scoreHTML(value,count){return `<span class="score ${scoreClass(value)}">${pct(value)}</span><span class="small">${n(count)}문항</span>`}
function reviewHTML(review={}){return `<button class="review-btn" type="button"><span class="review-main">${n(review.active)}</span><span class="small">대기 ${n(review.waiting)} · 총 ${n(review.total)}</span></button>`}
function studentName(m){const s=m?.student||{};return s.korean_name||s.name||s.username||'Student'}
function groupCard(item){const g=item.group||{},members=item.members||[];const headers=practices.map(([,l])=>`<th>${esc(l)}</th>`).join('');const rows=members.map(m=>{const map=skillMap(m),sum=m.summary||{},today=m.today||{};const cells=practices.map(([k])=>{const x=map.get(k);return `<td data-practice="${esc(k)}">${scoreHTML(x?.recent_accuracy,x?.recent_count)}</td>`}).join('');return `<tr data-plan-id="${esc(m.plan_id)}"><td><button class="student-btn" type="button" data-student>${esc(studentName(m))} ›</button></td><td data-stat="summary">${scoreHTML(sum.recent150_accuracy,sum.recent150_count)}</td>${cells}<td data-stat="review">${reviewHTML(m.review)}</td><td data-stat="today"><span class="score">${n(today.questions)}</span><span class="small">${pct(today.accuracy)} 정확도</span></td></tr>`}).join('');return `<article class="card" data-group-id="${esc(g.id||g.group_id||'')}"><div class="head"><div><h2>${esc(g.school||'학교')}</h2><div class="sub">${esc(g.term||'')}학기 · ${esc(g.exam_type||'')} · ${esc(g.book_label||g.book_key||'')} · <span data-role="member-count">${members.length}</span>명</div></div><div class="fresh" data-role="group-age" data-iso="${esc(oldestIso(members)||'')}">snapshot ${fmtAge(oldestIso(members))} old</div></div><div class="scroll"><table class="matrix"><thead><tr><th>학생</th><th>전체 최근</th>${headers}<th>오답</th><th>오늘 활동</th></tr></thead><tbody>${rows||'<tr><td colspan="11">No students</td></tr>'}</tbody></table></div></article>`}
async function fetchPayload(){const t0=performance.now();let access=await accessToken();if(!access){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return null}let r=await fetch(RPC,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:'{}',cache:'no-store',credentials:'omit'});if(r.status===401){access=await refreshToken();if(access)r=await fetch(RPC,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:'{}',cache:'no-store',credentials:'omit'})}const payload=await r.json().catch(()=>({}));return {r,payload,ms:Math.round(performance.now()-t0)}}
function updateTop(payload,ms){const groups=Array.isArray(payload.groups)?payload.groups:[];const members=groups.flatMap(g=>g.members||[]);const times=members.map(m=>m.snapshot_updated_at).filter(Boolean).sort();$('#loadMs').textContent=ms;$('#groupCount').textContent=groups.length;$('#studentCount').textContent=members.length;$('#snapshotAge').dataset.iso=times[0]||'';$('#snapshotAge').textContent=fmtAge(times[0]);return {groups,members}}
function sameShape(groups){const rows=[...document.querySelectorAll('tr[data-plan-id]')];const incoming=groups.flatMap(g=>g.members||[]);if(rows.length!==incoming.length)return false;const ids=new Set(rows.map(r=>r.dataset.planId));return incoming.every(m=>ids.has(String(m.plan_id)))}
function findMemberContext(planId){for(const item of currentPayload?.groups||[]){for(const m of item.members||[]){if(String(m.plan_id)===String(planId))return{member:m,group:item.group||{}}}}return null}
function metric(value,label,sub='',cls=''){return `<div class="detail-kpi"><b class="${cls}">${esc(value)}</b><span>${esc(label)}</span>${sub?`<small>${esc(sub)}</small>`:''}</div>`}
function progress(completed,total){const c=n(completed),t=n(total),p=t?Math.max(0,Math.min(100,Math.round(c/t*100))):0;return `<div class="metric"><b>${p}%</b><small>${c} / ${t}</small><div class="progress"><i style="width:${p}%"></i></div></div>`}
function renderSummary(m){const s=m.summary||{},r=m.review||{},a=m.activity||{},skills=Array.isArray(m.skills)?m.skills:[];const rows=skills.map(x=>`<div class="skill-row"><strong>${esc(practiceLabels[x.practice_type]||x.practice_type||'기타')}</strong><div class="metric"><b class="${scoreClass(x.recent_accuracy)}">${pct(x.recent_accuracy)}</b><small>최근 ${n(x.recent_count)}문항</small></div><div class="metric"><b class="${scoreClass(x.unique_accuracy)}">${pct(x.unique_accuracy)}</b><small>전체 ${n(x.unique_count)}문항</small></div>${progress(x.completed,x.total)}</div>`).join('');return `<div class="detail-kpis">${metric(pct(s.recent150_accuracy),'최근 150',n(s.recent150_count)+'문항',scoreClass(s.recent150_accuracy))}${metric(pct(s.unique_accuracy),'전체 정확도',n(s.unique_count)+'문항',scoreClass(s.unique_accuracy))}${metric(n(r.total),'현재 오답','활성 '+n(r.active)+' · 대기 '+n(r.waiting))}${metric(n(a.active_days),'최근 10일 학습일',n(a.total_attempts)+'회 시도')}</div><section class="section"><div class="section-head"><h4>영역별 정확도</h4><span>최근 / 전체 / 완료율</span></div><div class="skill-list">${rows||'<div class="empty">영역 데이터가 없습니다.</div>'}</div></section><div class="last-line">마지막 학습 ${esc(fmtDate(s.last_activity))}</div>`}
function renderLessons(m){const lessons=Array.isArray(m.lessons)?m.lessons:[];const rows=lessons.map(l=>{const ps=Array.isArray(l.practices)?l.practices:[];const pRows=ps.map(p=>`<div class="practice-row"><strong>${esc(practiceLabels[p.practice_type]||p.practice_type||'기타')}</strong><div class="metric"><b class="${scoreClass(p.recent_accuracy)}">${pct(p.recent_accuracy)}</b><small>최근 ${n(p.recent_count)}문항</small></div><div class="metric"><b class="${scoreClass(p.unique_accuracy)}">${pct(p.unique_accuracy)}</b><small>전체 ${n(p.unique_count)}문항</small></div>${progress(p.completed,p.total)}</div>`).join('');return `<details class="lesson-row"><summary><strong>${esc(l.lesson||'Lesson')}</strong><div class="metric"><b class="${scoreClass(l.recent_accuracy)}">${pct(l.recent_accuracy)}</b><small>최근 ${n(l.recent_count)}문항</small></div><div class="metric"><b class="${scoreClass(l.unique_accuracy)}">${pct(l.unique_accuracy)}</b><small>전체 정확도</small></div>${progress(l.completed,l.total)}</summary><div class="practice-list">${pRows||'<div class="empty">영역 데이터가 없습니다.</div>'}</div></details>`}).join('');return `<section class="section" style="margin-top:0"><div class="section-head"><h4>레슨 진도</h4><span>레슨을 눌러 영역별 진행 보기</span></div><div class="lesson-list">${rows||'<div class="empty">레슨 데이터가 없습니다.</div>'}</div></section>`}
function renderWrong(m){const r=m.review||{},items=Array.isArray(r.items)?r.items:[];const list=items.map(x=>`<div class="review-item"><div><b>${esc(practiceLabels[x.practice_type]||x.practice_type||'practice')} · ${esc(x.unit_key||'unit')}</b><small>${esc(x.question_type||'question')} · wrong ${n(x.wrong_count)}회 · stage ${n(x.review_stage)} · ID ${esc(x.question_id||'')}</small></div><span class="pill ${x.is_waiting?'wait':''}">${x.is_waiting?'대기':'활성'}</span></div>`).join('');return `<div class="review-kpis"><div class="review-kpi"><b>${n(r.active)}</b><span>ACTIVE</span></div><div class="review-kpi"><b>${n(r.waiting)}</b><span>WAITING</span></div><div class="review-kpi"><b>${n(r.total)}</b><span>UNRESOLVED</span></div><div class="review-kpi"><b>${n(r.cleared)}</b><span>CLEARED</span></div></div><p class="review-note">Snapshot-backed preview · ${items.length} of ${n(r.total)} unresolved items. Next review: ${esc(fmtDate(r.next_review_at))}</p><div class="review-list">${list||'<div class="empty">현재 남아 있는 오답이 없습니다.</div>'}</div>`}
function renderActivity(m){const a=m.activity||{},days=Array.isArray(a.days)?a.days:[],times=(Array.isArray(m.response_times)?m.response_times:[]).filter(x=>x.practice_type);const dayCards=days.map(d=>`<div class="day-card"><b>${n(d.attempts)}</b><span>${esc(String(d.date||'').slice(5))}</span><small>${d.accuracy==null?'—':pct(d.accuracy)} 정확도</small></div>`).join('');const timing=times.map(t=>`<div class="timing-card"><div class="timing-top"><b>${esc(practiceLabels[t.practice_type]||t.practice_type)}</b><b>${esc(sec(t.median_response_ms))}</b></div><small>중앙값 · ${n(t.valid_attempt_count)}문항</small><div class="timing-split"><span>정답 ${esc(sec(t.median_correct_ms))}</span><span>오답 ${esc(sec(t.median_wrong_ms))}</span><span>&lt;5s ${pct(t.fast_under_5s_pct)}</span><span>&gt;60s ${pct(t.slow_over_60s_pct)}</span></div></div>`).join('');return `<div class="detail-kpis">${metric(n(a.total_attempts),'최근 10일 시도')}${metric(n(a.active_days),'학습한 날')}${metric(n(m.today?.questions),'오늘 활동',pct(m.today?.accuracy)+' 정확도')}${metric(fmtDate(m.summary?.last_activity),'마지막 학습')}</div><section class="section"><div class="section-head"><h4>최근 10일 활동</h4><span>시도 수 · 정확도</span></div><div class="activity-days">${dayCards||'<div class="empty">활동 데이터가 없습니다.</div>'}</div></section><section class="section"><div class="section-head"><h4>문제 풀이 속도</h4><span>중앙값 · 10분 초과 제외</span></div><div class="timing-grid">${timing||'<div class="empty">응답 시간 데이터가 없습니다.</div>'}</div></section>`}
function renderGrammar(m){const rows=Array.isArray(m.grammar_patterns)?m.grammar_patterns:[];const html=rows.map(r=>`<div class="pattern-row"><div class="pattern-name"><strong>${esc(String(r.target||'').replaceAll('_',' '))}</strong><small>${esc(r.lesson||'')}</small></div><div class="metric"><b class="${scoreClass(r.recent_accuracy)}">${pct(r.recent_accuracy)}</b><small>최근 ${n(r.recent_count)}</small></div><div class="metric"><b class="${scoreClass(r.unique_accuracy)}">${pct(r.unique_accuracy)}</b><small>전체 ${n(r.unique_count)}</small></div><div class="metric"><b>${n(r.current_wrong)}</b><small>현재 오답</small></div><div class="metric"><b>${n(r.repeated_wrong)}</b><small>반복 오답</small></div></div>`).join('');return `<section class="section" style="margin-top:0"><div class="section-head"><h4>문법 패턴</h4><span>최근 / 전체 / 오답 / 반복</span></div><div class="pattern-list">${html||'<div class="empty">문법 패턴 데이터가 없습니다.</div>'}</div></section>`}
function renderStudentModal(){const ctx=findMemberContext(openStudentPlanId);if(!ctx)return;const m=ctx.member,g=ctx.group||{};$('#studentTitle').textContent=studentName(m);$('#studentSubtitle').innerHTML=`${esc(g.school||'')} · ${esc(g.term||'')}학기 · ${esc(g.book_label||g.book_key||'')} · <span class="snapshot-tag">snapshot ${esc(fmtAge(m.snapshot_updated_at))} old · ${esc(m.snapshot_version||'')}</span>`;$('#studentTabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===openTab));let html='';if(openTab==='summary')html=renderSummary(m);else if(openTab==='wrong')html=renderWrong(m);else if(openTab==='activity')html=renderActivity(m);else if(openTab==='grammar')html=renderGrammar(m);else html=renderLessons(m);$('#studentBody').innerHTML=html}
function openStudent(planId,tab='lessons'){openStudentPlanId=String(planId);openTab=tab;renderStudentModal();$('#studentModal').classList.add('open')}
function closeStudent(){openStudentPlanId=null;$('#studentModal').classList.remove('open')}
function bindMatrixButtons(){document.querySelectorAll('tr[data-plan-id] [data-student]').forEach(btn=>btn.onclick=e=>{const row=e.currentTarget.closest('tr[data-plan-id]');if(row)openStudent(row.dataset.planId,'lessons')});document.querySelectorAll('tr[data-plan-id] [data-stat="review"] .review-btn').forEach(btn=>btn.onclick=e=>{const row=e.currentTarget.closest('tr[data-plan-id]');if(row)openStudent(row.dataset.planId,'wrong')})}
function updateNumbers(groups){for(const item of groups){const g=item.group||{},members=item.members||[];const groupId=String(g.id||g.group_id||'');const card=[...document.querySelectorAll('[data-group-id]')].find(el=>el.dataset.groupId===groupId);if(card){const age=card.querySelector('[data-role="group-age"]');const oldest=oldestIso(members);if(age){age.dataset.iso=oldest||'';age.textContent='snapshot '+fmtAge(oldest)+' old'}const count=card.querySelector('[data-role="member-count"]');if(count)count.textContent=members.length}for(const m of members){const row=[...document.querySelectorAll('tr[data-plan-id]')].find(el=>el.dataset.planId===String(m.plan_id));if(!row)continue;const map=skillMap(m),sum=m.summary||{},today=m.today||{};const summary=row.querySelector('[data-stat="summary"]');if(summary)summary.innerHTML=scoreHTML(sum.recent150_accuracy,sum.recent150_count);for(const [k] of practices){const cell=row.querySelector(`[data-practice="${k}"]`);const x=map.get(k);if(cell)cell.innerHTML=scoreHTML(x?.recent_accuracy,x?.recent_count)}const review=row.querySelector('[data-stat="review"]');if(review)review.innerHTML=reviewHTML(m.review);const todayCell=row.querySelector('[data-stat="today"]');if(todayCell)todayCell.innerHTML=`<span class="score">${n(today.questions)}</span><span class="small">${pct(today.accuracy)} 정확도</span>`}}bindMatrixButtons();if(openStudentPlanId)renderStudentModal()}
function renderFull(payload,ms){currentPayload=payload;const {groups,members}=updateTop(payload,ms);$('#groups').innerHTML=groups.map(groupCard).join('')||'<div class="card loading">No active groups.</div>';bindMatrixButtons();$('#status').textContent=`Loaded ${groups.length} groups / ${members.length} plans. Numbers will refresh every 20 seconds.`}
async function initialLoad(){const box=$('#groups');box.innerHTML='<div class="card loading">Loading all groups together…</div>';$('#status').textContent='Fetching one authenticated payload…';const result=await fetchPayload();if(!result)return;const {r,payload,ms}=result;if(!r.ok){box.innerHTML=`<div class="card err">${esc(payload.message||payload.error||'Request failed '+r.status)}</div>`;$('#status').textContent='Failed';return}renderFull(payload,ms)}
async function refreshNumbers(manual=false){if(refreshing)return;refreshing=true;try{if(manual)$('#status').textContent='Refreshing numbers…';const result=await fetchPayload();if(!result)return;const {r,payload,ms}=result;if(!r.ok){$('#status').textContent='Background refresh failed; keeping current numbers.';return}currentPayload=payload;const {groups,members}=updateTop(payload,ms);if(!sameShape(groups)){renderFull(payload,ms);$('#status').textContent='Student/group structure changed, so the matrix was rebuilt once.';return}updateNumbers(groups);$('#status').textContent=`Numbers refreshed · ${groups.length} groups / ${members.length} plans · ${ms} ms`;}finally{refreshing=false}}
function tickAges(){const top=$('#snapshotAge');if(top?.dataset.iso)top.textContent=fmtAge(top.dataset.iso);document.querySelectorAll('[data-role="group-age"]').forEach(el=>{if(el.dataset.iso)el.textContent='snapshot '+fmtAge(el.dataset.iso)+' old'});if(openStudentPlanId){const ctx=findMemberContext(openStudentPlanId);if(ctx){const tag=$('#studentSubtitle .snapshot-tag');if(tag)tag.textContent=`snapshot ${fmtAge(ctx.member.snapshot_updated_at)} old · ${ctx.member.snapshot_version||''}`}}}
$('#reload').onclick=()=>refreshNumbers(true);$('#studentClose').onclick=closeStudent;$('#studentModal').onclick=e=>{if(e.target===$('#studentModal'))closeStudent()};$('#studentTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b||!openStudentPlanId)return;openTab=b.dataset.tab;renderStudentModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStudent()});
initialLoad();setInterval(()=>refreshNumbers(false),AUTO_MS);setInterval(tickAges,1000);
})();
</script>
</body>
</html>
