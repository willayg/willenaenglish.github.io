<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Genius Live · Willena</title><script src="/js/api-config.js"></script>
<style>
:root{font-family:Poppins,Arial,sans-serif;color:#283b47;background:#f5fbfc;--pink:#ed5aa1;--cyan:#80d9e2}*{box-sizing:border-box}body{margin:0}header{background:#34404d;color:white;padding:16px 24px;display:flex;gap:14px;align-items:center;justify-content:space-between}header strong{font-size:1.3rem}header em{font-style:normal;color:#ff8abf}main{max-width:1120px;margin:28px auto;padding:0 16px}.card{background:white;border:2px solid #d5edf1;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #1640520a}.card.accent{border-color:var(--cyan)}h1{font-size:2rem;margin:0 0 10px}h2{margin:0 0 14px}.muted{color:#72848e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}.field{display:grid;gap:9px;margin-bottom:18px}label{font-size:.85rem;font-weight:700}button,select,input{font:inherit}button{background:#fff;border:1.5px solid var(--cyan);border-radius:10px;color:#cb377e;padding:10px 16px;font-weight:700;cursor:pointer}button.primary{background:var(--pink);color:#fff;border-color:var(--pink)}button:disabled{opacity:.45;cursor:not-allowed}.chip.active{background:#ffe8f3;border-color:var(--pink)}select,input{border:1px solid #bbdce1;padding:10px;border-radius:10px;width:100%}.pill{font-size:.76rem;color:#317684;background:#e5f8fb;border-radius:20px;padding:6px 10px;font-weight:700}.notice{padding:13px;background:#fff6dd;border-radius:10px;font-size:.87rem}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:85px;text-align:left;font-size:1rem}.answer.chosen{border:2px solid #3186d3;background:#e8f3ff}.answer.correct{background:#def8e8;border-color:#26945f}.answer.wrong{opacity:.55}.question{font-size:1.4rem;font-weight:700;margin:20px 0}.score{padding:12px;border-bottom:1px solid #e3eef0;display:flex;justify-content:space-between}.timer{font-size:2rem;font-weight:800;color:#cc448c}.count{font-weight:700;color:#327c8b}.footer{text-align:center;color:#7b919d;font-size:.8rem;padding:20px}#screen[hidden],#lock[hidden]{display:none}@media(max-width:700px){.grid,.answers{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><header><strong>Willena · <em>Genius Live</em></strong><span class="pill">Private teacher prototype · v0.2</span></header><main><div id="lock" class="card"><h1>Checking teacher access…</h1><p class="muted" id="lockMessage">Verifying your Willena session.</p></div><div id="screen" hidden></div></main><div class="footer">Not linked from the dashboard · Sample questions · Same-browser multiplayer only · No database writes</div>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=[
{book:"Buzz 6",unit:1,skill:"Grammar",q:"Choose the correct sentence.",a:["She have finished her homework.","She has finished her homework.","She has finish her homework.","She finished has her homework."],correct:1,exp:"Present perfect uses has + past participle."},
{book:"Buzz 6",unit:1,skill:"Vocabulary",q:"Choose the word meaning 'careful'.",a:["careless","careful","carefully","caring"],correct:1,exp:"Careful is the adjective."},
{book:"Buzz 6",unit:2,skill:"Grammar",q:"Choose the correct question.",a:["Have you ever been to Japan?","Has you ever been to Japan?","Have you ever went to Japan?","Did you ever been to Japan?"],correct:0,exp:"Have + subject + past participle."},
{book:"Buzz 6",unit:2,skill:"Sentence",q:"Which sentence expresses advice?",a:["You should rest.","You rested yesterday.","You will be resting.","You rest every day."],correct:0,exp:"Should expresses advice."},
{book:"Everybody Up 6",unit:1,skill:"Grammar",q:"Which is correct?",a:["If it rains, we stay inside.","If it will rain, we stay inside.","If it rains, we will stay inside.","If it rain, we will stay inside."],correct:2,exp:"First conditional: if + present, will + verb."},
{book:"Everybody Up 6",unit:1,skill:"Vocabulary",q:"Which word means 'very large'?",a:["tiny","huge","narrow","short"],correct:1,exp:"Huge means extremely big."},
{book:"Everybody Up 5",unit:1,skill:"Grammar",q:"Choose the correct comparative.",a:["more tall","taller","tallest than","most tall"],correct:1,exp:"Short adjectives usually take -er."},
{book:"Everybody Up 5",unit:2,skill:"Vocabulary",q:"What is the opposite of 'early'?",a:["soon","late","fast","first"],correct:1,exp:"Late is the opposite of early."},
{book:"Grammar 10",unit:1,skill:"Grammar",q:"Find the correct sentence.",a:["Each students are ready.","Each student is ready.","Each student are ready.","Each students is ready."],correct:1,exp:"Each takes a singular noun and singular verb."},
{book:"Grammar 10",unit:2,skill:"Grammar",q:"Choose the correct sentence.",a:["Neither answer are right.","Neither answers is right.","Neither answer is right.","Neither of answer are right."],correct:2,exp:"Neither is singular here."}
];
const KEY="willena.genius.live.demo.v2",ROLE="willena.genius.live.role";let channel;try{channel=new BroadcastChannel(KEY)}catch{}
let role=sessionStorage.getItem(ROLE)||"teacher",pin=sessionStorage.getItem("gl.pin")||"",playerId=sessionStorage.getItem("gl.player")||"",hostKey=sessionStorage.getItem("gl.host")||"";
let draft={books:["Buzz 6"],units:[1,2],skills:["Grammar","Vocabulary"],count:10,seconds:20,mode:"team",teamCount:2};
const uid=()=>crypto.randomUUID(),read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}};
const game=(p=pin)=>read()[p],me=g=>g?.players.find(x=>x.id===playerId),host=g=>g?.hostKey===hostKey&&!!hostKey;
const update=(p,fn)=>{const all=read(),old=all[p],next=fn(old?JSON.parse(JSON.stringify(old)):null);if(!next)return;next.rev=(old?.rev||0)+1;all[p]=next;localStorage.setItem(KEY,JSON.stringify(all));channel?.postMessage(p);return next};
function setRole(r){role=r;sessionStorage.setItem(ROLE,r);render()}
function configure(key,value){draft[key]=draft[key].includes(value)?draft[key].filter(v=>v!==value):[...draft[key],value];render()}
function chips(values,key){return '<div class="row">'+values.map(v=>'<button class="chip '+(draft[key].includes(v)?'active':'')+'" data-chip="'+key+'" data-val="'+esc(v)+'">'+esc(v)+'</button>').join('')+'</div>'}
function matching(){return questions.filter(q=>draft.books.includes(q.book)&&draft.units.includes(q.unit)&&draft.skills.includes(q.skill))}
function names(g){return g.players.slice().sort((a,b)=>b.score-a.score)}
function scores(g){const list=g.mode==="team"?Array.from({length:g.teamCount},(_,i)=>({name:["Pink Dragons","Blue Sharks","Green Tigers","Yellow Stars"][i],score:g.players.filter(p=>p.team===i).reduce((n,p)=>n+p.score,0)})).sort((a,b)=>b.score-a.score):names(g);return list.map((x,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(x.name)+'</span><strong>'+x.score.toLocaleString()+' pts</strong></div>').join('')}
function setup(){return '<div class="grid"><section class="card accent"><h1>Create a live game</h1><p class="muted">Sample content only. A future pass will read the Genius question banks.</p><div class="field"><label>Books</label>'+chips(["Buzz 6","Everybody Up 6","Everybody Up 5","Grammar 10"],"books")+'</div><div class="field"><label>Units</label>'+chips([1,2],"units")+'</div><div class="field"><label>Skills</label>'+chips(["Grammar","Vocabulary","Sentence"],"skills")+'</div><div class="grid"><div class="field"><label>Questions</label><select data-select="count">'+[5,10,15,20].map(n=>'<option '+(draft.count===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field"><label>Seconds per question</label><select data-select="seconds">'+[10,15,20,30,45].map(n=>'<option '+(draft.seconds===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field"><label>Mode</label><select data-select="mode"><option value="team" '+(draft.mode==="team"?"selected":"")+'>Teams</option><option value="individual" '+(draft.mode==="individual"?"selected":"")+'>Individual</option></select></div><div class="field"><label>Teams</label><select data-select="teamCount" '+(draft.mode==="individual"?"disabled":"")+'> '+[2,3,4].map(n=>'<option '+(draft.teamCount===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div></div><button id="create" class="primary" '+(!matching().length?"disabled":"")+'>Create · '+Math.min(draft.count,matching().length)+' sample questions</button></section><section class="card"><h2>Play-test with another tab</h2><p>Teacher creates the game and shares its six-digit PIN. In another tab of this same browser profile, choose <b>Student test</b> and enter the PIN.</p><p class="notice">This is a site-hosted private prototype, not a network multiplayer service. Separate devices do not yet share game state.</p><button id="studentView">Student test</button></section></div>'}
function join(){return '<section class="card accent"><h1>Student test</h1><p class="muted">Simulated student entry, restricted to authenticated teachers for this preview.</p><form id="join"><div class="field"><label>Game PIN</label><input id="joinPin" required maxlength="6" pattern="[0-9]{6}" value="'+esc(pin)+'"></div><div class="field"><label>Display name</label><input id="joinName" required maxlength="25" placeholder="Student name"></div><button class="primary">Join game</button> <button type="button" id="teacherView">Teacher view</button></form></section>'}
function lobby(g){return '<div class="grid"><section class="card accent"><span class="pill">'+(role==="teacher"?"Teacher lobby":"Student lobby")+'</span><h1>PIN: '+esc(g.pin)+'</h1><h2>'+g.players.length+' joined · '+g.questions.length+' questions</h2><p class="muted">Open another tab in the same browser and enter this PIN using Student test.</p>'+(role==="teacher"?'<button class="primary" id="start" '+(!g.players.length?"disabled":"")+'>Start game</button> <button id="cancel">Cancel</button>':'<p class="notice">Ready! Waiting for teacher…</p>')+'</section><section class="card"><h2>Players</h2>'+g.players.map(p=>'<div class="score">'+esc(p.name)+' <span class="muted">'+(g.mode==="team"?["Pink Dragons","Blue Sharks","Green Tigers","Yellow Stars"][p.team]:"Individual")+'</span></div>').join('')+'</section></div>'}
const left=g=>Math.max(0,g.deadline-Date.now());
function play(g){const q=g.questions[g.index],reveal=g.status==="reveal",mine=g.responses[playerId],canAnswer=role==="student"&&!mine&&!reveal&&left(g)>0;return '<div class="grid"><section class="card accent"><div class="row between"><span class="pill">'+esc(q.book)+' · Unit '+q.unit+' · '+q.skill+'</span><strong>'+ (g.index+1)+' / '+g.questions.length+'</strong></div><div class="row between"><div class="timer" id="timer">'+(reveal?"✓":Math.ceil(left(g)/1000)+"s")+'</div><span class="count">'+Object.keys(g.responses).length+' / '+g.players.length+' answered</span></div><div class="question">'+esc(q.q)+'</div><div class="answers">'+q.a.map((a,i)=>'<button class="answer '+(mine?.answer===i?"chosen ":"")+(reveal?(i===q.correct?"correct":"wrong"):"")+'" data-answer="'+i+'" '+(!canAnswer?"disabled":"")+'> '+esc(a)+'</button>').join('')+'</div>'+(reveal?'<p class="notice"><b>Answer: '+esc(q.a[q.correct])+'</b> · '+esc(q.exp)+'</p>':'')+(role==="teacher"?'<div class="row" style="margin-top:18px"><button id="reveal" '+(reveal?"disabled":"")+'>Reveal</button><button class="primary" id="next" '+(!reveal?"disabled":"")+'>'+(g.index===g.questions.length-1?"Finish game":"Next question")+'</button></div>':'<p class="muted"> '+(mine?"Answer locked in.":"Choose an answer before time runs out.")+'</p>')+'</section><section class="card"><h2>Leaderboard</h2>'+scores(g)+'</section></div>'}
function finish(g){return '<div class="grid"><section class="card accent"><h1>🏆 Game complete!</h1>'+scores(g)+(role==="teacher"?'<button class="primary" id="again">New game</button>':'')+'</section><section class="card"><h2>Individual results</h2>'+names(g).map(p=>'<div class="score">'+esc(p.name)+'<b>'+p.score+' pts</b></div>').join('')+'<p class="muted">No production Genius points or student records changed.</p></section></div>'}
function revealRound(g){if(g.status!=="question")return g;const q=g.questions[g.index];for(const p of g.players){const r=g.responses[p.id];if(r?.answer===q.correct)p.score+=500+Math.round(500*Math.max(0,Math.min(1,(g.deadline-r.at)/(g.seconds*1000))))}g.status="reveal";return g}
function render(){const g=game();$("#screen").innerHTML='<div class="row" style="margin-bottom:15px"><button id="goTeacher">Teacher</button><button id="goStudent">Student test</button><span class="pill">No production connections</span></div>'+(role==="teacher"?(g&&host(g)&&g.status!=="cancelled"?(g.status==="lobby"?lobby(g):g.status==="finished"?finish(g):play(g)):setup()):(g&&me(g)&&g.status!=="cancelled"?(g.status==="lobby"?lobby(g):g.status==="finished"?finish(g):play(g)):join()));bind()}
function bind(){
$("#goTeacher").onclick=()=>setRole("teacher");$("#goStudent").onclick=()=>setRole("student");
document.querySelectorAll("[data-chip]").forEach(el=>el.onclick=()=>configure(el.dataset.chip,el.dataset.chip==="units"?Number(el.dataset.val):el.dataset.val));
document.querySelectorAll("[data-select]").forEach(el=>el.onchange=()=>{draft[el.dataset.select]=el.dataset.select==="mode"?el.value:Number(el.value);render()});
const b=id=>document.getElementById(id);
if(b("studentView"))b("studentView").onclick=()=>setRole("student");if(b("teacherView"))b("teacherView").onclick=()=>setRole("teacher");
if(b("create"))b("create").onclick=()=>{const pool=matching().sort(()=>Math.random()-.5).slice(0,draft.count),all=read();let p;do{p=String(Math.floor(100000+Math.random()*900000))}while(all[p]);hostKey=uid();pin=p;sessionStorage.setItem("gl.pin",pin);sessionStorage.setItem("gl.host",hostKey);update(p,()=>({pin:p,hostKey,status:"lobby",questions:pool,index:-1,seconds:draft.seconds,mode:draft.mode,teamCount:draft.teamCount,deadline:0,players:[],responses:{}}));render()};
if(b("join"))b("join").onsubmit=e=>{e.preventDefault();const p=b("joinPin").value,name=b("joinName").value.trim(),id=uid();const r=update(p,g=>{if(!g||g.status!=="lobby")return null;g.players.push({id,name,team:g.mode==="team"?g.players.length%g.teamCount:-1,score:0});return g});if(!r){alert("Game not found or already started");return}pin=p;playerId=id;sessionStorage.setItem("gl.pin",pin);sessionStorage.setItem("gl.player",id);render()};
if(b("start"))b("start").onclick=()=>{update(pin,g=>{if(!host(g)||g.status!=="lobby"||!g.players.length)return null;g.status="question";g.index=0;g.deadline=Date.now()+g.seconds*1000;return g});render()};
if(b("cancel"))b("cancel").onclick=()=>{update(pin,g=>{if(!host(g))return null;g.status="cancelled";return g});pin="";sessionStorage.removeItem("gl.pin");render()};
document.querySelectorAll("[data-answer]").forEach(el=>el.onclick=()=>{const a=Number(el.dataset.answer),now=Date.now();update(pin,g=>{if(!g||g.status!=="question"||now>g.deadline||!me(g)||g.responses[playerId])return null;g.responses[playerId]={answer:a,at:now};return g});render()});
if(b("reveal"))b("reveal").onclick=()=>{update(pin,g=>host(g)?revealRound(g):null);render()};
if(b("next"))b("next").onclick=()=>{update(pin,g=>{if(!host(g)||g.status!=="reveal")return null;g.index++;if(g.index===g.questions.length)g.status="finished";else{g.status="question";g.responses={};g.deadline=Date.now()+g.seconds*1000}return g});render()};
if(b("again"))b("again").onclick=()=>{pin="";sessionStorage.removeItem("gl.pin");render()};
}
async function protect(){try{if(!window.WillenaAPI?.getApiUrl)throw Error("Willena auth configuration unavailable");const u=window.WillenaAPI.getApiUrl("/.netlify/functions/supabase_auth?action=whoami");const a=await fetch(u,{credentials:"include",cache:"no-store"});const who=await a.json();if(!a.ok||!who.user_id)throw Error("Please sign in to the Teachers Dashboard first.");const url=window.WillenaAPI.getApiUrl("/.netlify/functions/supabase_auth?action=get_profile&user_id="+encodeURIComponent(who.user_id));const r=await fetch(url,{credentials:"include",cache:"no-store"});const p=await r.json();if(!r.ok||!["teacher","admin"].includes(String(p.role||"").toLowerCase())||p.approved!==true)throw Error("Approved teacher access required.");$("#lock").hidden=true;$("#screen").hidden=false;render();}catch(e){$("#lockMessage").textContent=e.message;$("#lock").querySelector("h1").textContent="Teacher login required";const link=document.createElement("a");link.href="/Teachers/";link.textContent="Open Teachers Dashboard to sign in";$("#lock").append(link)}}
channel?.addEventListener("message",()=>{if(!$("#screen").hidden)render()});window.addEventListener("storage",e=>{if(e.key===KEY&&!$("#screen").hidden)render()});
setInterval(()=>{const g=game();if(!g||g.status!=="question"||$("#screen").hidden)return;const t=$("#timer");if(t)t.textContent=Math.ceil(left(g)/1000)+"s";if(!left(g)&&role==="teacher"&&host(g)){update(pin,s=>s.status==="question"?revealRound(s):null);render()}},300);
protect();
</script></body></html>
