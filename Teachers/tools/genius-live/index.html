<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Genius Live · Teachers</title><script src="/js/api-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ed5fa5;--cyan:#75d5df;--ink:#253f4c;--muted:#738891;--border:#d4e7eb;--bg:#f5fafb}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px Poppins,Arial,sans-serif;color:var(--ink)}header{background:#374151;color:#fff;padding:16px max(16px,calc((100vw - 1240px)/2));display:flex;gap:14px;align-items:center;justify-content:space-between}
header h1{font-size:21px;margin:0}header h1 span{color:#ff8dc6}main{max-width:1240px;margin:22px auto;padding:0 18px}h2{font-size:21px;margin:0 0 14px}h3{font-size:17px;margin:0 0 9px}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 3px 15px #1c51550b;margin-bottom:16px}.panel.em{border:2px solid var(--cyan)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.small{font-size:12px}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf8fa;color:#327988;font-size:11px;font-weight:700}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}select,input{font:inherit;border:1px solid #bfdae1;border-radius:9px;background:white;color:var(--ink);padding:10px;width:100%}button{font:600 13px Poppins,Arial,sans-serif;color:#c74584;border:1px solid var(--cyan);background:white;border-radius:9px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--pink);border-color:var(--pink);color:white}button:disabled{opacity:.45;cursor:not-allowed}.chip{padding:7px 11px}.chip.active{background:#ffe8f2;border-color:var(--pink)}.chips{display:flex;flex-wrap:wrap;gap:6px}.book{padding:13px 15px;background:#faffff;border:1px solid #dbedf1;border-radius:12px;margin-top:10px}
.booktop{display:flex;align-items:center;justify-content:space-between;gap:10px}.field{margin-bottom:15px}.notice{padding:13px 15px;background:#fff6e5;border:1px solid #f4dfa8;border-radius:10px;margin-bottom:16px}.notice.error{background:#fff0f3;border-color:#f2c6d3}
.pin{font-size:clamp(44px,6vw,80px);font-weight:800;letter-spacing:9px;color:#d94891;line-height:1.3}.question{font-size:clamp(22px,3vw,35px);font-weight:800;line-height:1.35;margin:17px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{padding:20px 14px;min-height:93px;border-radius:12px;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:12px}.answer:nth-child(4n+1){background:#e96297}.answer:nth-child(4n+2){background:#42b8d5}.answer:nth-child(4n+3){background:#e8ac44}.answer:nth-child(4n+4){background:#8f7ed4}.answer.correct{outline:5px solid #27965e;outline-offset:2px}.answer.dim{opacity:.4}
.letter{border:1px solid #ffffff77;width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center}.timer{font-size:36px;font-weight:800;color:#c8428d;font-variant-numeric:tabular-nums}.bar{height:7px;border-radius:7px;background:#e3eef0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .2s}.score{display:flex;justify-content:space-between;border-bottom:1px solid #e9f0f1;padding:10px 4px;gap:8px}.score:last-child{border:0}.player{display:flex;align-items:center;justify-content:space-between;border:1px solid #e6f0f2;border-radius:10px;padding:9px 12px;margin:6px 0}.team{font-size:11px;color:#a43d77}
@media(max-width:750px){.grid,.two,.answers{grid-template-columns:1fr}header{padding:13px 16px}.panel{padding:15px}.pin{letter-spacing:4px}}
</style></head><body><header><h1>Willena <span>Genius Live</span></h1><span class="tag">Teacher · v1.0</span></header><main><div id="message" class="notice">Checking teacher login…</div><div id="app"></div></main>
<script type="module">
import {ensureTeacherSession,ensureAuthRefresh} from "/Teachers/auth-refresh.js?v=20261021-sessionfix1";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(action,body={})=>{const r=await fetch("/api/genius-live",{method:"POST",credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||"Request failed ("+r.status+")");return j};
let catalog=[],selected=new Map(),pin=sessionStorage.getItem("genius.live.host.pin")||"",state=null,busy=false,initialized=false,autoReveal=false;
let settings={count:15,seconds:20,mode:"team",teamCount:2},lastView="";
function notify(message,error=false){const n=$("#message");n.textContent=message;n.className="notice"+(error?" error":"");n.hidden=!message}
function bookName(id){return catalog.find(b=>b.id===id)?.title||"Unknown book"}
function selectedUnits(){return [...selected].map(([bookId,units])=>({bookId,units:[...units]})).filter(x=>x.units.length)}
function roundStatus(){if(!state)return "";return state.status+"|"+state.questionNumber+"|"+state.answeredCount+"|"+state.players.length}
function teamName(n){return ["Pink Dragons","Blue Sharks","Green Tigers","Yellow Stars"][n]||"Team"}
function leaderboard(){if(!state)return "";let list=state.mode==="team"?Array.from({length:state.teamCount},(_,i)=>({name:teamName(i),score:state.players.filter(p=>p.team===i).reduce((s,p)=>s+p.score,0)})):state.players.map(p=>({name:p.name,score:p.score}));list.sort((a,b)=>b.score-a.score);return list.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>'+p.score.toLocaleString()+' pts</b></div>').join("")}
function setup(){
 $("#app").innerHTML='<div class="grid"><section class="panel em"><div class="row between"><h2>Create a classroom game</h2><span class="tag">Word Genius · Quiz</span></div><p class="muted small">Choose any published book with vocabulary. Questions are drawn directly from Word Genius content.</p>'+
 '<div class="field"><label>Find a book</label><select id="bookSelect"><option value="">Select a book…</option>'+catalog.map(b=>'<option value="'+b.id+'">'+esc(b.title)+'</option>').join("")+'</select></div><div id="bookCards">'+bookCards()+'</div>'+
 '<div class="two"><div class="field"><label>Number of questions</label><select id="count">'+[5,10,15,20,30,40].map(n=>'<option '+(settings.count===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div>'+
 '<div class="field"><label>Seconds per question</label><select id="seconds">'+[10,15,20,30,45,60].map(n=>'<option '+(settings.seconds===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div>'+
 '<div class="field"><label>Game type</label><select id="mode"><option value="team" '+(settings.mode==="team"?"selected":"")+'>Team battle</option><option value="individual" '+(settings.mode==="individual"?"selected":"")+'>Individual</option></select></div>'+
 '<div class="field"><label>Number of teams</label><select id="teamCount" '+(settings.mode==="individual"?"disabled":"")+'>'+[2,3,4].map(n=>'<option '+(settings.teamCount===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div></div>'+
 '<button class="primary" id="create" '+(!selectedUnits().length?"disabled":"")+'>Create Live Game</button></section>'+
 '<aside class="panel"><h2>Teacher instructions</h2><p>1. Select one or more books and units.</p><p>2. Create a game and show the six-digit PIN.</p><p>3. Students sign into the separate Genius Live student page and join.</p><p>4. Start the quiz, reveal each answer and follow the scoreboard.</p>'+
 '<div class="notice"><b>Student game:</b><p class="small">https://students.willenaenglish.com/students/genius-live/</p><button id="copyLink">Copy student link</button></div>'+
 '<p class="muted small">No dashboard link has been added, and Genius homework scores are unaffected.</p></aside></div>';
 $("#bookSelect").onchange=e=>{const id=e.target.value;if(!id)return;const b=catalog.find(x=>x.id===id);if(!selected.has(id))selected.set(id,new Set(b.units.map(u=>u.id)));setup()};
 document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{const id=b.dataset.book,unit=b.dataset.unit,chosen=selected.get(id);chosen.has(unit)?chosen.delete(unit):chosen.add(unit);setup()});
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);setup()});
 document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const id=b.dataset.all;selected.set(id,new Set(catalog.find(x=>x.id===id).units.map(u=>u.id)));setup()});
 document.querySelectorAll("[data-none]").forEach(b=>b.onclick=()=>{selected.get(b.dataset.none).clear();setup()});
 for(const key of ["count","seconds","mode","teamCount"])$("#"+key).onchange=e=>{settings[key]=key==="mode"?e.target.value:Number(e.target.value);if(key==="mode")setup()};
 $("#copyLink").onclick=()=>navigator.clipboard.writeText("https://students.willenaenglish.com/students/genius-live/").then(()=>notify("Student link copied."));
 $("#create").onclick=async()=>{if(busy)return;busy=true;notify("Building a quiz from the selected Word Genius vocabulary…");try{const g=await api("create",{selections:selectedUnits(),...settings});pin=g.pin;sessionStorage.setItem("genius.live.host.pin",pin);await refresh();notify(g.total+" real Word Genius quiz questions ready.");}catch(e){notify(e.message,true)}finally{busy=false}};
}
function bookCards(){return [...selected].map(([id,set])=>{const b=catalog.find(x=>x.id===id);if(!b)return "";return '<div class="book"><div class="booktop"><strong>'+esc(b.title)+'</strong><button data-remove="'+id+'">Remove</button></div>'+
 '<div class="row" style="margin:10px 0"><button data-all="'+id+'">All units</button><button data-none="'+id+'">Clear units</button><span class="muted small">'+set.size+' selected</span></div><div class="chips">'+b.units.map(u=>'<button class="chip '+(set.has(u.id)?"active":"")+'" data-unit="'+u.id+'" data-book="'+id+'">Unit '+u.unit_number+'</button>').join("")+'</div></div>'}).join("")}
function lobby(){return '<div class="grid"><section class="panel em"><span class="tag">Waiting room</span><h2 style="margin-top:10px">Students join with PIN</h2><div class="pin">'+esc(pin)+'</div>'+
 '<p class="small muted">Students open the separate Genius Live student page, log in and enter this PIN.</p><div class="row"><button class="primary" id="start" '+(!state.players.length?"disabled":"")+'>Start Game</button><button id="cancel">Cancel game</button></div>'+
 '<p class="small muted">'+state.total+' questions · '+state.seconds+' seconds · '+state.mode+'</p></section>'+
 '<section class="panel"><h2>Players ('+state.players.length+')</h2>'+state.players.map(p=>'<div class="player"><strong>'+esc(p.name)+'</strong><span class="team">'+(state.mode==="team"?teamName(p.team):"Individual")+'</span></div>').join("")+'</section></div>'}
function quiz(){const q=state.question;return '<div class="grid"><section class="panel em"><div class="row between"><span class="tag">'+esc(q.book)+' · Unit '+q.unit+' · Word Genius</span><b>Question '+state.questionNumber+' / '+state.total+'</b></div>'+
 '<div class="row between" style="margin-top:12px"><span class="timer" id="timer">—</span><b>'+state.answeredCount+' / '+state.players.length+' answered</b></div><div class="bar"><i id="timerBar"></i></div>'+
 '<div class="question">'+esc(q.prompt)+'</div><div class="answers">'+q.options.map((s,i)=>'<div class="answer '+(state.status==="reveal"?(i===q.correct?"correct":"dim"):"")+'"><span class="letter">'+["A","B","C","D"][i]+'</span>'+esc(s)+'</div>').join("")+'</div>'+
 (state.status==="reveal"?'<p class="notice"><strong>Answer: '+esc(q.options[q.correct])+'</strong> · '+esc(q.explanation)+'</p>':'<p class="muted small">Answers remain hidden until you reveal them.</p>')+
 '<div class="row"><button id="reveal" '+(state.status!=="question"?"disabled":"")+'>Reveal Answer</button><button id="next" class="primary" '+(state.status!=="reveal"?"disabled":"")+'>'+(state.questionNumber===state.total?"Finish Game":"Next Question")+'</button><button id="cancel">End game</button></div></section>'+
 '<section class="panel"><h2>'+ (state.mode==="team"?"Team leaderboard":"Leaderboard")+'</h2>'+leaderboard()+'<h3 style="margin-top:25px">Players</h3>'+state.players.map(p=>'<div class="player">'+esc(p.name)+'<span class="tag">'+(state.answeredPlayerIds?.includes(p.id)?"Answered":"Waiting")+'</span></div>').join("")+'</section></div>'}
function finished(){return '<div class="grid"><section class="panel em"><h2>Game complete</h2><p>'+state.total+' Word Genius quiz questions played.</p>'+leaderboard()+'<p><button id="again" class="primary">Create another game</button></p></section><section class="panel"><h2>Individual scores</h2>'+state.players.slice().sort((a,b)=>b.score-a.score).map(p=>'<div class="score">'+esc(p.name)+'<b>'+p.score+' pts</b></div>').join("")+'</section></div>'}
function paint(){if(!state){setup();return}const key=roundStatus();if(key===lastView)return;lastView=key;$("#app").innerHTML=state.status==="lobby"?lobby():["question","reveal"].includes(state.status)?quiz():finished();
 const on=(id,fn)=>{const b=$("#"+id);if(b)b.onclick=fn};
 on("start",()=>doAction("start"));on("reveal",()=>doAction("reveal"));on("next",()=>doAction("next"));on("cancel",()=>{if(confirm("End this game?"))doAction("cancel")});
 on("again",()=>{pin="";state=null;lastView="";sessionStorage.removeItem("genius.live.host.pin");setup()});
 tick();
}
async function doAction(action){if(busy)return;busy=true;try{state=await api(action,{pin});if(state.status==="cancelled"){pin="";state=null;sessionStorage.removeItem("genius.live.host.pin")}lastView="";autoReveal=false;paint()}catch(e){notify(e.message,true)}finally{busy=false}}
async function refresh(){if(!pin||busy)return;try{state=await api("state",{pin});if(!state.teacher)throw Error("This game belongs to another teacher.");if(state.status==="cancelled"){pin="";state=null;sessionStorage.removeItem("genius.live.host.pin")}paint()}catch(e){notify(e.message,true)}}
function tick(){if(!state||state.status!=="question")return;const rem=Math.max(0,Date.parse(state.deadline)-Date.now()),sec=Math.ceil(rem/1000),t=$("#timer"),bar=$("#timerBar");if(t)t.textContent=sec+"s";if(bar)bar.style.width=(100*rem/(state.seconds*1000))+"%";if(rem===0&&!autoReveal&&!busy){autoReveal=true;doAction("reveal")}}
async function login(){
 try{const session=await ensureTeacherSession();
  if(!session?.success){if(session?.temporary){notify("Connection problem. Your login has not been cleared. Reload to retry.",true);return}location.replace("/Teachers/login.html?redirect="+encodeURIComponent(location.pathname));return}
  const u=window.WillenaAPI.getApiUrl("/.netlify/functions/supabase_auth?action=get_role&user_id="+encodeURIComponent(session.user_id));
  const res=await window.WillenaAPI.fetch(u,{cache:"no-store"}),r=await res.json();
  if(!res.ok||!["teacher","admin"].includes(String(r.role||"").toLowerCase()))throw Error("Teacher access required.");
  ensureAuthRefresh();initialized=true;
  if(pin){await refresh();if(state){notify("");return}pin="";sessionStorage.removeItem("genius.live.host.pin")}
  notify("Loading books…");const data=await api("catalog");catalog=data.books||[];notify("");setup();
 }catch(e){notify(e.message,true);$("#app").innerHTML='<div class="panel"><h2>Could not open Genius Live</h2><button id="retryLogin">Retry login</button> <a href="/Teachers/">Teachers Dashboard</a></div>';$("#retryLogin").onclick=login}}
}
setInterval(()=>{if(initialized&&pin&&document.visibilityState==="visible")refresh()},1800);
setInterval(tick,200);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pin)refresh()});
login();
</script></body></html>
