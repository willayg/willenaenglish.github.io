<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Genius Live · Teachers</title><script src="/js/api-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ed5fa5;--cyan:#75d5df;--ink:#253f4c;--muted:#738891;--border:#d4e7eb;--bg:#f5fafb}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px Poppins,Arial,sans-serif;color:var(--ink)}header{background:#374151;color:#fff;padding:16px max(16px,calc((100vw - 1240px)/2));display:flex;gap:14px;align-items:center;justify-content:space-between}
header h1{font-size:21px;margin:0}
.music-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.music-controls button{background:#fff;color:#a92e71;border-color:#ff8dc6;padding:7px 12px}
.music-controls button[aria-pressed="true"]{background:#ffe5f1}
.music-controls label{display:flex;align-items:center;gap:7px;margin:0;color:#fff;font-size:11px}
.music-controls input[type="range"]{width:95px;accent-color:#f47db5;padding:0;min-width:75px}
.music-controls small{color:#e0e7eb;font-size:10px}
@media(max-width:600px){.music-controls{width:100%;justify-content:flex-start}.music-controls small{display:none}}header h1 span{color:#ff8dc6}main{max-width:1240px;margin:22px auto;padding:0 18px}h2{font-size:21px;margin:0 0 14px}h3{font-size:17px;margin:0 0 9px}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 3px 15px #1c51550b;margin-bottom:16px}.panel.em{border:2px solid var(--cyan)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.small{font-size:12px}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf8fa;color:#327988;font-size:11px;font-weight:700}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}select,input{font:inherit;border:1px solid #bfdae1;border-radius:9px;background:white;color:var(--ink);padding:10px;width:100%}button{font:600 13px Poppins,Arial,sans-serif;color:#c74584;border:1px solid var(--cyan);background:white;border-radius:9px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--pink);border-color:var(--pink);color:white}button:disabled{opacity:.45;cursor:not-allowed}.chip{padding:7px 11px}.chip.active{background:#ffe8f2;border-color:var(--pink)}.chips{display:flex;flex-wrap:wrap;gap:6px}.book{padding:13px 15px;background:#faffff;border:1px solid #dbedf1;border-radius:12px;margin-top:10px}
.booktop{display:flex;align-items:center;justify-content:space-between;gap:10px}.field{margin-bottom:15px}.notice{padding:13px 15px;background:#fff6e5;border:1px solid #f4dfa8;border-radius:10px;margin-bottom:16px}.notice.error{background:#fff0f3;border-color:#f2c6d3}
.join-layout{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:12px 0}.join-code{flex:1;min-width:230px}.qr-panel{display:flex;align-items:center;flex-direction:column;gap:9px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:14px}.qr-panel #joinQR{width:170px;height:170px;display:grid;place-items:center}.qr-panel #joinQR img,.qr-panel #joinQR canvas{max-width:100%;height:auto}.join-url{font-size:12px;overflow-wrap:anywhere}.join-url a{color:#c74584}.pin{font-size:clamp(44px,6vw,80px);font-weight:800;letter-spacing:9px;color:#d94891;line-height:1.3}.question{white-space:pre-line;font-size:clamp(22px,3vw,35px);font-weight:800;line-height:1.35;margin:17px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{padding:20px 14px;min-height:93px;border-radius:12px;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:12px}.answer:nth-child(4n+1){background:#e96297}.answer:nth-child(4n+2){background:#42b8d5}.answer:nth-child(4n+3){background:#e8ac44}.answer:nth-child(4n+4){background:#8f7ed4}.answer.correct{outline:5px solid #27965e;outline-offset:2px}.answer.dim{opacity:.4}
.letter{border:1px solid #ffffff77;width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center}.timer{font-size:36px;font-weight:800;color:#c8428d;font-variant-numeric:tabular-nums}.bar{height:7px;border-radius:7px;background:#e3eef0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .2s}.score{display:flex;justify-content:space-between;border-bottom:1px solid #e9f0f1;padding:10px 4px;gap:8px}.score:last-child{border:0}.player{display:flex;align-items:center;justify-content:space-between;border:1px solid #e6f0f2;border-radius:10px;padding:9px 12px;margin:6px 0}.team{font-size:11px;color:#a43d77}.word-preview{border:1px solid var(--border);border-radius:12px;padding:12px;margin:12px 0;max-height:390px;overflow:auto;background:#fbfeff}.word-preview-row{display:grid;grid-template-columns:28px minmax(130px,1fr) minmax(120px,1fr);gap:10px;align-items:center;padding:8px;border-bottom:1px solid #e5f1f3}.word-preview-row:last-child{border:0}.word-preview small{display:block;color:var(--muted)}.team-picker{max-width:185px;width:52%;padding:7px;font-size:12px}.team-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.team-summary{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.team-summary .tag{font-size:10px}
.team-manager{border:1px solid #dbeef1;border-radius:13px;padding:12px;margin:14px 0;background:#faffff}
.team-editor{display:grid;grid-template-columns:minmax(0,1fr) 74px auto auto;align-items:center;gap:7px;margin:8px 0}
.team-editor input,.team-editor select{width:100%;min-width:0;padding:8px}
.team-editor button{padding:8px 10px}
.team-editor button.danger{color:#a53d51;border-color:#eac7ce}
.team-editor label{display:none}

/* Lobby-only interactive team board. One board for mouse, keyboard and touch. */
.gl-teams-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:12px;margin:15px 0 7px}
.gl-team-zone{border:2px dashed #c3e4ea;background:#f9fdfd;border-radius:15px;min-width:0;padding:12px;transition:border-color .15s,background .15s}
.gl-team-zone.is-over,.gl-team-zone.is-target{border-color:#ed5fa5;background:#fff0f7}
.gl-team-head{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:4px 2px 12px;border-bottom:1px solid #dcebee;margin-bottom:10px}
.gl-team-heading{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.gl-team-heading strong{overflow-wrap:anywhere}
.gl-team-number{font-size:12px;color:#64838b;font-weight:700;white-space:nowrap}
.gl-team-member-list{min-height:72px;display:flex;flex-direction:column;gap:7px}
.gl-team-player{display:flex;align-items:center;gap:8px;background:white;border:1px solid #d5e7ea;border-radius:10px;padding:10px;cursor:grab;touch-action:pan-y;user-select:none;font-weight:700;min-width:0}
.gl-team-player:active{cursor:grabbing}
.gl-team-player:focus-visible,.gl-team-zone:focus-visible{outline:3px solid #ef83b5;outline-offset:2px}
.gl-team-player.is-dragging{opacity:.42}
.gl-team-player.is-selected{border-color:#ec5c9d;background:#ffedf6}
.gl-player-handle{color:#8197a1;flex:none;font-size:17px;letter-spacing:1px;cursor:grab;touch-action:none}
.gl-team-player-label{min-width:0;overflow-wrap:anywhere}
.gl-team-empty{text-align:center;color:#7b9ba5;padding:19px 5px;font-size:12px}
.gl-team-board-help{font-size:12px;color:#69848d;margin:12px 0}
.gl-team-move{display:flex;align-items:center;justify-content:center;border:1px solid #a6dbe4;background:#fff;min-height:35px;border-radius:9px;margin-top:9px;width:100%;font-size:12px}
.gl-team-move:disabled{opacity:.35}
.gl-team-touch-ghost{position:fixed;pointer-events:none;z-index:99999;background:#fff;border:2px solid #ec5c9d;padding:10px 16px;border-radius:11px;box-shadow:0 7px 24px #20435444;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.gl-teams-board{grid-template-columns:1fr 1fr;gap:8px}.gl-team-zone{padding:8px}.gl-team-heading{font-size:12px}.gl-team-player{padding:9px 6px;font-size:12px}.gl-team-head{gap:4px}.gl-team-heading .gl-character-logo{width:23px!important;height:23px!important}.gl-team-number{font-size:11px}}

.gl-logo-preview{display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;font-size:24px;vertical-align:middle}
.gl-logo-picker{position:relative;min-width:0}
.gl-logo-picker summary{display:flex;align-items:center;justify-content:center;cursor:pointer;list-style:none;padding:4px;border:1px solid #bddce1;border-radius:9px;background:#fff;min-height:43px}
.gl-logo-picker summary::-webkit-details-marker{display:none}
.gl-logo-picker[open] summary{border-color:#ed5fa5}
.gl-logo-gallery{position:absolute;z-index:50;right:0;top:calc(100% + 4px);display:grid;grid-template-columns:repeat(5,54px);gap:5px;max-width:min(92vw,305px);max-height:280px;overflow:auto;padding:10px;border:1px solid #c9e3e7;background:white;box-shadow:0 8px 25px #19394425;border-radius:13px}
.gl-logo-gallery button{display:grid;place-items:center;padding:4px;width:54px;height:52px;font-size:24px;overflow:hidden;color:inherit;border:1px solid transparent}
.gl-logo-gallery button[aria-pressed="true"]{border-color:#e85fa1;background:#fff0f7}
.gl-logo-gallery svg{width:39px!important;height:39px!important}

@media(max-width:560px){.team-editor{grid-template-columns:minmax(0,1fr) 70px auto}.team-editor .danger{grid-column:3}}

@media(max-width:750px){.grid,.two,.answers{grid-template-columns:1fr}header{padding:13px 16px}.panel{padding:15px}.pin{letter-spacing:4px}}

.gl-countdown-stage{position:fixed;inset:0;z-index:9998;background:radial-gradient(circle at center,#17446a 0%,#0b1429 72%);color:#fff;display:grid;place-items:center;padding:18px;text-align:center}
.gl-countdown-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.gl-countdown-kicker{font-size:clamp(18px,3vw,30px);font-weight:800;letter-spacing:.12em;color:#a4eaff}
.gl-countdown-number{font-size:clamp(130px,33vw,360px);font-weight:900;line-height:1;text-shadow:0 0 60px #f254aa88;color:#fff;font-variant-numeric:tabular-nums}
.gl-countdown-number.pulse{animation:gl-count-pulse .7s cubic-bezier(.15,.8,.25,1)}
.gl-countdown-sub{font-size:clamp(16px,2.4vw,26px);font-weight:700;color:#f5a6d2}
@keyframes gl-count-pulse{from{transform:scale(1.28);opacity:.65}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.gl-countdown-number.pulse{animation:none}}
body:fullscreen{overflow:auto}
body:fullscreen main{max-width:100%;padding:12px 22px}
body:fullscreen .grid{grid-template-columns:minmax(0,1.5fr) minmax(310px,1fr)}
body:fullscreen .question{font-size:clamp(28px,3.6vw,65px)}
body:fullscreen .answer{min-height:120px;font-size:clamp(19px,2vw,30px)}
@media(max-width:850px){body:fullscreen .grid{grid-template-columns:1fr}}

/* Genius Live: final outrun sunset — original CSS pixel art, not image assets. */
.gl-outro{position:relative;isolation:isolate;min-height:min(78vh,760px);border:4px solid #80eafb;border-radius:15px;overflow:hidden;background:#29144a;color:#fff;box-shadow:0 10px 35px #17274540;font-family:system-ui,sans-serif}
.gl-outro-sky{position:absolute;inset:0;background:linear-gradient(#1b153d 0%,#69306e 36%,#d75882 67%,#fa995f 85%,#542054 100%)}
.gl-outro-sun{position:absolute;top:12%;left:50%;width:min(36vw,310px);height:min(36vw,310px);min-width:155px;min-height:155px;border-radius:50%;transform:translateX(-50%);background:linear-gradient(#fff4aa,#ffcc71 40%,#ff9870 64%,#fd648e 90%);box-shadow:0 0 70px #fcb15d99;z-index:1}
.gl-outro-sun:after{content:"";position:absolute;inset:43% 0 0;background:repeating-linear-gradient(to bottom,transparent 0 12px,#ab416e 12px 18px);border-radius:0 0 50% 50%;clip-path:circle(50% at 50% 0%)}
.gl-outro-mountain{position:absolute;bottom:33%;width:100%;height:29%;background:#41215b;clip-path:polygon(0 66%,11% 37%,22% 68%,35% 28%,48% 64%,61% 30%,74% 74%,86% 33%,100% 69%,100% 100%,0 100%);z-index:2}
.gl-outro-mountain:after{content:"";display:block;height:100%;width:100%;background:#6b3289;transform:translateY(24px);clip-path:inherit}
.gl-outro-grid{position:absolute;inset:65% -40% -75%;transform:perspective(360px) rotateX(62deg);transform-origin:50% 0%;background:repeating-linear-gradient(90deg,transparent 0 8%,#fd58b6 8.15% 8.4%,transparent 8.55% 16%),repeating-linear-gradient(0deg,transparent 0 8%,#69eaff 8.2% 8.55%,transparent 8.8% 16%);background-color:#160e33;z-index:3}
.gl-outro-palm{position:absolute;bottom:32%;width:130px;height:230px;z-index:4;pointer-events:none;filter:drop-shadow(3px 4px 0 #0c0c20)}
.gl-outro-palm.left{left:1.4%}.gl-outro-palm.right{right:1.4%;transform:scaleX(-1)}
.gl-outro-palm .trunk{position:absolute;bottom:0;left:60px;width:16px;height:152px;background:#180e29;transform:rotate(12deg);transform-origin:bottom}
.gl-outro-palm .leaf{position:absolute;width:85px;height:17px;left:62px;top:68px;background:#170d29;transform-origin:left center;clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}
.gl-outro-palm .leaf:nth-child(2){transform:rotate(-42deg)}.gl-outro-palm .leaf:nth-child(3){transform:rotate(-10deg)}.gl-outro-palm .leaf:nth-child(4){transform:rotate(23deg)}.gl-outro-palm .leaf:nth-child(5){transform:rotate(65deg)}.gl-outro-palm .leaf:nth-child(6){transform:rotate(145deg)}
.gl-outro-title{position:absolute;top:3%;left:2%;right:2%;text-align:center;z-index:8;font-size:clamp(23px,4.3vw,60px);line-height:1.15;font-weight:1000;letter-spacing:.035em;color:#ffe27c;text-shadow:4px 4px 0 #69235a,0 0 25px #ff6aad}
.gl-outro-title small{display:block;font-size:clamp(10px,1.2vw,16px);letter-spacing:.2em;color:#98f9fc;text-shadow:2px 2px #202248;margin-bottom:10px}
.gl-outro-podiums{position:absolute;bottom:10%;left:3%;right:3%;z-index:7;display:flex;align-items:end;justify-content:center;gap:clamp(5px,2vw,22px);height:60%}
.gl-outro-slot{width:29%;max-width:280px;min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;text-align:center;filter:drop-shadow(5px 6px 0 #080a2599);opacity:0;animation:gl-podium-enter .75s steps(7) both}
.gl-outro-slot.third{animation-delay:.18s}.gl-outro-slot.second{animation-delay:1.1s}.gl-outro-slot.first{animation-delay:2.1s}
.gl-outro-emblem{margin:0 auto 5px;height:clamp(40px,6.4vw,77px);width:clamp(40px,6.4vw,77px);display:grid;place-items:center;font-size:clamp(30px,4vw,52px);filter:drop-shadow(0 4px 0 #1c1b32)}
.gl-outro-emblem .gl-character-logo{width:100%!important;height:100%!important}
.gl-outro-name{font-size:clamp(11px,1.7vw,22px);line-height:1.2;font-weight:900;text-shadow:2px 3px #141434;overflow-wrap:anywhere;padding:0 1px}
.gl-outro-points{font-size:clamp(11px,1.45vw,18px);line-height:1.4;font-weight:900;color:#b1ffff;text-shadow:2px 2px #121b35;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.gl-outro-block{height:clamp(66px,13vh,125px);display:flex;align-items:center;justify-content:center;background:linear-gradient(#6edaf8,#2773ce);border:5px solid #b2f8ff;box-shadow:inset -10px -10px #124a8b;color:#fff;font-size:clamp(28px,5vw,65px);font-weight:1000;text-shadow:4px 4px #222c58}
.gl-outro-slot.second .gl-outro-block{height:clamp(108px,19vh,180px);background:linear-gradient(#ff90ca,#b356c3);border-color:#ffb8eb;box-shadow:inset -10px -10px #7d369d}
.gl-outro-slot.first .gl-outro-block{height:clamp(145px,29vh,275px);background:linear-gradient(#ffe59a,#eea34c);border-color:#fff1b2;box-shadow:inset -10px -10px #bd6c35;color:#523056}
.gl-outro-slot.first .gl-outro-emblem{filter:drop-shadow(0 0 20px #fff9a1)}
.gl-outro-crown{font-size:clamp(20px,3vw,38px);height:clamp(26px,3vw,40px);color:#ffe681;font-weight:900;text-shadow:3px 3px #6d2b58;animation:gl-crown-bounce 1.1s steps(3) infinite}
.gl-outro-bottom{position:absolute;bottom:2%;left:0;right:0;text-align:center;color:#ffc6e9;font-size:clamp(9px,1.3vw,14px);font-weight:800;letter-spacing:.12em;z-index:8}
.gl-final-detail{margin:16px 0 24px;padding:18px;border:1px solid var(--border);border-radius:16px;background:white}
.gl-final-detail .score{padding:11px 4px}
@keyframes gl-podium-enter{from{transform:translateY(95%) scale(.83);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes gl-crown-bounce{50%{transform:translateY(-7px)}}
.gl-outro:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff0b 4px 5px)}
@media(max-width:650px){.gl-outro{min-height:490px}.gl-outro-podiums{left:2%;right:2%;bottom:10%;height:54%}.gl-outro-slot{width:32%}.gl-outro-block{border-width:3px}.gl-outro-palm{transform:scale(.7);transform-origin:left bottom}.gl-outro-palm.right{transform:scaleX(-.7)}.gl-outro-title{top:5%}}
@media(prefers-reduced-motion:reduce){.gl-outro-slot{animation:none;opacity:1}.gl-outro-crown{animation:none}}

/* Genius Live round reveal: projector-sized scoreboard; no duplicate scoring. */
.gl-reveal-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:clamp(9px,3vw,32px);background:radial-gradient(circle at 50% 5%,#2c5475 0%,#0a1429 65%,#070b19 100%);color:#f8fbff;overflow:auto}
.gl-reveal-content{width:min(960px,100%);max-height:100%;overflow-y:auto;position:relative}
.gl-reveal-kicker{text-align:center;font-size:clamp(12px,2vw,17px);letter-spacing:.22em;text-transform:uppercase;color:#9feaff;font-weight:800}
.gl-reveal-title{text-align:center;font-size:clamp(29px,5vw,58px);font-weight:900;letter-spacing:-.045em;margin:2px 0 6px;color:#fff;text-shadow:0 0 26px #50cfff88}
.gl-reveal-subtitle{text-align:center;font-size:clamp(12px,1.8vw,17px);color:#bfd4e9;min-height:24px;margin:0 0 22px}
.gl-reveal-rows{display:flex;flex-direction:column;gap:11px;margin:0 auto;max-width:860px}
.gl-reveal-row{background:linear-gradient(105deg,#192d4de8,#12213ce8);border:2px solid #58728b88;border-radius:17px;display:grid;grid-template-columns:clamp(36px,6vw,70px) minmax(0,1fr) auto;gap:clamp(7px,2vw,18px);align-items:center;padding:clamp(9px,1.5vw,16px);min-height:clamp(73px,10vh,103px);position:relative;will-change:transform}
.gl-reveal-row.is-first{background:linear-gradient(105deg,#69511f,#2a2941 65%,#172f4c);border-color:#ffca65;box-shadow:0 0 22px #ffcf6750}
.gl-reveal-row.is-gaining{box-shadow:0 0 22px #42d4ff66;border-color:#63e1ff}
.gl-reveal-rank{font-size:clamp(27px,5vw,47px);font-weight:900;text-align:center;color:#f4c65c}
.gl-reveal-name{display:flex;align-items:center;gap:clamp(5px,1.5vw,14px);min-width:0;font-size:clamp(16px,2.8vw,29px);font-weight:800;overflow-wrap:anywhere}
.gl-reveal-name .gl-character-logo{width:clamp(34px,5vw,56px)!important;height:clamp(34px,5vw,56px)!important}
.gl-reveal-score{display:flex;flex-direction:column;align-items:flex-end;min-width:96px}
.gl-reveal-number{font-size:clamp(22px,4vw,43px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.gl-reveal-unit{font-size:12px;font-weight:700;color:#b6cedc}
.gl-reveal-gain{color:#65f5b2;font-size:clamp(13px,2vw,20px);font-weight:900;font-variant-numeric:tabular-nums;min-height:24px}
.gl-reveal-footer{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0 4px}
.gl-reveal-footer button{background:#fff;color:#213a53;border:0;min-width:145px;font-size:15px;font-weight:800}
.gl-reveal-footer button.primary{background:#ffcd62;color:#19233a}
.gl-reveal-footer button:disabled{opacity:.5}
.gl-reveal-screen .gl-reveal-progress{height:4px;width:100%;max-width:850px;margin:17px auto 0;border-radius:4px;background:#ffffff26;overflow:hidden}
.gl-reveal-screen .gl-reveal-progress i{display:block;height:100%;background:#5de2ff;transform-origin:left;width:0}
.gl-reveal-screen .gl-scoreboard-confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}

 let draggedId=null,ghost=null,touch=null;

  document.querySelectorAll(".gl-team-zone").forEach(el=>el.classList.remove("is-over","is-target"));
  document.querySelectorAll(".gl-team-player").forEach(el=>el.classList.remove("is-dragging"));
  ghost?.remove();ghost=null;touch=null;draggedId=null;
 };
 document.querySelectorAll("[data-team-player]").forEach(el=>{
  const id=el.dataset.teamPlayer;
  el.onclick=()=>{if(!touch)selectPlayer(id)};
  el.onkeydown=e=>{
   if(e.key==="Enter"||e.key===" "){e.preventDefault();selectPlayer(id)}
  };
  el.addEventListener("dragstart",e=>{
   draggedId=id;e.dataTransfer.effectAllowed="move";
   e.dataTransfer.setData("text/plain",id);
   requestAnimationFrame(()=>el.classList.add("is-dragging"));
  });
  el.addEventListener("dragend",clear);
  // Touchscreen: drag only by the handle, leaving vertical list scrolling intact.
  const handle=el.querySelector(".gl-player-handle");
  handle?.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse"||e.button!==0)return;
   e.preventDefault();
   draggedId=id;
   touch={pointerId:e.pointerId,from:el,started:false,startX:e.clientX,startY:e.clientY};
   handle.setPointerCapture(e.pointerId);
  });
  handle?.addEventListener("pointermove",e=>{
   if(!touch||touch.pointerId!==e.pointerId)return;
   if(!touch.started&&Math.hypot(e.clientX-touch.startX,e.clientY-touch.startY)<9)return;
   touch.started=true;touch.from.classList.add("is-dragging");
   if(!ghost){ghost=document.createElement("div");ghost.className="gl-team-touch-ghost";ghost.textContent=state.players.find(p=>p.id===id)?.name||"Student";document.body.append(ghost)}
   ghost.style.left=(e.clientX+12)+"px";ghost.style.top=(e.clientY-22)+"px";
   const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-team-zone]");
   document.querySelectorAll(".gl-team-zone").forEach(x=>x.classList.toggle("is-target",x===zone&&Number(x.dataset.teamZone)>=0));
  });
  const finishTouch=e=>{
   if(!touch||touch.pointerId!==e.pointerId)return;
   const moved=touch.started;
   const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-team-zone]");
   const dest=zone?Number(zone.dataset.teamZone):-1;
   clear();
   if(moved&&dest>=0){move(id,dest)}

  handle?.addEventListener("pointerup",finishTouch);

 });
 document.querySelectorAll("[data-team-zone]").forEach(zone=>{

  });

   if(n<0)return;
   e.preventDefault();
   const id=draggedId||e.dataTransfer.getData("text/plain");
   clear();
   move(id,n);
  });

   if((e.key==="Enter"||e.key===" ")&&selectedLobbyPlayerId&&n>=0){e.preventDefault();move(selectedLobbyPlayerId,n)}

 });
 document.querySelectorAll("[data-move-to-team]").forEach(btn=>{

 // A selected player from a previous render should not remain selected after it moves.

// Server-authoritative points: subtract this question's awards from current scores
// to reconstruct the pre-round leaderboard even when reveal arrives via polling.
let lastAnimatedRound="",activeReveal=null;
function scoreboardRows(data){
 const gains=new Map((data.roundPoints||[]).map(x=>[x.playerId,Number(x.points)||0]));
 const teams=data.mode==="team";
 const rows=teams?Array.from({length:data.teamCount},(_,i)=>{
  const members=data.players.filter(p=>p.team===i),total=members.reduce((n,p)=>n+p.score,0);
  const delta=members.reduce((n,p)=>n+(gains.get(p.id)||0),0);
  const divisor=members.length||1;
  return {id:String(i),name:data.teamNames?.[i]||teamName(i),logo:data.teamLogos?.[i]||"⭐",count:members.length,
   end:members.length?total/divisor:0,start:members.length?(total-delta)/divisor:0,delta:members.length?delta/divisor:0};
 }):data.players.map(p=>{
  const delta=gains.get(p.id)||0;
  return{id:p.id,name:p.name,logo:null,count:1,end:p.score,start:p.score-delta,delta};
 });
 return rows;
}

 showRoundReveal(scoreboardRows(state),state.questionNumber,state.total,state.mode==="team");
}

 document.body.append(overlay);
 const rowsEl=overlay.querySelector(".gl-reveal-rows"),title=overlay.querySelector(".gl-reveal-title"),

 const raf=fn=>{const id=requestAnimationFrame(fn);frames.push(id);return id};

 const totalDuration=reduced?100:5000;

 }
 if(remaining===0&&!busy&&Date.now()-lastCountdownPoll>300){lastCountdownPoll=Date.now();refresh()}
}
let lastCountdownPoll=0;
function setupFullscreen(){
 const button=document.querySelector("#fullscreenToggle");
 button.onclick=async()=>{
  try{
   if(document.fullscreenElement)await document.exitFullscreen();
   else await document.body.requestFullscreen();
  }catch(e){notify("Fullscreen is blocked here. Try Open game in new tab.",true)}
 };
 document.addEventListener("fullscreenchange",()=>{button.textContent=document.fullscreenElement?"⛶ Exit fullscreen":"⛶ Fullscreen"});
}
setupFullscreen();

let finalFanfareKey="";
function podiumEntries(){
 const teamGame=state.mode==="team";
 const entries=teamGame?Array.from({length:state.teamCount},(_,i)=>{
  const people=state.players.filter(p=>p.team===i);
  return {id:i,name:teamName(i),logo:state.teamLogos?.[i]||"⭐",score:people.length?people.reduce((sum,p)=>sum+p.score,0)/people.length:0,count:people.length};
 }):state.players.map((p,i)=>({id:p.id,name:p.name,logo:null,score:p.score,count:1}));
 // Empty teams must never win or displace a team that actually participated.
 return entries.filter(x=>x.count>0).sort((a,b)=>b.score-a.score||String(a.name).localeCompare(String(b.name)));
}
function maybeFinalFanfare(){
 if(!state||state.status!=="finished")return;
 const key=state.pin+":"+state.total;
 if(finalFanfareKey===key)return;
 finalFanfareKey=key;
 // Audio follows the teacher's SFX setting and previously unlocked WebAudio context.
 if(revealSfx.enabled)setTimeout(()=>{if(state?.status==="finished"&&state.pin+":"+state.total===key)revealSfx.play("final")},1900);
}
function finished(){
 const players=state.players.slice().sort((a,b)=>b.score-a.score);
 const ranked=podiumEntries();
 // 2-1-3 order gives the familiar podium silhouette while still supporting small games.
 const positions=[{rank:2,cls:"second"},{rank:1,cls:"first"},{rank:3,cls:"third"}];
 const podium=positions.map(pos=>{
  const item=ranked[pos.rank-1];
  if(!item)return '<div class="gl-outro-slot '+pos.cls+'" aria-hidden="true"></div>';
  return '<div class="gl-outro-slot '+pos.cls+'">'+(pos.rank===1?'<div class="gl-outro-crown" aria-label="Winner">★ ★ ★</div>':'')+
  '<div class="gl-outro-emblem">'+(item.logo?logoVisual(item.logo,64):'<span aria-hidden="true">★</span>')+'</div>'+
  '<div class="gl-outro-name">'+esc(item.name)+'</div>'+
  '<div class="gl-outro-points">'+Math.round(item.score).toLocaleString()+(state.mode==="team"?" AVG PTS":" PTS")+'</div>'+
  '<div class="gl-outro-block">'+pos.rank+'</div></div>';
 }).join("");
 const extra=ranked.slice(3).map((p,i)=>'<div class="score"><span>'+(i+4)+'. '+(p.logo?logoVisual(p.logo,25)+' ':'')+esc(p.name)+'</span><b>'+Math.round(p.score).toLocaleString()+' pts</b></div>').join("");
 const palm='<div class="gl-outro-palm left" aria-hidden="true"><i class="trunk"></i>'+Array.from({length:5},()=>'<i class="leaf"></i>').join("")+'</div><div class="gl-outro-palm right" aria-hidden="true"><i class="trunk"></i>'+Array.from({length:5},()=>'<i class="leaf"></i>').join("")+'</div>';
 return '<section class="gl-outro" aria-label="Genius Live final standings">'+
 '<div class="gl-outro-sky"></div><div class="gl-outro-sun"></div><div class="gl-outro-mountain"></div><div class="gl-outro-grid"></div>'+palm+
 '<div class="gl-outro-title"><small>GENIUS LIVE · FINAL RESULTS</small>8-BIT CHAMPIONS</div>'+
 '<div class="gl-outro-podiums">'+podium+'</div><div class="gl-outro-bottom">CALIFORNIA SUNSET · '+esc(state.total)+' QUESTIONS COMPLETE</div></section>'+
 '<div class="gl-final-detail"><h2>Final standings</h2>'+leaderboard()+extra+
 '<details><summary style="cursor:pointer;font-weight:800;margin:14px 0">Individual scores ('+players.length+')</summary>'+
 players.map(p=>'<div class="score">'+esc(p.name)+'<b>'+Math.round(p.score).toLocaleString()+' pts</b></div>').join("")+'</details>'+
 '<p><button id="again" class="primary">Create another game</button></p></div>';
}
function paint(){if(!state){activeReveal?.close();gameMusic.setPhase("lobby");setup();return}if(state.status!=="reveal")activeReveal?.close();if(state.status==="countdown"&&lastCountdownKey!==state.pin+":"+state.questionNumber){lastCountdownKey=state.pin+":"+state.questionNumber;lastCountdownDigit=null;}gameMusic.setPhase(state.status==="countdown"?"lobby":state.status);maybeRoundReveal();maybeFinalFanfare();const key=roundStatus();if(key===lastView)return;lastView=key;$("#app").innerHTML=state.status==="lobby"?lobby():state.status==="countdown"?countdownMarkup():["question","reveal"].includes(state.status)?quiz():finished();
 const on=(id,fn)=>{const b=$("#"+id);if(b)b.onclick=fn};
 on("previewWords",togglePreview);on("start",()=>{revealSfx.unlock();doAction("start")});on("reveal",()=>doAction("reveal"));on("next",()=>doAction("next"));on("cancel",()=>{if(confirm("End this game?"))doAction("cancel")});
 on("hostAddTeam",()=>doAction("host_add_team"));
 document.querySelectorAll("[data-save-team]").forEach(button=>button.onclick=()=>{const i=Number(button.dataset.saveTeam);doAction("host_edit_team",{team:i,name:document.querySelector('[data-team-name="'+i+'"]').value,logo:document.querySelector('[data-team-logo="'+i+'"]').value})});
 document.querySelectorAll("[data-remove-team]").forEach(button=>button.onclick=()=>{const i=Number(button.dataset.removeTeam);const members=state.players.filter(p=>p.team===i).length;if(confirm('Remove '+teamName(i)+'? '+(members?members+' player(s) will move to another team.':'This team is empty.')))doAction("host_remove_team",{team:i})});
 on("addGhosts",()=>doAction("add_ghosts"));
 attachLogoPickers();
 on("balanceTeams",()=>doAction("balance_teams"));on("randomizeTeams",()=>doAction("randomize_teams"));
 wireTeamBoard();
 on("again",()=>{pin="";state=null;lastView="";sessionStorage.removeItem("genius.live.host.pin");setup()});
 if(state.status==="lobby")renderJoinQR();if(state.status==="countdown")updateCountdown();
 tick();
}
async function doAction(action,options={}){if(busy)return;if(action==="next"||action==="cancel"){activeReveal?.close()}busy=true;try{state=await api(action,{pin,...options});if(state.status==="cancelled"){pin="";state=null;sessionStorage.removeItem("genius.live.host.pin")}lastView="";autoReveal=false;paint()}catch(e){notify(e.message,true)}finally{busy=false}}
async function refresh(){if(!pin||busy)return;try{const simulation=!!(state?.simulation&&state.status==="question");try{state=await api(simulation?"simulate_ghosts":"state",{pin})}catch(e){if(!simulation||!/Simulation action not available in this round/i.test(e.message))throw e;state=await api("state",{pin})}if(!state.teacher)throw Error("This game belongs to another teacher.");if(state.status==="cancelled"){pin="";state=null;sessionStorage.removeItem("genius.live.host.pin")}paint()}catch(e){notify(e.message,true)}}
function tick(){if(!state||state.status!=="question")return;const rem=Math.max(0,Date.parse(state.deadline)-Date.now()),sec=Math.ceil(rem/1000),t=$("#timer"),bar=$("#timerBar");if(t)t.textContent=sec+"s";if(bar)bar.style.width=(100*rem/(state.seconds*1000))+"%";if(rem===0&&!autoReveal&&!busy){autoReveal=true;doAction("reveal")}}
async function login(){
 try{const session=await ensureTeacherSession();
  if(!session?.success){if(session?.temporary){notify("Connection problem. Your login has not been cleared. Reload to retry.",true);return}location.replace("/Teachers/login.html?redirect="+encodeURIComponent(location.pathname));return}
  const u=window.WillenaAPI.getApiUrl("/.netlify/functions/supabase_auth?action=get_role&user_id="+encodeURIComponent(session.user_id));
  const res=await window.WillenaAPI.fetch(u,{cache:"no-store"}),r=await res.json();
  if(!res.ok||!["teacher","admin"].includes(String(r.role||"").toLowerCase()))throw Error("Teacher access required.");
  ensureAuthRefresh();initialized=true;
  if(pin){await refresh();if(state){notify("");return}pin="";sessionStorage.removeItem("genius.live.host.pin")}
  notify("Loading books…");const data=await api("catalog");catalog=data.books||[];classes=data.classes||[];classBookIds=data.classBookIds||{};resetToClassBooks();notify("");setup();
 }catch(e){notify(e.message,true);$("#app").innerHTML='<div class="panel"><h2>Could not open Genius Live</h2><button id="retryLogin">Retry login</button> <a href="/Teachers/">Teachers Dashboard</a></div>';$("#retryLogin").onclick=login}}
setInterval(()=>{if(initialized&&pin&&document.visibilityState==="visible")refresh()},1800);
setInterval(tick,200);
setInterval(updateCountdown,100);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pin)refresh()});
login();
</script></body></html>
