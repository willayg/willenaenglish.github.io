<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Willena Content Review</title>
<script src="/students/api-gateway.js?v=20260819-review1"></script>
<script src="/js/api-config.js?v=20260819-review1"></script>
<link rel="stylesheet" href="/students/study/study.css?v=20260808-7">
<link rel="stylesheet" href="/students/study/study-overrides.css?v=20260808-1">
<link rel="stylesheet" href="/students/study/study-listening.css?v=20260816-sharedengine1">
<link rel="stylesheet" href="/students/study-v2/v2-activity-ux.css?v=20260817-instructioncard1">
<style>
:root{--ink:#172033;--navy:#10213d;--blue:#2563eb;--line:#d8e0ec;--bg:#f4f7fb;--muted:#667085;--good:#067647;--bad:#b42318;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.auth{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;display:grid;place-items:center;padding:24px}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 14px;box-shadow:0 2px 12px #10213d26}.top-inner{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}.top h1{font-size:18px;margin:0}.top small{opacity:.7}.shell{max-width:1100px;margin:auto;padding:14px}.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr;gap:9px;position:sticky;top:60px;z-index:15}.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 2px;color:var(--muted)}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px}.pill.good{color:var(--good);border-color:#abefc6;background:#ecfdf3}.review-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 30px #10213d0b}.review-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}.review-head h2{font-size:16px;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:3px}.engine-wrap{max-width:760px;margin:0 auto}.review-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid #edf1f5;margin-top:14px;padding-top:14px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;background:#e9eef6;color:var(--ink)}.btn.good{background:#ecfdf3;color:var(--good)}.btn.flag{background:#fff4e5;color:var(--warn)}.btn.archive{background:#fef3f2;color:var(--bad)}.btn.primary{background:var(--blue);color:#fff}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.nav .btn{min-width:110px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.drawer-back{position:fixed;inset:0;background:#10182866;z-index:50;display:none}.drawer-back.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(680px,100vw);background:#fff;display:flex;flex-direction:column}.drawer-head{background:var(--navy);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:14px;overflow:auto}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.field textarea{min-height:86px}.drawer-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;right:16px;bottom:16px;z-index:90;background:#101828;color:#fff;border-radius:11px;padding:11px 14px;display:none}.loading{opacity:.55;pointer-events:none}.raw{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#475467;background:#f8fafc;border-radius:10px;padding:8px;white-space:pre-wrap;word-break:break-word}
@media(max-width:760px){.top-inner{align-items:flex-start}.filters{grid-template-columns:1fr 1fr;top:59px;padding:8px}.shell{padding:8px}.review-card{padding:10px;border-radius:14px}.review-head{display:block}.review-actions .btn{flex:1 1 42%}.nav .btn{min-width:0;flex:1}.engine-wrap{width:100%}}
</style>
</head>
<body>
<div class="auth" id="auth"><div><h2>Checking teacher access…</h2><p id="authMsg">Please wait.</p></div></div>
<header class="top"><div class="top-inner"><div><h1>Content Review</h1><small>Uses the live Study activity engine · no scores recorded</small></div><button class="btn" id="openEditor">Curriculum Editor</button></div></header>
<main class="shell" id="app">
  <section class="filters">
    <select id="series"><option value="">All series</option></select>
    <select id="book"><option value="">Choose book</option></select>
    <select id="unit"><option value="">All units</option></select>
    <select id="type"><option value="">All activity types</option><option value="grammar">Grammar</option><option value="conversation">Question response</option><option value="vocabulary">Vocabulary</option><option value="listening">Listening</option><option value="reading">Reading</option><option value="sentence_building">Sentence building</option><option value="spelling">Spelling</option></select>
  </section>
  <div class="stats"><span class="pill" id="count">0 questions</span><span class="pill" id="position">—</span><span class="pill good" id="reviewed">0 reviewed</span><button class="btn" id="refresh">Refresh</button></div>
  <section class="review-card" id="card"><div class="empty">Choose a book to begin.</div></section>
  <div class="nav"><button class="btn" id="prev">← Previous</button><button class="btn good" id="good">✓ Good & next</button><button class="btn" id="next">Next →</button></div>
</main>
<div class="drawer-back" id="drawerBack"><section class="drawer"><div class="drawer-head"><b>Edit assessment item</b><button class="btn" id="closeDrawer">×</button></div><div class="drawer-body">
  <div class="field"><label>Prompt</label><textarea id="editPrompt"></textarea></div>
  <div class="field"><label>Context / instruction</label><textarea id="editContext"></textarea></div>
  <div class="field"><label>Correct answer</label><textarea id="editAnswer"></textarea></div>
  <div class="field"><label>Choices — one per line</label><textarea id="editChoices"></textarea></div>
  <div class="field"><label>Status</label><select id="editStatus"><option>published</option><option>review</option><option>draft</option><option>archived</option></select></div>
  <div class="field"><label>Raw metadata</label><div class="raw" id="rawMeta"></div></div>
</div><div class="drawer-foot"><button class="btn" id="cancelEdit">Cancel</button><button class="btn primary" id="saveEdit">Save & rerender</button></div></section></div>
<div class="toast" id="toast"></div>
<script src="/shared/learning-engine/activity-schema.js?v=20260816-sharedengine1"></script>
<script src="/shared/learning-engine/scoring.js?v=20260810-chunkspelling1"></script>
<script src="/shared/learning-engine/engine.js?v=20260816-sharedengine1"></script>
<script src="/shared/learning-engine/audio-playback.js?v=20260817-singleplay1"></script>
<script src="/students/study/study-question-bank.js?v=20260816-sharedengine1"></script>
<script>
(function(){
'use strict';
const DB='https://gxwfsqxyuufqtitspfqg.supabase.co';
const KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const HEADERS={apikey:KEY,Authorization:'Bearer '+KEY};
const ADMIN=DB+'/functions/v1/curriculum_admin';
const $=s=>document.querySelector(s);
let uid='',books=[],units=[],activities=[],rawById={},index=0,engine=null,currentBook=null;
const reviewedKey='willena-content-review:v1';
let reviewed=new Set(JSON.parse(localStorage.getItem(reviewedKey)||'[]'));
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.style.background=bad?'#912018':'#101828';t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2600)}
function text(v){return String(v==null?'':v).trim()}
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function seriesName(title){title=text(title);if(/^English Bus Starter/i.test(title))return'English Bus Starter';if(/^English Bus/i.test(title))return'English Bus';if(/^Let[’']?s Begin/i.test(title))return"Let's Begin";if(/^Let[’']?s Go/i.test(title))return"Let's Go";if(/^Come On Everyone/i.test(title))return'Come On Everyone';return title.replace(/\s+\d+$/,'')||'Other'}
async function rest(path){const r=await fetch(DB+'/rest/v1/'+path,{headers:HEADERS,cache:'no-store'});if(!r.ok)throw Error('Database '+r.status);return r.json()}
async function admin(body){const r=await fetch(ADMIN,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(j.error||'Update failed');return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}$('#auth').style.display='none';await loadBooks()}catch(e){$('#authMsg').textContent='Could not verify this account.'}}
async function loadBooks(){books=await rest('content_books?select=id,title,public_level,internal_level_id,status&status=in.(published,review)&order=title.asc');const series=[...new Set(books.map(b=>seriesName(b.title)))].sort();$('#series').innerHTML='<option value="">All series</option>'+series.map(s=>`<option>${esc(s)}</option>`).join('');renderBookOptions()}
function renderBookOptions(){const s=$('#series').value;const list=books.filter(b=>!s||seriesName(b.title)===s);$('#book').innerHTML='<option value="">Choose book</option>'+list.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');$('#unit').innerHTML='<option value="">All units</option>';activities=[];rawById={};index=0;render()}
async function chooseBook(){const id=$('#book').value;if(!id){activities=[];render();return}currentBook=books.find(b=>b.id===id)||null;units=await rest('content_units?select=id,book_id,unit_number,title,status&book_id=eq.'+encodeURIComponent(id)+'&status=in.(published,review)&order=unit_number.asc');$('#unit').innerHTML='<option value="">All units</option>'+units.map(u=>`<option value="${u.id}">Unit ${u.unit_number}${u.title?' · '+esc(u.title):''}</option>`).join('');await loadActivities()}
async function loadActivities(){if(!currentBook)return;$('#app').classList.add('loading');try{const chosen=$('#unit').value;const targets=chosen?units.filter(u=>u.id===chosen):units;const chunks=[];for(const u of targets){const ctx={bookId:currentBook.id,bookTitle:currentBook.title,unitId:u.id,unitNumber:u.unit_number};const rows=await window.WillenaStudyQuestionBank.loadUnit(Number(currentBook.public_level)||1,ctx);rows.forEach(a=>{a.__unit=u;chunks.push(a)})}activities=chunks;const ids=activities.filter(a=>a.sourceType==='assessment_item').map(a=>a.sourceId);rawById={};for(let p=0;p<ids.length;p+=150){const set=ids.slice(p,p+150);if(!set.length)continue;const rows=await rest('assessment_items?select=id,prompt_text,context_text,correct_answer,choices,status,item_type,metadata,is_flagged& id=in.'+encodeURIComponent('('+set.join(',')+')').replace('%20',''));rows.forEach(r=>rawById[r.id]=r)}applyType();index=0;render()}catch(e){toast(e.message,true);activities=[];render()}finally{$('#app').classList.remove('loading')}}
function applyType(){const t=$('#type').value;if(!t){window._reviewFiltered=activities.slice();return}window._reviewFiltered=activities.filter(a=>a.skill===t)}
function list(){return window._reviewFiltered||activities}
function render(){const arr=list();$('#count').textContent=arr.length+' questions';$('#reviewed').textContent=arr.filter(a=>reviewed.has(a.sourceId||a.id)).length+' reviewed';if(!arr.length){$('#position').textContent='—';$('#card').innerHTML='<div class="empty">'+($('#book').value?'No matching questions.':'Choose a book to begin.')+'</div>';return}if(index<0)index=0;if(index>=arr.length)index=arr.length-1;const a=arr[index],u=a.__unit||{};$('#position').textContent=(index+1)+' / '+arr.length;$('#card').innerHTML=`<div class="review-head"><div><h2>${esc(currentBook&&currentBook.title||'Book')} · Unit ${esc(u.unit_number||'—')}</h2><div class="meta">${esc(a.skill)} · ${esc(a.metadata&&a.metadata.question_form||'')} · ${esc(a.sourceId||a.id)}</div></div><span class="pill ${reviewed.has(a.sourceId||a.id)?'good':''}">${reviewed.has(a.sourceId||a.id)?'Reviewed':'Unreviewed'}</span></div><div class="engine-wrap" id="activityRoot"></div><div class="review-actions"><button class="btn good" data-action="good">✓ Good</button><button class="btn primary" data-action="edit">✎ Edit</button><button class="btn flag" data-action="flag">⚑ Flag</button><button class="btn archive" data-action="archive">Archive</button></div>`;engine=new window.WillenaActivityEngine($('#activityRoot'),{onAnswer:function(){}});engine.setActivity(a);$('#card').querySelector('[data-action="good"]').onclick=markGood;$('#card').querySelector('[data-action="edit"]').onclick=openEdit;$('#card').querySelector('[data-action="flag"]').onclick=flagCurrent;$('#card').querySelector('[data-action="archive"]').onclick=archiveCurrent}
function current(){const arr=list();return arr[index]||null}
function markGood(){const a=current();if(!a)return;reviewed.add(a.sourceId||a.id);localStorage.setItem(reviewedKey,JSON.stringify([...reviewed]));next();toast('Marked reviewed')}
function next(){const arr=list();if(!arr.length)return;if(index<arr.length-1)index++;render()}
function prev(){if(index>0)index--;render()}
async function flagCurrent(){const a=current();if(!a||a.sourceType!=='assessment_item')return toast('Only assessment items can be flagged',true);const msg=prompt('Flag note','Needs manual review');if(msg===null)return;try{await admin({action:'update',table:'assessment_items',id:a.sourceId,data:{is_flagged:true,flag_message:msg}});toast('Flagged');await loadActivities()}catch(e){toast('Could not flag here. Opening Curriculum Editor.',true);setTimeout(()=>location.href='/Teachers/tools/curriculum-editor/?assessment_id='+encodeURIComponent(a.sourceId),600)}}
async function archiveCurrent(){const a=current();if(!a||a.sourceType!=='assessment_item')return toast('Only assessment items can be archived',true);if(!confirm('Archive this question? It will stop appearing in the student activity bank.'))return;try{await admin({action:'update',table:'assessment_items',id:a.sourceId,data:{status:'archived'}});toast('Archived');await loadActivities()}catch(e){toast('Could not archive here. Opening Curriculum Editor.',true);setTimeout(()=>location.href='/Teachers/tools/curriculum-editor/?assessment_id='+encodeURIComponent(a.sourceId),600)}}
function openEdit(){const a=current();if(!a||a.sourceType!=='assessment_item')return toast('Generated fallback items are read-only here',true);const r=rawById[a.sourceId];if(!r)return toast('Could not load raw item',true);$('#editPrompt').value=r.prompt_text||'';$('#editContext').value=r.context_text||'';$('#editAnswer').value=typeof r.correct_answer==='string'?r.correct_answer:JSON.stringify(r.correct_answer||'');$('#editChoices').value=(Array.isArray(r.choices)?r.choices:[]).map(x=>typeof x==='string'?x:(x&&x.text)||'').join('\n');$('#editStatus').value=r.status||'published';$('#rawMeta').textContent=JSON.stringify(r.metadata||{},null,2);$('#drawerBack').classList.add('open')}
async function saveEdit(){const a=current();if(!a)return;const choices=$('#editChoices').value.split(/\n+/).map(text).filter(Boolean);const data={prompt_text:$('#editPrompt').value,context_text:$('#editContext').value||null,correct_answer:$('#editAnswer').value,choices:choices,status:$('#editStatus').value};try{await admin({action:'update',table:'assessment_items',id:a.sourceId,data:data});$('#drawerBack').classList.remove('open');toast('Saved');await loadActivities()}catch(e){toast('Save failed: '+e.message,true)}}
$('#series').addEventListener('change',renderBookOptions);$('#book').addEventListener('change',chooseBook);$('#unit').addEventListener('change',loadActivities);$('#type').addEventListener('change',function(){applyType();index=0;render()});$('#refresh').onclick=loadActivities;$('#next').onclick=next;$('#prev').onclick=prev;$('#good').onclick=markGood;$('#openEditor').onclick=()=>location.href='/Teachers/tools/curriculum-editor/';$('#closeDrawer').onclick=$('#cancelEdit').onclick=()=>$('#drawerBack').classList.remove('open');$('#drawerBack').addEventListener('click',e=>{if(e.target===$('#drawerBack'))$('#drawerBack').classList.remove('open')});$('#saveEdit').onclick=saveEdit;
verify();
})();
</script>
</body>
</html>
