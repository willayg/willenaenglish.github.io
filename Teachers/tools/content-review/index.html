<style>
:root{--ink:#172033;--navy:#10213d;--blue:#2563eb;--line:#d8e0ec;--bg:#f4f7fb;--muted:#667085;--good:#067647;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.auth{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;display:grid;place-items:center;padding:24px}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 14px;box-shadow:0 2px 12px #10213d26}.top-inner{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}.top h1{font-size:18px;margin:0}.top small{opacity:.7}.shell{max-width:1100px;margin:auto;padding:14px}.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr;gap:9px;position:sticky;top:60px;z-index:15}.filters select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 2px;color:var(--muted)}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px}.pill.good{color:var(--good);border-color:#abefc6;background:#ecfdf3}.review-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 30px #10213d0b}.review-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}.review-head h2{font-size:16px;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:3px}.engine-wrap{max-width:760px;margin:0 auto}.review-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid #edf1f5;margin-top:14px;padding-top:14px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;background:#e9eef6;color:var(--ink)}.btn.good{background:#ecfdf3;color:var(--good)}.btn.flag{background:#fff4e5;color:var(--warn)}.btn.archive{background:#fef3f2;color:var(--bad)}.btn.primary{background:var(--blue);color:#fff}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.nav .btn{min-width:110px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.drawer-back{position:fixed;inset:0;background:#10182866;z-index:50;display:none}.drawer-back.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(680px,100vw);background:#fff;display:flex;flex-direction:column}.drawer-head{background:var(--navy);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:14px;overflow:auto}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.field textarea{min-height:86px}.drawer-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;right:16px;bottom:16px;z-index:90;background:#101828;color:#fff;border-radius:11px;padding:11px 14px;display:none}.loading{opacity:.55;pointer-events:none}.raw{font:12px/1.45 ui-monospace,monospace;color:#475467;background:#f8fafc;border-radius:10px;padding:8px;white-space:pre-wrap;word-break:break-word}
@media(max-width:760px){body{height:100dvh;overflow:hidden}.top{position:relative;padding:7px 9px}.top-inner{align-items:center}.top h1{font-size:15px}.top small{display:none}#openEditor{padding:7px 9px;font-size:11px}.shell{height:calc(100dvh - 47px);padding:5px 5px 66px;display:flex;flex-direction:column;overflow:hidden}.filters{position:relative;top:auto;z-index:2;grid-template-columns:1fr 1fr;padding:5px;gap:5px;border-radius:10px;flex:0 0 auto}.filters select{padding:7px 7px;font-size:12px;border-radius:8px}.stats{margin:5px 0;gap:4px;flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.stats::-webkit-scrollbar{display:none}.pill{padding:3px 7px;font-size:11px;white-space:nowrap}#refresh{display:none}.review-card{flex:1 1 auto;min-height:0;overflow:auto;padding:6px;border-radius:12px}.review-head{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}.review-head h2{font-size:12px;line-height:1.25}.review-head .pill{font-size:10px;padding:2px 6px}.meta{font-size:9.5px;line-height:1.25;margin-top:2px;word-break:break-all}.engine-wrap{width:100%;max-width:none}.review-actions{position:sticky;bottom:0;z-index:3;background:#fff;margin-top:6px;padding-top:6px;gap:4px;flex-wrap:nowrap}.review-actions .btn{flex:1 1 0;min-width:0;padding:7px 4px;font-size:10px;white-space:nowrap}.nav{position:fixed;left:5px;right:5px;bottom:max(5px,env(safe-area-inset-bottom));z-index:40;margin:0;padding:5px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 28px #10182824}.nav .btn{min-width:0;flex:1;padding:10px 5px;font-size:12px}.empty{padding:24px 10px}.drawer{height:100dvh}.drawer-body{padding:10px}.drawer-foot{padding:8px}}
</style>

<body>
<div class="auth" id="auth"><div><h2>Checking teacher access…</h2><p id="authMsg">Please wait.</p></div></div>
<header class="top"><div class="top-inner"><div><h1>Content Review</h1><small>Live Study activity engine · no scores recorded</small></div><button class="btn" id="openEditor">Curriculum Editor</button></div></header>
<main class="shell" id="app">
<section class="filters"><select id="series"><option value="">All series</option></select><select id="book"><option value="">Choose book</option></select><select id="unit"><option value="">All units</option></select><select id="type"><option value="">All activity types</option><option value="grammar">Grammar</option><option value="conversation">Question response</option><option value="vocabulary">Vocabulary</option><option value="listening">Listening</option><option value="reading">Reading</option><option value="sentence_building">Sentence building</option><option value="spelling">Spelling</option></select></section>
<div class="stats"><span class="pill" id="count">0 questions</span><span class="pill" id="position">—</span><span class="pill good" id="reviewed">0 reviewed</span><button class="btn" id="refresh">Refresh</button></div>
<section class="review-card" id="card"><div class="empty">Choose a book to begin.</div></section>
<div class="nav"><button class="btn" id="prev">← Previous</button><button class="btn good" id="good">✓ Good & next</button><button class="btn" id="next">Next →</button></div>
</main>
<div class="drawer-back" id="drawerBack"><section class="drawer"><div class="drawer-head"><b>Edit assessment item</b><button class="btn" id="closeDrawer">×</button></div><div class="drawer-body"><div class="field"><label>Prompt</label><textarea id="editPrompt"></textarea></div><div class="field"><label>Context / instruction</label><textarea id="editContext"></textarea></div><div class="field"><label>Correct answer</label><textarea id="editAnswer"></textarea></div><div class="field"><label>Choices — one per line</label><textarea id="editChoices"></textarea></div><div class="field"><label>Status</label><select id="editStatus"><option>published</option><option>review</option><option>draft</option><option>archived</option></select></div><div class="field"><label>Raw metadata</label><div class="raw" id="rawMeta"></div></div></div><div class="drawer-foot"><button class="btn" id="cancelEdit">Cancel</button><button class="btn primary" id="saveEdit">Save & rerender</button></div></section></div>
<div class="toast" id="toast"></div>
