<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Content | Willena Curriculum Studio</title>
<script src="/students/api-gateway.js?v=20260729b"></script><script src="/js/api-config.js?v=20260729b"></script>
<style>
:root{--navy:#10213d;--blue:#2563eb;--bg:#f3f6fb;--line:#d8e0ec;--ink:#172033;--muted:#667085;--green:#067647;--amber:#b54708;--purple:#6941c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}header{background:var(--navy);color:#fff;padding:14px 18px}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between}.top a{color:#fff}.shell{max-width:1500px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar,.summary{display:flex;gap:8px;flex-wrap:wrap;padding:12px}.toolbar input{min-width:260px;flex:1}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px}.layout{display:grid;grid-template-columns:320px 1fr;border-top:1px solid var(--line);min-height:620px}.tree{border-right:1px solid var(--line);padding:10px}.tree button{width:100%;text-align:left;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer}.tree button.active{background:#e8efff;color:#1849a9;font-weight:800}.series-row,.book-row{display:flex;align-items:center;gap:6px}.series-row{margin-top:5px;background:#f6f8fc!important;font-weight:850}.series-row .caret,.book-row .caret{display:inline-block;width:16px;color:var(--muted);transition:transform .15s}.series-row.expanded .caret,.book-row.expanded .caret{transform:rotate(90deg)}.series-books,.book-units{display:none}.series-books.open,.book-units.open{display:block}.tree .book-row{padding-left:22px}.tree .unit{padding-left:50px}.content{overflow:auto}.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:18px}.book-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px 18px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(16,33,61,.05)}.book-card h3{margin:0;font-size:18px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{background:#f7f9fc;font-size:11px;text-transform:uppercase}.main{font-weight:800}.translation{margin-top:4px;color:#1f4b99;font-weight:700}.sub{font-size:12px;color:var(--muted)}.status-pill,.type-pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-weight:750}.status-pill.review{background:#fff4e5;color:var(--amber)}.status-pill.approved,.status-pill.published{background:#ecfdf3;color:var(--green)}.dialogue{margin-top:7px;padding:9px;border:1px solid #e4e7ec;border-radius:9px;background:#fafbfc}.speaker{font-weight:800}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:50}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.layout{display:block}.tree{border-right:0;border-bottom:1px solid var(--line)}.toolbar input{min-width:100%}.book-cards{grid-template-columns:1fr}}
</style></head><body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header><div class="top"><div><b>Willena Curriculum Studio</b> · Book Content</div><a href="/Teachers/tools/curriculum-editor/">← Main Studio</a></div></header>
<div class="shell" id="app"><section class="panel"><div class="toolbar"><input id="searchInput" placeholder="Search English or Korean book content…"><select id="typeFilter"><option value="">All content types</option><option value="lexical_entry">Vocabulary</option><option value="sentence">Sentences</option><option value="pattern">Patterns</option><option value="dialogue">Dialogues</option></select><select id="statusFilter"><option value="">All statuses</option><option value="review">Review</option><option value="approved">Approved</option><option value="published">Published</option><option value="draft">Draft</option></select><button class="btn primary" id="refreshBtn">Refresh</button></div><div class="summary" id="summary"></div><div class="layout"><aside class="tree" id="tree"></aside><div class="content"><div class="book-cards" id="bookCards"></div><table id="contentTable"><thead><tr><th>Source content</th><th>Type</th><th>Location</th><th>Level</th><th>Status</th><th>Linked record</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" style="display:none;padding:40px;text-align:center">No matching content.</div></div></div></section></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';const $=id=>document.getElementById(id);const els={auth:$('auth'),authmsg:$('authmsg'),app:$('app'),search:$('searchInput'),type:$('typeFilter'),status:$('statusFilter'),refresh:$('refreshBtn'),summary:$('summary'),tree:$('tree'),cards:$('bookCards'),tbody:$('tbody'),empty:$('empty'),table:$('contentTable')};let uid='',rows=[],selectedBook='',selectedUnit='';const expandedSeries=new Set(),expandedBooks=new Set();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}els.auth.style.display='none';await load()}catch(e){els.authmsg.textContent='Could not verify this account: '+e.message}}
async function load(){els.app.classList.add('loading');try{const [catalog,dialogues]=await Promise.all([call({action:'list_catalog'}),call({action:'list_dialogues'})]);rows=[...(catalog.data||[]),...(dialogues.data||[]).map(d=>({...d,occurrence_type:'dialogue',source_text:d.title,dialogue_turns:d.turns||[]}))];buildTree();render()}finally{els.app.classList.remove('loading')}}
function hierarchy(){const out=new Map();for(const r of rows){const series=r.series_name||'Other';if(!out.has(series))out.set(series,new Map());const books=out.get(series),book=r.book_title||'Untitled book';if(!books.has(book))books.set(book,new Map());books.get(book).set(`${r.unit_number}|${r.unit_title}`,true)}return out}
function buildTree(){let h='<button class="active" data-all="1">All books</button>';for(const [series,books] of hierarchy()){const so=expandedSeries.has(series);h+=`<button class="series-row ${so?'expanded':''}" data-series="${esc(series)}"><span class="caret">▶</span>${esc(series)}</button><div class="series-books ${so?'open':''}">`;for(const [book,units] of books){const bo=expandedBooks.has(book);h+=`<button class="book-row ${bo?'expanded':''}" data-book="${esc(book)}"><span class="caret">▶</span><b>${esc(book)}</b></button><div class="book-units ${bo?'open':''}">`;for(const key of units.keys()){const [n,title]=key.split('|');h+=`<button class="unit" data-unit-book="${esc(book)}" data-unit="${esc(n)}">Unit ${esc(n)} · ${esc(title)}</button>`}h+='</div>'}h+='</div>'}els.tree.innerHTML=h;els.tree.querySelector('[data-all]').onclick=()=>{selectedBook='';selectedUnit='';render();buildTree()};els.tree.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{const s=b.dataset.series;expandedSeries.has(s)?expandedSeries.delete(s):expandedSeries.add(s);buildTree()});els.tree.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const book=b.dataset.book;expandedBooks.has(book)?expandedBooks.delete(book):expandedBooks.add(book);selectedBook=book;selectedUnit='';const row=rows.find(r=>r.book_title===book);if(row)expandedSeries.add(row.series_name||'Other');buildTree();render()});els.tree.querySelectorAll('[data-unit-book]').forEach(b=>b.onclick=()=>{selectedBook=b.dataset.unitBook;selectedUnit=b.dataset.unit;render()})}
function filtered(){const q=els.search.value.trim().toLowerCase(),t=els.type.value,s=els.status.value;return rows.filter(r=>(!selectedBook||r.book_title===selectedBook)&&(!selectedUnit||String(r.unit_number)===selectedUnit)&&(!t||r.occurrence_type===t)&&(!s||r.status===s)&&(!q||[r.series_name,r.book_title,r.unit_title,r.section_name,r.source_text,r.translation_ko,r.source_key,r.activity_label,r.language_function].some(v=>String(v??'').toLowerCase().includes(q))))}
function render(){const data=filtered(),all=!selectedBook&&!selectedUnit;els.summary.innerHTML=all?`<span class="chip"><b>${new Set(data.map(r=>r.series_name)).size}</b> series</span><span class="chip"><b>${new Set(data.map(r=>r.book_title)).size}</b> books</span>`:`<span class="chip"><b>${data.length}</b> items</span><span class="chip"><b>${new Set(data.map(r=>r.unit_number)).size}</b> units</span>`;if(all){const books=[...new Set(data.map(r=>r.book_title))];els.cards.innerHTML=books.map(title=>`<button class="book-card" data-card="${esc(title)}"><h3>${esc(title)}</h3></button>`).join('');els.cards.querySelectorAll('[data-card]').forEach(c=>c.onclick=()=>{selectedBook=c.dataset.card;const row=rows.find(r=>r.book_title===selectedBook);if(row)expandedSeries.add(row.series_name||'Other');expandedBooks.add(selectedBook);buildTree();render()});els.cards.style.display='grid';els.table.style.display='none';return}els.cards.style.display='none';els.tbody.innerHTML=data.map(r=>`<tr><td><div class="main">${esc(r.source_text)}</div>${r.translation_ko?`<div class="translation" lang="ko">${esc(r.translation_ko)}</div>`:''}<div class="sub">${esc(r.series_name)} · ${esc(r.book_title)}</div></td><td><span class="type-pill">${esc(r.occurrence_type)}</span></td><td>Unit ${esc(r.unit_number)} · ${esc(r.unit_title)}</td><td>Public ${esc(r.public_level??'—')}<div class="sub">DB ${esc(r.internal_level_id??'—')}</div></td><td><span class="status-pill ${esc(r.status)}">${esc(r.status)}</span></td><td><div class="sub">${esc(r.source_key||'')}</div></td></tr>`).join('');els.table.style.display=data.length?'table':'none';els.empty.style.display=data.length?'none':'block'}
els.search.oninput=render;els.type.onchange=render;els.status.onchange=render;els.refresh.onclick=load;verify();
</script></body></html>
