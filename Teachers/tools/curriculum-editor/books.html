<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Content | Willena Curriculum Studio</title>
<script src="/students/api-gateway.js?v=20260729b"></script>
<script src="/js/api-config.js?v=20260729b"></script>
<style>
:root{--navy:#10213d;--blue:#2563eb;--bg:#f3f6fb;--line:#d8e0ec;--ink:#172033;--muted:#667085;--green:#067647;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}header{background:var(--navy);color:white;padding:14px 18px}.top{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:white;text-decoration:none}.shell{max-width:1500px;margin:auto;padding:14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px}.toolbar input{min-width:260px;flex:1}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:white}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer;background:#e9eef6}.primary{background:var(--blue);color:white}.summary{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}.layout{display:grid;grid-template-columns:300px 1fr;border-top:1px solid var(--line);min-height:620px}.tree{border-right:1px solid var(--line);padding:10px;overflow:auto}.tree button{width:100%;text-align:left;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer}.tree button.active{background:#e8efff;color:#1849a9;font-weight:800}.tree .book{font-weight:850}.tree .unit{padding-left:24px}.content{overflow:auto}.empty{padding:40px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;font-size:11px;text-transform:uppercase;z-index:2}.main{font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.status{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-weight:750}.status.review{background:#fff4e5;color:var(--amber)}.status.published,.status.approved{background:#ecfdf3;color:var(--green)}.auth{position:fixed;inset:0;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;z-index:50}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.layout{display:block}.tree{border-right:0;border-bottom:1px solid var(--line);max-height:240px}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header><div class="top"><div><b>Willena Curriculum Studio</b> · Book Content</div><div><a href="/Teachers/tools/curriculum-editor/">← Main Studio</a></div></div></header>
<div class="shell" id="app">
<section class="panel">
<div class="toolbar">
<input id="search" placeholder="Search book content, section, page or source key…">
<select id="type"><option value="">All content types</option><option value="lexical_entry">Vocabulary</option><option value="sentence">Sentences</option><option value="pattern">Patterns</option></select>
<select id="status"><option value="">All statuses</option><option value="review">Review</option><option value="approved">Approved</option><option value="published">Published</option><option value="draft">Draft</option></select>
<button class="btn primary" id="refresh">Refresh</button>
</div>
<div class="summary" id="summary"></div>
<div class="layout">
<aside class="tree" id="tree"></aside>
<div class="content"><table><thead><tr><th>Source content</th><th>Type</th><th>Location</th><th>Level</th><th>Status</th><th>Linked record</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" style="display:none">No matching content.</div></div>
</div>
</section>
</div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';
const $=s=>document.querySelector(s);let uid='',rows=[],selectedBook='',selectedUnit='';
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid)),j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}auth.style.display='none';load()}catch(e){authmsg.textContent='Could not verify this account.'}}
async function load(){app.classList.add('loading');try{rows=(await call({action:'list_catalog'})).data||[];buildTree();render()}catch(e){tbody.innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`}finally{app.classList.remove('loading')}}
function buildTree(){const books=new Map();rows.forEach(r=>{if(!books.has(r.book_title))books.set(r.book_title,new Map());books.get(r.book_title).set(`${r.unit_number}|${r.unit_title}`,true)});let h='<button class="book active" data-book="" data-unit="">All books</button>';for(const [book,units] of books){h+=`<button class="book" data-book="${esc(book)}" data-unit="">${esc(book)}</button>`;for(const key of units.keys()){const [n,title]=key.split('|');h+=`<button class="unit" data-book="${esc(book)}" data-unit="${esc(n)}">Unit ${esc(n)} · ${esc(title)}</button>`}}tree.innerHTML=h;tree.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedBook=b.dataset.book||'';selectedUnit=b.dataset.unit||'';tree.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function filtered(){const q=search.value.trim().toLowerCase(),t=type.value,s=status.value;return rows.filter(r=>(!selectedBook||r.book_title===selectedBook)&&(!selectedUnit||String(r.unit_number)===selectedUnit)&&(!t||r.occurrence_type===t)&&(!s||r.status===s)&&(!q||[r.series_name,r.book_title,r.unit_title,r.section_name,r.source_text,r.source_key,r.activity_label,r.page_number].some(v=>String(v??'').toLowerCase().includes(q))))}
function render(){const data=filtered();summary.innerHTML=`<span class="chip"><b>${data.length}</b> items</span><span class="chip"><b>${new Set(data.map(r=>r.unit_number)).size}</b> units</span><span class="chip">Public Level <b>${data[0]?.public_level??'—'}</b></span><span class="chip">Internal level <b>${data[0]?.internal_level_id??'—'}</b></span>`;tbody.innerHTML=data.map(r=>{const linked=r.lexical_entry_id||r.sentence_id||r.pattern_id||'';return `<tr><td><div class="main">${esc(r.source_text)}</div><div class="sub">${esc(r.series_name)} · ${esc(r.book_title)}</div></td><td>${esc(r.occurrence_type)}</td><td><div>Unit ${esc(r.unit_number)} · ${esc(r.unit_title)}</div><div class="sub">${esc(r.section_name||'Unsectioned')}${r.page_number?` · p. ${esc(r.page_number)}`:''}${r.track_number?` · track ${esc(r.track_number)}`:''}</div></td><td>Public ${esc(r.public_level??'—')}<div class="sub">DB ${esc(r.internal_level_id??'—')} · ${esc(r.internal_level_name||'')}</div></td><td><span class="status ${esc(r.status)}">${esc(r.status)}</span></td><td><div class="sub">${linked?esc(linked):'Not linked'}</div><div class="sub">${esc(r.source_key||'')}</div></td></tr>`}).join('');empty.style.display=data.length?'none':'block';tbody.parentElement.style.display=data.length?'table':'none'}
[search,type,status].forEach(el=>el.addEventListener(el===search?'input':'change',render));refresh.onclick=load;verify();
</script>
</body>
</html>
