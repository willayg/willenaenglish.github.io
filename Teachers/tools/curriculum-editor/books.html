<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Content | Willena Curriculum Studio</title>
<script src="/students/api-gateway.js?v=20260729b"></script>
<script src="/js/api-config.js?v=20260729b"></script>
<style>
:root{--navy:#10213d;--blue:#2563eb;--bg:#f3f6fb;--line:#d8e0ec;--ink:#172033;--muted:#667085;--green:#067647;--amber:#b54708;--purple:#6941c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}header{background:var(--navy);color:#fff;padding:14px 18px}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between}.top a{color:#fff}.shell{max-width:1500px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar,.summary{display:flex;gap:8px;flex-wrap:wrap;padding:12px}.toolbar input{min-width:260px;flex:1}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px}.layout{display:grid;grid-template-columns:300px 1fr;border-top:1px solid var(--line);min-height:620px}.tree{border-right:1px solid var(--line);padding:10px}.tree button{width:100%;text-align:left;border:0;background:none;padding:9px;border-radius:8px}.tree button.active{background:#e8efff;color:#1849a9;font-weight:800}.tree .unit{padding-left:24px}.content{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{background:#f7f9fc;font-size:11px;text-transform:uppercase}.main{font-weight:800}.sub{font-size:12px;color:var(--muted)}.status-pill,.type-pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-weight:750}.status-pill.review{background:#fff4e5;color:var(--amber)}.status-pill.approved,.status-pill.published{background:#ecfdf3;color:var(--green)}.type-pill.dialogue{background:#f4f3ff;color:var(--purple);border-color:#d9d6fe}.dialogue{margin-top:7px;padding:9px;border:1px solid #e4e7ec;border-radius:9px;background:#fafbfc}.turn{margin:3px 0}.speaker{font-weight:800;color:#344054}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:50}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.layout{display:block}.tree{border-right:0;border-bottom:1px solid var(--line)}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header><div class="top"><div><b>Willena Curriculum Studio</b> · Book Content</div><a href="/Teachers/tools/curriculum-editor/">← Main Studio</a></div></header>
<div class="shell" id="app"><section class="panel">
<div class="toolbar"><input id="searchInput" placeholder="Search book content, dialogue, section, page or source key…"><select id="typeFilter"><option value="">All content types</option><option value="lexical_entry">Vocabulary</option><option value="sentence">Sentences</option><option value="pattern">Patterns</option><option value="dialogue">Dialogues</option></select><select id="statusFilter"><option value="">All statuses</option><option value="review">Review</option><option value="approved">Approved</option><option value="published">Published</option><option value="draft">Draft</option></select><button class="btn primary" id="refreshBtn">Refresh</button></div>
<div class="summary" id="summary"></div><div class="layout"><aside class="tree" id="tree"></aside><div class="content"><table id="contentTable"><thead><tr><th>Source content</th><th>Type</th><th>Location</th><th>Level</th><th>Status</th><th>Linked record</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" style="display:none;padding:40px;text-align:center">No matching content.</div></div></div>
</section></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';
const els={auth:document.getElementById('auth'),authmsg:document.getElementById('authmsg'),app:document.getElementById('app'),search:document.getElementById('searchInput'),type:document.getElementById('typeFilter'),status:document.getElementById('statusFilter'),refresh:document.getElementById('refreshBtn'),summary:document.getElementById('summary'),tree:document.getElementById('tree'),tbody:document.getElementById('tbody'),empty:document.getElementById('empty'),table:document.getElementById('contentTable')};
let uid='',rows=[],selectedBook='',selectedUnit='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}els.auth.style.display='none';await load()}catch(e){els.authmsg.textContent='Could not verify this account: '+e.message}}
async function load(){els.app.classList.add('loading');try{const [catalog,dialogues]=await Promise.all([call({action:'list_catalog'}),call({action:'list_dialogues'})]);const dialogueRows=(dialogues.data||[]).map(d=>({...d,occurrence_type:'dialogue',source_text:d.title,dialogue_turns:d.turns||[],sentence_id:null,pattern_id:null,lexical_entry_id:null}));rows=[...(catalog.data||[]),...dialogueRows];buildTree();render()}catch(e){els.tbody.innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`;els.auth.style.display='none'}finally{els.app.classList.remove('loading')}}
function buildTree(){const books=new Map();for(const r of rows){if(!books.has(r.book_title))books.set(r.book_title,new Map());books.get(r.book_title).set(`${r.unit_number}|${r.unit_title}`,true)}let h='<button class="active" data-book="" data-unit="">All books</button>';for(const [book,units] of books){h+=`<button data-book="${esc(book)}" data-unit=""><b>${esc(book)}</b></button>`;for(const key of units.keys()){const [n,title]=key.split('|');h+=`<button class="unit" data-book="${esc(book)}" data-unit="${esc(n)}">Unit ${esc(n)} · ${esc(title)}</button>`}}els.tree.innerHTML=h;els.tree.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selectedBook=b.dataset.book||'';selectedUnit=b.dataset.unit||'';els.tree.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()}))}
function filtered(){const q=els.search.value.trim().toLowerCase(),t=els.type.value,s=els.status.value;return rows.filter(r=>{const dialogueText=(r.dialogue_turns||[]).map(x=>`${x.speaker_label||''} ${x.source_text||''}`).join(' ');return(!selectedBook||r.book_title===selectedBook)&&(!selectedUnit||String(r.unit_number)===selectedUnit)&&(!t||r.occurrence_type===t)&&(!s||r.status===s)&&(!q||[r.series_name,r.book_title,r.unit_title,r.section_name,r.source_text,r.source_key,r.activity_label,r.page_number,r.language_function,dialogueText].some(v=>String(v??'').toLowerCase().includes(q)))})}
function dialogueHtml(r){if(r.occurrence_type!=='dialogue')return'';return `<div class="dialogue">${(r.dialogue_turns||[]).map(t=>`<div class="turn"><span class="speaker">${esc(t.speaker_label||`Speaker ${t.turn_number}`)}:</span> ${esc(t.source_text)}</div>`).join('')}</div>`}
function render(){const data=filtered();const dialogueCount=data.filter(r=>r.occurrence_type==='dialogue').length;els.summary.innerHTML=`<span class="chip"><b>${data.length}</b> items</span><span class="chip"><b>${dialogueCount}</b> dialogues</span><span class="chip"><b>${new Set(data.map(r=>r.unit_number)).size}</b> units</span><span class="chip">Public Level <b>${data[0]?.public_level??'—'}</b></span><span class="chip">Internal level <b>${data[0]?.internal_level_id??'—'}</b></span>`;els.tbody.innerHTML=data.map(r=>{const linked=r.lexical_entry_id||r.sentence_id||r.pattern_id||'';const linkText=r.occurrence_type==='dialogue'?`${r.turn_count||0} turns · ${(r.dialogue_turns||[]).filter(t=>t.sentence_id).length} sentence links`:(linked?linked:'Not linked');return `<tr><td><div class="main">${esc(r.source_text)}</div><div class="sub">${esc(r.series_name)} · ${esc(r.book_title)}${r.language_function?` · ${esc(r.language_function)}`:''}</div>${dialogueHtml(r)}</td><td><span class="type-pill ${esc(r.occurrence_type)}">${esc(r.occurrence_type)}</span></td><td>Unit ${esc(r.unit_number)} · ${esc(r.unit_title)}<div class="sub">${esc(r.section_name||'Unsectioned')}${r.page_number?` · p. ${esc(r.page_number)}`:''}${r.track_number?` · track ${esc(r.track_number)}`:''}</div></td><td>Public ${esc(r.public_level??'—')}<div class="sub">DB ${esc(r.internal_level_id??'—')} · ${esc(r.internal_level_name||'')}</div></td><td><span class="status-pill ${esc(r.status)}">${esc(r.status)}</span></td><td><div class="sub">${esc(linkText)}</div><div class="sub">${esc(r.source_key||'')}</div></td></tr>`}).join('');els.empty.style.display=data.length?'none':'block';els.table.style.display=data.length?'table':'none'}
els.search.addEventListener('input',render);els.type.addEventListener('change',render);els.status.addEventListener('change',render);els.refresh.addEventListener('click',load);verify();
</script>
</body>
</html>
