<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Curriculum Editor</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#162033;--muted:#6b7280;--line:#dbe3ef;--blue:#2563eb;--red:#b91c1c;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#10213d;color:#fff;padding:14px 18px;box-shadow:0 2px 12px #0002}.head{max-width:1500px;margin:auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.75}.wrap{max-width:1500px;margin:18px auto;padding:0 14px}.toolbar,.stats,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #1d355710}.toolbar{padding:12px;display:grid;grid-template-columns:130px 170px minmax(220px,1fr) auto auto;gap:9px;align-items:center}.stats{display:flex;gap:18px;padding:10px 14px;margin:12px 0;font-size:13px;flex-wrap:wrap}.stat b{font-size:17px;margin-right:4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink)}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef8;color:#17345f}.danger{background:#fee2e2;color:var(--red)}.success{background:#dcfce7;color:var(--green)}.tabs{display:flex;gap:6px;margin:12px 0;overflow:auto}.tab{white-space:nowrap;background:#e8eef8;color:#334155}.tab.active{background:#10213d;color:#fff}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:66vh}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#eef3f9;z-index:2;font-size:12px;color:#475569}.text{font-weight:700;max-width:430px}.ko{color:#475569}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef2ff;font-size:11px}.actions{display:flex;gap:5px}.empty{padding:50px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;width:min(720px,94vw);box-shadow:0 25px 80px #0005}.modal-head{padding:16px 18px;background:#10213d;color:white;display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.loading{opacity:.55;pointer-events:none}@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.modal-body{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:0 8px}.actions button{padding:7px 9px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Willena Curriculum Editor</h1><div class="sub">Supabase Content Database · staging</div></div><div id="connection">Connecting…</div></div></header>
<div class="wrap" id="app">
  <div class="toolbar">
    <select id="level"><option value="">All levels</option></select>
    <select id="status"><option value="">All statuses</option><option>review</option><option>approved</option><option>draft</option><option>archived</option></select>
    <input class="search" id="search" placeholder="Search English, Korean or source key…">
    <button class="secondary" id="refresh">Refresh</button>
    <button class="primary" id="add">+ Add item</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs"><button class="tab active" data-table="lexical_entries">Vocabulary</button><button class="tab" data-table="patterns">Patterns</button><button class="tab" data-table="sentences">Sentences</button></div>
  <div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>No matching records.</div></div>
</div>
<dialog id="editor"><form method="dialog" id="form"><div class="modal-head"><strong id="modalTitle">Edit item</strong><button value="cancel" style="background:transparent;color:white;font-size:20px">×</button></div><div class="modal-body" id="fields"></div><div class="modal-foot"><button value="cancel" class="secondary">Cancel</button><button type="button" class="primary" id="save">Save changes</button></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
const SB_KEY='sb_publishable_G-FYhHfDL4OGdL892gY1Zg_epdbEeqO';
const headers={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
const cfg={
 lexical_entries:{label:'Vocabulary',select:'id,canonical_text,translation_ko,level_id,entry_type,part_of_speech,difficulty_rating,cefr_level,status,source_key,tags,definition_en,register',text:'canonical_text',columns:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['part_of_speech','Type'],['difficulty_rating','Difficulty'],['status','Status']],fields:['canonical_text','translation_ko','level_id','entry_type','part_of_speech','difficulty_rating','cefr_level','status','source_key','definition_en','register','tags']},
 patterns:{label:'Patterns',select:'*',text:'canonical_text',columns:[['canonical_text','Pattern'],['translation_ko','Korean'],['level_id','Level'],['pattern_type','Type'],['difficulty_rating','Difficulty'],['status','Status']],fields:['canonical_text','translation_ko','level_id','pattern_type','difficulty_rating','cefr_level','status','source_key','notes']},
 sentences:{label:'Sentences',select:'id,text,canonical_text,translation_ko,level_id,difficulty_rating,cefr_level,status,source_key,grammar_notes,contraction_policy',text:'text',columns:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['cefr_level','CEFR'],['difficulty_rating','Difficulty'],['status','Status']],fields:['text','canonical_text','translation_ko','level_id','difficulty_rating','cefr_level','status','source_key','grammar_notes','contraction_policy']}
};
let table='lexical_entries',rows=[],editing=null;
const $=s=>document.querySelector(s), level=$('#level'),status=$('#status'),search=$('#search');
for(let i=1;i<=10;i++)level.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.style.background=bad?'#991b1b':'#111827';t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function api(path,opt={}){const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opt,headers:{...headers,...opt.headers}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function escape(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const app=$('#app');app.classList.add('loading');try{rows=await api(`${table}?select=${encodeURIComponent(cfg[table].select)}&order=level_id.asc&order=${cfg[table].text}.asc&limit=3000`);$('#connection').textContent='● Connected';render();}catch(e){$('#connection').textContent='● Connection error';toast('Could not load data: '+e.message,true)}finally{app.classList.remove('loading')}}
function filtered(){const q=search.value.trim().toLowerCase();return rows.filter(r=>(!level.value||String(r.level_id)===level.value)&&(!status.value||r.status===status.value)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function render(){const c=cfg[table],data=filtered();$('#thead').innerHTML=c.columns.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th>';$('#tbody').innerHTML=data.map(r=>`<tr>${c.columns.map(([k])=>`<td class="${k===c.text?'text':k==='translation_ko'?'ko':''}">${k==='status'?`<span class="pill">${escape(r[k])}</span>`:escape(r[k])}</td>`).join('')}<td><div class="actions"><button class="secondary" onclick="edit('${r.id}')">Edit</button><button class="danger" onclick="removeRow('${r.id}')">Delete</button></div></td></tr>`).join('');$('#empty').hidden=!!data.length;const levels={};rows.forEach(r=>levels[r.level_id]=(levels[r.level_id]||0)+1);$('#stats').innerHTML=`<span class="stat"><b>${rows.length}</b> ${c.label}</span><span class="stat"><b>${data.length}</b> shown</span><span class="stat">${Object.entries(levels).sort((a,b)=>a[0]-b[0]).map(([l,n])=>`L${l}: ${n}`).join(' · ')}</span>`}
function fieldType(k){if(k==='level_id'||k==='difficulty_rating')return 'number';if(['definition_en','grammar_notes','notes'].includes(k))return 'textarea';if(k==='status')return 'status';if(k==='tags')return 'tags';return 'text'}
window.edit=id=>{editing=rows.find(r=>r.id===id);openEditor(false)};
function openEditor(isNew){if(isNew)editing={level_id:Number(level.value)||3,status:'review',cefr_level:'A1'};const c=cfg[table];$('#modalTitle').textContent=(isNew?'Add ':'Edit ')+c.label.replace(/s$/,'');$('#fields').innerHTML=c.fields.map(k=>{let v=editing[k]??'';if(Array.isArray(v))v=v.join(', ');const type=fieldType(k);const input=type==='textarea'?`<textarea rows="3" data-key="${k}">${escape(v)}</textarea>`:type==='status'?`<select data-key="${k}">${['review','approved','draft','archived'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:`<input type="${type==='number'?'number':'text'}" data-key="${k}" value="${escape(v)}">`;return `<div class="field ${['canonical_text','text','translation_ko','definition_en','grammar_notes','notes'].includes(k)?'full':''}"><label>${k.replaceAll('_',' ')}</label>${input}</div>`}).join('');$('#editor').showModal();editing.__new=isNew}
$('#add').onclick=()=>openEditor(true);
$('#save').onclick=async()=>{const payload={};document.querySelectorAll('#fields [data-key]').forEach(el=>{let v=el.value.trim();const k=el.dataset.key;if(k==='level_id'||k==='difficulty_rating')v=v===''?null:Number(v);if(k==='tags')v=v?v.split(',').map(x=>x.trim()).filter(Boolean):[];payload[k]=v===''?null:v});if(!payload[cfg[table].text])return toast('English text is required',true);if(table==='lexical_entries'&&!payload.source_key)payload.source_key=`willena:l${payload.level_id}:lex:${payload.canonical_text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}`;try{if(editing.__new){await api(table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)})}else await api(`${table}?id=eq.${editing.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});$('#editor').close();toast('Saved');load()}catch(e){toast('Save failed: '+e.message,true)}};
window.removeRow=async id=>{const r=rows.find(x=>x.id===id);if(!confirm(`Delete “${r[cfg[table].text]}”?`))return;try{await api(`${table}?id=eq.${id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});toast('Deleted');load()}catch(e){toast('Delete failed: '+e.message,true)}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;load()});
[level,status].forEach(x=>x.onchange=render);search.oninput=render;$('#refresh').onclick=load;load();
</script>
</body></html>
