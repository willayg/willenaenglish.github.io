<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Willena Curriculum Studio</title>
<style>:root{--nav:#10213d;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d8e0ec;--red:#b42318;--green:#067647;--amber:#b54708}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:12px 18px;box-shadow:0 2px 12px #0003}.topin{max-width:1600px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand b{font-size:19px}.brand small{display:block;opacity:.7}.shell{max-width:1600px;margin:0 auto;padding:16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #16335a0c}.sidebar{padding:12px;height:calc(100vh - 92px);position:sticky;top:76px;overflow:auto}.side-title{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin:8px}.level{width:100%;border:0;background:transparent;padding:10px 12px;border-radius:9px;text-align:left;display:flex;justify-content:space-between;color:#344054}.level:hover{background:#f0f4fa}.level.active{background:#e8efff;color:#1849a9;font-weight:800}.count{font-size:11px;background:#eef2f7;padding:2px 7px;border-radius:999px}.main{min-width:0}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{min-width:220px;flex:1}.input,.toolbar input,.toolbar select,.drawer input,.drawer select,.drawer textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink)}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;background:#e9eef6;color:#253858}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fee4e2;color:var(--red)}.btn.ghost{background:transparent;border:1px solid var(--line)}.tabs{display:flex;gap:5px;padding:0 12px 12px;overflow:auto}.tab{border:0;border-radius:9px;padding:9px 13px;background:#edf1f7;color:#475467;font-weight:750;white-space:nowrap}.tab.active{background:var(--nav);color:#fff}.summary{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:#fafcff;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:#475467}.bulk{display:none;align-items:center;gap:8px;padding:10px 12px;background:#fff7e8;border-top:1px solid #fedf89;flex-wrap:wrap}.bulk.show{display:flex}.tablebox{overflow:auto;max-height:calc(100vh - 270px);border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{border-bottom:1px solid #edf1f5;padding:9px 10px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;z-index:5;font-size:11px;color:#667085;text-transform:uppercase;letter-spacing:.04em}.maintext{font-weight:750;max-width:440px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:3px 7px;background:#eef4ff;color:#3538cd;margin:1px}.status{font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px}.status.review{background:#fff4e5;color:var(--amber)}.status.published,.status.approved{background:#e7f6ec;color:var(--green)}.status.draft{background:#f2f4f7;color:#475467}.row-actions{display:flex;gap:5px}.mini{border:0;border-radius:7px;padding:6px 8px;font-size:12px;background:#edf2f8}.empty{padding:60px;text-align:center;color:var(--muted)}.pager{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}.drawerback{position:fixed;inset:0;background:#10182866;z-index:40;display:none}.drawerback.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(650px,96vw);background:#fff;display:flex;flex-direction:column;box-shadow:-15px 0 50px #0003}.drawerhead{padding:16px 18px;background:var(--nav);color:#fff;display:flex;justify-content:space-between;align-items:center}.drawerbody{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#667085;margin-bottom:5px}.drawer textarea{width:100%;min-height:86px;resize:vertical}.drawer input,.drawer select{width:100%}.drawerfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.usage{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafcff}.usage-item{padding:7px 0;border-bottom:1px solid #e8edf4}.login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#10213d,#274b7a);display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:18px;padding:25px;box-shadow:0 25px 80px #0005}.login h1{margin:0 0 5px}.login p,.subtext{color:var(--muted)}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;display:none;max-width:420px}.loading{opacity:.55;pointer-events:none}.dup{color:var(--red);font-size:11px;font-weight:800}.mobile-level{display:none}@media(max-width:900px){.shell{display:block;padding:8px}.sidebar{display:none}.mobile-level{display:block}.tablebox{max-height:none}.top{padding:10px}.brand small{display:none}.toolbar{padding:9px}.drawerbody{grid-template-columns:1fr}.field.full{grid-column:auto}.summary{font-size:12px}}</style></head>
<body><div class="login" id="login"><div class="loginbox"><h1>Curriculum Studio</h1><p>Enter the editor password. It stays only in this browser tab.</p><input id="password" type="password" autocomplete="current-password" placeholder="Editor password"><button class="btn primary" style="width:100%" id="loginBtn">Open editor</button><p id="loginError" style="color:#b42318"></p></div></div>
<header class="top"><div class="topin"><div class="brand"><b>Willena Curriculum Studio</b><small>GitHub Pages · Supabase Content Database</small></div><div><span id="connection">Locked</span> <button class="btn ghost" style="color:white;border-color:#ffffff55" id="lock">Lock</button></div></div></header>
<div class="shell" id="app"><aside class="panel sidebar"><div class="side-title">Levels</div><button class="level active" data-level=""><span>All levels</span><span class="count" id="count-all">0</span></button><div id="levels"></div></aside><main class="main panel"><div class="toolbar"><select class="input mobile-level" id="mobileLevel"><option value="">All levels</option></select><input id="search" placeholder="Search English, Korean, tags or source key…"><select id="status"><option value="">All statuses</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add">+ Add</button></div><div class="tabs"><button class="tab active" data-table="lexical_entries">Vocabulary</button><button class="tab" data-table="patterns">Patterns</button><button class="tab" data-table="sentences">Sentences</button><button class="tab" data-table="collections">Collections</button></div><div class="summary" id="summary"></div><div class="bulk" id="bulk"><b><span id="selectedCount">0</span> selected</b><select id="bulkLevel"><option value="">Move to level…</option></select><select id="bulkStatus"><option value="">Change status…</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn primary" id="applyBulk">Apply</button><button class="btn" id="clearSelection">Clear</button></div><div class="tablebox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>No matching curriculum content.</div></div><div class="pager"><button class="btn" id="prev">← Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next →</button></div></main></div>
<div class="drawerback" id="drawerback"><section class="drawer"><div class="drawerhead"><b id="drawerTitle">Edit</b><button class="btn ghost" style="color:#fff;border-color:#ffffff55" id="closeDrawer">×</button></div><div class="drawerbody" id="fields"></div><div class="drawerfoot"><button class="btn danger" id="deleteBtn">Delete</button><span style="flex:1"></span><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></section></div><div class="toast" id="toast"></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',PAGE_SIZE=500;
const config={lexical_entries:{title:'Vocabulary',main:'canonical_text',columns:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['part_of_speech','Part of speech'],['entry_type','Entry type'],['status','Status']],fields:[['canonical_text','English','text',1],['translation_ko','Korean','text',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['entry_type','Entry type','text'],['part_of_speech','Part of speech','text'],['cefr_level','CEFR','text'],['status','Status','status'],['register','Register','text'],['tags','Tags','tags',1],['definition_en','Definition','textarea',1],['source_key','Source key','text',1],['countability','Countability','text'],['plural_required','Plural required','boolean'],['plural_rule','Plural rule','text'],['metadata','Metadata JSON','json',1]]},patterns:{title:'Patterns',main:'name',columns:[['name','Name'],['prompt_pattern','Prompt'],['response_pattern','Response'],['level_id','Level'],['grammar_category','Category'],['status','Status']],fields:[['name','Name','text',1],['code','Code','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['language_function','Language function','text',1],['prompt_pattern','Prompt pattern','textarea',1],['response_pattern','Response pattern','textarea',1],['accepted_patterns','Accepted patterns JSON','json',1],['grammar_category','Grammar category','text'],['cefr_level','CEFR','text'],['status','Status','status'],['tags','Tags','tags',1],['explanation_en','Explanation English','textarea',1],['explanation_ko','Explanation Korean','textarea',1],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},sentences:{title:'Sentences',main:'text',columns:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['cefr_level','CEFR'],['difficulty_rating','Difficulty'],['status','Status']],fields:[['text','Sentence','textarea',1],['translation_ko','Korean','textarea',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['cefr_level','CEFR','text'],['status','Status','status'],['grammar_notes','Grammar notes','textarea',1],['contraction_policy','Contraction policy','text'],['audio_key','Audio key','text'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},collections:{title:'Collections',main:'name',columns:[['name','Name'],['collection_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status'],['slug','Slug']],fields:[['name','Name','text',1],['slug','Slug','text'],['description','Description','textarea',1],['collection_type','Collection type','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]}};
let key=sessionStorage.getItem('willenaCurriculumKey')||'',table='lexical_entries',rows=[],total=0,page=0,currentLevel='',editing=null,selected=new Set();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
for(let i=1;i<=10;i++){ $('#levels').insertAdjacentHTML('beforeend',`<button class="level" data-level="${i}"><span>Level ${i}</span><span class="count" id="count-${i}">0</span></button>`);$('#mobileLevel').insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);$('#bulkLevel').insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`)}
function notify(msg,bad=false){const t=$('#toast');t.textContent=msg;t.style.background=bad?'#912018':'#101828';t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',3000)}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(body)}),j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
async function unlock(){key=$('#password').value.trim();if(!key)return;try{await call({action:'list',table:'lexical_entries',page:0,pageSize:1});sessionStorage.setItem('willenaCurriculumKey',key);$('#login').style.display='none';$('#connection').textContent='● Connected';load()}catch(e){$('#loginError').textContent=e.message}}$('#loginBtn').onclick=unlock;$('#password').onkeydown=e=>{if(e.key==='Enter')unlock()};if(key){$('#login').style.display='none';$('#connection').textContent='● Connected';setTimeout(load)}$('#lock').onclick=()=>{sessionStorage.removeItem('willenaCurriculumKey');location.reload()};
async function load(){selected.clear();updateBulk();$('#app').classList.add('loading');try{const j=await call({action:'list',table,filters:{level_id:currentLevel,status:$('#status').value},page,pageSize:PAGE_SIZE});rows=j.data||[];total=j.count||0;render();$('#connection').textContent='● Connected'}catch(e){notify(e.message,true);if(/password/i.test(e.message)){$('#login').style.display='flex';sessionStorage.removeItem('willenaCurriculumKey')}}finally{$('#app').classList.remove('loading')}}function filteredRows(){const q=$('#search').value.trim().toLowerCase();return q?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)):rows}function duplicateMap(data){const m={};data.forEach(r=>{const k=String(r[config[table].main]||'').trim().toLowerCase();if(k)m[k]=(m[k]||0)+1});return m}function display(v,k){if(k==='status')return `<span class="status ${esc(v)}">${esc(v)}</span>`;if(Array.isArray(v))return v.map(x=>`<span class="tag">${esc(x)}</span>`).join('');return esc(v)}
function render(){const c=config[table],data=filteredRows(),dups=duplicateMap(rows);$('#thead').innerHTML=`<th><input type="checkbox" id="selectAll"></th>`+c.columns.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th>';$('#tbody').innerHTML=data.map(r=>{const main=String(r[c.main]||'').trim().toLowerCase();return `<tr><td><input class="rowcheck" type="checkbox" data-id="${r.id}" ${selected.has(r.id)?'checked':''}></td>${c.columns.map(([k])=>`<td class="${k===c.main?'maintext':''}">${display(r[k],k)}${k===c.main&&dups[main]>1?'<div class="dup">Possible duplicate</div>':''}</td>`).join('')}<td><div class="row-actions"><button class="mini" data-edit="${r.id}">Edit</button>${table==='lexical_entries'?`<button class="mini" data-usage="${r.id}">Usage</button>`:''}</div></td></tr>`}).join('');$('#empty').hidden=!!data.length;$('#summary').innerHTML=`<span class="chip"><b>${total}</b> ${c.title.toLowerCase()}</span><span class="chip"><b>${data.length}</b> on this page</span><span class="chip">Page ${page+1} of ${Math.max(1,Math.ceil(total/PAGE_SIZE))}</span>`;$('#pageInfo').textContent=total?`${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,total)} of ${total}`:'0 records';$('#prev').disabled=page===0;$('#next').disabled=(page+1)*PAGE_SIZE>=total;for(let i=1;i<=10;i++)$('#count-'+i).textContent=rows.filter(r=>Number(r.level_id)===i).length;$('#count-all').textContent=total;bindRows()}
function bindRows(){const all=$('#selectAll');all.onchange=()=>{$$('.rowcheck').forEach(cb=>{cb.checked=all.checked;all.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id)});updateBulk()};$$('.rowcheck').forEach(cb=>cb.onchange=()=>{cb.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id);updateBulk()});$$('[data-edit]').forEach(b=>b.onclick=()=>openEditor(rows.find(r=>r.id===b.dataset.edit),false));$$('[data-usage]').forEach(b=>b.onclick=()=>openUsage(rows.find(r=>r.id===b.dataset.usage)))}function updateBulk(){$('#selectedCount').textContent=selected.size;$('#bulk').classList.toggle('show',selected.size>0)}
function makeInput([k,label,type,full],value){let input=type==='textarea'?`<textarea data-key="${k}">${esc(value)}</textarea>`:type==='status'?`<select data-key="${k}">${['review','draft','published','approved','archived'].map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`:type==='boolean'?`<select data-key="${k}"><option value="false" ${!value?'selected':''}>false</option><option value="true" ${value?'selected':''}>true</option></select>`:`<input data-key="${k}" type="${type==='number'?'number':'text'}" value="${esc(value)}">`;return `<div class="field ${full?'full':''}"><label>${label}</label>${input}</div>`}function defaults(){if(table==='lexical_entries')return {level_id:Number(currentLevel)||3,status:'review',entry_type:'word',register:'child_friendly',tags:[],metadata:{},plural_required:false};if(table==='patterns')return {level_id:Number(currentLevel)||3,status:'review',accepted_patterns:[],tags:[],metadata:{}};if(table==='sentences')return {level_id:Number(currentLevel)||3,status:'review',metadata:{},contraction_policy:'allow'};return {level_id:Number(currentLevel)||3,status:'review',metadata:{},collection_type:'curriculum'}}
function openEditor(row,isNew){editing={...(row||defaults()),__new:isNew};$('#drawerTitle').textContent=`${isNew?'Add':'Edit'} ${config[table].title.replace(/s$/,'')}`;$('#fields').innerHTML=config[table].fields.map(f=>{let v=editing[f[0]]??'';if(f[2]==='tags'&&Array.isArray(v))v=v.join(', ');if(f[2]==='json'&&typeof v!=='string')v=JSON.stringify(v,null,2);return makeInput(f,v)}).join('');$('#deleteBtn').style.display=isNew?'none':'block';$('#drawerback').classList.add('open')}function closeEditor(){$('#drawerback').classList.remove('open');editing=null}$('#closeDrawer').onclick=closeEditor;$('#cancelBtn').onclick=closeEditor;$('#drawerback').onclick=e=>{if(e.target===$('#drawerback'))closeEditor()};function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function payloadFromForm(){const p={};config[table].fields.forEach(([k,,type])=>{const el=document.querySelector(`[data-key="${k}"]`);if(!el)return;let v=el.value.trim();if(type==='number')v=v===''?null:Number(v);if(type==='boolean')v=v==='true';if(type==='tags')v=v?v.split(',').map(x=>x.trim()).filter(Boolean):[];if(type==='json'){try{v=v?JSON.parse(v):{}}catch{throw new Error(`${k} is not valid JSON`)}}p[k]=v===''?null:v});return p}
$('#saveBtn').onclick=async()=>{try{const payload=payloadFromForm(),main=config[table].main;if(!payload[main])throw new Error(`${main.replaceAll('_',' ')} is required`);if(!payload.source_key&&table!=='collections')payload.source_key=`willena:l${payload.level_id}:${table==='lexical_entries'?'lex':table==='sentences'?'sentence':'pattern'}:${slugify(payload[main])}`;if(table==='lexical_entries')payload.normalized_text=String(payload.canonical_text).toLowerCase().trim();if(table==='sentences')payload.normalized_text=String(payload.text).toLowerCase().trim();if(table==='collections'&&!payload.slug)payload.slug=slugify(payload.name);await call({action:'save',table,id:editing.__new?null:editing.id,payload});notify('Saved');closeEditor();load()}catch(e){notify(e.message,true)}};$('#deleteBtn').onclick=async()=>{if(!editing||!confirm(`Delete “${editing[config[table].main]}”?`))return;try{await call({action:'delete',table,id:editing.id});notify('Deleted');closeEditor();load()}catch(e){notify(e.message,true)}};
async function openUsage(row){openEditor(row,false);const box=document.createElement('div');box.className='usage';box.innerHTML='<b>Sentence usage</b><div>Searching…</div>';$('#fields').appendChild(box);try{const j=await call({action:'find_usage',table:'lexical_entries',term:row.canonical_text});box.innerHTML=`<b>Sentence usage (${j.data.length})</b>`+(j.data.length?j.data.map(s=>`<div class="usage-item"><b>${esc(s.text)}</b><div class="subtext">L${s.level_id??'–'} · ${esc(s.status)}${s.translation_ko?' · '+esc(s.translation_ko):''}</div></div>`).join(''):'<div class="subtext">No matching sentences.</div>')}catch(e){box.innerHTML=`<b>Sentence usage</b><div class="subtext">${esc(e.message)}</div>`}}$('#applyBulk').onclick=async()=>{const payload={};if($('#bulkLevel').value)payload.level_id=Number($('#bulkLevel').value);if($('#bulkStatus').value)payload.status=$('#bulkStatus').value;if(!Object.keys(payload).length)return notify('Choose a level or status',true);try{const j=await call({action:'bulk_update',table,ids:[...selected],payload});notify(`Updated ${j.updated} records`);load()}catch(e){notify(e.message,true)}};$('#clearSelection').onclick=()=>{selected.clear();render()};$('#add').onclick=()=>openEditor(null,true);$('#refresh').onclick=load;$('#search').oninput=render;$('#status').onchange=()=>{page=0;load()};$('#prev').onclick=()=>{if(page>0){page--;load()}};$('#next').onclick=()=>{if((page+1)*PAGE_SIZE<total){page++;load()}};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;page=0;$('#search').value='';load()});$$('.level').forEach(b=>b.onclick=()=>{$$('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLevel=b.dataset.level;$('#mobileLevel').value=currentLevel;page=0;load()});$('#mobileLevel').onchange=()=>{currentLevel=$('#mobileLevel').value;page=0;load()};
</script></body></html>
