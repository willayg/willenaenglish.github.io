</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn primary" id="applyBulk">Apply</button><button class="btn" id="clearSelection">Clear</button></div><div class="flagbar" id="flagbar"><b>Flag selected questions</b><textarea id="bulkFlagMessage" placeholder="Write one message for every selected question…"></textarea><button class="btn primary" id="applyFlag">Flag selected</button><button class="btn" id="clearFlags">Clear flags</button></div><div class="tablebox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button class="btn" id="prev">← Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next →</button></div></main></div><div class="back" id="drawerback"><section class="drawer"><div class="head"><b id="drawerTitle">Edit</b><button class="btn" id="closeDrawer">×</button></div><div class="body" id="fields"></div><div class="foot"><button class="btn danger" id="deleteBtn">Delete</button><span style="flex:1"></span><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></section></div><div class="toast" id="toast"></div><script>const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',SIZE=500,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const configs={lexical_entries:{title:'Vocabulary',main:'canonical_text',cols:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['difficulty_rating','Difficulty'],['part_of_speech','Part of speech'],['status','Status']],fields:[['canonical_text','English','text',1],['translation_ko','Korean','text',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['entry_type','Entry type','text'],['part_of_speech','Part of speech','text'],['status','Status','status'],['definition_en','Definition','textarea',1],['source_key','Source key','text',1]]},patterns:{title:'Patterns',main:'name',cols:[['name','Name'],['prompt_pattern','Prompt'],['response_pattern','Response'],['level_id','Level'],['difficulty_rating','Difficulty'],['grammar_category','Category'],['status','Status']],fields:[['name','Name','text',1],['code','Code','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['language_function','Language function','text',1],['prompt_pattern','Prompt pattern','textarea',1],['response_pattern','Response pattern','textarea',1],['grammar_category','Grammar category','text'],['status','Status','status'],['explanation_en','Explanation English','textarea',1],['explanation_ko','Explanation Korean','textarea',1],['source_key','Source key','text',1]]},sentences:{title:'Sentences',main:'text',cols:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status']],fields:[['text','Sentence','textarea',1],['translation_ko','Korean','textarea',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['grammar_notes','Grammar notes','textarea',1],['source_key','Source key','text',1]]},collections:{title:'Collections',main:'name',cols:[['name','Name'],['collection_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status'],['slug','Slug']],fields:[['name','Name','text',1],['slug','Slug','text'],['description','Description','textarea',1],['collection_type','Collection type','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['source_key','Source key','text',1]]},assessment_items:{title:'Assessment questions',main:'prompt_text',cols:[['prompt_text','Question'],['item_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['pattern','Pattern'],['is_flagged','Flagged'],['flag_message','Flag message'],['status','Status']]}};let uid='',table='lexical_entries',rows=[],total=0,page=0,level='',editing=null,selected=new Set(),patterns=[];for(let i=1;i<=10;i++){levels.insertAdjacentHTML('beforeend',`<button class="level" data-level="${i}"><span>Level ${i}</span><span id="count-${i}">0</span></button>`);mobileLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);bulkLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`)}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m,b=0){const t=$('#toast');t.textContent=m;t.style.background=b?'#912018':'#101828';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)}),j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid)),j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}auth.style.display='none';connection.textContent='● Connected';patterns=(await call({action:'list_patterns',table:'patterns'})).data||[];load()}catch(e){authmsg.textContent='Could not verify this account.'}}async function load(){selected.clear();bulkUI();app.classList.add('loading');try{const filters={level_id:level,status:status.value};if(table==='assessment_items'){filters.item_type=typeFilter.value;if(flagFilter.value!=='')filters.is_flagged=flagFilter.value}const j=await call({action:'list',table,filters,page,pageSize:SIZE});rows=(j.data||[]).map(norm);total=j.count||0;render()}catch(e){toast(e.message,1)}finally{app.classList.remove('loading')}}function norm(r){if(table!=='assessment_items')return r;const l=(r.assessment_item_patterns||[])[0];return{...r,pattern:l?.patterns?.code||'',pattern_id:l?.pattern_id||r.anchor_pattern_id||'',options:[...(r.assessment_item_options||[])].sort((a,b)=>a.display_order-b.display_order)}}function filtered(){const q=search.value.trim().toLowerCase();return q?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)):rows}function cell(k,v){if(k==='difficulty_rating')return `<span class="diff">${v==null?'—':`D ${esc(v)}`}</span>`;if(k==='is_flagged')return v?'<span class="flag">Flagged</span>':'—';if(k==='flag_message')return v?`<div class="msg">${esc(v)}</div>`:'—';return esc(v)}function render(){const c=configs[table],d=filtered();thead.innerHTML='<th><input type="checkbox" id="selectAll"></th>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th>';tbody.innerHTML=d.map(r=>`<tr><td><input class="rowcheck" type="checkbox" data-id="${r.id}"></td>${c.cols.map(([k])=>`<td class="${k===c.main?'main':''}">${cell(k,r[k])}${table==='assessment_items'&&k==='prompt_text'?`<div class="sub">Answer: ${esc(r.correct_answer||'')}</div>`:''}</td>`).join('')}<td><button class="mini" data-edit="${r.id}">Edit</button></td></tr>`).join('');summary.innerHTML=`<span class="chip"><b>${total}</b> ${c.title.toLowerCase()}</span><span class="chip"><b>${d.length}</b> shown</span>${table==='assessment_items'?`<span class="chip"><b>${d.filter(x=>x.is_flagged).length}</b> flagged on page</span>`:''}`;pageInfo.textContent=total?`${page*SIZE+1}–${Math.min((page+1)*SIZE,total)} of ${total}`:'0 records';prev.disabled=page===0;next.disabled=(page+1)*SIZE>=total;for(let i=1;i<=10;i++)$('#count-'+i).textContent=rows.filter(r=>Number(r.level_id)===i).length;$('#count-all').textContent=total;bind()}function bind(){selectAll.onchange=()=>{$$('.rowcheck').forEach(x=>{x.checked=selectAll.checked;x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id)});bulkUI()};$$('.rowcheck').forEac label>Question type</label><select data-key="item_type">${['question_response','grammar','grammar_error','sentence_unscramble','vocabulary'].map(x=>`<option ${x===editing.item_type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select data-key="status">${['review','draft','published','approved','archived'].map(x=>`<option ${x===editing.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Prompt</label><textarea data-key="prompt_text">${esc(editing.prompt_text||'')}</textarea></div><div class="field full"><label>Context</label><textarea data-key="context_text">${esc(editing.context_text||'')}</textarea></div><div class="field full"><label>Target pattern</label><select data-key="pattern_id"><option value="">No pattern</option>${patterns.map(p=>`<option value="${p.id}" ${p.id===editing.pattern_id?'selected':''}>L${p.level_id} · ${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Flagged</label><select data-key="is_flagged"><option value="false" ${!editing.is_flagged?'selected':''}>No</option><option value="true" ${editing.is_flagged?'selected':''}>Yes</option></select></div><div class="field full"><label>Flag message</label><textarea data-key="flag_message">${esc(editing.flag_message||'')}</textarea></div><div class="field full"><label>Options — choose correct</label>${o.map((x,i)=>`<div class="option"><input type="radio" name="correct" value="${i}" ${x.is_correct?'checked':''}><textarea data-option="${i}">${esc(x.option_text||'')}</textarea></div>`).join('')}</div><div class="field full"><label>English explanation</label><textarea data-key="explanation_en">${esc(editing.explanation_en||'')}</textarea></div><div class="field full"><label>Korean explanation</label><textarea data-key="explanation_ko">${esc(editing.explanation_ko||'')}</textarea></div><div class="field full"><label>Source key</label><input data-key="source_key" value="${esc(editing.source_key||'')}"></div>`}function genericPayload(){const p={};configs[table].fields.forEach(([k,,type])=>{let v=$(`[data-key="${k}"]`).value.trim();if(type==='number')v=v===''?null:Number(v);p[k]=v===''?null:v});return p}function assessmentPayload(){const g=k=>$(`[data-key="${k}"]`),ci=Number($('input[name="correct"]:checked')?.value??-1),options=$$('[data-option]').map((x,i)=>({option_text:x.value.trim(),is_correct:i===ci,distractor_type:i===ci?null:'contextually_incorrect'}));if(options.some(x=>!x.option_text))throw Error('All four options are required');const flagged=g('is_flagged').value==='true',msg=g('flag_message').value.trim();return{payload:{source_key:g('source_key').value.trim()||null,level_id:Number(g('level_id').value),difficulty_rating:Number(g('difficulty_rating').value),item_type:g('item_type').value,prompt_text:g('prompt_text').value.trim(),context_text:g('context_text').value.trim()||null,correct_answer:options.find(x=>x.is_correct)?.option_text||'',explanation_en:g('explanation_en').value.trim()||null,explanation_ko:g('explanation_ko').value.trim()||null,status:g('status').value,metadata:editing.metadata||{},choices:options.map(x=>x.option_text),anchor_pattern_id:g('pattern_id').value||null,is_flagged:flagged,flag_message:flagged?(msg||null):null},options,patternId:g('pattern_id').value||null}}saveBtn.onclick=async()=>{try{if(table==='assessment_items'){const x=assessmentPayload();if(!x.payload.prompt_text)throw Error('Prompt required');await call({action:'save_assessment',table,id:editing.__new?null:editing.id,...x})}else{const p=genericPayload();if(!p[configs[table].main])throw Error('Main field required');await call({action:'save',table,id:editing.__new?null:editing.id,payload:p})}toast('Saved');close();load()}catch(e){toast(e.message,1)}};deleteBtn.onclick=async()=>{if(!editing||!confirm('Delete this item?'))return;try{await call({action:'delete',table,id:editing.id});close();load()}catch(e){toast(e.message,1)}};function close(){drawerback.classList.remove('open');editing=null}applyBulk.onclick=async()=>{const p={};if(bulkLevel.value)p.level_id=Number(bulkLevel.value);if(bulkStatus.value)p.status=bulkStatus.value;if(!Object.keys(p).length)return;try{await call({action:'bulk_update',table,ids:[...selected],payload:p});load()}catch(e){toast(e.message,1)}};applyFlag.onclick=async()=>{const message=bulkFlagMessage.value.trim();if(!message)return toast('Write a flag message first',1);const n=selected.size;try{await call({action:'bulk_flag',table:'assessment_items',ids:[...selected],message});bulkFlagMessage.value='';toast(`Flagged ${n} questions`);load()}catch(e){toast(e.message,1)}};clearFlags.onclick=async()=>{if(!confirm('Clear flags and messages from selected questions?'))return;const n=selected.size;try{await call({action:'bulk_clear_flag',table:'assessment_items',ids:[...selected]});toast(`Cleared ${n} flags`);load()}catch(e){toast(e.message,1)}};clearSelection.onclick=()=>{selected.clear();render()};add.onclick=()=>open(null,1);refresh.onclick=load;search.oninput=render;status.onchange=typeFilter.onchange=flagFilter.onchange=()=>{page=0;load()};prev.onclick=()=>{if(page){page--;load()}};next.onclick=()=>{if((page+1)*SIZE<total){page++;load()}};closeDrawer.onclick=cancelBtn.onclick=close;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;page=0;typeFilter.style.display=flagFilter.style.display=table==='assessment_items'?'':'none';load()});$$('.level').forEach(b=>b.onclick=()=>{$$('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level;mobileLevel.value=level;page=0;load()});mobileLevel.onchange=()=>{level=mobileLevel.value;page=0;load()};verify();</script></body></html>
