<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Curriculum Studio</title>
<script src="/students/api-gateway.js?v=20260729"></script>
<script src="/js/api-config.js?v=20260729"></script>
<style>
:root{--nav:#10213d;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d8e0ec;--red:#b42318;--green:#067647}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:12px 18px}.topin{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand b{font-size:19px}.brand small{display:block;opacity:.7}.shell{max-width:1500px;margin:auto;padding:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #16335a0c}.sidebar{padding:12px;position:sticky;top:76px;height:calc(100vh - 92px);overflow:auto}.level{width:100%;border:0;background:transparent;padding:10px 12px;border-radius:9px;text-align:left;display:flex;justify-content:space-between}.level.active{background:#e8efff;color:#1849a9;font-weight:800}.toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;background:#e9eef6}.primary{background:var(--blue);color:#fff}.danger{background:#fee4e2;color:var(--red)}.tabs{display:flex;gap:6px;padding:0 12px 12px;overflow:auto}.tab{border:0;border-radius:9px;padding:9px 13px;background:#edf1f7;font-weight:750}.tab.active{background:var(--nav);color:#fff}.summary,.bulk{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.bulk{display:none;background:#fff7e8}.bulk.show{display:flex}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 10px}.tablebox{overflow:auto;max-height:calc(100vh - 270px);border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;font-size:11px;text-transform:uppercase}.maintext{font-weight:750}.status{font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eef2f7}.status.published,.status.approved{background:#e7f6ec;color:var(--green)}.actions{display:flex;gap:5px}.mini{border:0;border-radius:7px;padding:6px 8px}.pager{padding:10px 12px;display:flex;justify-content:space-between}.drawerback{position:fixed;inset:0;background:#10182866;z-index:40;display:none}.drawerback.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(650px,96vw);background:#fff;display:flex;flex-direction:column}.drawerhead{padding:16px 18px;background:var(--nav);color:#fff;display:flex;justify-content:space-between}.drawerbody{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.drawer input,.drawer select,.drawer textarea{width:100%}.drawer textarea{min-height:90px}.drawerfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.loading{opacity:.55;pointer-events:none}.authscreen{position:fixed;inset:0;z-index:90;background:#10213d;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.authscreen a{color:#fff}.mobileLevel{display:none}@media(max-width:850px){.shell{display:block;padding:8px}.sidebar{display:none}.mobileLevel{display:block}.drawerbody{grid-template-columns:1fr}.field.full{grid-column:auto}.tablebox{max-height:none}}
</style>
</head>
<body>
<div class="authscreen" id="authscreen"><div><h2>Checking teacher session…</h2><p id="authmsg">Please wait.</p></div></div>
<header class="top"><div class="topin"><div class="brand"><b>Willena Curriculum Studio</b><small>Teacher tools · Supabase content database</small></div><div id="connection">Checking…</div></div></header>
<div class="shell" id="app">
<aside class="panel sidebar"><button class="level active" data-level=""><span>All levels</span><span id="count-all">0</span></button><div id="levels"></div></aside>
<main class="panel">
<div class="toolbar"><select class="mobileLevel" id="mobileLevel"><option value="">All levels</option></select><input id="search" placeholder="Search English, Korean, tags or source key…"><select id="status"><option value="">All statuses</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add">+ Add</button></div>
<div class="tabs"><button class="tab active" data-table="lexical_entries">Vocabulary</button><button class="tab" data-table="patterns">Patterns</button><button class="tab" data-table="sentences">Sentences</button><button class="tab" data-table="collections">Collections</button></div>
<div class="summary" id="summary"></div><div class="bulk" id="bulk"><b><span id="selectedCount">0</span> selected</b><select id="bulkLevel"><option value="">Move to level…</option></select><select id="bulkStatus"><option value="">Change status…</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn primary" id="applyBulk">Apply</button><button class="btn" id="clearSelection">Clear</button></div>
<div class="tablebox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button class="btn" id="prev">← Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next →</button></div>
</main></div>
<div class="drawerback" id="drawerback"><section class="drawer"><div class="drawerhead"><b id="drawerTitle">Edit</b><button class="btn" id="closeDrawer">×</button></div><div class="drawerbody" id="fields"></div><div class="drawerfoot"><button class="btn danger" id="deleteBtn">Delete</button><span style="flex:1"></span><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></section></div><div class="toast" id="toast"></div>
<script type="module">
import { ensureAuthRefresh } from '/Teachers/auth-refresh.js?v=20260729';
ensureAuthRefresh();
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',PAGE_SIZE=500;
const cfg={
lexical_entries:{title:'Vocabulary',main:'canonical_text',cols:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['part_of_speech','Part of speech'],['entry_type','Entry type'],['status','Status']],fields:[['canonical_text','English','text',1],['translation_ko','Korean','text',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['entry_type','Entry type','text'],['part_of_speech','Part of speech','text'],['cefr_level','CEFR','text'],['status','Status','status'],['register','Register','text'],['tags','Tags','tags',1],['definition_en','Definition','textarea',1],['source_key','Source key','text',1],['countability','Countability','text'],['plural_required','Plural required','boolean'],['plural_rule','Plural rule','text'],['metadata','Metadata JSON','json',1]]},
patterns:{title:'Patterns',main:'name',cols:[['name','Name'],['prompt_pattern','Prompt'],['response_pattern','Response'],['level_id','Level'],['grammar_category','Category'],['status','Status']],fields:[['name','Name','text',1],['code','Code','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['language_function','Language function','text',1],['prompt_pattern','Prompt pattern','textarea',1],['response_pattern','Response pattern','textarea',1],['accepted_patterns','Accepted patterns JSON','json',1],['grammar_category','Grammar category','text'],['cefr_level','CEFR','text'],['status','Status','status'],['tags','Tags','tags',1],['explanation_en','Explanation English','textarea',1],['explanation_ko','Explanation Korean','textarea',1],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},
sentences:{title:'Sentences',main:'text',cols:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['cefr_level','CEFR'],['difficulty_rating','Difficulty'],['status','Status']],fields:[['text','Sentence','textarea',1],['translation_ko','Korean','textarea',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['cefr_level','CEFR','text'],['status','Status','status'],['grammar_notes','Grammar notes','textarea',1],['contraction_policy','Contraction policy','text'],['audio_key','Audio key','text'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},
collections:{title:'Collections',main:'name',cols:[['name','Name'],['collection_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status'],['slug','Slug']],fields:[['name','Name','text',1],['slug','Slug','text'],['description','Description','textarea',1],['collection_type','Collection type','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]}};
let table='lexical_entries',rows=[],total=0,page=0,currentLevel='',editing=null,selected=new Set(),token='';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
for(let i=1;i<=10;i++){ $('#levels').insertAdjacentHTML('beforeend',`<button class="level" data-level="${i}"><span>Level ${i}</span><span id="count-${i}">0</span></button>`);$('#mobileLevel').insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);$('#bulkLevel').insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`)}
function toast(m,b=false){const t=$('#toast');t.textContent=m;t.style.background=b?'#912018':'#101828';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function verifyTeacher(){token=localStorage.getItem('sb_access_token')||'';try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=whoami_teacher&_='+Date.now(),{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error('Not signed in');if(!token){$('#authmsg').innerHTML='Your teacher session is valid, but this browser has no API token. <a href="/Teachers/signin?redirect='+encodeURIComponent(location.pathname)+'">Sign in again</a> once to refresh it.';return}$('#authscreen').style.display='none';$('#connection').textContent='● Teacher session';load()}catch{$('#authmsg').innerHTML='Please <a href="/Teachers/signin?redirect='+encodeURIComponent(location.pathname)+'">sign in as a teacher</a>.'}}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),j=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){localStorage.removeItem('sb_access_token');location.href='/Teachers/signin?redirect='+encodeURIComponent(location.pathname);throw new Error('Session expired')}if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
async function load(){selected.clear();updateBulk();$('#app').classList.add('loading');try{const j=await call({action:'list',table,filters:{level_id:currentLevel,status:$('#status').value},page,pageSize:PAGE_SIZE});rows=j.data||[];total=j.count||0;render()}catch(e){toast(e.message,true)}finally{$('#app').classList.remove('loading')}}
function filtered(){const q=$('#search').value.trim().toLowerCase();return q?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)):rows}function display(v,k){if(k==='status')return `<span class="status ${esc(v)}">${esc(v)}</span>`;if(Array.isArray(v))return v.map(x=>`<span class="status">${esc(x)}</span>`).join(' ');return esc(v)}
function render(){const c=cfg[table],data=filtered();$('#thead').innerHTML='<th><input type="checkbox" id="selectAll"></th>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th>';$('#tbody').innerHTML=data.map(r=>`<tr><td><input class="rowcheck" type="checkbox" data-id="${r.id}"></td>${c.cols.map(([k])=>`<td class="${k===c.main?'maintext':''}">${display(r[k],k)}</td>`).join('')}<td><div class="actions"><button class="mini" data-edit="${r.id}">Edit</button>${table==='lexical_entries'?`<button class="mini" data-usage="${r.id}">Usage</button>`:''}</div></td></tr>`).join('');$('#summary').innerHTML=`<span class="chip"><b>${total}</b> ${c.title.toLowerCase()}</span><span class="chip"><b>${data.length}</b> shown</span>`;$('#pageInfo').textContent=total?`${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,total)} of ${total}`:'0 records';$('#prev').disabled=page===0;$('#next').disabled=(page+1)*PAGE_SIZE>=total;for(let i=1;i<=10;i++)$('#count-'+i).textContent=rows.filter(r=>Number(r.level_id)===i).length;$('#count-all').textContent=total;bindRows()}
function bindRows(){$('#selectAll').onchange=e=>{$$('.rowcheck').forEach(cb=>{cb.checked=e.target.checked;e.target.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id)});updateBulk()};$$('.rowcheck').forEach(cb=>cb.onchange=()=>{cb.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id);updateBulk()});$$('[data-edit]').forEach(b=>b.onclick=()=>openEditor(rows.find(r=>r.id===b.dataset.edit),false));$$('[data-usage]').forEach(b=>b.onclick=()=>usage(rows.find(r=>r.id===b.dataset.usage)))}function updateBulk(){$('#selectedCount').textContent=selected.size;$('#bulk').classList.toggle('show',selected.size>0)}
function defaults(){if(table==='lexical_entries')return {level_id:Number(currentLevel)||3,status:'review',entry_type:'word',register:'child_friendly',tags:[],metadata:{},plural_required:false};if(table==='patterns')return {level_id:Number(currentLevel)||3,status:'review',accepted_patterns:[],tags:[],metadata:{}};if(table==='sentences')return {level_id:Number(currentLevel)||3,status:'review',metadata:{},contraction_policy:'allow'};return {level_id:Number(currentLevel)||3,status:'review',metadata:{},collection_type:'curriculum'}}
function input([k,l,t,f],v){let h=t==='textarea'?`<textarea data-key="${k}">${esc(v)}</textarea>`:t==='status'?`<select data-key="${k}">${['review','draft','published','approved','archived'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:t==='boolean'?`<select data-key="${k}"><option value="false" ${!v?'selected':''}>false</option><option value="true" ${v?'selected':''}>true</option></select>`:`<input data-key="${k}" type="${t==='number'?'number':'text'}" value="${esc(v)}">`;return `<div class="field ${f?'full':''}"><label>${l}</label>${h}</div>`}
function openEditor(r,isNew){editing={...(r||defaults()),__new:isNew};$('#drawerTitle').textContent=(isNew?'Add ':'Edit ')+cfg[table].title.replace(/s$/,'');$('#fields').innerHTML=cfg[table].fields.map(f=>{let v=editing[f[0]]??'';if(f[2]==='tags'&&Array.isArray(v))v=v.join(', ');if(f[2]==='json'&&typeof v!=='string')v=JSON.stringify(v,null,2);return input(f,v)}).join('');$('#deleteBtn').style.display=isNew?'none':'block';$('#drawerback').classList.add('open')}function close(){$('#drawerback').classList.remove('open');editing=null}function slug(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function payload(){const p={};cfg[table].fields.forEach(([k,,t])=>{const el=document.querySelector(`[data-key="${k}"]`);let v=el.value.trim();if(t==='number')v=v===''?null:Number(v);if(t==='boolean')v=v==='true';if(t==='tags')v=v?v.split(',').map(x=>x.trim()).filter(Boolean):[];if(t==='json')v=v?JSON.parse(v):{};p[k]=v===''?null:v});return p}
$('#saveBtn').onclick=async()=>{try{const p=payload(),main=cfg[table].main;if(!p[main])throw new Error('Main text is required');if(!p.source_key&&table!=='collections')p.source_key=`willena:l${p.level_id}:${table==='lexical_entries'?'lex':table==='sentences'?'sentence':'pattern'}:${slug(p[main])}`;if(table==='lexical_entries')p.normalized_text=String(p.canonical_text).toLowerCase().trim();if(table==='sentences')p.normalized_text=String(p.text).toLowerCase().trim();if(table==='collections'&&!p.slug)p.slug=slug(p.name);await call({action:'save',table,id:editing.__new?null:editing.id,payload:p});toast('Saved');close();load()}catch(e){toast(e.message,true)}};$('#deleteBtn').onclick=async()=>{if(!editing||!confirm('Delete this record?'))return;try{await call({action:'delete',table,id:editing.id});close();load()}catch(e){toast(e.message,true)}};
async function usage(r){openEditor(r,false);const d=document.createElement('div');d.className='field full';d.innerHTML='<label>Sentence usage</label><div>Searching…</div>';$('#fields').appendChild(d);try{const j=await call({action:'find_usage',table:'lexical_entries',term:r.canonical_text});d.innerHTML='<label>Sentence usage</label>'+(j.data.length?j.data.map(x=>`<p><b>${esc(x.text)}</b><br>L${x.level_id??'–'} · ${esc(x.status)}</p>`).join(''):'No matching sentences.')}catch(e){d.textContent=e.message}}
$('#applyBulk').onclick=async()=>{const p={};if($('#bulkLevel').value)p.level_id=Number($('#bulkLevel').value);if($('#bulkStatus').value)p.status=$('#bulkStatus').value;if(!Object.keys(p).length)return;await call({action:'bulk_update',table,ids:[...selected],payload:p});load()};$('#clearSelection').onclick=()=>{selected.clear();render()};$('#add').onclick=()=>openEditor(null,true);$('#refresh').onclick=load;$('#search').oninput=render;$('#status').onchange=()=>{page=0;load()};$('#prev').onclick=()=>{if(page){page--;load()}};$('#next').onclick=()=>{page++;load()};$('#closeDrawer').onclick=close;$('#cancelBtn').onclick=close;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;page=0;load()});$$('.level').forEach(b=>b.onclick=()=>{$$('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLevel=b.dataset.level;$('#mobileLevel').value=currentLevel;page=0;load()});$('#mobileLevel').onchange=()=>{currentLevel=$('#mobileLevel').value;page=0;load()};verifyTeacher();
</script>
</body></html>
