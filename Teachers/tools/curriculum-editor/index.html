<style>

ar(--r);border-color:#fecdca;font-weight:800}.listening{background:#eef4ff;color:#3538cd;border-color:#c7d7fe;font-weight:800}.tablebox{overflow:auto;border-top:1px solid var(--l);max-height:calc(100vh - 300px)}table{width:100%;border-collapse:collapse;min-width:1320px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;font-size:11px;text-transform:uppercase;z-index:3}.filter-row th{top:34px;padding:5px 7px;background:#fff;z-index:2}.filter-wrap{position:relative;display:flex;align-items:center}.filter-wrap svg{position:absolute;left:7px;width:12px;height:12px;color:#667085;pointer-events:none}.colfilter{width:100%;min-width:72px;height:28px;padding:3px 5px 3px 23px;border-radius:7px;font-size:11px;color:#344054;background:#fff}.colfilter.active{border-color:#2563eb;background:#eff6ff;color:#1849a9}.eligibility-select{min-width:104px;padding:5px 7px;border-radius:8px;font-size:12px;font-weight:750;color:#1849a9;background:#eff6ff;border-color:#b2ccff}.eligibility-select.study{color:#667085;background:#f8fafc;border-color:#d8e0ec}.main{font-weight:750;max-width:430px}.sub{font-size:12px;color:var(--m);margin-top:4px}.msg{max-width:270px}.pager{display:flex;justify-content:space-between;padding:10px}.back{position:fixed;inset:0;background:#10182866;display:none;z-index:20}.back.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(820px,98vw);background:#fff;display:flex;flex-direction:column}.head{padding:15px;background:var(--n);color:#fff;display:flex;justify-content:space-between}.body{padding:15px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full,.listening-panel{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--m);margin-bottom:4px}.drawer input,.drawer select,.drawer textarea{width:100%}.drawer textarea{min-height:86px}.foot{padding:12px;border-top:1px solid var(--l);display:flex;gap:8px}.option{border:1px solid var(--l);border-radius:12px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:9px}.option input{width:auto;margin-top:11px}.listening-panel{border:1px solid #b2ddff;background:#f5fbff;border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.listening-panel h3,.listening-panel .full{grid-column:1/-1}.audit-list{margin:6px 0 0;padding-left:18px;color:var(--r)}.preview{display:flex;gap:8px;align-items:center}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:40}.auth{position:fixed;inset:0;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:center;z-index:50}.loading{opacity:.5;pointer-events:none}.mobile{display:none}@media(max-width:850px){.shell{display:block;padding:8px}.side{display:none}.mobile{display:block}.body,.listening-panel{grid-template-columns:1fr}.field.full,.listening-panel h3,.listening-panel .full{grid-column:auto}.tablebox{max-height:none}.flagbar textarea{min-width:100%}}

<body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header><div class="top"><div><b>Willena Curriculum Studio</b><span class="v">assessment audit v5</span></div><div id="connection">Checking…</div></div></header>
<div class="shell" id="app">
<aside class="panel side"><button class="level active" data-level=""><span>All levels</span><span id="count-all">0</span></button><div id="levels"></div></aside>
<main class="panel">
<div class="toolbar">
<select class="mobile" id="mobileLevel"><option value="">All levels</option></select>
<input id="search" placeholder="Search content, transcript, options, flags or source key…">
<select id="status"><option value="">All statuses</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select>
<select id="typeFilter" style="display:none"><option value="">All question types</option><option>listening</option><option>question_response</option><option>grammar</option><option>grammar_error</option><option>sentence_unscramble</option><option>vocabulary</option></select>
<select id="flagFilter" style="display:none"><option value="">All questions</option><option value="true">Flagged only</option><option value="false">Unflagged only</option></select>
<select id="auditFilter" style="display:none"><option value="">All audit states</option><option value="ok">Audit passed</option><option value="bad">Needs attention</option></select>
<button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add">+ Add</button>
</div>
<div class="tabs"><button class="tab active" data-table="lexical_entries">Vocabulary</button><button class="tab" data-table="patterns">Patterns</button><button class="tab" data-table="sentences">Sentences</button><button class="tab" data-table="collections">Collections</button><button class="tab" data-table="assessment_items">Assessment Questions</button></div>
<div class="summary" id="summary"></div><div class="auditbar" id="auditbar"><b>Listening audit</b><span>Checks transcript, language, rate, play limit, four complete choices and one correct answer.</span></div>
<div class="bulk" id="bulk"><b><span id="selectedCount">0</span> selected</b><select id="bulkLevel"><option value="">Move to level…</option></select><select id="bulkStatus"><option value="">Change status…</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn primary" id="applyBulk">Apply</button><button class="btn" id="clearSelection">Clear</button></div>
<div class="flagbar" id="flagbar"><b>Flag selected questions</b><textarea id="bulkFlagMessage" placeholder="Write one message for every selected question…"></textarea><button class="btn primary" id="applyFlag">Flag selected</button><button class="btn" id="clearFlags">Clear flags</button></div>
<div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="pager"><button class="btn" id="prev">← Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next →</button></div>
</main></div>
<div class="back" id="drawerback"><section class="drawer"><div class="head"><b id="drawerTitle">Edit</b><button class="btn" id="closeDrawer">×</button></div><div class="body" id="fields"></div><div class="foot"><button class="btn danger" id="deleteBtn">Delete</button><span style="flex:1"></span><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></section></div>
<div class="toast" id="toast"></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',SIZE=500,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const configs={
lexical_entries:{title:'Vocabulary',main:'canonical_text',cols:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['difficulty_rating','Difficulty'],['part_of_speech','Part of speech'],['status','Status']],fields:[['canonical_text','English','text',1],['translation_ko','Korean','text',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['entry_type','Entry type','text'],['part_of_speech','Part of speech','text'],['status','Status','status'],['definition_en','Definition','textarea',1],['source_key','Source key','text',1]]},
patterns:{title:'Patterns',main:'name',cols:[['name','Name'],['prompt_pattern','Prompt'],['response_pattern','Response'],['level_id','Level'],['difficulty_rating','Difficulty'],['grammar_category','Category'],['status','Status']],fields:[['name','Name','text',1],['code','Code','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['language_function','Language function','text',1],['prompt_pattern','Prompt pattern','textarea',1],['response_pattern','Response pattern','textarea',1],['grammar_category','Grammar category','text'],['status','Status','status'],['explanation_en','Explanation English','textarea',1],['explanation_ko','Explanation Korean','textarea',1],['source_key','Source key','text',1]]},
sentences:{title:'Sentences',main:'text',cols:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status']],fields:[['text','Sentence','textarea',1],['translation_ko','Korean','textarea',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['grammar_notes','Grammar notes','textarea',1],['source_key','Source key','text',1]]},
collections:{title:'Collections',main:'name',cols:[['name','Name'],['collection_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status'],['slug','Slug']],fields:[['name','Name','text',1],['slug','Slug','text'],['description','Description','textarea',1],['collection_type','Collection type','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['source_key','Source key','text',1]]},
assessment_items:{title:'Assessment questions',main:'prompt_text',cols:[['prompt_text','Question'],['source_book','Source book'],['item_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['level_test_eligible','Level test'],['audit','Audit'],['pattern','Pattern'],['is_flagged','Flagged'],['status','Status']]}
};
let uid='',table='lexical_entries',rows=[],total=0,page=0,level='',editing=null,selected=new Set(),patterns=[],columnFilters={};
for(let i=1;i<=12;i++){levels.insertAdjacentHTML('beforeend',`<button class="level" data-level="${i}"><span>Level ${i}</span><span id="count-${i}">0</span></button>`);mobileLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);bulkLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`)}
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,b=0){const t=$('#toast');t.textContent=m;t.style.background=b?'#912018':'#101828';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)}),j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid)),j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}auth.style.display='none';connection.textContent='● Connected';patterns=(await call({action:'list_patterns',table:'patterns'})).data||[];load()}catch(e){authmsg.textContent='Could not verify this account.'}}
async function load(){selected.clear();bulkUI();app.classList.add('loading');try{const filters={level_id:level,status:status.value};if(table==='assessment_items'){filters.item_type=typeFilter.value;if(flagFilter.value!=='')filters.is_flagged=flagFilter.value}const j=await call({action:'list',table,filters,page,pageSize:SIZE});rows=(j.data||[]).map(norm);total=j.count||0;render()}catch(e){toast(e.message,1)}finally{app.classList.remove('loading')}}
function sourceBook(r){const m=r.metadata||{},raw=String(m.source_book||m.book_title||m.source_title||r.source_book||r.source_key||'').trim();if(!raw)return'—';let x=raw.match(/(?:come[ _-]*on(?:[ _-]*everyone)?|coe)[ _-]*(\d+)/i);if(x)return`Come On Everyone ${x[1]}`;x=raw.match(/let[’']?s[ _-]*go[ _-]*(\d+)/i);if(x)return`Let's Go ${x[1]}`;return raw.split(/::|\|/)[0].replace(/(?:[ _-](?:unit|u)[ _-]*\d+).*$/i,'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim()||raw}
function norm(r){if(table!=='assessment_items')return r;const l=(r.assessment_item_patterns||[])[0],options=[...(r.assessment_item_options||[])].sort((a,b)=>a.display_order-b.display_order);const excluded=r.metadata?.exclude_level_test===true||String(r.metadata?.exclude_level_test).toLowerCase()==='true'||r.metadata?.exclude_from_level_test===true||String(r.metadata?.exclude_from_level_test).toLowerCase()==='true';const x={...r,source_book:sourceBook(r),pattern:l?.patterns?.code||'',pattern_id:l?.pattern_id||r.anchor_pattern_id||'',options,level_test_eligible:!excluded};x.auditIssues=auditIssues(x);x.audit=x.item_type==='listening'?(x.auditIssues.length?'Needs attention':'Passed'):'—';return x}
function auditIssues(r){if(r.item_type!=='listening')return[];const m=r.metadata||{},issues=[];if(!String(m.transcript||'').trim())issues.push('Missing transcript');if(!String(m.lang||'').trim())issues.push('Missing language');const rate=Number(m.rate);if(!Number.isFinite(rate)||rate<0.5||rate>1.5)issues.push('Speech rate must be 0.5–1.5');const plays=Number(m.max_plays);if(!Number.isInteger(plays)||plays<1||plays>5)issues.push('Play limit must be 1–5');if(!Array.isArray(r.options)||r.options.length!==4)issues.push('Exactly four options required');else{if(r.options.some(x=>!String(x.option_text||'').trim()))issues.push('Empty option');if(r.options.filter(x=>x.is_correct).length!==1)issues.push('Exactly one correct option required');const correct=r.options.find(x=>x.is_correct)?.option_text||'';if(String(r.correct_answer||'').trim()!==String(correct).trim())issues.push('Correct answer mismatch')}return issues}
function filterValue(r,k){if(k==='level_test_eligible')return r.level_test_eligible?'Level test':'Study only';if(k==='is_flagged')return r.is_flagged?'Flagged':'Not flagged';return String(r[k]??'—')}
function filtered(){const q=search.value.trim().toLowerCase();let d=q?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)):rows;if(table==='assessment_items'&&auditFilter.value)d=d.filter(r=>auditFilter.value==='ok'?r.item_type==='listening'&&!r.auditIssues.length:r.item_type==='listening'&&r.auditIssues.length);for(const [k,v] of Object.entries(columnFilters)){if(!v)continue;d=d.filter(r=>k==='prompt_text'?filterValue(r,k).toLowerCase().includes(v.toLowerCase()):filterValue(r,k)===v)}return d}
function filterControl(k){const value=columnFilters[k]||'',icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 7v5l-4 2v-7z"/></svg>';if(k==='prompt_text')return `<div class="filter-wrap">${icon}<input class="colfilter ${value?'active':''}" data-col-filter="${k}" value="${esc(value)}" placeholder="Filter"></div>`;const vals=[...new Set(rows.map(r=>filterValue(r,k)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return `<div class="filter-wrap">${icon}<select class="colfilter ${value?'active':''}" data-col-filter="${k}"><option value="">All</option>${vals.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function cell(k,v,r){if(k==='difficulty_rating')return `<span class="diff">${v==null?'—':`D ${esc(v)}`}</span>`;if(k==='level_test_eligible')return `<select class="eligibility-select ${v?'':'study'}" data-eligibility="${r.id}" aria-label="Level test use"><option value="true" ${v?'selected':''}>Level test</option><option value="false" ${!v?'selected':''}>Study only</option></select>`;if(k==='is_flagged')return v?'<span class="flag">Flagged</span>':'—';if(k==='audit'){if(r.item_type!=='listening')return'—';return r.auditIssues.length?`<span class="audit-bad">${r.auditIssues.length} issue${r.auditIssues.length===1?'':'s'}</span><div class="sub">${esc(r.auditIssues.join(' · '))}</div>`:'<span class="audit-ok">Passed</span>'}if(k==='item_type'&&v==='listening')return'<span class="listening">Listening</span>';return esc(v)}
function render(){const c=configs[table],d=filtered();thead.innerHTML='<tr><th><input type="checkbox" id="selectAll"></th>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th></tr>'+('<tr class="filter-row"><th></th>'+c.cols.map(([k])=>`<th>${filterControl(k)}</th>`).join('')+'<th></th></tr>');tbody.innerHTML=d.map(r=>`<tr><td><input class="rowcheck" type="checkbox" data-id="${r.id}"></td>${c.cols.map(([k])=>`<td class="${k===c.main?'main':''}">${cell(k,r[k],r)}${table==='assessment_items'&&k==='prompt_text'?`<div class="sub">Answer: ${esc(r.correct_answer||'')}</div>${r.item_type==='listening'?`<div class="sub">Transcript: ${esc(r.metadata?.transcript||'—')}</div>`:''}`:''}</td>`).join('')}<td><button class="mini" data-edit="${r.id}">Edit</button></td></tr>`).join('');const listening=d.filter(x=>x.item_type==='listening'),bad=listening.filter(x=>x.auditIssues.length);summary.innerHTML=`<span class="chip"><b>${total}</b> ${c.title.toLowerCase()}</span><span class="chip"><b>${d.length}</b> shown</span>${table==='assessment_items'?`<span class="chip"><b>${d.filter(x=>!x.level_test_eligible).length}</b> study only</span><span class="chip"><b>${listening.length}</b> listening</span><span class="chip"><b>${bad.length}</b> listening needing attention</span><span class="chip"><b>${d.filter(x=>x.is_flagged).length}</b> flagged</span>`:''}`;pageInfo.textContent=total?`${page*SIZE+1}–${Math.min((page+1)*SIZE,total)} of ${total}`:'0 records';prev.disabled=page===0;next.disabled=(page+1)*SIZE>=total;for(let i=1;i<=12;i++)$('#count-'+i).textContent=rows.filter(r=>Number(r.level_id)===i).length;$('#count-all').textContent=total;bind()}
function bind(){selectAll.onchange=()=>{$$('.rowcheck').forEach(x=>{x.checked=selectAll.checked;x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id)});bulkUI()};$$('.rowcheck').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);bulkUI()});$$('[data-edit]').forEach(x=>x.onclick=()=>open(rows.find(r=>r.id===x.dataset.edit),0));$$('[data-col-filter]').forEach(x=>x.onchange=()=>{columnFilters[x.dataset.colFilter]=x.value;render()});$$('[data-eligibility]').forEach(x=>x.onchange=()=>setEligibility(x))}
async function setEligibility(el){const r=rows.find(x=>x.id===el.dataset.eligibility);if(!r)return;const eligible=el.value==='true',metadata={...(r.metadata||{}),exclude_level_test:!eligible};delete metadata.exclude_from_level_test;el.disabled=true;try{await call({action:'bulk_update',table:'assessment_items',ids:[r.id],payload:{metadata}});r.metadata=metadata;r.level_test_eligible=eligible;toast(eligible?'Added to level tests':'Changed to study only');render()}catch(e){toast(e.message,1);render()}}
function bulkUI(){selectedCount.textContent=selected.size;bulk.classList.toggle('show',selected.size>0);flagbar.classList.toggle('show',selected.size>0&&table==='assessment_items')}
function defaults(){return table==='assessment_items'?{level_id:Number(level)||1,difficulty_rating:(Number(level)||1)*20,status:'review',item_type:'question_response',is_flagged:false,metadata:{lang:'en-US',rate:.9,max_plays:2,transcript:'',exclude_level_test:false},options:[{option_text:'',is_correct:true},{option_text:'',is_correct:false},{option_text:'',is_correct:false},{option_text:'',is_correct:false}]}:{level_id:Number(level)||3,status:'review'}}
function input([k,label,type,full],v){let h=type==='textarea'?`<textarea data-key="${k}">${esc(v||'')}</textarea>`:type==='status'?`<select data-key="${k}">${['review','draft','published','approved','archived'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-key="${k}" type="${type==='number'?'number':'text'}" value="${esc(v||'')}">`;return `<div class="field ${full?'full':''}"><label>${label}</label>${h}</div>`}
function open(r,isNew){editing=r?structuredClone(r):{...defaults(),__new:true};drawerTitle.textContent=(isNew?'Add ':'Edit ')+configs[table].title;deleteBtn.style.display=isNew?'none':'';if(table==='assessment_items')assessmentForm();else fields.innerHTML=configs[table].fields.map(f=>input(f,editing[f[0]])).join('');drawerback.classList.add('open')}
function assessmentForm(){const o=editing.options?.length===4?editing.options:defaults().options,m=editing.metadata||{};fields.innerHTML=`
<div class="field"><label>Level</label><input data-key="level_id" type="number" min="1" max="12" value="${esc(editing.level_id||1)}"></div>
<div class="field"><label>Difficulty</label><input data-key="difficulty_rating" type="number" min="1" max="200" value="${esc(editing.difficulty_rating||20)}"></div>
<div class="field"><label>Question type</label><select data-key="item_type" id="itemTypeEditor">${['listening','question_response','grammar','grammar_error','sentence_unscramble','vocabulary'].map(x=>`<option ${x===editing.item_type?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Status</label><select data-key="status">${['review','draft','published','approved','archived'].map(x=>`<option ${x===editing.status?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Use in level tests</label><select data-key="level_test_eligible"><option value="true" ${editing.level_test_eligible!==false?'selected':''}>Yes</option><option value="false" ${editing.level_test_eligible===false?'selected':''}>No — study only</option></select></div>
<div class="field full"><label>Prompt</label><textarea data-key="prompt_text">${esc(editing.prompt_text||'')}</textarea></div>
<div class="field full"><label>Context</label><textarea data-key="context_text">${esc(editing.context_text||'')}</textarea></div>
<div class="listening-panel" id="listeningFields">
<h3>🎧 Listening settings</h3>
<div class="field full"><label>Transcript spoken to the student</label><textarea data-meta="transcript">${esc(m.transcript||'')}</textarea></div>
<div class="field"><label>Voice language</label><select data-meta="lang"><option value="en-US" ${m.lang==='en-US'?'selected':''}>English (US)</option><option value="en-GB" ${m.lang==='en-GB'?'selected':''}>English (UK)</option><option value="en-IE" ${m.lang==='en-IE'?'selected':''}>English (Ireland)</option><option value="en-AU" ${m.lang==='en-AU'?'selected':''}>English (Australia)</option></select></div>
<div class="field"><label>Speech rate</label><input data-meta="rate" type="number" min="0.5" max="1.5" step="0.05" value="${esc(m.rate??.9)}"></div>
<div class="field"><label>Maximum plays</label><input data-meta="max_plays" type="number" min="1" max="5" value="${esc(m.max_plays??2)}"></div>
<div class="field preview"><button class="btn" type="button" id="previewListening">▶ Preview transcript</button><span id="previewState"></span></div>
<div class="full" id="liveAudit"></div>
</div>
<div class="field full"><label>Target pattern</label><select data-key="pattern_id"><option value="">No pattern</option>${patterns.map(p=>`<option value="${p.id}" ${p.id===editing.pattern_id?'selected':''}>L${p.level_id} · ${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select></div>
<div class="field"><label>Flagged</label><select data-key="is_flagged"><option value="false" ${!editing.is_flagged?'selected':''}>No</option><option value="true" ${editing.is_flagged?'selected':''}>Yes</option></select></div>
<div class="field full"><label>Flag message</label><textarea data-key="flag_message">${esc(editing.flag_message||'')}</textarea></div>
<div class="field full"><label>Options — choose correct</label>${o.map((x,i)=>`<div class="option"><input type="radio" name="correct" value="${i}" ${x.is_correct?'checked':''}><textarea data-option="${i}">${esc(x.option_text||'')}</textarea></div>`).join('')}</div>
<div class="field full"><label>English explanation</label><textarea data-key="explanation_en">${esc(editing.explanation_en||'')}</textarea></div>
<div class="field full"><label>Korean explanation</label><textarea data-key="explanation_ko">${esc(editing.explanation_ko||'')}</textarea></div>
<div class="field full"><label>Source key</label><input data-key="source_key" value="${esc(editing.source_key||'')}"></div>`;
const toggle=()=>{listeningFields.style.display=itemTypeEditor.value==='listening'?'grid':'none';liveAuditUpdate()};itemTypeEditor.onchange=toggle;fields.oninput=liveAuditUpdate;previewListening.onclick=previewTranscript;toggle()}
function previewTranscript(){const text=$('[data-meta="transcript"]')?.value.trim();if(!text)return toast('Add a transcript first',1);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=$('[data-meta="lang"]').value;u.rate=Number($('[data-meta="rate"]').value)||.9;previewState.textContent='Playing…';u.onend=()=>previewState.textContent='';u.onerror=()=>previewState.textContent='Could not play';speechSynthesis.speak(u)}
function liveAuditUpdate(){if(!$('#liveAudit')||$('#itemTypeEditor')?.value!=='listening')return;try{const x=assessmentPayload(),temp={...x.payload,options:x.options};const issues=auditIssues(temp);liveAudit.innerHTML=issues.length?`<span class="audit-bad">Needs attention</span><ul class="audit-list">${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<span class="audit-ok">Listening audit passed</span>'}catch(e){liveAudit.innerHTML=`<span class="audit-bad">${esc(e.message)}</span>`}}
function genericPayload(){const p={};configs[table].fields.forEach(([k,,type])=>{let v=$(`[data-key="${k}"]`).value.trim();if(type==='number')v=v===''?null:Number(v);p[k]=v===''?null:v});return p}
function assessmentPayload(){const g=k=>$(`[data-key="${k}"]`),ci=Number($('input[name="correct"]:checked')?.value??-1),options=$$('[data-option]').map((x,i)=>({option_text:x.value.trim(),is_correct:i===ci,distractor_type:i===ci?null:'contextually_incorrect'})),flagged=g('is_flagged').value==='true',msg=g('flag_message').value.trim(),itemType=g('item_type').value,metadata={...(editing.metadata||{})};metadata.exclude_level_test=g('level_test_eligible').value!=='true';delete metadata.exclude_from_level_test;if(itemType==='listening'){metadata.transcript=$('[data-meta="transcript"]').value.trim();metadata.lang=$('[data-meta="lang"]').value;metadata.rate=Number($('[data-meta="rate"]').value);metadata.max_plays=Number($('[data-meta="max_plays"]').value)}return{payload:{source_key:g('source_key').value.trim()||null,level_id:Number(g('level_id').value),difficulty_rating:Number(g('difficulty_rating').value),item_type:itemType,prompt_text:g('prompt_text').value.trim(),context_text:g('context_text').value.trim()||null,correct_answer:options.find(x=>x.is_correct)?.option_text||'',explanation_en:g('explanation_en').value.trim()||null,explanation_ko:g('explanation_ko').value.trim()||null,status:g('status').value,metadata,choices:options.map(x=>x.option_text),anchor_pattern_id:g('pattern_id').value||null,is_flagged:flagged,flag_message:flagged?(msg||null):null},options,patternId:g('pattern_id').value||null}}
saveBtn.onclick=async()=>{try{if(table==='assessment_items'){const x=assessmentPayload();if(!x.payload.prompt_text)throw Error('Prompt required');if(x.options.some(v=>!v.option_text))throw Error('All four options are required');if(x.options.filter(v=>v.is_correct).length!==1)throw Error('Choose exactly one correct option');if(x.payload.item_type==='listening'){const issues=auditIssues({...x.payload,options:x.options});if(issues.length)throw Error('Listening audit: '+issues.join('; '))}await call({action:'save_assessment',table,id:editing.__new?null:editing.id,...x})}else{const p=genericPayload();if(!p[configs[table].main])throw Error('Main field required');await call({action:'save',table,id:editing.__new?null:editing.id,payload:p})}toast('Saved');close();load()}catch(e){toast(e.message,1)}};
deleteBtn.onclick=async()=>{if(!editing||!confirm('Delete this item?'))return;try{await call({action:'delete',table,id:editing.id});close();load()}catch(e){toast(e.message,1)}};
function close(){drawerback.classList.remove('open');editing=null;speechSynthesis?.cancel?.()}
applyBulk.onclick=async()=>{const p={};if(bulkLevel.value)p.level_id=Number(bulkLevel.value);if(bulkStatus.value)p.status=bulkStatus.value;if(!Object.keys(p).length)return;try{await call({action:'bulk_update',table,ids:[...selected],payload:p});load()}catch(e){toast(e.message,1)}};
applyFlag.onclick=async()=>{const message=bulkFlagMessage.value.trim();if(!message)return toast('Write a flag message first',1);try{await call({action:'bulk_flag',table:'assessment_items',ids:[...selected],message});bulkFlagMessage.value='';load()}catch(e){toast(e.message,1)}};
clearFlags.onclick=async()=>{if(!confirm('Clear flags and messages from selected questions?'))return;try{await call({action:'bulk_clear_flag',table:'assessment_items',ids:[...selected]});load()}catch(e){toast(e.message,1)}};
clearSelection.onclick=()=>{selected.clear();render()};add.onclick=()=>open(null,1);refresh.onclick=load;search.oninput=render;status.onchange=typeFilter.onchange=flagFilter.onchange=()=>{page=0;load()};auditFilter.onchange=render;prev.onclick=()=>{if(page){page--;load()}};next.onclick=()=>{if((page+1)*SIZE<total){page++;load()}};closeDrawer.onclick=cancelBtn.onclick=close;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;page=0;columnFilters={};const show=table==='assessment_items';typeFilter.style.display=flagFilter.style.display=auditFilter.style.display=show?'':'none';auditbar.classList.toggle('show',show);load()});
$$('.level').forEach(b=>b.onclick=()=>{$$('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level;mobileLevel.value=level;page=0;load()});mobileLevel.onchange=()=>{level=mobileLevel.value;page=0;load()};verify();
</script>
</body>
</html>
