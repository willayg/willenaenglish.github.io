<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Curriculum Studio</title>
<script src="/students/api-gateway.js?v=20260729b"></script>
<script src="/js/api-config.js?v=20260729b"></script>
<style>
:root{--nav:#10213d;--blue:#2563eb;--bg:#f3f6fb;--line:#d8e0ec;--ink:#172033;--muted:#667085;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.top{background:var(--nav);color:#fff;padding:13px 18px}.topin{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand b{font-size:19px}.shell{max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.sidebar{padding:10px}.level{width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;display:flex;justify-content:space-between}.level.active{background:#e8efff;color:#1849a9;font-weight:800}.toolbar,.tabs,.summary,.bulk{display:flex;gap:8px;flex-wrap:wrap;padding:11px}.toolbar input{min-width:220px;flex:1}input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.btn,.tab{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer;background:#e9eef6}.primary{background:var(--blue);color:#fff}.danger{background:#fee4e2;color:var(--red)}.tab.active{background:var(--nav);color:#fff}.summary,.bulk{border-top:1px solid var(--line)}.bulk{display:none;background:#fff7e8}.bulk.show{display:flex}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 10px}.tablebox{overflow:auto;border-top:1px solid var(--line);max-height:calc(100vh - 260px)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;font-size:11px;text-transform:uppercase}.maintext{font-weight:750}.mini{border:0;border-radius:7px;padding:6px 8px;cursor:pointer}.pager{display:flex;justify-content:space-between;padding:10px}.drawerback{position:fixed;inset:0;background:#10182866;display:none;z-index:20}.drawerback.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(650px,96vw);background:#fff;display:flex;flex-direction:column}.drawerhead{padding:15px;background:var(--nav);color:#fff;display:flex;justify-content:space-between}.drawerbody{padding:15px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.drawer input,.drawer select,.drawer textarea{width:100%}.drawer textarea{min-height:90px}.drawerfoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:40}.loading{opacity:.5;pointer-events:none}.authscreen{position:fixed;inset:0;background:#10213d;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:50;padding:20px}.mobile{display:none}@media(max-width:850px){.shell{display:block;padding:8px}.sidebar{display:none}.mobile{display:block}.drawerbody{grid-template-columns:1fr}.field.full{grid-column:auto}.tablebox{max-height:none}}
</style>
</head>
<body>
<div class="authscreen" id="authscreen"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header class="top"><div class="topin"><div class="brand"><b>Willena Curriculum Studio</b></div><div id="connection">Checking…</div></div></header>
<div class="shell" id="app">
<aside class="panel sidebar"><button class="level active" data-level=""><span>All levels</span><span id="count-all">0</span></button><div id="levels"></div></aside>
<main class="panel"><div class="toolbar"><select class="mobile" id="mobileLevel"><option value="">All levels</option></select><input id="search" placeholder="Search English, Korean, tags or source key…"><select id="status"><option value="">All statuses</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add">+ Add</button></div>
<div class="tabs"><button class="tab active" data-table="lexical_entries">Vocabulary</button><button class="tab" data-table="patterns">Patterns</button><button class="tab" data-table="sentences">Sentences</button><button class="tab" data-table="collections">Collections</button></div>
<div class="summary" id="summary"></div><div class="bulk" id="bulk"><b><span id="selectedCount">0</span> selected</b><select id="bulkLevel"><option value="">Move to level…</option></select><select id="bulkStatus"><option value="">Change status…</option><option>review</option><option>draft</option><option>published</option><option>approved</option><option>archived</option></select><button class="btn primary" id="applyBulk">Apply</button><button class="btn" id="clearSelection">Clear</button></div>
<div class="tablebox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button class="btn" id="prev">← Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next →</button></div></main></div>
<div class="drawerback" id="drawerback"><section class="drawer"><div class="drawerhead"><b id="drawerTitle">Edit</b><button class="btn" id="closeDrawer">×</button></div><div class="drawerbody" id="fields"></div><div class="drawerfoot"><button class="btn danger" id="deleteBtn">Delete</button><span style="flex:1"></span><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></section></div><div class="toast" id="toast"></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',PAGE_SIZE=500;
const cfg={
lexical_entries:{title:'Vocabulary',main:'canonical_text',cols:[['canonical_text','English'],['translation_ko','Korean'],['level_id','Level'],['part_of_speech','Part of speech'],['entry_type','Entry type'],['status','Status']],fields:[['canonical_text','English','text',1],['translation_ko','Korean','text',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['entry_type','Entry type','text'],['part_of_speech','Part of speech','text'],['cefr_level','CEFR','text'],['status','Status','status'],['register','Register','text'],['tags','Tags','tags',1],['definition_en','Definition','textarea',1],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},
patterns:{title:'Patterns',main:'name',cols:[['name','Name'],['prompt_pattern','Prompt'],['response_pattern','Response'],['level_id','Level'],['grammar_category','Category'],['status','Status']],fields:[['name','Name','text',1],['code','Code','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['language_function','Language function','text',1],['prompt_pattern','Prompt pattern','textarea',1],['response_pattern','Response pattern','textarea',1],['accepted_patterns','Accepted patterns JSON','json',1],['grammar_category','Grammar category','text'],['cefr_level','CEFR','text'],['status','Status','status'],['tags','Tags','tags',1],['explanation_en','Explanation English','textarea',1],['explanation_ko','Explanation Korean','textarea',1],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},
sentences:{title:'Sentences',main:'text',cols:[['text','Sentence'],['translation_ko','Korean'],['level_id','Level'],['cefr_level','CEFR'],['difficulty_rating','Difficulty'],['status','Status']],fields:[['text','Sentence','textarea',1],['translation_ko','Korean','textarea',1],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['cefr_level','CEFR','text'],['status','Status','status'],['grammar_notes','Grammar notes','textarea',1],['contraction_policy','Contraction policy','text'],['audio_key','Audio key','text'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]},
collections:{title:'Collections',main:'name',cols:[['name','Name'],['collection_type','Type'],['level_id','Level'],['difficulty_rating','Difficulty'],['status','Status'],['slug','Slug']],fields:[['name','Name','text',1],['slug','Slug','text'],['description','Description','textarea',1],['collection_type','Collection type','text'],['level_id','Level','number'],['difficulty_rating','Difficulty','number'],['status','Status','status'],['source_key','Source key','text',1],['metadata','Metadata JSON','json',1]]}};
let userId='',table='lexical_entries',rows=[],total=0,page=0,currentLevel='',editing=null,selected=new Set();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
for(let i=1;i<=10;i++){levels.insertAdjacentHTML('beforeend',`<button class="level" data-level="${i}"><span>Level ${i}</span><span id="count-${i}">0</span></button>`);mobileLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`);bulkLevel.insertAdjacentHTML('beforeend',`<option value="${i}">Level ${i}</option>`)}
function toast(m,b=false){const t=$('#toast');t.textContent=m;t.style.background=b?'#912018':'#101828';t.style.display='block';setTimeout(()=>t.style.display='none',3000)}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function verifyAccount(){userId=localStorage.getItem('userId')||'';if(!userId){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(userId));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}authscreen.style.display='none';connection.textContent='● Connected';load()}catch(e){authmsg.innerHTML='Could not verify this account. <a style="color:white" href="/Teachers/login.html?redirect='+encodeURIComponent(location.pathname)+'">Sign in again</a>.'}}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':userId},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
async function load(){selected.clear();updateBulk();app.classList.add('loading');try{const j=await call({action:'list',table,filters:{level_id:currentLevel,status:status.value},page,pageSize:PAGE_SIZE});rows=j.data||[];total=j.count||0;render()}catch(e){toast(e.message,true)}finally{app.classList.remove('loading')}}
function filtered(){const q=search.value.trim().toLowerCase();return q?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)):rows}function show(v){return Array.isArray(v)?v.map(x=>`<span class="chip">${esc(x)}</span>`).join(' '):esc(v)}
function render(){const c=cfg[table],data=filtered();thead.innerHTML='<th><input type="checkbox" id="selectAll"></th>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Actions</th>';tbody.innerHTML=data.map(r=>`<tr><td><input class="rowcheck" type="checkbox" data-id="${r.id}"></td>${c.cols.map(([k])=>`<td class="${k===c.main?'maintext':''}">${show(r[k])}</td>`).join('')}<td><button class="mini" data-edit="${r.id}">Edit</button> ${table==='lexical_entries'?`<button class="mini" data-usage="${r.id}">Usage</button>`:''}</td></tr>`).join('');summary.innerHTML=`<span class="chip"><b>${total}</b> ${c.title.toLowerCase()}</span><span class="chip"><b>${data.length}</b> shown</span>`;pageInfo.textContent=total?`${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,total)} of ${total}`:'0 records';prev.disabled=page===0;next.disabled=(page+1)*PAGE_SIZE>=total;for(let i=1;i<=10;i++)$('#count-'+i).textContent=rows.filter(r=>Number(r.level_id)===i).length;$('#count-all').textContent=total;bindRows()}
function bindRows(){const all=$('#selectAll');all.onchange=()=>{$$('.rowcheck').forEach(cb=>{cb.checked=all.checked;all.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id)});updateBulk()};$$('.rowcheck').forEach(cb=>cb.onchange=()=>{cb.checked?selected.add(cb.dataset.id):selected.delete(cb.dataset.id);updateBulk()});$$('[data-edit]').forEach(b=>b.onclick=()=>openEditor(rows.find(r=>r.id===b.dataset.edit),false));$$('[data-usage]').forEach(b=>b.onclick=()=>openUsage(rows.find(r=>r.id===b.dataset.usage)))}function updateBulk(){selectedCount.textContent=selected.size;bulk.classList.toggle('show',selected.size>0)}
function defaults(){return {level_id:Number(currentLevel)||3,status:'review',metadata:{},tags:[]}}function makeInput([k,label,type,full],v){if(type==='tags'&&Array.isArray(v))v=v.join(', ');if(type==='json'&&typeof v!=='string')v=JSON.stringify(v??{},null,2);let h=type==='textarea'?`<textarea data-key="${k}">${esc(v??'')}</textarea>`:type==='status'?`<select data-key="${k}">${['review','draft','published','approved','archived'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-key="${k}" type="${type==='number'?'number':'text'}" value="${esc(v??'')}">`;return `<div class="field ${full?'full':''}"><label>${label}</label>${h}</div>`}
function openEditor(row,isNew){editing={...(row||defaults()),__new:isNew};drawerTitle.textContent=(isNew?'Add ':'Edit ')+cfg[table].title.replace(/s$/,'');fields.innerHTML=cfg[table].fields.map(f=>makeInput(f,editing[f[0]])).join('');deleteBtn.style.display=isNew?'none':'block';drawerback.classList.add('open')}function closeEditor(){drawerback.classList.remove('open');editing=null}
function formPayload(){const p={};cfg[table].fields.forEach(([k,,type])=>{const el=document.querySelector(`[data-key="${k}"]`);let v=el.value.trim();if(type==='number')v=v===''?null:Number(v);if(type==='tags')v=v?v.split(',').map(x=>x.trim()).filter(Boolean):[];if(type==='json'){try{v=v?JSON.parse(v):{}}catch{throw new Error(`${k} is not valid JSON`)}}p[k]=v===''?null:v});return p}
saveBtn.onclick=async()=>{try{const p=formPayload(),main=cfg[table].main;if(!p[main])throw new Error(`${main} is required`);if(table==='lexical_entries')p.normalized_text=String(p.canonical_text).toLowerCase().trim();if(table==='sentences')p.normalized_text=String(p.text).toLowerCase().trim();await call({action:'save',table,id:editing.__new?null:editing.id,payload:p});toast('Saved');closeEditor();load()}catch(e){toast(e.message,true)}};deleteBtn.onclick=async()=>{if(!editing||!confirm('Delete this item?'))return;try{await call({action:'delete',table,id:editing.id});closeEditor();load()}catch(e){toast(e.message,true)}};
async function openUsage(row){openEditor(row,false);const box=document.createElement('div');box.className='field full';box.innerHTML='<b>Sentence usage</b><div>Searching…</div>';fields.appendChild(box);try{const j=await call({action:'find_usage',table:'lexical_entries',term:row.canonical_text});box.innerHTML='<b>Sentence usage</b>'+(j.data||[]).map(s=>`<p><b>${esc(s.text)}</b><br>${esc(s.translation_ko||'')}</p>`).join('')}catch(e){box.innerHTML=esc(e.message)}}
applyBulk.onclick=async()=>{const p={};if(bulkLevel.value)p.level_id=Number(bulkLevel.value);if(bulkStatus.value)p.status=bulkStatus.value;if(!Object.keys(p).length)return;try{await call({action:'bulk_update',table,ids:[...selected],payload:p});load()}catch(e){toast(e.message,true)}};clearSelection.onclick=()=>{selected.clear();render()};add.onclick=()=>openEditor(null,true);refresh.onclick=load;search.oninput=render;status.onchange=()=>{page=0;load()};prev.onclick=()=>{if(page){page--;load()}};next.onclick=()=>{if((page+1)*PAGE_SIZE<total){page++;load()}};closeDrawer.onclick=cancelBtn.onclick=closeEditor;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table=b.dataset.table;page=0;load()});$$('.level').forEach(b=>b.onclick=()=>{$$('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLevel=b.dataset.level;mobileLevel.value=currentLevel;page=0;load()});mobileLevel.onchange=()=>{currentLevel=mobileLevel.value;page=0;load()};
verifyAccount();
</script>
</body></html>
