<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printable Test Builder | Willena</title>
<script src="/students/api-gateway.js?v=20260729b"></script>
<script src="/js/api-config.js?v=20260729b"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--ink:#1f2937;--navy:#172554;--blue:#4169e1;--pale:#eef3ff;--line:#d8dee9;--muted:#667085;--paper:#fff;--bg:#edf1f7;--fit:1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:100}
.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
.controls{background:#fff;border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;margin-bottom:3px}.small{font-size:12px;color:var(--muted)}
label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px}
select,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font:inherit}
.units{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.unit-chip{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;text-align:left;cursor:pointer;font:inherit;font-size:12px}
.unit-chip.on{background:var(--pale);border-color:#9fb7eb;color:#1849a9;font-weight:700}
.config-section{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.config-head{padding:11px 12px;background:#f8fafc;font-size:14px;font-weight:800}
.config-grid{padding:12px;display:grid;gap:10px}
.group-config{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:end}
.group-config label{margin:0 0 5px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;font:inherit}
.primary{background:var(--blue);color:#fff}.secondary{background:#e7ebf2}.danger{background:#fff3f1;color:#b42318}
.actions{display:grid;gap:8px;margin-top:18px}
.workspace{padding:24px;overflow:auto}
.placeholder{max-width:760px;margin:80px auto;padding:50px;text-align:center;background:#fff;border:1px dashed #aeb8c8;border-radius:18px;color:var(--muted)}
.paper{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;padding:14mm 15mm 13mm;box-shadow:0 8px 30px rgba(20,33,61,.12);position:relative;page-break-after:always;overflow:hidden;font-size:calc(15px * var(--fit))}
.test-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:9px;margin-bottom:13px}
.test-title{font-size:calc(24px * var(--fit));font-weight:800}
.section-title{font-size:calc(22px * var(--fit));font-weight:800;color:var(--navy);margin:0}
.name-line{font-size:calc(12px * var(--fit));white-space:nowrap}
.instruction{background:var(--pale);border-radius:10px;padding:9px 11px;font-weight:600;margin:10px 0 12px}
.group-label{font-size:calc(16px * var(--fit));font-weight:800;margin:12px 0 9px}
.picture-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pic-card{border:1.4px solid var(--line);border-radius:12px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.emoji{font-size:calc(44px * var(--fit));line-height:1}
.number-box{width:28px;height:28px;border:1.4px solid #667085;border-radius:6px;margin-top:8px}
.choice-list{display:grid;gap:8px}.choice-row{border-bottom:1px solid #e6eaf0;padding:7px 2px 10px}.choice-row b{display:inline-block;width:26px}.options{word-spacing:5px}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px}.match-col{display:grid;gap:8px}.match-item{min-height:44px;border-bottom:1px solid #dfe4ec;display:flex;align-items:center}.match-image{font-size:calc(34px * var(--fit));justify-content:center;border:1px solid var(--line);border-radius:10px}
.write-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.write-card{border:1.4px solid var(--line);border-radius:12px;padding:9px;text-align:center}.write-card .emoji{font-size:calc(40px * var(--fit))}.write-line{height:31px;border-bottom:1.4px solid #667085;margin-top:9px}
.wordbox{border:1.5px solid #9fb7eb;background:#f5f8ff;border-radius:10px;padding:9px 12px;margin-bottom:12px;text-align:center;font-weight:600}
.grammar-list{display:grid;gap:10px}.grammar-item{line-height:1.75;border-bottom:1px solid #e3e7ee;padding-bottom:7px}.blank{display:inline-block;min-width:92px;border-bottom:1.5px solid #667085;height:22px;vertical-align:bottom}
.unscramble{letter-spacing:.3px}.wordsearch-wrap{display:grid;grid-template-columns:1fr 120px;gap:18px}.wordsearch{border-collapse:collapse;margin:auto}.wordsearch td{width:24px;height:24px;border:1px solid #d7dce5;text-align:center;font-weight:700;font-size:calc(13px * var(--fit))}.word-list{font-size:calc(12px * var(--fit));line-height:1.9}
.footer{position:absolute;bottom:7mm;left:15mm;right:15mm;display:flex;justify-content:space-between;color:#98a2b3;font-size:9px}
.teacher-page{background:#fff9eb}.script-line{padding:7px 0;border-bottom:1px solid #ece5d2}
.player{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.24);z-index:20}.player button{border:0;border-radius:8px;padding:9px 11px;margin:2px;font-weight:700}.player-status{font-size:11px;margin-top:6px;max-width:260px}
.hide{display:none!important}
@media(max-width:960px){.app{display:block}.controls{position:relative;height:auto}.workspace{padding:10px}.paper{width:100%;height:auto;min-height:297mm}.picture-grid,.write-grid{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:#fff}.controls,.player{display:none!important}.app{display:block}.workspace{padding:0}.paper{width:210mm;height:297mm;margin:0;box-shadow:none;page-break-after:always}.placeholder{display:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<div class="app">
<aside class="controls">
<div class="brand">Printable Test Builder</div><div class="small">Listening · Vocabulary · Grammar</div>
<label>Book</label><select id="book"></select>
<label>Units</label><div class="units" id="units"></div>
<label>Test title</label><input id="title" value="English Test">

<div class="config-section"><div class="config-head">Listening</div><div class="config-grid">
<div class="group-config"><div><label>Group 1 type</label><select id="listen1"><option value="number-images">Number the pictures</option><option value="choose-word">Choose the word heard</option><option value="number-words">Number the words</option><option value="listen-match">Listen and match</option></select></div><div><label>Qs</label><select id="listen1Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
<div class="group-config"><div><label>Group 2 type</label><select id="listen2"><option value="choose-word">Choose the word heard</option><option value="number-images">Number the pictures</option><option value="number-words">Number the words</option><option value="listen-match">Listen and match</option></select></div><div><label>Qs</label><select id="listen2Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
</div></div>
<div class="config-section"><div class="config-head">Vocabulary</div><div class="config-grid">
<div class="group-config"><div><label>Group 1 type</label><select id="vocab1"><option value="match">Match pictures to words</option><option value="wordbox">Fill from a word box</option><option value="wordsearch">Word search</option></select></div><div><label>Qs</label><select id="vocab1Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
<div class="group-config"><div><label>Group 2 type</label><select id="vocab2"><option value="wordbox">Fill from a word box</option><option value="match">Match pictures to words</option><option value="wordsearch">Word search</option></select></div><div><label>Qs</label><select id="vocab2Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
</div></div>
<div class="config-section"><div class="config-head">Grammar</div><div class="config-grid">
<div class="group-config"><div><label>Group 1 type</label><select id="grammar1"><option value="circle">Choose the right word</option><option value="fill">Fill in the blank</option><option value="unscramble">Unscramble</option></select></div><div><label>Qs</label><select id="grammar1Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
<div class="group-config"><div><label>Group 2 type</label><select id="grammar2"><option value="fill">Fill in the blank</option><option value="circle">Choose the right word</option><option value="unscramble">Unscramble</option></select></div><div><label>Qs</label><select id="grammar2Count"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></div></div>
</div></div>
<div class="actions"><button class="btn primary" id="generate">Generate test</button><button class="btn secondary" id="shuffle">Regenerate questions</button><button class="btn secondary" id="print">Print / Save PDF</button><button class="btn danger" id="toggleKey">Hide answer key</button></div>
</aside>
<main class="workspace" id="workspace"><div class="placeholder"><h2>Build a printable test</h2><p>Choose each group’s activity and question count. Everything is created in the browser and nothing is saved.</p></div></main>
</div>
<div class="player hide" id="player"><div><button id="playAll">▶ Play all</button><button id="stopAudio">■ Stop</button></div><div class="player-status" id="playerStatus">Listening player ready.</div></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';
const $=id=>document.getElementById(id);let uid='',rows=[],selectedUnits=new Set(),current=null,keyVisible=true;
const EMOJI={pen:'🖊️',pencil:'✏️',eraser:'🧽',ruler:'📏',book:'📘',notebook:'📓',backpack:'🎒','pencil case':'👝',chair:'🪑',desk:'🪑',crayon:'🖍️',marker:'🖍️',red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡',orange:'🟠',purple:'🟣',black:'⚫',white:'⚪',brown:'🟤',pink:'🌸',circle:'⭕',square:'◼️',triangle:'🔺',diamond:'🔶',oval:'🥚',rectangle:'▭',bird:'🐦',butterfly:'🦋',flower:'🌸',frog:'🐸',rabbit:'🐰',squirrel:'🐿️',ball:'⚽',bat:'🏏',doll:'🪆',robot:'🤖','teddy bear':'🧸',truck:'🚚',bike:'🚲',card:'🃏','jump rope':'➰',kite:'🪁',marble:'🔵',puzzle:'🧩',cake:'🎂',chicken:'🍗',fish:'🐟',pizza:'🍕',rice:'🍚',sandwich:'🥪',bread:'🍞',cookie:'🍪','ice cream':'🍦',juice:'🧃',milk:'🥛',soda:'🥤',dance:'💃',dive:'🤿',paint:'🎨',run:'🏃',sing:'🎤',swim:'🏊','climb a tree':'🧗','fly a kite':'🪁','play soccer':'⚽','ride a bike':'🚲',arm:'💪',foot:'🦶',hand:'✋',head:'🙂',leg:'🦵',neck:'🧣',ear:'👂',eye:'👁️',finger:'☝️',mouth:'👄',nose:'👃',toe:'🦶',bear:'🐻',elephant:'🐘',giraffe:'🦒',lion:'🦁',snake:'🐍',zebra:'🦓',alligator:'🐊',gorilla:'🦍',kangaroo:'🦘',koala:'🐨',panda:'🐼',penguin:'🐧'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(arr,n){if(!arr.length)return[];const out=[];while(out.length<n)out.push(...shuffle(arr));return out.slice(0,n)}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}$('auth').style.display='none';await load()}catch(e){$('authmsg').textContent=e.message}}
async function load(){const j=await call({action:'list_catalog'});rows=(j.data||[]).filter(r=>['lexical_entry','sentence','pattern'].includes(r.occurrence_type));const books=[...new Set(rows.map(r=>r.book_title))].sort();$('book').innerHTML=books.map(b=>`<option>${esc(b)}</option>`).join('');if(books.includes('English Bus 1'))$('book').value='English Bus 1';buildUnits()}
function buildUnits(){const book=$('book').value;const units=[...new Map(rows.filter(r=>r.book_title===book).map(r=>[String(r.unit_number),r.unit_title])).entries()].sort((a,b)=>+a[0]-+b[0]);selectedUnits=new Set(units.map(x=>x[0]));$('units').innerHTML=units.map(([n,t])=>`<button class="unit-chip on" data-u="${n}">${n}. ${esc(t)}</button>`).join('');$('units').querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?selectedUnits.add(b.dataset.u):selectedUnits.delete(b.dataset.u)})}
function pool(type){return rows.filter(r=>r.book_title===$('book').value&&selectedUnits.has(String(r.unit_number))&&r.occurrence_type===type)}
function vocabPool(){const seen=new Set();return pool('lexical_entry').map(r=>{r._word=(r.lexical_text||r.source_text||'').toLowerCase();return r}).filter(r=>r._word&&EMOJI[r._word]&&!seen.has(r._word)&&seen.add(r._word))}
function page(title,subtitle,body,cls=''){return `<section class="paper ${cls}"><div class="test-head"><div><div class="test-title">${esc($('title').value)}</div><h1 class="section-title">${title}</h1></div><div class="name-line">Name: ____________________<br>Date: ____________________</div></div>${subtitle?`<div class="instruction">${subtitle}</div>`:''}${body}<div class="footer"><span>${esc($('book').value)}</span><span>Willena English</span></div></section>`}
function listeningGroup(type,items,label){const answers=[];let html='';if(type==='number-images'){const order=shuffle(items);order.forEach((x,i)=>answers.push({answer:x._word,num:i+1}));html=`<div class="group-label">${label} · Listen and write the number on each picture.</div><div class="picture-grid">${shuffle(answers).map(x=>`<div class="pic-card"><div class="emoji">${EMOJI[x.answer]}</div><div class="number-box"></div></div>`).join('')}</div>`;return{html,audio:order.map(x=>x._word),key:answers.map(x=>`${x.num}. ${x.answer}`).join('<br>')}}if(type==='choose-word'){const vp=vocabPool();const qs=items.map(x=>({answer:x._word,options:shuffle([x._word,...shuffle(vp.filter(v=>v._word!==x._word)).slice(0,2).map(v=>v._word)])}));html=`<div class="group-label">${label} · Circle the word you hear.</div><div class="choice-list">${qs.map((q,i)=>`<div class="choice-row"><b>${i+1}.</b>${q.options.map(o=>` ○ ${esc(o)}`).join('&nbsp;&nbsp;')}</div>`).join('')}</div>`;return{html,audio:qs.map(q=>q.answer),key:qs.map((q,i)=>`${i+1}. ${q.answer}`).join('<br>')}}if(type==='number-words'){const order=shuffle(items),words=shuffle(items);html=`<div class="group-label">${label} · Listen and write the number next to each word.</div><div class="choice-list">${words.map(x=>`<div class="choice-row"><span class="number-box" style="display:inline-block;vertical-align:middle;margin:0 12px 0 0"></span>${esc(x._word)}</div>`).join('')}</div>`;return{html,audio:order.map(x=>x._word),key:order.map((x,i)=>`${i+1}. ${x._word}`).join('<br>')}}const order=shuffle(items);html=`<div class="group-label">${label} · Listen and draw a line to the matching picture.</div><div class="match-wrap"><div class="match-col">${order.map((x,i)=>`<div class="match-item">${i+1}.</div>`).join('')}</div><div class="match-col">${shuffle(items).map(x=>`<div class="match-item match-image">${EMOJI[x._word]}</div>`).join('')}</div></div>`;return{html,audio:order.map(x=>x._word),key:order.map((x,i)=>`${i+1}. ${x._word}`).join('<br>')}}
function vocabGroup(type,items,label){if(type==='match'){const right=shuffle(items);return{html:`<div class="group-label">${label} · Match each word to the correct picture.</div><div class="match-wrap"><div class="match-col">${items.map((x,i)=>`<div class="match-item">${i+1}. ${esc(x._word)}</div>`).join('')}</div><div class="match-col">${right.map((x,i)=>`<div class="match-item match-image">${String.fromCharCode(65+i)}. ${EMOJI[x._word]}</div>`).join('')}</div></div>`,key:items.map((x,i)=>`${i+1}. ${String.fromCharCode(65+right.findIndex(r=>r._word===x._word))}`).join('<br>')}}if(type==='wordbox'){const box=shuffle(items).map(x=>x._word).join(' · ');return{html:`<div class="group-label">${label} · Write the correct word under each picture.</div><div class="wordbox">${esc(box)}</div><div class="write-grid">${shuffle(items).map(x=>`<div class="write-card"><div class="emoji">${EMOJI[x._word]}</div><div class="write-line"></div></div>`).join('')}</div>`,key:items.map(x=>x._word).join(', ')}}const words=items.map(x=>x._word.replace(/\s+/g,'').toUpperCase()),size=Math.max(10,...words.map(w=>w.length)),grid=Array.from({length:size},()=>Array.from({length:size},()=>String.fromCharCode(65+Math.floor(Math.random()*26))));words.forEach((w,idx)=>{const row=idx%size;for(let i=0;i<w.length&&i<size;i++)grid[row][i]=w[i]});return{html:`<div class="group-label">${label} · Find and circle the words.</div><div class="wordsearch-wrap"><table class="wordsearch">${grid.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table><div class="word-list">${items.map(x=>esc(x._word)).join('<br>')}</div></div>`,key:items.map(x=>x._word).join(', ')}}
function grammarSource(){const sents=pool('sentence').map(r=>r.sentence_text||r.source_text).filter(Boolean);return shuffle([...new Set(sents)]).filter(s=>s.split(/\s+/).length>=3&&s.split(/\s+/).length<=8)}
function grammarGroup(type,n,label){const src=take(grammarSource(),n),vp=vocabPool();if(type==='unscramble'){return{html:`<div class="group-label">${label} · Put the words in the correct order.</div><div class="grammar-list">${src.map((s,i)=>`<div class="grammar-item"><b>${i+1}.</b> <span class="unscramble">${shuffle(s.replace(/[.!?]/g,'').split(/\s+/)).join(' / ')}</span><br><span class="blank" style="min-width:88%;height:30px"></span></div>`).join('')}</div>`,key:src.map((s,i)=>`${i+1}. ${esc(s)}`).join('<br>')}}if(type==='fill'){const qs=src.map(s=>{const words=s.replace(/[.!?]/g,'').split(/\s+/);let idx=Math.max(0,words.findIndex(w=>vp.some(v=>v._word===w.toLowerCase())));if(idx<0)idx=words.length-1;const answer=words[idx];words[idx]='_____';return{q:words.join(' ')+(s.endsWith('?')?'?':'.'),answer}});return{html:`<div class="group-label">${label} · Fill in the blank.</div><div class="grammar-list">${qs.map((q,i)=>`<div class="grammar-item"><b>${i+1}.</b> ${esc(q.q)}</div>`).join('')}</div>`,key:qs.map((q,i)=>`${i+1}. ${esc(q.answer)}`).join('<br>')}}const qs=src.map(s=>{const words=s.replace(/[.!?]/g,'').split(/\s+/);let idx=Math.min(1,words.length-1);const answer=words[idx];let wrong=answer.toLowerCase()==='is'?'are':answer.toLowerCase()==='are'?'is':answer.toLowerCase()==='a'?'an':answer.toLowerCase()==='an'?'a':answer.toLowerCase()==='this'?'these':answer.toLowerCase()==='these'?'this':answer.toLowerCase()==='that'?'those':answer.toLowerCase()==='those'?'that':'not';words[idx]=`(${answer} / ${wrong})`;return{q:words.join(' ')+(s.endsWith('?')?'?':'.'),answer}});return{html:`<div class="group-label">${label} · Circle the correct word.</div><div class="grammar-list">${qs.map((q,i)=>`<div class="grammar-item"><b>${i+1}.</b> ${esc(q.q)}</div>`).join('')}</div>`,key:qs.map((q,i)=>`${i+1}. ${esc(q.answer)}`).join('<br>')}}
function fitPages(){requestAnimationFrame(()=>document.querySelectorAll('.paper').forEach(p=>{let f=1;p.style.setProperty('--fit',f);while(p.scrollHeight>p.clientHeight&&f>.72){f-=.03;p.style.setProperty('--fit',f.toFixed(2))}}))}
function buildTest(){const vocab=vocabPool();if(vocab.length<10){alert('Select more units. This test needs at least 10 image-friendly vocabulary words.');return}const l1n=+$('listen1Count').value,l2n=+$('listen2Count').value,v1n=+$('vocab1Count').value,v2n=+$('vocab2Count').value,g1n=+$('grammar1Count').value,g2n=+$('grammar2Count').value;const l1=listeningGroup($('listen1').value,take(vocab,l1n),'A');const l2=listeningGroup($('listen2').value,take(vocab.filter(x=>!l1.audio?.includes(x._word)),l2n),'B');const v1=vocabGroup($('vocab1').value,take(vocab,v1n),'A');const v2=vocabGroup($('vocab2').value,take(vocab,v2n),'B');const g1=grammarGroup($('grammar1').value,g1n,'A');const g2=grammarGroup($('grammar2').value,g2n,'B');const listening=page('Listening','Listen carefully. Each item will be played twice.',l1.html+l2.html);const vocabulary=page('Vocabulary','Use the pictures and words to complete each activity.',v1.html+v2.html);const grammar=page('Grammar','Read each item carefully.',g1.html+g2.html);const key=page('Answer Key','Teacher copy.',`<div class="group-label">Listening A</div>${l1.key}<div class="group-label">Listening B</div>${l2.key}<div class="group-label">Vocabulary A</div>${v1.key}<div class="group-label">Vocabulary B</div>${v2.key}<div class="group-label">Grammar A</div>${g1.key}<div class="group-label">Grammar B</div>${g2.key}`,'teacher-page');const script=page('Listening Script','Play each item twice.',`<div class="group-label">Group A</div>${l1.audio.map((x,i)=>`<div class="script-line">${i+1}. ${esc(x)}</div>`).join('')}<div class="group-label">Group B</div>${l2.audio.map((x,i)=>`<div class="script-line">${i+1}. ${esc(x)}</div>`).join('')}`,'teacher-page');current={audio:[...l1.audio,...l2.audio]};$('workspace').innerHTML=listening+vocabulary+grammar+key+script;$('player').classList.remove('hide');fitPages()}
async function playAll(){if(!current)return;speechSynthesis.cancel();for(let i=0;i<current.audio.length;i++){await speak(current.audio[i],i)}$('playerStatus').textContent='Finished.'}
function speak(text,i){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.onstart=()=>$('playerStatus').textContent=`Playing ${i+1} of ${current.audio.length}: ${text}`;u.onend=()=>setTimeout(res,650);u.onerror=res;speechSynthesis.speak(u)})}
$('book').onchange=buildUnits;$('generate').onclick=buildTest;$('shuffle').onclick=buildTest;$('print').onclick=()=>window.print();$('toggleKey').onclick=()=>{keyVisible=!keyVisible;document.querySelectorAll('.teacher-page').forEach(x=>x.classList.toggle('hide',!keyVisible));$('toggleKey').textContent=keyVisible?'Hide answer key':'Show answer key'};$('playAll').onclick=playAll;$('stopAudio').onclick=()=>{speechSynthesis.cancel();$('playerStatus').textContent='Stopped.'};verify();
</script>
