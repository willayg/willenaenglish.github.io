:root{--ink:#172033;--navy:#14213d;--blue:#3567d6;--pale:#eef4ff;--line:#d8e0ec;--muted:#667085;--bg:#edf1f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:100}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.controls{background:#fff;border-right:1px solid var(--line);padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800}.small{font-size:12px;color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}select,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;font:inherit}.units{display:grid;grid-template-columns:1fr 1fr;gap:7px}.unit-chip{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;text-align:left;cursor:pointer}.unit-chip.on{background:var(--pale);border-color:#9fb7eb;color:#1849a9;font-weight:700}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;margin-top:9px}.primary{background:var(--blue);color:#fff}.secondary{background:#e7ebf2;color:var(--ink)}.workspace{padding:24px}.placeholder{max-width:760px;margin:80px auto;padding:50px;text-align:center;background:#fff;border:1px dashed #aeb8c8;border-radius:18px;color:var(--muted)}.paper{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;padding:13mm 15mm 13mm;box-shadow:0 8px 30px rgba(20,33,61,.12);position:relative;page-break-after:always;overflow:hidden}.test-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:9px;margin-bottom:12px}.test-title{font-size:24px;font-weight:800}.section-title{font-size:22px;font-weight:800;color:var(--navy);margin:0}.name-line{font-size:12px;white-space:nowrap}.group{position:relative;border:2px solid transparent;border-radius:14px;padding:6px;margin:2px -6px 8px;cursor:pointer}.group:hover{border-color:#b7c9ef;background:#f8faff}.group:after{content:'Click to change';position:absolute;right:10px;top:7px;font-size:9px;color:#7b8aa5;opacity:0}.group:hover:after{opacity:1}.instruction{background:var(--pale);border-radius:10px;padding:9px 11px;font-weight:700;margin:0 0 9px}.group-label{font-size:15px;font-weight:800;margin:6px 0 8px}.picture-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pic-card{border:1.5px solid var(--line);border-radius:12px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}.emoji{font-size:40px;line-height:1}.number-box{width:27px;height:27px;border:1.5px solid #667085;border-radius:6px;margin-top:8px}.choice-list,.grammar-list{display:grid;gap:6px}.choice-row,.grammar-item{border-bottom:1px solid #e6eaf0;padding:5px 2px 8px;font-size:15px;line-height:1.5;break-inside:avoid;overflow-wrap:anywhere}.choice-row b{display:inline-block;width:28px}.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px}.match-col{display:grid;gap:6px}.match-item{min-height:40px;border-bottom:1px solid #dfe4ec;display:flex;align-items:center;font-size:15px}.match-image{font-size:31px;justify-content:center;border:1px solid var(--line);border-radius:10px}.word-box{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;word-spacing:12px;margin-bottom:9px;overflow-wrap:anywhere}.write-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.write-card{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center}.write-line{height:30px;border-bottom:1.5px solid #667085;margin-top:8px}.wordsearch{border-collapse:collapse;margin:auto}.wordsearch td{width:25px;height:25px;text-align:center;border:1px solid #d9dfeb;font-weight:700;font-size:13px}.footer{position:absolute;bottom:7mm;left:15mm;right:15mm;display:flex;justify-content:space-between;color:#98a2b3 </style></head><body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<div class="app"><aside class="controls"><div class="brand">Printable Test Builder</div><div class="small">Click any group on the preview to change only that group.</div><label>Book</label><select id="book"></select><label>Units</label><div class="units" id="units"></div><label>Title</label><input id="title" value="English Test"><button class="btn primary" id="generate">Generate test</button><button class="btn secondary" id="shuffle">Regenerate everything</button><button class="btn secondary" id="print">Print / Save PDF</button><button class="btn secondary" id="toggleKey">Hide answer key</button></aside><main class="workspace" id="workspace"><div class="placeholder"><h2>Build a printable test</h2><p>Select a book and units, then generate. Click a group directly on the paper to change its type or question count.</p></div></main></div>

<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin',$=id=>document.getElementById(id);let uid='',rows=[],selectedUnits=new Set(),test=null,keyVisible=true,editing=null;
const EMOJI={pen:'🖊️',pencil:'✏️',eraser:'🧽',ruler:'📏',book:'📘',notebook:'📓',backpack:'🎒','pencil case':'👝',chair:'🪑',desk:'🪑',crayon:'🖍️',marker:'🖍️',red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡',orange:'🟠',purple:'🟣',black:'⚫',white:'⚪',brown:'🟤',pink:'🌸',circle:'⭕',square:'◼️',triangle:'🔺',diamond:'🔶',oval:'🥚',rectangle:'▭',bird:'🐦',butterfly:'🦋',flower:'🌸',frog:'🐸',rabbit:'🐰',squirrel:'🐿️',ball:'⚽',bat:'🏏',doll:'🪆',robot:'🤖','teddy bear':'🧸',truck:'🚚',bike:'🚲',card:'🃏','jump rope':'➰',kite:'🪁',marble:'🔵',puzzle:'🧩',cake:'🎂',chicken:'🍗',fish:'🐟',pizza:'🍕',rice:'🍚',sandwich:'🥪',bread:'🍞',cookie:'🍪','ice cream':'🍦',juice:'🧃',milk:'🥛',soda:'🥤',dance:'💃',dive:'🤿',paint:'🎨',run:'🏃',sing:'🎤',swim:'🏊','climb a tree':'🧗','fly a kite':'🪁','play soccer':'⚽','ride a bike':'🚲',arm:'💪',foot:'🦶',hand:'✋',head:'🙂',leg:'🦵',neck:'🧣',ear:'👂',eye:'👁️',finger:'☝️',mouth:'👄',nose:'👃',toe:'🦶',bear:'🐻',elephant:'🐘',giraffe:'🦒',lion:'🦁',snake:'🐍',zebra:'🦓',alligator:'🐊',gorilla:'🦍',kangaroo:'🦘',koala:'🐨',panda:'🐼',penguin:'🐧'};
const TYPES={listening:[['number-images','Listen and number the pictures'],['choose-word','Listen and choose the word'],['number-words','Listen and number the words'],['listen-match','Listen and match']],vocabulary:[['match','Look and match'],['wordbox','Look and write'],['wordsearch','Find the words']],grammar:[['circle','Choose the right word'],['fill','Fill in the blanks'],['unscramble','Unscramble the sentences']]};
const LETTERS={l1:'A',l2:'B',v1:'A',v2:'B',g1:'A',g2:'B'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function take(a,n){let o=[];if(!a.length)return o;while(o.length<n)o.push(...shuffle(a));return o.slice(0,n)}
async function call(body){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{let r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid)),j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}$('auth').style.display='none';load()}catch(e){$('authmsg').textContent=e.message}}
async function load(){let j=await call({action:'list_catalog'});rows=(j.data||[]).filter(r=>['lexical_entry','sentence','pattern'].includes(r.occurrence_type));let books=[...new Set(rows.map(r=>r.book_title))].sort();$('book').innerHTML=books.map(b=>`<option>${esc(b)}</option>`).join('');if(books.includes('English Bus 1'))$('book').value='English Bus 1';buildUnits()}
function buildUnits(){let units=[...new Map(rows.filter(r=>r.book_title===$('book').value).map(r=>[String(r.unit_number),r.unit_title])).entries()].sort((a,b)=>+a[0]-+b[0]);selectedUnits=new Set(units.map(x=>x[0]));$('units').innerHTML=units.map(([n,t])=>`<button class="unit-chip on" data-u="${n}">${n}. ${esc(t)}</button>`).join('');$('units').querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?selectedUnits.add(b.dataset.u):selectedUnits.delete(b.dataset.u)})}
function pool(t){return rows.filter(r=>r.book_title===$('book').value&&selectedUnits.has(String(r.unit_number))&&r.occurrence_type===t)}function vocab(){let s=new Set;return pool('lexical_entry').filter(r=>{let w=(r.lexical_text||r.source_text||'').toLowerCase();if(!w||!EMOJI[w]||s.has(w))return false;s.add(w);r._word=w;return true})}
function cleanSentence(x){let p=(x.sentence_text||x.source_text||x.response_pattern||x.prompt_pattern||'').trim();if(/[+{}]/.test(p))return'';p=p.replace(/\s*\/\s*/g,' ').replace(/\s+/g,' ').trim();return p&&p.split(' ').length>=2?p:''}
function grammarPool(){let s=pool('sentence').map(x=>({...x,_sentence:cleanSentence(x)})).filter(x=>x._sentence);let seen=new Set;return s.filter(x=>{let k=x._sentence.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function makeGroup(section,type,count){let items=section==='grammar'?take(grammarPool(),count):take(vocab(),count);return{section,type,count,items}}
function generate(){test={groups:{l1:makeGroup('listening','number-images',8),l2:makeGroup('listening','choose-word',8),v1:makeGroup('vocabulary','match',8),v2:makeGroup('vocabulary','wordbox',8),g1:makeGroup('grammar','circle',8),g2:makeGroup('grammar','fill',8)}};render()}
function titleFor(g){return TYPES[g.section].find(x=>x[0]===g.type)?.[1]||g.type}function groupWrap(id,g,body,instruction){return `<div class="group" data-group="${id}"><div class="instruction">${LETTERS[id]}. ${instruction}</div><div class="group-label">${LETTERS[id]} · ${titleFor(g)} · ${g.count} questions</div>${body}</div>`}
function renderGroup(id,g){let words=g.items.map(x=>x._word||'');if(g.section==='listening'&&g.type==='number-images'){let order=shuffle(words.map((w,i)=>({w,n:i+1})));g.answers=order.map(x=>x.w);return groupWrap(id,g,`<div class="picture-grid">${shuffle(order).map(x=>`<div class="pic-card"><div class="emoji">${EMOJI[x.w]}</div><div class="number-box"></div></div>`).join('')}</div>`,'Listen and write the number on each picture.')}if(g.section==='listening'&&g.type==='choose-word'){g.answers=words;g.options=[];return groupWrap(id,g,`<div class="choice-list">${words.map((w,i)=>{let ds=shuffle(vocab().filter(v=>v._word!==w)).slice(0,2).map(v=>v._word),opts=shuffle([w,...ds]);g.options.push(opts);return `<div class="choice-row"><b>${i+1}.</b>${opts.map(x=>` ○ ${esc(x)}`).join('&nbsp;&nbsp;')}</div>`}).join('')}</div>`,'Listen and circle the word you hear.')}if(g.section==='listening'&&g.type==='number-words'){let order=shuffle(words.map((w,i)=>({w,n:i+1})));g.answers=order.map(x=>x.w);return groupWrap(id,g,`<div class="choice-list">${shuffle(order).map(x=>`<div class="choice-row"><span class="number-box" style="display:inline-block;margin:0 12px 0 0"></span>${esc(x.w)}</div>`).join('')}</div>`,'Listen and write the number beside each word.')}if(g.section==='listening'){g.answers=words;return groupWrap(id,g,`<div class="match-wrap"><div class="match-col">${words.map((w,i)=>`<div class="match-item">${i+1}. __________</div>`).join('')}</div><div class="match-col">${shuffle(words).map(w=>`<div class="match-item match-image">${EMOJI[w]}</div>`).join('')}</div></div>`,'Listen and match each number to a picture.')}if(g.section==='vocabulary'&&g.type==='match'){g.answers=words;return groupWrap(id,g,`<div class="match-wrap"><div class="match-col">${words.map((w,i)=>`<div class="match-item">${i+1}. ${esc(w)}</div>`).join('')}</div><div class="match-col">${shuffle(words).map(w=>`<div class="match-item match-image">${EMOJI[w]}</div>`).join('')}</div></div>`,'Look and match the words to the pictures.')}if(g.section==='vocabulary'&&g.type==='wordbox'){g.answers=words;return groupWrap(id,g,`<div class="word-box">${shuffle(words).map(esc).join(' · ')}</div><div class="write-grid">${words.map(w=>`<div class="write-card"><div class="emoji">${EMOJI[w]}</div><div class="write-line"></div></div>`).join('')}</div>`,'Look at the pictures. Use the word box and write the words.')}if(g.section==='vocabulary'){g.answers=words;let size=Math.max(10,Math.min(14,Math.ceil(Math.sqrt(words.join('').length*1.8)))),grid=Array.from({length:size},()=>Array.from({length:size},()=>String.fromCharCode(65+Math.floor(Math.random()*26))));words.forEach((w,k)=>{let s=w.replace(/[^a-z]/g,'').toUpperCase().slice(0,size),r=k%size;for(let i=0;i<s.length;i++)grid[r][i]=s[i]});return groupWrap(id,g,`<div class="word-box">${words.map(esc).join(' · ')}</div><table class="wordsearch">${grid.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`,'Find and circle the words.')}let sentences=g.items.map(x=>x._sentence);if(g.type==='unscramble'){g.answers=sentences;let body=sentences.map((s,i)=>{let end=(s.match(/[?!]$/)||[''])[0],parts=s.replace(/[.?!]$/,'').split(/\s+/);return `<div class="grammar-item">${i+1}. ${shuffle(parts).join(' / ')}${end}<div class="write-line"></div></div>`}).join('');return groupWrap(id,g,`<div class="grammar-list">${body}</div>`,'Put the words in the correct order.')}if(g.type==='fill'){let qs=[],answers=[];sentences.forEach((s,i)=>{let end=(s.match(/[.?!]$/)||[''])[0],parts=s.replace(/[.?!]$/,'').split(/\s+/),candidates=parts.map((w,j)=>({w,j})).filter(x=>/^[A-Za-z’']+$/.test(x.w)&&x.w.length>1),pick=candidates[Math.floor(Math.random()*candidates.length)]||{w:parts[0],j:0};answers.push(pick.w);parts[pick.j]='__________';qs.push(`<div class="grammar-item">${i+1}. ${esc(parts.join(' ')+end)}</div>`)});g.answers=answers;return groupWrap(id,g,`<div class="word-box">${shuffle(answers).map(esc).join(' · ')}</div><div class="grammar-list">${qs.join('')}</div>`,'Use the word box. Write the missing word.')}let answers=[],body=sentences.map((s,i)=>{let parts=s.split(/\s+/),targetIndex=Math.max(0,parts.findIndex(w=>/^(is|are|am|a|an|this|these|that|those|do|does|can|can't|don't)$/i.test(w)));if(targetIndex<0)targetIndex=0;let good=parts[targetIndex].replace(/[.,?!]/g,''),bad=good.toLowerCase()==='is'?'are':good.toLowerCase()==='are'?'is':good.toLowerCase()==='a'?'an':good.toLowerCase()==='an'?'a':good.toLowerCase()==='this'?'these':good.toLowerCase()==='these'?'this':good.toLowerCase()==='that'?'those':good.toLowerCase()==='those'?'that':good.toLowerCase()==='do'?'does':good.toLowerCase()==='does'?'do':good.toLowerCase()==='can'?"can't":'can';answers.push(good);parts[targetIndex]=`(${good} / ${bad})`;return `<div class="grammar-item">${i+1}. ${esc(parts.join(' '))}</div>`}).join('');g.answers=answers;return groupWrap(id,g,`<div class="grammar-list">${body}</div>`,'Circle the correct word.')}
function page(section,ids){return `<section class="paper"><div class="test-head"><div><div class="test-title">${esc($('title').value)}</div><h1 class="section-title">${section}</h1></div><div class="name-line">Name: ____________________<br>Date: ____________________</div></div>${ids.map(id=>renderGroup(id,test.groups[id])).join('')}<div class="footer"><span>${esc($('book').value)}</span><span>Willena English</span></div></section>`}
function keyBlock(id,g){let vals=(g.answers||[]).map(x=>x.w||x);return `<div class="key-section"><div class="key-title">${g.section[0].toUpperCase()+g.section.slice(1)} ${LETTERS[id]} — ${titleFor(g)}</div><div class="key-grid">${vals.map((x,i)=>`<div>${i+1}. ${esc(x)}</div>`).join('')}</div></div>`}
function render(){let pages=page('Listening',['l1','l2'])+page('Vocabulary',['v1','v2'])+page('Grammar',['g1','g2']);let key=`<section class="paper teacher-page ${keyVisible?'':'hide'}"><div class="test-head"><div><div class="test-title">${esc($('title').value)}</div><h1 class="section-title">Answer Key & Listening Script</h1></div></div>${Object.entries(test.groups).map(([id,g])=>keyBlock(id,g)).join('')}</section>`;$('workspace').innerHTML=pages+key;$('player').classList.remove('hide');requestAnimationFrame(()=>{fit();document.querySelectorAll('.group').forEach(el=>el.onclick=e=>openPop(el.dataset.group,e.currentTarget))})}
function fit(){document.querySelectorAll('.paper').forEach(p=>{p.classList.remove('fit-1','fit-2','fit-3');for(let c of ['fit-1','fit-2','fit-3']){if(p.scrollHeight<=p.clientHeight)break;p.classList.add(c)}if(p.scrollHeight>p.clientHeight){p.querySelectorAll('.group').forEach(g=>g.style.transform='scale(.94)');p.querySelectorAll('.group').forEach(g=>g.style.transformOrigin='top left')}})}
function openPop(id,el){editing=id;let g=test.groups[id],r=el.getBoundingClientRect();$('pop').innerHTML=`<h3>Change this group only</h3><label>Question type</label><select id="popType">${TYPES[g.section].map(([v,t])=>`<option value="${v}" ${v===g.type?'selected':''}>${t}</option>`).join('')}</select><label>Number of questions</label><select id="popCount">${[4,6,8,10].map(n=>`<option ${n===g.count?'selected':''}>${n}</option>`).join('')}</select><div class="pop-actions"><button id="popCancel">Cancel</button><button id="popApply" style="background:var(--blue);color:white">Apply</button></div>`;$('pop').style.left=Math.min(innerWidth-270,r.left+20)+'px';$('pop').style.top=Math.min(innerHeight-230,r.top+45)+'px';$('pop').classList.remove('hide');$('popCancel').onclick=closePop;$('popApply').onclick=()=>{let old=test.groups[editing];test.groups[editing]=makeGroup(old.section,$('popType').value,+$('popCount').value);closePop();render()}}
function closePop(){$('pop').classList.add('hide');editing=null}async function playAll(){speechSynthesis.cancel();let words=Object.values(test.groups).filter(g=>g.section==='listening').flatMap(g=>(g.answers||[]).map(x=>x.w||x));for(let i=0;i<words.length;i++){await new Promise(res=>{let u=new SpeechSynthesisUtterance(words[i]);u.rate=.72;u.onend=()=>setTimeout(res,800);speechSynthesis.speak(u)});$('playerStatus').textContent=`${i+1} / ${words.length}`}}
$('book').onchange=buildUnits;$('generate').onclick=generate;$('shuffle').onclick=generate;$('print').onclick=()=>{fit();setTimeout(()=>window.print(),100)};$('toggleKey').onclick=()=>{keyVisible=!keyVisible;document.querySelectorAll('.teacher-page').forEach(x=>x.classList.toggle('hide',!keyVisible));$('toggleKey').textContent=keyVisible?'Hide answer key':'Show answer key'};$('playAll').onclick=playAll;$('stopAudio').onclick=()=>speechSynthesis.cancel();document.addEventListener('click',e=>{if(!$('pop').classList.contains('hide')&&!$('pop').contains(e.target)&&!e.target.closest('.group'))closePop()});verify();
</script></body></html>
