<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printable Test Builder | Willena</title>
<script src="/students/api-gateway.js?v=20260729b"></script>
<script src="/js/api-config.js?v=20260729b"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--ink:#172033;--navy:#14213d;--blue:#3567d6;--pale:#eef4ff;--line:#d8e0ec;--muted:#667085;--paper:#fff;--bg:#edf1f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:100}.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.controls{background:#fff;border-right:1px solid var(--line);padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;margin-bottom:4px}.small{font-size:12px;color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}select,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;font:inherit}.units{display:grid;grid-template-columns:1fr 1fr;gap:7px}.unit-chip{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;text-align:left;cursor:pointer}.unit-chip.on{background:var(--pale);border-color:#9fb7eb;color:#1849a9;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e7ebf2;color:var(--ink)}.danger{background:#fff3f1;color:#b42318}.actions{display:grid;gap:8px;margin-top:20px}.workspace{padding:24px;overflow:auto}.placeholder{max-width:760px;margin:80px auto;padding:50px;text-align:center;background:#fff;border:1px dashed #aeb8c8;border-radius:18px;color:var(--muted)}.paper{width:210mm;min-height:297mm;margin:0 auto 20px;background:var(--paper);padding:15mm 16mm 14mm;box-shadow:0 8px 30px rgba(20,33,61,.12);position:relative;page-break-after:always}.test-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:16px}.test-title{font-size:25px;font-weight:800}.section-title{font-size:23px;font-weight:800;color:var(--navy);margin:0}.name-line{font-size:13px;white-space:nowrap}.instruction{background:var(--pale);border-radius:10px;padding:10px 12px;font-weight:600;margin:12px 0 14px}.group-label{font-size:16px;font-weight:800;margin:14px 0 10px}.picture-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pic-card{border:1.5px solid var(--line);border-radius:13px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px}.emoji{font-size:46px;line-height:1}.number-box{width:28px;height:28px;border:1.5px solid #667085;border-radius:6px;margin-top:9px}.choice-list{display:grid;gap:10px}.choice-row{border-bottom:1px solid #e6eaf0;padding:8px 2px 12px;font-size:16px}.choice-row b{display:inline-block;width:28px}.options{word-spacing:7px}.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px}.match-col{display:grid;gap:9px}.match-item{min-height:48px;border-bottom:1px solid #dfe4ec;display:flex;align-items:center;font-size:16px}.match-image{font-size:35px;justify-content:center;border:1px solid var(--line);border-radius:10px}.write-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.write-card{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}.write-card .emoji{font-size:42px}.write-line{height:35px;border-bottom:1.5px solid #667085;margin-top:10px}.grammar-list{display:grid;gap:13px}.grammar-item{font-size:16px;line-height:1.8;border-bottom:1px solid #e3e7ee;padding-bottom:8px}.blank{display:inline-block;min-width:100px;border-bottom:1.5px solid #667085;height:24px;vertical-align:bottom}.footer{position:absolute;bottom:8mm;left:16mm;right:16mm;display:flex;justify-content:space-between;color:#98a2b3;font-size:10px}.teacher-page{background:#fff8e7}.script-line{padding:8px 0;border-bottom:1px solid #ece5d2}.player{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.24);z-index:20}.player button{border:0;border-radius:8px;padding:9px 11px;margin:2px;font-weight:700}.player-status{font-size:11px;margin-top:6px;max-width:260px}.hide{display:none!important}@media(max-width:900px){.app{display:block}.controls{position:relative;height:auto}.workspace{padding:10px}.paper{width:100%;min-height:auto}.picture-grid,.write-grid{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:#fff}.controls,.player{display:none!important}.app{display:block}.workspace{padding:0}.paper{width:210mm;height:297mm;min-height:297mm;margin:0;box-shadow:none;page-break-after:always;overflow:hidden}.teacher-page{display:block}.placeholder{display:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<div class="app">
<aside class="controls">
<div class="brand">Printable Test Builder</div><div class="small">Listening · Vocabulary · Grammar MVP</div>
<label>Book</label><select id="book"></select>
<label>Units</label><div class="units" id="units"></div>
<div class="row"><div><label>Questions per group</label><select id="count"><option>4</option><option selected>8</option></select></div><div><label>Title</label><input id="title" value="English Test"></div></div>
<label>Listening group 1</label><select id="listen1"><option value="number-images">Hear words · number pictures</option></select>
<label>Listening group 2</label><select id="listen2"><option value="circle-word">Circle the word you hear</option></select>
<label>Vocabulary group 1</label><select id="vocab1"><option value="match">Match words to pictures</option></select>
<label>Vocabulary group 2</label><select id="vocab2"><option value="write">Write the word</option></select>
<label>Grammar group 1</label><select id="grammar1"><option value="circle">Circle the correct word</option></select>
<label>Grammar group 2</label><select id="grammar2"><option value="fill">Fill in the blank</option></select>
<div class="actions"><button class="btn primary" id="generate">Generate test</button><button class="btn secondary" id="shuffle">Regenerate questions</button><button class="btn secondary" id="print">Print / Save PDF</button><button class="btn danger" id="toggleKey">Hide answer key</button></div>
</aside>
<main class="workspace" id="workspace"><div class="placeholder"><h2>Build a printable test</h2><p>Select a book and units, then generate. The test is created entirely in the browser and is not saved.</p></div></main>
</div>
<div class="player hide" id="player"><div><button id="playAll">▶ Play all</button><button id="stopAudio">■ Stop</button></div><div class="player-status" id="playerStatus">Listening player ready.</div></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';
const $=id=>document.getElementById(id);let uid='',rows=[],selectedUnits=new Set(),current=null,keyVisible=true;
const EMOJI={pen:'🖊️',pencil:'✏️',eraser:'🧽',ruler:'📏',book:'📘',notebook:'📓',backpack:'🎒','pencil case':'👝',chair:'🪑',desk:'🪑',crayon:'🖍️',marker:'🖍️',red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡',orange:'🟠',purple:'🟣',black:'⚫',white:'⚪',brown:'🟤',pink:'🌸',circle:'⭕',square:'◼️',triangle:'🔺',diamond:'🔶',oval:'🥚',rectangle:'▭',bird:'🐦',butterfly:'🦋',flower:'🌸',frog:'🐸',rabbit:'🐰',squirrel:'🐿️',ball:'⚽',bat:'🏏',doll:'🪆',robot:'🤖','teddy bear':'🧸',truck:'🚚',bike:'🚲',card:'🃏','jump rope':'➰',kite:'🪁',marble:'🔵',puzzle:'🧩',cake:'🎂',chicken:'🍗',fish:'🐟',pizza:'🍕',rice:'🍚',sandwich:'🥪',bread:'🍞',cookie:'🍪','ice cream':'🍦',juice:'🧃',milk:'🥛',soda:'🥤',dance:'💃',dive:'🤿',paint:'🎨',run:'🏃',sing:'🎤',swim:'🏊','climb a tree':'🧗','fly a kite':'🪁','play soccer':'⚽','ride a bike':'🚲',arm:'💪',foot:'🦶',hand:'✋',head:'🙂',leg:'🦵',neck:'🧣',ear:'👂',eye:'👁️',finger:'☝️',mouth:'👄',nose:'👃',toe:'🦶',bear:'🐻',elephant:'🐘',giraffe:'🦒',lion:'🦁',snake:'🐍',zebra:'🦓',alligator:'🐊',gorilla:'🦍',kangaroo:'🦘',koala:'🐨',panda:'🐼',penguin:'🐧'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}$('auth').style.display='none';await load()}catch(e){$('authmsg').textContent=e.message}}
async function load(){const j=await call({action:'list_catalog'});rows=(j.data||[]).filter(r=>['lexical_entry','sentence','pattern'].includes(r.occurrence_type));const books=[...new Set(rows.map(r=>r.book_title))].sort();$('book').innerHTML=books.map(b=>`<option>${esc(b)}</option>`).join('');if(books.includes('English Bus 1'))$('book').value='English Bus 1';buildUnits()}
function buildUnits(){const book=$('book').value;const units=[...new Map(rows.filter(r=>r.book_title===book).map(r=>[String(r.unit_number),r.unit_title])).entries()].sort((a,b)=>+a[0]-+b[0]);selectedUnits=new Set(units.map(x=>x[0]));$('units').innerHTML=units.map(([n,t])=>`<button class="unit-chip on" data-u="${n}">${n}. ${esc(t)}</button>`).join('');$('units').querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?selectedUnits.add(b.dataset.u):selectedUnits.delete(b.dataset.u)})}
function pool(type){return rows.filter(r=>r.book_title===$('book').value&&selectedUnits.has(String(r.unit_number))&&r.occurrence_type===type)}
function vocabPool(){const seen=new Set();return pool('lexical_entry').filter(r=>{const w=(r.lexical_text||r.source_text||'').toLowerCase();if(!w||!EMOJI[w]||seen.has(w))return false;seen.add(w);r._word=w;return true})}
function take(arr,n){if(!arr.length)return[];const out=[];while(out.length<n)out.push(...shuffle(arr));return out.slice(0,n)}
function page(title,subtitle,body,cls=''){return `<section class="paper ${cls}"><div class="test-head"><div><div class="test-title">${esc($('title').value)}</div><h1 class="section-title">${title}</h1></div><div class="name-line">Name: ____________________<br>Date: ____________________</div></div>${subtitle?`<div class="instruction">${subtitle}</div>`:''}${body}<div class="footer"><span>${esc($('book').value)}</span><span>Willena English</span></div></section>`}
function buildTest(){const n=+$('count').value;const vocab=vocabPool();if(vocab.length<Math.min(n,4)){alert('Not enough image-friendly vocabulary in the selected units.');return}const listeningPics=take(vocab,n);const listenWords=take(vocab.filter(x=>!listeningPics.includes(x)),n);const match=take(vocab,n);const write=take(vocab.filter(x=>!match.includes(x)),n);const patterns=pool('pattern');
const l1Order=shuffle(listeningPics);const l1Answers=l1Order.map((x,i)=>({word:x._word,num:i+1}));const l1Cards=shuffle(l1Answers).map(x=>`<div class="pic-card"><div class="emoji">${EMOJI[x.word]}</div><div class="number-box"></div></div>`).join('');
const l2=listenWords.map((x,i)=>{const distract=shuffle(vocab.filter(v=>v._word!==x._word)).slice(0,2).map(v=>v._word);return {answer:x._word,options:shuffle([x._word,...distract])}});
const l2Html=l2.map((q,i)=>`<div class="choice-row"><b>${i+1}.</b><span class="options">${q.options.map(o=>`○ ${esc(o)}`).join('&nbsp;&nbsp;&nbsp;')}</span></div>`).join('');
const listening=page('Listening','A. Listen and write the number on the correct picture.',`<div class="group-label">A · Number the pictures</div><div class="picture-grid">${l1Cards}</div><div class="group-label">B · Circle the word you hear</div><div class="choice-list">${l2Html}</div>`);
const matchLetters=shuffle(match.map((x,i)=>({word:x._word,emoji:EMOJI[x._word],letter:String.fromCharCode(65+i)})));const vocab1=`<div class="match-wrap"><div class="match-col">${match.map((x,i)=>`<div class="match-item"><b>${i+1}.</b>&nbsp; ${esc(x._word)}</div>`).join('')}</div><div class="match-col">${matchLetters.map(x=>`<div class="match-item match-image"><b>${x.letter}.</b>&nbsp; ${x.emoji}</div>`).join('')}</div></div>`;
const vocab2=`<div class="write-grid">${write.map(x=>`<div class="write-card"><div class="emoji">${EMOJI[x._word]}</div><div class="write-line"></div></div>`).join('')}</div>`;
const vocabulary=page('Vocabulary','A. Match each word to the correct picture. B. Write the word.',`<div class="group-label">A · Match</div>${vocab1}<div class="group-label">B · Write the word</div>${vocab2}`);
const grammarItems=makeGrammar(patterns,vocab,n);const grammar=page('Grammar','A. Circle the correct word. B. Complete each sentence.',`<div class="group-label">A · Circle the correct word</div><div class="grammar-list">${grammarItems.circle.map((q,i)=>`<div class="grammar-item"><b>${i+1}.</b> ${q.html}</div>`).join('')}</div><div class="group-label">B · Fill in the blank</div><div class="grammar-list">${grammarItems.fill.map((q,i)=>`<div class="grammar-item"><b>${i+1}.</b> ${q.html}</div>`).join('')}</div>`);
const key=page('Answer Key','Teacher copy',answerKey(l1Answers,l2,match,matchLetters,write,grammarItems),'teacher-page');const script=page('Listening Script','Read each item twice, or use the player.',`<div class="group-label">Part A</div>${l1Answers.map(x=>`<div class="script-line"><b>${x.num}.</b> ${esc(x.word)}</div>`).join('')}<div class="group-label">Part B</div>${l2.map((x,i)=>`<div class="script-line"><b>${i+1}.</b> ${esc(x.answer)}</div>`).join('')}`,'teacher-page');
current={audio:[...l1Answers.map(x=>x.word),...l2.map(x=>x.answer)]};$('workspace').innerHTML=listening+vocabulary+grammar+key+script;$('player').classList.remove('hide');keyVisible=true;$('toggleKey').textContent='Hide answer key'}
function makeGrammar(patterns,vocab,n){const nouns=vocab.map(v=>v._word);const circleTemplates=[
()=>({html:`It’s ( <b>a</b> / <b>an</b> ) ${esc(['eraser','alligator','elephant','oval'][Math.floor(Math.random()*4)])}.`,answer:'an'}),
()=>({html:`( <b>This</b> / <b>These</b> ) are my ears.`,answer:'These'}),
()=>({html:`I ( <b>can</b> / <b>am</b> ) swim.`,answer:'can'}),
()=>({html:`There ( <b>is</b> / <b>are</b> ) three birds.`,answer:'are'}),
()=>({html:`( <b>What</b> / <b>How</b> ) color is it?`,answer:'What'}),
()=>({html:`Those ( <b>is</b> / <b>are</b> ) zebras.`,answer:'are'}),
()=>({html:`I ( <b>like</b> / <b>likes</b> ) pizza.`,answer:'like'}),
()=>({html:`Can you run? Yes, I ( <b>can</b> / <b>do</b> ).`,answer:'can'})];
const fillTemplates=[
()=>({html:`What is it? It’s <span class="blank"></span> ${esc(nouns.find(x=>!['ice cream','rice','milk','bread'].includes(x))||'book')}.`,answer:'a/an'}),
()=>({html:`I <span class="blank"></span> swim.`,answer:'can'}),
()=>({html:`There <span class="blank"></span> flowers.`,answer:'are'}),
()=>({html:`What <span class="blank"></span> those?`,answer:'are'}),
()=>({html:`These are my <span class="blank"></span>.`,answer:'arms/ears/etc.'}),
()=>({html:`I don’t <span class="blank"></span> fish.`,answer:'like'}),
()=>({html:`How many birds <span class="blank"></span> there?`,answer:'are'}),
()=>({html:`That’s <span class="blank"></span> lion.`,answer:'a'})];return{circle:take(circleTemplates,n).map(f=>f()),fill:take(fillTemplates,n).map(f=>f())}}
function answerKey(l1,l2,match,letters,write,g){const letterByWord=Object.fromEntries(letters.map(x=>[x.word,x.letter]));return `<div class="group-label">Listening A</div><p>${l1.map(x=>`${x.num}. ${esc(x.word)}`).join(' · ')}</p><div class="group-label">Listening B</div><p>${l2.map((x,i)=>`${i+1}. ${esc(x.answer)}`).join(' · ')}</p><div class="group-label">Vocabulary A</div><p>${match.map((x,i)=>`${i+1}-${letterByWord[x._word]}`).join(' · ')}</p><div class="group-label">Vocabulary B</div><p>${write.map((x,i)=>`${i+1}. ${esc(x._word)}`).join(' · ')}</p><div class="group-label">Grammar A</div><p>${g.circle.map((x,i)=>`${i+1}. ${esc(x.answer)}`).join(' · ')}</p><div class="group-label">Grammar B</div><p>${g.fill.map((x,i)=>`${i+1}. ${esc(x.answer)}`).join(' · ')}</p>`}
async function playAll(){if(!current)return;speechSynthesis.cancel();for(let i=0;i<current.audio.length;i++){await speak(`${i<+$('count').value?i+1:i-+$('count').value+1}. ${current.audio[i]}. ${current.audio[i]}.`);await new Promise(r=>setTimeout(r,1800))}$('playerStatus').textContent='Finished.'}
function speak(text){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.75;u.onend=res;u.onerror=res;$('playerStatus').textContent=text;speechSynthesis.speak(u)})}
$('book').onchange=buildUnits;$('generate').onclick=buildTest;$('shuffle').onclick=buildTest;$('print').onclick=()=>window.print();$('toggleKey').onclick=()=>{keyVisible=!keyVisible;document.querySelectorAll('.teacher-page').forEach(x=>x.classList.toggle('hide',!keyVisible));$('toggleKey').textContent=keyVisible?'Hide answer key':'Show answer key'};$('playAll').onclick=playAll;$('stopAudio').onclick=()=>{speechSynthesis.cancel();$('playerStatus').textContent='Stopped.'};verify();
</script>
</body>
</html>
