<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Level Test Render Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20260913-1">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/Assets/Images/Logo.png" alt="Willena">
    <div><strong>Level Test Render Lab</strong><span>Live published assessment bank</span></div>
  </div>
  <div class="top-actions">
    <span class="live-pill">LIVE BANK</span>
    <a class="dashboard-link" href="/Teachers/dashboard-v2/">Teacher Dashboard</a>
  </div>
</header>

<main class="workspace">
  <aside class="browser-panel">
    <div class="filters">
      <label>Internal level<select id="levelFilter"><option value="all">All levels</option></select></label>
      <label>Skill<select id="skillFilter"><option value="all">All skills</option></select></label>
      <label>Question type<select id="typeFilter"><option value="all">All types</option></select></label>
      <label>Visuals<select id="visualFilter"><option value="all">All questions</option><option value="visual">Image choices only</option><option value="text">Text choices only</option></select></label>
      <label class="search-field">Search<input id="searchInput" type="search" placeholder="Prompt, source key, answer…" autocomplete="off"></label>
    </div>
    <div class="bank-meta">
      <strong id="count">Loading…</strong>
      <button id="resetFilters" type="button">Reset</button>
    </div>
    <div id="questionList" class="question-list"><div class="empty">Loading level-test bank…</div></div>
  </aside>

  <section class="preview-panel">
    <div class="preview-toolbar">
      <button id="prevBtn" type="button">← Previous</button>
      <div class="current-meta">
        <strong id="currentTitle">Question —</strong>
        <span id="currentSub">Select a question</span>
      </div>
      <button id="nextBtn" type="button">Next →</button>
      <a id="openBtn" class="open-btn" href="#" target="_blank" rel="noopener">Open</a>
    </div>
    <div class="frame-wrap">
      <iframe id="previewFrame" title="Level test question preview" loading="eager"></iframe>
      <div id="frameLoading" class="frame-loading">Loading question…</div>
    </div>
  </section>
</main>

<script src="/shared/learning-engine/activity-schema.js?v=20260808-1"></script>
<script src="/shared/learning-engine/assessment-adapter.js?v=20260808-1"></script>
<script src="/shared/learning-engine/assessment-question-model.js?v=20260913-model1"></script>
<script src="/free-level-test/js/assessment-loader-classic.js?v=20260913-model1"></script>
<script src="./app.js?v=20260913-1"></script>
</body>
</html>
