<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Classroom · Willena</title>
<script src="/js/api-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ee5da1;--cyan:#8bdce5;--ink:#243642;--muted:#70818a;--bg:#f8fcfd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Poppins,Arial,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:18px;background:#39384a;color:white;padding:15px clamp(14px,3vw,36px)}
header img{width:90px;max-height:52px;object-fit:contain}header h1{font-size:1.45rem;margin:0;font-weight:700}
header a{margin-left:auto;color:white;text-decoration:none;font-weight:600;border:1px solid #9fe5eb;border-radius:12px;padding:8px 14px}
main{max-width:1350px;margin:22px auto;padding:0 18px 35px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--cyan);border-radius:17px;padding:15px}
select,button{font:inherit}select{border:1px solid #b7d9de;border-radius:9px;padding:9px;background:white;min-width:175px;color:var(--ink)}
button{background:white;color:#d43e8b;border:1px solid var(--cyan);border-radius:9px;padding:9px 13px;font-weight:600;cursor:pointer}
button:hover{background:#eafbfd}.grow{flex:1}.muted{color:var(--muted);font-size:.86rem}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.stat{padding:9px 14px;border-radius:12px;background:#fff;border:1px solid #dce9eb;font-size:.87rem}.stat strong{font-size:1.16rem}
.notice{background:#fff8e9;border:1px solid #f4df9c;border-radius:12px;padding:11px 14px;font-size:.87rem;margin-bottom:14px}
.error{background:#fff1f2;border-color:#f8c2cb}.class-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.class-head h2{font-size:1.13rem;margin:0}.class-head .count{color:var(--muted);font-size:.87rem}
.grid{display:flex;flex-direction:column;background:#fff;border:1px solid #dce9ec;border-radius:12px;overflow:hidden}
.student{display:grid;grid-template-columns:minmax(135px,1fr) minmax(0,2fr);align-items:center;gap:10px;background:white;border:0;border-bottom:1px solid #dce9ec;border-radius:0;padding:10px 14px;min-height:48px;box-shadow:none}.student:last-child{border-bottom:0}
.grid{display:block;background:#fff;border:1px solid #dce9ec;border-radius:12px;overflow:hidden}
.student{display:grid;grid-template-columns:minmax(80px,1.05fr) minmax(85px,.95fr) minmax(120px,1.5fr) minmax(100px,1.5fr) minmax(70px,.7fr);align-items:center;gap:12px;padding:9px 15px;min-height:45px;border:0;border-bottom:1px solid #e4edef;border-radius:0;box-shadow:none;background:#fff;font-size:.89rem}
.student:last-child{border-bottom:0}.student strong{font-weight:700}
.table-heading{background:#eff8fa;color:#536d78;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;font-weight:700;min-height:40px}
.app-cell,.activity-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.assigned-cell{font-weight:600;color:#b43f7b}
.status-cell{display:flex;align-items:center}.status{font-size:.74rem}
@media(max-width:620px){.student{grid-template-columns:minmax(38px,.5fr) minmax(67px,.88fr) minmax(90px,1.25fr) minmax(72px,1.1fr) 54px;gap:5px;padding:9px 7px;font-size:.72rem}.table-heading{font-size:.6rem}.status{font-size:.65rem;padding:3px 5px}.app-cell,.activity-cell{white-space:normal;overflow-wrap:anywhere;line-height:1.3}.assigned-cell{text-align:center}}
.student-head{display:flex;justify-content:space-between;gap:7px;align-items:start}.student strong{font-size:1rem}.status{font-size:.74rem;border-radius:20px;padding:3px 8px;white-space:nowrap;font-weight:700}
.status.active{background:#e5f7ed;color:#257650}.status.idle{background:#fff4d7;color:#976c18}.status.offline{background:#eff2f5;color:#63747f}.status.unavailable{background:#fff2e2;color:#946a23}
.detail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.4;font-size:.8rem;color:#455d69;overflow-wrap:anywhere;margin:0}.detail>div{display:inline}.detail .app{font-weight:700;color:#177c8d}
.homework{display:inline-block;margin-top:7px;font-size:.73rem;color:#b3377d;border-radius:6px;padding:2px 7px;border:1px solid #f0b6d2}
footer{text-align:center;color:#82959e;font-size:.75rem;margin-top:26px}
@media(max-width:600px){header img{width:55px}header h1{font-size:1.15rem}header a{font-size:.8rem;padding:7px}.grid{display:block}.student{padding:9px 7px;min-height:44px;grid-template-columns:minmax(38px,.5fr) minmax(67px,.88fr) minmax(90px,1.25fr) minmax(72px,1.1fr) 54px;gap:5px;font-size:.72rem}.student strong{font-size:.78rem}.status{font-size:.65rem;padding:3px 5px}.class-head{margin:17px 0 8px}}
body.embedded header{display:none}body.embedded main{max-width:none;margin:0;padding:10px 12px 20px}
body.embedded .toolbar{border-radius:12px;padding:11px}
body.embedded footer{display:none}
</style>
<script>if(new URLSearchParams(location.search).has('embedded'))document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embedded'));</script>
</head>
<body>
<header><img src="/Assets/Images/Logo.png" alt="Willena"><h1>Live Classroom</h1><a href="/Teachers/">← Dashboard</a></header>
<main>
<div class="toolbar"><label for="class-filter">Class</label><select id="class-filter"><option value="">All Classes</option></select><label for="app-filter">App</label><select id="app-filter" aria-label="Filter by current app"><option value="">All Apps</option><option value="test_prep">내신 명중 Only</option></select><span class="grow"></span><span class="muted" id="last-refresh">Not loaded</span><button id="refresh" type="button">Refresh</button></div>
<div class="stats" aria-live="polite"><span class="stat"><strong id="active-count">0</strong> Active</span><span class="stat"><strong id="idle-count">0</strong> Idle</span><span class="stat"><strong id="offline-count">0</strong> Offline</span></div>
<div class="notice" id="notice">Loading student roster and checking the presence service…</div>
<div id="classes"></div>
<footer>Willena Live Classroom · Online status expires after 90 seconds · Updates while this page is open</footer>
</main>
<script type="module" src="./live-classroom.js?v=8"></script>
</body></html>
