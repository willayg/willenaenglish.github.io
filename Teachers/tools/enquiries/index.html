<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의 관리 | Willena</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f9fa;font-family:Poppins,"Noto Sans KR",sans-serif;color:#302b41}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 24px;background:#fff;border-bottom:1px solid #e3e9ea}h1{font-size:24px;margin:0}p{color:#6a7280}button,select,textarea,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:#19aabc;color:white;font-weight:700}button:disabled{opacity:.5;cursor:wait}select,input,textarea{width:100%;border:1px solid #dce3e6;background:#fff;border-radius:10px;padding:11px;color:inherit}main{padding:20px;max-width:1400px;margin:auto}.toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;min-width:170px}.toolbar input{flex:1;min-width:180px}.layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(300px,1.1fr);gap:17px}.list,.detail{background:#fff;border:1px solid #e0e9eb;border-radius:17px;min-height:440px}.list{padding:8px;max-height:720px;overflow:auto}.entry{display:block;width:100%;background:#fff;text-align:left;border-bottom:1px solid #eff1f3;border-radius:9px;padding:15px;color:inherit}.entry:hover,.entry.selected{background:#eaf9fa}.entry strong{font-size:16px}.entry small{display:block;margin-top:5px;color:#75808a}.entry .desc{color:#616875;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}.badge{display:inline-block;padding:4px 8px;border-radius:30px;font-size:11px;font-weight:800;background:#e6f1f2;color:#236d7a;margin-left:8px}.badge.new{background:#ffe1ef;color:#b12a6f}.detail{padding:clamp(17px,3vw,30px)}.detail h2{margin:0 0 18px;font-size:21px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta div{min-width:0;background:#f5f9fa;border-radius:12px;padding:11px;word-break:break-word}.meta label{font-size:11px;color:#777;display:block;margin-bottom:5px}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6fafb;border-radius:12px;padding:15px;margin:18px 0;line-height:1.8}.detail label.field{display:block;font-size:13px;font-weight:800;margin:15px 0 7px}.detail textarea{height:150px;resize:vertical}.detail a{color:#168d9a;font-weight:800}.empty{padding:40px 15px;text-align:center;color:#68727a}#status{min-height:25px;color:#bd2b5d;font-size:13px}.count{font-size:13px;color:#66717d}@media(max-width:740px){.layout{grid-template-columns:1fr}.list{min-height:160px;max-height:310px}.detail{min-height:300px}.meta{grid-template-columns:1fr}main{padding:12px}header{padding:14px}}
</style></head><body><header><div><h1>문의 관리 <span id="unread" class="badge new">0 NEW</span></h1><p style="margin:4px 0 0;font-size:13px">Willena · Website Enquiries</p></div><button id="refresh">새로고침 ↻</button></header><main><div class="toolbar"><select id="filter"><option value="">전체 상태</option><option value="new">신규</option><option value="contacted">연락 완료</option><option value="consultation">상담 예약</option><option value="enrolled">등록 완료</option><option value="closed">종료</option></select><input id="search" placeholder="이름 · 전화번호 검색" aria-label="Search enquiries"><span class="count" id="count"></span></div><div id="status" role="status"></div><div class="layout"><div class="list" id="list"><div class="empty">문의 내역 불러오는 중…</div></div><div class="detail" id="detail"><div class="empty">왼쪽에서 문의를 선택하세요.</div></div></div></main><script type="module">
const endpoint='https://api.willenaenglish.com/.netlify/functions/website_enquiries';
const $=id=>document.getElementById(id);
const labels={new:'신규',contacted:'연락 완료',consultation:'상담 예약',enrolled:'등록 완료',closed:'종료'};
const types={level_test:'레벨 테스트',tuition:'수강료',classes:'수업 / 시간표',other:'기타'};
let enquiries=[],chosen=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(action,options={}){const r=await fetch(endpoint+'?action='+action,{credentials:'include',cache:'no-store',...options});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Request failed ('+r.status+')');return j}
async function authenticate(){const mod=await import('/Teachers/auth-refresh.js');const session=await mod.ensureTeacherSession();if(!session?.success)throw Error('Teacher login required. Please sign in and reopen 문의 관리.')}
async function load(){ $('status').textContent='';$('refresh').disabled=true;try{await authenticate();const j=await request('list');enquiries=j.enquiries||[];if(chosen&&!enquiries.some(x=>x.id===chosen))chosen=null;render();}catch(err){$('status').textContent=err.message;$('list').innerHTML='<div class="empty">문의 내역을 불러오지 못했습니다.</div>'; }finally{$('refresh').disabled=false;}}
function visible(){const text=$('search').value.trim().toLowerCase(),filter=$('filter').value;return enquiries.filter(x=>(!filter||x.status===filter)&&(!text||[x.parent_name,x.phone,x.student_grade,x.message].some(v=>String(v||'').toLowerCase().includes(text))))}
function render(){const rows=visible();$('count').textContent=rows.length+'건';$('unread').textContent=enquiries.filter(x=>x.status==='new').length+' NEW';$('list').replaceChildren();if(!rows.length)$('list').innerHTML='<div class="empty">해당 문의가 없습니다.</div>';
rows.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='entry'+(x.id===chosen?' selected':'');b.innerHTML='<strong>'+escape(x.parent_name)+'</strong><span class="badge '+escape(x.status)+'">'+escape(labels[x.status]||x.status)+'</span><small>'+escape(x.student_grade)+' · '+escape(types[x.enquiry_type]||x.enquiry_type)+' · '+new Date(x.created_at).toLocaleString('ko-KR')+'</small><div class="desc">'+escape(x.message)+'</div>';b.onclick=()=>{chosen=x.id;render()};$('list').append(b)});renderDetail();}
function renderDetail(){const x=enquiries.find(x=>x.id===chosen);if(!x){$('detail').innerHTML='<div class="empty">왼쪽에서 문의를 선택하세요.</div>';return}
$('detail').innerHTML='<h2>'+escape(x.parent_name)+' 님 문의</h2><div class="meta"><div><label>학생 학년</label>'+escape(x.student_grade)+'</div><div><label>문의 유형</label>'+escape(types[x.enquiry_type]||x.enquiry_type)+'</div><div><label>연락처</label><a href="tel:'+escape(x.phone)+'">'+escape(x.phone)+'</a></div><div><label>접수 시간</label>'+escape(new Date(x.created_at).toLocaleString('ko-KR'))+'</div></div><div class="message">'+escape(x.message)+'</div><label class="field" for="editStatus">진행 상태</label><select id="editStatus">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'"'+(x.status===k?' selected':'')+'>'+v+'</option>').join('')+'</select><label class="field" for="notes">상담 기록 / 내부 메모</label><textarea id="notes" maxlength="6000" placeholder="통화 내용, 예약 날짜, 후속 조치 등…">'+escape(x.admin_notes||'')+'</textarea><button id="save" style="margin-top:15px">변경사항 저장</button><div id="saveStatus" role="status" style="margin-top:10px"></div>';
$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('saveStatus').textContent='저장 중…';try{const status=$('editStatus').value,notes=$('notes').value;await request('update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status,admin_notes:notes})});x.status=status;x.admin_notes=notes;$('saveStatus').textContent='저장했습니다.';render();}catch(err){$('saveStatus').textContent=err.message;}finally{b.disabled=false}};}
$('refresh').onclick=load;$('filter').onchange=render;$('search').oninput=render;load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
