<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Willena Assessment Grid — Pilot</title><style>*{box-sizing:border-box}body{font:14px Arial,sans-serif;margin:0;background:#f5f9fb;color:#173849}header{background:#064569;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}header strong{font-size:20px}header small{font-size:14px;font-weight:400}main{padding:18px;max-width:1900px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.toolbar label{font-weight:700;color:#496879;font-size:11px;display:flex;flex-direction:column;gap:5px}select,input,button{font:inherit;border:1px solid #c4d8e1;border-radius:5px;padding:9px;background:#fff;color:#123548}button{cursor:pointer}.notice{background:#e4f5f8;border:1px solid #b6d9e2;padding:10px 13px;border-radius:5px}.formula{display:flex;align-items:center;gap:10px;background:white;border:1px solid #d9e4eb;border-bottom:0;padding:0 12px;height:44px}.formula span{width:40px;font-weight:700}.formula b{color:#7b98a6}.formula input{flex:1;border:0;min-width:0}.sheetwrap{overflow:auto;background:white;max-height:65vh;border:1px solid #cfdae2}table{border-collapse:separate;border-spacing:0;min-width:1200px;width:100%}th,td{padding:0;border-right:1px solid #dce5e9;border-bottom:1px solid #dce5e9;height:37px;white-space:nowrap}th{position:sticky;top:0;background:#e9f1f5;z-index:3;text-align:center;font-size:12px;padding:8px}th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#eef4f8;text-align:center;width:39px;min-width:39px}th:nth-child(2),td:nth-child(2){position:sticky;left:39px;z-index:2;background:#fff;min-width:135px}th:nth-child(3),td:nth-child(3){position:sticky;left:174px;z-index:2;background:#fff;min-width:105px}thead th:nth-child(-n+3){z-index:4}td input{display:block;width:100%;height:36px;min-width:85px;border:2px solid transparent;border-radius:0;padding:0 9px;background:transparent;font-size:14px}td input:focus{border-color:#008aa6;outline:0;background:#effbfe}td.locked{padding:0 9px;color:#405e6e}td.changed{background:#e8f9ec}td.invalid input{border-color:#bf2935;background:#fff0f0}nav{display:flex;gap:5px;overflow:auto;background:#edf3f6;padding:9px;border:1px solid #cfdfe6;border-top:0}nav button{white-space:nowrap;font-size:12px;padding:7px 11px}nav button.selected{border-color:#0782a0;background:#d8f3f9;font-weight:700}#summary{font-size:12px;color:#678}@media(max-width:600px){main{padding:9px}header{padding:15px}.toolbar{gap:6px}.toolbar button{padding:8px}.sheetwrap{max-height:72vh}}</style></head>
<body><header><strong>WILLENA <small>Assessment Grid</small></strong><span id="status">Local pilot · not shared</span></header>
<div id="authStatus" role="status" style="padding:30px;font:16px Arial,sans-serif">Checking teacher login…</div><main hidden><div class="toolbar"><label>Period<select id="period"><option>October 2026</option></select></label><label>Class<select id="klass"></select></label><label>Find student<input id="search" placeholder="Name"></label><button id="undo">Undo</button><button id="redo">Redo</button><button id="reset">Reset pilot</button></div><p class="notice">This pilot demonstrates spreadsheet editing. It saves to this browser only — other teachers cannot see changes yet. No Supabase records are modified.</p>
<div class="formula"><span id="address">D2</span><b>fx</b><input id="formula" aria-label="Selected cell value" placeholder="Select an editable cell"></div>
<div class="sheetwrap"><table id="sheet"><thead></thead><tbody></tbody></table></div><nav id="tabs" aria-label="Class tabs"></nav><p id="summary"></p>
</main><script src="/js/api-config.js?v=20260329d"></script><script>
(async () => {
  const status = document.getElementById('authStatus');
  try {
    if (!window.WillenaAPI?.fetch) throw Error('Auth gateway unavailable');
    async function whoami() {
      const response = await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=whoami');
      const payload = await response.json().catch(() => ({}));
      return response.ok && payload.success && payload.user_id ? payload : null;
    }
    let who = await whoami();
    if (!who) {
      await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=refresh').catch(() => {});
      who = await whoami();
    }
    if (!who) throw Error('Login required');
    const response = await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_role&user_id=' + encodeURIComponent(who.user_id));
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !['teacher','admin'].includes(String(data.role || '').toLowerCase())) throw Error('Teacher access required');
    status.remove();
    document.querySelector('main').hidden = false;
    const script = document.createElement('script');
    script.textContent = "(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst classes=['Brown','Stanford','Manchester','New York','Hawaii','Boston','Sydney','Berkeley','Chicago','Cambridge','Yale','Princeton','Oxford','MIT'];\nconst names={Brown:[['Aiden','김예훈'],['Nora','김태리'],['Jia','서지아'],['Jay','정재현'],['Elin','김민채']]};\nconst fields=[['name','Name'],['korean','Korean'],['class','Class'],['phonics','Phonics'],['listening','Listening'],['vocab','Vocab'],['grammar','Grammar'],['gw','Grammar Writing'],['write','Writing'],['reading','Reading'],['speaking','Speaking'],['lib','Book Reading'],['raz','RAZ Kids'],['punct','Punctuality']];\nconst skillKeys=new Set(['phonics','listening','vocab','grammar','gw','write','reading','speaking']);\nconst gradeKeys=new Set(['lib','raz','punct']);\nconst key='willena-assessment-pilot-v1';\nfunction defaults(){let rows=[];for(const cls of classes){for(let i=0;i<Math.max(cls==='Brown'?5:3,1);i++){const p=(names[cls]||[])[i]||['Example '+(i+1),''];rows.push({id:cls+'-'+i,name:p[0],korean:p[1],class:cls,phonics:'',listening:'',vocab:'',grammar:'',gw:'',write:'',reading:'',speaking:'',lib:'',raz:'',punct:''})}}return rows}\nlet rows;try{rows=JSON.parse(localStorage.getItem(key));if(!Array.isArray(rows))rows=defaults()}catch{rows=defaults()}\nlet klass=classes[0],undo=[],redo=[],selected=null;\nconst setStatus=s=>{$('status').textContent=s};\nfunction persist(){try{localStorage.setItem(key,JSON.stringify(rows));setStatus('Saved locally · not shared')}catch{setStatus('Browser storage unavailable')}}\nfunction snapshot(){undo.push(JSON.stringify(rows));if(undo.length>70)undo.shift();redo.length=0}\nfunction change(id,k,value){const row=rows.find(r=>r.id===id);if(!row)return;const v=value.trim();if(skillKeys.has(k)&&v!==''&&(!/^\\d+(\\.\\d+)?$/.test(v)||Number(v)>1000))return false;if(gradeKeys.has(k)&&v!==''&&!/^(A\\+?|A-|B\\+?|B-|C\\+?|C-)$/i.test(v))return false;if(row[k]===v)return true;snapshot();row[k]=v;persist();return true}\nconst select=(id,k)=>{selected={id,k};const r=rows.find(x=>x.id===id);$('address').textContent=(fields.findIndex(x=>x[0]===k)+1)+' · '+(r?.name||'');$('formula').value=r?.[k]||''};\nfunction render(){const query=$('search').value.toLowerCase();let filtered=rows.filter(r=>r.class===klass&&[r.name,r.korean].some(x=>x.toLowerCase().includes(query)));const head=$('sheet').querySelector('thead'),body=$('sheet').querySelector('tbody');head.replaceChildren();body.replaceChildren();\nconst tr=document.createElement('tr');for(const label of ['#',...fields.map(f=>f[1])]){const th=document.createElement('th');th.textContent=label;tr.append(th)}head.append(tr);\nfiltered.forEach((r,i)=>{const tr=document.createElement('tr');const num=document.createElement('td');num.textContent=i+2;tr.append(num);for(const [k] of fields){const td=document.createElement('td');if(['name','korean','class'].includes(k)){td.className='locked';td.textContent=r[k]}else{const input=document.createElement('input');input.value=r[k]||'';input.dataset.id=r.id;input.dataset.field=k;input.setAttribute('aria-label',r.name+' '+k);input.addEventListener('focus',()=>select(r.id,k));input.addEventListener('change',()=>{if(change(r.id,k,input.value)===false){td.classList.add('invalid');setStatus('Invalid value · not saved')}else{td.classList.remove('invalid');td.classList.add('changed')}});input.addEventListener('keydown',e=>{const inputs=[...body.querySelectorAll('input')];let idx=inputs.indexOf(input),cols=fields.length-3,n=-1;if(e.key==='Enter')n=idx+cols;if(e.key==='ArrowDown'&&e.target.selectionStart===e.target.selectionEnd)n=idx+cols;if(e.key==='ArrowUp'&&e.target.selectionStart===e.target.selectionEnd)n=idx-cols;if(e.key==='Tab'){n=idx+(e.shiftKey?-1:1);e.preventDefault()}if(n>=0&&n<inputs.length){input.dispatchEvent(new Event('change'));inputs[n].focus();inputs[n].select();e.preventDefault()}});input.addEventListener('paste',e=>{const text=e.clipboardData?.getData('text/plain')||'';if(!text.includes('\\t')&&!text.includes('\\n'))return;e.preventDefault();const matrix=text.trimEnd().split(/\\r?\\n/).map(line=>line.split('\\t'));let rr=filtered.findIndex(x=>x.id===r.id),cc=fields.findIndex(x=>x[0]===k);if(rr<0||cc<3)return;snapshot();for(let y=0;y<matrix.length;y++)for(let x=0;x<matrix[y].length;x++){const keyName=fields[cc+x]?.[0],row=filtered[rr+y];if(!row||!keyName||!['name','korean','class'].includes(keyName)&&false)continue;if(!skillKeys.has(keyName)&&!gradeKeys.has(keyName))continue;const val=matrix[y][x].trim();if(skillKeys.has(keyName)&&val&&!/^\\d+(\\.\\d+)?$/.test(val))continue;row[keyName]=val}persist();render()});td.append(input)}tr.append(td)}body.append(tr)});\n$('summary').textContent=filtered.length+' students displayed · '+rows.length+' pilot rows · browser-local only';}\nfunction choose(c){klass=c;$('klass').value=c;for(const b of $('tabs').querySelectorAll('button'))b.classList.toggle('selected',b.textContent===c);render()}\nfor(const c of classes){$('klass').add(new Option(c,c));const b=document.createElement('button');b.textContent=c;b.addEventListener('click',()=>choose(c));$('tabs').append(b)}\n$('klass').addEventListener('change',e=>choose(e.target.value));$('search').addEventListener('input',render);$('formula').addEventListener('change',()=>{if(!selected)return;if(change(selected.id,selected.k,$('formula').value)===false)setStatus('Invalid cell value');render()});\nfunction restore(mode){if(!(mode==='undo'?undo:redo).length)return;(mode==='undo'?redo:undo).push(JSON.stringify(rows));rows=JSON.parse((mode==='undo'?undo:redo).pop());persist();render()}\n$('undo').onclick=()=>restore('undo');$('redo').onclick=()=>restore('redo');$('reset').onclick=()=>{if(!confirm('Reset this browser-only pilot?'))return;snapshot();rows=defaults();persist();render()};\ndocument.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='z'){e.preventDefault();restore(e.shiftKey?'redo':'undo')}if(e.key.toLowerCase()==='y'){e.preventDefault();restore('redo')}});\nchoose(classes[0]);\n})();";
    document.body.appendChild(script);
  } catch (error) {
    const link = document.createElement('a');
    link.href = '/Teachers/login.html?redirect=' + encodeURIComponent(location.pathname);
    link.textContent = 'Sign in to Teachers';
    status.textContent = 'Teacher access only. ';
    status.appendChild(link);
  }
})();
</script></body></html>
