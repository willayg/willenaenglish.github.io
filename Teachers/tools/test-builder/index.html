<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Test Builder</title>
<script src="/students/api-gateway.js?v=20260729b"></script><script src="/js/api-config.js?v=20260729b"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--navy:#14233f;--blue:#315edb;--bg:#edf2f7;--line:#d8e0eb;--ink:#172033;--muted:#667085;--mint:#eaf8f2;--yellow:#fff6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif}button,input,select{font:inherit}header{background:var(--navy);color:white;padding:14px 18px}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between}.top a{color:white}.shell{max-width:1500px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.05)}.controls{padding:18px;height:max-content;position:sticky;top:12px}.controls h2{margin:0}.hint{font-size:12px;color:var(--muted);margin:4px 0 16px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.units{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:7px}.units label{display:flex;gap:8px;padding:6px;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e9efff;color:#2448a4}.print{background:var(--navy);color:#fff}.preview{padding:18px;overflow:auto}.empty{min-height:650px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 20px;padding:15mm 16mm;border:1px solid #d8dee8;box-shadow:0 4px 16px rgba(16,24,40,.08);page-break-after:always}.sheet:last-child{page-break-after:auto}.head{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:9px;margin-bottom:14px}.head h1{margin:0;font-size:24px}.meta{font-size:11px;color:var(--muted);text-align:right}.student{display:flex;gap:24px;margin:12px 0 20px;font-size:13px}.student span{display:inline-block;min-width:190px;border-bottom:1px solid #555}.section-title{font-size:26px;margin:0}.section-sub{font-size:12px;color:var(--muted);margin:2px 0 16px}.group{margin:16px 0 24px}.group-title{font-weight:800;border-radius:10px;padding:8px 11px;margin-bottom:12px}.listen .group-title{background:#eaf0ff}.vocab .group-title{background:var(--mint)}.grammar .group-title{background:var(--yellow)}.picture-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pic-card{height:145px;border:1.5px solid #cfd8e5;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.pic-card .num{position:absolute;top:8px;left:9px;width:25px;height:25px;border:1.5px solid #8997aa;border-radius:7px}.emoji{font-size:54px}.choice-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.choice{border-bottom:1px solid #d6dde8;padding:10px 3px;font-size:14px}.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:25px}.word-list div,.image-list div{min-height:58px;display:flex;align-items:center;border-bottom:1px solid #dfe5ee}.image-list div{gap:12px}.write-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.write-card{border:1px solid #d7dfeb;border-radius:12px;padding:10px;text-align:center}.answer-line{height:30px;border-bottom:1.5px solid #555;margin-top:6px}.grammar-list{display:grid;gap:13px}.grammar-q{font-size:15px;line-height:1.8}.blank{display:inline-block;min-width:95px;border-bottom:1.5px solid #333;height:22px}.answer-key{font-size:13px;line-height:1.65}.tts{display:grid;gap:10px}.tts-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}.mini{border:0;border-radius:8px;padding:7px 10px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:50}@media(max-width:900px){.shell{display:block}.controls{position:static;margin-bottom:14px}.sheet{transform-origin:top left;transform:scale(.72);margin-bottom:-80mm}}@media print{body{background:white}.no-print,header,.controls{display:none!important}.shell{display:block;margin:0;padding:0}.preview{padding:0}.panel{border:0;box-shadow:none}.sheet{border:0;box-shadow:none;margin:0;width:210mm;min-height:297mm} }
</style>
</head><body>
<div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div>
<header><div class="top"><b>Willena Test Builder MVP</b><a href="/Teachers/tools/curriculum-editor/">← Curriculum Studio</a></div></header>
<div class="shell"><aside class="panel controls no-print"><h2>Build a test</h2><div class="hint">Uses the curriculum database. Nothing is saved.</div>
<div class="field"><label>Book</label><select id="book"></select></div>
<div class="field"><label>Units</label><div class="units" id="units"></div></div>
<div class="row"><div class="field"><label>Questions per group</label><input id="count" type="number" min="4" max="10" value="8"></div><div class="field"><label>Title</label><input id="title" value="English Test"></div></div>
<div class="field"><button class="btn primary" id="build">Generate test</button></div>
<div class="row"><button class="btn secondary" id="regen">Regenerate</button><button class="btn print" onclick="window.print()">Print / PDF</button></div>
<div class="field"><button class="btn secondary" id="playAll">Play all listening</button></div>
</aside><main class="panel preview" id="preview"><div class="empty">Choose a book and units, then generate a printable test.</div></main></div>
<script>
const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/source_content_admin';
let uid='',rows=[],test=null;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emojiMap={pen:'🖊️',pencil:'✏️',eraser:'🧽',ruler:'📏',book:'📘',notebook:'📓',backpack:'🎒',chair:'🪑',desk:'🛋️',marker:'🖍️',crayon:'🖍️',circle:'⚪',triangle:'🔺',square:'🟦',diamond:'🔷',flower:'🌸',frog:'🐸',rabbit:'🐰',bird:'🐦',butterfly:'🦋',squirrel:'🐿️',ball:'⚽',bat:'🏏',doll:'🪆',robot:'🤖','teddy bear':'🧸',truck:'🚚',bike:'🚲',kite:'🪁',cake:'🎂',pizza:'🍕',fish:'🐟',rice:'🍚',bread:'🍞','ice cream':'🍦',juice:'🧃',milk:'🥛',run:'🏃',swim:'🏊',sing:'🎤',dance:'💃',paint:'🎨',head:'🙂',hand:'✋',foot:'🦶',eye:'👁️',ear:'👂',nose:'👃',mouth:'👄',lion:'🦁',bear:'🐻',elephant:'🐘',giraffe:'🦒',snake:'🐍',zebra:'🦓',panda:'🐼',penguin:'🐧',koala:'🐨',gorilla:'🦍',alligator:'🐊',kangaroo:'🦘'};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid));const j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}$('#auth').style.display='none';await load()}catch(e){$('#authmsg').textContent=e.message}}
async function load(){const j=await call({action:'list_catalog'});rows=(j.data||[]).filter(r=>['lexical_entry','sentence','pattern'].includes(r.occurrence_type));const books=[...new Set(rows.map(r=>r.book_title))].filter(Boolean);$('#book').innerHTML=books.map(b=>`<option>${esc(b)}</option>`).join('');buildUnits()}
function buildUnits(){const b=$('#book').value;const units=[...new Map(rows.filter(r=>r.book_title===b).map(r=>[String(r.unit_number),r.unit_title])).entries()];$('#units').innerHTML=units.map(([n,t])=>`<label><input type="checkbox" value="${esc(n)}" checked> Unit ${esc(n)} · ${esc(t)}</label>`).join('')}
function selectedRows(){const b=$('#book').value,u=[...$('#units').querySelectorAll('input:checked')].map(x=>x.value);return rows.filter(r=>r.book_title===b&&u.includes(String(r.unit_number)))}
function vocabPool(data){const seen=new Set();return data.filter(r=>r.occurrence_type==='lexical_entry'&&emojiMap[(r.lexical_text||r.source_text||'').toLowerCase()]).filter(r=>{const w=(r.lexical_text||r.source_text).toLowerCase();if(seen.has(w))return false;seen.add(w);return true}).map(r=>({word:(r.lexical_text||r.source_text).toLowerCase(),emoji:emojiMap[(r.lexical_text||r.source_text).toLowerCase()]}))}
function buildTest(){const data=selectedRows(),n=+$('#count').value||8,v=shuffle(vocabPool(data));if(v.length<n*2){alert('Not enough emoji-mapped vocabulary in the selected units. Select more units.');return}const listenPics=shuffle(v.slice(0,n));const listenWords=shuffle(v.slice(n,n*2));const vocabMatch=shuffle(v.slice(0,n));const vocabWrite=shuffle(v.slice(n,n*2));const patterns=shuffle(data.filter(r=>r.occurrence_type==='pattern'&&r.source_text).map(r=>r.source_text));const grammar1=makeGrammarChoices(patterns,n);const grammar2=makeUnscramble(data.filter(r=>r.occurrence_type==='sentence').map(r=>r.source_text),n);test={title:$('#title').value||'English Test',book:$('#book').value,n,listenPics,listenWords,vocabMatch,vocabWrite,grammar1,grammar2};render()}
function makeGrammarChoices(patterns,n){const bank=[['It (is / are) a pencil.','is'],['These (is / are) my hands.','are'],['I (can / am) swim.','can'],['There (is / are) two birds.','are'],['That (is / are) a lion.','is'],['I (like / likes) pizza.','like'],['What (is / are) these?','are'],['They (is / are) koalas.','are'],['Do you like milk? Yes, I (do / am).','do'],['I have two (robot / robots).','robots']];return shuffle(bank).slice(0,n).map(x=>({q:x[0],a:x[1]}))}
function makeUnscramble(sentences,n){const usable=[...new Set(sentences)].filter(s=>s&&s.split(/\s+/).length>=3&&s.split(/\s+/).length<=7);return shuffle(usable).slice(0,n).map(s=>({q:shuffle(s.replace(/[.!?]/g,'').split(/\s+/)).join(' / '),a:s}))}
function head(section){return `<div class="head"><div><h1>${esc(test.title)}</h1><div>${esc(test.book)}</div></div><div class="meta">Willena English<br>${section}</div></div><div class="student">Name <span></span> Date <span></span></div>`}
function render(){const p=$('#preview');const picOrder=shuffle(test.listenPics);const picNums=new Map(test.listenPics.map((x,i)=>[x.word,i+1]));const listenChoices=test.listenWords.map((x,i)=>{const others=shuffle(test.listenWords.filter(y=>y.word!==x.word)).slice(0,2);return {target:x.word,choices:shuffle([x,...others]).map(z=>z.word)}});p.innerHTML=`
<section class="sheet listen">${head('Listening')}<h2 class="section-title">Listening</h2><p class="section-sub">Listen carefully. Each item will be played twice.</p><div class="group"><div class="group-title">A. Write the number on the correct picture.</div><div class="picture-grid">${picOrder.map(x=>`<div class="pic-card"><div class="num"></div><div class="emoji">${x.emoji}</div></div>`).join('')}</div></div><div class="group"><div class="group-title">B. Circle the word you hear.</div><div class="choice-list">${listenChoices.map((x,i)=>`<div class="choice"><b>${i+1}.</b> ${x.choices.map(c=>`○ ${esc(c)}`).join(' &nbsp; ')}</div>`).join('')}</div></div></section>
<section class="sheet vocab">${head('Vocabulary')}<h2 class="section-title">Vocabulary</h2><p class="section-sub">Show what you know.</p><div class="group"><div class="group-title">A. Match each word to the correct picture.</div><div class="match-wrap"><div class="word-list">${test.vocabMatch.map((x,i)=>`<div><b>${String.fromCharCode(65+i)}.</b>&nbsp; ${esc(x.word)}</div>`).join('')}</div><div class="image-list">${shuffle(test.vocabMatch).map((x,i)=>`<div><b>${i+1}.</b><span class="emoji" style="font-size:34px">${x.emoji}</span><span class="blank"></span></div>`).join('')}</div></div></div><div class="group"><div class="group-title">B. Write the word under each picture.</div><div class="write-grid">${test.vocabWrite.map(x=>`<div class="write-card"><div class="emoji">${x.emoji}</div><div class="answer-line"></div></div>`).join('')}</div></div></section>
<section class="sheet grammar">${head('Grammar')}<h2 class="section-title">Grammar</h2><p class="section-sub">Read carefully and write neatly.</p><div class="group"><div class="group-title">A. Circle the correct word.</div><div class="grammar-list">${test.grammar1.map((x,i)=>`<div class="grammar-q"><b>${i+1}.</b> ${esc(x.q)}</div>`).join('')}</div></div><div class="group"><div class="group-title">B. Put the words in the correct order.</div><div class="grammar-list">${test.grammar2.map((x,i)=>`<div class="grammar-q"><b>${i+1}.</b> ${esc(x.q)}<div class="answer-line"></div></div>`).join('')}</div></div></section>
<section class="sheet">${head('Answer Key & Listening')}<h2 class="section-title">Teacher Page</h2><div class="group"><div class="group-title" style="background:#eef2f7">Listening script</div><div class="tts">${test.listenPics.map((x,i)=>`<div class="tts-row"><span>${i+1}. ${esc(x.word)}</span><button class="mini no-print" onclick="speak('${esc(x.word)}')">Play</button></div>`).join('')}${test.listenWords.map((x,i)=>`<div class="tts-row"><span>${i+1}. ${esc(x.word)}</span><button class="mini no-print" onclick="speak('${esc(x.word)}')">Play</button></div>`).join('')}</div></div><div class="answer-key"><b>Listening A:</b> ${picOrder.map(x=>`${x.emoji} = ${picNums.get(x.word)}`).join(' · ')}<br><b>Listening B:</b> ${listenChoices.map((x,i)=>`${i+1}. ${x.target}`).join(' · ')}<br><b>Vocabulary A:</b> Match by word and picture.<br><b>Vocabulary B:</b> ${test.vocabWrite.map((x,i)=>`${i+1}. ${x.word}`).join(' · ')}<br><b>Grammar A:</b> ${test.grammar1.map((x,i)=>`${i+1}. ${x.a}`).join(' · ')}<br><b>Grammar B:</b> ${test.grammar2.map((x,i)=>`${i+1}. ${x.a}`).join(' · ')}</div></section>`}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u);setTimeout(()=>{const v=new SpeechSynthesisUtterance(text);v.lang='en-US';v.rate=.75;speechSynthesis.speak(v)},1500)}
async function playAll(){if(!test)return;const words=[...test.listenPics,...test.listenWords].map(x=>x.word);for(const w of words){await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.75;u.onend=()=>setTimeout(resolve,1800);speechSynthesis.speak(u)})}}
$('#book').addEventListener('change',buildUnits);$('#build').addEventListener('click',buildTest);$('#regen').addEventListener('click',buildTest);$('#playAll').addEventListener('click',playAll);verify();
</script></body></html>
