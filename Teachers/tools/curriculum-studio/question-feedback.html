<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Feedback · Willena Studio</title><script src="/students/api-gateway.js?v=20260729b"></script><script src="/js/api-config.js?v=20260729b"></script><style>:root{--navy:#10213d;--blue:#2563eb;--pink:#d0006f;--cyan:#238d96;--line:#d8e0ec;--muted:#667085;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px/1.5 Inter,system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:15px 18px}.top,main{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}main{padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.toolbar input{flex:1;min-width:230px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:999px;padding:4px 9px;font-weight:800}.flag{background:#fff0f6;color:var(--pink)}.like{background:#eafafa;color:var(--cyan)}.meta{color:var(--muted);font-size:12px;margin:5px 0 11px}.prompt{font-weight:800;font-size:16px;white-space:pre-line}.message{margin-top:10px;padding:11px;border-radius:10px;background:#f7f9fc;white-space:pre-line}.empty{text-align:center;color:var(--muted);padding:50px}.auth{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5}@media(max-width:650px){main{padding:10px}.head{display:block}.tags{margin-top:8px}}</style></head><body><div class="auth" id="auth"><div><h2>Checking account…</h2><p id="authmsg">Please wait.</p></div></div><header><div class="top"><b>Question Feedback</b><a href="./">← Curriculum Studio</a></div></header><main><div class="toolbar"><input id="search" placeholder="Search question, source key or comment…"><select id="kind"><option value="">Flags and likes</option><option value="flag">Flags only</option><option value="like">Likes only</option></select><button id="refresh">Refresh</button></div><div id="list"></div></main><script>const API='https://gxwfsqxyuufqtitspfqg.supabase.co/functions/v1/curriculum_admin',auth=document.querySelector('#auth'),list=document.querySelector('#list'),search=document.querySelector('#search'),kind=document.querySelector('#kind');let uid='',rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-user-id':uid},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function verify(){uid=localStorage.getItem('userId')||'';if(!uid){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}try{const r=await WillenaAPI.fetch('/.netlify/functions/supabase_auth?action=get_profile&user_id='+encodeURIComponent(uid)),j=await r.json();if(!j.success||j.approved!==true){location.href='/Teachers/components/access-denied.html';return}auth.style.display='none';load()}catch(e){authmsg.textContent='Could not verify this account.'}}async function load(){list.innerHTML='<div class="empty">Loading…</div>';try{const j=await call({action:'list',table:'assessment_items',filters:{},page:0,pageSize:500});rows=(j.data||[]).filter(r=>r.is_flagged||r.is_liked);render()}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function render(){const q=search.value.toLowerCase(),k=kind.value;const filtered=rows.filter(r=>(!k||(k==='flag'?r.is_flagged:r.is_liked))&&(!q||[r.prompt_text,r.context_text,r.source_key,r.flag_message,r.like_message].some(v=>String(v||'').toLowerCase().includes(q))));list.innerHTML=filtered.map(r=>'<article class="card"><div class="head"><div><div class="prompt">'+esc(r.context_text?String(r.context_text).replace(/\\n/g,'\n')+'\n'+r.prompt_text:r.prompt_text)+'</div><div class="meta">'+esc(r.source_key)+' · Level '+esc(r.level_id)+' · '+esc(r.item_type)+' · '+esc(r.status)+'</div></div><div class="tags">'+(r.is_flagged?'<span class="tag flag">⚑ Review</span>':'')+(r.is_liked?'<span class="tag like">♥ Liked</span>':'')+'</div></div>'+(r.is_flagged?'<div class="message"><b>Review note</b><br>'+esc(r.flag_message||'No comment')+'</div>':'')+(r.is_liked?'<div class="message"><b>Like comment</b><br>'+esc(r.like_message||'No comment')+'</div>':'')+'</article>').join('')||'<div class="empty">No matching feedback.</div>'}search.addEventListener('input',render);kind.addEventListener('change',render);refresh.addEventListener('click',load);verify();</script></body></html>
