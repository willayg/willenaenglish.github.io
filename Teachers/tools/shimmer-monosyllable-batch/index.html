<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shimmer Monosyllable Batch</title>
<style>
body{font:16px/1.45 system-ui;margin:0;background:#f7fbfc;color:#17252d}
main{max-width:760px;margin:32px auto;padding:0 16px}.card{background:#fff;border:3px solid #c9f3f5;border-radius:20px;padding:20px}
button{font:inherit;font-weight:800;padding:12px 16px;border:3px solid #ffd0df;border-radius:14px;background:#fff;cursor:pointer}
pre{white-space:pre-wrap;background:#f4f7f8;padding:14px;border-radius:12px;min-height:120px}
</style></head>
<body><main><div class="card">
<h1>Shimmer monosyllable replacement</h1>
<p>One-time batch: published English monosyllables → OpenAI gpt-4o-mini-tts / Shimmer → overwrite word-level R2 MP3s.</p>
<button id="go">Run / resume batch</button>
<button id="status">Refresh status</button>
<pre id="out">Not started from this page.</pre>
</div></main>
<script>
const API='https://api.willenaenglish.com/.netlify/functions/';
const BATCH='shimmer-monosyllables-20260927-v1';
const out=document.getElementById('out');
async function status(){
 try{const r=await fetch(API+'monosyllable_audio_status',{cache:'no-store'});out.textContent=JSON.stringify(await r.json(),null,2);}
 catch(e){out.textContent='Status error: '+e.message;}
}
document.getElementById('status').onclick=status;
document.getElementById('go').onclick=async()=>{
 document.getElementById('go').disabled=true;out.textContent='Starting batch…';
 try{
  const r=await fetch(API+'regenerate_monosyllables-background?batch='+encodeURIComponent(BATCH),{method:'GET',cache:'no-store'});
  out.textContent='Trigger response: '+r.status+'\n'+await r.text()+'\n\nUse Refresh status to inspect progress.';
 }catch(e){out.textContent='Trigger error: '+e.message;}
 finally{document.getElementById('go').disabled=false;}
};
status();
</script></body></html>
