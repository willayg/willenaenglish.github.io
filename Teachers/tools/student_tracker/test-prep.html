<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Prep Tracking</title>
<script src="/students/api-gateway.js?v=20260826-tptrack2"></script><script src="/js/api-config.js?v=20260826-tptrack2"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#24343c;font-family:Poppins,'Pretendard','Noto Sans KR',system-ui,sans-serif}.wrap{max-width:1480px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:1px solid #cadbdd;background:#fff;border-radius:11px;padding:9px 12px;text-decoration:none;color:#315960;font-weight:700}.title{font-size:24px;font-weight:800;color:#19777e}.sub{font-size:12px;color:#75858c}.toolbar{background:#fff;border:1px solid #dfe9eb;border-radius:16px;padding:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar select,.toolbar input{border:1px solid #d7e2e4;border-radius:10px;padding:9px 11px;background:#fff}.refresh{margin-left:auto;border:0;background:#19777e;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #dfe9eb;border-radius:15px;padding:13px}.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:#7a888e;font-weight:650}.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,.9fr);gap:14px}.card{background:#fff;border:1px solid #dfe9eb;border-radius:18px;overflow:hidden}.card h2{margin:0;padding:14px 16px;font-size:15px;color:#315960;border-bottom:1px solid #e7edef}.table-wrap{overflow:auto;max-height:70vh}table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}th{position:sticky;top:0;background:#f8fbfb;color:#61747b;text-align:left;padding:10px;border-bottom:1px solid #dfe9eb;z-index:1}td{padding:10px;border-bottom:1px solid #edf1f2}tr.student-row{cursor:pointer}tr.student-row:hover{background:#f2fbfb}.num{text-align:right}.bad{color:#cf477b!important;font-weight:800}.good{color:#17834b!important;font-weight:800}.muted{color:#89979c}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef8f9;color:#356168;font-size:10px;font-weight:750}.pill.warn{background:#fff1f6;color:#c84375}.pill.ready{background:#eefaf3;color:#17834b}.detail{padding:16px}.student-name{font-size:20px;font-weight:800}.detail-meta{font-size:11px;color:#7a888e;margin:3px 0 14px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#f8fbfb;border:1px solid #e4ecee;border-radius:12px;padding:10px}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:#7c898f}.rec{margin-top:12px;border:1px solid #bfe1e4;background:#f1fbfb;border-radius:13px;padding:12px}.rec strong{color:#19777e}.section-block{margin-top:14px}.section-block>strong{font-size:12px}.practice-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #edf1f2;font-size:11px}.target-list{max-height:180px;overflow:auto}.empty{padding:35px;text-align:center;color:#89979c}@media(max-width:950px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.refresh{margin-left:0}}</style></head>
<body><div class="wrap"><div class="top"><a class="back" href="./student_tracker.html">← Student Tracker</a><div><div class="title">Test Prep Tracking</div><div class="sub">진행률 · 노력 · 정답률 · 오답 · 회복 · 약점 · 다음 추천</div></div></div>
<div class="toolbar"><select id="classFilter"><option value="">All classes</option></select><select id="schoolFilter"><option value="">All schools</option></select><input id="search" placeholder="학생 이름 검색"><button class="refresh" id="refresh">새로고침</button></div>
<div class="kpis"><div class="kpi"><b id="kStudents">-</b><span>학생</span></div><div class="kpi"><b id="kActive">-</b><span>학습 시작</span></div><div class="kpi"><b id="kAccuracy">-</b><span>평균 정답률</span></div><div class="kpi"><b id="kWrong">-</b><span>미해결 오답</span></div><div class="kpi"><b id="kTime">-</b><span>총 학습시간</span></div><div class="kpi"><b id="kAttention">-</b><span>주의 필요</span></div></div>
<div class="main"><section class="card"><h2>학생 현황</h2><div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Status</th><th class="num">Progress</th><th class="num">Unique</th><th class="num">Accuracy</th><th class="num">First</th><th class="num">오답</th><th class="num">Correction</th><th class="num">Time</th><th>Weakest</th><th>Recommendation</th><th>Last study</th></tr></thead><tbody id="body"><tr><td colspan="13" class="empty">Loading...</td></tr></tbody></table></div></section><aside class="card"><h2>학생 상세</h2><div id="detail" class="empty">학생을 선택하세요.</div></aside></div></div>
<script>
const EDGE='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/test-prep-teacher';const APIKEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';let rows=[];
async function token(){let t=window.WillenaAPI?.getLocalAccessToken?.()||localStorage.getItem('sb_access_token')||'';try{const r=await (window.WillenaAPI?.fetch?window.WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`,{credentials:'include',cache:'no-store'}):fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`,{credentials:'include',cache:'no-store'}));const d=await r.json().catch(()=>({}));if(r.ok&&d?.success&&d.access_token){window.WillenaAPI?.setLocalTokens?.(d.access_token,d.refresh_token||'');t=d.access_token}}catch(_){}return t}
async function load(){document.getElementById('body').innerHTML='<tr><td colspan="13" class="empty">Loading...</td></tr>';const t=await token();if(!t){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}const r=await fetch(EDGE,{headers:{Authorization:`Bearer ${t}`,apikey:APIKEY},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success){document.getElementById('body').innerHTML=`<tr><td colspan="13" class="empty">${d.error||'Failed to load'}</td></tr>`;return}rows=d.rows||[];fillFilters();render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=v=>v==null?'—':v+'%';const mins=ms=>ms?`${Math.max(1,Math.round(ms/60000))}m`:'0m';const date=v=>v?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const label=k=>({vocabulary:'Vocabulary',sentences:'Sentences',communication:'Communication',grammar:'Grammar',reading:'Reading'}[k]||k);
function fillFilters(){const cf=document.getElementById('classFilter'),sf=document.getElementById('schoolFilter'),cv=cf.value,sv=sf.value;const cs=[...new Set(rows.map(r=>r.student?.class).filter(Boolean))].sort(),ss=[...new Set(rows.map(r=>r.student?.school||r.group?.school).filter(Boolean))].sort();cf.innerHTML='<option value="">All classes</option>'+cs.map(x=>`<option>${esc(x)}</option>`).join('');sf.innerHTML='<option value="">All schools</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');cf.value=cv;sf.value=sv}
function filtered(){const c=classFilter.value,s=schoolFilter.value,q=search.value.trim().toLowerCase();return rows.filter(r=>(!c||r.student?.class===c)&&(!s||(r.student?.school||r.group?.school)===s)&&(!q||[r.student?.name,r.student?.korean_name,r.student?.username].some(x=>String(x||'').toLowerCase().includes(q))))}
function statusClass(s){return s==='Ready'?'ready':['Needs attention','Repeated difficulty'].includes(s)?'warn':''}
function render(){const a=filtered();kStudents.textContent=new Set(a.map(r=>r.student?.id)).size;kActive.textContent=a.filter(r=>r.summary?.attempts>0).length;const av=a.map(r=>r.summary?.accuracy).filter(v=>v!=null);kAccuracy.textContent=av.length?Math.round(av.reduce((x,y)=>x+y,0)/av.length)+'%':'—';kWrong.textContent=a.reduce((n,r)=>n+(r.summary?.unresolved_wrong||0),0);kTime.textContent=mins(a.reduce((n,r)=>n+(r.summary?.active_time_ms||0),0));kAttention.textContent=a.filter(r=>['Needs attention','Repeated difficulty'].includes(r.summary?.status)).length;const b=document.getElementById('body');if(!a.length){b.innerHTML='<tr><td colspan="13" class="empty">No matching students.</td></tr>';return}b.innerHTML=a.map((r,i)=>{const st=r.student||{},s=r.summary||{},g=r.group||{},p=r.plan||{},nm=st.korean_name||st.name||st.username||'Student';return `<tr class="student-row" data-i="${i}"><td><b>${esc(nm)}</b><div class="muted">${esc(p.book_label||'')}</div></td><td>${esc(st.class||'-')}</td><td><span class="pill ${statusClass(s.status)}">${esc(s.status||'Not started')}</span></td><td class="num">${pct(s.completion)}</td><td class="num">${s.unique_questions||0}</td><td class="num ${s.accuracy!=null&&s.accuracy<60?'bad':s.accuracy>=80?'good':''}">${pct(s.accuracy)}</td><td class="num">${pct(s.first_attempt_accuracy)}</td><td class="num ${s.unresolved_wrong?'bad':''}">${s.unresolved_wrong||0}</td><td class="num">${pct(s.correction_rate)}</td><td class="num">${mins(s.active_time_ms)}</td><td>${esc(label(s.weakest_area)||'—')}</td><td><span class="pill ${s.unresolved_wrong?'warn':''}">${esc(s.recommendation?.title||'—')}</span></td><td>${date(s.last_study)}</td></tr>`}).join('');b.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>showDetail(a[Number(tr.dataset.i)]))}
function rowsBlock(obj,empty='아직 기록이 없습니다.'){return Object.keys(obj||{}).length?Object.entries(obj).map(([k,v])=>`<div class="practice-row"><span>${esc(label(k))}</span><b>${pct(v.accuracy)} · ${v.attempts}회 · ${v.unique}개</b></div>`).join(''):`<div class="empty">${empty}</div>`}
function showDetail(r){const st=r.student||{},s=r.summary||{},g=r.group||{},p=r.plan||{},nm=st.korean_name||st.name||st.username||'Student';detail.className='detail';detail.innerHTML=`<div class="student-name">${esc(nm)}</div><div class="detail-meta">${esc(st.class||'')} · ${esc(g.school||st.school||'')} · ${esc(p.book_label||'')}</div><div style="margin-bottom:10px"><span class="pill ${statusClass(s.status)}">${esc(s.status||'Not started')}</span></div><div class="detail-grid"><div class="metric"><b>${pct(s.completion)}</b><span>전체 진행률</span></div><div class="metric"><b>${s.unique_questions||0}</b><span>고유 문제</span></div><div class="metric"><b>${pct(s.accuracy)}</b><span>전체 정답률</span></div><div class="metric"><b>${pct(s.first_attempt_accuracy)}</b><span>첫 시도 정답률</span></div><div class="metric"><b class="${s.unresolved_wrong?'bad':''}">${s.unresolved_wrong||0}</b><span>미해결 오답</span></div><div class="metric"><b>${pct(s.correction_rate)}</b><span>오답 수정률</span></div><div class="metric"><b>${s.repeated_mistakes||0}</b><span>반복 실수</span></div><div class="metric"><b>${s.avg_attempts_to_correct??'—'}</b><span>수정까지 평균 시도</span></div><div class="metric"><b>${s.retries||0}</b><span>재시도</span></div><div class="metric"><b>${s.sessions||0}</b><span>세션</span></div><div class="metric"><b>${mins(s.active_time_ms)}</b><span>학습 시간</span></div><div class="metric"><b>${date(s.last_study)}</b><span>최근 학습</span></div></div><div class="rec"><strong>${esc(s.recommendation?.title||'')}</strong><div class="sub">${esc(s.recommendation?.detail||'')}</div></div><div class="section-block"><strong>영역별</strong>${rowsBlock(s.by_practice)}</div><div class="section-block"><strong>Lesson별</strong>${rowsBlock(s.by_lesson)}</div><div class="section-block target-list"><strong>세부 타깃</strong>${rowsBlock(s.by_target,'타깃별로 판단할 만큼 기록이 아직 없습니다.')}</div>`}
['classFilter','schoolFilter'].forEach(id=>document.getElementById(id).onchange=render);search.oninput=render;refresh.onclick=load;load();
</script></body></html>
