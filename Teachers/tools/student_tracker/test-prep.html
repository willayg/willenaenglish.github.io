<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Prep Tracking</title>
<script src="/students/api-gateway.js?v=20260826-tptrack3"></script><script src="/js/api-config.js?v=20260826-tptrack3"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#24343c;font-family:Poppins,'Pretendard','Noto Sans KR',system-ui,sans-serif}.wrap{max-width:1480px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;margin-bottom:15px}.back{border:1px solid #cadbdd;background:#fff;border-radius:11px;padding:9px 12px;text-decoration:none;color:#315960;font-weight:700}.title{font-size:24px;font-weight:800;color:#19777e}.sub{font-size:11px;color:#75858c}.toolbar{background:#fff;border:1px solid #dfe9eb;border-radius:16px;padding:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{border:1px solid #d7e2e4;border-radius:10px;padding:9px 11px;background:#fff}.refresh{margin-left:auto;border:0;background:#19777e;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:12px}.kpi{background:#fff;border:1px solid #dfe9eb;border-radius:14px;padding:11px}.kpi b{display:block;font-size:20px}.kpi span{font-size:9px;color:#7a888e;font-weight:700}.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(350px,.82fr);gap:12px}.card{background:#fff;border:1px solid #dfe9eb;border-radius:17px;overflow:hidden}.card h2{margin:0;padding:13px 15px;font-size:14px;color:#315960;border-bottom:1px solid #e7edef}.table-wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}th{position:sticky;top:0;background:#f8fbfb;color:#61747b;text-align:left;padding:9px;border-bottom:1px solid #dfe9eb;z-index:1}td{padding:9px;border-bottom:1px solid #edf1f2}tr.student-row{cursor:pointer}tr.student-row:hover{background:#f2fbfb}.num{text-align:right}.bad{color:#cf477b!important;font-weight:800}.good{color:#17834b!important;font-weight:800}.muted{color:#89979c}.status{display:inline-block;padding:5px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#eef8f9;color:#356168}.status.attn,.status.repeat{background:#fff1f6;color:#c84375}.status.ready,.status.recovery{background:#effaf3;color:#17834b}.detail{padding:14px}.student-name{font-size:19px;font-weight:800}.detail-meta{font-size:10px;color:#7a888e;margin:3px 0 11px}.rec{border:1px solid #bfe1e4;background:#f1fbfb;border-radius:13px;padding:11px;margin-bottom:10px}.rec.review{border-color:#f1bfd1;background:#fff5f8}.rec strong{color:#19777e;font-size:13px}.rec.review strong{color:#c84375}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#f8fbfb;border:1px solid #e4ecee;border-radius:11px;padding:9px}.metric b{display:block;font-size:15px}.metric span{font-size:9px;color:#7c898f}.practice{margin-top:12px}.practice-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-bottom:1px solid #edf1f2;font-size:10px}.spaced{margin-top:11px;padding:10px;border-radius:11px;background:#fff9eb;color:#6f5a28;font-size:10px;line-height:1.55}.empty{padding:32px;text-align:center;color:#89979c}@media(max-width:950px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.wrap{padding:10px}}@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="./student_tracker.html">← Student Tracker</a><div><div class="title">Test Prep Tracking</div><div class="sub">누가 공부하는지 · 어디서 막히는지 · 오답이 회복되고 있는지</div></div></div>
<div class="toolbar"><select id="classFilter"><option value="">All classes</option></select><select id="schoolFilter"><option value="">All schools</option></select><select id="statusFilter"><option value="">All status</option><option>Needs attention</option><option>Repeated difficulty</option><option>In progress</option><option>Good recovery</option><option>Ready</option><option>Not started</option></select><input id="search" placeholder="학생 이름 검색"><button class="refresh" id="refresh">새로고침</button></div>
<div class="kpis"><div class="kpi"><b id="kStudents">-</b><span>학생</span></div><div class="kpi"><b id="kToday">-</b><span>오늘 학습</span></div><div class="kpi"><b id="kCompletion">-</b><span>평균 진행</span></div><div class="kpi"><b id="kFirst">-</b><span>첫 시도 정답률</span></div><div class="kpi"><b id="kDue">-</b><span>지금 복습할 오답</span></div><div class="kpi"><b id="kWrong">-</b><span>미해결 오답</span></div></div>
<div class="main"><section class="card"><h2>학생 현황</h2><div class="table-wrap"><table><thead><tr><th>Student</th><th>Status</th><th>Class</th><th class="num">Progress</th><th class="num">Accuracy</th><th class="num">First</th><th class="num">Due</th><th class="num">오답</th><th class="num">Time</th><th>Weakest</th><th>Last study</th></tr></thead><tbody id="body"><tr><td colspan="11" class="empty">Loading...</td></tr></tbody></table></div></section><aside class="card"><h2>학생 상세</h2><div id="detail" class="empty">학생을 선택하세요.</div></aside></div></div>
<script>
const EDGE='https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/test-prep-teacher',APIKEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';let rows=[];
async function token(){let t=window.WillenaAPI?.getLocalAccessToken?.()||localStorage.getItem('sb_access_token')||'';try{const r=await (window.WillenaAPI?.fetch?window.WillenaAPI.fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`,{credentials:'include',cache:'no-store'}):fetch(`/.netlify/functions/supabase_auth?action=refresh&_=${Date.now()}`,{credentials:'include',cache:'no-store'}));const d=await r.json().catch(()=>({}));if(r.ok&&d?.success&&d.access_token){window.WillenaAPI?.setLocalTokens?.(d.access_token,d.refresh_token||'');t=d.access_token}}catch(_){}return t}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=v=>v==null?'-':v+'%',mins=v=>{const m=Math.round((Number(v)||0)/60000);return m<1?(v?'<1m':'-'):m+'m'},date=v=>v?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
function statusClass(s){if(s==='Needs attention')return'attn';if(s==='Repeated difficulty')return'repeat';if(s==='Ready')return'ready';if(s==='Good recovery')return'recovery';return''}
async function load(){body.innerHTML='<tr><td colspan="11" class="empty">Loading...</td></tr>';const t=await token();if(!t){location.href='/Teachers/login.html?redirect='+encodeURIComponent(location.pathname);return}const r=await fetch(EDGE,{headers:{Authorization:`Bearer ${t}`,apikey:APIKEY},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success){body.innerHTML=`<tr><td colspan="11" class="empty">${esc(d.error||'Failed to load')}</td></tr>`;return}rows=d.rows||[];fillFilters();render()}
function fillFilters(){const cv=classFilter.value,sv=schoolFilter.value,cs=[...new Set(rows.map(r=>r.student?.class).filter(Boolean))].sort(),ss=[...new Set(rows.map(r=>r.student?.school||r.group?.school).filter(Boolean))].sort();classFilter.innerHTML='<option value="">All classes</option>'+cs.map(x=>`<option>${esc(x)}</option>`).join('');schoolFilter.innerHTML='<option value="">All schools</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');classFilter.value=cv;schoolFilter.value=sv}
function filtered(){const c=classFilter.value,s=schoolFilter.value,st=statusFilter.value,q=search.value.trim().toLowerCase();return rows.filter(r=>(!c||r.student?.class===c)&&(!s||(r.student?.school||r.group?.school)===s)&&(!st||r.summary?.status===st)&&(!q||[r.student?.name,r.student?.korean_name,r.student?.username].some(x=>String(x||'').toLowerCase().includes(q))))}
function avg(vals){const a=vals.filter(v=>v!=null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
function render(){const a=filtered(),today=new Date().toISOString().slice(0,10);kStudents.textContent=new Set(a.map(r=>r.student?.id)).size;kToday.textContent=a.filter(r=>String(r.summary?.last_study||'').slice(0,10)===today).length;kCompletion.textContent=pct(avg(a.map(r=>r.summary?.completion)));kFirst.textContent=pct(avg(a.map(r=>r.summary?.first_attempt_accuracy)));kDue.textContent=a.reduce((n,r)=>n+(r.summary?.due_review_count||0),0);kWrong.textContent=a.reduce((n,r)=>n+(r.summary?.unresolved_wrong||0),0);const aBody=document.getElementById('body');if(!a.length){aBody.innerHTML='<tr><td colspan="11" class="empty">No matching students.</td></tr>';return}aBody.innerHTML=a.map((r,i)=>{const st=r.student||{},s=r.summary||{},nm=st.korean_name||st.name||st.username||'Student';return `<tr class="student-row" data-i="${i}"><td><b>${esc(nm)}</b><div class="muted">${esc(st.username||'')}</div></td><td><span class="status ${statusClass(s.status)}">${esc(s.status||'-')}</span></td><td>${esc(st.class||'-')}</td><td class="num">${pct(s.completion)}</td><td class="num ${s.accuracy!=null&&s.accuracy<60?'bad':s.accuracy>=85?'good':''}">${pct(s.accuracy)}</td><td class="num">${pct(s.first_attempt_accuracy)}</td><td class="num ${s.due_review_count?'bad':''}">${s.due_review_count||0}</td><td class="num ${s.unresolved_wrong?'bad':''}">${s.unresolved_wrong||0}</td><td class="num">${mins(s.active_time_ms)}</td><td>${s.weakest_area?`${esc(s.weakest_area)} ${pct(s.by_practice?.[s.weakest_area]?.accuracy)}`:'-'}</td><td>${date(s.last_study)}</td></tr>`}).join('');aBody.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>showDetail(a[Number(tr.dataset.i)]))}
function showDetail(r){const st=r.student||{},s=r.summary||{},g=r.group||{},p=r.plan||{},pr=s.by_practice||{},nm=st.korean_name||st.name||st.username||'Student',rec=s.recommendation||{};detail.className='detail';detail.innerHTML=`<div class="student-name">${esc(nm)} <span class="status ${statusClass(s.status)}">${esc(s.status||'')}</span></div><div class="detail-meta">${esc(st.class||'')} · ${esc(g.school||st.school||'')} · ${esc(p.book_label||'')}</div><div class="rec ${s.due_review_count?'review':''}"><strong>${esc(rec.title||'')}</strong><div class="sub">${esc(rec.detail||'')}</div></div><div class="detail-grid"><div class="metric"><b>${pct(s.completion)}</b><span>진행</span></div><div class="metric"><b>${pct(s.accuracy)}</b><span>전체 정답률</span></div><div class="metric"><b>${pct(s.first_attempt_accuracy)}</b><span>첫 시도</span></div><div class="metric"><b class="${s.due_review_count?'bad':''}">${s.due_review_count||0}</b><span>지금 복습</span></div><div class="metric"><b class="${s.unresolved_wrong?'bad':''}">${s.unresolved_wrong||0}</b><span>미해결 오답</span></div><div class="metric"><b>${pct(s.correction_rate)}</b><span>오답 회복률</span></div><div class="metric"><b>${s.repeated_mistakes||0}</b><span>반복 실수</span></div><div class="metric"><b>${s.avg_attempts_to_correct??'-'}</b><span>회복까지 시도</span></div><div class="metric"><b>${s.retries||0}</b><span>재시도</span></div><div class="metric"><b>${s.sessions||0}</b><span>세션</span></div><div class="metric"><b>${mins(s.active_time_ms)}</b><span>실제 학습시간</span></div><div class="metric"><b>${s.unique_questions||0}</b><span>고유 문제</span></div></div><div class="practice"><b style="font-size:11px">영역별 진단</b>${Object.entries(pr).length?Object.entries(pr).map(([k,v])=>`<div class="practice-row"><span>${esc(k)}</span><b>${pct(v.accuracy)}</b><span>${v.attempts}회 · unique ${v.unique}</span></div>`).join(''):'<div class="empty">아직 영역별 기록이 없습니다.</div>'}</div><div class="spaced"><b>빠른 시험 대비 오답 스케줄</b><br>틀리면 10분 후 재확인 → 맞으면 20분 후 → 다시 맞으면 40분 후. 세 번 연속 회복하면 오답 상태에서 빠집니다. 다시 틀리면 10분 단계로 돌아갑니다.</div>`}
['classFilter','schoolFilter','statusFilter'].forEach(id=>document.getElementById(id).onchange=render);search.oninput=render;refresh.onclick=load;load();
</script></body></html>
