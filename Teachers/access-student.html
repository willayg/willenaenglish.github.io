<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Teacher tools</title>
  <script src="/js/api-config.js"></script>
  <style>
    :root{font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;color:#272638;background:#f6f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8fafc,#eef2ff)}
    .card{width:min(520px,100%);background:#fff;border:1px solid #dfe3ea;border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(30,41,59,.12)}
    .logo{height:46px;width:auto;margin-bottom:24px}
    h1{margin:0 0 10px;font-size:1.8rem;color:#39384a}
    p{margin:0 0 24px;color:#667085;line-height:1.55}
    .account{display:none;margin:-8px 0 22px;padding:10px 12px;border-radius:12px;background:#f4f2ff;color:#5546c8;font-weight:700}
    .actions{display:grid;gap:12px}
    .btn{width:100%;min-height:50px;border-radius:12px;border:1px solid transparent;font:700 1rem/1 Poppins,system-ui,sans-serif;cursor:pointer}
    .primary{background:#5a4ad1;color:#fff}
    .secondary{background:#fff;color:#39384a;border-color:#cfd5df}
    .status{min-height:20px;margin-top:14px;font-size:.9rem;color:#667085;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/Assets/Images/Logo.png" alt="Willena">
    <h1>You’re signed in as a student</h1>
    <p>Teacher tools are only available to teacher and admin accounts.</p>
    <div class="account" id="accountName"></div>
    <div class="actions">
      <button class="btn primary" id="studentBtn">Go to Student App</button>
      <button class="btn secondary" id="teacherBtn">Log out &amp; sign in as a teacher</button>
    </div>
    <div class="status" id="status"></div>
  </main>
<script>
(function(){
  const studentHome='https://students.willenaenglish.com/';
  const params=new URLSearchParams(location.search);
  const rawNext=params.get('next')||'/Teachers/index.html';
  const next=(rawNext.startsWith('/Teachers/')&&!/^https?:/i.test(rawNext))?rawNext:'/Teachers/index.html';
  const status=document.getElementById('status');
  document.getElementById('studentBtn').onclick=()=>{location.href=studentHome};
  document.getElementById('teacherBtn').onclick=async()=>{
    status.textContent='Signing out…';
    try{
      const api=window.WillenaAPI?.fetch
        ? window.WillenaAPI.fetch.bind(window.WillenaAPI)
        : (url,options)=>fetch(url,{credentials:'include',...(options||{})});
      await api('/.netlify/functions/supabase_auth?action=logout',{method:'POST'});
    }catch{}
    try{
      ['userId','userRole','role','username','userEmail','name'].forEach(k=>localStorage.removeItem(k));
    }catch{}
    location.replace('/Teachers/login.html?redirect='+encodeURIComponent(next));
  };
  (async()=>{
    try{
      const api=window.WillenaAPI?.fetch
        ? window.WillenaAPI.fetch.bind(window.WillenaAPI)
        : (url,options)=>fetch(url,{credentials:'include',...(options||{})});
      const r=await api('/.netlify/functions/supabase_auth?action=get_profile_name&_='+Date.now(),{cache:'no-store'});
      const j=await r.json().catch(()=>({}));
      const name=String(j?.name||j?.username||'').trim();
      if(r.ok&&name){
        const el=document.getElementById('accountName');
        el.textContent='Current account: '+name;
        el.style.display='block';
      }
    }catch{}
  })();
})();
</script>
</body>
</html>
