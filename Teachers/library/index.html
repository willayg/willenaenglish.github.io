<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#344954"><title>Willena Library</title><link rel="icon" href="/favicon.svg"><script src="/js/api-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/components/teacher-header/teacher-header.css?v=20260919-p2-3"><link rel="stylesheet" href="./library.css?v=1"><script type="module" src="./library.js?v=1"></script></head>
<body><div id="teacher-header"></div><div class="library-layout" id="app" hidden>
<aside class="rail" aria-label="Library navigation"><div class="rail-title">LIBRARY</div><nav id="nav"></nav><a class="source-link" href="https://docs.google.com/spreadsheets/d/1JqzddBRVaKzigajNrTIYoY9alzZytQsVtaBCkTmFinE/edit" target="_blank" rel="noopener noreferrer">Original library sheet ↗</a></aside>
<main><div class="top"><div><div class="eyebrow">WILLENA LIBRARY</div><h1 id="heading">Overview</h1><p id="subtitle">Reading and attendance management</p></div><button id="refresh" type="button" class="secondary">Refresh</button></div>

<dialog id="modal"><form method="dialog" class="dialog-head"><h2 id="modal-title"></h2><button aria-label="Close" class="secondary" value="cancel">Close</button></form><div id="modal-body"></div></dialog>
