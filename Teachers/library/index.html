<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#344954"><title>Willena Library</title><script src="/js/api-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/components/teacher-header/teacher-header.css?v=20260919-p2-3"><link rel="stylesheet" href="./library.css?v=20261127-raz2"><link rel="stylesheet" href="./certificates.css?v=1"><script type="module" src="./library.js?v=20261127-raz2"></script></head><body>
<div id="teacher-header"></div><div id="boot"><h1>Willena Library</h1><p id="bootText">Checking staff login…</p><button id="retry" hidden>Retry</button></div>
<main id="app" hidden><header class="top"><div><div class="eyebrow">WILLENA LIBRARY</div><h1>Raz-Kids</h1><p class="muted">Monthly reading awards</p></div><label>Month<input type="month" id="month"></label></header>
<div class="stats" id="stats"></div>
<section class="panel"><div class="panel-head"><h2>Monthly reports</h2><button id="upload">Import CSV</button></div><div id="reports"></div></section>
<section class="panel"><div class="panel-head"><h2>Reading results</h2><div class="filters"><select id="class" aria-label="Class"><option value="">All classes</option></select><input type="search" id="search" placeholder="Find a student" aria-label="Find student"></div></div><p class="muted small">Listen × 1 · Read × 1 · Recording × 3</p><div id="results"></div></section>
<section class="panel award-panel"><div class="panel-head"><div><h2>Book Prizes</h2><p class="muted" id="awardStatus">Review monthly winners and prepare certificates.</p></div><button id="prepare">Prepare monthly prizes</button></div><div id="awards"></div><div id="printButtons" class="actions" hidden><button id="goldPDF" class="secondary">Gold prize PDF</button><button id="silverPDF" class="secondary">Silver prize PDF</button></div></section>
<p id="status" role="status" aria-live="polite"></p></main>
<dialog id="importDialog"><div class="dialog-head"><h2>Import Raz-Kids</h2><button class="secondary" data-close="importDialog">Close</button></div><div id="importBody"></div><p id="importMessage" role="status"></p></dialog>
<dialog id="awardDialog"><div class="dialog-head"><h2>Prepare Book Prizes</h2><button class="secondary" data-close="awardDialog">Close</button></div><div id="awardBody"></div><p id="awardMessage" role="status"></p></dialog>
</body></html>
