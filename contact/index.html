<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상담 문의 | Willena English</title><link rel="icon" href="/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,"Noto Sans KR",sans-serif;color:#302b41;background:linear-gradient(130deg,#f1fcfc,#fff4f9)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#fff;padding:14px max(20px,calc((100vw - 1030px)/2))}header img{height:55px;max-width:150px;object-fit:contain}header a{text-decoration:none;color:#302b41;font-weight:800}main{max-width:760px;margin:45px auto 65px;padding:0 18px}.card{background:white;padding:clamp(23px,5vw,45px);border-radius:28px;box-shadow:0 15px 50px #2f294017}small.kicker{color:#d65598;font-size:12px;font-weight:900;letter-spacing:.1em}h1{font-size:clamp(29px,5vw,46px);margin:9px 0 10px;line-height:1.2}p{color:#6e6c7a;line-height:1.8;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700;margin-top:18px}input,select,textarea{width:100%;border:1px solid #dcdbe5;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;background:#fff;color:#302b41;min-height:48px}textarea{min-height:135px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid #bbebef;border-color:#18aabc}.consent{display:flex;flex-direction:row;align-items:flex-start;gap:10px;font-size:13px;line-height:1.65;font-weight:500}.consent input{width:21px;height:21px;min-height:0;flex-shrink:0;margin:2px 0}.send{background:#18aabc;color:white;border:0;border-radius:14px;padding:15px 20px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:23px}.send:disabled{opacity:.55;cursor:wait}.status{min-height:28px;margin-top:12px;font-size:14px;font-weight:700}.status.error{color:#b62452}.status.ok{color:#16816d}.honeypot{position:absolute;left:-9999px;opacity:0}footer{text-align:center;font-size:13px;color:#625b70;padding:0 12px 30px}footer a{color:#148e9e;font-weight:800}@media(max-width:570px){.grid{grid-template-columns:1fr}main{margin:22px auto 40px}.card{border-radius:19px}.grid label{margin-top:13px}}

/* Confirmation experience shown only after a successful submission. */
.card.success-card{min-height:490px;display:grid;place-items:center;overflow:hidden;text-align:center;position:relative}
.thanks{width:100%;max-width:510px;padding:25px 0 12px;animation:thanks-appear .65s cubic-bezier(.2,.8,.2,1) both}
.thanks-mark{width:118px;height:118px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(140deg,#e5fcf9,#d5f4fc);position:relative}
.thanks-mark:before,.thanks-mark:after{content:"";position:absolute;border-radius:50%;inset:-12px;border:2px dashed #b6e4ee;opacity:.85;animation:thanks-ring .9s .15s both}
.thanks-mark:after{inset:-24px;border:2px dotted #eec7e0;animation-delay:.3s}
.thanks-mark svg{width:72px;height:72px;overflow:visible}
.thanks-mark circle{fill:#18aabc}
.thanks-mark path{fill:none;stroke:white;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:55;stroke-dashoffset:55;animation:thanks-check .55s .38s ease forwards}
.thanks h1{font-size:clamp(34px,6vw,51px);letter-spacing:-.05em;margin:8px 0 14px}
.thanks p{font-size:16px;line-height:1.9;margin:0 auto 24px;max-width:430px;word-break:keep-all}
.thanks .confirmation{background:#f3fbfb;border-radius:18px;padding:20px;margin:24px 0;color:#53636a;font-size:14px;line-height:1.85}
.thanks .home-link{display:inline-flex;justify-content:center;align-items:center;width:100%;min-height:54px;border-radius:15px;background:#18aabc;color:white;font-size:16px;font-weight:800;text-decoration:none}
.thanks .home-link:hover{background:#1599aa}
.thanks .contact-again{display:inline-block;margin-top:19px;color:#66737a;font-size:13px}
.thanks .contact-again a{color:#168b9a;font-weight:800}
@keyframes thanks-appear{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes thanks-ring{from{opacity:0;transform:scale(.72)}to{opacity:.9;transform:scale(1)}}
@keyframes thanks-check{to{stroke-dashoffset:0}}
@media(max-width:570px){.card.success-card{min-height:480px}.thanks{padding:15px 0}.thanks-mark{width:103px;height:103px}.thanks p{font-size:15px}}
@media(prefers-reduced-motion:reduce){.thanks,.thanks-mark:before,.thanks-mark:after,.thanks-mark path{animation:none!important}.thanks-mark path{stroke-dashoffset:0}}
/* Conditional English learning history */
fieldset{border:0;padding:0;margin:20px 0 0;min-width:0}legend{padding:0;font-size:14px;font-weight:700;margin-bottom:9px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice-grid label{display:flex;flex-direction:row;align-items:center;gap:9px;margin:0;padding:11px 13px;border:1px solid #dcdbe5;border-radius:12px;background:white;min-height:46px;cursor:pointer;font-weight:500}.choice-grid input{width:18px;height:18px;min-height:0;flex:0 0 18px;margin:0;padding:0;accent-color:#18aabc}.choice-grid label:has(input:checked){border-color:#18aabc;background:#effafa}.experience-panel{padding:0 16px 18px;margin-top:13px;background:#f3fbfb;border:1px solid #dceff0;border-radius:16px}.experience-panel[hidden]{display:none!important}.experience-panel .choice-grid{margin-top:2px}.experience-panel .other-label{margin-top:10px}.other-label input{min-height:46px}.level-notice{margin:20px 0 0;padding:14px 16px;border:1px solid #dceff0;background:#f3fbfb;border-radius:13px;font-size:13px;line-height:1.75;color:#53636a;word-break:keep-all}.level-notice strong{display:block;color:#148e9e;font-size:14px;margin-bottom:3px}.hint{font-size:12px;color:#6e6c7a;font-weight:400;margin:0 0 8px}.method-error{font-size:13px;color:#b62452;margin:6px 0 0}.method-error[hidden]{display:none}
@media(max-width:380px){.choice-grid label{padding:9px 8px;gap:6px;font-size:13px}.experience-panel{padding:0 12px 14px}}
</style></head><body><header><a href="/"><img src="/Assets/Images/color-logo.png" alt="Willena English"></a><a href="/">← 홈페이지</a></header><main><div class="card"><small class="kicker">WILLENA ENGLISH · CONTACT</small><h1>상담 문의하기</h1><p>윌레나 영어학원에 궁금한 점이 있으신가요? 문의를 남겨주시면 확인 후 연락드리겠습니다.</p><form id="contact"><div class="grid"><label>학생 이름 *<input name="student_name" maxlength="80" minlength="2" required placeholder="학생 이름을 입력해 주세요"></label><label>학생 학년 *<select name="student_grade" required><option value="">학년 선택</option><option>미취학</option><option>초등 1학년</option><option>초등 2학년</option><option>초등 3학년</option><option>초등 4학년</option><option>초등 5학년</option><option>초등 6학년</option><option>중등 1학년</option><option>중등 2학년</option><option>중등 3학년</option><option>고등학생</option><option>기타</option></select></label></div><label>학생 학교 *<input name="student_school" maxlength="100" required placeholder="현재 다니는 학교 또는 유치원"></label><label>연락처 *<input name="phone" type="tel" required inputmode="tel" maxlength="25" placeholder="010-0000-0000" autocomplete="tel"></label><input type="hidden" name="enquiry_type" value="consultation"><fieldset><legend>영어를 배운 적이 있나요? *</legend><div class="choice-grid"><label><input type="radio" name="english_experience" value="yes" required aria-controls="experience-panel">있다</label><label><input type="radio" name="english_experience" value="no" required aria-controls="experience-panel">없다</label></div></fieldset><div id="experience-panel" class="experience-panel" hidden><label>영어 학습 기간 *<input name="english_duration" maxlength="100" placeholder="예: 1년 6개월" disabled></label><fieldset><legend>영어를 배운 방식 *</legend><div class="hint">복수 선택 가능</div><div class="choice-grid"><label><input type="checkbox" name="english_methods" value="학원" disabled>학원</label><label><input type="checkbox" name="english_methods" value="공부방" disabled>공부방</label><label><input type="checkbox" name="english_methods" value="과외" disabled>과외</label><label><input type="checkbox" name="english_methods" value="화상영어" disabled>화상영어</label><label><input type="checkbox" name="english_methods" value="유학" disabled>유학</label><label><input type="checkbox" name="english_methods" value="영어유치원 출신" disabled>영어유치원 출신</label><label><input type="checkbox" name="english_methods" value="엄마표" disabled>엄마표</label></div><label class="other-label">기타<input name="english_other" maxlength="150" placeholder="기타 학습 방식을 직접 입력해 주세요" disabled></label><p class="method-error" id="method-error" role="alert" hidden>영어 학습 방식을 선택하거나 기타에 직접 입력해 주세요.</p></fieldset></div><label>문의 내용 *<textarea name="message" minlength="5" maxlength="2000" required placeholder="궁금한 내용을 자유롭게 적어 주세요."></textarea></label><label class="honeypot" aria-hidden="true">Website<input name="website" autocomplete="off" tabindex="-1"></label><label class="consent"><input name="privacy_consent" type="checkbox" required><span>개인정보 수집 및 이용에 동의합니다. (필수)<br>수집 항목: 학생 이름, 학생 학년, 학교, 연락처, 영어 학습 경험·기간·방식, 문의 내용 · 이용 목적: 상담 및 문의 응대 · 보유 기간: 문의 처리 후 최대 1년 (삭제 요청 시 조기 삭제 가능). 동의하지 않을 권리가 있으나, 동의하지 않으면 문의 접수가 어렵습니다.</span></label><aside class="level-notice"><strong>레벨테스트 안내</strong>영어 학습 경험이 있는 학생은 현재 영어 실력을 확인하고 적합한 반을 배정하기 위해 레벨테스트에 응시해야 합니다.</aside><button class="send" type="submit">문의 보내기 →</button><div class="status" id="status" role="status" aria-live="polite"></div></form><p>전화 상담: <a href="tel:03180422203">031-8042-2203</a></p></div></main><footer>윌레나 원어민 영어학원 · Willena English Academy</footer><script>
const form=document.getElementById('contact'),status=document.getElementById('status'),button=form.querySelector('.send');
const panel=document.getElementById('experience-panel'),methodError=document.getElementById('method-error');
const hasExperience=()=>form.elements.english_experience.value==='yes';
function syncExperience(){const yes=hasExperience();panel.hidden=!yes;panel.querySelectorAll('input').forEach(el=>{el.disabled=!yes;if(!yes){if(el.type==='checkbox')el.checked=false;else el.value=''}});form.elements.english_duration.required=yes;methodError.hidden=true}
form.querySelectorAll('[name="english_experience"]').forEach(el=>el.addEventListener('change',syncExperience));
panel.addEventListener('input',()=>{methodError.hidden=true});
syncExperience();
function buildPayload(fd){const yes=fd.get('english_experience')==='yes';const name=String(fd.get('student_name')||'').trim();const methods=yes?fd.getAll('english_methods'):[];const other=yes?String(fd.get('english_other')||'').trim():'';const duration=yes?String(fd.get('english_duration')||'').trim():'';const school=String(fd.get('student_school')||'').trim();const message=String(fd.get('message')||'').trim();const summary=['[학생 상담 정보]','학생 이름: '+name,'학생 학교: '+school,'영어 학습 경험: '+(yes?'있다':'없다')];if(yes){summary.push('영어 학습 기간: '+duration,'영어 학습 방식: '+[...methods,...(other?['기타: '+other]:[])].join(', '))}summary.push('','[문의 내용]',message);return {parent_name:name,student_grade:fd.get('student_grade'),phone:fd.get('phone'),enquiry_type:fd.get('enquiry_type'),message:summary.join('\n'),privacy_consent:fd.has('privacy_consent'),website:fd.get('website')||''}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;status.textContent='';status.className='status';
const fd=new FormData(form);if(hasExperience()&&!fd.getAll('english_methods').length&&!String(fd.get('english_other')||'').trim()){methodError.hidden=false;panel.querySelector('[name="english_methods"]').focus();return}
if(!String(fd.get('student_school')||'').trim()||(hasExperience()&&!String(fd.get('english_duration')||'').trim())||String(fd.get('student_name')||'').trim().length<2||String(fd.get('message')||'').trim().length<5){status.className='status error';status.textContent='필수 항목을 다시 확인해 주세요.';return}
const data=buildPayload(fd);if(data.message.length>2000){status.className='status error';status.textContent='입력 내용이 너무 깁니다. 문의 내용을 '+(data.message.length-2000)+'자 이상 줄여 주세요.';form.elements.message.focus();return}
button.disabled=true;button.textContent='전송 중…';
try{const res=await fetch('https://fiieuiktlsivwfgyivai.supabase.co/functions/v1/website-enquiry-submit',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const json=await res.json();if(!res.ok||!json.success)throw Error(json.error||'전송 실패');form.reset();
const card=document.querySelector('.card');
card.classList.add('success-card');
card.innerHTML=`<div class="thanks" role="status" aria-live="polite" tabindex="-1">
<div class="thanks-mark" aria-hidden="true"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="31"/><path d="M24 40 35 51 57 29"/></svg></div>
<small class="kicker">THANK YOU · WILLENA ENGLISH</small>
<h1>문의가 접수되었어요!</h1>
<p>윌레나에 관심을 가져주셔서 감사합니다.<br>문의 내용을 확인한 후 연락드리겠습니다.</p>
<div class="confirmation">✓ 상담 문의가 정상적으로 접수되었습니다.<br>담당자가 내용을 확인하고 연락드릴게요.</div>
<a class="home-link" href="/">홈페이지로 돌아가기 →</a>
<span class="contact-again">급한 문의는 <a href="tel:03180422203">031-8042-2203</a>으로 전화해 주세요.</span>
</div>`;
window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
card.querySelector('.thanks').focus({preventScroll:true});}
catch(err){status.className='status error';status.textContent='문의 전송에 실패했습니다. 잠시 후 다시 시도하시거나 031-8042-2203으로 전화해 주세요.';}
finally{button.disabled=false;button.textContent='문의 보내기 →';}});
</script></body></html>
