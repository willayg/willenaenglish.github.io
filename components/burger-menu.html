<template id="burger-menu-template">
  <style>
    .burger-menu { position: fixed; top: 10px; right: 10px; z-index: 9999; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; display: flex; align-items: stretch; border-radius: 12px; overflow: visible; box-shadow: 0 10px 22px rgba(15, 23, 42, 0.22); }
    .burger-btn,
    .hw-notif-btn {
      width: 42px;
      height: 38px;
      border: none;
      background: linear-gradient(180deg, #19d2df 0%, #00b4c6 100%);
      color: white;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .hw-notif-btn { border-radius: 12px 0 0 12px; }
    .burger-btn { border-left: 1px solid rgba(255,255,255,0.35); border-radius: 0 12px 12px 0; }
    .burger-btn:hover,
    .hw-notif-btn:hover { background: linear-gradient(180deg, #12c0cf 0%, #0293a4 100%); }
    .burger-dropdown { display: none; position: absolute; top: 50px; right: 0; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-radius: 5px; min-width: 220px; max-height: 70vh; overflow: auto; }
    .burger-dropdown a { display: block; padding: 12px 16px; text-decoration: none; color: #333; border-bottom: 1px solid #eee; }
    .burger-dropdown a:hover { background: #f1f1f1; }
    .burger-dropdown a:last-child { border-bottom: none; }

    /* ── Notification bell ── */
    .hw-notif-wrap { position: relative; }
    .hw-notif-badge {
      display: none; position: absolute; top: -5px; right: -5px;
      background: #ef4444; color: white; font-size: 11px; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 9px;
      align-items: center; justify-content: center;
      padding: 0 3px; pointer-events: none;
    }
    .hw-notif-panel {
      display: none; position: absolute; top: calc(100% + 8px); right: 0;
      width: 320px; max-height: 480px; overflow-y: auto;
      background: white; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18); z-index: 10000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .hw-notif-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px; border-bottom: 1px solid #e5e7eb;
      font-weight: 600; font-size: 13px; color: #111827;
      position: sticky; top: 0; background: white; z-index: 1;
    }
    .hw-notif-header-link {
      font-size: 11px; font-weight: 500; color: #00b4c6;
      text-decoration: none; white-space: nowrap;
    }
    .hw-notif-header-link:hover { text-decoration: underline; }
    .hw-notif-loading { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; }
    .hw-notif-empty { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; }
    .hw-notif-group { border-bottom: 1px solid #f3f4f6; }
    .hw-notif-group-title {
      padding: 8px 14px 4px; font-size: 11px; font-weight: 700;
      color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em;
      background: #f9fafb;
    }
    .hw-notif-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; transition: background 0.12s;
      border-bottom: 1px solid #f3f4f6;
      text-decoration: none; color: inherit;
    }
    .hw-notif-row:last-child { border-bottom: none; }
    .hw-notif-row:hover { background: #f0fdfe; }
    .hw-notif-check { font-size: 15px; flex-shrink: 0; }
    .hw-notif-info { flex: 1; min-width: 0; }
    .hw-notif-name { font-size: 13px; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hw-notif-meta { font-size: 11px; color: #6b7280; margin-top: 1px; }
    .hw-notif-stars { font-size: 12px; flex-shrink: 0; color: #f59e0b; letter-spacing: -1px; }
    .hw-notif-time { font-size: 11px; color: #9ca3af; flex-shrink: 0; white-space: nowrap; }
    .hw-notif-footer { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid #eef2f7; background: #fafafa; }
    .hw-notif-footer-btn,
    .hw-notif-footer-link {
      flex: 1;
      text-align: center;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 10px;
      text-decoration: none;
      border: 1px solid #cfe7ea;
      background: #ffffff;
      color: #19777e;
      cursor: pointer;
    }
    .hw-notif-footer-btn:hover,
    .hw-notif-footer-link:hover { background: #eefbfc; }

    .hw-status-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 10020;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }
    .hw-status-modal {
      width: min(980px, 100%);
      max-height: min(86vh, 820px);
      overflow: hidden;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.3);
      display: flex;
      flex-direction: column;
    }
    .hw-status-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .hw-status-modal-heading { min-width: 0; }
    .hw-status-modal-title { font-size: 16px; font-weight: 700; color: #111827; margin: 0; }
    .hw-status-modal-subtitle { margin: 4px 0 0; font-size: 12px; color: #64748b; }
    .hw-status-modal-close {
      border: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      color: #64748b;
      padding: 0;
    }
    .hw-status-modal-body {
      padding: 18px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .hw-status-loading,
    .hw-status-empty {
      padding: 28px 16px;
      text-align: center;
      color: #64748b;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }
    .hw-status-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .hw-status-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }
    .hw-status-card-title { margin: 0; font-size: 15px; font-weight: 700; color: #111827; }
    .hw-status-card-meta { margin-top: 4px; font-size: 12px; color: #64748b; }
    .hw-status-card-counts { text-align: right; font-size: 12px; color: #334155; }
    .hw-status-card-counts strong { display: block; font-size: 15px; color: #0f766e; }
    .hw-status-card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .hw-status-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
    }
    .hw-status-chip.mode { background: #ede9fe; color: #6d28d9; }
    .hw-status-chip.class { background: #dcfce7; color: #166534; }
    .hw-status-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; }
    .hw-status-list { padding: 14px 16px; min-height: 0; }
    .hw-status-list + .hw-status-list { border-left: 1px solid #eef2f7; }
    .hw-status-list h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; }
    .hw-status-list-scroll { max-height: 220px; overflow: auto; padding-right: 4px; }
    .hw-status-empty-list { padding: 12px 0; font-size: 12px; color: #64748b; }
    .hw-status-person { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
    .hw-status-person:last-child { border-bottom: none; }
    .hw-status-person-name { font-size: 13px; font-weight: 600; color: #111827; }
    .hw-status-person-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
    .hw-status-done-badge,
    .hw-status-pending-badge {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .hw-status-done-badge { background: #dcfce7; color: #166534; }
    .hw-status-pending-badge { background: #fee2e2; color: #991b1b; }

    @media (max-width: 700px) {
      .burger-btn,
      .hw-notif-btn { width: 40px; height: 36px; }
      .hw-status-modal-backdrop { padding: 12px; }
      .hw-status-lists { grid-template-columns: 1fr; }
      .hw-status-list + .hw-status-list { border-left: none; border-top: 1px solid #eef2f7; }
      .hw-notif-footer { flex-direction: column; }
      .hw-status-modal-body { grid-template-columns: 1fr; }
    }
  </style>

  <div class="burger-menu">
    <!-- Notification bell -->
    <div class="hw-notif-wrap">
      <button type="button" class="hw-notif-btn" aria-label="Homework notifications" title="Homework notifications" aria-expanded="false">🔔
        <span class="hw-notif-badge" aria-live="polite"></span>
      </button>
      <div class="hw-notif-panel" role="dialog" aria-label="Homework notifications">
        <div class="hw-notif-header">
          <span>Homework Updates</span>
          <a class="hw-notif-header-link" href="/Teachers/tools/student_tracker/student_tracker.html?tab=homework">Open Tracker →</a>
        </div>
        <div class="hw-notif-body">
          <div class="hw-notif-loading">Loading…</div>
        </div>
        <div class="hw-notif-footer">
          <button type="button" class="hw-notif-footer-btn" id="hwNotifStatusBtn">Active Homework</button>
          <a class="hw-notif-footer-link" href="/Teachers/tools/student_tracker/student_tracker.html?tab=homework">Open Tracker</a>
        </div>
      </div>
    </div>

    <div class="hw-status-modal-backdrop" id="hwStatusModalBackdrop" aria-hidden="true">
      <div class="hw-status-modal" role="dialog" aria-modal="true" aria-label="Active homework status">
        <div class="hw-status-modal-header">
          <div class="hw-status-modal-heading">
            <h3 class="hw-status-modal-title">Active Homework</h3>
            <p class="hw-status-modal-subtitle">See each assignment, its class, the required mode, and who is done or still pending.</p>
          </div>
          <button type="button" class="hw-status-modal-close" id="hwStatusModalClose" aria-label="Close">×</button>
        </div>
        <div class="hw-status-modal-body" id="hwStatusModalBody">
          <div class="hw-status-loading">Loading active homework…</div>
        </div>
      </div>
    </div>

    <!-- Burger menu -->
    <div class="burger-dropdown-wrap" style="position:relative;">
      <button type="button" class="burger-btn" aria-label="Menu">☰</button>
      <div class="burger-dropdown">
        <a href="/Teachers/index.html">Teachers Home</a>
        <a href="/Teachers/tools/manage_students.html">Manage Students</a>

        <a href="/Teachers/tools/planner/planner.html">Planner</a>
        <a href="/Teachers/tools/game-builder/index.html">Game Builder</a>
        <a href="/Teachers/tools/survey_builder/survey_builder.html">Survey Builder</a>
        <a href="/Teachers/tools/reading/reading.html">Reading</a>

        <a href="#" id="feedbackMenuBtn">Feedback</a>
        <button type="button" id="logoutMenuBtn" style="display:block;width:100%;text-align:left;padding:12px 16px;background:#fff;border:none;border-top:1px solid #eee;color:#333;cursor:pointer;font:inherit;">Logout</button>
      </div>
    </div>
  </div>
</template>
