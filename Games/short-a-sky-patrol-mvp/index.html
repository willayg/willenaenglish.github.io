let lang='en',speed=1,W=0,H=0,D=1,run=false,last=0,score=0,lives=3,hit=0,spawn=0,words=[],shots=[],bgStars=[],particles=[],rings=[],queue=[],shotWords=[],keys={l:0,r:0,f:0},cool=0,friendHits=0,missed=0,skipped=0,qIndex=0,qCorrect=0,rec=null,listening=false,startTime=0,sessionId='',attemptIndex=0;const p={x:0,y:0,v:360};const tr=(k,...a)=>typeof T[lang][k]==='function'?T[lang][k](...a):T[lang][k];
function setHeader(){const h=document.querySelector('student-header');if(h)document.documentElement.style.setProperty('--headerH',h.getBoundingClientRect().height+'px')}new ResizeObserver(setHeader).observe(document.body);addEventListener('resize',()=>{setHeader();resize()});
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=tr(e.dataset.t));$('banner').textContent=tr('banner',speed);hud();if(!$('speech').classList.contains('hidden'))quizText()}
function resize(){const shell=$('gameShell');W=shell.clientWidth;H=shell.clientHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);p.y=H-Math.max(125,H*.17);p.x=Math.max(28,Math.min(W-28,p.x||W/2));bgStars=Array.from({length:Math.max(45,W*H/13000|0)},()=>({x:Math.random()*W,y:Math.random()*H,s:20+Math.random()*85,r:.5+Math.random()*1.7}))}

async function start(){try{await reset()}catch(e){console.error(e);alert('Could not start the student points tracker. Please reload.');return}$('start').classList.add('hidden');$('end').classList.add('hidden');$('speech').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');$('banner').classList.remove('hidden');run=true;last=performance.now();requestAnimationFrame(loop)}

function draw(){const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#02091c');grad.addColorStop(.6,'#103760');grad.addColorStop(1,'#122638');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='#fff';for(const s of bgStars){g.globalAlpha=.3+s.r/3;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;for(const b of shots){g.fillStyle='#fff76b';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}for(const w of words){g.fillStyle=w.target?'#b52e38':'#1d8155';g.strokeStyle=w.target?'#ff9ca4':'#a2ffd0';g.lineWidth=4;g.beginPath();g.arc(w.x,w.y,w.r,0,7);g.fill();g.stroke();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='900 '+w.fs+'px Poppins';g.fillText(w.text,w.x,w.y)}for(const q of particles){g.globalAlpha=q.a;g.fillStyle=q.col;g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill()}for(const r of rings){g.globalAlpha=r.a;g.strokeStyle=r.col;g.lineWidth=4;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke()}g.globalAlpha=1;g.save();g.translate(p.x,p.y);g.fillStyle='#dceaff';g.beginPath();g.moveTo(0,-28);g.lineTo(24,28);g.lineTo(0,15);g.lineTo(-24,28);g.closePath();g.fill();g.fillStyle='#58b8ff';g.beginPath();g.ellipse(0,-3,9,15,0,0,7);g.fill();g.fillStyle='#ffd447';g.beginPath();g.moveTo(-10,23);g.lineTo(0,48+Math.random()*7);g.lineTo(10,23);g.fill();g.restore()}

function readRound(){$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('banner').classList.add('hidden');$('speech').classList.remove('hidden');$('quizBtn').classList.remove('hidden');$('micBtn').classList.add('hidden');$('quizWord').textContent=tr('ready');$('quizCount').textContent=tr('words',shotWords.length);$('heard').textContent='';$('status').textContent=''}
function quizText(){if($('quizBtn').classList.contains('hidden')&&qIndex<shotWords.length)$('quizCount').textContent=tr('word',qIndex+1,shotWords.length);else{$('quizWord').textContent=tr('ready');$('quizCount').textContent=tr('words',shotWords.length)}}
function setupSpeech(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return false;rec=new R;rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;rec.onstart=()=>{listening=true;$('micBtn').classList.add('listening');$('status').textContent=tr('listening')};rec.onresult=e=>{const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript.toLowerCase().replace(/[^a-z]/g,''));checkAnswer(alts)};rec.onerror=e=>{listening=false;$('micBtn').classList.remove('listening');$('status').textContent=e.error==='not-allowed'?tr('blocked'):tr('tryAgain');$('retry').classList.remove('hidden')};rec.onend=()=>{listening=false;$('micBtn').classList.remove('listening')};return true}
function showWord(){if(qIndex>=shotWords.length)return finishQuiz();$('quizWord').textContent=shotWords[qIndex];$('quizCount').textContent=tr('word',qIndex+1,shotWords.length);$('heard').textContent='';$('status').textContent='';$('micBtn').classList.remove('hidden');$('retry').classList.add('hidden');$('skipWord').classList.remove('hidden')}
function listen(){if(listening)return;if(!rec&&!setupSpeech()){$('status').textContent=tr('unsupported');return}try{rec.start()}catch{$('status').textContent=tr('tryAgain')}}
function checkAnswer(alts){const target=shotWords[qIndex],ok=alts.includes(target);$('heard').textContent=alts[0]?tr('heard',alts[0]):'';if(ok){qCorrect++;score+=200*speed;logReward(target,2,'speech',2);$('status').textContent=tr('correct',200*speed);$('micBtn').classList.add('hidden');qIndex++;setTimeout(showWord,750)}else{$('status').textContent=tr('tryAgain');$('retry').classList.remove('hidden')}}
function startQuiz(){if(!shotWords.length)return finishQuiz();$('quizBtn').classList.add('hidden');qIndex=0;qCorrect=0;showWord()}function skipWord(){skipped++;qIndex++;showWord()}
async function finishQuiz(){const perfect=hit===10&&friendHits===0&&missed===0&&qCorrect===10&&skipped===0;const willena=hit+qCorrect*2;$('speech').classList.add('hidden');$('end').classList.remove('hidden');$('result').innerHTML='<p>'+tr('gameScore')+': <b>'+score+'</b></p><p class="reward">'+tr('willena')+': <b>+'+willena+'</b></p><p>'+tr('stars')+': <span class="stars">'+(perfect?'★★★★★':'—')+'</span></p>'+(perfect?'<p><b>'+tr('perfect')+'</b></p>':'')+'<p id="saveStatus">...</p>';try{await window.SkyTracker.endSession(sessionId,{mode:'short-a-sky-patrol',summary:{completed:true,score:hit+qCorrect,total:20,arcade_score:score,speed,duration_ms:Date.now()-startTime,targets_hit:hit,spoken_correct:qCorrect,friend_hits:friendHits,missed_targets:missed,skipped_words:skipped,stars:perfect?5:0,display_name:(localStorage.getItem('user_name')||'Student').slice(0,40)},listName:'short-a',wordList:A.map(eng=>({eng}))});window.SkyTracker.refresh();setTimeout(()=>window.SkyTracker.refresh(),1000);$('saveStatus').textContent=tr('saved')}catch(e){console.error('[sky] endSession failed',e);$('saveStatus').textContent=tr('saveFailed')}loadLeaderboard()}
async function api(path,options={}){return window.WillenaAPI&&WillenaAPI.fetch?WillenaAPI.fetch(path,options):fetch(path,{...options,credentials:'include'})}
async function loadLeaderboard(){$('leaders').textContent=tr('loading');try{const r=await api('/.netlify/functions/sky_patrol_leaderboard');const d=await r.json();const rows=d.leaderboard||[];if(!rows.length){$('leaders').textContent=tr('empty');return}$('leaders').innerHTML='<table><thead><tr><th>#</th><th>Name</th><th>Mode</th><th>Score</th></tr></thead><tbody>'+rows.map(x=>'<tr class="'+(x.self?'self':'')+'"><td>'+x.rank+'</td><td>'+escapeHtml(x.name)+'</td><td>×'+x.speed+'</td><td>'+x.score+'</td></tr>').join('')+'</tbody></table>'}catch{$('leaders').textContent=tr('empty')}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hold(id,k){const e=$(id),up=a=>{a.preventDefault();keys[k]=0};e.addEventListener('pointerdown',a=>{a.preventDefault();a.stopPropagation();keys[k]=1;if(k==='f')fire()});e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);e.addEventListener('pointerleave',up)}hold('left','l');hold('right','r');hold('fire','f');addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=1;if(e.code==='Space'){e.preventDefault();keys.f=1;fire()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=0;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=0;if(e.code==='Space')keys.f=0});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));applyLang()});$('startBtn').onclick=start;$('again').onclick=()=>{$('end').classList.add('hidden');$('start').classList.remove('hidden')};$('quizBtn').onclick=startQuiz;$('micBtn').onclick=listen;$('retry').onclick=listen;$('skipWord').onclick=skipWord;setHeader();resize();applyLang();draw()})();
</script>
</body>
