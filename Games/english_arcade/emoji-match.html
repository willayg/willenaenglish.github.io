<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Match</title>
  <meta name="description" content="Standalone Memory Match with English words, emoji or Korean pairs, and English Arcade points and stars." />
  <script src="/students/api-gateway.js?v=20260326c"></script>
  <script src="/js/api-config.js?v=20260324r"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/students/theme.css" />
  <link rel="stylesheet" href="./emoji-match.css?v=20260331c" />
  <script src="/students/language.js"></script>
  <script src="/students/theme.js"></script>
</head>
<body>
  <student-header title="Memory Match" show-home="true" show-points="true" show-logout="true" home-href="/students/dashboard.html" home-label="Home"></student-header>

  <main class="memory-app">
    <section id="setupScreen" class="screen screen-setup">
      <div class="setup-card">
        <div class="field-group">
          <label for="gridSelect">Grid</label>
          <select id="gridSelect">
            <option value="4x4">4x4</option>
            <option value="4x5">4x5</option>
            <option value="4x6">4x6</option>
          </select>
        </div>

        <div class="field-group">
          <label for="difficultySelect">Level</label>
          <select id="difficultySelect">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </div>

        <div class="setup-summary">
          <div class="summary-chip">
            <span class="summary-label">Pairs</span>
            <strong id="setupPairsValue">8</strong>
          </div>
          <div class="summary-chip">
            <span class="summary-label">5 Stars</span>
            <strong id="setupStarValue">8 moves</strong>
          </div>
        </div>

        <div id="setupMessage" class="message-banner" aria-live="polite"></div>

        <button id="startGameBtn" class="primary-action" type="button">Start</button>
      </div>
    </section>

    <section id="gameScreen" class="screen screen-game" hidden>
      <div class="game-shell">
        <div class="game-topbar">
          <div class="game-meta">
            <div class="meta-chip">
              <span class="meta-label">Grid</span>
              <strong id="gameGridValue">4x4</strong>
            </div>
            <div class="meta-chip">
              <span class="meta-label">Level</span>
              <strong id="gameDifficultyValue">Easy</strong>
            </div>
            <div class="meta-chip">
              <span class="meta-label">List</span>
              <strong id="gameListValue">Loading…</strong>
            </div>
          </div>
          <button id="exitGameBtn" class="secondary-action exit-action" type="button">Exit</button>
        </div>

        <div class="session-stats">
          <div class="stat-chip">
            <span class="stat-label">Points</span>
            <strong id="pointsValue">0</strong>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Moves</span>
            <strong id="movesValue">0</strong>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Matches</span>
            <strong id="matchesValue">0 / 8</strong>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Time</span>
            <strong id="timeValue">00:00</strong>
          </div>
          <div class="stat-chip">
            <span class="stat-label">5 Stars</span>
            <strong id="starTargetValue">8 moves</strong>
          </div>
        </div>

        <div class="board-frame">
          <div id="loadingState" class="board-overlay" hidden>
            <div class="loader"></div>
            <p id="loadingText">Building board…</p>
          </div>
          <div id="messageBanner" class="message-banner message-game" aria-live="polite"></div>
          <div id="boardGrid" class="board-grid" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/students/components/student-header.js?v=20260115"></script>
  <script type="module" src="./emoji-match.js?v=20260331c"></script>
</body>
</html>
