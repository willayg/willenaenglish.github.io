<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027년 3월 신규반 입학 신청 · 윌레나원어민영어학원</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="../form.css">
<script type="module" src="./form.js"></script></head><body><main>
<header><b>윌레나원어민영어학원</b><h1>2027년 3월 신규반 입학 신청</h1>
<p>아래 내용을 작성해 주시면 입학 신청이 접수됩니다.</p>
</header>
<section id="entry"><h2>학생 정보</h2>
<form id="application" method="post">
<div class="pair"><div><label for="student"><span class="required-star" aria-hidden="true">*</span> <span class="field-number">1.</span> 학생 이름</label>
<input id="student" name="student" autocomplete="off" required maxlength="50"></div>
<div><label for="birth"><span class="required-star" aria-hidden="true">*</span> <span class="field-number">2.</span> 출생연도 / 2027년의 학년</label>
<input id="birth" name="birth" maxlength="50" placeholder="예) 2020년생 / 초등 1학년" required></div></div>
<label for="phone"><span class="required-star" aria-hidden="true">*</span> <span class="field-number">3.</span> 보호자 연락처</label>
<input id="phone" name="phone" type="tel" autocomplete="tel-national" maxlength="22" required placeholder="대기 신청 시 등록한 연락처">
<label for="school"><span class="required-star" aria-hidden="true">*</span> <span class="field-number">4.</span> 현재 유치원 / 입학 예정 학교</label>
<input id="school" name="school" maxlength="80" required>
<label for="note">학원에 전할 내용 · 선택</label><textarea id="note" name="note" rows="2" maxlength="400" placeholder="학원에 전하실 내용을 작성해 주세요."></textarea>
<div class="trap" aria-hidden="true"><label for="website">홈페이지 주소</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<aside>입학 신청 후 3월 신규반 오리엔테이션 안내가 있을 예정입니다.</aside>
<details><summary>개인정보 수집·이용 안내</summary><p>학생 이름, 출생연도·학년, 보호자 연락처, 현재 유치원·입학 예정 학교 및 선택 메모를 기존 대기 확인과 3월 입학·오리엔테이션 안내에 사용합니다. 해당 학생의 입학 안내가 끝날 때까지 보관합니다. 동의를 거부하시면 온라인 접수가 어렵습니다. 정정·철회는 학원 <a href="tel:03180422203">031-8042-2203</a>으로 요청해 주세요.</p></details>
<label class="consent"><input type="checkbox" name="consent" required><span>학생의 보호자로서 개인정보 수집·이용에 동의합니다.</span></label>
<p class="error status" id="error" role="alert"></p><button id="submit" type="submit" disabled>신청하기</button>
<noscript><p>온라인 신청을 위해 브라우저의 자바스크립트를 켜 주세요.</p></noscript>
</form></section>
<section id="result" hidden><h2 id="result-title" tabindex="-1"></h2><p id="result-text"></p><a class="primary" href="/?admission=complete">확인</a></section>
</main></body></html>
