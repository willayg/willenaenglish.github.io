name = "worksheet-assets"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[r2_buckets]]
binding = "WORKSHEET_ASSETS"
bucket_name = "willena-files"
preview_bucket_name = "willena-files"

[vars]
# Set this to the public/custom-domain base serving willena-files before deployment.
R2_PUBLIC_BASE = ""
WORKSHEET_IMAGE_MAX_BYTES = "5242880"
WORKSHEET_MAX_ASSETS = "60"
WORKSHEET_TOTAL_IMAGE_MAX_BYTES = "20971520"

[dev]
port = 8794
local_protocol = "http"
