name = "willena-proxy"
main = "src/index.js"
compatibility_date = "2025-12-08"
workers_dev = true

# Intercept only the two level-test services on the existing proxied API host.
# Other legacy paths keep their current origin behavior.
[[routes]]
pattern = "api.willenaenglish.com/.netlify/functions/admin_classes*"
zone_name = "willenaenglish.com"

[[routes]]
pattern = "api.willenaenglish.com/.netlify/functions/student_level_test*"
zone_name = "willenaenglish.com"

[[services]]
binding = "SUPABASE_AUTH"
service = "supabase-auth"

[[services]]
binding = "HOMEWORK_API"
service = "homework-api"

[[services]]
binding = "LOG_WORD_ATTEMPT"
service = "log-word-attempt"

[[services]]
binding = "PROGRESS_SUMMARY"
service = "progress-summary"

[[services]]
binding = "GET_AUDIO_URLS"
service = "get-audio-urls"

[[services]]
binding = "PIXABAY"
service = "pixabay"

[[services]]
binding = "STUDENT_LEVEL_TEST"
service = "student-level-test"

[[services]]
binding = "ADMIN_CLASSES"
service = "admin-classes"

[vars]
NETLIFY_BASE = "https://willenaenglish.netlify.app"
