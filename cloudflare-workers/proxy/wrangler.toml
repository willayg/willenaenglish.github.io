name = "willena-proxy"
main = "src/index.js"
compatibility_date = "2025-12-08"
workers_dev = true

# The api.willenaenglish.com route is already configured in Cloudflare.
# This deployment updates only the Worker code and bindings.

[[services]]
binding = "SUPABASE_AUTH"
service = "supabase-auth"

[[services]]
binding = "HOMEWORK_API"
service = "homework-api"

[[services]]
binding = "LOG_WORD_ATTEMPT"
service = "log-word-attempt"

[[services]]
binding = "PROGRESS_SUMMARY"
service = "progress-summary"

[[services]]
binding = "GET_AUDIO_URLS"
service = "get-audio-urls"

[[services]]
binding = "PIXABAY"
service = "pixabay"

[[services]]
binding = "STUDENT_LEVEL_TEST"
service = "student-level-test"

[[services]]
binding = "ADMIN_CLASSES"
service = "admin-classes"

[vars]
NETLIFY_BASE = "https://willenaenglish.netlify.app"
