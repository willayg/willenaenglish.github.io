.brand-logo { width: 50px; height: 50px; object-fit: contain; background: rgb(255, 255, 255); border-radius: 15px; padding: 4px; box-shadow: rgba(0, 0, 0, 0.12) 0px 8px 22px; }

.brand-copy { flex: 1 1 0%; }

.brand-copy strong { display: block; font-size: 21px; }

.brand-copy span { display: block; font-size: 13px; opacity: 0.9; }

.language-segmented { display: flex; padding: 3px; border-radius: 16px; background: rgba(255, 255, 255, 0.28); }

.language-segmented button { border: 0px; border-radius: 13px; padding: 9px 13px; background: transparent; color: rgb(255, 255, 255); font-weight: 800; cursor: pointer; }

.language-segmented button.is-active { background: rgb(255, 255, 255); color: var(--pink); }

.header-button { border: 0px; border-radius: 15px; padding: 10px 14px; background: rgb(255, 255, 255); color: var(--pink); font-weight: 800; cursor: pointer; }

.language-legacy-trigger { display: none; }

.app-main { display: grid; }

.screen { width: 100%; margin: 0px auto; background: rgb(255, 255, 255); border: 2px solid var(--line); border-radius: 30px; padding: clamp(22px, 5vw, 42px); box-shadow: rgba(28, 115, 123, 0.16) 0px 18px 50px; }

.actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }

.btn { border: 0px; border-radius: 16px; min-height: 48px; padding: 0px 20px; font-weight: 800; cursor: pointer; }

.btn-primary { background: var(--cyan); color: rgb(255, 255, 255); }

.btn-ghost { background: rgb(255, 240, 247); color: rgb(167, 60, 109); }

footer { text-align: center; margin-top: 18px; color: rgba(32, 79, 90, 0.65); font-size: 12px; }

@media (max-width: 600px) {
  .app-shell { padding: 12px 9px 38px; }
  .app-header { margin-bottom: 13px; }
  .brand-logo { width: 44px; height: 44px; }
  .brand-copy strong { font-size: 18px; }
  .brand-copy span { font-size: 11px; }
  .language-segmented { display: none; }
  .language-legacy-trigger { display: block; }
  .screen { border-radius: 24px; }
