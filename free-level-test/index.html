<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Willena Free Level Test</title>
<style>
:root{--blue:#2563eb;--blue2:#60a5fa;--ink:#0f172a;--muted:#64748b;--line:#dbe4f0;--shadow:0 18px 60px rgba(37,99,235,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at 15% 15%,#dbeafe 0,transparent 30%),linear-gradient(180deg,#f8fbff,#eef5ff);color:var(--ink);min-height:100vh}button,input,select{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;max-width:1100px;width:100%;margin:auto}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.5px;font-size:23px}.mark{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:white;font-weight:900}.lang{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;color:var(--muted)}main{flex:1;display:grid;place-items:center;padding:20px}.shell{width:min(760px,100%)}.card{background:rgba(255,255,255,.96);border:1px solid rgba(219,228,240,.9);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,52px)}.kicker{display:inline-flex;align-items:center;gap:8px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-2px;margin:18px 0 14px}h2{font-size:clamp(27px,4vw,40px);letter-spacing:-1.2px;margin:0 0 10px}.lead{font-size:18px;line-height:1.65;color:var(--muted);margin:0 0 26px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{border:0;border-radius:16px;padding:15px 20px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),#3b82f6);color:white;box-shadow:0 10px 24px rgba(37,99,235,.25)}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.choice{border:1.5px solid var(--line);border-radius:20px;padding:20px;background:white;text-align:left;cursor:pointer;transition:.18s;min-height:150px}.choice:hover,.choice.selected{transform:translateY(-2px);border-color:#60a5fa;box-shadow:0 12px 28px rgba(37,99,235,.12);background:#f8fbff}.emoji{font-size:32px}.choice b{display:block;font-size:19px;margin:10px 0 5px}.choice span{color:var(--muted);line-height:1.45}.stepbar{height:8px;background:#e7edf6;border-radius:99px;overflow:hidden;margin-bottom:28px}.stepbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));width:0;transition:.25s}.question-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:20px}.word{font-weight:950;font-size:clamp(54px,11vw,92px);letter-spacing:5px;text-align:center;margin:30px 0}.picture{text-align:center;font-size:56px;margin-top:8px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.opt{padding:18px;border:1.5px solid var(--line);background:#fff;border-radius:18px;font-weight:900;font-size:20px;cursor:pointer}.opt.selected{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}.note{font-size:14px;color:var(--muted);line-height:1.5}.stack{display:grid;gap:12px}.result-level{font-size:42px;font-weight:950;letter-spacing:-1.5px;margin:14px 0}.result-box{background:#f8fbff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:18px 0}.result-box h3{margin:0 0 8px}.smallcaps{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#2563eb}.history{margin-top:16px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid var(--line)}@media(max-width:620px){.top{padding:0 16px}.card{border-radius:22px}.grid,.options{grid-template-columns:1fr}.choice{min-height:auto}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><div class="mark">W</div><div>Willena English</div></div><button class="lang" id="langBtn">한국어 / EN</button></header><main><div class="shell"><section class="card" id="screen"></section></div></main></div>
<script>
const $=s=>document.querySelector(s);const storageKey='willenaFreePhonicsAttempts';let lang='en',state={route:null,stage:0,qIndex:0,score:0,answers:[],selected:null};
const T={en:{welcomeTitle:'Find your English level',welcomeLead:'A short, free test that adapts to what you can do. No sign-up required.',continue:'Continue',previous:'Previous result',choose:'Choose your starting point',chooseLead:'Pick the option that feels closest. The test will adjust as you go.',phonics:'Phonics',phonicsD:'Letters, sounds and word patterns',beginner:'Beginner',beginnerD:'Words and simple sentences',experienced:'Experienced',experiencedD:'Reading and English questions',custom:'Customise',customD:'Tell us about your English experience',ready:'Your recommended test',readyD:'We will begin with phonics and adjust the difficulty automatically.',start:'Start test',listen:'Look at the picture and complete the word.',next:'Continue',finish:'See my result',result:'Your phonics result',retry:'Try again',home:'Back to start'},ko:{welcomeTitle:'나의 영어 레벨 찾기',welcomeLead:'회원가입 없이 무료로 이용할 수 있는 간단한 맞춤형 테스트입니다.',continue:'계속하기',previous:'이전 결과',choose:'시작 단계를 선택하세요',chooseLead:'가장 가까운 항목을 선택하세요. 테스트가 자동으로 난이도를 조절합니다.',phonics:'파닉스',phonicsD:'알파벳, 소리와 단어 패턴',beginner:'초급',beginnerD:'단어와 간단한 문장',experienced:'경험 있음',experiencedD:'읽기와 영어 질문',custom:'맞춤 설정',customD:'영어 학습 경험을 알려주세요',ready:'추천 테스트',readyD:'파닉스부터 시작하고 정답에 따라 난이도를 자동 조절합니다.',start:'테스트 시작',listen:'그림을 보고 단어를 완성하세요.',next:'계속하기',finish:'결과 보기',result:'파닉스 결과',retry:'다시 하기',home:'처음으로'}};
const questions=[{stage:1,skill:'Initial consonants',pic:'🐈',display:'_at',opts:['c','m','s','p'],ans:'c'},{stage:1,skill:'Initial consonants',pic:'🐕',display:'_og',opts:['d','f','l','b'],ans:'d'},{stage:2,skill:'Final consonants',pic:'🐖',display:'pi_',opts:['g','t','n','p'],ans:'g'},{stage:2,skill:'Final consonants',pic:'☀️',display:'su_',opts:['n','m','t','p'],ans:'n'},{stage:3,skill:'Short vowels',pic:'🐈',display:'c_t',opts:['a','e','i','o'],ans:'a'},{stage:3,skill:'Short vowels',pic:'🐖',display:'p_g',opts:['a','e','i','o'],ans:'i'},{stage:4,skill:'Word families',pic:'🐈',display:'c__',opts:['at','an','ap','ot'],ans:'at'},{stage:4,skill:'Word families',pic:'👨',display:'m__',opts:['an','at','ap','ad'],ans:'an'},{stage:5,skill:'Beginning blends',pic:'🛑',display:'__op',opts:['st','sn','dr','cl'],ans:'st'},{stage:5,skill:'Beginning blends',pic:'🥁',display:'__um',opts:['dr','tr','br','gr'],ans:'dr'},{stage:6,skill:'Ending blends',pic:'🦘',display:'ju__',opts:['mp','nd','st','sk'],ans:'mp'},{stage:6,skill:'Ending blends',pic:'✋',display:'ha__',opts:['nd','mp','st','sk'],ans:'nd'},{stage:7,skill:'Digraphs',pic:'🚢',display:'__ip',opts:['sh','ch','th','wh'],ans:'sh'},{stage:7,skill:'Digraphs',pic:'🪑',display:'__air',opts:['ch','sh','th','wh'],ans:'ch'},{stage:8,skill:'Silent e',pic:'🎂',display:'c__e',opts:['ak','ake','ack','a'],ans:'ake'},{stage:8,skill:'Silent e',pic:'🪁',display:'k__e',opts:['it','ite','igh','i'],ans:'ite'},{stage:9,skill:'Vowel teams',pic:'🌧️',display:'r__n',opts:['ai','ee','oa','oo'],ans:'ai'},{stage:9,skill:'Vowel teams',pic:'⛵',display:'b__t',opts:['oa','ai','ee','oo'],ans:'oa'},{stage:10,skill:'Advanced clusters',pic:'🧵',display:'___ing',opts:['str','spr','scr','thr'],ans:'str'},{stage:10,skill:'Advanced clusters',pic:'🌱',display:'___out',opts:['spr','str','scr','spl'],ans:'spr'}];
function tr(k){return T[lang][k]}function renderWelcome(){const attempts=JSON.parse(localStorage.getItem(storageKey)||'[]');$('#screen').innerHTML=`<span class="kicker">FREE LEVEL TEST</span><h1>${tr('welcomeTitle')}</h1><p class="lead">${tr('welcomeLead')}</p><div class="actions"><button class="btn primary" onclick="renderRoute()">${tr('continue')} →</button></div>${attempts.length?`<div class="history"><b>${tr('previous')}</b><div>${attempts[0].label} · ${new Date(attempts[0].date).toLocaleDateString()}</div></div>`:''}`}
function renderRoute(){$('#screen').innerHTML=`<div class="smallcaps">Step 1 of 3</div><h2>${tr('choose')}</h2><p class="lead">${tr('chooseLead')}</p><div class="grid">${card('phonics','🌱',tr('phonics'),tr('phonicsD'))}${card('beginner','🌿',tr('beginner'),tr('beginnerD'))}${card('experienced','🌳',tr('experienced'),tr('experiencedD'))}${card('custom','⚙️',tr('custom'),tr('customD'))}</div>`}function card(id,e,t,d){return `<button class="choice" onclick="chooseRoute('${id}')"><div class="emoji">${e}</div><b>${t}</b><span>${d}</span></button>`}
function chooseRoute(r){state.route=r;if(r==='custom')return renderCustom();state.stage=r==='phonics'?1:r==='beginner'?4:7;renderReady()}function renderCustom(){$('#screen').innerHTML=`<div class="smallcaps">Step 2 of 3</div><h2>Custom setup</h2><p class="lead">One question at a time. Choose the learner’s current school stage.</p><div class="stack">${['Preschool','Elementary 1–2','Elementary 3–4','Elementary 5–6','Middle school or older'].map((x,i)=>`<button class="choice" onclick="customPick(${i})"><b>${x}</b></button>`).join('')}</div>`}function customPick(i){state.stage=[1,2,4,6,8][i];renderReady()}
function renderReady(){$('#screen').innerHTML=`<div class="smallcaps">Step 3 of 3</div><h2>${tr('ready')}</h2><p class="lead">${tr('readyD')}</p><div class="result-box"><h3>Phonics</h3><p class="note">Initial consonants → short vowels → word families → blends → digraphs → silent e → vowel teams → advanced clusters</p></div><div class="actions"><button class="btn primary" onclick="startTest()">${tr('start')} →</button><button class="btn ghost" onclick="renderRoute()">Back</button></div>`}
function startTest(){state.qIndex=0;state.score=0;state.answers=[];state.selected=null;state.pool=buildAdaptivePool(state.stage);renderQuestion()}function buildAdaptivePool(start){const stages=[Math.max(1,start-1),start,Math.min(10,start+1),Math.min(10,start+2)];return questions.filter(q=>stages.includes(q.stage)).sort(()=>Math.random()-.5).slice(0,8)}
function renderQuestion(){const q=state.pool[state.qIndex],pct=(state.qIndex/state.pool.length)*100;$('#screen').innerHTML=`<div class="stepbar"><i style="width:${pct}%"></i></div><div class="question-meta"><span>${q.skill}</span><span>${state.qIndex+1} / ${state.pool.length}</span></div><p class="note">${tr('listen')}</p><div class="picture">${q.pic}</div><div class="word">${q.display}</div><div class="options">${q.opts.map(o=>`<button class="opt" onclick="selectOpt(this,'${o.replace("'","\\'")}')">${o}</button>`).join('')}</div><div class="actions"><button id="nextBtn" class="btn primary" disabled onclick="submitAnswer()">${state.qIndex===state.pool.length-1?tr('finish'):tr('next')} →</button></div>`}
function selectOpt(el,v){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.selected=v;$('#nextBtn').disabled=false}function submitAnswer(){const q=state.pool[state.qIndex],correct=state.selected===q.ans;state.answers.push({id:q.display,stage:q.stage,skill:q.skill,correct});if(correct)state.score++;state.selected=null;state.qIndex++;if(state.qIndex>=state.pool.length)renderResult();else renderQuestion()}
function renderResult(){const correctStages=state.answers.filter(a=>a.correct).map(a=>a.stage);const best=correctStages.length?Math.max(...correctStages):1;let label,can,next;if(best<=3){label='Basic Sound Builder';can='You can match many single letters and short vowels to simple words.';next='Next: word families and two-letter blends.'}else if(best<=5){label='Word Pattern Reader';can='You can use short vowels, common word families and some beginning blends.';next='Next: ending blends, digraphs and silent-e words.'}else if(best<=7){label='Confident Phonics Reader';can='You can handle common blends and digraphs in familiar words.';next='Next: silent-e words and common vowel teams.'}else{label='Advanced Phonics Reader';can='You can recognise silent-e patterns, vowel teams and longer consonant clusters.';next='Next: apply these patterns in longer reading and spelling.'}const attempt={date:new Date().toISOString(),label,best,score:state.score,total:state.pool.length};const a=JSON.parse(localStorage.getItem(storageKey)||'[]');a.unshift(attempt);localStorage.setItem(storageKey,JSON.stringify(a.slice(0,5)));$('#screen').innerHTML=`<span class="kicker">${tr('result')}</span><div class="result-level">${label}</div><p class="lead">${can}</p><div class="result-box"><h3>Highest secure area</h3><p><b>Phonics stage ${best}</b></p><p class="note">${next}</p></div><p class="note">This free test gives a practical snapshot, not a school placement or certification.</p><div class="actions"><button class="btn primary" onclick="startTest()">${tr('retry')}</button><button class="btn ghost" onclick="renderWelcome()">${tr('home')}</button></div>`}
$('#langBtn').onclick=()=>{lang=lang==='en'?'ko':'en';renderWelcome()};renderWelcome();
</script>
</body>
</html>
