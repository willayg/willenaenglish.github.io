<script>
(function(){
  function isAdminClasses(input){return /\/\.netlify\/functions\/admin_classes(?:\?|$)/.test(String(input||''))}
  async function repairSession(){
    try{
      let r=await fetch('https://api.willenaenglish.com/.netlify/functions/supabase_auth?action=refresh&_='+Date.now(),{credentials:'include',cache:'no-store'});
      return r.ok;
    }catch(_){return false}
  }
  function install(){
    if(!window.WillenaAPI||typeof window.WillenaAPI.fetch!=='function'){setTimeout(install,10);return}
    if(window.WillenaAPI.__adminReportCookieAuth)return;
    var original=window.WillenaAPI.fetch.bind(window.WillenaAPI);
    window.WillenaAPI.fetch=async function(input,options){
      if(!isAdminClasses(input))return original(input,options);
      var absolute='https://api.willenaenglish.com'+String(input);
      var opts=Object.assign({credentials:'include',cache:'no-store'},options||{});
      var headers=new Headers(opts.headers||{});headers.delete('Authorization');headers.delete('authorization');opts.headers=headers;
      var response=await fetch(absolute,opts);
      if(response.status===401&&await repairSession())response=await fetch(absolute,opts);
      return response;
    };
    window.WillenaAPI.__adminReportCookieAuth=true;
  }
  install();
})();
</script>
