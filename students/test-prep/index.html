x}.modal{width:min(560px,100%);background:#fff;border-radius:22px;padding:18px}.reasons{display:flex;flex-wrap:wrap;gap:8px}.reason{border:1px solid var(--line);background:#fafafa;border-radius:999px;padding:9px 11px;font-size:12px;font-weight:800}.reason.on{border-color:var(--accent);background:var(--soft);color:#b52e61}.note{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:70px;font:inherit}.modal-actions{display:flex;gap:8px;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:540px){.app{padding:12px 10px 32px}.hero,.card{border-radius:18px}.body{padding:4px 13px 16px}.card-head{padding:13px 13px 6px}.prompt{font-size:16px}.tabs{gap:5px}.tab{font-size:12px}}

<div class="app"><div class="top"><div class="brand">Willena <b>Test Prep</b></div><div class="pill">중1 · 동아 윤정미 · L1</div></div><div class="tabs"><button class="tab" data-section="communication">Communication</button><button class="tab" data-section="grammar">Grammar</button><button class="tab active" data-section="reading">Reading</button></div><section class="hero"><h1 id="heroTitle">Reading 시험 대비</h1><p>30문제 · 출처 표시 · 이상한 문제는 🚩</p><div class="progress"><i id="bar"></i></div></section><main class="card" id="card"><div class="loading">문제를 불러오는 중...</div></main></div>

<script>
const U='https://gxwfsqxyuufqtitspfqg.supabase.co',K=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join(''),H={apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'};const card=document.getElementById('card'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),reasonsEl=document.getElementById('reasons'),flagNote=document.getElementById('flagNote'),heroTitle=document.getElementById('heroTitle');let section='reading',questions=[],index=0,selected=new Set(),checked=false,score=0,wrongIds=[],flagReason='';const flagReasons=['정답이 이상함','문제가 애매함','영어가 이상함','시험 범위와 안 맞음','너무 쉬움','너무 어려움','반복 문제','화면/표시 문제','기타'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(v){let s=String(v??'').replace(/\r\n?/g,'\n');for(let i=0;i<4;i++)s=s.replace(/\\+n/g,'\n');return s}function markedLine(v,spans=[]){let s=String(v??'');if(!Array.isArray(spans)||!spans.length)return esc(s);const hits=[];spans.forEach((x,i)=>{if(!x)return;const token=`__U${i}__`;const pos=s.indexOf(x);if(pos>=0){s=s.slice(0,pos)+token+s.slice(pos+x.length);hits.push([token,x])}});s=esc(s);hits.forEach(([token,x])=>{s=s.replace(token,`<span class="u">${esc(x)}</span>`)});return s}function text(v,spans=[]){return norm(v).split('\n').map(x=>`<span class="line">${markedLine(x,spans)}</span>`).join('')}function block(title,v,spans=[]){if(v==null||v==='')return'';return `<div class="context">${title?`<div class="context-title">${esc(title)}</div>`:''}${text(v,spans)}</div>`}function arr(title,a){if(!Array.isArray(a)||!a.length)return'';return `<div class="context">${title?`<div class="context-title">${esc(title)}</div>`:''}<div class="items">${a.map((x,i)=>`<div class="item">${Array.isArray(x)?x.map(y=>text(y)).join('<hr style="border:0;border-top:1px solid #eee">'):text(x)}</div>`).join('')}</div></div>`}function obj(title,o,cls='segment'){if(!o||typeof o!=='object'||Array.isArray(o))return'';return `<div class="context"><div class="context-title">${esc(title)}</div><div class="${cls==='claim'?'claims':'segments'}">${Object.entries(o).map(([k,v])=>`<div class="${cls}"><b>${esc(k)}</b> ${text(v)}</div>`).join('')}</div></div>`}function ctx(q){const c=q.context||{};let o='';if(c.passage)o+=block('',c.passage,c.underlined_spans);if(c.passage_start)o+=block('',c.passage_start,c.underlined_spans)+obj('A–D',c.segments)+block('',c.passage_end,c.underlined_spans);if(c.source_passage)o+=block('원문',c.source_passage,c.underlined_spans);if(c.rewritten)o+=block('바꿔 쓴 글',c.rewritten,c.underlined_spans);if(c.dialogue)o+=block('대화',c.dialogue,c.underlined_spans);if(c.dialogue_start)o+=block('',c.dialogue_start,c.underlined_spans)+obj('A–D',c.segments)+block('',c.dialogue_end,c.underlined_spans);if(c.dialogue_a)o+=block('대화 A',c.dialogue_a,c.underlined_spans);if(c.dialogue_b)o+=block('대화 B',c.dialogue_b,c.underlined_spans);if(c.dialogue1)o+=block('대화 1',c.dialogue1,c.underlined_spans);if(c.dialogue2)o+=block('대화 2',c.dialogue2,c.underlined_spans);if(c.given_sentence)o+=block('<보기>',c.given_sentence);if(c.bank)o+=Array.isArray(c.bank)?arr('<보기>',c.bank):typeof c.bank==='object'?obj('<보기>',c.bank):block('<보기>',c.bank);o+=arr('',c.items);o+=arr('',c.pairs);o+=arr('문제 단서',c.clues);o+=arr('',c.statements);o+=obj('설명',c.claims,'claim');if(c.table)o+=obj('표',c.table);if(c.definition)o+=block('정의',c.definition);if(c.underlined)o+=block('밑줄',c.underlined,[c.underlined]);return o}const shuffle=a=>[...a].sort(()=>Math.random()-.5);function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function render(){if(!questions.length){card.innerHTML='<div class="empty">사용 가능한 문제가 없습니다.</div>';return}if(index>=questions.length)return result();const q=questions[index];selected=new Set();checked=false;bar.style.width=`${index/questions.length*100}%`;card.innerHTML=`<div class="card-head"><div class="qnum">${index+1} / ${questions.length}</div><div style="display:flex;align-items:center;gap:4px"><span class="source">${esc(q.student_source_label||'Reference')} · Q${q.source_question_number}</span><button class="flag" id="flagBtn">🚩</button></div></div><div class="body"><div class="prompt">${esc(q.prompt_text||'')}</div>${ctx(q)}<div class="choices">${(q.choices||[]).map((x,i)=>`<button class="choice" data-i="${i+1}"><span class="n">${['①','②','③','④','⑤','⑥'][i]||i+1}</span><span class="t">${text(typeof x==='string'?x:(x.text||JSON.stringify(x)))}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="explanation" id="explanation"></div><div class="actions"><button class="primary" id="check" disabled>정답 확인</button></div></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b,q));document.getElementById('check').onclick=()=>check(q);document.getElementById('flagBtn').onclick=openFlag}function choose(b,q){if(checked)return;const n=b.dataset.i;if(q.answer_mode==='multi_select'){selected.has(n)?selected.delete(n):selected.add(n);b.classList.toggle('selected')}else{selected=new Set([n]);card.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}document.getElementById('check').disabled=!selected.size}function same(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}function check(q){if(checked){index++;return render()}checked=true;const ans=(q.correct_answer||[]).map(String),mine=[...selected].map(String),ok=same(mine,ans);if(ok)score++;else wrongIds.push(q.id);card.querySelectorAll('.choice').forEach(b=>{const n=b.dataset.i;if(ans.includes(n))b.classList.add('correct');else if(selected.has(n))b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'정답입니다!':'정답: '+ans.join(', ')+'번';if(!ok&&q.metadata?.source_explanation_ko){const e=document.getElementById('explanation');e.innerHTML=`<strong>해설</strong>${text(q.metadata.source_explanation_ko)}`;e.classList.add('show')}const c=document.getElementById('check');c.disabled=false;c.textContent=index===questions.length-1?'결과 보기':'다음 문제'}function result(){bar.style.width='100%';const pct=Math.round(score/questions.length*100);card.innerHTML=`<div class="result"><div class="score">${score}/${questions.length}</div><h2>${pct>=80?'좋아요! 시험 준비가 잘 되고 있어요.':'틀린 문제를 한 번 더 보면 좋아요.'}</h2><p>정답률 ${pct}% · 틀린 문제 ${wrongIds.length}개</p><div class="actions"><button class="secondary" id="again">처음부터</button>${wrongIds.length?'<button class="primary" id="retry">틀린 문제 다시</button>':''}</div></div>`;document.getElementById('again').onclick=()=>{index=0;score=0;wrongIds=[];questions=shuffle(questions);render()};if(wrongIds.length)document.getElementById('retry').onclick=()=>{questions=shuffle(questions.filter(q=>wrongIds.includes(q.id)));index=0;score=0;wrongIds=[];render()}}function openFlag(){flagReason='';flagNote.value='';reasonsEl.innerHTML=flagReasons.map(r=>`<button class="reason">${r}</button>`).join('');reasonsEl.querySelectorAll('.reason').forEach(b=>b.onclick=()=>{flagReason=b.textContent;reasonsEl.querySelectorAll('.reason').forEach(x=>x.classList.toggle('on',x===b))});overlay.classList.add('open')}document.getElementById('cancelFlag').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.getElementById('sendFlag').onclick=async()=>{if(!flagReason)return toast('이유를 하나 골라 주세요');const q=questions[index],payload={question_id:q.id,reason:flagReason,note:flagNote.value.trim()||null,selected_answer:[...selected],correct_answer_snapshot:q.correct_answer||[],status:'open',metadata:{source_label:q.student_source_label,source_question_number:q.source_question_number,question_type:q.question_type,section,page:location.pathname}};try{const r=await fetch(`${U}/rest/v1/test_prep_question_flags`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw Error(await r.text());overlay.classList.remove('open');toast('신고했습니다. 고마워요!')}catch(e){console.error(e);toast('신고 저장에 실패했습니다')}};async function load(){card.innerHTML='<div class="loading">문제를 불러오는 중...</div>';heroTitle.textContent=section[0].toUpperCase()+section.slice(1)+' 시험 대비';try{const s='id,source_question_number,source_page,question_type,prompt_text,context,choices,correct_answer,targets,answer_mode,context_type,difficulty,student_source_label,content_status,metadata';const url=`${U}/rest/v1/test_prep_questions?select=${encodeURIComponent(s)}&student_usable=eq.true&section=eq.${section}&order=source_question_number.asc`;const r=await fetch(url,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());questions=shuffle(await r.json());index=0;score=0;wrongIds=[];render()}catch(e){card.innerHTML=`<div class="empty">문제를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=b.dataset.section;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});load();
</script></body></html>
