<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Willena Test Prep</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#171922;--muted:#777b88;--line:#e7e8ee;--accent:#ff4f8b;--accent-soft:#fff0f5;--ok:#159447;--bad:#d64045;--shadow:0 12px 34px rgba(30,36,50,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink)}
button{font:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 42px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:20px;letter-spacing:-.4px}.brand b{color:var(--accent)}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:#555}
.hero{background:linear-gradient(135deg,#fff,#fff7fa);border:1px solid #ffd4e2;border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{font-size:19px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.progress{height:7px;background:#eceef3;border-radius:99px;overflow:hidden;margin-top:15px}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}.qnum{font-size:13px;font-weight:900;color:var(--muted)}
.source{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f3f4f7;color:#5f6470;padding:7px 9px;font-size:11px;font-weight:800}.flag{border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:10px}.flag:active{background:#f2f2f5}
.body{padding:6px 18px 20px}.prompt{font-weight:900;font-size:17px;line-height:1.55;margin:8px 0 14px}.context{white-space:pre-wrap;background:#fafafc;border:1px solid var(--line);border-radius:15px;padding:14px;margin:0 0 14px;font-size:14px;line-height:1.65}.context-title{font-weight:900;margin-bottom:8px}.given{margin-top:10px;padding:10px 12px;border-left:3px solid #bbb;background:#fff;border-radius:8px;font-weight:700}.segments{display:grid;gap:7px;margin-top:10px}.segment{background:#fff;border:1px solid #e6e7ec;border-radius:10px;padding:9px 10px}.segment b{display:inline-block;min-width:28px}.statements{margin-top:10px;display:grid;gap:7px}.statement{font-size:13px;line-height:1.5;color:#444}
.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;background:#fff;border:1.5px solid #dedfe6;border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.12s}.choice:hover{border-color:#c6c8d2}.choice.selected{border-color:var(--accent);background:var(--accent-soft)}.choice.correct{border-color:#75c98f;background:#effaf3}.choice.wrong{border-color:#ef9b9e;background:#fff1f1}.choice .n{font-weight:900;min-width:20px}.choice .t{line-height:1.45}
.actions{display:flex;gap:10px;margin-top:16px}.primary,.secondary{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{background:var(--ink);color:#fff;flex:1}.primary:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#eeeef2;color:#333}
.feedback{margin-top:13px;padding:12px 13px;border-radius:13px;font-weight:800;font-size:13px;display:none}.feedback.ok{display:block;background:#effaf3;color:var(--ok)}.feedback.bad{display:block;background:#fff0f0;color:var(--bad)}
.explanation{display:none;margin-top:10px;background:#fff8ea;border:1px solid #f2d9a4;border-radius:14px;padding:14px;color:#54462d;font-size:13px;line-height:1.65}.explanation.show{display:block}.explanation strong{display:block;color:#2d261b;margin-bottom:5px}
.loading,.empty{padding:46px 20px;text-align:center;color:var(--muted);font-weight:700}.result{text-align:center;padding:32px 22px}.score{font-size:54px;font-weight:950;letter-spacing:-2px}.result h2{margin:4px 0 6px}.result p{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(20,22,29,.38);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.overlay.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{margin:2px 0 6px}.modal p{color:var(--muted);font-size:13px;margin:0 0 12px}.reasons{display:flex;flex-wrap:wrap;gap:8px}.reason{border:1px solid var(--line);background:#fafafa;border-radius:999px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer}.reason.on{border-color:var(--accent);background:var(--accent-soft);color:#b52e61}.note{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:70px;resize:vertical;font:inherit}.modal-actions{display:flex;gap:8px;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:540px){.app{padding:12px 10px 32px}.hero,.card{border-radius:18px}.body{padding:4px 13px 16px}.card-head{padding:13px 13px 6px}.prompt{font-size:16px}.choice{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">Willena <b>Test Prep</b></div><div class="pill" id="scope">중1 · 동아 윤정미 · L1</div></div>
  <section class="hero"><h1>Communication 시험 대비</h1><p>30문제 · 출처 표시 · 이상한 문제는 🚩</p><div class="progress"><i id="bar"></i></div></section>
  <main class="card" id="card"><div class="loading">문제를 불러오는 중...</div></main>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>이 문제에 문제가 있나요? 🚩</h3><p>이유를 골라 주세요. 나중에 문제은행을 정리할 때 사용합니다.</p>
    <div class="reasons" id="reasons"></div>
    <textarea class="note" id="flagNote" placeholder="추가 메모 (선택)"></textarea>
    <div class="modal-actions"><button class="secondary" id="cancelFlag">취소</button><button class="primary" id="sendFlag">보내기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
const SUPABASE_KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const H={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
const card=document.getElementById('card'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),reasonsEl=document.getElementById('reasons'),flagNote=document.getElementById('flagNote');
let questions=[],index=0,selected=new Set(),checked=false,score=0,wrongIds=[],flagReason='';
const flagReasons=['정답이 이상함','문제가 애매함','영어가 이상함','시험 범위와 안 맞음','너무 쉬움','너무 어려움','반복 문제','화면/표시 문제','기타'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').replace(/\\\\n/g,'\n').replace(/\\n/g,'\n');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function block(title,text){if(!text)return'';return `<div class="context">${title?`<div class="context-title">${esc(title)}</div>`:''}${esc(norm(text))}</div>`}
function segHtml(obj){if(!obj||typeof obj!=='object')return'';return `<div class="segments">${Object.entries(obj).map(([k,v])=>`<div class="segment"><b>(${esc(k)})</b> ${esc(norm(v))}</div>`).join('')}</div>`}
function ctxHtml(q){
  const c=q.context||{};let out='';
  if(c.passage) out+=block('',c.passage);
  if(c.dialogue_start){
    out+=`<div class="context">${esc(norm(c.dialogue_start))}${segHtml(c.segments)}${c.dialogue_end?`<div style="margin-top:10px">${esc(norm(c.dialogue_end))}</div>`:''}</div>`;
  } else if(c.dialogue){
    out+=`<div class="context">${esc(norm(c.dialogue))}${c.given_sentence?`<div class="given">&lt;보기&gt; ${esc(c.given_sentence)}</div>`:''}${segHtml(c.segments)}${Array.isArray(c.statements)?`<div class="statements">${c.statements.map(s=>`<div class="statement">${esc(s)}</div>`).join('')}</div>`:''}</div>`;
  }
  if(c.dialogue_a) out+=block('대화 A',c.dialogue_a);
  if(c.dialogue_b) out+=block('대화 B',c.dialogue_b);
  if(c.dialogue1) out+=`<div class="context"><div class="context-title">대화 1</div>${esc(norm(c.dialogue1))}${segHtml(c.dialogue1_segments)}</div>`;
  if(c.dialogue2) out+=`<div class="context"><div class="context-title">대화 2</div>${esc(norm(c.dialogue2))}${segHtml(c.dialogue2_segments)}</div>`;
  if(c.bank) out+=block('<보기>',Array.isArray(c.bank)?c.bank.join('\n'):c.bank);
  if(c.definition) out+=block('정의',c.definition);
  if(c.underlined) out+=block('밑줄',c.underlined);
  if(c.markers && !c.dialogue_start && !c.dialogue) out+=block('',Array.isArray(c.markers)?c.markers.join('\n'):c.markers);
  if(Array.isArray(c.statements) && !c.dialogue) out+=`<div class="context"><div class="statements">${c.statements.map(s=>`<div class="statement">${esc(s)}</div>`).join('')}</div></div>`;
  return out;
}
function render(){if(!questions.length){card.innerHTML='<div class="empty">사용 가능한 문제가 없습니다.</div>';return}if(index>=questions.length){renderResult();return}const q=questions[index];selected=new Set();checked=false;bar.style.width=`${index/questions.length*100}%`;card.innerHTML=`<div class="card-head"><div class="qnum">${index+1} / ${questions.length}</div><div style="display:flex;align-items:center;gap:4px"><span class="source">${esc(q.student_source_label||'Reference')} · Q${q.source_question_number}</span><button class="flag" id="flagBtn" aria-label="문제 신고">🚩</button></div></div><div class="body"><div class="prompt">${esc(q.prompt_text||'')}</div>${ctxHtml(q)}<div class="choices">${(q.choices||[]).map((x,i)=>`<button class="choice" data-i="${i+1}"><span class="n">${['①','②','③','④','⑤','⑥'][i]||i+1}</span><span class="t">${esc(typeof x==='string'?x:(x.text||JSON.stringify(x)))}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="explanation" id="explanation"></div><div class="actions"><button class="primary" id="check" disabled>정답 확인</button></div></div>`;
card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b,q));document.getElementById('check').onclick=()=>check(q);document.getElementById('flagBtn').onclick=openFlag}
function choose(btn,q){if(checked)return;const n=btn.dataset.i;if(q.answer_mode==='multi_select'){selected.has(n)?selected.delete(n):selected.add(n);btn.classList.toggle('selected')}else{selected=new Set([n]);card.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected')}document.getElementById('check').disabled=!selected.size}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function check(q){if(checked){index++;render();return}checked=true;const answer=(q.correct_answer||[]).map(String),mine=[...selected].map(String);const ok=sameSet(mine,answer);if(ok)score++;else wrongIds.push(q.id);card.querySelectorAll('.choice').forEach(b=>{const n=b.dataset.i;if(answer.includes(n))b.classList.add('correct');else if(selected.has(n))b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'정답입니다!':'정답: '+answer.join(', ')+'번';if(!ok){const exp=q.metadata?.source_explanation_ko;const e=document.getElementById('explanation');if(exp){e.innerHTML=`<strong>해설</strong>${esc(exp)}`;e.classList.add('show')}}const c=document.getElementById('check');c.disabled=false;c.textContent=index===questions.length-1?'결과 보기':'다음 문제'}
function renderResult(){bar.style.width='100%';const pct=Math.round(score/questions.length*100);card.innerHTML=`<div class="result"><div class="score">${score}/${questions.length}</div><h2>${pct>=80?'좋아요! 시험 준비가 잘 되고 있어요.':'틀린 문제를 한 번 더 보면 좋아요.'}</h2><p>정답률 ${pct}% · 틀린 문제 ${wrongIds.length}개</p><div class="actions"><button class="secondary" id="again">처음부터</button>${wrongIds.length?'<button class="primary" id="retry">틀린 문제 다시</button>':''}</div></div>`;document.getElementById('again').onclick=()=>{index=0;score=0;wrongIds=[];questions=shuffle(questions);render()};if(wrongIds.length)document.getElementById('retry').onclick=()=>{questions=shuffle(questions.filter(q=>wrongIds.includes(q.id)));index=0;score=0;wrongIds=[];render()}}
function openFlag(){flagReason='';flagNote.value='';reasonsEl.innerHTML=flagReasons.map(r=>`<button class="reason">${r}</button>`).join('');reasonsEl.querySelectorAll('.reason').forEach(b=>b.onclick=()=>{flagReason=b.textContent;reasonsEl.querySelectorAll('.reason').forEach(x=>x.classList.toggle('on',x===b))});overlay.classList.add('open')}
document.getElementById('cancelFlag').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};
document.getElementById('sendFlag').onclick=async()=>{if(!flagReason){toast('이유를 하나 골라 주세요');return}const q=questions[index];const payload={question_id:q.id,reason:flagReason,note:flagNote.value.trim()||null,selected_answer:[...selected],correct_answer_snapshot:q.correct_answer||[],status:'open',metadata:{source_label:q.student_source_label,source_question_number:q.source_question_number,question_type:q.question_type,page:location.pathname}};try{const r=await fetch(`${SUPABASE_URL}/rest/v1/test_prep_question_flags`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());overlay.classList.remove('open');toast('신고했습니다. 고마워요!')}catch(e){console.error(e);toast('신고 저장에 실패했습니다')}};
async function load(){try{const select='id,source_question_number,source_page,question_type,prompt_text,context,choices,correct_answer,targets,answer_mode,context_type,difficulty,student_source_label,content_status,metadata';const url=`${SUPABASE_URL}/rest/v1/test_prep_questions?select=${encodeURIComponent(select)}&student_usable=eq.true&section=eq.communication&order=source_question_number.asc`;const r=await fetch(url,{headers:H,cache:'no-store'});if(!r.ok)throw new Error(await r.text());questions=await r.json();questions=shuffle(questions);render()}catch(e){console.error(e);card.innerHTML='<div class="empty">문제를 불러오지 못했습니다.<br><small>'+esc(e.message)+'</small></div>'}}
load();
</script>
</body>
</html>
