<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Stats Lab</title>
<script src="/js/api-config.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#27383e;background:#f3f8f9}*{box-sizing:border-box}body{margin:0}.top{padding:18px 20px;background:#31434b;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.top small{opacity:.75}.wrap{max-width:980px;margin:auto;padding:18px}.status{margin:0 0 14px;color:#71858b;font-size:12px;font-weight:700}.teacher-picker{display:none;background:#fff;border:2px solid #c8e5e8;border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(56,85,92,.05)}.teacher-picker.show{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.teacher-picker label{font-size:12px;font-weight:900;color:#597079}.teacher-picker select{flex:1;min-width:220px;border:1.5px solid #cfe1e4;border-radius:11px;background:#fff;padding:10px 12px;font:800 13px/1.2 inherit;color:#31434b}.teacher-badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#fff0f5;color:#c64c76;font-size:10px;font-weight:900}.plan{background:#fff;border:2px solid #c8e5e8;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(56,85,92,.06);margin-bottom:18px}.head{padding:18px 20px;border-bottom:1px solid #e3edef}.head h2{margin:0;font-size:21px}.meta{margin-top:6px;color:#74878d;font-size:12px;font-weight:700}.snap{display:inline-flex;margin-top:8px;padding:4px 8px;border:1px solid #bfe3e8;border-radius:999px;background:#eef8fa;color:#278d98;font-size:10px;font-weight:900}.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid #e6eff1;background:#fbfdfd;padding:0 12px}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:13px 12px 11px;color:#7c8f95;font-weight:850;white-space:nowrap}.tabs button.active{color:#2d7680;border-bottom-color:#4fc0cb}.body{padding:16px;background:#fbfdfd}.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi,.section,.row{background:#fff;border:2px solid #d9e9eb;border-radius:15px}.kpi{padding:14px}.kpi b{display:block;font-size:24px}.kpi span{display:block;margin-top:6px;color:#667a80;font-size:12px;font-weight:800}.section{margin-top:12px;padding:14px}.section h3{margin:0 0 10px;font-size:16px}.rows{display:grid;gap:8px}.row{padding:11px 12px;display:grid;grid-template-columns:minmax(120px,1fr) auto auto;gap:12px;align-items:center}.row strong{font-size:13px}.row span{font-size:12px;font-weight:800}.row small{display:block;color:#8b9a9f;margin-top:3px}.good{color:#23957f}.mid{color:#d89425}.low{color:#d84f80}.days{display:grid;grid-template-columns:repeat(10,minmax(62px,1fr));gap:6px;overflow-x:auto}.day{padding:9px 6px;border:1px solid #e1ecee;border-radius:10px;text-align:center;background:#fff}.day b{display:block}.day small{color:#87969b}.empty{padding:28px;text-align:center;color:#84969b}.error{padding:20px;color:#c34d76;font-weight:800}@media(max-width:620px){.wrap{padding:12px}.top{padding:14px}.row{grid-template-columns:minmax(110px,1fr) auto}.row span:last-child{grid-column:2}.body{padding:12px}.teacher-picker.show{align-items:stretch}.teacher-picker select{width:100%}}
</style>
</head>
<body>
<header class="top"><div><h1>Student Stats Lab</h1><small>snapshot engine · student view / teacher preview</small></div><b>LAB S1.01</b></header>
<main class="wrap"><div class="teacher-picker" id="teacherPicker"><span class="teacher-badge">TEACHER VIEW</span><label for="studentSelect">학생 선택</label><select id="studentSelect"></select></div><p class="status" id="status">통계를 불러오는 중…</p><div id="plans"></div></main>
<script type="module">
import {loadSnapshotPlans,refreshSnapshotPlans} from '/students/shared/student-stats.js?v=student-snapshot-lab-2';
const TEACHER_RPC='https://fiieuiktlsivwfgyivai.supabase.co/rest/v1/rpc/test_prep_teacher_dashboard_fast_v1';
const API_KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0,pct=v=>Number.isFinite(Number(v))?Math.round(Number(v))+'%':'—';
const cls=v=>!Number.isFinite(Number(v))?'':Number(v)>=80?'good':Number(v)>=50?'mid':'low';
const fmtAge=iso=>{if(!iso)return'—';const ms=Date.now()-new Date(iso).getTime();return ms<60000?Math.max(0,Math.round(ms/1000))+'s':Math.round(ms/60000)+'m'};
const labels={vocabulary:'단어 학습',vocab_test:'어휘 문제',grammar:'문법',sentences:'본문',communication:'의사소통',reading:'독해',constructed_response:'서술형'};
let payload=null,teacherPayload=null,teacherMode=false,selectedStudentId='';
const token=()=>window.WillenaAPI?.getLocalAccessToken?.()||localStorage.getItem('sb_access_token')||'';
async function refreshToken(){try{const f=window.WillenaAPI?.fetch||fetch,r=await f('/.netlify/functions/supabase_auth?action=refresh&_='+Date.now(),{credentials:'include',cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.ok&&d?.success&&d.access_token){window.WillenaAPI?.setLocalTokens?.(d.access_token,d.refresh_token||'');return d.access_token}}catch{}return''}
async function tryTeacherSnapshot(){let access=token()||await refreshToken();if(!access)return null;const run=t=>fetch(TEACHER_RPC,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}',cache:'no-store',credentials:'omit'});let r=await run(access);if(r.status===401){access=await refreshToken();if(access)r=await run(access)}if(!r.ok)return null;return r.json().catch(()=>null)}
function teacherStudents(tp){const map=new Map();for(const groupItem of tp?.groups||[]){const group=groupItem.group||{};for(const member of groupItem.members||[]){const sid=String(member.student_id||member.student?.id||'');if(!sid)continue;const name=member.student?.korean_name||member.student?.name||member.student?.username||'Student';if(!map.has(sid))map.set(sid,{id:sid,name,plans:[]});map.get(sid).plans.push({...member,group})}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko'))}
function setupTeacherPicker(){const students=teacherStudents(teacherPayload),picker=$('#teacherPicker'),select=$('#studentSelect');picker.classList.add('show');if(!selectedStudentId||!students.some(s=>s.id===selectedStudentId))selectedStudentId=students[0]?.id||'';select.innerHTML=students.map(s=>`<option value="${esc(s.id)}" ${s.id===selectedStudentId?'selected':''}>${esc(s.name)}${s.plans.length>1?` · ${s.plans.length} plans`:''}</option>`).join('');select.onchange=()=>{selectedStudentId=select.value;renderTeacherStudent()}}
function renderTeacherStudent(){const student=teacherStudents(teacherPayload).find(s=>s.id===selectedStudentId);payload={plans:student?.plans||[]};render();$('#status').textContent=student?`${student.name} · ${student.plans.length}개 활성 계획 · teacher snapshot preview`:'활성 학생 snapshot이 없습니다.'}
function summary(p){const s=p.summary||{},r=p.review||{},a=p.activity||{};const skills=(p.skills||[]).filter(x=>n(x.recent_count)>0||n(x.completed)>0).map(x=>`<div class="row"><strong>${esc(labels[x.practice_type]||x.practice_type)}</strong><span class="${cls(x.recent_accuracy)}">${pct(x.recent_accuracy)}<small>최근 ${n(x.recent_count)}문항</small></span><span>${n(x.completed)} / ${n(x.total)}<small>완료</small></span></div>`).join('');return `<div class="kpis"><div class="kpi"><b class="${cls(s.recent150_accuracy)}">${pct(s.recent150_accuracy)}</b><span>최근 150</span></div><div class="kpi"><b>${n(r.total)}</b><span>현재 오답</span></div><div class="kpi"><b>${n(p.today?.questions)}</b><span>오늘 문제</span></div><div class="kpi"><b>${n(a.active_days)}</b><span>최근 10일 학습일</span></div></div><section class="section"><h3>영역별</h3><div class="rows">${skills||'<div class="empty">아직 학습 기록이 없습니다.</div>'}</div></section>`}
function lessons(p){const rows=(p.lessons||[]).filter(x=>n(x.completed)>0||n(x.recent_count)>0).map(x=>`<div class="row"><strong>${esc(x.lesson||'Lesson')}</strong><span class="${cls(x.recent_accuracy)}">${pct(x.recent_accuracy)}<small>최근 ${n(x.recent_count)}문항</small></span><span>${n(x.completed)} / ${n(x.total)}<small>완료</small></span></div>`).join('');return `<section class="section" style="margin-top:0"><h3>시작한 레슨</h3><div class="rows">${rows||'<div class="empty">아직 시작한 레슨이 없습니다.</div>'}</div></section>`}
function activity(p){const a=p.activity||{},days=(a.days||[]).map(d=>`<div class="day"><b>${n(d.attempts)}</b><small>${esc(String(d.date||'').slice(5))}</small></div>`).join('');return `<div class="kpis"><div class="kpi"><b>${n(a.total_attempts)}</b><span>최근 10일 시도</span></div><div class="kpi"><b>${n(a.active_days)}</b><span>학습한 날</span></div></div><section class="section"><h3>최근 10일</h3><div class="days">${days}</div></section>`}
function grammar(p){const rows=(p.grammar_patterns||[]).filter(x=>n(x.recent_count)>0).map(x=>`<div class="row"><strong>${esc(String(x.target||'').replaceAll('_',' '))}<small>${esc(x.lesson||'')}</small></strong><span class="${cls(x.recent_accuracy)}">${pct(x.recent_accuracy)}<small>최근 ${n(x.recent_count)}문항</small></span><span>${n(x.current_wrong)}<small>현재 오답</small></span></div>`).join('');return `<section class="section" style="margin-top:0"><h3>실제로 푼 문법 패턴</h3><div class="rows">${rows||'<div class="empty">아직 문법 패턴 기록이 없습니다.</div>'}</div></section>`}
function wrong(p){const r=p.review||{};return `<div class="kpis"><div class="kpi"><b>${n(r.active)}</b><span>지금 복습</span></div><div class="kpi"><b>${n(r.waiting)}</b><span>나중에 복습</span></div><div class="kpi"><b>${n(r.total)}</b><span>전체 오답</span></div><div class="kpi"><b>${n(r.cleared)}</b><span>해결 완료</span></div></div><section class="section"><div class="empty">snapshot 오답 상태입니다. 실제 복습 문제는 기존 공용 review 엔진을 그대로 사용합니다.</div></section>`}
function renderBody(el,p,tab){el.innerHTML=tab==='lessons'?lessons(p):tab==='activity'?activity(p):tab==='grammar'?grammar(p):tab==='wrong'?wrong(p):summary(p)}
function card(p){const g=p.group||{};return `<article class="plan" data-plan="${esc(p.plan_id)}"><div class="head"><h2>${esc(g.school||'내신')}</h2><div class="meta">${esc(g.term||'')}학기 · ${esc(g.book_label||g.book_key||'')}</div><span class="snap">snapshot ${fmtAge(p.snapshot_updated_at)} · ${esc(p.snapshot_version||'')}</span></div><nav class="tabs"><button data-tab="summary" class="active">요약</button><button data-tab="lessons">레슨</button><button data-tab="wrong">오답</button><button data-tab="activity">활동</button><button data-tab="grammar">문법</button></nav><div class="body" data-body></div></article>`}
function render(){const plans=Array.isArray(payload?.plans)?payload.plans:[];$('#plans').innerHTML=plans.map(card).join('')||'<div class="plan empty">현재 활성 내신 계획이 없습니다.</div>';document.querySelectorAll('.plan[data-plan]').forEach(el=>{const p=plans.find(x=>String(x.plan_id)===el.dataset.plan),body=el.querySelector('[data-body]');renderBody(body,p,'summary');el.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;el.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderBody(body,p,b.dataset.tab)}})}
async function load(force=false){try{$('#status').textContent=force?'새 snapshot 확인 중…':'snapshot을 불러오는 중…';const tp=await tryTeacherSnapshot();if(tp){teacherMode=true;teacherPayload=tp;setupTeacherPicker();renderTeacherStudent();return}teacherMode=false;$('#teacherPicker').classList.remove('show');payload=force?await refreshSnapshotPlans():await loadSnapshotPlans();render();$('#status').textContent=`${payload.plans?.length||0}개 계획 · 내 snapshot`;}catch(e){if(String(e.message).includes('AUTH_REQUIRED')){$('#status').textContent='로그인이 필요합니다.';$('#plans').innerHTML='<div class="plan error">먼저 로그인한 뒤 다시 열어주세요.</div>'}else{$('#status').textContent='불러오기 실패';$('#plans').innerHTML=`<div class="plan error">${esc(e.message||'Unknown error')}</div>`}}}
load();setInterval(()=>load(true),20000);
</script>
</body></html>
