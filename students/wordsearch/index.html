<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Word Games</title>
<link rel="icon" href="/Assets/Images/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./wordsearch.css?v=20260927-8">
<script src="/students/api-gateway.js?v=20260926-progress-summary-cf1"></script>
<script src="/js/api-config.js?v=20260926-reverted-auth1"></script>
<script src="/students/vocab-study/auth-guard.js?v=20260925-v0004"></script>
<script type="module" src="/students/components/student-header.js?v=20260927-vocabtheme1"></script>
<script type="module" src="/students/components/student-reward-celebration.js?v=20260926-v0005"></script>
</head>
<body>
<div class="app-shell">
  <student-header title="Word Games" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>

  <main class="page">
    <nav class="puzzle-tabs" aria-label="Puzzle type">
      <button class="puzzle-tab active" type="button" data-mode="wordsearch">Word Search</button>
      <button class="puzzle-tab" type="button" data-mode="crossword">Crossword</button>
    </nav>

    <section id="loadingCard" class="message-card">
      <div class="loader" aria-hidden="true"></div>
      <strong>Building your puzzle…</strong>
    </section>

    <section id="errorCard" class="message-card error" hidden>
      <strong>Couldn't build the puzzle.</strong>
      <span id="errorMessage"></span>
      <button id="retryBtn" type="button">Try again</button>
    </section>

    <section id="gameArea" hidden>
      <div class="puzzle-card">
        <div class="puzzle-head">
          <div class="puzzle-status">
            <span id="modeLabel" class="eyebrow">WORD SEARCH</span>
            <strong id="puzzleProgress">0 / 10 found</strong>
          </div>
          <span id="sessionPoints" class="session-points">+0 pts</span>
          <div class="head-buttons">
            <button id="cheatFinishBtn" class="cheat-btn" type="button" hidden>Finish Puzzle</button>
            <button id="newPuzzleBtn" class="new-btn" type="button">New Puzzle</button>
          </div>
        </div>

        <div class="clue-strip-wrap">
          <div class="clue-strip-head">
            <span id="listEyebrow" class="eyebrow">FIND THESE</span>
            <strong id="listTitle">Words</strong>
          </div>
          <div id="wordList" class="word-list horizontal-strip" aria-label="Puzzle clues"></div>
        </div>

        <div id="grid" class="word-grid" role="grid" aria-label="Word search puzzle"></div>
        <div id="crosswordGrid" class="crossword-grid" role="grid" aria-label="Crossword puzzle" hidden></div>
        <div id="dragHint" class="drag-hint">Drag in a straight line ↔ ↕ ↗ ↘</div>
      </div>
    </section>

    <dialog id="completeCard" class="win-modal" aria-labelledby="winTitle">
      <div class="win-burst" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="win-copy">
        <span class="complete-kicker">PUZZLE COMPLETE</span>
        <strong id="winTitle">You did it!</strong>
        <span id="completePoints">You found every word.</span>
      </div>
      <div id="rewardCelebration"></div>
      <button id="playAgainBtn" type="button">Play Again</button>
    </dialog>
  </main>
</div>
<script type="module" src="./wordsearch.js?v=20260927-8"></script>
</body>
</html>
