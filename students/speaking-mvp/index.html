<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Willena Speaking MVP</title>
<style>
:root{--cyan:#66d6df;--pink:#ff0a8a;--ink:#173f46;--muted:#6e858a;--line:#d8ecef;--soft:#e9fbfc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff7f8,#f7fbfc);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{width:min(720px,100%);margin:auto;padding:20px 14px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:1.35rem}.pill{border:2px solid var(--cyan);background:#fff;color:#e60076;border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:800}.progress{display:flex;gap:5px;margin-bottom:18px}.dot{height:7px;flex:1;border-radius:99px;background:#cfecef}.dot.on{background:var(--pink)}
.card{background:#fff;border:3px solid var(--cyan);border-radius:26px;padding:22px;box-shadow:0 10px 24px rgba(29,95,104,.08)}.step{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--soft);color:#25b8c4;font-size:.75rem;font-weight:800;margin-bottom:12px}.mode{font-size:.78rem;color:#e60076;font-weight:900;letter-spacing:.04em;margin-bottom:6px}.prompt{margin:0 0 10px;font-size:clamp(1.45rem,6vw,2.35rem);line-height:1.2}.help{color:var(--muted);line-height:1.5;margin:0 0 16px}.target{border:2px dashed var(--line);background:#fbfeff;border-radius:16px;padding:13px 14px}.target[hidden]{display:none}.target small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.target strong{font-size:1.05rem}.listenrow{display:none;justify-content:center;margin:18px 0 4px}.listenrow.show{display:flex}.listenbtn{border:2px solid var(--cyan);background:#fff;color:#e60076;border-radius:999px;padding:12px 18px;font-weight:900;font-size:1rem}.microw{display:flex;justify-content:center;margin:22px 0 14px}.mic{width:94px;height:94px;border:0;border-radius:50%;background:var(--pink);color:#fff;font-size:2.1rem;box-shadow:0 0 0 9px rgba(255,10,138,.09);touch-action:manipulation}.mic.listening{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.04);box-shadow:0 0 0 18px rgba(255,10,138,.15)}}.status{text-align:center;color:var(--muted);font-weight:800;min-height:24px}.heard,.feedback{display:none;margin-top:14px;border-radius:16px;padding:14px}.heard{background:#f5fafb;border:2px solid var(--line)}.heard.show,.feedback.show{display:block}.heard small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.heard strong{font-size:1.05rem}.feedback.good{background:#edfff6;border:2px solid #a7ebca}.feedback.retry{background:#fff7fb;border:2px solid #ffc8e4}.feedback.neutral{background:#f4fbfc;border:2px solid #bfe8ec}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border-radius:14px;padding:13px 14px;font:800 1rem inherit}.retry{border:2px solid var(--cyan);background:#fff;color:#e60076}.next{border:2px solid var(--pink);background:var(--pink);color:#fff}.btn[hidden]{display:none}.debug{margin-top:14px;text-align:center;color:var(--muted);font-size:.75rem}.json{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.json summary{cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:800}.json pre{white-space:pre-wrap;word-break:break-word;background:#f5fafb;border:1px solid var(--line);padding:12px;border-radius:12px;font-size:.7rem;line-height:1.45;overflow:auto}@media(max-width:520px){.card{padding:18px 16px}.mic{width:84px;height:84px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Speaking Test</h1><span class="pill">Browser STT</span></div>
<div id="progress" class="progress"></div>
<section class="card">
<span class="step" id="step"></span><div class="mode" id="mode"></div><h2 class="prompt" id="prompt"></h2><p class="help" id="help"></p>
<div class="target" id="target"><small id="targetLabel">Read this</small><strong></strong></div>
<div id="listenrow" class="listenrow"><button id="listen" class="listenbtn" type="button">🔊 Listen</button></div>
<div class="microw"><button id="mic" class="mic" type="button">🎤</button></div><div id="status" class="status">Tap to speak</div>
<div id="heard" class="heard"><small>Browser heard</small><strong id="heardText"></strong></div><div id="feedback" class="feedback"></div>
<div class="actions"><button id="retry" class="btn retry" type="button" hidden>Try again</button><button id="next" class="btn next" type="button" hidden>Next</button></div><div id="debug" class="debug"></div>
<details class="json"><summary>Show scoring JSON</summary><pre id="json"></pre></details>
</section></div>
<script>
(function(){'use strict';
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim()}
function words(s){return norm(s).split(' ').filter(Boolean)}
function similarity(a,b){a=words(a);b=words(b);var hits=0,used={};a.forEach(function(w){for(var j=0;j<b.length;j++){if(!used[j]&&w===b[j]){used[j]=1;hits++;break}}});return hits/Math.max(a.length,b.length,1)}
function hasAll(n,list){return list.every(function(group){return group.some(function(v){return new RegExp('\\b'+v+'\\b').test(n)})})}
function score(text,cfg){var n=norm(text);if(cfg.strategy==='tolerant_target')return similarity(text,cfg.target)>=cfg.threshold;if(cfg.strategy==='required_concepts')return hasAll(n,cfg.concepts);if(cfg.strategy==='past_transform')return hasAll(n,[['i'],['played'],['soccer','football'],['yesterday']]);if(cfg.strategy==='future_transform')return hasAll(n,[['she'],['will'],['visit'],['grandma','grandmother'],['sunday']]);return false}
var tasks=[
{mode:'1 · READ AND SAY',prompt:'Read the sentence aloud.',help:'Read it naturally, then tap the microphone.',target:'My brother bought a new bicycle last Saturday.',showTarget:true,targetLabel:'Read this',scoring:{strategy:'tolerant_target',target:'My brother bought a new bicycle last Saturday.',threshold:.76}},
{mode:'2 · LISTEN AND REPEAT',prompt:'Listen, then repeat what you hear.',help:'Tap Listen first. The sentence is hidden.',tts:'I went to the zoo yesterday.',scoring:{strategy:'tolerant_target',target:'I went to the zoo yesterday.',threshold:.76}},
{mode:'3 · CHANGE TO PAST TENSE',prompt:'I play soccer every day.',help:'Change the sentence to the past. Use “yesterday”.',scoring:{strategy:'past_transform',source_tense:'present',target_tense:'past',required:['I','played','soccer','yesterday']}},
{mode:'4 · OBVIOUS ANSWER',prompt:'What color is the sky on a clear day?',help:'Answer with a short complete sentence.',scoring:{strategy:'required_concepts',concepts:[['sky'],['blue']]}},
{mode:'5 · KOREAN → ENGLISH',prompt:'어제 나는 동물원에 갔어요.',help:'Say the English translation.',scoring:{strategy:'required_concepts',concepts:[['i'],['went'],['zoo'],['yesterday']]}},
{mode:'6 · CHANGE THE TENSE',prompt:'She visits her grandma on Sunday.',help:'Change the sentence to the future using “will”.',scoring:{strategy:'future_transform',source_tense:'present',target_tense:'future',required:['she','will','visit','grandma','Sunday']}}
];
var i=0,rec=null,listening=false;var mic=document.getElementById('mic'),status=document.getElementById('status'),heard=document.getElementById('heard'),heardText=document.getElementById('heardText'),feedback=document.getElementById('feedback'),retry=document.getElementById('retry'),next=document.getElementById('next'),debug=document.getElementById('debug'),mode=document.getElementById('mode'),prompt=document.getElementById('prompt'),help=document.getElementById('help'),targetBox=document.getElementById('target'),target=document.querySelector('#target strong'),targetLabel=document.getElementById('targetLabel'),step=document.getElementById('step'),progress=document.getElementById('progress'),json=document.getElementById('json'),listenrow=document.getElementById('listenrow'),listen=document.getElementById('listen');
progress.innerHTML=tasks.map(function(){return'<i class="dot"></i>'}).join('');var dots=Array.from(progress.children);
function reset(){heard.classList.remove('show');feedback.className='feedback';feedback.textContent='';retry.hidden=true;next.hidden=true;status.textContent='Tap to speak';debug.textContent='';mic.disabled=!SR}
function render(){var t=tasks[i];step.textContent=(i+1)+' of '+tasks.length;mode.textContent=t.mode;prompt.textContent=t.prompt;help.textContent=t.help;target.textContent=t.target||'';targetLabel.textContent=t.targetLabel||'Read this';targetBox.hidden=!t.showTarget;listenrow.classList.toggle('show',!!t.tts);json.textContent=JSON.stringify(t.scoring,null,2);dots.forEach(function(d,n){d.classList.toggle('on',n<=i)});next.textContent=i===tasks.length-1?'Finish':'Next';reset()}
function show(kind,text){feedback.className='feedback show '+kind;feedback.textContent=text;retry.hidden=false;next.hidden=false}function neutral(text){show('neutral',text);status.textContent='Tap to speak'}
function speakPrompt(){var t=tasks[i];if(!t.tts||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.tts);u.lang='en-US';u.rate=.86;window.speechSynthesis.speak(u)}
function start(){if(!SR||listening)return;rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=3;listening=true;mic.classList.add('listening');status.textContent='Listening…';heard.classList.remove('show');feedback.className='feedback';retry.hidden=true;next.hidden=true;rec.onresult=function(e){var alts=e.results&&e.results[0];if(!alts||!alts.length){neutral('I didn’t catch that. Try again.');return}var candidates=[];for(var a=0;a<alts.length;a++)candidates.push({text:alts[a].transcript||'',confidence:typeof alts[a].confidence==='number'?alts[a].confidence:null});var winner=candidates.find(function(c){return score(c.text,tasks[i].scoring)})||candidates[0];heardText.textContent=winner.text;heard.classList.add('show');debug.textContent=(winner.confidence!=null?'Browser confidence: '+Math.round(winner.confidence*100)+'% · ':'')+candidates.length+' STT alternative'+(candidates.length===1?'':'s');if(score(winner.text,tasks[i].scoring))show('good','✓ Good answer');else if(winner.confidence!=null&&winner.confidence<.35)neutral('I’m not sure I heard that correctly. Try again.');else show('retry','Not quite — try that once more.')};rec.onerror=function(e){neutral('Speech recognition had a problem. Try again.');debug.textContent='STT: '+(e&&e.error||'error')};rec.onend=function(){listening=false;mic.classList.remove('listening');if(status.textContent==='Listening…')status.textContent='Tap to speak'};try{rec.start()}catch(e){listening=false;mic.classList.remove('listening');neutral('Couldn’t start the microphone. Try again.')}}
listen.addEventListener('click',speakPrompt);mic.addEventListener('click',start);retry.addEventListener('click',function(){reset();start()});next.addEventListener('click',function(){if(i<tasks.length-1){i++;render()}else{feedback.className='feedback show good';feedback.textContent='✓ Finished — six speaking types tested.';next.hidden=true;retry.hidden=true;mic.disabled=true;status.textContent='Done'}});render();
})();
</script>
</body>
</html>
