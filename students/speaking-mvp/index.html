<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Willena Speaking MVP</title>
<style>
:root{--cyan:#66d6df;--cyan2:#25b8c4;--pink:#ff0a8a;--pink2:#e60076;--ink:#173f46;--muted:#6e858a;--line:#d8ecef;--soft:#e9fbfc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff7f8,#f7fbfc);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{width:min(720px,100%);margin:auto;padding:20px 14px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:1.35rem}.pill{border:2px solid var(--cyan);background:#fff;color:var(--pink2);border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:800}
.progress{display:flex;gap:5px;margin-bottom:18px}.dot{height:7px;flex:1;border-radius:99px;background:#cfecef}.dot.on{background:var(--pink)}
.card{background:#fff;border:3px solid var(--cyan);border-radius:26px;padding:22px;box-shadow:0 10px 24px rgba(29,95,104,.08)}.step{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--cyan2);font-size:.75rem;font-weight:800;margin-bottom:12px}.mode{font-size:.78rem;color:var(--pink2);font-weight:900;letter-spacing:.04em;margin-bottom:6px}.prompt{margin:0 0 10px;font-size:clamp(1.45rem,6vw,2.35rem);line-height:1.2}.help{color:var(--muted);line-height:1.5;margin:0 0 16px}.visual{display:none;text-align:center;font-size:4rem;margin:4px 0 14px}.visual.show{display:block}.target{border:2px dashed var(--line);background:#fbfeff;border-radius:16px;padding:13px 14px}.target[hidden]{display:none}.target small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.target strong{font-size:1rem}.microw{display:flex;justify-content:center;margin:22px 0 14px}.mic{width:94px;height:94px;border:0;border-radius:50%;background:var(--pink);color:#fff;font-size:2.1rem;box-shadow:0 0 0 9px rgba(255,10,138,.09);touch-action:manipulation}.mic.listening{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.04);box-shadow:0 0 0 18px rgba(255,10,138,.15)}}.mic:disabled{opacity:.4}.status{text-align:center;color:var(--muted);font-weight:800;min-height:24px}.heard,.feedback{display:none;margin-top:14px;border-radius:16px;padding:14px}.heard{background:#f5fafb;border:2px solid var(--line)}.heard.show,.feedback.show{display:block}.heard small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.heard strong{font-size:1.05rem}.feedback.good{background:#edfff6;border:2px solid #a7ebca}.feedback.retry{background:#fff7fb;border:2px solid #ffc8e4}.feedback.neutral{background:#f4fbfc;border:2px solid #bfe8ec}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border-radius:14px;padding:13px 14px;font:800 1rem inherit}.retry{border:2px solid var(--cyan);background:#fff;color:var(--pink2)}.next{border:2px solid var(--pink);background:var(--pink);color:#fff}.btn[hidden]{display:none}.debug{margin-top:14px;text-align:center;color:var(--muted);font-size:.75rem}.unsupported{display:none;margin-bottom:16px;padding:14px;border:2px solid #e6b8b8;background:#fff6f6;border-radius:16px}.unsupported.show{display:block}.json{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.json summary{cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:800}.json pre{white-space:pre-wrap;word-break:break-word;background:#f5fafb;border:1px solid var(--line);padding:12px;border-radius:12px;font-size:.7rem;line-height:1.45;overflow:auto}
@media(max-width:520px){.card{padding:18px 16px}.mic{width:84px;height:84px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Speaking Test</h1><span class="pill">Browser STT · JSON Scoring</span></div>
  <div id="unsupported" class="unsupported">Speech recognition is not available in this browser. Try Chrome on Android or desktop Chrome.</div>
  <div id="progress" class="progress"></div>
  <section class="card">
    <span class="step" id="step"></span>
    <div class="mode" id="mode"></div>
    <h2 class="prompt" id="prompt"></h2>
    <p class="help" id="help"></p>
    <div id="visual" class="visual"></div>
    <div class="target" id="target"><small id="targetLabel">Target</small><strong></strong></div>
    <div class="microw"><button id="mic" class="mic" type="button" aria-label="Start speaking">🎤</button></div>
    <div id="status" class="status">Tap to speak</div>
    <div id="heard" class="heard"><small>Browser heard</small><strong id="heardText"></strong></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions"><button id="retry" class="btn retry" type="button" hidden>Try again</button><button id="next" class="btn next" type="button" hidden>Next</button></div>
    <div id="debug" class="debug"></div>
    <details class="json"><summary>Show scoring JSON</summary><pre id="json"></pre></details>
  </section>
</div>
<script>
(function(){
'use strict';
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();}
function words(s){return norm(s).split(' ').filter(Boolean);}
function similarity(a,b){a=words(a);b=words(b);var hits=0,used={};a.forEach(function(w){for(var j=0;j<b.length;j++){if(!used[j]&&(w===b[j]||(w==='wanna'&&b[j]==='want'))){used[j]=1;hits++;break;}}});return hits/Math.max(a.length,b.length,1);}
function matchesConcept(n,c){return (c.any_of||[]).some(function(v){return new RegExp('\\b'+String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n);});}
function isBadSlotStart(w){return ['to','because','and','but','if','when','where','there','very','really','go','went','is','are','was','were','do','does','did','can','will','would','should'].indexOf(w)>=0;}
function slotOkay(text,slot){var w=words(text);if(slot.min_words&&w.length<slot.min_words)return false;if(slot.max_words&&w.length>slot.max_words)return false;if(slot.type==='noun_phrase'){if(!w.length||isBadSlotStart(w[0]))return false;return true;}if(slot.type==='verb_ing')return w.some(function(x){return /ing$/.test(x);});if(slot.type==='duration')return /\b(for\s+)?\d+\s+(day|days|week|weeks|month|months|year|years)\b/.test(norm(text));return w.length>0;}
function tenseOkay(n,tense){if(tense==='past'){if(/\b(went|played|watched|visited|ate|saw|had|did|made|stayed|studied|read|bought|met|walked|helped|cleaned|cooked|drank|swam|ran|slept|flew|drove|built|wrote|drew|found|lost|broke|won)\b/.test(n))return true;if(/\b[a-z]+ed\b/.test(n))return true;if(/\b(was|were)\b/.test(n)&&! /\b(was|were)\s+(eat|go|play|watch|visit|see|have|do|make|buy|meet|run|drink|swim)\b/.test(n))return true;return false;}if(tense==='present_progressive')return /\b(am|is|are)\s+[a-z]+ing\b/.test(n);return true;}
function scoreTranscript(text,cfg){var n=norm(text),strategy=cfg.strategy||'';
 if(strategy==='tolerant_target')return similarity(text,cfg.target)>=Number(cfg.threshold||.76);
 if(strategy==='required_concepts'){var concepts=(cfg.concepts||[]).every(function(c){return matchesConcept(n,c);});return concepts&&tenseOkay(n,cfg.grammar&&cfg.grammar.tense);}
 if(strategy==='required_pattern'){var prefix=norm(cfg.required_prefix||'');if(prefix&&n.indexOf(prefix)!==0)return false;var rest=n.slice(prefix.length).trim().replace(/^(a|an|the)\s+/,'');return slotOkay(rest,cfg.slot||{type:'noun_phrase',min_words:1});}
 if(strategy==='pattern_slots'){var chunks=(cfg.required_chunks||[]).every(function(ch){return n.indexOf(norm(ch))>=0;});if(!chunks)return false;var rest=n; (cfg.required_chunks||[]).forEach(function(ch){rest=rest.replace(norm(ch),' ');});rest=norm(rest);return (cfg.slots||[]).every(function(slot){return slotOkay(rest,slot);});}
 if(strategy==='tense_response')return words(n).length>=Number(cfg.min_words||3)&&tenseOkay(n,cfg.tense||'past');
 if(strategy==='dialogue_response'){var starts=(cfg.required_starts||[]).some(function(s){return n.indexOf(norm(s))===0;});return starts&&words(n).length>=Number(cfg.min_words||4);}
 return false;
}
var tasks=[
 {mode:'1 · REPEAT',prompt:'Say: “I went to the zoo yesterday.”',help:'Repeat the sentence. Small STT differences are allowed.',target:'I went to the zoo yesterday.',showTarget:true,scoring:{strategy:'tolerant_target',target:'I went to the zoo yesterday.',threshold:.76}},
 {mode:'2 · TRANSLATE',prompt:'어제 나는 동물원에 갔어요.',help:'Translate the Korean sentence into English.',scoring:{strategy:'required_concepts',concepts:[{any_of:['i']},{any_of:['went']},{any_of:['zoo']},{any_of:['yesterday']}],grammar:{tense:'past'}}},
 {mode:'3 · PATTERN RESPONSE',prompt:'What do you want to be?',help:'Use “I want to be…” and complete the pattern naturally.',scoring:{strategy:'required_pattern',required_prefix:'I want to be',slot:{type:'noun_phrase',min_words:1,max_words:5},allow_creative_content:true}},
 {mode:'4 · PICTURE RESPONSE',prompt:'What is he doing?',help:'Look at the picture and answer in a full sentence.',visual:'👦 ⚽',scoring:{strategy:'required_concepts',concepts:[{any_of:['he']},{any_of:['playing']},{any_of:['soccer','football']}],grammar:{tense:'present_progressive'}}},
 {mode:'5 · TRANSFORMATION',prompt:'Change it to the past: “I play soccer every day.”',help:'Say the sentence in the past tense. Use “yesterday”.',scoring:{strategy:'required_concepts',concepts:[{any_of:['i']},{any_of:['played']},{any_of:['soccer','football']},{any_of:['yesterday']}],grammar:{tense:'past'}}},
 {mode:'6 · QUESTION RESPONSE',prompt:'What did you do last weekend?',help:'Give any grammatical past-tense answer. Creative answers are welcome.',scoring:{strategy:'tense_response',tense:'past',min_words:3,allow_creative_content:true}},
 {mode:'7 · READ ALOUD',prompt:'Read this sentence aloud.',help:'Read the sentence naturally.',target:'My brother bought a new bicycle last Saturday.',showTarget:true,scoring:{strategy:'tolerant_target',target:'My brother bought a new bicycle last Saturday.',threshold:.76}},
 {mode:'8 · DIALOGUE LINE',prompt:'A: What would you like to drink?',help:'Say a natural reply.',scoring:{strategy:'dialogue_response',required_starts:["I'd like","I would like"],min_words:4,allow_creative_content:true}}
];
var i=0,rec=null,listening=false;
var mic=document.getElementById('mic'),status=document.getElementById('status'),heard=document.getElementById('heard'),heardText=document.getElementById('heardText'),feedback=document.getElementById('feedback'),retry=document.getElementById('retry'),next=document.getElementById('next'),debug=document.getElementById('debug');
var mode=document.getElementById('mode'),prompt=document.getElementById('prompt'),help=document.getElementById('help'),targetBox=document.getElementById('target'),target=document.querySelector('#target strong'),step=document.getElementById('step'),progress=document.getElementById('progress'),visual=document.getElementById('visual'),json=document.getElementById('json');
progress.innerHTML=tasks.map(function(){return '<i class="dot"></i>';}).join('');var dots=Array.from(progress.children);
function reset(){heard.classList.remove('show');feedback.className='feedback';feedback.textContent='';retry.hidden=true;next.hidden=true;status.textContent='Tap to speak';debug.textContent='';mic.disabled=!SR;}
function render(){var t=tasks[i];step.textContent=(i+1)+' of '+tasks.length;mode.textContent=t.mode;prompt.textContent=t.prompt;help.textContent=t.help;target.textContent=t.target||'';targetBox.hidden=!t.showTarget;visual.textContent=t.visual||'';visual.classList.toggle('show',!!t.visual);json.textContent=JSON.stringify(t.scoring,null,2);dots.forEach(function(d,n){d.classList.toggle('on',n<=i);});next.textContent=i===tasks.length-1?'Finish':'Next';reset();}
function show(kind,text){feedback.className='feedback show '+kind;feedback.textContent=text;retry.hidden=false;next.hidden=false;}
function neutral(text){show('neutral',text);status.textContent='Tap to speak';}
function start(){if(!SR||listening)return;rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=3;listening=true;mic.classList.add('listening');status.textContent='Listening…';heard.classList.remove('show');feedback.className='feedback';retry.hidden=true;next.hidden=true;
 rec.onresult=function(e){var alts=e.results&&e.results[0];if(!alts||!alts.length){neutral('I didn’t catch that. Try again.');return;}var candidates=[];for(var a=0;a<alts.length;a++)candidates.push({text:alts[a].transcript||'',confidence:typeof alts[a].confidence==='number'?alts[a].confidence:null});var winner=candidates.find(function(c){return scoreTranscript(c.text,tasks[i].scoring);})||candidates[0];heardText.textContent=winner.text;heard.classList.add('show');debug.textContent=winner.confidence!=null?'Browser confidence: '+Math.round(winner.confidence*100)+'% · '+candidates.length+' STT alternative'+(candidates.length===1?'':'s'):candidates.length+' STT alternative'+(candidates.length===1?'':'s');if(scoreTranscript(winner.text,tasks[i].scoring))show('good','✓ Good answer');else if(winner.confidence!=null&&winner.confidence<.35)neutral('I’m not sure I heard that correctly. Try again.');else show('retry','Not quite — try that once more.');};
 rec.onerror=function(e){var err=e&&e.error||'recognition error';neutral('Speech recognition had a problem. Try again.');debug.textContent='STT: '+err;};
 rec.onend=function(){listening=false;mic.classList.remove('listening');if(status.textContent==='Listening…')status.textContent='Tap to speak';};
 try{rec.start();}catch(e){listening=false;mic.classList.remove('listening');neutral('Couldn’t start the microphone. Try again.');}
}
mic.addEventListener('click',start);retry.addEventListener('click',function(){reset();start();});next.addEventListener('click',function(){if(i<tasks.length-1){i++;render();}else{feedback.className='feedback show good';feedback.textContent='✓ Finished — JSON scoring engine tested.';next.hidden=true;retry.hidden=true;mic.disabled=true;status.textContent='Done';}});
if(!SR){document.getElementById('unsupported').classList.add('show');mic.disabled=true;status.textContent='Speech recognition unavailable';}
render();
})();
</script>
</body>
</html>
