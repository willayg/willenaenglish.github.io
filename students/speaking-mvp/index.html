<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Willena Speaking MVP</title>
<style>
:root{--cyan:#66d6df;--cyan2:#25b8c4;--pink:#ff0a8a;--pink2:#e60076;--ink:#173f46;--muted:#6e858a;--line:#d8ecef;--soft:#e9fbfc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff7f8,#f7fbfc);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{width:min(700px,100%);margin:auto;padding:20px 14px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:1.35rem}.pill{border:2px solid var(--cyan);background:#fff;color:var(--pink2);border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:800}
.progress{display:flex;gap:7px;margin-bottom:18px}.dot{height:7px;flex:1;border-radius:99px;background:#cfecef}.dot.on{background:var(--pink)}
.card{background:#fff;border:3px solid var(--cyan);border-radius:26px;padding:22px;box-shadow:0 10px 24px rgba(29,95,104,.08)}.step{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--cyan2);font-size:.75rem;font-weight:800;margin-bottom:12px}.mode{font-size:.78rem;color:var(--pink2);font-weight:900;letter-spacing:.04em;margin-bottom:6px}.prompt{margin:0 0 10px;font-size:clamp(1.45rem,6vw,2.35rem);line-height:1.2}.help{color:var(--muted);line-height:1.5;margin:0 0 16px}.target{border:2px dashed var(--line);background:#fbfeff;border-radius:16px;padding:13px 14px}.target small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.target strong{font-size:1rem}.microw{display:flex;justify-content:center;margin:22px 0 14px}.mic{width:94px;height:94px;border:0;border-radius:50%;background:var(--pink);color:#fff;font-size:2.1rem;box-shadow:0 0 0 9px rgba(255,10,138,.09);touch-action:manipulation}.mic.listening{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.04);box-shadow:0 0 0 18px rgba(255,10,138,.15)}}.mic:disabled{opacity:.4}.status{text-align:center;color:var(--muted);font-weight:800;min-height:24px}.heard,.feedback{display:none;margin-top:14px;border-radius:16px;padding:14px}.heard{background:#f5fafb;border:2px solid var(--line)}.heard.show,.feedback.show{display:block}.heard small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.heard strong{font-size:1.05rem}.feedback.good{background:#edfff6;border:2px solid #a7ebca}.feedback.retry{background:#fff7fb;border:2px solid #ffc8e4}.feedback.neutral{background:#f4fbfc;border:2px solid #bfe8ec}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border-radius:14px;padding:13px 14px;font:800 1rem inherit}.retry{border:2px solid var(--cyan);background:#fff;color:var(--pink2)}.next{border:2px solid var(--pink);background:var(--pink);color:#fff}.btn[hidden]{display:none}.debug{margin-top:14px;text-align:center;color:var(--muted);font-size:.75rem}.unsupported{display:none;margin-bottom:16px;padding:14px;border:2px solid #e6b8b8;background:#fff6f6;border-radius:16px}.unsupported.show{display:block}@media(max-width:520px){.card{padding:18px 16px}.mic{width:84px;height:84px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Speaking Test</h1><span class="pill">Browser STT</span></div>
  <div id="unsupported" class="unsupported">Speech recognition is not available in this browser. Try Chrome on Android or desktop Chrome.</div>
  <div class="progress"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div>
  <section class="card">
    <span class="step" id="step">1 of 3</span>
    <div class="mode" id="mode">REPEAT</div>
    <h2 class="prompt" id="prompt">Say: “I went to the zoo.”</h2>
    <p class="help" id="help">Tap the microphone and repeat the sentence.</p>
    <div class="target" id="target"><small>Target / Example</small><strong>I went to the zoo.</strong></div>
    <div class="microw"><button id="mic" class="mic" type="button" aria-label="Start speaking">🎤</button></div>
    <div id="status" class="status">Tap to speak</div>
    <div id="heard" class="heard"><small>Browser heard</small><strong id="heardText"></strong></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions"><button id="retry" class="btn retry" type="button" hidden>Try again</button><button id="next" class="btn next" type="button" hidden>Next</button></div>
    <div id="debug" class="debug"></div>
  </section>
</div>
<script>
(function(){
'use strict';
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var tasks=[
 {mode:'REPEAT',prompt:'Say: “I went to the zoo.”',help:'Tap the microphone and repeat the sentence.',target:'I went to the zoo.',score:function(t){return similarity(t,'I went to the zoo')>=.72;}},
 {mode:'CONTROLLED RESPONSE',prompt:'What do you want to be?',help:'Answer with “I want to be…” and choose any job.',target:'Example: I want to be a scientist.',score:function(t){var n=norm(t);return /^i want to be\b/.test(n)&&n.split(' ').length>=5;}},
 {mode:'OPEN RESPONSE',prompt:'What did you do last weekend?',help:'Give a short answer in English. There is more than one correct answer.',target:'Example: I played soccer with my friends.',score:function(t){var n=norm(t),w=n.split(' ').filter(Boolean);var past=/\b(went|played|watched|visited|ate|saw|had|did|made|stayed|studied|read|bought|met|was|were|walked|helped|cleaned|cooked|drank|swam|ran)\b/.test(n)||/\b\w+ed\b/.test(n);return w.length>=3&&past;}}
];
var i=0,rec=null,listening=false;
var mic=document.getElementById('mic'),status=document.getElementById('status'),heard=document.getElementById('heard'),heardText=document.getElementById('heardText'),feedback=document.getElementById('feedback'),retry=document.getElementById('retry'),next=document.getElementById('next'),debug=document.getElementById('debug');
var mode=document.getElementById('mode'),prompt=document.getElementById('prompt'),help=document.getElementById('help'),target=document.querySelector('#target strong'),step=document.getElementById('step'),dots=Array.from(document.querySelectorAll('.dot'));
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();}
function similarity(a,b){a=norm(a).split(' ');b=norm(b).split(' ');var hits=0,used={};a.forEach(function(w){for(var j=0;j<b.length;j++){if(!used[j]&&(w===b[j]||(w==='wanna'&&b[j]==='want'))){used[j]=1;hits++;break;}}});return hits/Math.max(a.length,b.length,1);}
function reset(){heard.classList.remove('show');feedback.className='feedback';feedback.textContent='';retry.hidden=true;next.hidden=true;status.textContent='Tap to speak';debug.textContent='';mic.disabled=!SR;}
function render(){var t=tasks[i];step.textContent=(i+1)+' of '+tasks.length;mode.textContent=t.mode;prompt.textContent=t.prompt;help.textContent=t.help;target.textContent=t.target;dots.forEach(function(d,n){d.classList.toggle('on',n<=i);});next.textContent=i===tasks.length-1?'Finish':'Next';reset();}
function show(kind,text){feedback.className='feedback show '+kind;feedback.textContent=text;retry.hidden=false;next.hidden=false;}
function neutral(text){show('neutral',text);status.textContent='Tap to speak';}
function start(){if(!SR||listening)return;rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=3;listening=true;mic.classList.add('listening');status.textContent='Listening…';heard.classList.remove('show');feedback.className='feedback';retry.hidden=true;next.hidden=true;
 rec.onresult=function(e){var alts=e.results&&e.results[0];if(!alts||!alts.length){neutral('I didn’t catch that. Try again.');return;}var best=alts[0],text=best.transcript||'',confidence=typeof best.confidence==='number'?best.confidence:null;heardText.textContent=text;heard.classList.add('show');debug.textContent=confidence!=null?'Browser confidence: '+Math.round(confidence*100)+'%':'';if(tasks[i].score(text))show('good','✓ Good answer');else if(confidence!=null&&confidence<.35)neutral('I’m not sure I heard that correctly. Try again.');else show('retry','Try that once more.');};
 rec.onerror=function(e){var err=e&&e.error||'recognition error';neutral('Speech recognition had a problem. Try again.');debug.textContent='STT: '+err;};
 rec.onend=function(){listening=false;mic.classList.remove('listening');if(status.textContent==='Listening…')status.textContent='Tap to speak';};
 try{rec.start();}catch(e){listening=false;mic.classList.remove('listening');neutral('Couldn’t start the microphone. Try again.');}
}
mic.addEventListener('click',start);retry.addEventListener('click',function(){reset();start();});next.addEventListener('click',function(){if(i<tasks.length-1){i++;render();}else{feedback.className='feedback show good';feedback.textContent='✓ Finished — all three speaking types tested.';next.hidden=true;retry.hidden=true;mic.disabled=true;status.textContent='Done';}});
if(!SR){document.getElementById('unsupported').classList.add('show');mic.disabled=true;status.textContent='Speech recognition unavailable';}
render();
})();
</script>
</body>
</html>
