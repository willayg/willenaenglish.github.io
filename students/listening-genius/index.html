<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Listening Genius | Willena</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/students/api-gateway.js"></script>
<script src="/js/api-config.js"></script>
<script type="module" src="/students/components/student-header.js?v=20261105-pass2-qr2"></script>
<style>
:root{font-family:Poppins,"Noto Sans KR",sans-serif;color:#302b41}
*{box-sizing:border-box}
body{margin:0;background:#f7fafb;min-height:100vh}
student-header{display:block}
main{width:min(100%,790px);margin:0 auto;padding:22px 16px 48px}
h1{font-size:23px;letter-spacing:-.035em;margin:0 0 20px;font-weight:800}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.book{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#293b48;background:white;border:1.5px solid #e1eaee;box-shadow:0 3px 13px #243d5010;border-radius:17px;padding:21px 18px;font-size:17px;font-weight:800;min-height:94px}
.book::after{content:"";display:block;width:9px;height:9px;flex:0 0 auto;border-top:2px solid #36acb9;border-right:2px solid #36acb9;transform:rotate(45deg)}
.book:hover{border-color:#48bcca;background:#f8feff}
.status{font-size:14px;color:#667783;line-height:1.7}
.status.error{color:#b83e68}
a:focus-visible{outline:3px solid #22bfc9;outline-offset:3px}
@media(max-width:540px){main{padding:20px 16px 40px}.books{grid-template-columns:1fr;gap:12px}.book{min-height:77px;padding:17px 19px;font-size:18px}}
</style>
</head>
<body>
<student-header title="Listening Genius" show-id="false" show-home="true" home-href="/students/dashboard" home-label="Home" show-points="true" show-logout="true"></student-header>
<main>
<h1>내 교재</h1>
<div id="status" class="status" role="status">교재를 불러오는 중…</div>
<div id="books" class="books"></div>
</main>
<script type="module" src="./app.js?v=20261112c"></script>
</body>
</html>
