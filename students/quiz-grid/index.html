<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willena Quiz Grid</title>
<style>
:root{--ink:#17223b;--muted:#6b7280;--bg:#f7f8fc;--card:#fff;--line:#e5e7eb;--blue:#2458d6;--blue2:#173d9b;--gold:#ffd866;--green:#15966a;--red:#d94b5b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:0 auto;padding:22px}.topbar{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px}.brand-logo{width:128px;max-width:34vw;height:auto;display:block}.brand-copy{min-width:0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a8192}.title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.control label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.06em}select,.new-board,.add-team,.game-view-btn{height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800;color:var(--ink)}.new-board{background:var(--ink);color:#fff;border-color:var(--ink);padding:0 18px}.add-team{color:var(--blue);border-color:#cfd8f5}.game-view-btn{background:#fff;color:var(--blue);border-color:#cfd8f5}.score-section{margin:12px 0 18px}.score-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.team{position:relative;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 68px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;box-shadow:0 6px 18px rgba(40,50,80,.05)}.team.active{border-color:var(--blue);background:#f8faff}.team-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-size:28px;font-weight:950;flex:none}.rename-team,.remove-team{position:absolute;top:7px;width:27px;height:27px;border-radius:50%;border:0;background:#f0f2f6;color:#6f7685;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}.rename-team{right:38px;font-size:13px}.remove-team{right:7px}.board-wrap{overflow-x:auto;padding-bottom:5px}.board{min-width:760px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{min-height:76px;border-radius:14px 14px 10px 10px;background:var(--blue2);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:900;font-size:15px;line-height:1.15}.tile{border:0;min-height:82px;border-radius:11px;background:linear-gradient(145deg,#285fdf,#1f4fbd);color:var(--gold);font-size:31px;font-weight:950;box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}.tile.used{background:#e7e9ef;color:#a4a9b5;box-shadow:none;cursor:default}.status{min-height:22px;margin-top:12px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.footer-note{text-align:center;color:#9398a5;font-size:12px;margin-top:16px}.level-note{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}.error{max-width:720px;margin:24px auto;background:#fff0f1;border:1px solid #ffd0d6;color:#9f2333;border-radius:16px;padding:18px;display:none}.modal-back{position:fixed;inset:0;background:rgba(20,28,48,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.open{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 24px 90px rgba(0,0,0,.28)}.qmeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:800;font-size:13px}.qpoints{color:var(--blue);font-size:18px}.question{font-size:clamp(27px,5vw,44px);line-height:1.12;font-weight:950;letter-spacing:-.025em;margin:24px 0;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}.answer{display:none;background:#f0f8f5;border:1px solid #c9e9dc;border-radius:16px;padding:17px;text-align:center;font-size:clamp(22px,4vw,32px);font-weight:900;color:#116c50;margin:10px 0 20px}.answer.show{display:block}.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action{min-height:48px;border-radius:13px;border:1px solid var(--line);padding:0 18px;background:#fff;font-weight:900}.reveal{background:var(--blue);border-color:var(--blue);color:#fff}.correct{background:var(--green);border-color:var(--green);color:#fff;display:none}.wrong{background:var(--red);border-color:var(--red);color:#fff;display:none}.skip{display:none}.revealed .correct,.revealed .wrong,.revealed .skip{display:inline-flex;align-items:center}.revealed .reveal{display:none}
.exit-game-view{display:none;position:fixed;top:10px;right:10px;z-index:30;height:38px;border-radius:11px;border:1px solid #d7dbe5;background:rgba(255,255,255,.94);padding:0 12px;font-weight:900;color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.08)}
body.game-view{background:#fff}.game-view .app{max-width:none;padding:12px 14px}.game-view .topbar,.game-view .score-actions,.game-view .status,.game-view .footer-note,.game-view .error{display:none!important}.game-view .score-section{margin:0 0 10px}.game-view .scorebar{gap:8px}.game-view .team{min-height:56px;padding:9px 18px}.game-view .team-score{font-size:26px}.game-view .rename-team,.game-view .remove-team{display:none}.game-view .board-wrap{padding:0;overflow:hidden}.game-view .board{min-width:0;width:100%;gap:6px}.game-view .cat{min-height:58px;border-radius:10px;font-size:14px}.game-view .tile{min-height:72px;border-radius:9px;font-size:30px}.game-view .exit-game-view{display:block}
@media(min-width:1100px){.game-view .cat{min-height:64px;font-size:16px}.game-view .tile{min-height:88px;font-size:36px}.game-view .team{min-height:62px}.game-view .team-score{font-size:30px}}
@media(max-width:720px){.app{padding:14px}.topbar{align-items:stretch;flex-direction:column}.brand-logo{width:102px}.controls{display:grid;grid-template-columns:1fr auto auto}.control select{width:100%}.score-actions{justify-content:stretch;flex-wrap:wrap}.add-team,.game-view-btn{flex:1}.scorebar{grid-template-columns:repeat(2,minmax(0,1fr))}.team{padding:10px 65px 10px 12px}.team-score{font-size:23px}.modal{padding:20px}.level-note{text-align:left}.game-view .app{padding:8px}.game-view .board{gap:4px}.game-view .cat{min-height:48px;font-size:12px;padding:6px}.game-view .tile{min-height:58px;font-size:24px}.game-view .team{min-height:50px;padding:8px 12px}.game-view .team-score{font-size:22px}}
</style>
</head>
<body>
<button class="exit-game-view" id="exitGameView" type="button">Exit Game View</button>
<main class="app">
<header class="topbar"><div class="brandline"><img class="brand-logo" src="../../Assets/Images/Logo.png" alt="Willena English"><div class="brand-copy"><div class="eyebrow">Willena classroom game</div><h1 class="title">Quiz Grid</h1><div class="sub">General knowledge for English learners.</div></div></div><div><div class="controls"><div class="control"><label for="level">Level</label><select id="level"><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option><option value="8">Level 8</option><option value="9">Level 9</option><option value="10">Level 10</option><option value="11">Level 11</option><option value="12">Level 12</option><option value="13">Level 13</option><option value="14">Level 14</option><option value="15">Level 15</option></select></div><button class="new-board" id="newBoard" type="button">New Board</button><button class="game-view-btn" id="gameView" type="button">Game View</button></div><div class="level-note" id="levelNote">Loading curriculum questions…</div></div></header>
<section class="score-section" aria-label="Team scores"><div class="score-actions"><button class="add-team" id="addTeam" type="button">+ Add Team</button></div><div class="scorebar" id="scorebar"></div></section>
<div class="error" id="error"></div><section class="board-wrap"><div class="board" id="board"><div style="grid-column:1/-1;padding:50px 15px;text-align:center;color:var(--muted);font-weight:800">Loading questions…</div></div></section><div class="status" id="status" aria-live="polite"></div><div class="footer-note">Questions are loaded from the Willena curriculum database.</div>
</main>
<div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="questionText"><div class="modal" id="modal"><div class="qmeta"><span id="questionCategory"></span><span class="qpoints" id="questionPoints"></span></div><div class="question" id="questionText"></div><div class="answer" id="answerText"></div><div class="modal-actions"><button class="action reveal" id="reveal" type="button">Show Answer</button><button class="action correct" id="correct" type="button">✓ Correct</button><button class="action wrong" id="wrong" type="button">✕ Wrong</button><button class="action skip" id="skip" type="button">No Score</button></div></div></div>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';const SUPABASE_KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');const $=id=>document.getElementById(id);const board=$('board'),level=$('level'),note=$('levelNote'),status=$('status'),errorBox=$('error');const modalBack=$('modalBack'),modal=$('modal'),qCat=$('questionCategory'),qPts=$('questionPoints'),qText=$('questionText'),aText=$('answerText'),scorebar=$('scorebar');let teams=[{id:1,name:'Team A',score:0},{id:2,name:'Team B',score:0}],nextTeamId=3,activeTeamId=1,current=null,rows=[],boardItems=[];const pointOrder=[10,20,30,40,50];
function teamLetter(index){let n=index,label='';do{label=String.fromCharCode(65+(n%26))+label;n=Math.floor(n/26)-1}while(n>=0);return label}function activeTeam(){return teams.find(t=>t.id===activeTeamId)||teams[0]}function setActiveTeam(id){if(teams.some(t=>t.id===id)){activeTeamId=id;renderTeams()}}
function renameTeam(id){const team=teams.find(t=>t.id===id);if(!team)return;const next=window.prompt('Team name:',team.name);if(next===null)return;const name=String(next).trim().slice(0,24);if(!name)return;team.name=name;renderTeams();status.textContent=`Renamed to ${name}`}
function renderTeams(){scorebar.innerHTML='';teams.forEach(team=>{const wrap=document.createElement('div');wrap.className='team'+(team.id===activeTeamId?' active':'');wrap.tabIndex=0;const name=document.createElement('span');name.className='team-name';name.textContent=team.name;const score=document.createElement('span');score.className='team-score';score.textContent=team.score;wrap.append(name,score);wrap.addEventListener('click',e=>{if(!e.target.closest('button'))setActiveTeam(team.id)});const rename=document.createElement('button');rename.type='button';rename.className='rename-team';rename.textContent='✎';rename.setAttribute('aria-label',`Rename ${team.name}`);rename.addEventListener('click',e=>{e.stopPropagation();renameTeam(team.id)});wrap.appendChild(rename);if(teams.length>2){const remove=document.createElement('button');remove.type='button';remove.className='remove-team';remove.textContent='×';remove.setAttribute('aria-label',`Remove ${team.name}`);remove.addEventListener('click',e=>{e.stopPropagation();removeTeam(team.id)});wrap.appendChild(remove)}scorebar.appendChild(wrap)})}
function addTeam(){const label=teamLetter(teams.length),team={id:nextTeamId++,name:`Team ${label}`,score:0};teams.push(team);activeTeamId=team.id;renderTeams();status.textContent=`${team.name} added`}function removeTeam(id){if(teams.length<=2)return;const wasActive=id===activeTeamId;teams=teams.filter(t=>t.id!==id);if(wasActive)activeTeamId=teams[0].id;renderTeams()}function resetScores(){teams.forEach(t=>t.score=0);activeTeamId=teams[0].id;renderTeams()}function scoreSummary(){return teams.map(t=>`${t.name} ${t.score}`).join(' · ')}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function clean(v){return String(v??'').trim()}function meta(row){return row.metadata&&typeof row.metadata==='object'?row.metadata:{}}
async function loadLevel(){errorBox.style.display='none';board.innerHTML='<div style="grid-column:1/-1;padding:50px 15px;text-align:center;color:var(--muted);font-weight:800">Loading questions…</div>';status.textContent='';note.textContent='Loading curriculum questions…';const gameLevel=Number(level.value)||1;const select='id,source_key,level_id,difficulty_rating,item_type,prompt_text,correct_answer,metadata,status';const url=`${SUPABASE_URL}/rest/v1/assessment_items?select=${encodeURIComponent(select)}&status=eq.published&item_type=eq.quiz_grid&metadata->>game_level=eq.${gameLevel}&order=difficulty_rating.asc,source_key.asc`;try{const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},cache:'no-store'});if(!res.ok)throw new Error(`Database returned ${res.status}`);rows=await res.json();if(!Array.isArray(rows)||rows.length<25)throw new Error(`This level only has ${Array.isArray(rows)?rows.length:0} quiz questions.`);buildBoard()}catch(err){showError('Could not load the Quiz Grid questions. '+err.message)}}
function buildBoard(){const grouped=new Map();rows.forEach(row=>{const m=meta(row),cat=clean(m.game_category),points=Number(m.game_points);if(!cat||!pointOrder.includes(points))return;const key=cat+'|'+points;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(row)});const cats=[...new Set(rows.map(r=>clean(meta(r).game_category)).filter(Boolean))];const valid=cats.filter(cat=>pointOrder.every(p=>grouped.has(cat+'|'+p))).slice(0,5);if(valid.length!==5){showError('This level does not yet have five complete categories.');return}const categories=shuffle(valid);boardItems=[];categories.forEach(cat=>pointOrder.forEach(points=>{const options=grouped.get(cat+'|'+points);boardItems.push({cat,points,row:options[Math.floor(Math.random()*options.length)],used:false})}));renderBoard(categories);note.textContent=`${rows.length} questions available · Level ${level.value}`}
function renderBoard(categories){board.innerHTML='';categories.forEach(cat=>{const h=document.createElement('div');h.className='cat';h.textContent=cat;board.appendChild(h)});pointOrder.forEach(points=>categories.forEach(cat=>{const item=boardItems.find(x=>x.cat===cat&&x.points===points);const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=points;b.addEventListener('click',()=>openQuestion(item,b));board.appendChild(b)}))}
function openQuestion(item,button){if(!item||item.used)return;current={item,button};qCat.textContent=item.cat;qPts.textContent=item.points+' points';qText.textContent=item.row.prompt_text;aText.textContent=item.row.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed');modalBack.classList.add('open');$('reveal').focus()}
function reveal(){aText.classList.add('show');modal.classList.add('revealed');$('correct').focus()}
function resolve(result){if(!current)return;const p=current.item.points,team=activeTeam();if(result==='correct')team.score+=p;if(result==='wrong')team.score-=p;current.item.used=true;current.button.classList.add('used');current.button.disabled=true;renderTeams();const used=boardItems.filter(x=>x.used).length;status.textContent=used===25?`Board complete · ${scoreSummary()}`:`${25-used} questions left`;closeModal()}
function closeModal(){modalBack.classList.remove('open');current=null}function showError(msg){errorBox.textContent=msg;errorBox.style.display='block';board.innerHTML='';note.textContent='Question bank needs attention.'}
function enterGameView(){document.body.classList.add('game-view');$('exitGameView').focus()}function exitGameView(){document.body.classList.remove('game-view');$('gameView').focus()}
$('addTeam').addEventListener('click',addTeam);$('gameView').addEventListener('click',enterGameView);$('exitGameView').addEventListener('click',exitGameView);$('reveal').addEventListener('click',reveal);$('correct').addEventListener('click',()=>resolve('correct'));$('wrong').addEventListener('click',()=>resolve('wrong'));$('skip').addEventListener('click',()=>resolve('skip'));$('newBoard').addEventListener('click',()=>{resetScores();loadLevel()});level.addEventListener('change',()=>{resetScores();loadLevel()});modalBack.addEventListener('click',e=>{if(e.target===modalBack&&modal.classList.contains('revealed'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed'))closeModal();else if(document.body.classList.contains('game-view'))exitGameView()}});renderTeams();loadLevel();
})();
</script>
</body>
</html>
