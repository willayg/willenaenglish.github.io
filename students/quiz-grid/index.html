<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Quiz Grid</title>
<style>
:root{--ink:#17223b;--muted:#6b7280;--bg:#f7f8fc;--line:#e5e7eb;--blue:#2458d6;--blue2:#173d9b;--gold:#ffd866;--green:#15966a;--red:#d94b5b}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px}.brand-logo{width:128px;max-width:34vw}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a8192}.title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.control label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.06em}select,.btn,.mode-btn{height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.soft{color:var(--blue);border-color:#cfd8f5}.mode-switch{display:flex;border:1px solid #cfd8f5;border-radius:13px;overflow:hidden;background:#fff;height:46px}.mode-btn{border:0;border-radius:0;height:44px;padding:0 14px;color:#667085}.mode-btn.active{background:var(--blue);color:#fff}.score-section{margin:12px 0 18px}.score-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.team{position:relative;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 68px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}.team.active{border-color:var(--blue);background:#f8faff}.team-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-size:28px;font-weight:950}.rename-team,.remove-team{position:absolute;top:7px;width:27px;height:27px;border-radius:50%;border:0;background:#f0f2f6;color:#6f7685;font-weight:900;display:flex;align-items:center;justify-content:center}.rename-team{right:38px;font-size:13px}.remove-team{right:7px}.board-wrap{overflow-x:auto}.board{min-width:760px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{min-height:76px;border-radius:14px 14px 10px 10px;background:var(--blue2);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:900}.tile{border:0;min-height:82px;border-radius:11px;background:linear-gradient(145deg,#285fdf,#1f4fbd);color:var(--gold);font-size:31px;font-weight:950;box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}.tile.used{background:#e7e9ef;color:#a4a9b5;box-shadow:none;cursor:default}.status{min-height:22px;margin-top:12px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.note{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}.footer{text-align:center;color:#9398a5;font-size:12px;margin-top:16px}.error{display:none;background:#fff0f1;border:1px solid #ffd0d6;color:#9f2333;border-radius:16px;padding:18px;margin:18px 0}.modal-back{position:fixed;inset:0;background:rgba(20,28,48,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.open{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 24px 90px rgba(0,0,0,.28)}.qmeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:800;font-size:13px}.qpoints{color:var(--blue);font-size:18px}.question{font-size:clamp(27px,5vw,44px);line-height:1.12;font-weight:950;letter-spacing:-.025em;margin:24px 0;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}.answer{display:none;background:#f0f8f5;border:1px solid #c9e9dc;border-radius:16px;padding:17px;text-align:center;font-size:clamp(22px,4vw,32px);font-weight:900;color:#116c50;margin:10px 0 20px}.answer.show{display:block}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action{min-height:48px;border-radius:13px;border:1px solid var(--line);padding:0 18px;background:#fff;font-weight:900}.reveal{background:var(--blue);border-color:var(--blue);color:#fff}.correct{background:var(--green);border-color:var(--green);color:#fff;display:none}.wrong{background:var(--red);border-color:var(--red);color:#fff;display:none}.skip{display:none}.revealed .reveal{display:none}.revealed .correct,.revealed .wrong,.revealed .skip{display:inline-flex;align-items:center}.exit-game{display:none;position:fixed;top:10px;right:10px;z-index:30;height:38px;border-radius:11px;border:1px solid #d7dbe5;background:rgba(255,255,255,.94);padding:0 12px;font-weight:900}.game-view .topbar,.game-view .score-actions,.game-view .status,.game-view .footer,.game-view .error{display:none!important}.game-view .app{max-width:none;padding:12px}.game-view .score-section{margin:0 0 10px}.game-view .rename-team,.game-view .remove-team{display:none}.game-view .board{min-width:0;width:100%;gap:6px}.game-view .cat{min-height:58px}.game-view .tile{min-height:78px;font-size:34px}.game-view .exit-game{display:block}@media(max-width:760px){.app{padding:14px}.topbar{flex-direction:column;align-items:stretch}.controls{display:grid;grid-template-columns:1fr auto}.control{grid-column:1/-1}.mode-switch{grid-column:1/-1}.mode-btn{flex:1}.scorebar{grid-template-columns:repeat(2,minmax(0,1fr))}.score-actions{justify-content:stretch}.score-actions .btn{flex:1}.brand-logo{width:102px}.note{text-align:left}.modal{padding:20px}}
</style>
</head>
<body>
<button class="exit-game" id="exitGame" type="button">Exit Game View</button>
<main class="app">
<header class="topbar">
<div class="brandline"><img class="brand-logo" src="../../Assets/Images/Logo.png" alt="Willena English"><div><div class="eyebrow">Willena classroom game</div><h1 class="title">Quiz Grid</h1><div class="sub">General knowledge for English learners.</div></div></div>
<div><div class="controls"><div class="mode-switch" aria-label="Game mode"><button class="mode-btn active" type="button">Quiz Grid</button><button class="mode-btn" id="toCards" type="button">Category Cards</button></div><div class="control"><label for="level">Level</label><select id="level"></select></div><button class="btn primary" id="newBoard" type="button">New Board</button><button class="btn soft" id="gameView" type="button">Game View</button></div><div class="note" id="note">Loading questions…</div></div>
</header>
<section class="score-section"><div class="score-actions"><button class="btn soft" id="addTeam" type="button">+ Add Team</button></div><div class="scorebar" id="scorebar"></div></section>
<div class="error" id="error"></div><section class="board-wrap"><div class="board" id="board"></div></section><div class="status" id="status"></div><div class="footer">Questions are loaded from the Willena curriculum database.</div>
</main>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"><div class="qmeta"><span id="qCat"></span><span class="qpoints" id="qPts"></span></div><div class="question" id="qText"></div><div class="answer" id="aText"></div><div class="actions"><button class="action reveal" id="reveal" type="button">Show Answer</button><button class="action correct" id="correct" type="button">✓ Correct</button><button class="action wrong" id="wrong" type="button">✕ Wrong</button><button class="action skip" id="skip" type="button">No Score</button></div></div></div>
<script>
(()=>{'use strict';
const URL='https://gxwfsqxyuufqtitspfqg.supabase.co',KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join(''),$=id=>document.getElementById(id);const level=$('level'),board=$('board'),scorebar=$('scorebar'),status=$('status'),note=$('note'),errorBox=$('error'),modalBack=$('modalBack'),modal=$('modal'),qCat=$('qCat'),qPts=$('qPts'),qText=$('qText'),aText=$('aText');for(let i=1;i<=15;i++){const o=document.createElement('option');o.value=i;o.textContent='Level '+i;level.appendChild(o)}const qp=new URLSearchParams(location.search);if(qp.get('level'))level.value=qp.get('level');let teams=[{id:1,name:'Team A',score:0},{id:2,name:'Team B',score:0}],nextId=3,activeId=1,rows=[],items=[],current=null;const points=[10,20,30,40,50];
const clean=v=>String(v??'').trim(),meta=r=>r.metadata&&typeof r.metadata==='object'?r.metadata:{},shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function activeTeam(){return teams.find(t=>t.id===activeId)||teams[0]}function letters(i){return String.fromCharCode(65+i)}function renderTeams(){scorebar.innerHTML='';teams.forEach(t=>{const c=document.createElement('div');c.className='team'+(t.id===activeId?' active':'');c.tabIndex=0;c.addEventListener('click',e=>{if(!e.target.closest('button')){activeId=t.id;renderTeams()}});const n=document.createElement('span');n.className='team-name';n.textContent=t.name;const s=document.createElement('span');s.className='team-score';s.textContent=t.score;c.append(n,s);const r=document.createElement('button');r.className='rename-team';r.type='button';r.textContent='✎';r.addEventListener('click',e=>{e.stopPropagation();const x=prompt('Team name:',t.name);if(x&&clean(x)){t.name=clean(x).slice(0,24);renderTeams()}});c.appendChild(r);if(teams.length>2){const d=document.createElement('button');d.className='remove-team';d.type='button';d.textContent='×';d.addEventListener('click',e=>{e.stopPropagation();teams=teams.filter(x=>x.id!==t.id);if(activeId===t.id)activeId=teams[0].id;renderTeams()});c.appendChild(d)}scorebar.appendChild(c)})}
function addTeam(){const t={id:nextId++,name:'Team '+letters(teams.length),score:0};teams.push(t);activeId=t.id;renderTeams()}function resetScores(){teams.forEach(t=>t.score=0);activeId=teams[0].id;renderTeams()}async function load(){errorBox.style.display='none';board.innerHTML='<div style="grid-column:1/-1;padding:50px;text-align:center;color:#6b7280;font-weight:800">Loading questions…</div>';const lv=Number(level.value)||1;const sel='id,source_key,prompt_text,correct_answer,metadata,difficulty_rating';const u=`${URL}/rest/v1/assessment_items?select=${encodeURIComponent(sel)}&status=eq.published&item_type=eq.quiz_grid&metadata->>game_level=eq.${lv}&order=difficulty_rating.asc,source_key.asc`;try{const res=await fetch(u,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!res.ok)throw new Error(res.status);rows=await res.json();build()}catch(e){errorBox.textContent='Could not load questions.';errorBox.style.display='block';board.innerHTML=''}}
function build(){const g=new Map();rows.forEach(r=>{const m=meta(r),cat=clean(m.game_category),p=Number(m.game_points);if(!cat||!points.includes(p))return;const k=cat+'|'+p;if(!g.has(k))g.set(k,[]);g.get(k).push(r)});const cats=shuffle([...new Set(rows.map(r=>clean(meta(r).game_category)).filter(Boolean))].filter(c=>points.every(p=>g.has(c+'|'+p))).slice(0,5));if(cats.length!==5){errorBox.textContent='This level does not yet have five complete categories.';errorBox.style.display='block';return}items=[];cats.forEach(c=>points.forEach(p=>{const a=g.get(c+'|'+p);items.push({cat:c,points:p,row:a[Math.floor(Math.random()*a.length)],used:false})}));renderBoard(cats);note.textContent=`${rows.length} questions available · Level ${level.value}`}
function renderBoard(cats){board.innerHTML='';cats.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c;board.appendChild(h)});points.forEach(p=>cats.forEach(c=>{const it=items.find(x=>x.cat===c&&x.points===p),b=document.createElement('button');b.type='button';b.className='tile';b.textContent=p;b.addEventListener('click',()=>open(it,b));board.appendChild(b)}))}function open(it,b){if(!it||it.used)return;current={it,b};qCat.textContent=it.cat;qPts.textContent=it.points+' points';qText.textContent=it.row.prompt_text;aText.textContent=it.row.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed');modalBack.classList.add('open')}function reveal(){aText.classList.add('show');modal.classList.add('revealed')}function resolve(result){if(!current)return;const t=activeTeam(),p=current.it.points;if(result==='correct')t.score+=p;if(result==='wrong')t.score-=p;current.it.used=true;current.b.disabled=true;current.b.classList.add('used');renderTeams();const used=items.filter(x=>x.used).length;status.textContent=used===25?'Board complete · '+teams.map(t=>`${t.name} ${t.score}`).join(' · '):`${25-used} questions left`;modalBack.classList.remove('open');current=null}
$('addTeam').onclick=addTeam;$('newBoard').onclick=()=>{resetScores();load()};level.onchange=()=>{resetScores();load()};$('reveal').onclick=reveal;$('correct').onclick=()=>resolve('correct');$('wrong').onclick=()=>resolve('wrong');$('skip').onclick=()=>resolve('skip');$('gameView').onclick=()=>document.body.classList.add('game-view');$('exitGame').onclick=()=>document.body.classList.remove('game-view');$('toCards').onclick=()=>{location.href='category-cards.html?level='+encodeURIComponent(level.value)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed')){modalBack.classList.remove('open');current=null}else document.body.classList.remove('game-view')}});renderTeams();load();})();
</script>
</body></html>
