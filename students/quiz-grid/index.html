<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Quiz Grid</title>
<style>
:root{--ink:#17223b;--muted:#657180;--bg:#f3fcff;--line:#cdebf3;--cyan:#00a9ce;--cyan-dark:#087f9e;--green:#15966a;--red:#d85f6f;--gold:#f2b84b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#f3fcff 0%,#f9fdff 52%,#fff 100%);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px}.brand-logo{width:128px;max-width:34vw}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5d8794}.title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.control label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.06em}select,.btn,.mode-btn{height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.soft{color:var(--cyan-dark);border-color:#a9dce9}.mode-switch{display:flex;border:1px solid #a9dce9;border-radius:13px;overflow:hidden;background:#fff;height:46px}.mode-btn{border:0;border-radius:0;height:44px;padding:0 14px;color:#667085}.mode-btn.active{background:var(--cyan);color:#fff}.sound-btn{min-width:106px}.score-section{margin:12px 0 18px}.score-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.team{position:relative;background:#fff;border:2px solid #d9ebf0;border-radius:16px;padding:12px 68px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;transition:.18s ease}.team.active{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,169,206,.08)}.team.score-pop{animation:scorePop .42s ease}.team-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-size:28px;font-weight:950}.rename-team,.remove-team{position:absolute;top:7px;width:27px;height:27px;border-radius:50%;border:0;background:#eef7f9;color:#65808a;font-weight:900;display:flex;align-items:center;justify-content:center}.rename-team{right:38px;font-size:13px}.remove-team{right:7px}.board-wrap{overflow-x:auto;padding-bottom:5px}.board{min-width:760px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{min-height:76px;border-radius:14px 14px 10px 10px;background:#fff;border:2px solid var(--cat-color,#00a9ce);color:var(--cat-color,#00a9ce);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:950;box-shadow:0 3px 0 rgba(23,34,59,.025);animation:cardIn .3s both}.tile{--tile-color:#00a9ce;border:2px solid var(--tile-color);min-height:82px;border-radius:11px;background:#fff;color:var(--tile-color);font-size:31px;font-weight:950;box-shadow:0 3px 0 rgba(23,34,59,.025);transition:transform .15s ease,box-shadow .15s ease,opacity .18s ease;animation:cardIn .32s both}.tile:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(23,34,59,.07)}.tile:active{transform:scale(.97)}.tile.used{border-color:#d8e2e7!important;color:#a0adb3!important;background:#f8fafb;box-shadow:none;cursor:default;opacity:.7}.status{min-height:22px;margin-top:12px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.note{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}.footer{text-align:center;color:#9398a5;font-size:12px;margin-top:16px}.error{display:none;background:#fff0f1;border:1px solid #ffd0d6;color:#9f2333;border-radius:16px;padding:18px;margin:18px 0}.modal-back{position:fixed;inset:0;background:rgba(20,37,48,.64);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.open{display:flex;animation:fadeIn .16s ease}.modal{width:min(760px,100%);background:#fff;border:2px solid #bfe8f1;border-radius:24px;padding:26px;box-shadow:0 28px 100px rgba(0,66,84,.24)}.modal-back.open .modal{animation:modalPop .28s cubic-bezier(.2,.9,.3,1.15)}.modal.correct-hit{animation:correctPulse .45s ease}.modal.wrong-hit{animation:wrongShake .42s ease}.qmeta{display:flex;justify-content:space-between;gap:12px;color:#5d8794;font-weight:800;font-size:13px}.qpoints{color:var(--cyan);font-size:20px;font-weight:950}.question{font-size:clamp(27px,5vw,44px);line-height:1.12;font-weight:950;letter-spacing:-.025em;margin:24px 0;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}.answer{display:none;background:#effaf7;border:1px solid #ccebdd;border-radius:16px;padding:17px;text-align:center;font-size:clamp(22px,4vw,32px);font-weight:900;color:#116c50;margin:10px 0 20px}.answer.show{display:block;animation:answerIn .28s ease}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action{min-height:48px;border-radius:13px;border:1px solid var(--line);padding:0 18px;background:#fff;font-weight:900}.reveal{background:var(--cyan);border-color:var(--cyan);color:#fff}.correct{background:var(--green);border-color:var(--green);color:#fff;display:none}.wrong{background:var(--red);border-color:var(--red);color:#fff;display:none}.skip{display:none}.revealed .reveal{display:none}.revealed .correct,.revealed .wrong,.revealed .skip{display:inline-flex;align-items:center}.burst{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti{position:absolute;width:9px;height:15px;border-radius:3px;animation:confettiFall .75s ease-out forwards}.exit-game{display:none;position:fixed;top:10px;right:10px;z-index:30;height:38px;border-radius:11px;border:1px solid #d7dbe5;background:rgba(255,255,255,.94);padding:0 12px;font-weight:900}.game-view .topbar,.game-view .score-actions,.game-view .status,.game-view .footer,.game-view .error{display:none!important}.game-view .app{max-width:none;padding:12px}.game-view .score-section{margin:0 0 10px}.game-view .rename-team,.game-view .remove-team{display:none}.game-view .board{min-width:0;width:100%;gap:6px}.game-view .cat{min-height:58px}.game-view .tile{min-height:78px;font-size:34px}.game-view .exit-game{display:block}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes modalPop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}@keyframes answerIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes scorePop{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}}@keyframes correctPulse{0%,100%{box-shadow:0 28px 100px rgba(0,66,84,.24)}45%{box-shadow:0 0 0 8px rgba(21,150,106,.18),0 28px 100px rgba(0,66,84,.24)}}@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}@keyframes confettiFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:760px){.app{padding:14px}.topbar{flex-direction:column;align-items:stretch}.controls{display:grid;grid-template-columns:1fr auto}.control{grid-column:1/-1}.mode-switch{grid-column:1/-1}.mode-btn{flex:1}.scorebar{grid-template-columns:repeat(2,minmax(0,1fr))}.score-actions{justify-content:stretch}.score-actions .btn{flex:1}.brand-logo{width:102px}.note{text-align:left}.modal{padding:20px}}
</style>
</head>
<body>
<div class="burst" id="burst"></div>
<button class="exit-game" id="exitGame" type="button">Exit Game View</button>
<main class="app">
<header class="topbar">
<div class="brandline"><img class="brand-logo" src="../../Assets/Images/Logo.png" alt="Willena English"><div><div class="eyebrow">Willena classroom game</div><h1 class="title">Quiz Grid</h1><div class="sub">General knowledge for English learners.</div></div></div>
<div><div class="controls"><div class="mode-switch" aria-label="Game mode"><button class="mode-btn active" type="button">Quiz Grid</button><button class="mode-btn" id="toCards" type="button">Category Cards</button></div><div class="control"><label for="level">Level</label><select id="level"></select></div><button class="btn soft sound-btn" id="soundBtn" type="button">🔊 Sound On</button><button class="btn primary" id="newBoard" type="button">New Board</button><button class="btn soft" id="gameView" type="button">Game View</button></div><div class="note" id="note">Loading questions…</div></div>
</header>
<section class="score-section"><div class="score-actions"><button class="btn soft" id="addTeam" type="button">+ Add Team</button></div><div class="scorebar" id="scorebar"></div></section>
<div class="error" id="error"></div><section class="board-wrap"><div class="board" id="board"></div></section><div class="status" id="status"></div><div class="footer">Questions are loaded from the Willena curriculum database.</div>
</main>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"><div class="qmeta"><span id="qCat"></span><span class="qpoints" id="qPts"></span></div><div class="question" id="qText"></div><div class="answer" id="aText"></div><div class="actions"><button class="action reveal" id="reveal" type="button">Show Answer</button><button class="action correct" id="correct" type="button">✓ Correct</button><button class="action wrong" id="wrong" type="button">✕ Wrong</button><button class="action skip" id="skip" type="button">No Score</button></div></div></div>
<script>
(()=>{'use strict';
const URL='https://gxwfsqxyuufqtitspfqg.supabase.co',KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join(''),$=id=>document.getElementById(id);const level=$('level'),board=$('board'),scorebar=$('scorebar'),status=$('status'),note=$('note'),errorBox=$('error'),modalBack=$('modalBack'),modal=$('modal'),qCat=$('qCat'),qPts=$('qPts'),qText=$('qText'),aText=$('aText'),burst=$('burst');for(let i=1;i<=15;i++){const o=document.createElement('option');o.value=i;o.textContent='Level '+i;level.appendChild(o)}const qp=new URLSearchParams(location.search);if(qp.get('level'))level.value=qp.get('level');let teams=[{id:1,name:'Team A',score:0},{id:2,name:'Team B',score:0}],nextId=3,activeId=1,rows=[],items=[],current=null,soundOn=true,audioCtx=null;const points=[10,20,30,40,50];const palette=['#00A9CE','#EF6FA3','#57C7B6','#7D72E8','#F2B84B'];
const clean=v=>String(v??'').trim(),meta=r=>r.metadata&&typeof r.metadata==='object'?r.metadata:{},shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function ensureAudio(){if(!soundOn)return null;if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C()}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,dur=.1,type='sine',vol=.05,delay=0){const ctx=ensureAudio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.03)}function sound(kind){if(!soundOn)return;if(kind==='tap'){tone(300,.07,'triangle',.04);tone(430,.08,'sine',.032,.04)}else if(kind==='reveal'){tone(360,.08,'triangle',.04);tone(520,.09,'triangle',.045,.065);tone(700,.12,'sine',.04,.14)}else if(kind==='correct'){[520,660,780,920,1100].forEach((f,i)=>tone(f,i===4?.2:.1,i<2?'triangle':'sine',.05,i*.075))}else if(kind==='wrong'){tone(230,.14,'sawtooth',.035);tone(180,.16,'sawtooth',.035,.1);tone(130,.2,'square',.025,.22)}else if(kind==='new'){[300,420,560,760].forEach((f,i)=>tone(f,i===3?.18:.09,'triangle',.04,i*.06))}}
function activeTeam(){return teams.find(t=>t.id===activeId)||teams[0]}function letters(i){let n=i,s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1}while(n>=0);return s}function renderTeams(popId=null){scorebar.innerHTML='';teams.forEach(t=>{const c=document.createElement('div');c.className='team'+(t.id===activeId?' active':'')+(t.id===popId?' score-pop':'');c.tabIndex=0;c.addEventListener('click',e=>{if(!e.target.closest('button')){activeId=t.id;renderTeams();sound('tap')}});const n=document.createElement('span');n.className='team-name';n.textContent=t.name;const s=document.createElement('span');s.className='team-score';s.textContent=t.score;c.append(n,s);const r=document.createElement('button');r.className='rename-team';r.type='button';r.textContent='✎';r.addEventListener('click',e=>{e.stopPropagation();const x=prompt('Team name:',t.name);if(x&&clean(x)){t.name=clean(x).slice(0,24);renderTeams()}});c.appendChild(r);if(teams.length>2){const d=document.createElement('button');d.className='remove-team';d.type='button';d.textContent='×';d.addEventListener('click',e=>{e.stopPropagation();teams=teams.filter(x=>x.id!==t.id);if(activeId===t.id)activeId=teams[0].id;renderTeams()});c.appendChild(d)}scorebar.appendChild(c)})}
function addTeam(){const t={id:nextId++,name:'Team '+letters(teams.length),score:0};teams.push(t);activeId=t.id;renderTeams();sound('tap')}function resetScores(){teams.forEach(t=>t.score=0);activeId=teams[0].id;renderTeams()}async function load(){errorBox.style.display='none';board.innerHTML='<div style="grid-column:1/-1;padding:50px;text-align:center;color:#6b7280;font-weight:800">Loading questions…</div>';const lv=Number(level.value)||1;const sel='id,source_key,prompt_text,correct_answer,metadata,difficulty_rating';const u=`${URL}/rest/v1/assessment_items?select=${encodeURIComponent(sel)}&status=eq.published&item_type=eq.quiz_grid&metadata->>game_level=eq.${lv}&order=difficulty_rating.asc,source_key.asc`;try{const res=await fetch(u,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!res.ok)throw new Error(res.status);rows=await res.json();build()}catch(e){errorBox.textContent='Could not load questions.';errorBox.style.display='block';board.innerHTML=''}}
function build(){const g=new Map();rows.forEach(r=>{const m=meta(r),cat=clean(m.game_category),p=Number(m.game_points);if(!cat||!points.includes(p))return;const k=cat+'|'+p;if(!g.has(k))g.set(k,[]);g.get(k).push(r)});const cats=shuffle([...new Set(rows.map(r=>clean(meta(r).game_category)).filter(Boolean))].filter(c=>points.every(p=>g.has(c+'|'+p))).slice(0,5));if(cats.length!==5){errorBox.textContent='This level does not yet have five complete categories.';errorBox.style.display='block';return}items=[];cats.forEach(c=>points.forEach(p=>{const a=g.get(c+'|'+p);items.push({cat:c,points:p,row:a[Math.floor(Math.random()*a.length)],used:false})}));renderBoard(cats);note.textContent=`${rows.length} questions available · Level ${level.value}`}
function renderBoard(cats){board.innerHTML='';cats.forEach((c,i)=>{const h=document.createElement('div');h.className='cat';h.textContent=c;h.style.setProperty('--cat-color',palette[i]);h.style.animationDelay=(i*25)+'ms';board.appendChild(h)});points.forEach((p,row)=>cats.forEach((c,col)=>{const it=items.find(x=>x.cat===c&&x.points===p),b=document.createElement('button');b.type='button';b.className='tile';b.textContent=p;b.style.setProperty('--tile-color',palette[col]);b.style.animationDelay=(80+(row*5+col)*14)+'ms';b.addEventListener('click',()=>open(it,b));board.appendChild(b)}))}function open(it,b){if(!it||it.used)return;sound('tap');current={it,b};qCat.textContent=it.cat;qPts.textContent=it.points+' points';qText.textContent=it.row.prompt_text;aText.textContent=it.row.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed','correct-hit','wrong-hit');modalBack.classList.add('open')}function reveal(){sound('reveal');aText.classList.add('show');modal.classList.add('revealed')}
function confetti(){burst.innerHTML='';for(let i=0;i<34;i++){const p=document.createElement('i');p.className='confetti';p.style.left=(45+Math.random()*10)+'%';p.style.top=(42+Math.random()*8)+'%';p.style.background=palette[i%palette.length];p.style.setProperty('--x',((Math.random()-.5)*520)+'px');p.style.setProperty('--y',(150+Math.random()*330)+'px');p.style.setProperty('--r',((Math.random()-.5)*720)+'deg');burst.appendChild(p)}setTimeout(()=>burst.innerHTML='',900)}function resolve(result){if(!current)return;const t=activeTeam(),p=current.it.points;if(result==='correct'){t.score+=p;sound('correct');modal.classList.add('correct-hit');confetti()}if(result==='wrong'){t.score-=p;sound('wrong');modal.classList.add('wrong-hit')}current.it.used=true;current.b.disabled=true;current.b.classList.add('used');renderTeams(t.id);const used=items.filter(x=>x.used).length;status.textContent=used===25?'Board complete · '+teams.map(t=>`${t.name} ${t.score}`).join(' · '):`${25-used} questions left`;setTimeout(()=>{modalBack.classList.remove('open');modal.classList.remove('correct-hit','wrong-hit');current=null},result==='skip'?0:430)}
$('addTeam').onclick=addTeam;$('newBoard').onclick=()=>{resetScores();sound('new');load()};level.onchange=()=>{resetScores();sound('new');load()};$('reveal').onclick=reveal;$('correct').onclick=()=>resolve('correct');$('wrong').onclick=()=>resolve('wrong');$('skip').onclick=()=>resolve('skip');$('gameView').onclick=()=>{document.body.classList.add('game-view');sound('tap')};$('exitGame').onclick=()=>document.body.classList.remove('game-view');$('toCards').onclick=()=>{location.href='category-cards.html?level='+encodeURIComponent(level.value)};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)sound('tap')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed')){modalBack.classList.remove('open');current=null}else document.body.classList.remove('game-view')}});renderTeams();load();})();
</script>
</body></html>
