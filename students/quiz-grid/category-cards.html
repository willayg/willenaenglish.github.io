<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willena Category Cards</title>
<style>
:root{--ink:#17223b;--muted:#6b7280;--bg:#f7f8fc;--card:#fff;--line:#e5e7eb;--blue:#2458d6;--blue2:#173d9b;--gold:#ffd866;--green:#15966a;--red:#d94b5b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:0 auto;padding:22px}.topbar{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px}.brand-logo{width:128px;max-width:34vw;height:auto;display:block}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a8192}.title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.control label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.06em}select,.new-game,.add-team,.game-view{height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800;color:var(--ink)}.new-game{background:var(--ink);color:#fff;border-color:var(--ink)}.game-view{color:var(--blue);border-color:#cfd8f5}.score-section{margin:12px 0 18px}.score-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.add-team{color:var(--blue);border-color:#cfd8f5}.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.team{position:relative;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 68px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}.team.active{border-color:var(--blue);background:#f8faff}.team-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-size:28px;font-weight:950;flex:none}.rename-team,.remove-team{position:absolute;top:7px;width:27px;height:27px;border-radius:50%;border:0;background:#f0f2f6;color:#6f7685;font-weight:900;display:flex;align-items:center;justify-content:center}.rename-team{right:38px;font-size:13px}.remove-team{right:7px}.categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.category-card{border:0;border-radius:22px;min-height:245px;padding:24px 16px;background:linear-gradient(155deg,#285fdf,#173d9b);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);transition:.15s}.category-card:hover{transform:translateY(-2px);filter:brightness(1.04)}.category-card:active{transform:translateY(1px)}.category-card.done{background:#e4e7ee;color:#9298a6;box-shadow:none;cursor:default}.cat-name{font-size:clamp(19px,2.5vw,29px);font-weight:950;line-height:1.08}.cat-left{margin-top:15px;font-size:12px;font-weight:800;opacity:.76}.status{min-height:22px;margin-top:13px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.error{display:none;background:#fff0f1;border:1px solid #ffd0d6;color:#9f2333;border-radius:16px;padding:18px;margin:18px 0}.footer{text-align:center;color:#9398a5;font-size:12px;margin-top:18px}.modal-back{position:fixed;inset:0;background:rgba(20,28,48,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-back.open{display:flex}.modal{width:min(820px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 28px 100px rgba(0,0,0,.3)}.qmeta{display:flex;align-items:center;justify-content:space-between;gap:14px}.qcat{font-size:14px;font-weight:900;color:var(--muted)}.qpoints{font-size:clamp(24px,4vw,38px);font-weight:950;color:var(--blue)}.question{font-size:clamp(29px,5vw,48px);font-weight:950;line-height:1.12;letter-spacing:-.03em;text-align:center;min-height:170px;display:flex;align-items:center;justify-content:center;margin:20px 0}.answer{display:none;background:#eff9f5;border:1px solid #ccebdd;color:#116c50;border-radius:18px;padding:18px;text-align:center;font-size:clamp(23px,4vw,34px);font-weight:900;margin-bottom:20px}.answer.show{display:block}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.action{min-height:50px;border-radius:14px;border:1px solid var(--line);padding:0 20px;background:#fff;font-weight:900}.reveal{background:var(--blue);border-color:var(--blue);color:#fff}.correct{display:none;background:var(--green);border-color:var(--green);color:#fff}.wrong{display:none;background:var(--red);border-color:var(--red);color:#fff}.skip{display:none}.revealed .reveal{display:none}.revealed .correct,.revealed .wrong,.revealed .skip{display:inline-flex;align-items:center}.exit-game{display:none;position:fixed;top:10px;right:10px;z-index:20;height:42px;border:0;border-radius:12px;background:rgba(23,34,59,.9);color:#fff;padding:0 14px;font-weight:900}.game-only .topbar,.game-only .score-actions,.game-only .footer,.game-only .status{display:none}.game-only .app{max-width:none;padding:14px}.game-only .score-section{margin:0 0 12px}.game-only .categories{min-height:calc(100vh - 108px)}.game-only .category-card{min-height:0}.game-only .exit-game{display:block}
@media(max-width:850px){.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.category-card{min-height:180px}.topbar{align-items:stretch;flex-direction:column}.controls{display:grid;grid-template-columns:1fr auto auto}.control select{width:100%}}
@media(max-width:540px){.app{padding:14px}.brand-logo{width:100px}.categories{grid-template-columns:1fr}.category-card{min-height:120px}.scorebar{grid-template-columns:repeat(2,minmax(0,1fr))}.team{padding:10px 65px 10px 12px}.team-score{font-size:22px}.controls{grid-template-columns:1fr 1fr}.control{grid-column:1/-1}.game-view{display:none}.question{min-height:125px}.modal{padding:20px}}
</style>
</head>
<body>
<button class="exit-game" id="exitGame" type="button">Exit Game View</button>
<main class="app">
<header class="topbar">
  <div class="brandline"><img class="brand-logo" src="../../Assets/Images/Logo.png" alt="Willena English"><div><div class="eyebrow">Willena classroom game</div><h1 class="title">Category Cards</h1><div class="sub">Pick a category. The question reveals its points.</div></div></div>
  <div class="controls"><div class="control"><label for="level">Level</label><select id="level"></select></div><button class="game-view" id="gameView" type="button">Game View</button><button class="new-game" id="newGame" type="button">New Game</button></div>
</header>
<section class="score-section"><div class="score-actions"><button class="add-team" id="addTeam" type="button">+ Add Team</button></div><div class="scorebar" id="scorebar"></div></section>
<div class="error" id="error"></div>
<section class="categories" id="categories"><div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);font-weight:800">Loading questions…</div></section>
<div class="status" id="status" aria-live="polite"></div>
<div class="footer">Questions are loaded from the Willena curriculum database.</div>
</main>
<div class="modal-back" id="modalBack" role="dialog" aria-modal="true"><div class="modal" id="modal"><div class="qmeta"><span class="qcat" id="qCat"></span><span class="qpoints" id="qPoints"></span></div><div class="question" id="qText"></div><div class="answer" id="aText"></div><div class="actions"><button class="action reveal" id="reveal" type="button">Show Answer</button><button class="action correct" id="correct" type="button">✓ Correct</button><button class="action wrong" id="wrong" type="button">✕ Wrong</button><button class="action skip" id="skip" type="button">No Score</button></div></div></div>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
const SUPABASE_KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const $=id=>document.getElementById(id);const level=$('level'),categories=$('categories'),status=$('status'),errorBox=$('error'),scorebar=$('scorebar'),modalBack=$('modalBack'),modal=$('modal'),qCat=$('qCat'),qPoints=$('qPoints'),qText=$('qText'),aText=$('aText');
for(let i=1;i<=15;i++){const o=document.createElement('option');o.value=i;o.textContent='Level '+i;level.appendChild(o)}
const pointMap={10:100,20:200,30:300,40:500,50:1000};
let teams=[{id:1,name:'Team A',score:0},{id:2,name:'Team B',score:0}],nextTeamId=3,activeTeamId=1,rows=[],pools=new Map(),current=null;
function clean(v){return String(v??'').trim()}function meta(r){return r.metadata&&typeof r.metadata==='object'?r.metadata:{}}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function teamLetter(index){let n=index,label='';do{label=String.fromCharCode(65+(n%26))+label;n=Math.floor(n/26)-1}while(n>=0);return label}
function activeTeam(){return teams.find(t=>t.id===activeTeamId)||teams[0]}
function renderTeams(){scorebar.innerHTML='';teams.forEach(team=>{const card=document.createElement('div');card.className='team'+(team.id===activeTeamId?' active':'');card.tabIndex=0;const name=document.createElement('span');name.className='team-name';name.textContent=team.name;const score=document.createElement('span');score.className='team-score';score.textContent=team.score;card.append(name,score);card.addEventListener('click',e=>{if(!e.target.closest('button')){activeTeamId=team.id;renderTeams()}});const rename=document.createElement('button');rename.type='button';rename.className='rename-team';rename.textContent='✎';rename.addEventListener('click',e=>{e.stopPropagation();const next=prompt('Team name:',team.name);if(next!==null&&clean(next)){team.name=clean(next).slice(0,24);renderTeams()}});card.appendChild(rename);if(teams.length>2){const remove=document.createElement('button');remove.type='button';remove.className='remove-team';remove.textContent='×';remove.addEventListener('click',e=>{e.stopPropagation();teams=teams.filter(t=>t.id!==team.id);if(activeTeamId===team.id)activeTeamId=teams[0].id;renderTeams()});card.appendChild(remove)}scorebar.appendChild(card)})}
function addTeam(){const team={id:nextTeamId++,name:'Team '+teamLetter(teams.length),score:0};teams.push(team);activeTeamId=team.id;renderTeams()}
function resetScores(){teams.forEach(t=>t.score=0);activeTeamId=teams[0].id;renderTeams()}
async function loadLevel(){errorBox.style.display='none';categories.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);font-weight:800">Loading questions…</div>';const gameLevel=Number(level.value)||1;const select='id,source_key,prompt_text,correct_answer,metadata,difficulty_rating';const url=`${SUPABASE_URL}/rest/v1/assessment_items?select=${encodeURIComponent(select)}&status=eq.published&item_type=eq.quiz_grid&metadata->>game_level=eq.${gameLevel}&order=difficulty_rating.asc,source_key.asc`;try{const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},cache:'no-store'});if(!res.ok)throw new Error('Database returned '+res.status);rows=await res.json();buildPools()}catch(err){errorBox.textContent='Could not load questions. '+err.message;errorBox.style.display='block';categories.innerHTML=''}}
function buildPools(){pools=new Map();rows.forEach(r=>{const cat=clean(meta(r).game_category),raw=Number(meta(r).game_points);if(!cat||!pointMap[raw])return;if(!pools.has(cat))pools.set(cat,[]);pools.get(cat).push({...r,revealPoints:pointMap[raw],used:false})});const valid=[...pools.entries()].filter(([,items])=>items.length>=5).slice(0,5);pools=new Map(valid.map(([cat,items])=>[cat,shuffle(items)]));if(pools.size!==5){errorBox.textContent='This level does not yet have five complete categories.';errorBox.style.display='block';categories.innerHTML='';return}renderCategories()}
function renderCategories(){categories.innerHTML='';for(const [cat,items] of pools){const left=items.filter(x=>!x.used).length;const card=document.createElement('button');card.type='button';card.className='category-card'+(left===0?' done':'');card.disabled=left===0;const name=document.createElement('div');name.className='cat-name';name.textContent=cat;const count=document.createElement('div');count.className='cat-left';count.textContent=left?`${left} question${left===1?'':'s'} left`:'Complete';card.append(name,count);card.addEventListener('click',()=>drawQuestion(cat));categories.appendChild(card)}const total=[...pools.values()].reduce((n,a)=>n+a.filter(x=>!x.used).length,0);status.textContent=total?`${total} questions left`:'Game complete · '+teams.map(t=>`${t.name} ${t.score}`).join(' · ')}
function drawQuestion(cat){const pool=pools.get(cat)||[];const available=pool.filter(x=>!x.used);if(!available.length)return;const item=available[Math.floor(Math.random()*available.length)];current={cat,item};qCat.textContent=cat;qPoints.textContent=item.revealPoints+' points';qText.textContent=item.prompt_text;aText.textContent=item.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed');modalBack.classList.add('open');$('reveal').focus()}
function reveal(){aText.classList.add('show');modal.classList.add('revealed')}
function resolve(result){if(!current)return;const team=activeTeam(),points=current.item.revealPoints;if(result==='correct')team.score+=points;if(result==='wrong')team.score-=points;current.item.used=true;renderTeams();modalBack.classList.remove('open');current=null;renderCategories()}
$('addTeam').addEventListener('click',addTeam);$('newGame').addEventListener('click',()=>{resetScores();loadLevel()});level.addEventListener('change',()=>{resetScores();loadLevel()});$('reveal').addEventListener('click',reveal);$('correct').addEventListener('click',()=>resolve('correct'));$('wrong').addEventListener('click',()=>resolve('wrong'));$('skip').addEventListener('click',()=>resolve('skip'));$('gameView').addEventListener('click',()=>document.body.classList.add('game-only'));$('exitGame').addEventListener('click',()=>document.body.classList.remove('game-only'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed')){modalBack.classList.remove('open');current=null}else document.body.classList.remove('game-only')}});renderTeams();loadLevel();
})();
</script>
</body>
</html>
