<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willena Category Cards</title>
<style>
:root{--ink:#17223b;--muted:#6b7280;--bg:#f7f8fc;--line:#e5e7eb;--blue:#2458d6;--blue2:#173d9b;--green:#15966a;--red:#d94b5b;--gold:#ffd866}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px}.brand-logo{width:128px;max-width:34vw}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a8192}.title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.control label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.06em}select,.btn,.mode-btn{height:46px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.soft{color:var(--blue);border-color:#cfd8f5}.mode-switch{display:flex;border:1px solid #cfd8f5;border-radius:13px;overflow:hidden;background:#fff;height:46px}.mode-btn{border:0;border-radius:0;height:44px;padding:0 14px;color:#667085}.mode-btn.active{background:var(--blue);color:#fff}.score-section{margin:12px 0 18px}.score-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.team{position:relative;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 68px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}.team.active{border-color:var(--blue);background:#f8faff}.team-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-size:28px;font-weight:950}.rename-team,.remove-team{position:absolute;top:7px;width:27px;height:27px;border-radius:50%;border:0;background:#f0f2f6;color:#6f7685;font-weight:900;display:flex;align-items:center;justify-content:center}.rename-team{right:38px;font-size:13px}.remove-team{right:7px}.board-wrap{overflow-x:auto;padding-bottom:5px}.categories{min-width:760px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.category-card{border:0;border-radius:15px;min-height:112px;padding:12px 10px;background:linear-gradient(155deg,#285fdf,#173d9b);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.13);transition:.12s}.category-card:hover{filter:brightness(1.06);transform:translateY(-1px)}.category-card:active{transform:translateY(1px)}.category-card.used{background:#e5e8ef;color:#9aa0ad;box-shadow:none;cursor:default}.cat-name{font-size:clamp(14px,1.7vw,20px);font-weight:950;line-height:1.08}.status{min-height:22px;margin-top:13px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}.error{display:none;background:#fff0f1;border:1px solid #ffd0d6;color:#9f2333;border-radius:16px;padding:18px;margin:18px 0}.footer{text-align:center;color:#9398a5;font-size:12px;margin-top:18px}.modal-back{position:fixed;inset:0;background:rgba(20,28,48,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-back.open{display:flex}.modal{width:min(820px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 28px 100px rgba(0,0,0,.3)}.qmeta{display:flex;justify-content:space-between;gap:14px;align-items:center}.qcat{font-size:15px;font-weight:900;color:var(--muted)}.qpoints{font-size:clamp(25px,4vw,40px);font-weight:950;color:var(--blue)}.question{font-size:clamp(30px,5vw,50px);font-weight:950;line-height:1.12;letter-spacing:-.03em;text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;margin:18px 0}.answer{display:none;background:#eff9f5;border:1px solid #ccebdd;color:#116c50;border-radius:18px;padding:18px;text-align:center;font-size:clamp(23px,4vw,34px);font-weight:900;margin-bottom:20px}.answer.show{display:block}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.action{min-height:50px;border-radius:14px;border:1px solid var(--line);padding:0 20px;background:#fff;font-weight:900}.reveal{background:var(--blue);border-color:var(--blue);color:#fff}.correct{display:none;background:var(--green);border-color:var(--green);color:#fff}.wrong{display:none;background:var(--red);border-color:var(--red);color:#fff}.skip{display:none}.revealed .reveal{display:none}.revealed .correct,.revealed .wrong,.revealed .skip{display:inline-flex;align-items:center}.exit-game{display:none;position:fixed;top:10px;right:10px;z-index:40;height:40px;border:0;border-radius:11px;background:rgba(23,34,59,.92);color:#fff;padding:0 13px;font-weight:900}.game-only{background:#fff}.game-only .topbar,.game-only .score-actions,.game-only .footer,.game-only .status,.game-only .error{display:none!important}.game-only .app{max-width:none;padding:10px 12px}.game-only .score-section{margin:0 0 8px}.game-only .team{min-height:54px;padding:8px 15px}.game-only .rename-team,.game-only .remove-team{display:none}.game-only .team-score{font-size:26px}.game-only .board-wrap{overflow:hidden;padding:0}.game-only .categories{min-width:0;width:100%;gap:6px}.game-only .category-card{min-height:calc((100vh - 95px)/5);border-radius:10px;padding:7px}.game-only .cat-name{font-size:clamp(13px,1.55vw,19px)}.game-only .exit-game{display:block}
@media(max-width:850px){.topbar{flex-direction:column;align-items:stretch}.controls{display:grid;grid-template-columns:1fr auto}.control,.mode-switch{grid-column:1/-1}.mode-btn{flex:1}.scorebar{grid-template-columns:repeat(2,minmax(0,1fr))}.score-actions{justify-content:stretch}.score-actions .btn{flex:1}}
@media(max-width:540px){.app{padding:14px}.brand-logo{width:100px}.modal{padding:20px}.question{min-height:135px}.team{padding:10px 65px 10px 12px}.team-score{font-size:22px}}
</style>
</head>
<body>
<button class="exit-game" id="exitGame" type="button">Exit Game View</button>
<main class="app">
<header class="topbar">
  <div class="brandline"><img class="brand-logo" src="../../Assets/Images/Logo.png" alt="Willena English"><div><div class="eyebrow">Willena classroom game</div><h1 class="title">Category Cards</h1><div class="sub">25 categories. Pick a card to reveal the question and points.</div></div></div>
  <div class="controls">
    <div class="mode-switch" aria-label="Game mode"><button class="mode-btn" id="toGrid" type="button">Quiz Grid</button><button class="mode-btn active" type="button">Category Cards</button></div>
    <div class="control"><label for="level">Level</label><select id="level"></select></div>
    <button class="btn soft" id="gameView" type="button">Game View</button>
    <button class="btn primary" id="newGame" type="button">New Game</button>
  </div>
</header>
<section class="score-section"><div class="score-actions"><button class="btn soft" id="addTeam" type="button">+ Add Team</button></div><div class="scorebar" id="scorebar"></div></section>
<div class="error" id="error"></div>
<section class="board-wrap"><div class="categories" id="categories"></div></section>
<div class="status" id="status" aria-live="polite"></div>
<div class="footer">Category Cards uses its own question bank in the Willena curriculum database.</div>
</main>
<div class="modal-back" id="modalBack" role="dialog" aria-modal="true"><div class="modal" id="modal"><div class="qmeta"><span class="qcat" id="qCat"></span><span class="qpoints" id="qPoints"></span></div><div class="question" id="qText"></div><div class="answer" id="aText"></div><div class="actions"><button class="action reveal" id="reveal" type="button">Show Answer</button><button class="action correct" id="correct" type="button">✓ Correct</button><button class="action wrong" id="wrong" type="button">✕ Wrong</button><button class="action skip" id="skip" type="button">No Score</button></div></div></div>
<script>
(()=>{'use strict';
const URL='https://gxwfsqxyuufqtitspfqg.supabase.co',KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join(''),$=id=>document.getElementById(id);
const level=$('level'),categories=$('categories'),status=$('status'),errorBox=$('error'),scorebar=$('scorebar'),modalBack=$('modalBack'),modal=$('modal'),qCat=$('qCat'),qPoints=$('qPoints'),qText=$('qText'),aText=$('aText');
for(let i=1;i<=15;i++){const o=document.createElement('option');o.value=i;o.textContent='Level '+i;level.appendChild(o)}const qp=new URLSearchParams(location.search);if(qp.get('level'))level.value=qp.get('level');
let teams=[{id:1,name:'Team A',score:0},{id:2,name:'Team B',score:0}],nextId=3,activeId=1,rows=[],cards=[],current=null;
const clean=v=>String(v??'').trim(),meta=r=>r.metadata&&typeof r.metadata==='object'?r.metadata:{},shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function activeTeam(){return teams.find(t=>t.id===activeId)||teams[0]}function letters(i){let n=i,s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1}while(n>=0);return s}
function renderTeams(){scorebar.innerHTML='';teams.forEach(t=>{const c=document.createElement('div');c.className='team'+(t.id===activeId?' active':'');c.tabIndex=0;c.addEventListener('click',e=>{if(!e.target.closest('button')){activeId=t.id;renderTeams()}});const n=document.createElement('span');n.className='team-name';n.textContent=t.name;const s=document.createElement('span');s.className='team-score';s.textContent=t.score;c.append(n,s);const r=document.createElement('button');r.type='button';r.className='rename-team';r.textContent='✎';r.setAttribute('aria-label','Rename '+t.name);r.addEventListener('click',e=>{e.stopPropagation();const x=prompt('Team name:',t.name);if(x!==null&&clean(x)){t.name=clean(x).slice(0,24);renderTeams()}});c.appendChild(r);if(teams.length>2){const d=document.createElement('button');d.type='button';d.className='remove-team';d.textContent='×';d.setAttribute('aria-label','Remove '+t.name);d.addEventListener('click',e=>{e.stopPropagation();teams=teams.filter(x=>x.id!==t.id);if(activeId===t.id)activeId=teams[0].id;renderTeams()});c.appendChild(d)}scorebar.appendChild(c)})}
function addTeam(){const t={id:nextId++,name:'Team '+letters(teams.length),score:0};teams.push(t);activeId=t.id;renderTeams()}function resetScores(){teams.forEach(t=>t.score=0);activeId=teams[0].id;renderTeams()}
async function load(){errorBox.style.display='none';categories.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:#6b7280;font-weight:800">Loading questions…</div>';status.textContent='';const lv=Number(level.value)||1,sel='id,source_key,prompt_text,correct_answer,metadata,difficulty_rating',u=`${URL}/rest/v1/assessment_items?select=${encodeURIComponent(sel)}&status=eq.published&item_type=eq.category_card&metadata->>game_level=eq.${lv}&order=source_key.asc`;try{const res=await fetch(u,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!res.ok)throw new Error(res.status);rows=await res.json();if(!Array.isArray(rows)||rows.length<25)throw new Error('Only '+(rows?.length||0)+' cards found');build()}catch(e){errorBox.textContent='Could not load Category Cards. '+e.message;errorBox.style.display='block';categories.innerHTML=''}}
function build(){const byCat=new Map();rows.forEach(r=>{const cat=clean(meta(r).game_category),points=Number(meta(r).card_points);if(cat&&!byCat.has(cat)&&[100,200,300,500,1000].includes(points))byCat.set(cat,{...r,category:cat,points,used:false})});if(byCat.size<25){errorBox.textContent='This level only has '+byCat.size+' distinct categories.';errorBox.style.display='block';categories.innerHTML='';return}cards=shuffle([...byCat.values()].slice(0,25));renderCards()}
function renderCards(){categories.innerHTML='';cards.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='category-card'+(item.used?' used':'');b.disabled=item.used;const n=document.createElement('div');n.className='cat-name';n.textContent=item.category;b.appendChild(n);b.addEventListener('click',()=>openCard(item));categories.appendChild(b)});const left=cards.filter(x=>!x.used).length;status.textContent=left?`${left} categories left`:'Game complete · '+teams.map(t=>`${t.name} ${t.score}`).join(' · ')}
function openCard(item){if(!item||item.used)return;current=item;qCat.textContent=item.category;qPoints.textContent=item.points+' points';qText.textContent=item.prompt_text;aText.textContent=item.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed');modalBack.classList.add('open');$('reveal').focus()}
function reveal(){aText.classList.add('show');modal.classList.add('revealed');$('correct').focus()}
function resolve(result){if(!current)return;const t=activeTeam(),p=current.points;if(result==='correct')t.score+=p;if(result==='wrong')t.score-=p;current.used=true;renderTeams();modalBack.classList.remove('open');current=null;renderCards()}
function closeModal(){modalBack.classList.remove('open');current=null}
$('addTeam').onclick=addTeam;$('newGame').onclick=()=>{resetScores();load()};level.onchange=()=>{resetScores();load()};$('reveal').onclick=reveal;$('correct').onclick=()=>resolve('correct');$('wrong').onclick=()=>resolve('wrong');$('skip').onclick=()=>resolve('skip');$('gameView').onclick=()=>document.body.classList.add('game-only');$('exitGame').onclick=()=>document.body.classList.remove('game-only');$('toGrid').onclick=()=>{location.href='./?level='+encodeURIComponent(level.value)};modalBack.addEventListener('click',e=>{if(e.target===modalBack&&modal.classList.contains('revealed'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed'))closeModal();else document.body.classList.remove('game-only')}});renderTeams();load();})();
</script>
</body>
</html>
