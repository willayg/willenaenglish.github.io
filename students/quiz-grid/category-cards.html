function iconSvg(cat){const c=cat.toLowerCase();let d='<circle cx="24" cy="24" r="14"/><path d="M16 24h16M24 16v16"/>';if(c.includes('animal'))d='<circle cx="24" cy="25" r="11"/><path d="M16 17l-4-6 8 2M32 17l4-6-8 2M19 30c3 2 7 2 10 0"/>';else if(c.includes('food'))d='<path d="M12 20h24l-3 17H15zM18 20c0-8 12-8 12 0"/>';else if(c.includes('world'))d='<circle cx="24" cy="24" r="16"/><path d="M8 24h32M24 8c6 7 6 25 0 32"/>';else if(c.includes('sport'))d='<circle cx="24" cy="24" r="14"/><path d="M14 14l20 20M34 14L14 34"/>';else if(c.includes('science'))d='<path d="M18 8v11L10 36h28l-8-17V8M15 29h18"/>';else if(c.includes('music'))d='<path d="M17 34V14l16-4v20"/><circle cx="13" cy="34" r="4"/><circle cx="29" cy="30" r="4"/>';else if(c.includes('job'))d='<path d="M14 18h20v18H14zM18 18v-4h12v4M22 26h4"/>';else if(c.includes('space'))d='<path d="M25 8c8 5 10 13 6 21l-7 10-7-10c-4-8-2-16 6-21zM16 29l-5 6M32 29l5 6"/>';else if(c.includes('book')||c.includes('school'))d='<path d="M8 12h14c4 0 6 2 6 6v20c0-4-2-6-6-6H8zM40 12H26c-4 0-6 2-6 6"/>';return `<svg class="cat-icon" viewBox="0 0 48 48" aria-hidden="true">${d}</svg>`}
function ensureAudio(){if(!soundOn)return null;if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C()}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,dur=.1,type='triangle',vol=.055,delay=0,endFreq=null){const ctx=ensureAudio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.04)}function sound(kind){if(!soundOn)return;if(kind==='tap'){tone(310,.07,'square',.035,0,410);tone(620,.055,'triangle',.026,.045)}else if(kind==='reveal'){tone(360,.09,'triangle',.045);tone(510,.09,'triangle',.05,.065);tone(720,.14,'sine',.055,.135)}else if(kind==='correct'){tone(392,.11,'triangle',.055);tone(523,.12,'triangle',.06,.07);tone(659,.14,'triangle',.065,.14);tone(784,.18,'sine',.07,.22);tone(1047,.24,'sine',.055,.3)}else if(kind==='wrong'){tone(260,.18,'sawtooth',.05,0,175);tone(170,.24,'square',.035,.13,115)}else if(kind==='new'){tone(330,.08,'triangle',.04);tone(440,.08,'triangle',.045,.055);tone(554,.09,'triangle',.05,.11);tone(659,.14,'sine',.055,.17);tone(880,.18,'sine',.05,.25)}}
function flagCode(text){const a=Array.from(text);if(a.length<2)return null;const x=a[0].codePointAt(0),y=a[1].codePointAt(0);if(x<0x1F1E6||x>0x1F1FF||y<0x1F1E6||y>0x1F1FF)return null;return String.fromCharCode(65+x-0x1F1E6,65+y-0x1F1E6)}function flagSvg(code){if(code==='JP')return '<svg class="flag-svg" viewBox="0 0 300 200" aria-label="Flag of Japan"><rect width="300" height="200" fill="#fff"/><circle cx="150" cy="100" r="60" fill="#bc002d"/></svg>';if(code==='KR')return '<svg class="flag-svg" viewBox="0 0 300 200" aria-label="Flag of South Korea"><rect width="300" height="200" fill="#fff"/><g transform="translate(150 100) rotate(-28)"><path d="M-42 0a42 42 0 0 1 84 0a21 21 0 0 0-42 0a21 21 0 0 1-42 0" fill="#cd2e3a"/><path d="M42 0a42 42 0 0 1-84 0a21 21 0 0 0 42 0a21 21 0 0 1 42 0" fill="#0047a0"/></g><g fill="#111"><g transform="translate(67 43) rotate(-32)"><rect x="-27" y="-11" width="54" height="7"/><rect x="-27" y="0" width="54" height="7"/><rect x="-27" y="11" width="54" height="7"/></g><g transform="translate(233 157) rotate(-32)"><rect x="-27" y="-11" width="21" height="7"/><rect x="6" y="-11" width="21" height="7"/><rect x="-27" y="0" width="54" height="7"/><rect x="-27" y="11" width="21" height="7"/><rect x="6" y="11" width="21" height="7"/></g><g transform="translate(233 43) rotate(32)"><rect x="-27" y="-11" width="21" height="7"/><rect x="6" y="-11" width="21" height="7"/><rect x="-27" y="0" width="21" height="7"/><rect x="6" y="0" width="21" height="7"/><rect x="-27" y="11" width="54" height="7"/></g><g transform="translate(67 157) rotate(32)"><rect x="-27" y="-11" width="54" height="7"/><rect x="-27" y="0" width="21" height="7"/><rect x="6" y="0" width="21" height="7"/><rect x="-27" y="11" width="54" height="7"/></g></g></svg>';return null}function renderQuestion(text){const code=flagCode(text),svg=code&&flagSvg(code);if(svg){const rest=Array.from(text).slice(2).join('').trim();qText.innerHTML=`<div class="flag-question">${svg}<span class="flag-copy function activeTeam(){return teams.find(t=>t.id===activeId)||teams[0]}function letters(i){let n=i,s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1}while(n>=0);return s}function renderTeams(popId=null){scorebar.innerHTML='';teams.forEach(t=>{const c=document.createElement('div');c.className='team'+(t.id===activeId?' active':'')+(t.id===popId?' score-pop':'');c.tabIndex=0;c.addEventListener('click',e=>{if(!e.target.closest('button')){activeId=t.id;renderTeams();sound('tap')}});const n=document.createElement('span');n.className='team-name';n.textContent=t.name;const s=document.createElement('span');s.className='team-score';s.textContent=t.score;c.append(n,s);const r=document.createElement('button');r.type='button';r.className='rename-team';r.textContent='✎';r.onclick=e=>{e.stopPropagation();const x=prompt('Team name:',t.name);if(x!==null&&clean(x)){t.name=clean(x).slice(0,24);renderTeams()}};c.appendChild(r);if(teams.length>2){const d=document.createElement('button');d.type='button';d.className='remove-team';d.textContent='×';d.onclick=e=>{e.stopPropagation();teams=teams.filter(x=>x.id!==t.id);if(activeId===t.id)activeId=teams[0].id;renderTeams()};c.appendChild(d)}scorebar.appendChild(c)})}function addTeam(){const t={id:nextId++,name:'Team '+letters(teams.length),score:0};teams.push(t);activeId=t.id;renderTeams();sound('tap')}function resetScores(){teams.forEach(t=>t.score=0);activeId=teams[0].id;renderTeams()}
async function load(){errorBox.style.display='none';categories.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:#6b7280;font-weight:800">Loading questions…</div>';status.textContent='';const lv=Number(level.value)||1,sel='id,source_key,prompt_text,correct_answer,metadata,difficulty_rating',u=`${URL}/rest/v1/assessment_items?select=${encodeURIComponent(sel)}&status=eq.published&item_type=eq.category_card&metadata->>game_level=eq.${lv}&order=source_key.asc`;try{const res=await fetch(u,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!res.ok)throw new Error(res.status);rows=await res.json();if(!Array.isArray(rows)||rows.length<25)throw new Error('Only '+(rows?.length||0)+' cards found');build()}catch(e){errorBox.textContent='Could not load Category Cards. '+e.message;errorBox.style.display='block';categories.innerHTML=''}}function build(){const byCat=new Map();rows.forEach(r=>{const cat=clean(meta(r).game_category),points=Number(meta(r).card_points);if(cat&&!byCat.has(cat)&&[100,200,300,500,1000].includes(points))byCat.set(cat,{...r,category:cat,points,used:false})});if(byCat.size<25){errorBox.textContent='This level only has '+byCat.size+' distinct categories.';errorBox.style.display='block';categories.innerHTML='';return}cards=shuffle([...byCat.values()].slice(0,25));renderCards()}function renderCards(){categories.innerHTML='';cards.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='category-card'+(item.used?' used':'');b.disabled=item.used;b.style.setProperty('--card-color',palette[i]);b.style.animationDelay=Math.min(i*18,250)+'ms';b.innerHTML=iconSvg(item.category);const n=document.createElement('div');n.className='cat-name';n.textContent=item.category;b.appendChild(n);b.onclick=()=>openCard(item);categories.appendChild(b)});const left=cards.filter(x=>!x.used).length;status.textContent=left?`${left} categories left`:'Game complete · '+teams.map(t=>`${t.name} ${t.score}`).join(' · ')}function openCard(item){if(!item||item.used)return;sound('tap');current=item;qCat.textContent=item.category;qPoints.textContent=item.points+' points';renderQuestion(item.prompt_text);aText.textContent=item.correct_answer;aText.classList.remove('show');modal.classList.remove('revealed','correct-hit','wrong-hit');modalBack.classList.add('open');$('reveal').focus()}function reveal(){sound('reveal');aText.classList.add('show');modal.classList.add('revealed');$('correct').focus()}function confetti(){burst.innerHTML='';for(let i=0;i<46;i++){const p=document.createElement('i');p.className='confetti';p.style.left=(44+Math.random()*12)+'%';p.style.top=(40+Math.random()*8)+'%';p.style.background=palette[i%palette.length];p.style.setProperty('--x',((Math.random()-.5)*620)+'px');p.style.setProperty('--y',(170+Math.random()*360)+'px');p.style.setProperty('--r',((Math.random()-.5)*900)+'deg');p.style.animationDelay=(Math.random()*.08)+'s';burst.appendChild(p)}setTimeout(()=>burst.innerHTML='',950)}function resolve(result){if(!current)return;const t=activeTeam(),p=current.points;if(result==='correct'){t.score+=p;sound('correct');modal.classList.remove('wrong-hit');void modal.offsetWidth;modal.classList.add('correct-hit');confetti()}else if(result==='wrong'){t.score-=p;sound('wrong');modal.classList.remove('correct-hit');void modal.offsetWidth;modal.classList.add('wrong-hit')}current.used=true;renderTeams(t.id);setTimeout(()=>{modalBack.classList.remove('open');modal.classList.remove('correct-hit','wrong-hit');current=null;renderCards()},result==='skip'?0:520)}function closeModal(){modalBack.classList.remove('open');current=null}
$('addTeam').onclick=addTeam;$('newGame').onclick=()=>{resetScores();sound('new');load()};level.onchange=()=>{resetScores();sound('new');load()};$('reveal').onclick=reveal;$('correct').onclick=()=>resolve('correct');$('wrong').onclick=()=>resolve('wrong');$('skip').onclick=()=>resolve('skip');$('gameView').onclick=()=>{document.body.classList.add('game-only');sound('tap')};$('exitGame').onclick=()=>document.body.classList.remove('game-only');$('toGrid').onclick=()=>location.href='./?level='+encodeURIComponent(level.value);$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)sound('new')};modalBack.onclick=e=>{if(e.target===modalBack&&modal.classList.contains('revealed'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalBack.classList.contains('open')&&modal.classList.contains('revealed'))closeModal();else document.body.classList.remove('game-only')}});renderTeams();load();})();
</script>
