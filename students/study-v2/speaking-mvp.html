<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Willena Speaking MVP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#66d6df;--cyan2:#25b8c4;--pink:#ff0a8a;--pink2:#e60076;--ink:#173f46;--muted:#6e858a;--line:#d8ecef;--soft:#e9fbfc;--bg:#dff7f8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff7f8,#f7fbfc);font-family:Poppins,sans-serif;color:var(--ink)}
.wrap{width:min(760px,100%);margin:auto;padding:18px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:1.25rem;margin:0}.pill{border:2px solid var(--cyan);background:#fff;color:var(--pink2);border-radius:999px;padding:7px 11px;font-weight:800;font-size:.72rem}
.progress{display:flex;gap:7px;margin-bottom:18px}.dot{height:7px;flex:1;border-radius:99px;background:#cfecef}.dot.on{background:var(--pink)}
.card{background:#fff;border:3px solid var(--cyan);border-radius:28px;padding:22px;box-shadow:0 10px 24px rgba(29,95,104,.08)}
.kicker{display:inline-flex;background:var(--soft);border-radius:999px;padding:7px 11px;font-size:.72rem;font-weight:800;color:var(--cyan2);margin-bottom:14px}.mode{font-size:.78rem;color:var(--pink2);font-weight:800;margin-bottom:5px}.prompt{font-size:clamp(1.45rem,5vw,2.3rem);line-height:1.25;font-weight:800;margin:0 0 12px}.help{margin:0 0 18px;color:var(--muted);font-size:.9rem;line-height:1.5}.target{padding:12px 14px;border:2px dashed var(--line);border-radius:15px;background:#fbfeff;margin-bottom:18px}.target strong{display:block;font-size:.76rem;color:var(--muted);margin-bottom:3px}.target span{font-weight:700}
.microw{display:flex;justify-content:center;margin:18px 0}.mic{width:92px;height:92px;border:none;border-radius:50%;background:var(--pink);color:#fff;font-size:2rem;box-shadow:0 0 0 9px rgba(255,10,138,.09);font-weight:800}.mic.listening{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 18px rgba(255,10,138,.13);transform:scale(1.03)}}.mic:disabled{opacity:.45}
.status{text-align:center;min-height:24px;color:var(--muted);font-weight:700;font-size:.86rem}.heard{margin-top:16px;padding:15px;border-radius:17px;background:#f5fafb;border:2px solid var(--line);display:none}.heard.show{display:block}.heard small{display:block;color:var(--muted);font-weight:700;margin-bottom:4px}.heard strong{font-size:1.03rem}.feedback{margin-top:12px;padding:13px 14px;border-radius:15px;font-weight:700;display:none}.feedback.show{display:block}.feedback.good{background:#edfff6;border:2px solid #a7ebca}.feedback.retry{background:#fff7fb;border:2px solid #ffc8e4}.feedback.neutral{background:#f4fbfc;border:2px solid #bfe8ec}
.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border-radius:15px;padding:13px 14px;font-weight:800;font-family:inherit}.secondary{border:2px solid var(--cyan);background:#fff;color:var(--pink2)}.primary{border:2px solid var(--pink);background:var(--pink);color:#fff}.btn[hidden]{display:none}
.debug{margin-top:16px;color:var(--muted);font-size:.72rem;text-align:center}.unsupported{background:#fff7f7;border:2px solid #efc4c4;border-radius:16px;padding:14px;margin-bottom:16px;display:none}.unsupported.show{display:block}
@media(max-width:520px){.card{padding:18px 16px;border-radius:24px}.mic{width:82px;height:82px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Speaking MVP</h1><span class="pill">Browser STT</span></div>
  <div id="unsupported" class="unsupported">Speech recognition is not available in this browser. Try Chrome on Android or desktop Chrome.</div>
  <div class="progress"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div>
  <section class="card">
    <span class="kicker" id="kicker">1 of 3</span>
    <div class="mode" id="mode">REPEAT</div>
    <h2 class="prompt" id="prompt">Say: “I went to the zoo.”</h2>
    <p class="help" id="help">Tap the microphone and repeat the sentence.</p>
    <div class="target" id="target"><strong>Target</strong><span>I went to the zoo.</span></div>
    <div class="microw"><button class="mic" id="mic" type="button" aria-label="Start speaking">🎤</button></div>
    <div class="status" id="status">Tap to speak</div>
    <div class="heard" id="heard"><small>I heard</small><strong id="heardText"></strong></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn secondary" id="retry" type="button" hidden>Try again</button><button class="btn primary" id="next" type="button" hidden>Next</button></div>
    <div class="debug" id="debug"></div>
  </section>
</div>
<script>
(function(){
'use strict';
var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
var mic=document.getElementById('mic'),status=document.getElementById('status'),heard=document.getElementById('heard'),heardText=document.getElementById('heardText'),feedback=document.getElementById('feedback'),retry=document.getElementById('retry'),next=document.getElementById('next'),debug=document.getElementById('debug');
var prompt=document.getElementById('prompt'),help=document.getElementById('help'),target=document.getElementById('target'),mode=document.getElementById('mode'),kicker=document.getElementById('kicker'),dots=Array.from(document.querySelectorAll('.dot'));
var tasks=[
 {type:'repeat',mode:'REPEAT',prompt:'Say: “I went to the zoo.”',help:'Tap the microphone and repeat the sentence.',target:'I went to the zoo.',score:function(t){return similarity(t,'I went to the zoo')>=.72;}},
 {type:'controlled',mode:'CONTROLLED RESPONSE',prompt:'What do you want to be?',help:'Answer with “I want to be…” and choose your own job.',target:'Example: I want to be a scientist.',score:function(t){var n=norm(t);return /^i want to be\b/.test(n)&&n.split(' ').length>=5;}},
 {type:'open',mode:'OPEN RESPONSE',prompt:'What did you do last weekend?',help:'Give a short answer in English. There is more than one correct answer.',target:'Example: I played soccer with my friends.',score:function(t){var n=norm(t),words=n.split(' ').filter(Boolean);var past=/\b(went|played|watched|visited|ate|saw|had|did|made|stayed|studied|read|bought|met|was|were|walked|helped|cleaned|cooked)\b/.test(n)||/\b\w+ed\b/.test(n);return words.length>=3&&past;}}
];
var index=0,recognition=null,listening=false,lastConfidence=null;
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();}
function similarity(a,b){a=norm(a).split(' ');b=norm(b).split(' ');if(!a.length||!b.length)return 0;var hits=0,used={};a.forEach(function(w){for(var i=0;i<b.length;i++){if(!used[i]&&(w===b[i]||(w==='wanna'&&b[i]==='want'))){used[i]=1;hits++;break;}}});return hits/Math.max(a.length,b.length);}
function render(){var t=tasks[index];kicker.textContent=(index+1)+' of '+tasks.length;mode.textContent=t.mode;prompt.textContent=t.prompt;help.textContent=t.help;target.querySelector('span').textContent=t.target;dots.forEach(function(d,i){d.classList.toggle('on',i<=index);});resetResult();next.textContent=index===tasks.length-1?'Finish':'Next';}
function resetResult(){heard.classList.remove('show');feedback.className='feedback';feedback.textContent='';retry.hidden=true;next.hidden=true;status.textContent='Tap to speak';debug.textContent='';mic.disabled=!SpeechRecognition;}
function showFeedback(kind,text){feedback.className='feedback show '+kind;feedback.textContent=text;retry.hidden=false;next.hidden=false;}
function start(){if(!SpeechRecognition||listening)return;recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=3;listening=true;mic.classList.add('listening');status.textContent='Listening…';retry.hidden=true;next.hidden=true;feedback.className='feedback';heard.classList.remove('show');
 recognition.onresult=function(e){var alts=e.results&&e.results[0];if(!alts||!alts.length){neutral('I didn’t catch that. Try again.');return;}var best=alts[0];lastConfidence=typeof best.confidence==='number'?best.confidence:null;var transcript=best.transcript||'';heardText.textContent=transcript;heard.classList.add('show');debug.textContent=lastConfidence!=null?'Browser confidence: '+Math.round(lastConfidence*100)+'%':'';var ok=tasks[index].score(transcript);if(ok)showFeedback('good','✓ Good answer');else if(lastConfidence!=null&&lastConfidence<.35)neutral('I’m not sure I heard that correctly. Try again.');else showFeedback('retry','Try that once more.');};
 recognition.onerror=function(e){var neutralErrors=['no-speech','audio-capture','network','aborted'];var msg=e&&e.error||'recognition error';if(neutralErrors.indexOf(msg)>=0)neutral('I couldn’t hear that clearly. Try again.');else neutral('Speech recognition had a problem. Try again.');debug.textContent='STT: '+msg;};
 recognition.onend=function(){listening=false;mic.classList.remove('listening');if(status.textContent==='Listening…')status.textContent='Tap to speak';};
 try{recognition.start();}catch(e){listening=false;mic.classList.remove('listening');neutral('Couldn’t start the microphone. Try again.');}
}
function neutral(text){showFeedback('neutral',text);status.textContent='Tap to speak';}
mic.addEventListener('click',start);retry.addEventListener('click',function(){resetResult();start();});next.addEventListener('click',function(){if(index<tasks.length-1){index++;render();}else{feedback.className='feedback show good';feedback.textContent='✓ MVP complete — all three speaking types tested.';next.hidden=true;retry.hidden=true;mic.disabled=true;status.textContent='Done';}});
if(!SpeechRecognition){document.getElementById('unsupported').classList.add('show');mic.disabled=true;status.textContent='Speech recognition unavailable';}
render();
})();
</script>
</body>
</html>
