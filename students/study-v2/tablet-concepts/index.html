<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Study V2 · Daily Hero Concepts</title>
<style>
:root{--pink:#ff6fb0;--cyan:#21b3be;--orange:#d9923b;--blue:#5b7fe5;--ink:#35565b;--muted:#7c8c91;--line:#dfe8ea;--bg:#eef3f4;--white:#fff;--sp:#fff3f8;--sc:#eefafb;--so:#fff8ee;--sb:#f3f5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dde7e9;color:var(--ink)}button{font:inherit}.shell{min-height:100vh;padding:14px;background:linear-gradient(180deg,#eef4f5,#e5edef)}
.nav{position:sticky;top:0;z-index:30;max-width:1320px;margin:0 auto 12px;padding:11px 13px;border:1px solid #d5e0e2;border-radius:20px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 7px 24px rgba(39,75,82,.08)}.navline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.nav strong{font-size:17px}.nav small{color:var(--muted);font-weight:750}.tabs{display:flex;gap:7px;overflow:auto}.tab{flex:0 0 auto;border:1px solid #d9e3e5;border-radius:999px;background:#fff;color:#687e83;padding:8px 12px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{max-width:1320px;margin:0 auto;min-height:760px;border:1px solid #d5e0e2;border-radius:27px;background:var(--bg);overflow:hidden;box-shadow:0 16px 48px rgba(35,70,76,.12)}.head{height:68px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dce6e8}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:900}.headright{display:flex;gap:8px}.pill{padding:8px 12px;border-radius:999px;background:#f4f8f9;color:#62797e;font-size:11px;font-weight:850}.pill.points{background:#fff1f6;color:#d95090}
.concept{display:none;padding:22px}.concept.active{display:block}.title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:15px}.title h1{font-size:22px;margin:0 0 3px}.title p{margin:0;color:var(--muted);font-size:12px;font-weight:700}.num{font-size:42px;line-height:1;color:#c7d6d9;font-weight:950}
.card{background:#fff;border:1px solid var(--line);border-radius:23px;box-shadow:0 7px 22px rgba(45,78,84,.05)}.hero{position:relative;overflow:hidden}.hero h2,.hero h3{margin:0}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;font-weight:750}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:950;color:var(--pink);margin-bottom:7px}.row{display:flex;align-items:center;gap:14px}.grow{flex:1;min-width:0}.icon{width:54px;height:54px;flex:0 0 54px;border-radius:18px;display:grid;place-items:center}.icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.pink .icon{background:var(--sp);color:var(--pink)}.cyan .icon{background:var(--sc);color:var(--cyan)}.orange .icon{background:var(--so);color:var(--orange)}.blue .icon{background:var(--sb);color:var(--blue)}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px;border-radius:50%;background:conic-gradient(var(--pink) 0 70%,#f5d5e4 70%)}.ring:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}.ring span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:var(--pink);font-size:15px;font-weight:950}.ring.sm{width:68px;height:68px;flex-basis:68px}.ring.sm:after{inset:8px}.ring.sm span{font-size:11px}
.actions{display:grid;gap:10px}.action{padding:14px 15px;min-height:80px;display:flex;align-items:center;gap:12px}.action strong{font-size:13px}.action small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:750}.action .icon{width:44px;height:44px;flex-basis:44px;border-radius:15px}.action .icon svg{width:24px;height:24px}.pink{border-color:var(--pink)}.cyan{border-color:var(--cyan)}.orange{border-color:var(--orange)}.blue{border-color:var(--blue)}
.book{padding:18px}.book h3{font-size:18px}.book-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tabs-mini{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:7px 9px;border-radius:999px;background:#f5f8f9;color:#74898e;font-size:9px;font-weight:900}.mini.on{background:var(--sc);color:var(--cyan)}.units{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.unit{padding:7px 10px;border:2px solid var(--cyan);border-radius:11px;background:#fff;font-size:10px;font-weight:900}.unit.on{background:var(--sp);color:var(--pink)}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.skill{padding:10px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:9px;font-weight:900}.skill:nth-child(4n+1){border-color:var(--pink)}.skill:nth-child(4n+2){border-color:var(--cyan)}.skill:nth-child(4n+3){border-color:var(--orange)}.skill:nth-child(4n){border-color:var(--blue)}.bar{height:6px;border-radius:999px;background:#e9f0f1;margin-top:7px;overflow:hidden}.fill{height:100%;border-radius:999px;background:currentColor}.skill:nth-child(4n+1){color:var(--pink)}.skill:nth-child(4n+2){color:var(--cyan)}.skill:nth-child(4n+3){color:var(--orange)}.skill:nth-child(4n){color:var(--blue)}.skill b{color:var(--ink)}
.ai{padding:17px}.ai-line{display:flex;gap:10px;align-items:flex-start}.bot{width:42px;height:42px;border-radius:14px;background:var(--sc);color:var(--cyan);display:grid;place-items:center;font-weight:950}.bubble{flex:1;background:#f5f9fa;border-radius:15px;padding:11px 12px;font-size:10px;font-weight:750;line-height:1.45}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 8px;border:1px solid #dce6e8;border-radius:999px;background:#fff;font-size:8px;font-weight:900;color:#667c81}
.progress-strip{display:flex;gap:7px;margin-top:15px}.dot{height:7px;border-radius:999px;background:#e5ecee;flex:1}.dot.done{background:var(--pink)}.cta{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:var(--pink);color:#fff;padding:11px 16px;font-size:11px;font-weight:900}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.c1{display:grid;grid-template-columns:1.45fr .9fr;gap:14px}.c1 .hero{padding:25px;min-height:220px;display:flex;align-items:center}.c1 .hero h2{font-size:26px}.c1 .side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c1 .side .blue{grid-column:1/-1}.below2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.c2hero{padding:24px;display:grid;grid-template-columns:1.1fr .7fr;gap:18px;align-items:center;min-height:220px}.c2hero .rightbox{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini-action{padding:13px;border-radius:17px;background:#fff;border:1px solid var(--line)}.mini-action b{font-size:11px}.mini-action span{display:block;color:var(--muted);font-size:9px;font-weight:800;margin-top:4px}.c2bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.c3top{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.c3hero{padding:24px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between}.c3hero .hero-foot{display:flex;align-items:center;gap:14px}.c3actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c3actions .blue{grid-column:1/-1}.c3bottom{margin-top:14px}
.c4hero{padding:22px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;min-height:150px}.c4hero .bigcopy h2{font-size:25px}.c4dock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.c4main{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
.c5wrap{display:grid;grid-template-columns:1.55fr .75fr;gap:14px}.c5hero{padding:28px;min-height:310px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#fff 0,#fff 62%,#fff1f7 100%)}.c5hero h2{font-size:30px}.c5hero .hero-bottom{display:flex;align-items:end;justify-content:space-between;gap:20px}.c5stack{display:flex;flex-direction:column;gap:10px}.c5stack .action{flex:1}.c5lower{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px;margin-top:14px}
.c6hero{padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px}.c6left{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.c6right{display:flex;gap:8px;align-items:center}.quicktile{width:102px;min-height:92px;border-radius:17px;border:1px solid var(--line);background:#fff;padding:12px}.quicktile b{font-size:10px}.quicktile span{display:block;margin-top:5px;color:var(--muted);font-size:8px;font-weight:800}.c6main{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.c7hero{display:grid;grid-template-columns:230px 1fr;min-height:250px}.c7rail{background:linear-gradient(180deg,#fff3f8,#fff);padding:22px;border-right:1px solid #f3d7e4}.c7rail h2{font-size:21px}.c7rail .ring{margin:18px auto 0}.c7body{padding:22px}.c7buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.c7main{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}
.c8hero{padding:16px;display:grid;grid-template-columns:1.3fr auto 1fr;gap:13px;align-items:center}.c8hero h2{font-size:20px}.c8actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.c8actions .blue{grid-column:1/-1}.c8actions .action{min-height:60px;padding:9px}.c8actions .action .icon{width:34px;height:34px;flex-basis:34px}.c8actions .action small{display:none}.c8bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.c8bottom .book,.c8bottom .ai{padding:14px}
.c9hero{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.c9mission{display:flex;align-items:center;gap:15px}.c9journey{padding:17px;border-radius:19px;background:#f8fbfb}.milestones{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:11px}.mile{height:46px;border-radius:12px;background:#edf2f3;display:grid;place-items:center;font-size:9px;font-weight:900;color:#8ca0a4}.mile.on{background:var(--sp);color:var(--pink);border:1px solid #ffc6df}.c9grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.c9lower{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.c10grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c10hero{grid-column:span 7;padding:25px;min-height:238px;display:flex;flex-direction:column;justify-content:space-between}.c10hero .top{display:flex;align-items:center;gap:15px}.c10actions{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:10px}.c10actions .blue{grid-column:1/-1}.c10book{grid-column:span 8}.c10ai{grid-column:span 4}.c10hero .footerline{display:flex;align-items:center;justify-content:space-between;gap:15px}
.viewport-note{display:none;max-width:1320px;margin:0 auto 10px;padding:10px 13px;border-radius:14px;background:#fff8e9;color:#805c23;border:1px solid #f2d79b;font-size:11px;font-weight:800}
@media(max-width:980px) and (orientation:landscape){.shell{padding:8px}.nav{margin-bottom:8px;padding:8px 10px}.navline{margin-bottom:6px}.stage{border-radius:20px;min-height:0}.head{height:54px;padding:0 16px}.logo{width:32px;height:32px}.concept{padding:12px}.title{margin-bottom:10px}.title h1{font-size:17px}.title p{font-size:9px}.num{font-size:30px}.ring{width:70px;height:70px;flex-basis:70px}.hero h2,.c1 .hero h2,.c4hero .bigcopy h2,.c5hero h2{font-size:20px}.c1 .hero,.c2hero,.c3hero,.c5hero{min-height:180px;padding:16px}.action{min-height:62px;padding:9px}.action small{display:none}.book,.ai{padding:13px}.skills{gap:5px}.skill{padding:7px}.below2,.c2bottom,.c4main,.c5lower,.c6main,.c7main,.c8bottom,.c9lower{gap:10px;margin-top:10px}.c5wrap,.c1,.c3top{gap:10px}.c7hero{grid-template-columns:180px 1fr;min-height:190px}.c7rail,.c7body{padding:15px}.c10grid{gap:8px}.c10hero{min-height:190px;padding:16px}.c10actions{gap:7px}}
@media(max-width:680px) and (orientation:portrait){.viewport-note{display:block}.stage{min-width:760px}.shell{overflow-x:auto}.nav{min-width:760px}}
</style>
</head>
<body>
<div class="shell">
  <div class="viewport-note">These concepts are intended for wide tablets and landscape phones. Portrait phone keeps the current Study layout.</div>
  <div class="nav"><div class="navline"><div><strong>Study V2 · Daily Hero Concepts</strong><br><small>10 developments of concept 05 · visual only</small></div><small id="counter">Concept 1 / 10</small></div><div class="tabs" id="tabs"></div></div>
  <div class="stage"><header class="head"><div class="brand"><div class="logo">W</div><span>Study</span></div><div class="headright"><span class="pill points">★ 1,420</span><span class="pill">William A</span></div></header><main id="concepts"></main></div>
</div>
<script>
(function(){
const I={clock:`<svg viewBox="0 0 24 24"><path d="M7 3h10M9 3v3M15 3v3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5"/></svg>`,bot:`<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="4"/><path d="M12 3v3M8 12h.01M16 12h.01M9 15h6"/></svg>`,chart:`<svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l3-3 2 2 5-6 2 2M16 7h3v3"/></svg>`,book:`<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21.5z"/></svg>`};
const ring=(sm='')=>`<div class="ring ${sm}"><span>14/20</span></div>`;
const act=(c,ic,t,s)=>`<div class="card action ${c}"><div class="icon">${I[ic]}</div><div class="grow"><strong>${t}</strong><small>${s}</small></div></div>`;
const dailyCopy=()=>`<div class="eyebrow">Today</div><h2>데일리 스터디</h2><p>오늘 목표까지 6문제 남았어요 · 4일 연속 학습 중</p><div class="progress-strip"><i class="dot done"></i><i class="dot done"></i><i class="dot done"></i><i class="dot"></i><i class="dot"></i></div>`;
const book=()=>`<div class="card book"><div class="book-top"><div><div class="eyebrow" style="color:var(--cyan)">Current book</div><h3>Come On Everyone 5</h3><p>Unit 6 · Around Town</p></div><div class="tabs-mini"><span class="mini on">Course</span><span class="mini">Reading</span></div></div><div class="units"><span class="unit">U4</span><span class="unit">U5</span><span class="unit on">U6</span><span class="unit">U7</span><span class="unit">U8</span></div><div class="skills"><div class="skill"><b>Vocab</b><div class="bar"><div class="fill" style="width:82%"></div></div></div><div class="skill"><b>Grammar</b><div class="bar"><div class="fill" style="width:68%"></div></div></div><div class="skill"><b>Listening</b><div class="bar"><div class="fill" style="width:74%"></div></div></div><div class="skill"><b>Sentence</b><div class="bar"><div class="fill" style="width:56%"></div></div></div></div></div>`;
const ai=()=>`<div class="card ai"><div class="eyebrow" style="color:var(--cyan)">AI Coach</div><div class="ai-line"><div class="bot">AI</div><div class="bubble">문장 만들기는 좋아지고 있어요. 오늘은 듣기와 어순을 조금 더 연습해 볼까요?</div></div><div class="chips"><span class="chip">듣기 5문제</span><span class="chip">어순 연습</span><span class="chip">약점 복습</span></div></div>`;
const concepts=[
{n:'01',name:'Hero + Action Grid',desc:'Original Daily Hero idea, tightened into a clear 2-column tablet dashboard.',html:`<div class="c1"><div class="card hero pink"><div class="row" style="width:100%"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div>${ring()}</div></div><div class="side">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','단원 · 영역')}${act('blue','book','교재 공부','공부 모드')}</div></div><div class="below2">${book()}${ai()}</div>`},
{n:'02',name:'Daily Mission Panel',desc:'Daily owns the whole first row; the other three actions live inside the hero.',html:`<div class="card hero c2hero pink"><div class="row"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}<div style="margin-top:15px"><button class="cta">계속 공부하기</button></div></div>${ring()}</div><div class="rightbox"><div class="mini-action"><b>AI 코치</b><span>오늘 추천</span></div><div class="mini-action"><b>교재 연습</b><span>Unit 6</span></div><div class="mini-action" style="grid-column:1/-1"><b>교재 공부</b><span>읽고 익히기</span></div></div></div><div class="c2bottom">${book()}${ai()}</div>`},
{n:'03',name:'Daily Left Anchor',desc:'A tall Daily card anchors the screen while quick actions fill the right.',html:`<div class="c3top"><div class="card hero c3hero pink"><div><div class="row"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div></div></div><div class="hero-foot">${ring()}<button class="cta" style="flex:1">오늘 학습 계속</button></div></div><div class="c3actions">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','직접 선택')}${act('blue','book','교재 공부','공부 모드')}</div></div><div class="c3bottom">${book()}</div>`},
{n:'04',name:'Wide Daily Banner',desc:'Uses tablet width aggressively: Daily becomes a horizontal command banner.',html:`<div class="card hero c4hero pink"><div class="icon">${I.clock}</div><div class="bigcopy">${dailyCopy()}</div>${ring('sm')}</div><div class="c4dock">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','단원 · 영역 선택')}${act('blue','book','교재 공부','공부 모드')}</div><div class="c4main">${book()}${ai()}</div>`},
{n:'05',name:'Daily Spotlight',desc:'The strongest hero treatment: Daily feels like the one obvious thing to do next.',html:`<div class="c5wrap"><div class="card hero c5hero pink"><div class="row"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div></div><div class="hero-bottom"><div><div style="font-size:11px;font-weight:900;color:var(--muted);margin-bottom:8px">NEXT UP · LISTENING</div><button class="cta">데일리 스터디 계속</button></div>${ring()}</div></div><div class="c5stack">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','단원 · 영역')}${act('blue','book','교재 공부','공부 모드')}</div></div><div class="c5lower">${ai()}${book()}</div>`},
{n:'06',name:'Daily Command Bar',desc:'A compact hero with three square launchers; efficient on smaller landscape screens.',html:`<div class="card hero c6hero pink"><div class="c6left"><div class="icon">${I.clock}</div><div>${dailyCopy()}</div></div><div class="c6right">${ring('sm')}<div class="quicktile"><b>AI 코치</b><span>추천 학습</span></div><div class="quicktile"><b>교재 연습</b><span>Unit 6</span></div><div class="quicktile"><b>교재 공부</b><span>공부 모드</span></div></div></div><div class="c6main">${book()}${ai()}</div>`},
{n:'07',name:'Daily Rail Hero',desc:'Daily becomes a permanent left rail inside a single hero workspace.',html:`<div class="card hero c7hero pink"><div class="c7rail"><div class="eyebrow">Today</div><h2>데일리 스터디</h2><p>4일 연속 학습</p>${ring()}</div><div class="c7body"><h3 style="font-size:21px">오늘은 6문제만 더 하면 끝!</h3><p>현재 듣기 파트를 진행 중이에요.</p><div class="progress-strip"><i class="dot done"></i><i class="dot done"></i><i class="dot done"></i><i class="dot"></i><i class="dot"></i></div><div class="c7buttons">${act('cyan','bot','AI 코치','')}${act('orange','chart','교재 연습','')}${act('blue','book','교재 공부','')}</div></div></div><div class="c7main">${book()}${ai()}</div>`},
{n:'08',name:'Landscape Compact',desc:'Designed specifically to fit a flipped phone without wasting vertical space.',html:`<div class="card hero c8hero pink"><div class="row"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div></div>${ring('sm')}<div class="c8actions">${act('cyan','bot','AI 코치','')}${act('orange','chart','교재 연습','')}${act('blue','book','교재 공부','')}</div></div><div class="c8bottom">${book()}${ai()}</div>`},
{n:'09',name:'Daily Journey',desc:'Progress feels like a short daily journey rather than just a percentage ring.',html:`<div class="card hero c9hero pink"><div class="c9mission"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div>${ring('sm')}</div><div class="c9journey"><b style="font-size:11px">오늘의 여정</b><div class="milestones"><div class="mile on">1</div><div class="mile on">2</div><div class="mile on">3</div><div class="mile">4</div><div class="mile">5</div></div></div></div><div class="c9grid">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','Unit 6')}${act('blue','book','교재 공부','공부 모드')}</div><div class="c9lower">${book()}${ai()}</div>`},
{n:'10',name:'Modular Daily Dashboard',desc:'A denser tablet grid with Daily still visually dominant.',html:`<div class="c10grid"><div class="card hero c10hero pink"><div class="top"><div class="icon">${I.clock}</div><div class="grow">${dailyCopy()}</div>${ring('sm')}</div><div class="footerline"><span style="font-size:10px;font-weight:900;color:var(--muted)">NEXT · LISTENING 3/5</span><button class="cta">계속</button></div></div><div class="c10actions">${act('cyan','bot','AI 코치','추천 학습')}${act('orange','chart','교재 연습','단원 선택')}${act('blue','book','교재 공부','공부 모드')}</div><div class="c10book">${book()}</div><div class="c10ai">${ai()}</div></div>`}
];
const tabs=document.getElementById('tabs'),main=document.getElementById('concepts'),counter=document.getElementById('counter');
concepts.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=c.n;b.onclick=()=>show(i);tabs.appendChild(b);const s=document.createElement('section');s.className='concept'+(i===0?' active':'');s.innerHTML=`<div class="title"><div><h1>${c.name}</h1><p>${c.desc}</p></div><div class="num">${c.n}</div></div>${c.html}`;main.appendChild(s)});
function show(i){[...document.querySelectorAll('.tab')].forEach((x,j)=>x.classList.toggle('active',i===j));[...document.querySelectorAll('.concept')].forEach((x,j)=>x.classList.toggle('active',i===j));counter.textContent='Concept '+(i+1)+' / 10';window.scrollTo({top:0,behavior:'smooth'})}
})();
</script>
</body>
</html>
