<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Study V2 · Tablet Concepts</title>
<style>
:root{
  --pink:#ff6fb0;--cyan:#21b3be;--orange:#d9923b;--blue:#5b7fe5;
  --ink:#35565b;--muted:#7c8c91;--line:#dfe8ea;--bg:#eef3f4;--white:#fff;
  --soft-pink:#fff3f8;--soft-cyan:#eefafb;--soft-orange:#fff8ee;--soft-blue:#f3f5ff;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#dfe8ea}
button{font:inherit}.shell{min-height:100vh;background:linear-gradient(#edf3f4,#e6edef);padding:16px}.concept-nav{position:sticky;top:0;z-index:20;max-width:1300px;margin:0 auto 14px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid #d8e2e4;border-radius:22px;padding:12px;box-shadow:0 8px 28px rgba(45,78,84,.08)}
.nav-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.nav-head strong{font-size:18px}.nav-head small{color:var(--muted);font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tab{flex:0 0 auto;border:1px solid #d8e2e4;background:#fff;color:#60767b;border-radius:999px;padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{max-width:1300px;margin:0 auto;background:var(--bg);border-radius:28px;border:1px solid #d6e1e3;box-shadow:0 18px 50px rgba(36,72,78,.12);overflow:hidden;min-height:820px}.fake-header{height:72px;background:#fff;border-bottom:1px solid #dce6e8;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;color:#fff;font-size:18px}.header-pills{display:flex;align-items:center;gap:10px}.pill{border-radius:999px;background:#f3f7f8;padding:9px 13px;font-size:12px;font-weight:800;color:#60767b}.points{background:#fff1f6;color:#d75190}.concept{display:none;padding:24px;min-height:748px}.concept.active{display:block}.concept-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 18px}.concept-title h1{font-size:24px;margin:0 0 4px}.concept-title p{margin:0;color:var(--muted);font-weight:650;font-size:13px}.concept-no{font-size:46px;line-height:1;color:#cad8db;font-weight:900;letter-spacing:-2px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 24px rgba(45,78,84,.055)}.accent-pink{border:2px solid var(--pink)}.accent-cyan{border:2px solid var(--cyan)}.accent-orange{border:2px solid var(--orange)}.accent-blue{border:2px solid var(--blue)}
.action{display:flex;align-items:center;gap:14px;padding:17px 18px;min-height:92px}.action-icon{width:52px;height:52px;flex:0 0 52px;border-radius:18px;display:grid;place-items:center}.action-icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.pink .action-icon{background:var(--soft-pink);color:var(--pink)}.cyan .action-icon{background:var(--soft-cyan);color:var(--cyan)}.orange .action-icon{background:var(--soft-orange);color:var(--orange)}.blue .action-icon{background:var(--soft-blue);color:var(--blue)}.action strong{display:block;font-size:16px}.action small{display:block;margin-top:5px;color:var(--muted);font-weight:700;font-size:12px}.action .grow{flex:1;min-width:0}
.daily{display:flex;align-items:center;gap:16px;padding:19px}.ring{margin-left:auto;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--pink) 0 70%,#f5d4e3 70%);position:relative;flex:0 0 74px}.ring:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.ring span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--pink)}
.section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#90a1a5;font-weight:900;margin-bottom:10px}.book-card{padding:22px}.book-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.book-title h2{margin:0;font-size:25px;letter-spacing:-.02em}.book-title p{margin:7px 0 0;color:var(--cyan);font-weight:800;font-size:13px}.book-tabs{display:flex;gap:8px;flex-wrap:wrap}.mini-tab{padding:8px 10px;border-radius:999px;background:#f5f8f9;color:#70858a;font-size:11px;font-weight:800}.mini-tab.active{background:var(--soft-cyan);color:var(--cyan)}.units{display:flex;gap:8px;flex-wrap:wrap}.unit{border:2px solid var(--cyan);background:#fff;border-radius:13px;padding:9px 12px;font-size:12px;font-weight:900}.unit.active{background:var(--soft-pink);color:var(--pink)}.mastery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.skill{border-radius:17px;padding:12px;background:#fff}.skill:nth-child(4n+1){border:2px solid var(--pink)}.skill:nth-child(4n+2){border:2px solid var(--cyan)}.skill:nth-child(4n+3){border:2px solid var(--orange)}.skill:nth-child(4n){border:2px solid var(--blue)}.skill-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:900}.bar{height:7px;border-radius:999px;background:#e8eff1;margin-top:9px;overflow:hidden}.fill{height:100%;border-radius:999px;background:currentColor}.skill:nth-child(4n+1){color:var(--pink)}.skill:nth-child(4n+2){color:var(--cyan)}.skill:nth-child(4n+3){color:var(--orange)}.skill:nth-child(4n){color:var(--blue)}.skill-top span:first-child{color:var(--ink)}
.ai-card{padding:18px}.ai-row{display:flex;align-items:flex-start;gap:12px}.bot{width:46px;height:46px;border-radius:16px;background:var(--soft-cyan);color:var(--cyan);display:grid;place-items:center;font-size:23px}.bubble{background:#f4f8f9;border-radius:17px;padding:12px 14px;flex:1;color:#526b70;font-size:12px;font-weight:700;line-height:1.5}.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#fff;border:1px solid #dbe6e8;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850;color:#62787d}
.side-list{display:flex;flex-direction:column;gap:10px}.compact-action{padding:14px 15px;min-height:76px}.compact-action .action-icon{width:44px;height:44px;flex-basis:44px;border-radius:15px}.compact-action strong{font-size:14px}.compact-action small{font-size:11px}
.statline{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f7fafb;border-radius:15px;padding:10px 12px;min-width:100px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted);font-weight:800}
/* 01 */.c1-grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.c1-left{display:flex;flex-direction:column;gap:12px}.c1-right{display:grid;grid-template-rows:auto 1fr;gap:16px}
/* 02 */.c2-top{display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:12px;margin-bottom:18px}.c2-main{display:grid;grid-template-columns:1fr 310px;gap:18px}
/* 03 */.c3-grid{display:grid;grid-template-columns:440px 1fr;gap:18px}.c3-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.c3-actions .daily{grid-column:1/-1}.c3-right{display:grid;grid-template-rows:1fr auto;gap:14px}
/* 04 */.workspace{display:grid;grid-template-columns:210px 1fr;min-height:650px}.rail{background:#fff;border-right:1px solid var(--line);border-radius:24px 0 0 24px;padding:18px}.rail-title{font-size:11px;font-weight:900;color:#91a1a5;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 12px}.rail-item{display:flex;align-items:center;gap:10px;padding:11px;border-radius:13px;margin-bottom:6px;font-size:12px;font-weight:850;color:#60767b}.rail-item.active{background:var(--soft-pink);color:var(--pink)}.rail-dot{width:9px;height:9px;border-radius:50%;background:currentColor}.workspace-main{padding:20px}.workspace-main .topbar{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}.workspace-main .book-card{min-height:480px}
/* 05 */.c5-hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}.daily-big{min-height:220px;padding:26px}.daily-big .ring{width:108px;height:108px;flex-basis:108px}.daily-big .action-icon{width:66px;height:66px;flex-basis:66px}.daily-big strong{font-size:22px}.daily-big small{font-size:13px}.c5-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.c5-side .blue{grid-column:1/-1}.c5-main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* 06 */.c6-grid{display:grid;grid-template-columns:1fr 250px;gap:18px}.c6-book{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:20px}.unit-nav{border-right:1px solid var(--line);padding-right:16px}.unit-nav .unit{display:block;width:100%;margin-bottom:8px;text-align:left}.c6-master{margin-top:0}.c6-side{display:flex;flex-direction:column;gap:10px}
/* 07 */.c7-top{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px;margin-bottom:16px}.c7-bottom{display:grid;grid-template-columns:1fr 360px;gap:16px}.c7-ai{min-height:100%;display:flex;flex-direction:column;justify-content:space-between}
/* 08 */.ribbon{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}.ribbon .action{min-height:82px;padding:13px}.ribbon .action-icon{width:42px;height:42px;flex-basis:42px}.ribbon strong{font-size:13px}.ribbon small{display:none}.c8-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.c8-right{display:grid;grid-template-rows:auto 1fr;gap:14px}
/* 09 */.c9-grid{display:grid;grid-template-columns:180px 1fr 310px;gap:0;min-height:620px}.c9-books{background:#fff;border-radius:24px 0 0 24px;border:1px solid var(--line);padding:18px}.book-choice{padding:12px;border-radius:14px;margin-bottom:8px;font-size:12px;font-weight:850;color:#657b80}.book-choice.active{background:var(--soft-cyan);color:var(--cyan)}.c9-center{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px}.c9-side{background:#fbfdfd;border:1px solid var(--line);border-radius:0 24px 24px 0;padding:18px}.c9-side .mastery-grid{grid-template-columns:1fr 1fr}.c9-side .action{margin-bottom:10px}
/* 10 */.c10-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c10-daily{grid-column:span 5}.c10-ai{grid-column:span 4}.c10-quick{grid-column:span 3}.c10-book{grid-column:span 8}.c10-master{grid-column:span 4}.quick-list{display:grid;gap:9px}.quick{padding:13px;border-radius:15px;background:#f7fafb;font-size:11px;font-weight:850;display:flex;justify-content:space-between;align-items:center}.quick b{color:var(--pink)}
@media(max-width:920px){.stage{min-height:0}.concept{padding:14px}.fake-header{padding:0 16px}.concept-title{align-items:flex-start}.concept-no{font-size:34px}.c1-grid,.c2-main,.c3-grid,.c5-hero,.c5-main,.c6-grid,.c7-bottom,.c8-grid{grid-template-columns:1fr}.c2-top,.c7-top,.ribbon{grid-template-columns:1fr 1fr}.c4 .workspace,.c9-grid{grid-template-columns:1fr}.rail,.c9-books{display:none}.workspace-main,.c9-center,.c9-side{border-radius:0}.c6-book{grid-template-columns:1fr}.unit-nav{border-right:0;border-bottom:1px solid var(--line);padding:0 0 14px}.c10-daily,.c10-ai,.c10-quick,.c10-book,.c10-master{grid-column:span 12}.mastery-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="concept-nav">
    <div class="nav-head"><div><strong>Study V2 · Wide Tablet Concepts</strong><br><small>Visual only · no live data</small></div><small id="counter">Concept 1 / 10</small></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="stage">
    <header class="fake-header"><div class="brand"><div class="logo">W</div><span>Study</span></div><div class="header-pills"><span class="pill points">★ 1,420</span><span class="pill">William A</span></div></header>
    <main id="concepts"></main>
  </div>
</div>
<script>
(function(){
const icons={
 clock:`<svg viewBox="0 0 24 24"><path d="M7 3h10M9 3v3M15 3v3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5"/></svg>`,
 bot:`<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="4"/><path d="M12 3v3M8 12h.01M16 12h.01M9 15h6"/></svg>`,
 chart:`<svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l3-3 2 2 5-6 2 2M16 7h3v3"/></svg>`,
 book:`<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21.5z"/></svg>`
};
function action(kind,title,sub,compact=false){let map={pink:['accent-pink','clock'],cyan:['accent-cyan','bot'],orange:['accent-orange','chart'],blue:['accent-blue','book']},m=map[kind];return `<div class="card action ${kind} ${m[0]} ${compact?'compact-action':''}"><div class="action-icon">${icons[m[1]]}</div><div class="grow"><strong>${title}</strong><small>${sub}</small></div></div>`}
function daily(big=false){return `<div class="card daily pink accent-pink ${big?'daily-big':''}"><div class="action-icon">${icons.clock}</div><div class="grow"><strong>데일리 스터디</strong><small>4일 연속 학습 · 오늘 14/20</small></div><div class="ring"><span>14/20</span></div></div>`}
function skills(extra=''){let data=[['단어',82],['문법',66],['문장 만들기',74],['듣기',58],['읽기',71],['대화',62],['철자',88],['복습',77]];return `<div class="mastery-grid ${extra}">${data.map(([n,p])=>`<div class="skill"><div class="skill-top"><span>${n}</span><span>${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`).join('')}</div>`}
function ai(){return `<div class="card ai-card"><div class="section-label">AI 코치</div><div class="ai-row"><div class="bot">✦</div><div class="bubble">오늘은 <b>듣기</b>가 조금 약해요. English Bus 6 Unit 5의 듣기와 문장 만들기를 먼저 해볼까요?<div class="chip-row"><span class="chip">듣기 5문제</span><span class="chip">문장 만들기 5문제</span></div></div></div></div>`}
function book(opts={}){return `<div class="card book-card"><div class="book-head"><div class="book-title"><div class="section-label">교재 연습</div><h2>English Bus 6</h2><p>Unit 5 · What do you like to do?</p></div><div class="book-tabs"><span class="mini-tab active">English Bus 6</span><span class="mini-tab">Reading A</span><span class="mini-tab">Grammar</span></div></div><div class="units"><span class="unit">U1</span><span class="unit">U2</span><span class="unit">U3</span><span class="unit">U4</span><span class="unit active">U5</span><span class="unit">U6</span><span class="unit">U7</span><span class="unit">U8</span></div>${skills()}</div>`}
function title(n,name,desc){return `<div class="concept-title"><div><h1>${name}</h1><p>${desc}</p></div><div class="concept-no">${String(n).padStart(2,'0')}</div></div>`}
const concepts=[
`<section class="concept c1">${title(1,'Action Rail','Keep the left side for launching things; let the book area own the wide canvas.')}<div class="c1-grid"><div class="c1-left">${daily()}${action('cyan','AI 코치','추천 학습')}${action('orange','교재 연습','교재 · 단원 · 영역 선택')}${action('blue','교재 공부','준비 중')}${ai()}</div><div class="c1-right">${book()}<div class="card" style="padding:16px">${skills()}</div></div></div></section>`,
`<section class="concept c2">${title(2,'Wide Command Strip','Use the full tablet width for the four top actions, then split book work and coaching.')}<div class="c2-top">${daily()}${action('cyan','AI 코치','추천 학습',true)}${action('orange','교재 연습','단원 선택',true)}${action('blue','교재 공부','준비 중',true)}</div><div class="c2-main">${book()}<div>${ai()}<div class="card" style="padding:18px;margin-top:14px"><div class="section-label">오늘 요약</div><div class="statline"><div class="stat"><b>14</b><span>정답</span></div><div class="stat"><b>4일</b><span>연속 학습</span></div><div class="stat"><b>+35</b><span>오늘 포인트</span></div></div></div></div></div></section>`,
`<section class="concept c3">${title(3,'2×2 Launchpad','A compact action block on the left, full book workspace on the right.')}<div class="c3-grid"><div><div class="c3-actions">${daily()}${action('cyan','AI 코치','추천 학습',true)}${action('orange','교재 연습','단원 선택',true)}${action('blue','교재 공부','준비 중',true)}</div><div style="margin-top:14px">${ai()}</div></div><div class="c3-right">${book()}<div class="card" style="padding:15px"><div class="section-label">빠른 복습</div><div class="chip-row"><span class="chip">어제 틀린 단어 3</span><span class="chip">듣기 복습 4</span><span class="chip">문법 복습 2</span></div></div></div></div></section>`,
`<section class="concept c4">${title(4,'Tablet Workspace','A persistent left navigation rail, with Study behaving more like a real tablet app.')}<div class="card workspace"><aside class="rail"><div class="rail-title">Study</div><div class="rail-item active"><span class="rail-dot"></span>오늘 학습</div><div class="rail-item"><span class="rail-dot" style="color:var(--cyan)"></span>AI 코치</div><div class="rail-item"><span class="rail-dot" style="color:var(--orange)"></span>교재 연습</div><div class="rail-item"><span class="rail-dot" style="color:var(--blue)"></span>교재 공부</div><div class="rail-title" style="margin-top:26px">교재</div><div class="rail-item">English Bus 6</div><div class="rail-item">Reading A</div><div class="rail-item">Grammar</div></aside><div class="workspace-main"><div class="topbar">${daily()}${ai()}</div>${book()}</div></div></section>`,
`<section class="concept c5">${title(5,'Daily Hero','Make Daily Study the clear hero on wide screens and tuck the other launches beside it.')}<div class="c5-hero">${daily(true)}<div class="c5-side">${action('cyan','AI 코치','추천 학습',true)}${action('orange','교재 연습','단원 선택',true)}${action('blue','교재 공부','준비 중',true)}</div></div><div class="c5-main">${book()}${ai()}</div></section>`,
`<section class="concept c6">${title(6,'Book-First Studio','Use tablet width to keep unit navigation visible while practicing; actions stay in a slim right rail.')}<div class="c6-grid"><div class="card c6-book"><div class="unit-nav"><div class="section-label">English Bus 6</div><div class="book-title"><h2 style="font-size:22px;margin-bottom:14px">Choose unit</h2></div>${[1,2,3,4,5,6,7,8].map(n=>`<button class="unit ${n===5?'active':''}">Unit ${n}</button>`).join('')}</div><div><div class="book-title"><div class="section-label">Unit 5</div><h2>What do you like to do?</h2><p>영역을 눌러 연습하세요</p></div>${skills('c6-master')}<div style="margin-top:18px">${ai()}</div></div></div><div class="c6-side">${daily()}${action('cyan','AI 코치','추천 학습',true)}${action('orange','교재 연습','현재 교재',true)}${action('blue','교재 공부','준비 중',true)}</div></div></section>`,
`<section class="concept c7">${title(7,'Three-Zone Dashboard','Three meaningful zones across the top: Daily, Coach, and quick book access.')}<div class="c7-top">${daily()}<div class="c7-ai">${ai()}</div><div class="side-list">${action('orange','교재 연습','English Bus 6',true)}${action('blue','교재 공부','준비 중',true)}</div></div><div class="c7-bottom">${book()}<div class="card" style="padding:18px"><div class="section-label">오늘의 약점</div>${skills()}</div></div></section>`,
`<section class="concept c8">${title(8,'Compact Ribbon','Compress the launch cards into one top ribbon; give almost all vertical space to actual study content.')}<div class="ribbon">${daily()}${action('cyan','AI 코치','',true)}${action('orange','교재 연습','',true)}${action('blue','교재 공부','',true)}</div><div class="c8-grid">${book()}<div class="c8-right">${ai()}<div class="card" style="padding:18px"><div class="section-label">이번 주</div><div class="statline"><div class="stat"><b>4/5</b><span>학습일</span></div><div class="stat"><b>87%</b><span>정답률</span></div><div class="stat"><b>128</b><span>문제</span></div></div>${skills()}</div></div></div></section>`,
`<section class="concept c9">${title(9,'Three-Pane Study','A desktop-like tablet layout: books on the left, unit workspace center, progress on the right.')}<div class="c9-grid"><aside class="c9-books"><div class="section-label">내 교재</div><div class="book-choice active">English Bus 6</div><div class="book-choice">Reading A</div><div class="book-choice">Grammar</div><div class="book-choice">Vocabulary</div></aside><div class="c9-center"><div class="book-title"><div class="section-label">Unit 5</div><h2>What do you like to do?</h2><p>영역을 선택해 연습하세요</p></div><div class="units" style="margin:18px 0"><span class="unit">U1</span><span class="unit">U2</span><span class="unit">U3</span><span class="unit">U4</span><span class="unit active">U5</span><span class="unit">U6</span></div>${skills()}</div><aside class="c9-side">${daily()}${action('cyan','AI 코치','추천 학습',true)}<div class="section-label" style="margin-top:18px">숙련도</div>${skills()}</aside></div></section>`,
`<section class="concept c10">${title(10,'Modular Grid','A flexible 12-column dashboard that can grow later without wasting tablet space.')}<div class="c10-grid"><div class="c10-daily">${daily(true)}</div><div class="c10-ai">${ai()}</div><div class="card c10-quick" style="padding:18px"><div class="section-label">Quick start</div><div class="quick-list"><div class="quick">듣기 복습 <b>5</b></div><div class="quick">틀린 단어 <b>3</b></div><div class="quick">문장 만들기 <b>4</b></div></div></div><div class="c10-book">${book()}</div><div class="card c10-master" style="padding:18px"><div class="section-label">전체 숙련도</div>${skills()}</div></div></section>`
];
const root=document.getElementById('concepts');root.innerHTML=concepts.join('');
const tabs=document.getElementById('tabs');for(let i=0;i<10;i++){let b=document.createElement('button');b.className='tab';b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>show(i);tabs.appendChild(b)}
function show(i){document.querySelectorAll('.concept').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('.tab').forEach((x,n)=>x.classList.toggle('active',n===i));document.getElementById('counter').textContent=`Concept ${i+1} / 10`;history.replaceState(null,'','#'+(i+1));window.scrollTo({top:0,behavior:'smooth'})}
let initial=Math.max(0,Math.min(9,(parseInt(location.hash.slice(1),10)||1)-1));show(initial);
})();
</script>
</body>
</html>
