<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Study V2 · Daily Hero Developments</title>
<style>
:root{
  --pink:#ff6fb0;--cyan:#21b3be;--orange:#d9923b;--blue:#5b7fe5;
  --ink:#35565b;--muted:#7c8c91;--bg:#edf3f4;--white:#fff;
  --soft-pink:#fff2f8;--soft-cyan:#edfafa;--soft-orange:#fff7ec;--soft-blue:#f2f5ff;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#dfe8ea}button{font:inherit;color:inherit}
.page{min-height:100vh;padding:14px;background:linear-gradient(180deg,#edf3f4,#e4ecee)}
.topnav{position:sticky;top:10px;z-index:30;max-width:1320px;margin:0 auto 14px;padding:12px 14px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:3px solid var(--cyan);border-radius:22px;box-shadow:0 10px 30px rgba(39,74,80,.09)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:14px}.navrow strong{font-size:18px}.navrow small{color:var(--muted);font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:2px}.tab{flex:0 0 auto;border:3px solid var(--blue);background:#fff;border-radius:999px;padding:8px 12px;font-weight:900;font-size:11px;cursor:pointer}.tab:nth-child(4n+2){border-color:var(--pink)}.tab:nth-child(4n+3){border-color:var(--cyan)}.tab:nth-child(4n){border-color:var(--orange)}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.stage{max-width:1320px;margin:0 auto;min-height:780px;background:var(--bg);border-radius:30px;overflow:hidden;box-shadow:0 20px 58px rgba(38,72,79,.14)}
.fakeheader{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:3px solid var(--blue)}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:900}.headpills{display:flex;gap:9px}.pill{border:2px solid var(--cyan);border-radius:999px;background:#fff;padding:8px 12px;font-size:11px;font-weight:900}.pill.points{border-color:var(--pink);color:#d74e8d}
.concept{display:none;padding:22px}.concept.active{display:block}.concepthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:17px}.concepthead h1{margin:0 0 4px;font-size:24px}.concepthead p{margin:0;color:var(--muted);font-size:12px;font-weight:750}.num{font-size:44px;line-height:.9;color:#bdcdd0;font-weight:950}
.card{background:#fff;border:3px solid var(--cyan);border-radius:24px;box-shadow:0 8px 22px rgba(44,77,83,.05)}.b-pink{border-color:var(--pink)!important}.b-cyan{border-color:var(--cyan)!important}.b-orange{border-color:var(--orange)!important}.b-blue{border-color:var(--blue)!important}
.soft-pink{background:var(--soft-pink)}.soft-cyan{background:var(--soft-cyan)}.soft-orange{background:var(--soft-orange)}.soft-blue{background:var(--soft-blue)}
.daily{padding:22px;display:flex;align-items:center;gap:16px;min-height:150px}.daily.hero{min-height:220px;padding:28px}.ico{width:58px;height:58px;flex:0 0 58px;border-radius:19px;display:grid;place-items:center;background:var(--soft-pink);color:var(--pink)}.ico svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.daily.hero .ico{width:72px;height:72px;flex-basis:72px;border-radius:23px}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:18px}.daily.hero .copy strong{font-size:25px}.copy small{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.35}.streak{display:inline-flex;margin-top:12px;padding:7px 10px;border-radius:999px;background:#fff;border:2px solid var(--orange);color:var(--orange);font-size:10px;font-weight:950}
.ring{width:84px;height:84px;flex:0 0 84px;border-radius:50%;position:relative;background:conic-gradient(var(--pink) 0 70%,#f7d7e6 70%)}.ring:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.ring span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:12px;font-weight:950;color:var(--pink)}.hero .ring{width:112px;height:112px;flex-basis:112px}.hero .ring:after{inset:13px}.hero .ring span{font-size:15px}
.action{padding:15px 16px;display:flex;align-items:center;gap:12px;min-height:78px}.action .miniico{width:44px;height:44px;flex:0 0 44px;border-radius:15px;display:grid;place-items:center;font-weight:950}.action strong{display:block;font-size:13px}.action small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:800}.miniico.pink{background:var(--soft-pink);color:var(--pink)}.miniico.cyan{background:var(--soft-cyan);color:var(--cyan)}.miniico.orange{background:var(--soft-orange);color:var(--orange)}.miniico.blue{background:var(--soft-blue);color:var(--blue)}
.book{padding:20px}.bookhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:17px}.bookhead h2{margin:0;font-size:22px}.bookhead p{margin:5px 0 0;color:var(--cyan);font-size:11px;font-weight:900}.booktabs,.units,.chips{display:flex;gap:7px;flex-wrap:wrap}.booktab,.chip{padding:7px 9px;border-radius:999px;background:#f5f8f9;font-size:9px;font-weight:900}.booktab.active{background:var(--soft-pink);color:var(--pink);border:2px solid var(--pink)}.unit{border:3px solid var(--cyan);background:#fff;border-radius:12px;padding:8px 11px;font-size:10px;font-weight:950}.unit.active{border-color:var(--pink);color:var(--pink);background:var(--soft-pink)}
.master{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.skill{padding:11px;border:3px solid var(--pink);border-radius:16px;background:#fff}.skill:nth-child(4n+2){border-color:var(--cyan)}.skill:nth-child(4n+3){border-color:var(--orange)}.skill:nth-child(4n){border-color:var(--blue)}.skilltop{display:flex;justify-content:space-between;gap:8px;font-size:9px;font-weight:950}.bar{height:7px;margin-top:8px;border-radius:99px;background:#e8eff1;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--pink)}.skill:nth-child(4n+2) .fill{background:var(--cyan)}.skill:nth-child(4n+3) .fill{background:var(--orange)}.skill:nth-child(4n) .fill{background:var(--blue)}
.ai{padding:17px}.airow{display:flex;gap:10px;align-items:flex-start}.bot{width:43px;height:43px;flex:0 0 43px;border-radius:15px;background:var(--soft-cyan);color:var(--cyan);display:grid;place-items:center;font-size:21px}.bubble{flex:1;border-radius:15px;background:#f5f9fa;padding:10px 12px;font-size:10px;line-height:1.45;font-weight:800;color:#587176}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border:3px solid var(--blue);border-radius:16px;background:#fff}.stat:nth-child(2){border-color:var(--orange)}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--muted);font-weight:900}
/* family 7: top three-zone + lower book/coach */
.f7a-top{display:grid;grid-template-columns:1.45fr .85fr .85fr;gap:14px;margin-bottom:14px}.f7a-bottom{display:grid;grid-template-columns:1fr 330px;gap:14px}.f7stack{display:grid;gap:12px}
.f7b{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.f7b-left{display:grid;grid-template-rows:auto 1fr;gap:14px}.f7b-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f7b-right{display:grid;grid-template-rows:auto auto 1fr;gap:12px}
.f7c-top{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}.f7c-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f7c-bottom{display:grid;grid-template-columns:360px 1fr;gap:14px}
/* family 9: three-pane */
.f9a{display:grid;grid-template-columns:185px 1fr 300px;min-height:610px}.pane{background:#fff;padding:17px}.pane.left{border:3px solid var(--pink);border-radius:24px 0 0 24px}.pane.mid{border-top:3px solid var(--cyan);border-bottom:3px solid var(--cyan)}.pane.right{border:3px solid var(--blue);border-radius:0 24px 24px 0}.navitem{padding:11px;border:2px solid transparent;border-radius:12px;font-size:10px;font-weight:900;margin-bottom:7px}.navitem.active{border-color:var(--orange);background:var(--soft-orange);color:var(--orange)}
.f9b{display:grid;grid-template-columns:260px 1fr 230px;gap:12px}.f9b .column{display:grid;gap:12px;align-content:start}.f9c{display:grid;grid-template-columns:215px 1fr;gap:14px}.f9c-main{display:grid;grid-template-columns:1fr 300px;gap:14px}.rail{padding:16px;min-height:590px}
/* family 5: dominant daily hero */
.f5a-hero{display:grid;grid-template-columns:1.55fr .9fr;gap:14px;margin-bottom:14px}.f5a-side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f5a-side .wide{grid-column:1/-1}.f5a-main{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f5b{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.f5b-left{display:grid;gap:14px}.f5b-right{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}.f5b-right .book{grid-column:1/-1}
/* family 3: action launchpad beside study */
.f3a{display:grid;grid-template-columns:440px 1fr;gap:14px}.launch{display:grid;grid-template-columns:1fr 1fr;gap:10px}.launch .daily{grid-column:1/-1}.f3a-right{display:grid;grid-template-rows:auto 1fr;gap:14px}
.f3b{display:grid;grid-template-columns:390px 1fr;gap:14px}.f3b-left{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}.f3b-left .daily{grid-column:1/-1}.f3b-right{display:grid;grid-template-columns:1fr 260px;gap:14px}
@media(max-width:940px){.concept{padding:14px}.fakeheader{padding:0 16px}.concepthead{align-items:flex-start}.num{font-size:34px}.f7a-top{grid-template-columns:1.2fr 1fr}.f7a-top>:last-child{grid-column:1/-1}.f7a-bottom,.f7b,.f7c-top,.f7c-bottom,.f9b,.f9c,.f9c-main,.f5a-hero,.f5a-main,.f5b,.f3a,.f3b,.f3b-right{grid-template-columns:1fr}.f9a{grid-template-columns:150px 1fr}.f9a .right{grid-column:1/-1;border-radius:0 0 24px 24px}.f9a .left{border-radius:24px 0 0 0}.f9a .mid{border-right:3px solid var(--cyan);border-radius:0 24px 0 0}.master{grid-template-columns:1fr 1fr}}
@media(orientation:landscape) and (max-height:620px){.page{padding:8px}.topnav{top:5px;padding:8px 10px;margin-bottom:8px}.navrow strong{font-size:14px}.navrow small{font-size:9px}.tabs{margin-top:6px}.tab{padding:6px 9px}.fakeheader{height:54px}.concept{padding:12px}.concepthead{margin-bottom:10px}.concepthead h1{font-size:18px}.concepthead p{font-size:10px}.num{font-size:30px}.daily{min-height:112px;padding:15px}.daily.hero{min-height:150px;padding:18px}.hero .ico{width:58px;height:58px;flex-basis:58px}.hero .ring{width:84px;height:84px;flex-basis:84px}.daily.hero .copy strong{font-size:20px}.book{padding:14px}.action{min-height:64px;padding:10px}.master{margin-top:10px}.f9a{min-height:470px}.rail{min-height:470px}}
@media(max-width:620px) and (orientation:portrait){.topnav{position:static}.stage{border-radius:20px}.concept{padding:12px}.concepthead p:after{content:" · rotate phone for the intended layout"}.f7a-top,.f7a-bottom,.f7b,.f7b-mini,.f7c-top,.f7c-actions,.f7c-bottom,.f9a,.f9b,.f9c,.f9c-main,.f5a-hero,.f5a-main,.f5b,.f5b-right,.f3a,.f3b,.f3b-left,.f3b-right,.launch{grid-template-columns:1fr}.f7a-top>:last-child,.f5a-side .wide,.f7b-mini>*,.launch .daily,.f3b-left .daily{grid-column:auto}.f9a .left,.f9a .mid,.f9a .right{border-radius:20px;border:3px solid var(--cyan)}.master{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="topnav">
    <div class="navrow"><div><strong>Daily Hero · developed directions</strong><br><small>Based only on concepts 7, 9, 5 and 3 · wide tablet + landscape phone</small></div><small id="counter">01 / 10</small></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="stage">
    <header class="fakeheader"><div class="brand"><div class="logo">W</div><span>Study</span></div><div class="headpills"><span class="pill points">★ 1,420</span><span class="pill">William A</span></div></header>
    <main id="mount"></main>
  </div>
</div>
<script>
(function(){
const clock=`<svg viewBox="0 0 24 24"><path d="M7 3h10M9 3v3M15 3v3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5"/></svg>`;
function daily(big=false){return `<div class="card daily ${big?'hero':''} b-pink"><div class="ico">${clock}</div><div class="copy"><strong>데일리 스터디</strong><small>오늘의 학습을 이어가세요 · 14 / 20 완료</small><span class="streak">🔥 6일 연속 학습</span></div><div class="ring"><span>14/20</span></div></div>`}
function action(label,sub,color,icon){return `<div class="card action b-${color}"><div class="miniico ${color}">${icon}</div><div><strong>${label}</strong><small>${sub}</small></div></div>`}
function book(compact=false){return `<div class="card book b-orange"><div class="bookhead"><div><h2>Come On Everyone 5</h2><p>Unit 6 · What did you do?</p></div><div class="booktabs"><span class="booktab active">Course</span><span class="booktab">Reading</span></div></div><div class="units"><span class="unit">4</span><span class="unit">5</span><span class="unit active">6</span><span class="unit">7</span><span class="unit">8</span></div>${compact?'':master()}</div>`}
function master(){return `<div class="master"><div class="skill"><div class="skilltop"><span>Vocabulary</span><span>82%</span></div><div class="bar"><div class="fill" style="width:82%"></div></div></div><div class="skill"><div class="skilltop"><span>Grammar</span><span>64%</span></div><div class="bar"><div class="fill" style="width:64%"></div></div></div><div class="skill"><div class="skilltop"><span>Listening</span><span>71%</span></div><div class="bar"><div class="fill" style="width:71%"></div></div></div><div class="skill"><div class="skilltop"><span>Reading</span><span>55%</span></div><div class="bar"><div class="fill" style="width:55%"></div></div></div></div>`}
function ai(){return `<div class="card ai b-cyan"><div class="airow"><div class="bot">✦</div><div class="bubble"><strong>AI 코치</strong><br>Grammar is a little behind today. Try a short past-tense practice after Daily Study.<div class="chips" style="margin-top:9px"><span class="chip">Grammar</span><span class="chip">5 min</span></div></div></div></div>`}
function stats(){return `<div class="quickgrid"><div class="stat"><b>82%</b><span>이번 주 정확도</span></div><div class="stat"><b>6</b><span>연속 학습일</span></div></div>`}
const A={ai:action('AI 코치','추천 학습','cyan','✦'),practice:action('교재 연습','단원 · 영역 선택','orange','↗'),study:action('교재 공부','이어 공부하기','blue','▤')};
const concepts=[
{family:'7A',title:'Three-zone hero',desc:'Daily dominates the first row, with two strong coloured secondary zones.',html:`<div class="f7a-top">${daily(true)}${A.ai}${A.practice}</div><div class="f7a-bottom">${book()}<div class="f7stack">${A.study}${ai()}${stats()}</div></div>`},
{family:'7B',title:'Daily + three quick lanes',desc:'More horizontal use of the tablet: Daily above a three-action strip, with coaching on the right.',html:`<div class="f7b"><div class="f7b-left"><div>${daily(true)}<div class="f7b-mini" style="margin-top:12px">${A.ai}${A.practice}${A.study}</div></div>${book()}</div><div class="f7b-right">${stats()}${ai()}<div class="card book b-blue"><div class="bookhead"><div><h2>오늘 추천</h2><p style="color:var(--blue)">빠른 복습</p></div></div>${master()}</div></div></div>`},
{family:'7C',title:'Split hero + action shelf',desc:'Daily and coaching share the hero row, then a full coloured action shelf.',html:`<div class="f7c-top">${daily(true)}${ai()}</div><div class="f7c-actions">${A.ai}${A.practice}${A.study}</div><div class="f7c-bottom" style="margin-top:14px"><div class="card book b-blue">${stats()}<div style="margin-top:14px">${master()}</div></div>${book()}</div>`},
{family:'9A',title:'Three-pane study desk',desc:'Strong left navigation, current book in the centre, Daily + coach on the right.',html:`<div class="f9a"><aside class="pane left"><strong style="font-size:12px">MY STUDY</strong><div style="margin-top:13px"><div class="navitem active">오늘 학습</div><div class="navitem">교재 연습</div><div class="navitem">AI 코치</div><div class="navitem">진행 상황</div></div></aside><section class="pane mid">${book()}</section><aside class="pane right">${daily()}<div style="margin-top:12px">${ai()}</div><div style="margin-top:12px">${stats()}</div></aside></div>`},
{family:'9B',title:'Colour-column workspace',desc:'Each vertical column has a distinct app colour and purpose.',html:`<div class="f9b"><div class="column">${daily()}${A.ai}${stats()}</div><div class="column">${book()}${ai()}</div><div class="column">${A.practice}${A.study}<div class="card book b-pink"><div class="bookhead"><div><h2>Weak areas</h2><p>오늘 집중</p></div></div>${master()}</div></div></div>`},
{family:'9C',title:'Rail + split workspace',desc:'A narrower colour rail frees the rest of the tablet for Daily and book content.',html:`<div class="f9c"><aside class="card rail b-blue"><strong>STUDY</strong><div style="margin-top:14px"><div class="navitem active">Daily Study</div><div class="navitem">AI Coach</div><div class="navitem">Book Practice</div><div class="navitem">Progress</div></div><div style="margin-top:18px">${stats()}</div></aside><div class="f9c-main"><div>${daily(true)}<div style="margin-top:14px">${book()}</div></div><div class="f7stack">${A.ai}${A.practice}${A.study}${ai()}</div></div></div>`},
{family:'5A',title:'Daily command hero',desc:'The Daily card is the clear first destination; every other task sits beside or below it.',html:`<div class="f5a-hero">${daily(true)}<div class="f5a-side">${A.ai}${A.practice}<div class="wide">${A.study}</div>${stats()}</div></div><div class="f5a-main">${book()}${ai()}</div>`},
{family:'5B',title:'Daily tower + colourful launch grid',desc:'Big hero on the left, dense four-colour utility grid on the right.',html:`<div class="f5b"><div class="f5b-left">${daily(true)}${book()}</div><div class="f5b-right">${A.ai}${A.practice}${A.study}<div class="card action b-pink"><div class="miniico pink">★</div><div><strong>진행 상황</strong><small>이번 주 보기</small></div></div>${ai()}<div class="book b-blue">${stats()}<div style="margin-top:12px">${master()}</div></div></div></div>`},
{family:'3A',title:'Launchpad + study canvas',desc:'A compact action launchpad on the left; the current learning context owns the right.',html:`<div class="f3a"><div class="launch">${daily()}${A.ai}${A.practice}${A.study}<div class="card action b-pink"><div class="miniico pink">★</div><div><strong>진행 상황</strong><small>이번 주</small></div></div></div><div class="f3a-right">${book()}<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${ai()}<div class="card book b-blue">${stats()}<div style="margin-top:12px">${master()}</div></div></div></div></div>`},
{family:'3B',title:'Compact arcade control deck',desc:'More playful and dense: thick four-colour launch tiles with a broad book workspace.',html:`<div class="f3b"><div class="f3b-left">${daily()}${A.ai}${A.practice}${A.study}<div class="card action b-pink"><div class="miniico pink">✓</div><div><strong>숙련도</strong><small>영역별 보기</small></div></div><div class="card action b-cyan"><div class="miniico cyan">↻</div><div><strong>복습</strong><small>오늘 다시 보기</small></div></div></div><div class="f3b-right"><div>${book()}<div style="margin-top:14px">${ai()}</div></div><div class="f7stack">${stats()}<div class="card book b-pink"><div class="bookhead"><div><h2>Quick wins</h2><p>3개 남음</p></div></div>${master()}</div></div></div></div>`}
];
const mount=document.getElementById('mount'),tabs=document.getElementById('tabs'),counter=document.getElementById('counter');
concepts.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=String(i+1).padStart(2,'0')+' · '+c.family;b.onclick=()=>show(i);tabs.appendChild(b);const s=document.createElement('section');s.className='concept'+(i===0?' active':'');s.innerHTML=`<div class="concepthead"><div><h1>${c.family} · ${c.title}</h1><p>${c.desc}</p></div><div class="num">${String(i+1).padStart(2,'0')}</div></div>${c.html}`;mount.appendChild(s)});
function show(i){document.querySelectorAll('.tab').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('.concept').forEach((x,n)=>x.classList.toggle('active',n===i));counter.textContent=String(i+1).padStart(2,'0')+' / 10';window.scrollTo({top:0,behavior:'smooth'})}
})();
</script>
</body>
</html>
