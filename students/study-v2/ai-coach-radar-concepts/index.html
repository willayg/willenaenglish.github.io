<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Study V2 · AI Radar Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fb0;--cyan:#5fd5dc;--ink:#29494f;--muted:#7d9095;--bg:#f5f8f8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #dfe8e9;display:flex;align-items:center;padding:0 max(18px,4vw);position:sticky;top:0;z-index:20}.top b{font-size:1.03rem}.top span{margin-left:10px;color:var(--muted);font-size:.72rem;font-weight:800}.picker{position:sticky;top:68px;z-index:19;display:flex;gap:7px;padding:10px max(14px,4vw);overflow:auto;background:rgba(245,248,248,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e0e8e9}.picker button{flex:0 0 auto;width:40px;height:40px;border:2px solid #cfdee0;border-radius:12px;background:#fff;color:#637b80;font-weight:900}.picker button.on{border-color:var(--pink);background:#fff2f8;color:#d84f90}.wrap{width:min(1160px,calc(100% - 28px));margin:22px auto 70px;display:grid;gap:18px}.label{display:flex;align-items:end;justify-content:space-between}.label h1{font-size:1.15rem;margin:0}.label p{margin:0;color:var(--muted);font-size:.73rem;font-weight:700}.stage{min-height:430px}.concept{display:none;min-height:430px;border-radius:28px;overflow:hidden;box-shadow:0 16px 42px rgba(31,60,65,.11)}.concept.on{display:block}.shell{min-height:430px;padding:25px;color:var(--text);background:var(--base);border:3px solid var(--edge)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px}.head{display:flex;align-items:center;gap:13px}.head h2{margin:1px 0 0;font-size:1.35rem}.head p{margin:2px 0 0;opacity:.67;font-size:.74rem;font-weight:700}.mark{width:58px;height:58px;object-fit:contain;flex:0 0 58px}.kicker{font-size:.65rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.radar{position:relative;width:220px;height:220px;border-radius:50%;margin:auto;background:repeating-radial-gradient(circle,transparent 0 31px,var(--grid) 32px 33px),linear-gradient(90deg,transparent 49.6%,var(--grid) 50%,transparent 50.4%),linear-gradient(transparent 49.6%,var(--grid) 50%,transparent 50.4%);border:2px solid var(--grid)}.radar:after{content:"";position:absolute;inset:17%;clip-path:polygon(50% 5%,76% 27%,92% 59%,69% 88%,35% 79%,12% 48%,29% 20%);background:var(--radarFill);border:2px solid var(--accent);opacity:.9}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--glow);z-index:3}.d1{left:47%;top:9%}.d2{right:12%;top:45%}.d3{left:25%;bottom:13%}.meter{height:7px;border-radius:999px;background:var(--track);overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:var(--accent)}.stat{padding:14px}.statrow{display:flex;justify-content:space-between;gap:10px;font-size:.73rem;font-weight:800}.stat .meter{margin-top:8px}.cta{border:0;border-radius:13px;padding:11px 15px;background:var(--accent);color:var(--accentInk);font-weight:900}.ghost{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:transparent;color:inherit;font-weight:900}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips span{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:.67rem;font-weight:900}.chat{display:grid;grid-template-columns:1fr auto;gap:7px;padding:6px;border:1px solid var(--line);border-radius:15px;background:var(--chat)}.chat input{min-width:0;border:0;background:transparent;outline:0;padding:8px 9px;color:inherit;font-weight:700}.chat button{border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:var(--accentInk);font-weight:900}
/* palettes */
.green{--base:#25463f;--panel:#31574f;--edge:#17342e;--text:#eefaf6;--accent:#76ddb5;--accentInk:#143a2d;--line:rgba(224,255,242,.16);--grid:rgba(190,233,217,.18);--radarFill:rgba(118,221,181,.22);--glow:rgba(118,221,181,.14);--track:#42675f;--chat:rgba(0,0,0,.13)}
.cyan{--base:#294c52;--panel:#355d64;--edge:#1d3a40;--text:#effbfc;--accent:#61d5dd;--accentInk:#173b40;--line:rgba(222,250,252,.16);--grid:rgba(198,239,242,.18);--radarFill:rgba(97,213,221,.21);--glow:rgba(97,213,221,.14);--track:#486e74;--chat:rgba(0,0,0,.13)}
.blue{--base:#243f56;--panel:#31516c;--edge:#173047;--text:#eff7ff;--accent:#87caff;--accentInk:#193750;--line:rgba(225,240,255,.17);--grid:rgba(192,220,245,.18);--radarFill:rgba(135,202,255,.21);--glow:rgba(135,202,255,.14);--track:#45647f;--chat:rgba(0,0,0,.13)}
.slate{--base:#3c4b4b;--panel:#4a5d5d;--edge:#2d3939;--text:#f1f7f7;--accent:#b8e0c5;--accentInk:#2b432f;--line:rgba(235,248,240,.16);--grid:rgba(213,235,222,.17);--radarFill:rgba(184,224,197,.2);--glow:rgba(184,224,197,.13);--track:#5c7070;--chat:rgba(0,0,0,.11)}
.pink{--base:#4d424d;--panel:#5d4f5d;--edge:#392f39;--text:#fff2f9;--accent:#ff97c7;--accentInk:#4d223d;--line:rgba(255,231,244,.16);--grid:rgba(249,208,229,.17);--radarFill:rgba(255,151,199,.2);--glow:rgba(255,151,199,.13);--track:#715f70;--chat:rgba(0,0,0,.11)}
.light{--base:#f7fbfa;--panel:#fff;--edge:#bfd8d4;--text:#2d4e4b;--accent:#2fb69f;--accentInk:#fff;--line:#d6e6e3;--grid:#dbeae7;--radarFill:rgba(47,182,159,.13);--glow:rgba(47,182,159,.12);--track:#e4efed;--chat:#fff}
/* layouts */
.c1 .shell{display:grid;grid-template-columns:290px 1fr;gap:18px}.c1 .scan{padding:21px;text-align:center}.c1 .right{display:grid;gap:10px}.c1 .hero{padding:20px}.c1 .hero h3{font-size:1.65rem;margin:7px 0}.c1 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.c2 .shell{display:grid;grid-template-columns:1fr 270px;gap:18px}.c2 .map{padding:18px}.c2 .skillgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}.c2 .side{padding:18px}.c2 .side h3{margin:9px 0}.c2 .side .chat{margin-top:14px}
.c3 .shell{display:grid;grid-template-rows:auto 1fr}.c3 .body{display:grid;grid-template-columns:240px 1fr 240px;gap:13px;margin-top:18px}.c3 .radar{width:190px;height:190px}.c3 .column{display:grid;gap:9px}.c3 .center{padding:14px;display:grid;place-items:center}.c3 .stat{padding:13px}
.c4 .shell{padding:0}.c4 .toolbar{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.c4 .toolbar .chips{margin-left:auto}.c4 .main{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.c4 .radar{width:210px;height:210px}.c4 .brief{padding:20px}.c4 .brief h3{font-size:1.55rem;margin:8px 0}.c4 .brief .chat{margin-top:14px}
.c5 .shell{display:grid;grid-template-columns:320px 1fr;gap:16px}.c5 .radarCard{padding:20px}.c5 .radar{width:245px;height:245px}.c5 .alerts{display:grid;gap:9px}.c5 .alert{padding:16px}.c5 .alert.hot{outline:2px solid var(--accent)}
.c6 .shell{display:grid;grid-template-columns:1fr 1fr;gap:15px}.c6 .left,.c6 .right{padding:20px}.c6 .radar{width:195px;height:195px}.c6 .timeline{display:grid;gap:8px;margin-top:14px}.c6 .step{padding:13px;border-left:4px solid var(--line)}.c6 .step.on{border-color:var(--accent)}
.c7 .shell{display:grid;grid-template-columns:1fr 320px;gap:14px}.c7 .bigBrief{padding:22px}.c7 .bigBrief h2{font-size:1.85rem;margin:8px 0}.c7 .bigBrief .chips{margin:14px 0}.c7 .miniRadar{padding:18px}.c7 .radar{width:210px;height:210px}.c7 .chat{margin-top:14px}
.c8 .shell{display:grid;grid-template-columns:250px 1fr;gap:14px}.c8 .nav{padding:18px}.c8 .nav .stat{margin-top:8px}.c8 .workspace{padding:18px}.c8 .workspaceTop{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}.c8 .radar{width:205px;height:205px}.c8 .recommend{padding:17px}.c8 .recommend h3{font-size:1.45rem;margin:7px 0}
.c9 .shell{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c9 .diagnostic{padding:20px}.c9 .radar{width:210px;height:210px}.c9 .conversation{padding:20px}.bubble{padding:13px 15px;border-radius:8px 17px 17px 17px;background:var(--chat);border:1px solid var(--line);font-size:.78rem;font-weight:700;margin-top:10px}.c9 .conversation .chat{margin-top:14px}
.c10 .shell{display:grid;grid-template-rows:auto 1fr}.c10 .dashboard{display:grid;grid-template-columns:280px 1fr 240px;gap:13px;margin-top:17px}.c10 .radarPanel,.c10 .mission,.c10 .score{padding:18px}.c10 .radar{width:210px;height:210px}.c10 .mission h3{font-size:1.55rem;margin:8px 0}.c10 .score .big{font-size:2.7rem;font-weight:900;color:var(--accent)}
@media(max-width:760px){.top span{display:none}.wrap{width:calc(100% - 18px);margin-top:12px}.label{display:block}.label p{margin-top:4px}.stage,.concept{min-height:650px}.c1 .shell,.c2 .shell,.c3 .body,.c4 .main,.c5 .shell,.c6 .shell,.c7 .shell,.c8 .shell,.c8 .workspaceTop,.c9 .shell,.c10 .dashboard{grid-template-columns:1fr}.c1 .stats{grid-template-columns:1fr}.radar{max-width:220px;max-height:220px}.c10 .dashboard{display:grid}.shell{padding:17px}.c4 .toolbar{align-items:flex-start;flex-wrap:wrap}.c4 .toolbar .chips{margin-left:0}}
</style>
</head>
<body>
<header class="top"><b>AI Coach · Radar Lab</b><span>10 diagnostic / recommendation concepts</span></header>
<nav class="picker" id="picker"></nav>
<main class="wrap"><div class="label"><h1 id="title">01 · Skill Scan</h1><p id="desc">Radar as the main diagnostic object.</p></div><section class="stage" id="stage"></section></main>
<script>
const mark='../assets/ai-coach-mark.svg';
const radar=`<div class="radar"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div>`;
const stats=`<div class="stat panel"><div class="statrow"><span>Vocabulary</span><b>82%</b></div><div class="meter"><i style="width:82%"></i></div></div><div class="stat panel"><div class="statrow"><span>Grammar</span><b>54%</b></div><div class="meter"><i style="width:54%"></i></div></div><div class="stat panel"><div class="statrow"><span>Sentences</span><b>68%</b></div><div class="meter"><i style="width:68%"></i></div></div>`;
const concepts=[
['Skill Scan','Radar as the main diagnostic object.','green',`<div class="shell"><div class="scan panel"><img class="mark" src="${mark}"><div class="kicker">LIVE SKILL SCAN</div>${radar}<button class="cta">Scan again</button></div><div class="right"><div class="hero panel"><div class="kicker">COACH RECOMMENDATION</div><h3>Grammar needs attention first.</h3><p>Unit 5 conditionals are dragging down today's score. A short focused set should fix it.</p><div class="chips"><span>6 min</span><span>Unit 5</span><span>Grammar</span></div></div><div class="stats">${stats}</div></div></div>`],
['Radar + Skill Tiles','Scan on the left, tappable skill tiles on the right.','cyan',`<div class="shell"><div class="map panel"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">SKILL MAP</div><h2>Where should we work?</h2></div></div>${radar}<div class="skillgrid">${stats}</div></div><div class="side panel"><div class="kicker">SELECTED AREA</div><h3>Grammar · 54%</h3><p>Most misses are from choosing between <b>will</b> and <b>going to</b>.</p><button class="cta">Practice this</button><div class="chat"><input placeholder="Ask why this is weak..."><button>Ask</button></div></div></div>`],
['Three-Zone Diagnostic','Radar centered between strengths and weak areas.','blue',`<div class="shell"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">AI DIAGNOSTIC</div><h2>Today's learning map</h2></div></div><div class="body"><div class="column">${stats}</div><div class="center panel">${radar}</div><div class="column"><div class="stat panel"><div class="kicker">STRONGEST</div><b>Vocabulary</b><p>Fast recall, good context use.</p></div><div class="stat panel"><div class="kicker">WATCH</div><b>Sentence order</b><p>Two recent mistakes.</p></div><div class="stat panel"><button class="cta">Start coach set</button></div></div></div></div>`],
['Radar Briefing','A compact control-room toolbar with radar + daily brief.','slate',`<div class="shell"><div class="toolbar"><img class="mark" src="${mark}"><div><div class="kicker">AI COACH</div><b>Daily Radar</b></div><div class="chips"><span>Brief</span><span>Chat</span><span>History</span></div></div><div class="main"><div class="panel" style="display:grid;place-items:center">${radar}</div><div class="brief panel"><div class="kicker">TODAY'S BRIEF</div><h3>You are close to balanced.</h3><p>Vocabulary is strong. Grammar is the only clear weak point, so I would spend today's extra practice there.</p><div class="chips"><span>Grammar 54%</span><span>6 questions</span><span>≈ 5 min</span></div><div class="chat"><input placeholder="Ask the coach about this scan..."><button>Ask</button></div></div></div></div>`],
['Alert Radar','Radar primarily exists to surface one urgent weak area.','pink',`<div class="shell"><div class="radarCard panel"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">LEARNING RADAR</div><h2>1 area needs attention</h2></div></div>${radar}</div><div class="alerts"><div class="alert panel hot"><div class="kicker">PRIORITY</div><h3>Grammar · Unit 5</h3><p>Accuracy dropped to 54% across the last two sessions.</p><button class="cta">Fix this now</button></div><div class="alert panel"><b>Vocabulary is healthy</b><p>82% and stable.</p></div><div class="alert panel"><b>Sentence building is improving</b><p>+9% this week.</p></div></div></div>`],
['Scan → Plan','Radar leads directly into a simple three-step action plan.','light',`<div class="shell"><div class="left panel"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">SCAN</div><h2>Current balance</h2></div></div>${radar}</div><div class="right panel"><div class="kicker">AI PLAN</div><h2>What I would do next</h2><div class="timeline"><div class="step on"><b>1 · Grammar refresher</b><br><small>4 questions · Unit 5</small></div><div class="step"><b>2 · Sentence builder</b><br><small>3 questions</small></div><div class="step"><b>3 · Quick vocabulary check</b><br><small>2 questions</small></div></div><button class="cta" style="margin-top:14px">Start the plan</button></div></div>`],
['Recommendation First','Large recommendation with radar as supporting evidence.','green',`<div class="shell"><div class="bigBrief panel"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">AI RECOMMENDATION</div><h2>Do 6 grammar questions next.</h2></div></div><p>That is the fastest way to improve your overall balance today.</p><div class="chips"><span>Weakest skill: Grammar</span><span>Confidence: High</span><span>5–6 min</span></div><button class="cta">Start recommended set</button></div><div class="miniRadar panel">${radar}<div class="chat"><input placeholder="Why grammar?"><button>Ask</button></div></div></div>`],
['Radar Workspace','Persistent skill rail with a detailed radar workspace.','cyan',`<div class="shell"><div class="nav panel"><div class="kicker">SKILLS</div>${stats}</div><div class="workspace panel"><div class="workspaceTop"><div>${radar}</div><div class="recommend panel"><div class="kicker">GRAMMAR SELECTED</div><h3>Future forms are inconsistent.</h3><p>You understand the rule, but choices become less accurate in longer sentences.</p><div class="chips"><span>will</span><span>going to</span><span>context clues</span></div><button class="cta" style="margin-top:13px">Practice this area</button></div></div></div></div>`],
['Radar + Conversation','Diagnostic on one side, coach conversation on the other.','blue',`<div class="shell"><div class="diagnostic panel"><div class="kicker">YOUR RADAR</div>${radar}<div style="margin-top:13px">${stats}</div></div><div class="conversation panel"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">COACH CHAT</div><h2>Let's fix the weak spot.</h2></div></div><div class="bubble">Your grammar score is lower than the other areas, but the mistakes are clustered around one pattern.</div><div class="bubble">So I don't need to give you a huge grammar lesson. Six focused questions should be enough.</div><div class="chat"><input placeholder="Ask a follow-up..."><button>Send</button></div></div></div>`],
['Command Radar','Full dashboard: radar, mission, and score prediction.','slate',`<div class="shell"><div class="head"><img class="mark" src="${mark}"><div><div class="kicker">AI COMMAND RADAR</div><h2>Today's learning status</h2></div></div><div class="dashboard"><div class="radarPanel panel">${radar}</div><div class="mission panel"><div class="kicker">NEXT MISSION</div><h3>Raise grammar above 65%</h3><p>Complete one focused set, then the coach will rescan your balance automatically.</p><button class="cta">Start mission</button></div><div class="score panel"><div class="kicker">PREDICTED</div><div class="big">68%</div><p>Expected grammar score after this set.</p><div class="meter"><i style="width:68%"></i></div></div></div></div>`]
];
const picker=document.getElementById('picker'),stage=document.getElementById('stage'),title=document.getElementById('title'),desc=document.getElementById('desc');
concepts.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>show(i);picker.appendChild(b)});
function show(i){[...picker.children].forEach((b,n)=>b.classList.toggle('on',n===i));title.textContent=String(i+1).padStart(2,'0')+' · '+concepts[i][0];desc.textContent=concepts[i][1];stage.innerHTML=`<article class="concept on ${concepts[i][2]} c${i+1}">${concepts[i][3]}</article>`}
show(0);
</script>
</body></html>
