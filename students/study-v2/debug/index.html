<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI Coach Diagnostics</title>
<script src="/students/api-gateway.js?v=20260818-coachdebugisolated1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#203940;--muted:#72858a;--line:#dbe6e8;--teal:#168793;--soft:#eaf8f9;--red:#b84b57;--amber:#9a6d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}button{font:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1050px;margin:auto;padding:14px 16px;display:flex;gap:12px;align-items:center}.head strong{font-size:1rem}.head small{display:block;color:var(--muted);font-size:.72rem}.spacer{flex:1}.badge{font-size:.65rem;font-weight:800;letter-spacing:.08em;background:#eef2f3;border-radius:999px;padding:6px 9px}.refresh{border:0;border-radius:11px;background:#203940;color:#fff;padding:9px 12px;font-weight:800}
main{max-width:1050px;margin:auto;padding:18px 14px 50px}.notice{padding:12px 14px;border:1px solid #bfe0e3;background:#eefafb;border-radius:14px;color:#37656b;font-size:.78rem;line-height:1.5;margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#496168}.tabs button.active{border-color:#54bdc5;background:var(--soft);color:#176f78}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:1rem}.card h3{font-size:.88rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f3f7f8;border-radius:12px;padding:10px}.stat small{display:block;color:var(--muted);font-size:.65rem}.stat strong{display:block;margin-top:2px;font-size:.95rem;overflow-wrap:anywhere}
.book{margin-top:12px;padding-top:12px;border-top:1px solid #edf2f3}.book:first-of-type{margin-top:0;padding-top:0;border-top:0}.skillrow{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(5,minmax(55px,.65fr));gap:8px;align-items:center;padding:9px 4px;border-top:1px solid #eef2f3;font-size:.72rem}.skillrow:first-child{border-top:0}.muted{color:var(--muted)}
.candidate{display:grid;grid-template-columns:42px minmax(0,1.6fr) 70px 72px 72px;gap:9px;align-items:center;padding:12px 8px;border-top:1px solid #edf2f3;font-size:.72rem}.candidate.selected{background:#eafafb;border-radius:13px;border-top-color:transparent;margin:3px 0}.rank{font-weight:900}.score{font-size:1rem;font-weight:900;color:#176f78}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#edf3f4;font-size:.62rem;font-weight:800}.reason{grid-column:2/-1;color:#657a80;font-size:.66rem;line-height:1.5}.weak{color:var(--red)}.due{color:var(--amber)}pre{white-space:pre-wrap;word-break:break-word;background:#142a30;color:#dff7f9;border-radius:14px;padding:13px;font:11px/1.45 monospace;max-height:65vh;overflow:auto}.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.skillrow{grid-template-columns:1fr 60px 60px}.skillrow>*:nth-child(4),.skillrow>*:nth-child(5),.skillrow>*:nth-child(6){display:none}.candidate{grid-template-columns:34px 1fr 64px}.candidate>*:nth-child(4),.candidate>*:nth-child(5){display:none}.reason{grid-column:2/-1}.head small{display:none}}
</style>
</head>
<body>
<header><div class="head"><div><strong>AI Coach · Under the Hood</strong><small>Isolated staging diagnostics · read-only</small></div><span class="spacer"></span><span class="badge">STAGING</span><button class="refresh" id="refreshBtn">Refresh</button></div></header>
<main>
<div class="notice">This page does not load or modify Study V2. It only reads the current signed-in student's cached book assignment plus progress/adaptive endpoints and reproduces the current Coach scoring for inspection.</div>
<div class="tabs"><button class="active" data-tab="student">Student snapshot</button><button data-tab="candidates">Candidate ranking</button><button data-tab="raw">Raw</button></div>
<div id="body"><div class="empty">Loading diagnostics…</div></div>
</main>
<script>
(function(){
'use strict';
if(location.hostname!=='staging.willenaenglish.com'){document.getElementById('body').innerHTML='<div class="empty">This diagnostic is staging-only.</div>';return;}
var CACHE_PREFIX='willena-study-v2-home:v1:';
var RUNNABLE=['vocabulary','spelling','grammar','sentence_building','conversation','listening','reading'];
var LABEL={vocabulary:'Vocabulary',spelling:'Spelling',grammar:'Grammar',sentence_building:'Sentence Builder',conversation:'Conversation',listening:'Listening',reading:'Reading'};
var data={cache:null,progress:null,adaptive:null,stats:{},candidates:[],chosen:[]},tab='student';
function text(v){return String(v==null?'':v).trim()}function arr(v){return Array.isArray(v)?v:[]}function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||0))}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){try{return text(localStorage.getItem('user_id')||sessionStorage.getItem('user_id')||localStorage.getItem('userId')||sessionStorage.getItem('userId'))}catch(_){return''}}
function readCache(){try{var id=uid(),o=id&&JSON.parse(localStorage.getItem(CACHE_PREFIX+id)||'null');return o&&Array.isArray(o.books)?o:null}catch(_){return null}}
function api(path){var fn=window.WillenaAPI&&typeof WillenaAPI.fetch==='function'?WillenaAPI.fetch.bind(WillenaAPI):fetch;return fn(path,{credentials:'include',cache:'no-store'}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok||d&&d.success===false)throw new Error(d&&d.error||('Request failed '+r.status));return d})})}
function key(b,u,s){return String(b)+'|'+String(u)+'|'+String(s)}
function buildStats(records,adaptive){var by={};function row(r){if(!r||!r.book_id||!r.unit_id||RUNNABLE.indexOf(String(r.skill))<0)return null;var k=key(r.book_id,r.unit_id,r.skill);if(!by[k])by[k]={bookId:String(r.book_id),unitId:String(r.unit_id),skill:String(r.skill),attempts:0,correct:0,unique:0,lapses:0,due:0,wm:0,w:0,lastSeen:0,items:{}};return by[k]}
arr(records).forEach(function(r){var s=row(r);if(!s)return;var ik=String(r.content_type||'')+':'+String(r.content_id||'');if(s.items[ik])return;s.items[ik]=1;s.unique++;var at=Math.max(0,Number(r.attempts)||0),co=Math.max(0,Number(r.correct)||0),m=clamp(r.mastery_score,0,100),w=Math.max(1,at);s.attempts+=at;s.correct+=co;s.lapses+=Math.max(0,Number(r.lapses)||0);s.wm+=m*w;s.w+=w;var dt=Date.parse(r.last_seen_at||'');if(Number.isFinite(dt))s.lastSeen=Math.max(s.lastSeen,dt);if(r.due===true||(r.next_due_at&&Date.parse(r.next_due_at)<=Date.now()))s.due++});
arr(adaptive).forEach(function(r){var s=row(r);if(!s)return;var ik=String(r.content_type||'')+':'+String(r.content_id||'');if(!s.items[ik]){s.items[ik]=1;s.unique++;s.wm+=clamp(r.mastery_score,0,100);s.w++;s.lapses+=Math.max(0,Number(r.lapses)||0)}if(r.due===true||(r.next_due_at&&Date.parse(r.next_due_at)<=Date.now()))s.due=Math.max(s.due,1)});
Object.keys(by).forEach(function(k){var s=by[k];s.mastery=s.w?Math.round(s.wm/s.w):0;s.accuracy=s.attempts?Math.round(s.correct/s.attempts*100):null;delete s.items;delete s.wm;delete s.w});return by}
function title(b){return text(b&&b.book_title||b&&b.title||'Book')}function unitNo(u){return Number(u&&u.unit_number)||0}
function assignedUnit(book){var units=arr(book&&book.units),hint=text(book&&book.current_unit||book&&book.starting_unit),n=(hint.match(/\d+/)||[])[0];return units.find(function(u){return String(u.id)===hint||(n&&String(u.unit_number)===String(n))})||book.currentUnit||units[0]||null}
function rowsFor(bid,uid){return Object.keys(data.stats).map(function(k){return data.stats[k]}).filter(function(s){return s.bookId===String(bid)&&s.unitId===String(uid)})}
function average(rows){if(!rows.length)return 0;var t=0,w=0;rows.forEach(function(s){var x=Math.max(1,s.attempts||s.unique||1);t+=s.mastery*x;w+=x});return w?Math.round(t/w):0}function daysSince(ms){return ms?Math.max(0,Math.floor((Date.now()-ms)/86400000)):999}
function candidate(type,score,b,u,s,current,parts){return{type:type,score:score,bookId:String(b.book_id),bookTitle:title(b),unitId:String(u.id),unitNumber:unitNo(u),skill:s.skill,mastery:s.mastery,attempts:s.attempts,unique:s.unique,lapses:s.lapses,due:s.due,lastSeen:s.lastSeen,current:current,parts:parts}}
function makeCandidates(){var books=arr(data.cache&&data.cache.books),out=[],bookSeen={};books.forEach(function(b){var cur=assignedUnit(b),curId=cur&&String(cur.id),available=arr(b.availableSkills).length?arr(b.availableSkills):RUNNABLE,latest=0;Object.keys(data.stats).forEach(function(k){var s=data.stats[k];if(s.bookId===String(b.book_id))latest=Math.max(latest,s.lastSeen||0)});bookSeen[String(b.book_id)]=latest;arr(b.units).forEach(function(u){var current=curId===String(u.id);rowsFor(b.book_id,u.id).forEach(function(s){var gap=Math.max(0,80-s.mastery),cb=current?8:0,age=Math.min(8,Math.max(0,daysSince(s.lastSeen)-3));if((s.lapses>0||s.mastery<75)&&s.attempts+s.unique>0){var lb=Math.min(24,s.lapses*4),gb=Math.min(18,gap*.45),db=Math.min(12,s.due*4),ab=Math.min(5,age),low=s.mastery<60?8:0;out.push(candidate('weak',72+lb+gb+db+cb+ab+low,b,u,s,current,[['weak base',72],['lapses',lb],['mastery gap',gb],['due',db],['current unit',cb],['time since seen',ab],['mastery <60',low]]));return}if(s.due>0){var d=Math.min(24,s.due*6),a=Math.min(6,age);out.push(candidate('due',62+d+cb+a,b,u,s,current,[['review base',62],['due items',d],['current unit',cb],['time since seen',a]]));return}if(s.mastery>=75&&s.mastery<85&&s.attempts>=4){var n=(85-s.mastery)*.8;out.push(candidate('near',50+n+cb,b,u,s,current,[['near-secure base',50],['distance from 85%',n],['current unit',cb]]));return}if(current&&s.attempts>0&&(s.attempts<4||s.unique<2)){var x=(4-Math.min(4,s.attempts))*3;out.push(candidate('coverage',45+x+cb,b,u,s,true,[['coverage base',45],['low attempts',x],['current unit',cb]]))}})});if(cur){var cr=rowsFor(b.book_id,cur.id),av=average(cr),major=cr.some(function(s){return s.mastery<65&&s.attempts+s.unique>0}),units=arr(b.units).slice().sort(function(x,y){return unitNo(x)-unitNo(y)}),i=units.findIndex(function(u){return String(u.id)===String(cur.id)}),next=i>=0&&i<units.length-1?units[i+1]:null;if(next&&av>=82&&!major){var skill=available.indexOf('vocabulary')>=0?'vocabulary':available[0]||'vocabulary';out.push({type:'preview',score:36+(av>=90?5:0),bookId:String(b.book_id),bookTitle:title(b),unitId:String(next.id),unitNumber:unitNo(next),skill:skill,mastery:av,attempts:0,unique:0,lapses:0,due:0,lastSeen:0,current:false,parts:[['preview base',36],['mastery >=90',av>=90?5:0]]})}if(!cr.length){var fs=available[0]||'vocabulary';out.push({type:'fresh',score:40,bookId:String(b.book_id),bookTitle:title(b),unitId:String(cur.id),unitNumber:unitNo(cur),skill:fs,mastery:0,attempts:0,unique:0,lapses:0,due:0,lastSeen:0,current:true,parts:[['fresh/current unit',40]]})}}});var newest=0;Object.keys(bookSeen).forEach(function(k){newest=Math.max(newest,bookSeen[k]||0)});if(books.length>1&&newest)out.forEach(function(c){var lag=(newest-(bookSeen[c.bookId]||0))/86400000;if(lag>=2){var bonus=Math.min(8,Math.floor(lag));c.score+=bonus;c.parts.push(['book balance',bonus])}});out.sort(function(a,b){return b.score-a.score||(b.current?1:0)-(a.current?1:0)});var chosen=[],counts={},skills={};function add(c,strict){if(chosen.some(function(x){return x.bookId===c.bookId&&x.unitId===c.unitId&&x.skill===c.skill}))return;if((counts[c.bookId]||0)>=2&&books.length>1)return;if(strict&&skills[c.skill])return;chosen.push(c);counts[c.bookId]=(counts[c.bookId]||0)+1;skills[c.skill]=1}out.forEach(function(c){if(chosen.length<3)add(c,true)});out.forEach(function(c){if(chosen.length<3)add(c,false)});out.forEach(function(c,i){c.rank=i+1;c.selected=chosen.indexOf(c)>=0?chosen.indexOf(c)+1:0});data.chosen=chosen;return out}
function reason(c){return arr(c.parts).filter(function(p){return Math.abs(Number(p[1])||0)>.01}).map(function(p){var v=Number(p[1])||0;return p[0]+' '+(v>=0?'+':'')+v.toFixed(v%1?1:0)}).join(' · ')}
function studentHtml(){if(!data.cache)return'<div class="empty">No Study V2 cache found for this signed-in student. Open Study V2 once, then refresh this page.</div>';var stats=Object.keys(data.stats).map(function(k){return data.stats[k]}),attempts=stats.reduce(function(n,s){return n+s.attempts},0),lapses=stats.reduce(function(n,s){return n+s.lapses},0),due=stats.reduce(function(n,s){return n+s.due},0),h='<div class="card"><h2>Current student</h2><div class="grid"><div class="stat"><small>User ID</small><strong>'+esc(uid()||'—')+'</strong></div><div class="stat"><small>Assigned books</small><strong>'+arr(data.cache.books).length+'</strong></div><div class="stat"><small>Total attempts</small><strong>'+attempts+'</strong></div><div class="stat"><small>Due / lapses</small><strong>'+due+' / '+lapses+'</strong></div></div></div>';arr(data.cache.books).forEach(function(b){var u=assignedUnit(b),rows=u?rowsFor(b.book_id,u.id):[];h+='<div class="card"><h3>'+esc(title(b))+' · '+(u?'Unit '+unitNo(u):'no unit')+'</h3><div class="grid"><div class="stat"><small>Current unit mastery</small><strong>'+average(rows)+'%</strong></div><div class="stat"><small>Available skills</small><strong>'+arr(b.availableSkills).length+'</strong></div><div class="stat"><small>Tracked skill rows</small><strong>'+rows.length+'</strong></div><div class="stat"><small>Last seen</small><strong>'+esc((data.candidates.find(function(c){return c.bookId===String(b.book_id)})&&'tracked')||'—')+'</strong></div></div><div class="book">';rows.sort(function(a,b){return a.skill.localeCompare(b.skill)}).forEach(function(s){h+='<div class="skillrow"><strong>'+esc(LABEL[s.skill]||s.skill)+'</strong><span>'+s.mastery+'%</span><span>'+(s.accuracy==null?'—':s.accuracy+'%')+'</span><span>'+s.attempts+' attempts</span><span class="'+(s.lapses?'weak':'')+'">'+s.lapses+' lapses</span><span class="'+(s.due?'due':'')+'">'+s.due+' due</span></div>'});h+='</div></div>'});return h}
function candidatesHtml(){if(!data.candidates.length)return'<div class="empty">No recommendation candidates yet.</div>';var h='<div class="card"><h2>Current Coach candidate ranking</h2><div class="grid"><div class="stat"><small>Total candidates</small><strong>'+data.candidates.length+'</strong></div><div class="stat"><small>Selected</small><strong>'+data.chosen.length+'</strong></div><div class="stat"><small>Top score</small><strong>'+Number(data.candidates[0].score).toFixed(1)+'</strong></div><div class="stat"><small>Top type</small><strong>'+esc(data.candidates[0].type)+'</strong></div></div></div><div class="card">';data.candidates.forEach(function(c){h+='<div class="candidate '+(c.selected?'selected':'')+'"><span class="rank">#'+c.rank+'</span><div><strong>'+esc(c.bookTitle+' · Unit '+c.unitNumber+' · '+(LABEL[c.skill]||c.skill))+'</strong><div><span class="pill">'+esc(c.type)+'</span>'+(c.selected?' <span class="pill">SELECTED '+c.selected+'</span>':'')+'</div></div><span class="score">'+Number(c.score).toFixed(1)+'</span><span>'+c.mastery+'%</span><span>'+c.lapses+' lapses</span><div class="reason">'+esc(reason(c))+' · '+c.attempts+' attempts · '+c.due+' due</div></div>'});return h+'</div>'}
function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});var body=document.getElementById('body');if(tab==='student')body.innerHTML=studentHtml();else if(tab==='candidates')body.innerHTML=candidatesHtml();else body.innerHTML='<pre>'+esc(JSON.stringify(data,null,2))+'</pre>'}
async function refresh(){document.getElementById('body').innerHTML='<div class="empty">Refreshing…</div>';data.cache=readCache();try{var both=await Promise.all([api('/.netlify/functions/progress_summary?section=study_progress&_='+Date.now()).catch(function(){return{records:[]}}),api('/.netlify/functions/progress_summary?section=adaptive_state&_='+Date.now()).catch(function(){return{items:[]}})]);data.progress=both[0];data.adaptive=both[1];data.stats=buildStats(arr(data.progress&&data.progress.records),arr(data.adaptive&&data.adaptive.items));data.candidates=makeCandidates()}catch(e){document.getElementById('body').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>';return}render()}
document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.tab;render()})});document.getElementById('refreshBtn').addEventListener('click',refresh);refresh();
})();
</script>
</body>
</html>
