<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>AI Coach Feedback Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#203940;--muted:#72858a;--line:#dbe6e8;--soft:#eaf8f9;--green:#267358;--red:#a5404d;--amber:#9a6d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1000px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:10px}.head strong{font-size:1rem}.spacer{flex:1}.badge{background:#eef3f4;border-radius:999px;padding:6px 9px;font-size:.65rem;font-weight:800}.refresh{border:0;border-radius:11px;background:#203940;color:#fff;padding:10px 14px;font:800 .8rem Poppins}main{max-width:1000px;margin:auto;padding:18px 14px 60px}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.notice{background:#eefafb;border-color:#bfe0e3;color:#37656b;font-size:.76rem;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f3f7f8;border-radius:12px;padding:10px}.stat small{display:block;color:var(--muted);font-size:.64rem}.stat strong{display:block;margin-top:3px;font-size:.9rem;overflow-wrap:anywhere}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}h2{font-size:1rem;margin:0 0 10px}.row{display:grid;grid-template-columns:minmax(0,1.7fr) 72px 70px 70px;gap:8px;padding:11px 4px;border-top:1px solid #edf2f3;font-size:.7rem;align-items:center}.item-title{font-size:.8rem;font-weight:800;line-height:1.35}.item-prompt{margin-top:3px;color:#50666c;font-size:.68rem;line-height:1.4}.uuid{margin-top:5px;color:#9aabad;font:9px/1.35 monospace;overflow-wrap:anywhere}.pill{display:inline-flex;padding:3px 7px;background:#edf3f4;border-radius:999px;font-size:.6rem;font-weight:800}.score{font-size:.95rem;font-weight:900}.sub{grid-column:1/-1;color:var(--muted);font-size:.63rem;line-height:1.45}.empty{padding:25px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#142a30;color:#dff7f9;border-radius:13px;padding:12px;font:10px/1.45 monospace;max-height:55vh;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:minmax(0,1fr) 62px 60px}.row>:nth-child(4){display:none}.head .badge{display:none}}
</style>
</head>
<body>
<header><div class="head"><strong>AI Coach · Feedback Loop</strong><span class="spacer"></span><span class="badge">STAGING</span><button class="refresh" id="refresh">Refresh</button></div></header>
<main>
<div class="notice"><b>Step 0 diagnostic.</b> Items now resolve against the curriculum, so use the visible word, grammar concept or question instead of a UUID. Note one item below, answer it in Study, then press Refresh and watch its attempts/mastery/need score change.</div>
<div id="app"><div class="empty">Connecting…</div></div>
</main>
<script>
(function(){
'use strict';
var DATA_URL='https://fiieuiktlsivwfgyivai.supabase.co';
var DATA_KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
var CONTENT_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
var CONTENT_KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
function t(v){return String(v==null?'':v).trim()}
function esc(v){return t(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}
function uid(){try{return t(localStorage.getItem('user_id')||sessionStorage.getItem('user_id')||localStorage.getItem('userId')||sessionStorage.getItem('userId'))}catch(_){return''}}
function token(){try{return t(localStorage.getItem('sb_access_token'))}catch(_){return''}}
async function rest(table,query){var tok=token();if(!tok)throw Error('No sb_access_token in this browser');var r=await fetch(DATA_URL+'/rest/v1/'+table+'?'+query,{headers:{apikey:DATA_KEY,Authorization:'Bearer '+tok},cache:'no-store'});var tx=await r.text();if(!r.ok)throw Error(table+' read failed ('+r.status+'): '+tx);try{return JSON.parse(tx)}catch(_){return[]}}
async function content(table,query){var r=await fetch(CONTENT_URL+'/rest/v1/'+table+'?'+query,{headers:{apikey:CONTENT_KEY,Authorization:'Bearer '+CONTENT_KEY},cache:'no-store'});if(!r.ok)throw Error(table+' '+r.status);return r.json()}
function uniq(a){return Array.from(new Set((a||[]).map(t).filter(Boolean)))}
function inq(ids){return '('+ids.map(function(x){return encodeURIComponent(x)}).join(',')+')'}
function answerText(v){if(typeof v==='string'||typeof v==='number')return t(v);if(v&&typeof v==='object')return t(v.text||v.answer||v.value);return''}
function friendlyObject(o){if(!o)return'';return t(o.display_name||o.name||o.label||o.title||o.pattern_name||o.pattern||o.lemma||o.headword||o.word||o.term||o.english||o.text||o.canonical_form||o.surface_form)}
async function resolveLabels(rows){var labels={},details={};var assess=uniq(rows.filter(function(r){return t(r.content_type)==='assessment_item'}).map(function(r){return r.content_id}));var lex=uniq(rows.filter(function(r){return t(r.content_type)==='lexical_entry'}).map(function(r){return r.content_id}));var pat=uniq(rows.filter(function(r){return t(r.content_type)==='pattern'}).map(function(r){return r.content_id}));
  if(assess.length){try{var ar=await content('assessment_items','select=id,prompt_text,context_text,correct_answer,item_type&id=in.'+inq(assess)+'&limit=300');(ar||[]).forEach(function(x){var ans=answerText(x.correct_answer),p=t(x.prompt_text),ctx=t(x.context_text);labels['assessment_item|'+x.id]=ans||p||'Assessment item';details['assessment_item|'+x.id]=p+(ctx&&ctx!==p?' · '+ctx:'')})}catch(_){} }
  if(lex.length){try{var lr=await content('lexical_entries','select=*&id=in.'+inq(lex)+'&limit=300');(lr||[]).forEach(function(x){var lab=friendlyObject(x);labels['lexical_entry|'+x.id]=lab||'Vocabulary item'})}catch(_){} }
  if(pat.length){try{var pr=await content('grammar_patterns','select=*&id=in.'+inq(pat)+'&limit=300');(pr||[]).forEach(function(x){var lab=friendlyObject(x);labels['pattern|'+x.id]=lab||'Grammar pattern'})}catch(_){};try{var pa=await content('assessment_items','select=id,prompt_text,context_text,correct_answer,anchor_pattern_id&anchor_pattern_id=in.'+inq(pat)+'&status=eq.published&limit=300');(pa||[]).forEach(function(x){var k='pattern|'+x.anchor_pattern_id;if(!details[k])details[k]=t(x.prompt_text);if(!labels[k])labels[k]=answerText(x.correct_answer)||t(x.prompt_text)||'Grammar pattern'})}catch(_){} }
  rows.forEach(function(r){var k=t(r.content_type)+'|'+t(r.content_id);if(!labels[k])labels[k]=(t(r.skill)==='grammar'?'Grammar item':t(r.skill)==='vocabulary'?'Vocabulary item':'Study item')});return{labels:labels,details:details}}
function score(r){var attempts=Number(r.attempts)||0,correct=Number(r.correct_attempts)||0,m=Number.isFinite(Number(r.mastery_score))?Number(r.mastery_score):(attempts?correct/attempts*100:50),acc=Number.isFinite(Number(r.accuracy))?Number(r.accuracy)*100:(attempts?correct/attempts*100:0),l=Number(r.lapses)||0,next=Date.parse(r.next_review_at||'')||0,due=!next||next<=Date.now(),gap=Math.max(0,85-m),s=18+Math.min(42,gap*.7)+Math.min(32,l*8)+(due?14:0)+(acc<75?Math.min(18,(75-acc)*.45):0);return Math.max(0,Math.round(s*10)/10)}
function when(v){if(!v)return'—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString()}
function itemHtml(r,res){var k=t(r.content_type)+'|'+t(r.content_id),lab=res.labels[k]||'Study item',det=res.details[k]||'';return'<div><div class="item-title">'+esc(lab)+'</div>'+(det&&det!==lab?'<div class="item-prompt">'+esc(det)+'</div>':'')+'<div><span class="pill">'+esc(r.skill)+' · '+esc(r.content_type)+'</span></div><div class="uuid">'+esc(r.content_id)+'</div></div>'}
async function load(){var app=document.getElementById('app'),id=uid();app.innerHTML='<div class="empty">Refreshing…</div>';try{if(!id)throw Error('No user_id in this browser');var qid=encodeURIComponent(id),both=await Promise.all([rest('student_content_mastery','student_id=eq.'+qid+'&select=student_id,book_id,unit_id,content_type,content_id,skill,attempts,correct_attempts,accuracy,mastery_score,last_seen_at,next_review_at,lapses,review_state,updated_at&order=last_seen_at.desc&limit=200'),rest('study_attempts','student_id=eq.'+qid+'&select=book_id,unit_id,skill,content_type,content_id,mastery_content_type,mastery_content_id,is_correct,created_at&order=created_at.desc&limit=20')]),mastery=both[0]||[],attempts=both[1]||[],res=await resolveLabels(mastery),by={};mastery.forEach(function(r){by[[r.book_id,r.unit_id,r.skill,r.content_type,r.content_id].join('|')]=r});var latest=attempts[0]||null,linked=null;if(latest){var mt=latest.mastery_content_type||latest.content_type,mi=latest.mastery_content_id||latest.content_id;linked=by[[latest.book_id,latest.unit_id,latest.skill,mt,mi].join('|')]||null}var weak=mastery.slice().sort(function(a,b){return score(b)-score(a)}).slice(0,30);app.innerHTML='<div class="card"><h2>Connection</h2><div class="grid"><div class="stat"><small>Status</small><strong class="ok">CONNECTED ✓</strong></div><div class="stat"><small>User</small><strong>'+esc(id)+'</strong></div><div class="stat"><small>Mastery rows</small><strong>'+mastery.length+'</strong></div><div class="stat"><small>Recent attempts</small><strong>'+attempts.length+'</strong></div></div></div>'+
'<div class="card"><h2>Newest recorded Study answer</h2>'+(latest?'<div class="grid"><div class="stat"><small>Skill</small><strong>'+esc(latest.skill)+'</strong></div><div class="stat"><small>Correct</small><strong class="'+(latest.is_correct?'ok':'bad')+'">'+latest.is_correct+'</strong></div><div class="stat"><small>Recorded</small><strong>'+esc(when(latest.created_at))+'</strong></div><div class="stat"><small>Mastery row linked</small><strong class="'+(linked?'ok':'warn')+'">'+(linked?'YES':'NO')+'</strong></div></div>'+(linked?'<div style="margin-top:10px">'+itemHtml(linked,res)+'</div><div class="grid" style="margin-top:8px"><div class="stat"><small>Attempts</small><strong>'+linked.attempts+'</strong></div><div class="stat"><small>Mastery</small><strong>'+Math.round(Number(linked.mastery_score)||0)+'%</strong></div><div class="stat"><small>Lapses</small><strong>'+linked.lapses+'</strong></div><div class="stat"><small>Coach need score</small><strong>'+score(linked).toFixed(1)+'</strong></div></div>':''):'<div class="empty">No Study attempts found.</div>')+'</div>'+
'<div class="card"><h2>Highest item / concept needs</h2>'+(weak.length?weak.map(function(r){return'<div class="row">'+itemHtml(r,res)+'<b class="score">'+score(r).toFixed(1)+'</b><span>'+Math.round(Number(r.mastery_score)||0)+'%</span><span>'+r.lapses+' lapses</span><div class="sub">'+r.attempts+' attempts · '+r.correct_attempts+' correct · last '+esc(when(r.last_seen_at))+' · '+esc(r.review_state)+'</div></div>'}).join(''):'<div class="empty">No mastery rows.</div>')+'</div>'+
'<div class="card"><h2>Raw latest pair</h2><pre>'+esc(JSON.stringify({latestAttempt:latest,linkedMastery:linked},null,2))+'</pre></div>';}catch(e){app.innerHTML='<div class="card"><h2 class="bad">Connection failed</h2><div class="bad">'+esc(e.message||e)+'</div></div>'}}
document.getElementById('refresh').onclick=load;load();
})();
</script>
</body>
</html>
