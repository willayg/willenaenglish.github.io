<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>AI Coach Feedback Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#203940;--muted:#72858a;--line:#dbe6e8;--soft:#eaf8f9;--green:#267358;--red:#a5404d;--amber:#9a6d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1000px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:10px}.head strong{font-size:1rem}.spacer{flex:1}.badge{background:#eef3f4;border-radius:999px;padding:6px 9px;font-size:.65rem;font-weight:800}.refresh{border:0;border-radius:11px;background:#203940;color:#fff;padding:10px 14px;font:800 .8rem Poppins}main{max-width:1000px;margin:auto;padding:18px 14px 60px}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.notice{background:#eefafb;border-color:#bfe0e3;color:#37656b;font-size:.76rem;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f3f7f8;border-radius:12px;padding:10px}.stat small{display:block;color:var(--muted);font-size:.64rem}.stat strong{display:block;margin-top:3px;font-size:.9rem;overflow-wrap:anywhere}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}h2{font-size:1rem;margin:0 0 10px}.row{display:grid;grid-template-columns:minmax(0,1.7fr) 72px 70px 70px;gap:8px;padding:10px 4px;border-top:1px solid #edf2f3;font-size:.7rem;align-items:center}.row b{overflow-wrap:anywhere}.pill{display:inline-flex;padding:3px 7px;background:#edf3f4;border-radius:999px;font-size:.6rem;font-weight:800}.score{font-size:.95rem;font-weight:900}.sub{grid-column:1/-1;color:var(--muted);font-size:.63rem;line-height:1.45}.empty{padding:25px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#142a30;color:#dff7f9;border-radius:13px;padding:12px;font:10px/1.45 monospace;max-height:55vh;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:minmax(0,1fr) 62px 60px}.row>:nth-child(4){display:none}.head .badge{display:none}}
</style>
</head>
<body>
<header><div class="head"><strong>AI Coach · Feedback Loop</strong><span class="spacer"></span><span class="badge">STAGING</span><button class="refresh" id="refresh">Refresh</button></div></header>
<main>
<div class="notice"><b>Step 0 diagnostic.</b> This page reads the same student/progress database that stores Study answers. Test: note the newest item below, answer a Study question, then press Refresh. Its attempt/mastery values should change.</div>
<div id="app"><div class="empty">Connecting…</div></div>
</main>
<script>
(function(){
'use strict';
var URL='https://fiieuiktlsivwfgyivai.supabase.co';
var KEY='sb_publishable_e-K50PquV9gHdfmefG6tmg_o-vVSl0e';
function t(v){return String(v==null?'':v).trim()}
function esc(v){return t(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){try{return t(localStorage.getItem('user_id')||sessionStorage.getItem('user_id')||localStorage.getItem('userId')||sessionStorage.getItem('userId'))}catch(_){return''}}
function token(){try{return t(localStorage.getItem('sb_access_token'))}catch(_){return''}}
async function rest(table,query){var tok=token();if(!tok)throw Error('No sb_access_token in this browser');var r=await fetch(URL+'/rest/v1/'+table+'?'+query,{headers:{apikey:KEY,Authorization:'Bearer '+tok},cache:'no-store'});var tx=await r.text();if(!r.ok)throw Error(table+' read failed ('+r.status+'): '+tx);try{return JSON.parse(tx)}catch(_){return[]}}
function score(r){var attempts=Number(r.attempts)||0,correct=Number(r.correct_attempts)||0,m=Number.isFinite(Number(r.mastery_score))?Number(r.mastery_score):(attempts?correct/attempts*100:50),acc=Number.isFinite(Number(r.accuracy))?Number(r.accuracy)*100:(attempts?correct/attempts*100:0),l=Number(r.lapses)||0,next=Date.parse(r.next_review_at||'')||0,due=!next||next<=Date.now(),gap=Math.max(0,85-m),s=18+Math.min(42,gap*.7)+Math.min(32,l*8)+(due?14:0)+(acc<75?Math.min(18,(75-acc)*.45):0);return Math.max(0,Math.round(s*10)/10)}
function when(v){if(!v)return'—';var d=new Date(v);return isNaN(d)?'—':d.toLocaleString()}
async function load(){var app=document.getElementById('app'),id=uid();app.innerHTML='<div class="empty">Refreshing…</div>';try{if(!id)throw Error('No user_id in this browser');var qid=encodeURIComponent(id),both=await Promise.all([rest('student_content_mastery','student_id=eq.'+qid+'&select=student_id,book_id,unit_id,content_type,content_id,skill,attempts,correct_attempts,accuracy,mastery_score,last_seen_at,next_review_at,lapses,review_state,updated_at&order=last_seen_at.desc&limit=200'),rest('study_attempts','student_id=eq.'+qid+'&select=book_id,unit_id,skill,content_type,content_id,mastery_content_type,mastery_content_id,is_correct,created_at&order=created_at.desc&limit=20')]),mastery=both[0]||[],attempts=both[1]||[],by={};mastery.forEach(function(r){by[[r.book_id,r.unit_id,r.skill,r.content_type,r.content_id].join('|')]=r});var latest=attempts[0]||null,linked=null;if(latest){var mt=latest.mastery_content_type||latest.content_type,mi=latest.mastery_content_id||latest.content_id;linked=by[[latest.book_id,latest.unit_id,latest.skill,mt,mi].join('|')]||null}var weak=mastery.slice().sort(function(a,b){return score(b)-score(a)}).slice(0,20);app.innerHTML='<div class="card"><h2>Connection</h2><div class="grid"><div class="stat"><small>Status</small><strong class="ok">CONNECTED ✓</strong></div><div class="stat"><small>User</small><strong>'+esc(id)+'</strong></div><div class="stat"><small>Mastery rows</small><strong>'+mastery.length+'</strong></div><div class="stat"><small>Recent attempts</small><strong>'+attempts.length+'</strong></div></div></div>'+
'<div class="card"><h2>Newest recorded Study answer</h2>'+(latest?'<div class="grid"><div class="stat"><small>Skill</small><strong>'+esc(latest.skill)+'</strong></div><div class="stat"><small>Correct</small><strong class="'+(latest.is_correct?'ok':'bad')+'">'+latest.is_correct+'</strong></div><div class="stat"><small>Recorded</small><strong>'+esc(when(latest.created_at))+'</strong></div><div class="stat"><small>Mastery row linked</small><strong class="'+(linked?'ok':'warn')+'">'+(linked?'YES':'NO')+'</strong></div></div>'+(linked?'<div class="grid" style="margin-top:8px"><div class="stat"><small>Attempts</small><strong>'+linked.attempts+'</strong></div><div class="stat"><small>Mastery</small><strong>'+Math.round(Number(linked.mastery_score)||0)+'%</strong></div><div class="stat"><small>Lapses</small><strong>'+linked.lapses+'</strong></div><div class="stat"><small>Coach need score</small><strong>'+score(linked).toFixed(1)+'</strong></div></div>':''):'<div class="empty">No Study attempts found.</div>')+'</div>'+
'<div class="card"><h2>Highest item / concept needs</h2>'+(weak.length?weak.map(function(r){return'<div class="row"><div><b>'+esc(r.skill)+' · '+esc(r.content_type)+'</b><br><span class="pill">'+esc(r.content_id)+'</span></div><b class="score">'+score(r).toFixed(1)+'</b><span>'+Math.round(Number(r.mastery_score)||0)+'%</span><span>'+r.lapses+' lapses</span><div class="sub">'+r.attempts+' attempts · '+r.correct_attempts+' correct · last '+esc(when(r.last_seen_at))+' · '+esc(r.review_state)+'</div></div>'}).join(''):'<div class="empty">No mastery rows.</div>')+'</div>'+
'<div class="card"><h2>Raw latest pair</h2><pre>'+esc(JSON.stringify({latestAttempt:latest,linkedMastery:linked},null,2))+'</pre></div>';}catch(e){app.innerHTML='<div class="card"><h2 class="bad">Connection failed</h2><div class="bad">'+esc(e.message||e)+'</div></div>'}}
document.getElementById('refresh').onclick=load;load();
})();
</script>
</body>
</html>
