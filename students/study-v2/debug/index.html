<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>AI Coach Diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#203940;--muted:#72858a;--line:#dbe6e8;--soft:#eaf8f9;--red:#b84b57;--amber:#9a6d12;--green:#38785f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}button{font:inherit}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1100px;margin:auto;padding:14px 16px;display:flex;gap:12px;align-items:center}.head strong{font-size:1rem}.spacer{flex:1}.badge{font-size:.65rem;font-weight:800;letter-spacing:.08em;background:#eef2f3;border-radius:999px;padding:6px 9px}.refresh{border:0;border-radius:11px;background:#203940;color:#fff;padding:9px 12px;font-weight:800}main{max-width:1100px;margin:auto;padding:18px 14px 50px}.notice{padding:12px 14px;border:1px solid #bfe0e3;background:#eefafb;border-radius:14px;color:#37656b;font-size:.78rem;line-height:1.5;margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#496168}.tabs button.active{border-color:#54bdc5;background:var(--soft);color:#176f78}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.card h2{margin:0 0 10px;font-size:1rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f3f7f8;border-radius:12px;padding:10px}.stat small{display:block;color:var(--muted);font-size:.65rem}.stat strong{display:block;margin-top:2px;font-size:.95rem;overflow-wrap:anywhere}.row{display:grid;grid-template-columns:42px minmax(0,1.7fr) 70px 68px 68px;gap:8px;align-items:center;padding:11px 5px;border-top:1px solid #edf2f3;font-size:.72rem}.row.sel{background:#eafafb;border-radius:13px;border-top-color:transparent}.score{font-size:1rem;font-weight:900;color:#176f78}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#edf3f4;font-size:.62rem;font-weight:800}.reason,.under{grid-column:2/-1;color:#657a80;font-size:.66rem;line-height:1.5}.under{background:#f7fafb;padding:8px 9px;border-radius:10px}.weak{color:var(--red)}.due{color:var(--amber)}.secure{color:var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#142a30;color:#dff7f9;border-radius:14px;padding:13px;font:11px/1.45 monospace;max-height:65vh;overflow:auto}.empty{text-align:center;color:var(--muted);padding:30px 10px}.error{background:#fff4f4;border-color:#efc7cb;color:#8d3843}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:34px 1fr 64px}.row>*:nth-child(4),.row>*:nth-child(5){display:none}.reason,.under{grid-column:2/-1}}
</style>
</head>
<body>
<header><div class="head"><strong>AI Coach · Under the Hood</strong><span class="spacer"></span><span class="badge">STAGING</span><button class="refresh" id="refreshBtn">Refresh</button></div></header>
<main>
<div class="notice">Read-only diagnostic. No Netlify and no progress-summary endpoint. This page reads the signed-in student's own <b>student_content_mastery</b> rows directly through Supabase RLS.</div>
<div class="tabs"><button class="active" data-tab="student">Student snapshot</button><button data-tab="needs">Item / concept needs</button><button data-tab="candidates">Candidate ranking</button><button data-tab="raw">Raw</button></div>
<div id="body"><div class="empty">Loading diagnostics…</div></div>
</main>
<script>
(function(){
'use strict';
var SUPABASE_URL='https://gxwfsqxyuufqtitspfqg.supabase.co';
var SUPABASE_KEY='sb_publishable_G-FYhHfDL4OGdL892gY1Zg_epdbEeqO';
var CACHE='willena-study-v2-home:v1:';
var RUN=['vocabulary','spelling','grammar','sentence_building','conversation','listening','reading'];
var LAB={vocabulary:'Vocabulary',spelling:'Spelling',grammar:'Grammar',sentence_building:'Sentence Builder',conversation:'Conversation',listening:'Listening',reading:'Reading'};
var D={cache:null,rows:[],needs:[],candidates:[],error:null},tab='student';
function t(v){return String(v==null?'':v).trim();}
function a(v){return Array.isArray(v)?v:[];}
function esc(v){return t(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){try{return t(localStorage.getItem('user_id')||sessionStorage.getItem('user_id')||localStorage.getItem('userId')||sessionStorage.getItem('userId'));}catch(_){return'';}}
function token(){try{return t(localStorage.getItem('sb_access_token'));}catch(_){return'';}}
function cache(){try{var o=JSON.parse(localStorage.getItem(CACHE+uid())||'null');return o&&a(o.books).length?o:null;}catch(_){return null;}}
function title(b){return t(b&&b.book_title||b&&b.title||'Book');}
function assigned(b){var us=a(b&&b.units),h=t(b&&b.current_unit||b&&b.starting_unit),n=(h.match(/\d+/)||[])[0];return us.find(function(u){return String(u.id)===h||(n&&String(u.unit_number)===String(n));})||b.currentUnit||us[0]||null;}
function type(r){var v=t(r.content_type).toLowerCase();if(v==='lexical'||v==='vocab'||v==='vocabulary')v='lexical_entry';if(v==='grammar_pattern')v='pattern';return v||'activity';}
async function loadRows(){var tok=token(),id=uid();if(!tok)throw new Error('No sb_access_token found in this browser. Open Study V2 while signed in, then return here.');if(!id)throw new Error('No student user_id found in this browser.');var q='student_id=eq.'+encodeURIComponent(id)+'&select=student_id,book_id,unit_id,content_type,content_id,skill,attempts,correct_attempts,accuracy,mastery_score,last_seen_at,next_review_at,lapses,review_state,updated_at&limit=2000';var r=await fetch(SUPABASE_URL+'/rest/v1/student_content_mastery?'+q,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok},cache:'no-store'});if(!r.ok)throw new Error('Supabase mastery read failed ('+r.status+'): '+await r.text());return r.json();}
function makeNeeds(){var books={},rows=a(D.rows);a(D.cache&&D.cache.books).forEach(function(b){books[String(b.book_id)]=b;});D.needs=rows.filter(function(r){return r&&r.book_id&&r.unit_id&&r.content_id&&RUN.indexOf(t(r.skill))>=0;}).map(function(r){var bid=String(r.book_id),unitId=String(r.unit_id),skill=t(r.skill),b=books[bid],u=b&&a(b.units).find(function(x){return String(x.id)===unitId;}),cur=b&&assigned(b),current=!!(cur&&String(cur.id)===unitId),attempts=Math.max(0,Number(r.attempts)||0),correct=Math.max(0,Number(r.correct_attempts)||0),mastery=Number.isFinite(Number(r.mastery_score))?Math.round(Number(r.mastery_score)):(attempts?Math.round(correct/attempts*100):50),accuracy=Number.isFinite(Number(r.accuracy))?Math.round(Number(r.accuracy)*100):(attempts?Math.round(correct/attempts*100):null),lapses=Math.max(0,Number(r.lapses)||0),lastSeen=Date.parse(r.last_seen_at||r.updated_at||'')||0,next=Date.parse(r.next_review_at||'')||0,due=!next||next<=Date.now(),gap=Math.max(0,85-mastery),parts={base:18,gap:Math.min(42,gap*.7),lapses:Math.min(32,lapses*8),due:due?14:0,accuracy:accuracy!=null&&accuracy<75?Math.min(18,(75-accuracy)*.45):0,current:current?8:0,recency:lastSeen&&Date.now()-lastSeen<2*3600000?-8:0},score=Math.max(0,Math.round(Object.keys(parts).reduce(function(s,k){return s+(Number(parts[k])||0);},0)*10)/10);return{bookId:bid,bookTitle:title(b),unitId:unitId,unitNumber:Number(u&&u.unit_number)||0,skill:skill,contentType:type(r),contentId:String(r.content_id),attempts:attempts,correct:correct,accuracy:accuracy,mastery:mastery,lapses:lapses,due:due,current:current,reviewState:t(r.review_state),parts:parts,score:score,status:score>=65?'weak':due?'due':score>=42?'watch':'secure'};}).sort(function(x,y){return y.score-x.score||y.lapses-x.lapses||x.mastery-y.mastery;});}
function makeCandidates(){var out=[];a(D.cache&&D.cache.books).forEach(function(b){a(b.units).forEach(function(u){RUN.forEach(function(sk){var g=D.needs.filter(function(n){return n.bookId===String(b.book_id)&&n.unitId===String(u.id)&&n.skill===sk;}),act=g.filter(function(n){return n.status!=='secure';});if(!act.length)return;var top=act[0],score=top.score+(act[1]?Math.min(14,act[1].score*.18):0)+(act[2]?Math.min(8,act[2].score*.1):0);out.push({bookId:String(b.book_id),bookTitle:title(b),unitId:String(u.id),unitNumber:Number(u.unit_number)||0,skill:sk,type:top.status==='weak'?'weak':top.status==='due'?'due':'near',score:Math.round(score*10)/10,mastery:Math.round(act.reduce(function(s,n){return s+n.mastery;},0)/act.length),lapses:act.reduce(function(s,n){return s+n.lapses;},0),needs:act.slice(0,6)});});});});out.sort(function(x,y){return y.score-x.score;});var chosen=[],skills={};out.forEach(function(c){if(chosen.length<3&&!skills[c.skill]){chosen.push(c);skills[c.skill]=1;}});out.forEach(function(c){if(chosen.length<3&&chosen.indexOf(c)<0)chosen.push(c);});out.forEach(function(c,i){c.rank=i+1;c.selected=chosen.indexOf(c)+1;});D.candidates=out;}
function reason(p){return Object.keys(p||{}).filter(function(k){return Math.abs(p[k])>.01;}).map(function(k){return k+' '+(p[k]>=0?'+':'')+Number(p[k]).toFixed(Number(p[k])%1?1:0);}).join(' · ');}
function student(){return'<div class="card"><h2>Data source</h2><div class="grid"><div class="stat"><small>User ID</small><strong>'+esc(uid()||'—')+'</strong></div><div class="stat"><small>Assigned books</small><strong>'+a(D.cache&&D.cache.books).length+'</strong></div><div class="stat"><small>Mastery rows</small><strong>'+D.rows.length+'</strong></div><div class="stat"><small>Source</small><strong>Supabase RLS</strong></div></div></div><div class="card"><h2>Tracked item summary</h2><div class="grid"><div class="stat"><small>Total</small><strong>'+D.needs.length+'</strong></div><div class="stat"><small>Weak</small><strong>'+D.needs.filter(function(n){return n.status==='weak';}).length+'</strong></div><div class="stat"><small>Watch / due</small><strong>'+D.needs.filter(function(n){return n.status==='watch'||n.status==='due';}).length+'</strong></div><div class="stat"><small>Secure</small><strong>'+D.needs.filter(function(n){return n.status==='secure';}).length+'</strong></div></div></div>'+(D.error?'<div class="card error"><b>Error:</b> '+esc(D.error)+'</div>':'');}
function needs(){if(!D.needs.length)return'<div class="card"><div class="empty">No item-level mastery rows found.</div></div>';return'<div class="card"><h2>Item / concept ranking</h2>'+D.needs.slice(0,120).map(function(n,i){return'<div class="row"><b>#'+(i+1)+'</b><div><b>'+esc(n.bookTitle+' · Unit '+n.unitNumber+' · '+(LAB[n.skill]||n.skill))+'</b><br><span class="pill">'+esc(n.contentType)+'</span> '+esc(n.contentId)+'</div><b class="score">'+n.score.toFixed(1)+'</b><span>'+n.mastery+'%</span><span class="'+(n.status==='weak'?'weak':n.status==='secure'?'secure':'due')+'">'+n.status+'</span><div class="reason">'+esc(reason(n.parts))+' · '+n.attempts+' attempts · '+n.lapses+' lapses'+(n.due?' · due':'')+'</div></div>';}).join('')+'</div>';}
function candidates(){if(!D.candidates.length)return'<div class="card"><div class="empty">No actionable candidates yet.</div></div>';return'<div class="card"><h2>Candidate ranking</h2>'+D.candidates.map(function(c){return'<div class="row '+(c.selected?'sel':'')+'"><b>#'+c.rank+'</b><div><b>'+esc(c.bookTitle+' · Unit '+c.unitNumber+' · '+(LAB[c.skill]||c.skill))+'</b><br><span class="pill">'+c.type+'</span>'+(c.selected?' <span class="pill">SELECTED '+c.selected+'</span>':'')+'</div><b class="score">'+c.score.toFixed(1)+'</b><span>'+c.mastery+'%</span><span>'+c.lapses+' lapses</span><div class="under"><b>Underlying needs:</b> '+c.needs.map(function(n){return esc(n.contentType+':'+n.contentId)+' ('+n.score.toFixed(1)+')';}).join(' · ')+'</div></div>';}).join('')+'</div>';}
function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});document.getElementById('body').innerHTML=tab==='student'?student():tab==='needs'?needs():tab==='candidates'?candidates():'<pre>'+esc(JSON.stringify(D,null,2))+'</pre>';}
async function refresh(){D.cache=cache();D.error=null;document.getElementById('body').innerHTML='<div class="empty">Refreshing…</div>';try{D.rows=await loadRows();makeNeeds();makeCandidates();}catch(e){D.rows=[];D.needs=[];D.candidates=[];D.error=String(e&&e.message||e);}render();}
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render();};});document.getElementById('refreshBtn').onclick=refresh;refresh();
})();
</script>
</body>
</html>
