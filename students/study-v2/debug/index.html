n(r){return r&&typeof r==='object'&&(r.content_id||r.mastery_content_id)&&(r.skill||r.content_type)})}function bookTitle(b){return t(b&&b.book_title||b&&b.title||'Book')}function assigned(b){var us=a(b&&b.units),h=t(b&&b.current_unit||b&&b.starting_unit),n=(h.match(/\d+/)||[])[0];return us.find(function(u){return String(u.id)===h||(n&&String(u.unit_number)===String(n))})||b.currentUnit||us[0]||null}function type(r){var v=t(r.content_type||r.mastery_content_type).toLowerCase();if(v==='lexical'||v==='vocab'||v==='vocabulary')v='lexical_entry';if(v==='grammar_pattern')v='pattern';return v||'activity'}function id(r){return t(r.content_id||r.mastery_content_id)}function makeNeeds(){var by={},books={};a(D.cache&&D.cache.books).forEach(function(b){books[String(b.book_id)]=b});function put(r){var bid=t(r.book_id),un=t(r.unit_id),sk=t(r.skill),cid=id(r);if(!bid||!un||!cid||RUN.indexOf(sk)<0)return;var k=[bid,un,sk,type(r),cid].join('|'),n=by[k]||(by[k]={key:k,bookId:bid,unitId:un,skill:sk,contentType:type(r),contentId:cid,attempts:0,correct:0,lapses:0,mastery:null,lastSeen:0,due:false});n.attempts=Math.max(n.attempts,Number(r.attempts)||0);n.correct=Math.max(n.correct,Number(r.correct_attempts!=null?r.correct_attempts:r.correct)||0);n.lapses=Math.max(n.lapses,Number(r.lapses)||0);if(Number.isFinite(Number(r.mastery_score)))n.mastery=Number(r.mastery_score);var dt=Date.parse(r.last_seen_at||r.updated_at||'');if(Number.isFinite(dt))n.lastSeen=Math.max(n.lastSeen,dt);var nr=r.next_review_at||r.next_due_at;if(r.due===true||(nr&&Date.parse(nr)<=Date.now()))n.due=true}rows(D.mastery).forEach(put);rows(D.adaptive).forEach(put);D.needs=Object.keys(by).map(function(k){var n=by[k],b=books[n.bookId],u=b&&a(b.units).find(function(x){return String(x.id)===n.unitId}),cur=b&&assigned(b),current=!!(cur&&String(cur.id)===n.unitId),m=n.mastery==null?(n.attempts?Math.round(n.correct/n.attempts*100):50):Math.round(n.mastery),acc=n.attempts?Math.round(n.correct/n.attempts*100):null,g=Math.max(0, s yet.</div></div>';return'<div class="card"><h2>Candidate ranking</h2>'+D.candidates.map(function(c){return'<div class="row '+(c.selected?'sel':'')+'"><b>#'+c.rank+'</b><div><b>'+esc(c.bookTitle+' · Unit '+c.unitNumber+' · '+(LAB[c.skill]||c.skill))+'</b><br><span class="pill">'+c.type+'</span>'+(c.selected?' <span class="pill">SELECTED '+c.selected+'</span>':'')+'</div><b class="score">'+c.score.toFixed(1)+'</b><span>'+c.mastery+'%</span><span>'+c.lapses+' lapses</span><div class="under"><b>Underlying needs:</b> '+c.needs.map(function(n){return esc(n.contentType+':'+n.contentId)+' ('+n.score.toFixed(1)+')'}).join(' · ')+'</div></div>'}).join('')+'</div>'}function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});var e=document.getElementById('body');e.innerHTML=tab==='student'?student():tab==='needs'?needs():tab==='candidates'?candidates():'<pre>'+esc(JSON.stringify(D,null,2))+'</pre>'}async function refresh(){document.getElementById('body').innerHTML='<div class="empty">Refreshing…</div>';D.cache=cache();var both=await Promise.all([api('section=study_content_mastery').catch(function(e){return{error:String(e)}}),api('section=adaptive_state').catch(function(e){return{error:String(e)}})]);D.mastery=both[0];D.adaptive=both[1];makeNeeds();makeCandidates();render()}document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});document.getElementById('refreshBtn').onclick=refresh;refresh()})()</script></body></html>
