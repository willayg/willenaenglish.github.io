<header class="topbar"><div class="brand">Willena Study V2</div><div class="tag">Control Room design lab</div><div class="top-pills"><span class="mini-pill">575 pts</span><span class="mini-pill">115 stars</span></div></header>
<nav class="picker" aria-label="Concept picker">
  <div class="picker-group" id="cats"><button class="cat on" data-cat="ai">AI Coach</button><button class="cat" data-cat="study">Book Study</button><button class="cat" data-cat="practice">Book Practice</button></div>

<main class="page">
<section class="daily-context"><div class="daily-left"><span class="today">TODAY</span><h1>오늘의 학습</h1><small>1일 연속 학습</small><div class="ring"><b>7/20</b></div></div><div class="daily-main"><h2>오늘은 13문제만 더 하면 끝!</h2><p>오늘의 Daily Study를 계속해 볼까요?</p><div class="quick"><span>AI 코치</span><span>교재 공부</span><span>교재 연습</span></div></div></section>
<div class="section-label"><h2 id="sectionTitle">AI Coach · Concept 1</h2><p id="sectionDesc">Control Console</p></div>
<section class="stage" id="stage"></section>
<div class="note"><b>Concept page only.</b> Nothing in this design lab changes the live Coach, Book Study or Book Practice UI.</div>
</main>
<script>
const robot=`<span class="robot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="4"></rect><path d="M12 3v3M8 12h.01M16 12h.01M9 15h6"></path></svg></span>`;
const robotBig=`<span class="robot big"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="4"></rect><path d="M12 3v3M8 12h.01M16 12h.01M9 15h6"></path></svg></span>`;
const listen=`<span class="listen-svg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13v-2a7 7 0 0 1 14 0v2"></path><path d="M5 13H3v5a2 2 0 0 0 2 2h2v-7zM19 13h2v5a2 2 0 0 1-2 2h-2v-7z"></path></svg></span>`;
const units=`<div class="units"><span>Unit 1</span><span>Unit 2</span><span>Unit 3</span><span>Unit 4</span><span class="on">Unit 5</span><span>Unit 6</span><span>Unit 7</span><span>Unit 8</span></div>`;
const bookHead=(mode,dark=false)=>`<div class="book-top"><div class="mode-tabs"><b class="${mode==='study'?'on':''}">Study</b><b class="${mode==='practice'?'on':''}">Practice</b></div><span class="kicker ${dark?'cyan':''}">Come On Everyone 4 · Unit 5</span></div><div class="books"><b>Come On Everyone 4</b><b>Willena Reading Lab 5</b></div>${units}`;
const words=`<div class="content-grid"><div class="word-dark"><strong>travel to Paris</strong><small>파리로 여행하다</small></div><div class="word-dark"><strong>pick peaches</strong><small>복숭아를 따다</small></div><div class="word-dark"><strong>go camping</strong><small>캠핑을 가다</small></div><div class="word-dark"><strong>visit my grandparents</strong><small>조부모님을 방문하다</small></div></div>`;
const concepts={
ai:[
{n:'Control Console',html:`<div class="concept control ai1"><div class="dark-card ai1-main"><div class="ai-head">${robot}<div><span class="kicker cyan">AI COACH</span><h2>Good afternoon, Min.</h2></div></div><div class="objective"><span class="kicker pink">NEXT BEST MOVE</span><h3>Vocabulary needs one quick repair.</h3><p class="muted">Your Unit 5 vocabulary is lagging behind grammar. A 6-question drill should bring it back into range.</p><div class="actions"><button class="dark-button primary">Start 6 questions</button><button class="dark-button">Why this?</button><button class="dark-button">Something else</button></div></div></div><aside class="dark-card telemetry"><span class="kicker cyan">LIVE LEARNING DATA</span><div class="dark-card stat"><div class="stat-head"><span>Vocabulary</span><strong class="pink">54%</strong></div><div class="meter pink"><i style="width:54%"></i></div></div><div class="dark-card stat"><div class="stat-head"><span>Grammar</span><strong>78%</strong></div><div class="meter"><i style="width:78%"></i></div></div><div class="dark-card stat"><div class="stat-head"><span>Sentences</span><strong>71%</strong></div><div class="meter"><i style="width:71%"></i></div></div></aside></div>`},

let cat='ai',n=1;const stage=document.getElementById('stage'),title=document.getElementById('sectionTitle'),desc=document.getElementById('sectionDesc');
function paint(){const item=concepts[cat][n-1];stage.innerHTML=item.html;title.textContent=({ai:'AI Coach',study:'Book Study',practice:'Book Practice'})[cat]+' · Concept '+n;desc.textContent=item.n;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',Number(b.dataset.n)===n));}
document.getElementById('cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;n=1;paint();});document.getElementById('nums').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;n=Number(b.dataset.n);paint();});paint();
</script>
