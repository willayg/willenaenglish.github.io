<div class="study-app">
<student-header title="Study" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
<main class="dashboard" id="app">
  <section id="v2PracticePanel" class="practice-panel" hidden>
    <div class="practice-toolbar">
      <button id="v2PracticeClose" class="ghost-button" type="button">← 뒤로</button>
      <div><span id="v2PracticeSkill" class="eyebrow">연습</span><h2 id="v2PracticeTitle">약한 부분 집중 연습</h2><small id="practicePerf" class="section-note">1 / 10</small></div>
    </div>
    <div id="v2ActivityRoot"></div>
    <button id="v2PracticeNext" type="button" hidden aria-hidden="true"></button>
  </section>

  <section class="book-hero daily-inline">
    <div class="hero-copy">
      <div class="study-v2-top-actions">
        <div id="dailyWorkoutCard" class="unit-progress-card study-v2-action-card study-v2-daily-primary" role="button" tabindex="0" aria-label="Start Daily Study">
          <div class="progress-ring"><span id="smartDailyPct">0/20</span></div>
          <div><strong id="smartProgressTitle">데일리 스터디</strong><small id="smartProgressCopy">오늘 목표 · 0/20</small></div>
          <span class="daily-rail-today" aria-hidden="true">TODAY</span>
        </div>
        <div class="daily-rail-main" aria-live="polite">
          <strong class="daily-rail-headline">오늘은 20문제만 더 하면 끝!</strong>
          <p class="daily-rail-sub">오늘의 Daily Study를 시작해 볼까요?</p>
          <div class="daily-rail-progress" aria-hidden="true">
            <span class="daily-rail-segment"><i></i></span>
            <span class="daily-rail-segment"><i></i></span>
            <span class="daily-rail-segment"><i></i></span>
            <span class="daily-rail-segment"><i></i></span>
            <span class="daily-rail-segment"><i></i></span>
          </div>
        </div>
        <button id="practiceHeroBtn" class="study-v2-action-card study-v2-ai-launch" type="button"><strong>AI 코치</strong><small>추천 학습</small></button>
        <button id="bookStudyBtn" class="study-v2-action-card" type="button"><strong>교재 공부</strong><small>현재 교재 보기</small></button>
        <button id="bookPracticeBtn" class="study-v2-action-card" type="button"><strong>교재 연습</strong><small>교재 · 단원 · 영역 선택</small></button>
      </div>

      <section id="aiRecommendations" class="study-v2-ai-shell">
        <div class="study-v2-ai-head"><div><h2 id="aiHeading">AI 코치</h2></div></div>
        <div id="aiChat" class="study-v2-ai-chat">
          <div id="aiChatTranscript" class="study-v2-ai-chat-transcript" aria-live="polite"></div>
          <div id="aiChatPrompts" class="study-v2-ai-chat-prompts"></div>
          <div id="aiChatCta" class="study-v2-ai-chat-cta-wrap"></div>
        </div>
        <div id="aiGrid" hidden aria-hidden="true"></div>
      </section>

      <section class="study-v2-book-hub" id="bookHub" data-mode="study">
        <div class="study-v2-book-hub-head">
          <div class="study-v2-book-mode-tabs" role="tablist" aria-label="Book mode">
            <button class="study-v2-book-mode-tab is-active" type="button" role="tab" data-book-mode="study" aria-selected="true">공부</button>
            <button class="study-v2-book-mode-tab" type="button" role="tab" data-book-mode="practice" aria-selected="false">연습</button>
          </div>
        </div>

        <nav id="bookTabs" class="study-v2-book-tabs" aria-label="Books" hidden></nav>

        <div class="book-hub-legacy-meta" aria-hidden="true">
          <div id="bookSwipe" class="study-v2-book-title-wrap">
            <h1 id="bookTitle">Loading…</h1>
            <p id="unitTitle">Finding your assigned unit</p>
            <div id="bookPips" class="study-v2-book-pips" hidden></div>
          </div>
        </div>

        <div class="study-v2-units">
          <div class="study-v2-units-head"><span>공부할 단원을 선택하세요</span><span id="currentUnitLabel">현재 · Unit —</span></div>
          <div id="unitStrip" class="study-v2-unit-strip"></div>
        </div>

        <section id="bookStudyArea" class="study-v2-book-mode-pane study-v2-book-study-panel" data-book-mode-pane="study">
          <div class="study-v2-section-heading" aria-hidden="true">
            <div class="study-v2-section-heading-copy"><span class="study-v2-section-kicker">BOOK STUDY</span><h2 id="bookStudyHeading">교재 공부</h2></div>
            <small id="bookStudyNote"></small>
          </div>
          <div class="book-study-unit-picker" aria-hidden="true">
            <div class="book-study-unit-head"><span id="bookStudyUnitPrompt">공부할 단원을 선택하세요</span><span id="bookStudyCurrentUnitLabel">현재 · Unit —</span></div>
            <div id="bookStudyUnitStrip" aria-label="Book Study units"></div>
          </div>
          <div id="bookStudyContent" class="book-study-content">
            <div class="book-study-content-state">교재 내용을 불러오는 중이에요.</div>
          </div>
        </section>

        <section id="bookPracticeArea" class="study-v2-book-mode-pane study-v2-book-panel" data-book-mode-pane="practice" hidden>
          <div class="study-v2-section-heading" aria-hidden="true">
            <div class="study-v2-section-heading-copy"><span class="study-v2-section-kicker">BOOK PRACTICE</span><h2 id="bookPracticeHeading">교재 연습</h2></div>
            <small id="bookPracticeNote"></small>
          </div>
          <div class="header-skill-mastery" id="headerSkillMastery">
            <div class="header-skill-mastery-head"><strong>단원 숙련도</strong><span></span></div>
            <div id="masteryGrid" class="header-skill-mastery-grid"></div>
          </div>
          <div class="hero-actions" hidden aria-hidden="true">
            <button id="continueBtn" class="primary-button" type="button">단원 공부하기</button>
            <button id="changeUnitBtn" class="secondary-button" type="button">단원 보기</button>
          </div>
        </section>
      </section>
    </div>
  </section>
</main>

(function(){
  try{
    var marker='willena-study-v2-cache-schema-v2';
    if(!localStorage.getItem(marker)){
      Object.keys(localStorage).forEach(function(k){
        if(k.indexOf('willena-study-v2-home:v1:')===0)localStorage.removeItem(k);
      });
      localStorage.setItem(marker,'1');
    }
  }catch(_){}
})();
</script>

<script>
(function(){
  var card=document.getElementById('dailyWorkoutCard');
  if(card){
    function launch(e){
      if(e)e.preventDefault();
      var daily=window.WillenaStudyV2Daily;
      if(daily&&typeof daily.open==='function'){daily.open();return;}
      var copy=document.getElementById('smartProgressCopy');
      if(copy)copy.textContent='Daily Study failed to load. Please refresh.';
    }
    card.addEventListener('click',launch);
    card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){launch(e);}});
  }
  function openBookHub(mode){
    var tab=document.querySelector('[data-book-mode="'+mode+'"]');
    if(tab)tab.click();
    var hub=document.getElementById('bookHub');
    if(hub)hub.scrollIntoView({behavior:'smooth',block:'start'});
  }
  var bookPractice=document.getElementById('bookPracticeBtn');
  if(bookPractice)bookPractice.addEventListener('click',function(){openBookHub('practice');});
  var bookStudy=document.getElementById('bookStudyBtn');
  if(bookStudy)bookStudy.addEventListener('click',function(){openBookHub('study');});
  function syncSectionLabels(){
    var lang=document.getElementById('languageBtn');
    var ko=!lang||String(lang.textContent||'').trim()==='English';
    var a=document.getElementById('bookStudyHeading'),c=document.getElementById('bookPracticeHeading'),e=document.getElementById('bookStudyUnitPrompt');
    if(a)a.textContent=ko?'교재 공부':'Book Study';
    if(c)c.textContent=ko?'교재 연습':'Book Practice';
    if(e)e.textContent=ko?'공부할 단원을 선택하세요':'Choose a unit to study';
  }
  syncSectionLabels();
  var languageBtn=document.getElementById('languageBtn');
  if(languageBtn)languageBtn.addEventListener('click',function(){setTimeout(syncSectionLabels,0);});
})();
</script>
