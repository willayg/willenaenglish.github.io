<body>
<div class="study-app">
<student-header title="Study" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
<main class="dashboard" id="app">
  <section id="v2PracticePanel" class="practice-panel" hidden>
    <div class="practice-toolbar">
      <button id="v2PracticeClose" class="ghost-button" type="button">← 뒤로</button>
      <div><span id="v2PracticeSkill" class="eyebrow">연습</span><h2 id="v2PracticeTitle">약한 부분 집중 연습</h2><small id="practicePerf" class="section-note">1 / 10</small></div>
    </div>
    <div id="v2ActivityRoot"></div>
    <button id="v2PracticeNext" type="button" hidden aria-hidden="true"></button>
  </section>

  <section class="book-hero daily-inline">
    <div class="hero-copy">
      <div class="study-v2-top-actions">
        <div id="dailyWorkoutCard" class="unit-progress-card study-v2-action-card study-v2-daily-primary" role="button" tabindex="0" aria-label="Start Daily Study">
          <div class="progress-ring"><span id="smartDailyPct">0/20</span></div>
          <div><strong id="smartProgressTitle">데일리 스터디</strong><small id="smartProgressCopy">오늘 목표 · 0/20</small></div>
        </div>
        <button id="practiceHeroBtn" class="study-v2-action-card study-v2-ai-launch" type="button"><strong>AI 코치</strong><small>추천 학습</small></button>
        <button id="bookPracticeBtn" class="study-v2-action-card" type="button"><strong>교재 연습</strong><small>교재 · 단원 · 영역 선택</small></button>
        <button id="bookStudyBtn" class="study-v2-action-card is-coming-soon" type="button" disabled><strong>교재 공부</strong><small>준비 중</small></button>
      </div>

      <section id="aiRecommendations" class="study-coach study-v2-ai">
        <div class="study-coach-head"><div><h2 id="aiHeading">AI 코치</h2></div></div>
        <div id="aiChat" class="study-v2-ai-chat">
          <div id="aiChatTranscript" class="study-v2-ai-chat-transcript" aria-live="polite"></div>
          <div id="aiChatPrompts" class="study-v2-ai-chat-prompts"></div>
          <div id="aiChatCta" class="study-v2-ai-chat-cta-wrap"></div>
        </div>
        <div id="aiGrid" class="study-coach-grid" hidden aria-hidden="true"></div>
      </section>

      <div class="study-v2-book-panel" id="bookPracticeArea">
        <nav id="bookTabs" class="study-v2-book-tabs" aria-label="Books" hidden></nav>

        <div id="bookSwipe" class="study-v2-book-title-wrap">
          <h1 id="bookTitle">Loading…</h1>
          <p id="unitTitle">Finding your assigned unit</p>
          <div id="bookPips" class="study-v2-book-pips" hidden></div>
        </div>

        <div class="study-v2-units">
          <div class="study-v2-units-head"><span>공부할 단원을 선택하세요</span><span id="currentUnitLabel">현재 · Unit —</span></div>
          <div id="unitStrip" class="study-v2-unit-strip"></div>
        </div>

        <div class="header-skill-mastery" id="headerSkillMastery">
          <div class="header-skill-mastery-head"><strong>단원 숙련도</strong><span>영역을 눌러 연습하세요</span></div>
          <div id="masteryGrid" class="header-skill-mastery-grid"></div>
        </div>

        <div class="hero-actions" hidden aria-hidden="true" style="display:none!important">
          <button id="continueBtn" class="primary-button" type="button">단원 공부하기</button>
          <button id="changeUnitBtn" class="secondary-button" type="button">단원 보기</button>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="study-v2-footer"><button id="languageBtn" type="button">English</button></footer>
</div>

<script>
(function(){
  try{
    var marker='willena-study-v2-cache-schema-v2';
    if(!localStorage.getItem(marker)){
      Object.keys(localStorage).forEach(function(k){
        if(k.indexOf('willena-study-v2-home:v1:')===0)localStorage.removeItem(k);
      });
      localStorage.setItem(marker,'1');
    }
  }catch(_){}
})();
</script>

<script src="./v2-daily-test-placement.js?v=20260815-bottom1"></script>
<script src="./v2-daily-rewards.js?v=20260815-endingring1"></script>
<script>
(function(){
  var card=document.getElementById('dailyWorkoutCard');
  if(card){
    function launch(e){
      if(e)e.preventDefault();
      var daily=window.WillenaStudyV2Daily;
      if(daily&&typeof daily.open==='function'){
        daily.open();
        return;
      }
      var copy=document.getElementById('smartProgressCopy');
      if(copy)copy.textContent='Daily Study failed to load. Please refresh.';
    }
    card.addEventListener('click',launch);
    card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){launch(e);}});
  }
  var bookPractice=document.getElementById('bookPracticeBtn');
  if(bookPractice)bookPractice.addEventListener('click',function(){
    var area=document.getElementById('bookPracticeArea');
    if(area)area.scrollIntoView({behavior:'smooth',block:'start'});
  });
})();
</script>
