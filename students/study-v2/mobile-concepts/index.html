<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Study V2 · Mobile Concepts</title>
<style>
:root{--pink:#ff6fb0;--cyan:#21b3be;--orange:#d9923b;--blue:#5b7fe5;--ink:#244d53;--muted:#73878c;--bg:#eef5f6;--line:#dce8ea;--white:#fff;--sp:#fff3f8;--sc:#eefafb;--so:#fff8ee;--sb:#f3f5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe9eb;color:var(--ink)}button{font:inherit}.shell{min-height:100vh;padding:12px}.top{max-width:520px;margin:0 auto 10px;padding:12px;border:2px solid var(--cyan);border-radius:20px;background:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.top strong{font-size:16px}.top small{font-size:10px;color:var(--muted);font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;margin-top:10px;padding-bottom:2px}.tab{flex:0 0 auto;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:7px 11px;font-size:11px;font-weight:900}.tab.active{border-color:var(--pink);background:var(--sp);color:var(--pink)}
.phone{position:relative;max-width:430px;min-height:780px;margin:0 auto;border:2px solid #c7d6d9;border-radius:30px;background:var(--bg);overflow:hidden;box-shadow:0 18px 50px rgba(35,73,79,.14)}.bar{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);font-weight:900}.points{display:flex;gap:6px}.pill{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.pill.c{background:var(--sc);color:var(--cyan)}.pill.p{background:var(--sp);color:var(--pink)}.avatar{width:32px;height:32px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;background:#fff}.screen{padding:12px 12px 28px}.concept{display:none}.concept.active{display:block}.label{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}.label h1{margin:0;font-size:17px}.label span{font-size:29px;font-weight:950;color:#bfd0d3}.card{background:#fff;border:3px solid var(--line);border-radius:24px}.pink{border-color:var(--pink)}.cyan{border-color:var(--cyan)}.orange{border-color:var(--orange)}.blue{border-color:var(--blue)}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:950;color:var(--pink)}.hero-title{font-size:27px;line-height:1.05;font-weight:950;letter-spacing:-.04em}.hero-sub{font-size:12px;line-height:1.45;color:var(--muted);font-weight:800}.ring{position:relative;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--pink) 0 70%,#f3d8e4 70%)}.ring:after{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff}.ring span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:var(--pink);font-size:18px;font-weight:950}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.seg{height:9px;border-radius:99px;background:#e7edef}.seg.done{background:var(--pink)}.streak{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:var(--sp);color:#d44e8d;font-size:11px;font-weight:950}.actions{display:grid;gap:8px}.action{min-height:64px;padding:10px 12px;border:3px solid;border-radius:19px;background:#fff;display:flex;align-items:center;gap:10px;font-weight:900}.action .ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px}.action.c{border-color:var(--cyan)}.action.c .ico{background:var(--sc);color:var(--cyan)}.action.o{border-color:var(--orange)}.action.o .ico{background:var(--so);color:var(--orange)}.action.b{border-color:var(--blue)}.action.b .ico{background:var(--sb);color:var(--blue)}.action.p{border-color:var(--pink)}.action.p .ico{background:var(--sp);color:var(--pink)}.book{margin-top:10px;padding:14px}.book-tabs{display:flex;gap:8px;overflow:hidden;font-size:10px;font-weight:900}.book-tabs span:first-child{color:var(--pink);border-bottom:3px solid var(--cyan)}.book-name{margin:22px 0 5px;text-align:center;font-size:clamp(27px,8.3vw,38px);line-height:1.02;font-weight:950;letter-spacing:-.045em}.unit{text-align:center;color:var(--cyan);font-size:13px;font-weight:900}.pips{display:flex;justify-content:center;gap:5px;margin-top:13px}.pips i{width:9px;height:9px;border-radius:50%;background:#d9ecee}.pips i.on{width:26px;border-radius:99px;background:var(--pink)}.ai{margin-top:10px;padding:14px}.ai h3{margin:0;color:var(--cyan);font-size:20px}.bubble{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:16px;font-size:12px;font-weight:800;line-height:1.45}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{padding:6px 8px;border:2px solid var(--cyan);border-radius:999px;background:#fff;font-size:9px;font-weight:900}
/* 01 rail stack */.c1hero{display:grid;grid-template-columns:115px 1fr;overflow:hidden}.c1rail{padding:16px 12px;background:linear-gradient(180deg,var(--sp),#fff);border-right:1px solid #f4cfdf;text-align:left}.c1rail .ring{width:82px;height:82px;margin:16px auto 0}.c1rail .ring:after{inset:10px}.c1rail .ring span{font-size:13px}.c1body{padding:18px 14px}.c1body .hero-title{font-size:21px}.c1body .streak{margin-top:8px}.c1body .strip{margin-top:15px}.c1actions{grid-template-columns:1fr 1fr;margin-top:9px}.c1actions .b{grid-column:1/-1}
/* 02 impact */.c2hero{padding:20px;text-align:center}.c2hero .ring{margin:16px auto 0}.c2hero .streak{margin-top:13px}.c2hero .strip{margin-top:18px}.c2actions{grid-template-columns:1fr 1fr;margin-top:9px}.c2actions .c{grid-column:1/-1}
/* 03 split */.c3hero{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.c3hero .hero-title{font-size:22px}.c3hero .ring{width:94px;height:94px}.c3hero .ring:after{inset:11px}.c3hero .ring span{font-size:15px}.c3hero .streak{margin-top:10px}.c3hero .strip{grid-column:1/-1;margin-top:3px}.c3actions{grid-template-columns:repeat(3,1fr);margin-top:9px}.c3actions .action{min-height:82px;display:grid;place-items:center;text-align:center;padding:9px}.c3actions .ico{margin:auto}
/* 04 mission */.c4hero{padding:18px}.missionrow{display:flex;align-items:center;gap:14px}.c4hero .ring{width:100px;height:100px;flex:0 0 100px}.c4hero .ring:after{inset:12px}.c4hero .hero-title{font-size:22px}.c4hero .streak{margin-top:8px}.c4hero .strip{margin-top:15px}.c4actions{grid-template-columns:1fr 1fr;margin-top:9px}.c4actions .o{grid-column:1/-1}
/* 05 dashboard */.c5hero{padding:17px}.c5top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.c5hero .hero-title{font-size:24px}.c5hero .ring{width:86px;height:86px;flex:0 0 86px}.c5hero .ring:after{inset:10px}.c5hero .strip{margin-top:14px}.c5actions{grid-template-columns:1fr 1fr 1fr;margin-top:9px}.c5actions .action{display:grid;place-items:center;text-align:center;min-height:88px;padding:8px}.c5actions .ico{margin:auto}
/* 06 big ring */.c6hero{padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center}.c6hero .ring{width:150px;height:150px;margin-top:14px}.c6hero .ring:after{inset:18px}.c6hero .ring span{font-size:21px}.c6hero .hero-title{font-size:25px;margin-top:13px}.c6hero .streak{margin-top:8px}.c6hero .strip{width:100%;margin-top:16px}.c6actions{grid-template-columns:1fr 1fr;margin-top:9px}.c6actions .b{grid-column:1/-1}
/* 07 sticky rail */.c7hero{padding:0;overflow:hidden}.c7top{display:grid;grid-template-columns:128px 1fr}.c7left{padding:18px 12px;background:var(--sp)}.c7left .hero-title{font-size:20px}.c7left .ring{width:88px;height:88px;margin:15px auto 0}.c7left .ring:after{inset:10px}.c7right{padding:18px 14px}.c7right .hero-title{font-size:20px}.c7right .streak{margin-top:10px}.c7right .strip{margin-top:14px}.c7actions{padding:10px;grid-template-columns:1fr 1fr}.c7actions .b{grid-column:1/-1}
/* 08 streak header */.c8hero{padding:18px}.c8head{display:flex;justify-content:space-between;gap:12px;align-items:center}.c8hero .hero-title{font-size:24px}.c8hero .ring{width:104px;height:104px;margin:18px auto 0}.c8hero .strip{margin-top:15px}.c8actions{grid-template-columns:1fr 1fr;margin-top:9px}.c8actions .c{grid-column:1/-1}
/* 09 stacked rhythm */.c9hero{padding:18px}.c9row{display:flex;align-items:center;justify-content:space-between;gap:12px}.c9hero .hero-title{font-size:23px}.c9hero .ring{width:96px;height:96px;flex:0 0 96px}.c9hero .ring:after{inset:11px}.c9hero .streak{margin-top:10px}.c9hero .strip{margin-top:16px}.c9actions{margin-top:9px}.c9actions .action{min-height:58px}
/* 10 compact arcade */.c10hero{padding:16px}.c10top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.c10hero .ring{width:96px;height:96px}.c10hero .ring:after{inset:11px}.c10hero .hero-title{font-size:22px}.c10hero .streak{margin-top:8px}.c10hero .strip{margin-top:13px}.c10actions{grid-template-columns:repeat(3,1fr);margin-top:9px}.c10actions .action{min-height:76px;display:grid;place-items:center;text-align:center;padding:7px}.c10actions .ico{margin:auto}
@media(max-width:430px){.shell{padding:0}.top{border-radius:0;border-left:0;border-right:0;margin:0;max-width:none}.phone{border-radius:0;border-left:0;border-right:0;max-width:none;min-height:calc(100vh - 95px);box-shadow:none}.screen{padding:10px 10px 24px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="topline"><div><strong>Study V2 · Mobile Concepts</strong><br><small>Wide Daily Rail layout translated to portrait mobile</small></div><small id="count">Concept 1 / 10</small></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="phone">
    <div class="bar"><div class="points"><span class="pill c">● 4775</span><span class="pill p">★ 763</span></div><span>Study</span><span class="avatar">🐯</span></div>
    <div class="screen" id="screen"></div>
  </div>
</div>
<script>
const icon={ai:'🤖',practice:'↗',book:'▣'};
const actions=`<div class="actions ACTIONS"><div class="action c"><span class="ico">${icon.ai}</span><span>AI 코치</span></div><div class="action o"><span class="ico">${icon.practice}</span><span>교재 연습</span></div><div class="action b"><span class="ico">${icon.book}</span><span>교재 공부</span></div></div>`;
const book=`<div class="book card cyan"><div class="book-tabs"><span>Come On Everyone 4</span><span>Willena Reading Lab 5</span></div><div class="book-name">Come On Everyone 4</div><div class="unit">Unit 3 · In Town</div><div class="pips"><i class="on"></i><i></i></div></div>`;
const ai=`<div class="ai card pink"><h3>AI 코치</h3><div class="bubble">무엇을 도와줄까요? 원하는 걸 골라 보세요.</div><div class="chips"><span class="chip">이 단원에서 뭘 공부하면 좋을까요?</span><span class="chip">이 단원을 연습해 볼래요</span></div></div>`;
function strip(){return `<div class="strip"><i class="seg done"></i><i class="seg done"></i><i class="seg done"></i><i class="seg"></i><i class="seg"></i></div>`}
function ring(){return `<div class="ring"><span>14/20</span></div>`}
const concepts=[
['Rail Stack',`<div class="c1hero card pink"><div class="c1rail"><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div>${ring()}</div><div class="c1body"><div class="hero-title">오늘은 6문제만 더 하면 끝!</div><div class="hero-sub">현재 듣기 파트를 진행 중이에요.</div><span class="streak">🔥 4일 연속 학습</span>${strip()}</div></div>${actions.replace('ACTIONS','c1actions')}${book}${ai}`],
['Big Daily',`<div class="c2hero card pink"><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div>${ring()}<div class="hero-title" style="margin-top:15px">6문제만 더 하면 끝!</div><div class="hero-sub">현재 듣기 파트를 진행 중이에요.</div><span class="streak">🔥 4일 연속 학습</span>${strip()}</div>${actions.replace('ACTIONS','c2actions')}${book}${ai}`],
['Split Focus',`<div class="c3hero card pink"><div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div><div class="hero-sub" style="margin-top:7px">6문제만 더 하면 끝!</div><span class="streak">🔥 4일 연속</span></div>${ring()}${strip()}</div>${actions.replace('ACTIONS','c3actions')}${book}${ai}`],
['Mission Card',`<div class="c4hero card pink"><div class="missionrow">${ring()}<div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div><div class="hero-sub">오늘은 6문제만 더 하면 끝!</div><span class="streak">🔥 4일 연속 학습</span></div></div>${strip()}</div>${actions.replace('ACTIONS','c4actions')}${book}${ai}`],
['Dashboard Hero',`<div class="c5hero card pink"><div class="c5top"><div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div><div class="hero-sub">현재 듣기 파트 · 6문제 남음</div><span class="streak">🔥 4일 연속</span></div>${ring()}</div>${strip()}</div>${actions.replace('ACTIONS','c5actions')}${book}${ai}`],
['Ring First',`<div class="c6hero card pink"><div class="eyebrow">TODAY</div>${ring()}<div class="hero-title">오늘의 학습</div><div class="hero-sub">6문제만 더 하면 오늘 학습 완료!</div><span class="streak">🔥 4일 연속 학습</span>${strip()}</div>${actions.replace('ACTIONS','c6actions')}${book}${ai}`],
['True Mobile Rail',`<div class="c7hero card pink"><div class="c7top"><div class="c7left"><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div>${ring()}</div><div class="c7right"><div class="hero-title">6문제만 더 하면 끝!</div><div class="hero-sub">현재 듣기 파트를 진행 중이에요.</div><span class="streak">🔥 4일 연속 학습</span>${strip()}</div></div>${actions.replace('ACTIONS','c7actions')}</div>${book}${ai}`],
['Streak Header',`<div class="c8hero card pink"><div class="c8head"><div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div></div><span class="streak">🔥 4일 연속</span></div>${ring()}<div class="hero-sub" style="text-align:center;margin-top:12px">오늘은 6문제만 더 하면 끝!</div>${strip()}</div>${actions.replace('ACTIONS','c8actions')}${book}${ai}`],
['Stacked Rhythm',`<div class="c9hero card pink"><div class="c9row"><div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div><span class="streak">🔥 4일 연속</span></div>${ring()}</div><div class="hero-title" style="font-size:19px;margin-top:13px">6문제만 더 하면 끝!</div><div class="hero-sub">현재 듣기 파트를 진행 중이에요.</div>${strip()}</div>${actions.replace('ACTIONS','c9actions')}${book}${ai}`],
['Compact Arcade',`<div class="c10hero card pink"><div class="c10top">${ring()}<div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div><div class="hero-sub">6문제 남음</div><span class="streak">🔥 4일 연속</span></div></div>${strip()}</div>${actions.replace('ACTIONS','c10actions')}${book}${ai}`]
];
const tabs=document.getElementById('tabs'),screen=document.getElementById('screen'),count=document.getElementById('count');
concepts.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>show(i);tabs.appendChild(b)});
function show(i){[...tabs.children].forEach((b,n)=>b.classList.toggle('active',n===i));count.textContent=`Concept ${i+1} / 10`;screen.innerHTML=`<section class="concept active"><div class="label"><h1>${concepts[i][0]}</h1><span>${String(i+1).padStart(2,'0')}</span></div>${concepts[i][1]}</section>`;history.replaceState(null,'','#'+(i+1))}
let start=Math.max(0,Math.min(9,(parseInt(location.hash.slice(1),10)||1)-1));show(start);
</script>
</body>
</html>
