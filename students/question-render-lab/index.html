async function get(path,extra={}){const r=await fetch(CONTENT+path,{headers:{...HEAD,...extra},cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}
async function paged(path){const out=[];for(let start=0;start<5000;start+=1000){const batch=await get(path,{Range:`${start}-${start+999}`});out.push(...batch);if(batch.length<1000)break}return out}
function currentSkill(){return skills.find(x=>x.value===state.skill)}
function setStatus(s,error=false){$('#status').textContent=s||'';$('#status').classList.toggle('error',!!error)}
function option(value,label=value){return `<option value="${esc(value)}">${esc(label)}</option>`}
function installSkills(){$('#skill').innerHTML=skills.map(x=>option(x.value,x.label)).join('');$('#skill').value=state.skill}

async function loadTypes(){const skill=currentSkill();setStatus('Loading types…');$('#type').disabled=true;if(skill.mode==='fixture'){const types=Object.keys(fixtures[skill.value]||{});$('#type').innerHTML=types.map(x=>option(x)).join('');state.type=types[0]||'';$('#type').value=state.type;$('#type').disabled=false;setStatus(`${types.length} layouts`);return}
 if(state.typeCache.has(skill.value)){fillTypeSelect(state.typeCache.get(skill.value));return}
 const path=`/rest/v1/test_prep_questions?select=question_type,answer_mode,replacement_needed&student_usable=eq.true&section=eq.${encodeURIComponent(skill.value)}&order=question_type.asc`;
 const rows=await paged(path),map=new Map();for(const r of rows){if(r.replacement_needed===true)continue;const t=String(r.question_type||'(no type)');if(!map.has(t))map.set(t,{count:0,modes:new Set()});const v=map.get(t);v.count++;if(r.answer_mode)v.modes.add(String(r.answer_mode))}
 const types=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([value,v])=>({value,label:`${value} · ${v.count}`}));state.typeCache.set(skill.value,types);fillTypeSelect(types)}
function fillTypeSelect(types){$('#type').innerHTML=types.map(x=>option(x.value,x.label)).join('');state.type=types[0]?.value||'';$('#type').value=state.type;$('#type').disabled=false;setStatus(`${types.length} types`)}

async function loadQuestions(){const skill=currentSkill();state.type=$('#type').value;setStatus('Loading questions…');state.rows=[];state.index=0;if(skill.mode==='fixture'){state.rows=[...(fixtures[skill.value]?.[state.type]||[])];afterLoad();return}
 const fields='id,source_id,source_question_number,source_page,section,question_type,prompt_text,context,choices,correct_answer,targets,answer_mode,context_type,difficulty,student_source_label,content_status,metadata,replacement_needed';
 const path=`/rest/v1/test_prep_questions?select=${encodeURIComponent(fields)}&student_usable=eq.true&section=eq.${encodeURIComponent(skill.value)}&question_type=eq.${encodeURIComponent(state.type)}&order=source_question_number.asc`;
 const rows=await paged(path);state.rows=rows.filter(x=>x.replacement_needed!==true);afterLoad()}
function afterLoad(){setStatus(`${state.rows.length} question${state.rows.length===1?'':'s'}`);renderCurrent();updateNav()}
function updateNav(){$('#prev').disabled=state.index<=0;$('#next').disabled=!state.rows.length||state.index>=state.rows.length-1}
function answers(q){const a=Array.isArray(q?.correct_answer)?q.correct_answer:[q?.correct_answer];return a.filter(x=>x!=null&&String(x).trim()!=='').map(String)}
function choiceText(c){if(typeof c==='string'||typeof c==='number')return String(c);if(c&&typeof c==='object')return String(c.text??c.label??c.value??JSON.stringify(c));return String(c??'')}
function parseCorrection(v){const m=String(v||'').trim().match(/^(.+?)\s*→\s*(.+)$/);return m?{wrong:m[1].trim(),right:m[2].trim()}:null}
function layoutFor(q){if(q.__layout)return q.__layout;const a=answers(q),mode=String(q.answer_mode||'').toLowerCase();if(mode==='text'){const corr=a.map(parseCorrection);if(a.length&&corr.every(Boolean))return'correction';if(a.length>1)return'multipart';const s=String(q.section||'').toLowerCase(),one=a[0]||'';if((s==='vocabulary'||s==='vocab_test')&&one&&one.length<=45&&!/[.!?]\s*$/.test(one))return'spelling';return'textarea'}if(Array.isArray(q.choices)&&q.choices.length)return'choice';return'unsupported'}
function sourceLabel(q){return q.student_source_label||q.content_status||(q.id?.startsWith('demo-')?'demo':'DB')}
function spanList(c){const out=[];if(c?.underlined)out.push(c.underlined);if(Array.isArray(c?.underlined_spans))out.push(...c.underlined_spans);return [...new Set(out.map(String).filter(Boolean))]}
function marked(v,spans=[]){const s=String(v??'');if(!spans.length)return esc(s);let ranges=[];for(const x of spans){let at=0;while(x&&at<s.length){const i=s.indexOf(x,at);if(i<0)break;ranges.push([i,i+x.length]);at=i+x.length}}if(!ranges.length)return esc(s);ranges.sort((a,b)=>a[0]-b[0]);const merged=[];for(const r of ranges){const last=merged.at(-1);if(!last||r[0]>=last[1])merged.push([...r]);else last[1]=Math.max(last[1],r[1])}let out='',p=0;for(const [a,b] of merged){out+=esc(s.slice(p,a))+`<span class="u">${esc(s.slice(a,b))}</span>`;p=b}return out+esc(s.slice(p))}
function printable(v,spans=[]){if(v==null||v==='')return'';if(Array.isArray(v))return `<div class="list">${v.map(x=>`<div class="list-item">${printable(x,spans)}</div>`).join('')}</div>`;if(typeof v==='object')return `<div class="list">${Object.entries(v).map(([k,x])=>`<div class="list-item"><b>${esc(k)}</b> ${printable(x,spans)}</div>`).join('')}</div>`;return `<div class="block-value">${marked(v,spans).replace(/\n/g,'<br>')}</div>`}
function contextHtml(q){const c=q.context&&typeof q.context==='object'&&!Array.isArray(q.context)?q.context:{},sp=spanList(c),skip=new Set(['underlined','underlined_spans','masked','part_of_speech','chunks']);const priority=['korean','definition','initial','sentence','sentences','dialogue','passage','source_passage','rewritten','question','conditions','provided_words','word_bank','bank','options','items','pairs','clues','statements','claims','table','pattern','target','source','source_sentence','source_phrase','phrase','example','incorrect','original','comparison','given_sentence','segments','word_count'];const keys=[...priority.filter(k=>Object.prototype.hasOwnProperty.call(c,k)),...Object.keys(c).filter(k=>!priority.includes(k)&&!skip.has(k))];const seen=new Set(),out=[];for(const k of keys){const v=c[k],fp=JSON.stringify(v);if(v==null||v===''||seen.has(fp))continue;seen.add(fp);out.push(`<div class="block"><div class="block-label">${esc(labels[k]||k.replace(/_/g,' '))}</div>${printable(v,sp)}</div>`)}return out.join('')}
function baseHtml(q,body){return `<div class="prompt">${esc(q.prompt_text||q.question_type||'Question')}</div>${contextHtml(q)?`<div class="context">${contextHtml(q)}</div>`:''}${body}<div class="feedback" id="feedback"></div><div class="model" id="model"></div>`}
function showFeedback(ok,msg,model=''){const f=$('#feedback');if(f){f.className=`feedback show ${ok?'ok':'bad'}`;f.textContent=msg}const m=$('#model');if(m&&model){m.innerHTML=`<b>Answer</b><br>${esc(model).replace(/\n/g,'<br>')}`;m.classList.add('show')}}
function renderChoice(q){const multi=String(q.answer_mode||'').toLowerCase()==='multi_select',correct=answers(q).map(String),selected=new Set();$('#card').innerHTML=baseHtml(q,`<div class="choices">${(q.choices||[]).map((c,i)=>`<button class="choice" data-i="${i+1}"><b>${['①','②','③','④','⑤','⑥'][i]||i+1}</b> ${esc(choiceText(c))}</button>`).join('')}</div><div class="actions"><button class="btn primary" id="check" disabled>Check</button></div>`);const btn=$('#check');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(btn.dataset.checked==='1')return;const n=b.dataset.i;if(multi){selected.has(n)?selected.delete(n):selected.add(n);b.classList.toggle('selected')}else{selected.clear();selected.add(n);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))}btn.disabled=!selected.size});btn.onclick=()=>{if(btn.dataset.checked==='1')return;btn.dataset.checked='1';const mine=[...selected].sort(),target=[...correct].sort(),ok=mine.length===target.length&&mine.every((x,i)=>x===target[i]);document.querySelectorAll('.choice').forEach(b=>{const n=b.dataset.i;b.classList.remove('selected');if(correct.includes(n))b.classList.add('correct');else if(selected.has(n))b.classList.add('wrong')});showFeedback(ok,ok?'Correct':`Correct answer: ${correct.join(', ')}`)}}
function renderTextarea(q,short=false){const a=answers(q);$('#card').innerHTML=baseHtml(q,`${short?'<input class="answer" id="answer" autocomplete="off" spellcheck="false">':'<textarea class="answer textarea" id="answer" autocomplete="off" spellcheck="false"></textarea>'}<div class="actions"><button class="btn primary" id="check">Check</button></div>`);const input=$('#answer');input.focus();$('#check').onclick=()=>{const mine=input.value.trim(),ok=a.some(x=>norm(x)===norm(mine));showFeedback(ok,ok?'Correct':'Check the answer.',a.join(' / '))}}
function renderMultipart(q){const a=answers(q),marks=['ⓐ','ⓑ','ⓒ','ⓓ','ⓔ'];$('#card').innerHTML=baseHtml(q,`<div class="structured">${a.map((_,i)=>`<div class="part-row"><div class="mark">${marks[i]||i+1}</div><input class="answer part" data-i="${i}" autocomplete="off" spellcheck="false"></div>`).join('')}</div><div class="actions"><button class="btn primary" id="check">Check</button></div>`);$('.part')?.focus();$('#check').onclick=()=>{const mine=[...document.querySelectorAll('.part')].map(x=>x.value.trim()),ok=mine.length===a.length&&mine.every((x,i)=>norm(x)===norm(a[i]));showFeedback(ok,ok?'Correct':'Check each part.',a.join('\n'))}}
function renderCorrection(q){const a=answers(q),p=a.map(parseCorrection),marks=['ⓐ','ⓑ','ⓒ','ⓓ'];$('#card').innerHTML=baseHtml(q,`<div class="structured">${p.map((_,i)=>`<div class="correction-row"><div class="mark">${marks[i]||i+1}</div><input class="answer wrongpart" data-i="${i}" placeholder="wrong part"><div class="arrow">→</div><input class="answer rightpart" data-i="${i}" placeholder="correction"></div>`).join('')}</div><div class="actions"><button class="btn primary" id="check">Check</button></div>`);$('.wrongpart')?.focus();$('#check').onclick=()=>{const w=[...document.querySelectorAll('.wrongpart')],r=[...document.querySelectorAll('.rightpart')],ok=p.every((x,i)=>norm(w[i].value)===norm(x.wrong)&&norm(r[i].value)===norm(x.right));showFeedback(ok,ok?'Correct':'Check the correction.',a.join('\n'))}}
function renderFlash(q){const a=answers(q)[0]||'';$('#card').innerHTML=baseHtml(q,`<div class="subtle">${esc(q.context?.part_of_speech||'')}</div><div class="flash-answer" id="flashAnswer">${esc(a)}</div><div class="actions"><button class="btn primary" id="reveal">Reveal</button></div>`);$('#reveal').onclick=()=>{$('#flashAnswer').classList.add('show');$('#reveal').disabled=true}}
function orderTarget(q){return answers(q)[0]||''}
function renderOrder(q){const chips=(q.chips||orderTarget(q).split(/\s+/)).map((text,i)=>({text,i})),pool=[...chips],chosen=[];$('#card').innerHTML=baseHtml(q,`<div class="build" id="build"></div><div class="chips" id="pool">${pool.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="check">Check</button></div>`);const draw=()=>{const b=$('#build');b.innerHTML=chosen.map((x,j)=>`<button class="chip" data-built="${j}">${esc(x.text)}</button>`).join('');document.querySelectorAll('#pool .chip').forEach(x=>x.classList.toggle('used',chosen.some(c=>c.i===Number(x.dataset.i))));document.querySelectorAll('[data-built]').forEach(x=>x.onclick=()=>{chosen.splice(Number(x.dataset.built),1);draw()})};document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(chosen.some(c=>c.i===i))return;chosen.push(pool.find(c=>c.i===i));draw()});$('#reset').onclick=()=>{chosen.length=0;draw()};$('#check').onclick=()=>{const mine=chosen.map(x=>x.text).join(' ').replace(/\s+([,.!?])/g,'$1'),target=orderTarget(q),ok=norm(mine)===norm(target);showFeedback(ok,ok?'Correct':'Check the order.',target)};draw()}
function renderBlankChips(q){const target=answers(q),chips=(q.chips||target).map((text,i)=>({text,i})),chosen=[];const masked=q.context?.masked||'';$('#card').innerHTML=baseHtml(q,`<div class="masked">${esc(masked)}</div><div class="build" id="build"></div><div class="chips" id="pool">${chips.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="check">Check</button></div>`);const draw=()=>{$('#build').textContent=chosen.map(x=>x.text).join(' · ');document.querySelectorAll('#pool .chip').forEach(x=>x.classList.toggle('used',chosen.some(c=>c.i===Number(x.dataset.i))))};document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(chosen.some(c=>c.i===i))return;chosen.push(chips.find(c=>c.i===i));draw()});$('#reset').onclick=()=>{chosen.length=0;draw()};$('#check').onclick=()=>{const mine=chosen.map(x=>x.text),ok=mine.length===target.length&&mine.every((x,i)=>norm(x)===norm(target[i]));showFeedback(ok,ok?'Correct':'Check the missing-word order.',target.join(' · '))}}
function renderLearn(q){const target=answers(q)[0]||'',chunks=q.context?.chunks||[];$('#card').innerHTML=baseHtml(q,`<div class="learn-target">${esc(target)}</div>${chunks.length?`<div class="chips">${chunks.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}<div class="actions"><button class="btn primary" id="done">Next</button></div>`);$('#done').onclick=()=>{if(state.index<state.rows.length-1){state.index++;renderCurrent();updateNav()}else showFeedback(true,'Learning screen rendered successfully.')}}
function renderUnsupported(q){$('#card').innerHTML=`<div class="empty"><b>Unsupported shape</b><br>${esc(q.question_type||'unknown')} · ${esc(q.answer_mode||'no answer_mode')}<br><br>Open JSON to inspect the row.</div>`}
function renderCurrent(){const q=state.rows[state.index];if(!q){$('#card').innerHTML='<div class="empty">No questions found for this selection.</div>';$('#rendererPill').textContent='renderer: —';$('#sourcePill').textContent='source: —';$('#idPill').textContent='id: —';$('#json').textContent='';return}const layout=layoutFor(q);$('#rendererPill').textContent=`renderer: ${layout}`;$('#sourcePill').textContent=`source: ${sourceLabel(q)}`;$('#idPill').textContent=`${state.index+1}/${state.rows.length} · ${q.id||'no id'}`;$('#json').textContent=JSON.stringify(q,null,2);if(layout==='choice')return renderChoice(q);if(layout==='textarea')return renderTextarea(q,false);if(layout==='text'||layout==='spelling')return renderTextarea(q,true);if(layout==='multipart')return renderMultipart(q);if(layout==='correction')return renderCorrection(q);if(layout==='flashcard')return renderFlash(q);if(layout==='word_order'||layout==='chunk_order')return renderOrder(q);if(layout==='blank_chips')return renderBlankChips(q);if(layout==='learn')return renderLearn(q);renderUnsupported(q)}

$('#skill').addEventListener('change',async()=>{state.skill=$('#skill').value;state.rows=[];state.index=0;try{await loadTypes();await loadQuestions()}catch(e){console.error(e);setStatus(e.message||'Load failed',true);$('#card').innerHTML=`<div class="empty error">${esc(e.message||'Load failed')}</div>`}});
$('#type').addEventListener('change',()=>loadQuestions().catch(e=>{console.error(e);setStatus(e.message||'Load failed',true)}));
$('#reload').onclick=()=>loadQuestions().catch(e=>{console.error(e);setStatus(e.message||'Load failed',true)});
$('#prev').onclick=()=>{if(state.index>0){state.index--;renderCurrent();updateNav()}};
$('#next').onclick=()=>{if(state.index<state.rows.length-1){state.index++;renderCurrent();updateNav()}};
$('#jsonBtn').onclick=()=>$('#json').classList.toggle('show');
installSkills();loadTypes().then(loadQuestions).catch(e=>{console.error(e);setStatus(e.message||'Load failed',true);$('#card').innerHTML=`<div class="empty error">${esc(e.message||'Load failed')}</div>`});
})();
</script>
