<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Question Renderer Lab</title>
<link rel="stylesheet" href="./lab.css?v=rev7">
<script type="importmap">{"imports":{"../test-prep-v2/question-renderer.js":"../test-prep-v2/question-renderer.js?v=2.15d"}}</script>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <div class="field"><label>Skill</label><select id="skill"></select></div>
    <div class="field"><label>Textbook</label><select id="book"></select></div>
    <div class="field"><label>Question form</label><select id="form"></select></div>
    <div class="field"><label>Feature</label><select id="feature"><option value="all">All questions</option><option value="underline">Underlined</option><option value="blank">Fill in the blank</option></select></div>
    <div class="field"><label>Date added</label><select id="dateAdded"><option value="all">All dates</option><option value="today">Today</option><option value="24h">Last 24 hours</option><option value="3d">Last 3 days</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option></select></div>
  </div>
  <div class="meta">
    <span class="rev-badge">REV 10</span>
    <span class="rev-badge">SHARED RENDERER</span>
    <span id="sourceBadge" class="source-badge" hidden></span>
    <span id="bookTitle" class="book-title"></span>
    <span id="count">0 questions</span>
  </div>
  <main class="card" id="card"><div class="empty">Loading…</div></main>
</div>
<div class="nav">
  <span class="status" id="position">Question —</span>
  <button id="prev">← Previous</button>
  <button class="check" id="check">Check Answer</button>
  <button class="next" id="next">Next Question →</button>
</div>
<script type="module" src="./lab.js?v=rev10"></script>
</body>
</html>
