<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Question Renderer Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:920px;margin:auto;padding:16px 16px 86px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:#6d797e;text-transform:uppercase}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid #cfd7da;border-radius:9px;background:#fff;padding:10px}.meta{margin:8px 0 10px;color:#68757b;font-size:12px}.book-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border:1px solid #cfd7da;border-radius:7px;background:#fff;color:#172126;font-weight:900}.card{background:#fff;border:1px solid #d8dee1;border-radius:14px;padding:20px;min-height:280px}.prompt{font-size:20px;line-height:1.45;font-weight:800;margin-bottom:16px}.context{display:grid;gap:8px;margin-bottom:16px}.block{border:1px solid #e0e5e7;border-radius:10px;background:#fafbfb;padding:10px 12px}.label{font-size:10px;font-weight:800;color:#7d888d;text-transform:uppercase;margin-bottom:5px}.value{font-size:16px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.list{display:grid;gap:6px}.item{padding:7px 9px;border:1px solid #e5eaec;border-radius:8px;background:#fff}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;border:1.5px solid #cbd4d7;background:#fff;border-radius:10px;padding:11px 12px;font-weight:650;cursor:pointer}.choice.selected{border-color:#172126;background:#f1f4f5}.choice.right{border-color:#4a8b62;background:#eef8f1}.choice.wrong{border-color:#b75a5a;background:#fff1f1}.answer{min-height:92px;resize:vertical}.structured{display:grid;gap:9px}.part{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center}.correction{display:grid;grid-template-columns:38px 1fr 26px 1fr;gap:7px;align-items:center}.mark,.arrow{text-align:center;font-weight:800}.chips,.build{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cbd4d7;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.chip.used{opacity:.35}.build{min-height:52px;border:1.5px dashed #cbd4d7;border-radius:10px;padding:9px;margin-bottom:10px}.masked{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:12px}.learn{font-size:25px;line-height:1.55;font-weight:800;margin:10px 0}.feedback{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-weight:750}.feedback.show{display:block}.feedback.ok{background:#edf8f1;color:#276340}.feedback.bad{background:#fff0f0;color:#8c3838}.empty{padding:60px 15px;text-align:center;color:#7a868b}.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.nav{position:fixed;left:0;right:0;bottom:0;min-height:66px;background:#fff;border-top:1px solid #d8dee1;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:20}.nav button{border:1px solid #cfd7da;background:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;min-width:130px}.nav .check{background:#eef1f2}.nav .next{background:#172126;color:#fff;border-color:#172126;min-width:190px}.nav button:disabled{opacity:.35;cursor:default}.status{position:absolute;left:14px;color:#6c777c;font-size:12px;font-weight:700}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.card{padding:15px}.prompt{font-size:18px}.status{display:none}.nav button{flex:1;min-width:0;padding:10px 8px}.nav .next{min-width:0}.correction{grid-template-columns:30px minmax(0,1fr) 20px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <div class="field"><label>Skill</label><select id="skill"></select></div>
    <div class="field"><label>Question form</label><select id="form"></select></div>
  </div>
  <div class="meta"><span id="bookBadge" class="book-badge" hidden></span> <span id="countPill">0 questions</span></div>
  <main class="card" id="card"><div class="empty">Loading…</div></main>
</div>
<div class="nav"><span class="status" id="position">Question —</span><button id="prev">← Previous</button><button class="check" id="check">Check Answer</button><button class="next" id="next">Next Question →</button></div>
<script>
(()=>{
'use strict';
const API='https://gxwfsqxyuufqtitspfqg.supabase.co';
const KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const HEAD={apikey:KEY,Authorization:`Bearer ${KEY}`};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”"]/g,'').replace(/[.!?,;:]+$/g,'').replace(/\s+/g,' ').trim();
const formNames={choice:'Multiple choice',multi:'Multi-select',short:'Short answer',write:'Written answer',multipart:'Multi-part answer',correction:'Correction',flash:'Flashcard',order:'Word order',chunks:'Chunk order',blanks:'Fill blanks with words',learn:'Learn / read only',unsupported:'Unsupported shape'};
const skills=[
 ['communication','Communication','db'],['grammar','Grammar','db'],['reading','Reading','db'],['vocabulary','Vocabulary','db'],
 ['constructed','서술형','fixture'],['performance','수행평가','fixture'],['sentences','본문외우기','fixture'],['vocabpractice','Vocabulary practice','fixture']
].map(([id,name,kind])=>({id,name,kind}));
const fixtures={
 constructed:[
  {prompt_text:'우리말과 같도록 영어로 쓰세요.',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.',bank:['want','do','part','help','city']},correct_answer:['I want to do my part to help your city.'],__form:'write'},
  {prompt_text:'ⓐ와 ⓑ에 알맞은 답을 쓰세요.',context:{sentence:'ⓐ I ___ happy.  ⓑ She ___ tired.'},correct_answer:['am','is'],__form:'multipart'},
  {prompt_text:'틀린 부분을 찾아 바르게 고치세요.',context:{sentence:'She go to school every day.'},correct_answer:['go → goes'],__form:'correction'},
  {prompt_text:'단어를 눌러 문장을 만드세요.',context:{korean:'나는 베네치아의 많은 아름다운 사진들을 본 적이 있어.'},correct_answer:['I have seen many beautiful pictures of Venice.'],chips:['pictures','I','Venice.','beautiful','seen','have','many','of'],__form:'order'}
 ],
 performance:[
  {prompt_text:'익히기',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.',chunks:['I want to','do my part','to help your city.']},correct_answer:['I want to do my part to help your city.'],__form:'learn'},
  {prompt_text:'빈칸',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.',masked:'I want to _____ my _____ to help your city.'},correct_answer:['do','part'],chips:['part','do'],__form:'blanks'},
  {prompt_text:'청크 배열',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.'},correct_answer:['I want to do my part to help your city.'],chips:['to help your city.','I want to','do my part'],__form:'chunks'},
  {prompt_text:'실전 배열',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.'},correct_answer:['I want to do my part to help your city.'],chips:['city.','do','I','part','to','want','help','my','to','your'],__form:'order'},
  {prompt_text:'직접쓰기',context:{korean:'나는 너희 도시를 돕기 위해 내 역할을 하고 싶어.'},correct_answer:['I want to do my part to help your city.'],__form:'write'}
 ],
 sentences:[{prompt_text:'다음 우리말 문장을 영어로 완성하세요.',context:{korean:'나는 베네치아의 많은 아름다운 사진들을 본 적이 있어.'},correct_answer:['I have seen many beautiful pictures of Venice.'],chips:['pictures','I','Venice.','beautiful','seen','have','many','of'],__form:'order'}],
 vocabpractice:[
  {prompt_text:'environment',correct_answer:['환경'],__form:'flash'},
  {prompt_text:'환경',choices:['event','environment','entrance','energy'],correct_answer:['2'],answer_mode:'single_select',__form:'choice'},
  {prompt_text:'환경',context:{pattern:'e _ _ _ _ _ _ _ _ _'},correct_answer:['environment'],__form:'short'}
 ]
};
let all=[],visible=[],index=0,state={};
const skill=()=>skills.find(x=>x.id===$('#skill').value);
const answers=q=>(Array.isArray(q.correct_answer)?q.correct_answer:[q.correct_answer]).filter(x=>x!=null&&String(x).trim()!=='').map(String);
const correction=a=>String(a||'').match(/^(.+?)\s*→\s*(.+)$/);
function formOf(q){if(q.__form)return q.__form;const mode=String(q.answer_mode||'').toLowerCase(),a=answers(q),hasChoices=Array.isArray(q.choices)&&q.choices.length;if(hasChoices)return mode==='multi_select'?'multi':'choice';if(mode==='text'){if(a.length&&a.every(x=>correction(x)))return'correction';if(a.length>1)return'multipart';const one=a[0]||'';if(String(q.section||'').toLowerCase()==='vocabulary'&&one.length<=45&&!/[.!?]\s*$/.test(one))return'short';return'write'}return'unsupported'}
async function fetchRows(section){const fields='section,prompt_text,context,choices,correct_answer,answer_mode,student_source_label,replacement_needed';let rows=[];for(let start=0;start<5000;start+=1000){const r=await fetch(`${API}/rest/v1/test_prep_questions?select=${encodeURIComponent(fields)}&student_usable=eq.true&section=eq.${encodeURIComponent(section)}`,{headers:{...HEAD,Range:`${start}-${start+999}`},cache:'no-store'});if(!r.ok)throw new Error(await r.text());const batch=await r.json();rows.push(...batch);if(batch.length<1000)break}return rows.filter(x=>x.replacement_needed!==true)}
function printable(v,spans=[]){if(v==null||v==='')return'';if(Array.isArray(v))return `<div class="list">${v.map(x=>`<div class="item">${printable(x,spans)}</div>`).join('')}</div>`;if(typeof v==='object')return `<div class="list">${Object.entries(v).map(([k,x])=>`<div class="item"><b>${esc(k)}</b> ${printable(x,spans)}</div>`).join('')}</div>`;let s=esc(v);for(const x of spans)s=s.replaceAll(esc(x),`<span class="u">${esc(x)}</span>`);return `<div class="value">${s.replace(/\n/g,'<br>')}</div>`}
function context(q){const c=q.context&&typeof q.context==='object'&&!Array.isArray(q.context)?q.context:{},sp=[];if(c.underlined)sp.push(String(c.underlined));if(Array.isArray(c.underlined_spans))sp.push(...c.underlined_spans.map(String));const skip=new Set(['underlined','underlined_spans','masked','chunks']);return Object.entries(c).filter(([k,v])=>!skip.has(k)&&v!=null&&v!=='').map(([k,v])=>`<div class="block"><div class="label">${esc(k.replace(/_/g,' '))}</div>${printable(v,sp)}</div>`).join('')}
function base(q,body){const ctx=context(q);return `<div class="prompt">${esc(q.prompt_text||'Question')}</div>${ctx?`<div class="context">${ctx}</div>`:''}${body}<div class="feedback" id="feedback"></div>`}
function feedback(ok,text){const f=$('#feedback');if(!f)return;f.className=`feedback show ${ok?'ok':'bad'}`;f.innerHTML=text}
function renderChoice(q,multi){state.selected=[];$('#card').innerHTML=base(q,`<div class="choices">${(q.choices||[]).map((c,i)=>`<button class="choice" data-i="${i}"><b>${['①','②','③','④','⑤','⑥'][i]||i+1}</b> ${esc(typeof c==='object'?(c.text??c.label??c.value??JSON.stringify(c)):c)}</button>`).join('')}</div>`);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(multi){state.selected.includes(i)?state.selected=state.selected.filter(x=>x!==i):state.selected.push(i);b.classList.toggle('selected')}else{state.selected=[i];document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))}})}
function renderWrite(q,short){$('#card').innerHTML=base(q,short?'<input id="answer" autocomplete="off" spellcheck="false">':'<textarea id="answer" class="answer" autocomplete="off" spellcheck="false"></textarea>')}
function renderMultipart(q){const a=answers(q),marks=['ⓐ','ⓑ','ⓒ','ⓓ','ⓔ'];$('#card').innerHTML=base(q,`<div class="structured">${a.map((_,i)=>`<div class="part"><div class="mark">${marks[i]||i+1}</div><input class="partinput" autocomplete="off" spellcheck="false"></div>`).join('')}</div>`)}
function renderCorrection(q){const a=answers(q),marks=['ⓐ','ⓑ','ⓒ','ⓓ'];$('#card').innerHTML=base(q,`<div class="structured">${a.map((_,i)=>`<div class="correction"><div class="mark">${marks[i]||i+1}</div><input class="wrongpart" placeholder="wrong part"><div class="arrow">→</div><input class="rightpart" placeholder="correction"></div>`).join('')}</div>`)}
function renderFlash(q){$('#card').innerHTML=base(q,`<div class="learn" id="flash" style="display:none">${esc(answers(q)[0]||'')}</div><button class="chip" id="reveal">Reveal</button>`);$('#reveal').onclick=()=>{$('#flash').style.display='block'}}
function renderOrder(q){const chips=(q.chips||[]).map((text,i)=>({text,i}));state.chosen=[];$('#card').innerHTML=base(q,`<div class="build" id="build"></div><div class="chips" id="pool">${chips.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div>`);const draw=()=>{$('#build').innerHTML=state.chosen.map((x,j)=>`<button class="chip" data-j="${j}">${esc(x.text)}</button>`).join('');document.querySelectorAll('#pool .chip').forEach(x=>x.classList.toggle('used',state.chosen.some(c=>c.i===Number(x.dataset.i))));document.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{state.chosen.splice(Number(x.dataset.j),1);draw()})};document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(!state.chosen.some(c=>c.i===i)){state.chosen.push(chips.find(c=>c.i===i));draw()}});draw()}
function renderBlanks(q){const chips=(q.chips||[]).map((text,i)=>({text,i}));state.chosen=[];$('#card').innerHTML=base(q,`<div class="masked">${esc(q.context?.masked||'')}</div><div class="build" id="build"></div><div class="chips" id="pool">${chips.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div>`);document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(!state.chosen.some(c=>c.i===i)){state.chosen.push(chips.find(c=>c.i===i));x.classList.add('used');$('#build').textContent=state.chosen.map(c=>c.text).join(' · ')}})}
function renderLearn(q){$('#card').innerHTML=base(q,`<div class="learn">${esc(answers(q)[0]||'')}</div>${Array.isArray(q.context?.chunks)?`<div class="chips">${q.context.chunks.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}`)}
function render(){const q=visible[index],f=$('#form').value;state={};const s=String(q?.student_source_label||'').toLowerCase(),letter=s.includes('willena')?'W':s.includes('z reference')||s.includes('zocbo')?'Z':s.includes('b reference')?'B':'';const badge=$('#bookBadge');badge.hidden=!letter;badge.textContent=letter;$('#countPill').textContent=`${visible.length} question${visible.length===1?'':'s'}`;$('#position').textContent=q?`Question ${index+1} of ${visible.length}`:'Question —';$('#prev').disabled=index<=0;$('#next').disabled=!q||index>=visible.length-1;$('#check').disabled=!q||['learn','unsupported'].includes(f);if(!q){$('#card').innerHTML='<div class="empty">No questions with this form.</div>';return}if(f==='choice')return renderChoice(q,false);if(f==='multi')return renderChoice(q,true);if(f==='short')return renderWrite(q,true);if(f==='write')return renderWrite(q,false);if(f==='multipart')return renderMultipart(q);if(f==='correction')return renderCorrection(q);if(f==='flash')return renderFlash(q);if(f==='order'||f==='chunks')return renderOrder(q);if(f==='blanks')return renderBlanks(q);if(f==='learn')return renderLearn(q);$('#card').innerHTML=base(q,'<div class="empty">Unsupported data shape</div>')}
function correctChoiceIndexes(q){const cs=(q.choices||[]).map(c=>String(typeof c==='object'?(c.text??c.label??c.value??''):c));return answers(q).map(a=>{const n=Number(a);if(Number.isInteger(n)&&n>=1&&n<=cs.length)return n-1;return cs.findIndex(c=>norm(c)===norm(a))}).filter(i=>i>=0).sort((a,b)=>a-b)}
function check(){const q=visible[index],f=$('#form').value,a=answers(q);if(!q)return;if(f==='flash'){const x=$('#flash');if(x)x.style.display='block';return feedback(true,`Answer: ${esc(a.join(' / '))}`)}if(f==='choice'||f==='multi'){const mine=[...(state.selected||[])].sort((x,y)=>x-y),right=correctChoiceIndexes(q),ok=mine.length===right.length&&mine.every((x,i)=>x===right[i]);document.querySelectorAll('.choice').forEach(b=>{const i=Number(b.dataset.i);b.classList.toggle('right',right.includes(i));b.classList.toggle('wrong',mine.includes(i)&&!right.includes(i))});return feedback(ok,ok?'Correct ✓':`Answer: ${right.map(i=>'①②③④⑤⑥'[i]||i+1).join(', ')}`)}if(f==='short'||f==='write'){const mine=$('#answer')?.value||'',ok=a.some(x=>norm(x)===norm(mine));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' / '))}`)}if(f==='multipart'){const mine=[...document.querySelectorAll('.partinput')].map(x=>x.value),ok=mine.length===a.length&&mine.every((x,i)=>norm(x)===norm(a[i]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}if(f==='correction'){const w=[...document.querySelectorAll('.wrongpart')],r=[...document.querySelectorAll('.rightpart')],pairs=a.map(correction),ok=pairs.every((m,i)=>m&&norm(w[i]?.value)===norm(m[1])&&norm(r[i]?.value)===norm(m[2]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}if(f==='order'||f==='chunks'){const mine=(state.chosen||[]).map(x=>x.text).join(' ').replace(/\s+([,.!?])/g,'$1'),ok=a.some(x=>norm(x)===norm(mine));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' / '))}`)}if(f==='blanks'){const mine=(state.chosen||[]).map(x=>x.text),ok=mine.length===a.length&&mine.every((x,i)=>norm(x)===norm(a[i]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}}
function setForms(){const counts={};for(const q of all){const f=formOf(q);counts[f]=(counts[f]||0)+1}const order=['choice','multi','short','write','multipart','correction','flash','order','chunks','blanks','learn','unsupported'],forms=order.filter(f=>counts[f]);$('#form').innerHTML=forms.map(f=>`<option value="${f}">${formNames[f]} · ${counts[f]}</option>`).join('');applyForm()}
function applyForm(){const f=$('#form').value;visible=all.filter(q=>formOf(q)===f);index=0;render()}
async function loadSkill(){const s=skill();$('#card').innerHTML='<div class="empty">Loading…</div>';all=s.kind==='db'?await fetchRows(s.id):[...(fixtures[s.id]||[])];setForms()}
$('#skill').innerHTML=skills.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#skill').value='grammar';
$('#skill').onchange=()=>loadSkill().catch(e=>{$('#card').innerHTML=`<div class="empty">${esc(e.message)}</div>`});$('#form').onchange=applyForm;$('#prev').onclick=()=>{if(index>0){index--;render()}};$('#check').onclick=check;$('#next').onclick=()=>{if(index<visible.length-1){index++;render()}};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='Enter')$('#check').click()});
loadSkill().catch(e=>{$('#card').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
})();
</script>
</body>
</html>
