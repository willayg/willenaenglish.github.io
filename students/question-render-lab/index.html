<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Question Renderer Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:920px;margin:auto;padding:16px 16px 86px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:#6d797e;text-transform:uppercase}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;border:1px solid #cfd7da;border-radius:9px;background:#fff;padding:10px}.meta{display:flex;align-items:center;gap:7px;min-height:26px;margin:8px 0 10px;color:#68757b;font-size:12px;flex-wrap:wrap}.rev-badge,.book-badge{display:inline-flex;align-items:center;justify-content:center;height:24px;border:1px solid #cfd7da;border-radius:7px;background:#fff;color:#172126;font-weight:900}.rev-badge{padding:0 7px}.book-badge{min-width:24px}.book-title{font-weight:750;color:#455158}.card{background:#fff;border:1px solid #d8dee1;border-radius:14px;padding:20px;min-height:280px}.prompt{font-size:20px;line-height:1.45;font-weight:800;margin-bottom:16px}.context{display:grid;gap:8px;margin-bottom:16px}.block{border:1px solid #e0e5e7;border-radius:10px;background:#fafbfb;padding:10px 12px}.label{font-size:10px;font-weight:800;color:#7d888d;text-transform:uppercase;margin-bottom:5px}.value{font-size:16px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.list{display:grid;gap:6px}.item{padding:7px 9px;border:1px solid #e5eaec;border-radius:8px;background:#fff}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;border:1.5px solid #cbd4d7;background:#fff;border-radius:10px;padding:11px 12px;font-weight:650;cursor:pointer}.choice.selected{border-color:#172126;background:#f1f4f5}.choice.right{border-color:#4a8b62;background:#eef8f1}.choice.wrong{border-color:#b75a5a;background:#fff1f1}.answer{min-height:92px;resize:vertical}.structured{display:grid;gap:9px}.part{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center}.correction{display:grid;grid-template-columns:38px 1fr 26px 1fr;gap:7px;align-items:center}.mark,.arrow{text-align:center;font-weight:800}.chips,.build{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cbd4d7;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.chip.used{opacity:.35}.build{min-height:52px;border:1.5px dashed #cbd4d7;border-radius:10px;padding:9px;margin-bottom:10px}.masked{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:12px}.learn{font-size:25px;line-height:1.55;font-weight:800;margin:10px 0}.feedback{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-weight:750}.feedback.show{display:block}.feedback.ok{background:#edf8f1;color:#276340}.feedback.bad{background:#fff0f0;color:#8c3838}.empty{padding:60px 15px;text-align:center;color:#7a868b}.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.nav{position:fixed;left:0;right:0;bottom:0;min-height:66px;background:#fff;border-top:1px solid #d8dee1;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:20}.nav button{border:1px solid #cfd7da;background:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;min-width:130px}.nav .check{background:#eef1f2}.nav .next{background:#172126;color:#fff;border-color:#172126;min-width:190px}.nav button:disabled{opacity:.35;cursor:default}.status{position:absolute;left:14px;color:#6c777c;font-size:12px;font-weight:700}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.card{padding:15px}.prompt{font-size:18px}.status{display:none}.nav button{flex:1;min-width:0;padding:10px 8px}.nav .next{min-width:0}.correction{grid-template-columns:30px minmax(0,1fr) 20px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <div class="field"><label>Skill</label><select id="skill"></select></div>
    <div class="field"><label>Textbook</label><select id="book"></select></div>
    <div class="field"><label>Question form</label><select id="form"></select></div>
  </div>
  <div class="meta"><span class="rev-badge">REV 4</span><span id="bookBadge" class="book-badge" hidden></span><span id="bookTitle" class="book-title"></span><span id="countPill">0 questions</span></div>
  <main class="card" id="card"><div class="empty">Loading…</div></main>
</div>
<div class="nav"><span class="status" id="position">Question —</span><button id="prev">← Previous</button><button class="check" id="check">Check Answer</button><button class="next" id="next">Next Question →</button></div>
<script>
(()=>{
'use strict';
const API='https://gxwfsqxyuufqtitspfqg.supabase.co';
const KEY=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join('');
const HEAD={apikey:KEY,Authorization:`Bearer ${KEY}`};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”"]/g,'').replace(/[.!?,;:]+$/g,'').replace(/\s+/g,' ').trim();
const forms={choice:'Multiple choice',multi:'Multi-select',write:'Written answer',multipart:'Multi-part answer',correction:'Correction',order:'Word order',chunks:'Chunk order',blanks:'Fill blanks with words',learn:'Learn / read only',unsupported:'Unsupported shape'};
const skills=[
 ['communication','Communication','stored'],
 ['grammar','Grammar','stored'],
 ['reading','Reading','stored'],
 ['vocabulary','Vocabulary','vocab'],
 ['constructed','서술형','written'],
 ['performance','수행평가','performance'],
 ['sentences','본문','sentences']
].map(([id,name,kind])=>({id,name,kind}));
let all=[],visible=[],index=0,state={},middleBooks=[],books=new Map();
const skill=()=>skills.find(x=>x.id===$('#skill').value);
const selectedBookIds=()=>$('#book').value==='*'?middleBooks.map(x=>String(x.id)):[$('#book').value];
const inFilter=ids=>`in.(${ids.join(',')})`;
const answers=q=>(Array.isArray(q?.correct_answer)?q.correct_answer:[q?.correct_answer]).filter(x=>x!=null&&String(x).trim()!=='').map(String);
const correction=a=>String(a||'').match(/^(.+?)\s*→\s*(.+)$/);

async function get(path,range){
 const headers={...HEAD};if(range)headers.Range=range;
 const r=await fetch(API+path,{headers,cache:'no-store'});
 if(!r.ok)throw new Error(await r.text());
 return r.json();
}
async function paged(path){
 let rows=[];
 for(let start=0;start<10000;start+=1000){
  const batch=await get(path,`${start}-${start+999}`);
  rows.push(...batch);
  if(batch.length<1000)break;
 }
 return rows;
}
async function fetchMiddleBooks(){return get('/rest/v1/content_books?select=id,title,school_grade&school_grade=in.(1,2,3)&order=school_grade.asc,title.asc')}
async function fetchRows(section='',answerMode=''){
 const ids=selectedBookIds(),fields='section,prompt_text,context,choices,correct_answer,answer_mode,student_source_label,book_id,unit_id,replacement_needed';
 const sf=section?`&section=eq.${encodeURIComponent(section)}`:'',af=answerMode?`&answer_mode=eq.${encodeURIComponent(answerMode)}`:'';
 return (await paged(`/rest/v1/test_prep_questions?select=${encodeURIComponent(fields)}&student_usable=eq.true${sf}${af}&book_id=${inFilter(ids)}`)).filter(x=>x.replacement_needed!==true);
}
function formOf(q){
 if(q.__form)return q.__form;
 const mode=String(q.answer_mode||'').toLowerCase(),a=answers(q),hasChoices=Array.isArray(q.choices)&&q.choices.length;
 if(hasChoices)return mode==='multi_select'?'multi':'choice';
 if(mode==='text'){
  if(a.length&&a.every(x=>correction(x)))return'correction';
  if(a.length>1)return'multipart';
  return'write';
 }
 return'unsupported';
}

async function fetchLexical(ids){
 const out=[];
 for(let i=0;i<ids.length;i+=100)out.push(...await get(`/rest/v1/lexical_entries?select=id,canonical_text,translation_ko,definition_en,part_of_speech&id=${inFilter(ids.slice(i,i+100))}`));
 return out;
}
function distractors(entry,pool,field){
 const seen=new Set([norm(entry.canonical_text)]),out=[];
 for(const x of pool){
  if(x.id===entry.id||!String(x[field]||'').trim())continue;
  const k=norm(x.canonical_text);if(!k||seen.has(k))continue;
  seen.add(k);out.push(x.canonical_text);if(out.length===3)break;
 }
 return out;
}
function vocabChoice(entry,bookId,pool,mode){
 const isDef=mode==='definition',context=isDef?{definition:entry.definition_en}:{korean:entry.translation_ko},ds=distractors(entry,pool,isDef?'definition_en':'translation_ko');
 if(ds.length<3)return null;
 const raw=[entry.canonical_text,...ds],shift=String(entry.id).split('').reduce((n,c)=>n+c.charCodeAt(0),0)%4,choices=raw.slice(shift).concat(raw.slice(0,shift));
 return{section:'vocabulary',prompt_text:isDef?'다음 영어 정의에 해당하는 단어를 고르세요.':'다음 우리말 뜻에 맞는 영어 단어 또는 표현을 고르세요.',context,choices,correct_answer:[String(choices.indexOf(entry.canonical_text)+1)],answer_mode:'single_select',student_source_label:'Book Reference',book_id:bookId};
}
function vocabWrite(entry,bookId,mode){
 const isDef=mode==='definition';
 return{section:'vocabulary',prompt_text:isDef?'다음 영어 정의에 해당하는 단어를 쓰세요.':'다음 우리말 뜻에 맞는 영어 단어 또는 표현을 쓰세요.',context:isDef?{definition:entry.definition_en}:{korean:entry.translation_ko},correct_answer:[entry.canonical_text],answer_mode:'text',student_source_label:'Book Reference',book_id:bookId};
}
async function loadVocabulary(){
 const ids=selectedBookIds(),stored=await fetchRows('vocabulary');
 const occ=await paged(`/rest/v1/source_content_occurrences?select=book_id,lexical_entry_id&book_id=${inFilter(ids)}&occurrence_type=eq.lexical_entry&skill=eq.vocabulary`);
 const seen=new Set(),pairs=[];
 for(const o of occ){if(!o.lexical_entry_id)continue;const k=`${o.book_id}:${o.lexical_entry_id}`;if(!seen.has(k)){seen.add(k);pairs.push(o)}}
 const entries=await fetchLexical([...new Set(pairs.map(x=>String(x.lexical_entry_id)))]),byId=new Map(entries.map(x=>[String(x.id),x])),byBook=new Map();
 for(const p of pairs){const e=byId.get(String(p.lexical_entry_id));if(!e?.canonical_text)continue;const b=String(p.book_id);if(!byBook.has(b))byBook.set(b,[]);byBook.get(b).push(e)}
 const generated=[];
 for(const [bookId,pool] of byBook)for(const e of pool){
  if(String(e.definition_en||'').trim()){generated.push(vocabWrite(e,bookId,'definition'));const q=vocabChoice(e,bookId,pool,'definition');if(q)generated.push(q)}
  if(String(e.translation_ko||'').trim()){generated.push(vocabWrite(e,bookId,'korean'));const q=vocabChoice(e,bookId,pool,'korean');if(q)generated.push(q)}
 }
 return [...stored,...generated];
}

const tokens=s=>String(s||'').trim().split(/\s+/).filter(Boolean);
function blankVariant(q){
 const target=answers(q)[0]||String(q.context?.target_en||''),words=tokens(target);
 if(words.length<3)return null;
 const picks=[Math.floor(words.length/3),Math.floor(words.length*2/3)].filter((x,i,a)=>x>=0&&x<words.length&&a.indexOf(x)===i);
 const missing=picks.map(i=>words[i].replace(/^[“"'(]+|[”"'),.!?;:]+$/g,''));
 const masked=words.map((w,i)=>picks.includes(i)?w.replace(/[A-Za-z][A-Za-z'-]*/,'_____'):w).join(' ');
 return{...q,prompt_text:'빈칸을 완성하세요.',context:{korean:q.context?.prompt_ko||q.prompt_text,masked},correct_answer:missing,chips:[...missing].reverse(),__form:'blanks'};
}
function performanceVariants(q){
 const target=answers(q)[0]||String(q.context?.target_en||'').trim(),ko=q.context?.prompt_ko||q.prompt_text||'',chunks=Array.isArray(q.context?.chunks)?q.context.chunks.filter(Boolean):[];
 if(!target)return[];
 const base={book_id:q.book_id,unit_id:q.unit_id,student_source_label:q.student_source_label||'학교 수행평가',section:'performance'};
 const out=[
  {...base,prompt_text:'익히기',context:{korean:ko,chunks},correct_answer:[target],__form:'learn'},
  {...base,prompt_text:'직접쓰기',context:{korean:ko},correct_answer:[target],answer_mode:'text',__form:'write'},
  {...base,prompt_text:'실전 배열',context:{korean:ko},correct_answer:[target],chips:tokens(target),__form:'order'}
 ];
 const blank=blankVariant({...base,prompt_text:ko,context:{prompt_ko:ko,target_en:target},correct_answer:[target]});if(blank)out.push(blank);
 if(chunks.length>1)out.push({...base,prompt_text:'청크 배열',context:{korean:ko},correct_answer:[target],chips:chunks,__form:'chunks'});
 return out;
}
async function loadPerformance(){return (await fetchRows('performance')).flatMap(performanceVariants)}

function splitSentences(body,translations=[]){
 const text=String(body||'').replace(/\r/g,'').trim();if(!text)return[];
 const parts=text.split(/\n+/).flatMap(line=>line.match(/[^.!?]+[.!?]+(?:["'”’])?|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(x=>x&&/[A-Za-z]/.test(x));
 return parts.map((text,i)=>({text,ko:String(translations[i]||'')}));
}
async function loadSentences(){
 const ids=selectedBookIds(),units=await paged(`/rest/v1/content_units?select=id,book_id&book_id=${inFilter(ids)}`),out=[],seen=new Set();
 for(const u of units){
  const ps=await get(`/rest/v1/passages?select=id,title,body,metadata&status=eq.published&metadata-%3E%3Eunit_id=eq.${encodeURIComponent(u.id)}`);
  for(const p of ps){
   const translations=Array.isArray(p.metadata?.sentence_translations_ko)?p.metadata.sentence_translations_ko:[];
   for(const s of splitSentences(p.body,translations)){
    const k=`${u.book_id}:${norm(s.text)}`;if(seen.has(k))continue;seen.add(k);
    out.push({book_id:u.book_id,section:'sentences',prompt_text:'다음 우리말 문장을 영어로 완성하세요.',context:{...(s.ko?{korean:s.ko}:{}),...(p.title?{passage:p.title}:{})},correct_answer:[s.text],chips:tokens(s.text),student_source_label:'Book Reference',__form:'order'});
   }
  }
 }
 const legacy=await paged(`/rest/v1/test_prep_source_passages?select=book_id,title,source_text&student_usable=eq.true&book_id=${inFilter(ids)}&status=neq.archived`);
 for(const p of legacy)for(const s of splitSentences(p.source_text,[])){
  const k=`${p.book_id}:${norm(s.text)}`;if(seen.has(k))continue;seen.add(k);
  out.push({book_id:p.book_id,section:'sentences',prompt_text:'다음 본문 문장을 올바른 순서로 만드세요.',context:{...(p.title?{passage:p.title}:{})},correct_answer:[s.text],chips:tokens(s.text),student_source_label:'Book Reference',__form:'order'});
 }
 return out;
}

function printable(v,spans=[]){
 if(v==null||v==='')return'';
 if(Array.isArray(v))return `<div class="list">${v.map(x=>`<div class="item">${printable(x,spans)}</div>`).join('')}</div>`;
 if(typeof v==='object')return `<div class="list">${Object.entries(v).map(([k,x])=>`<div class="item"><b>${esc(k)}</b> ${printable(x,spans)}</div>`).join('')}</div>`;
 let s=esc(v);for(const x of spans)s=s.replaceAll(esc(x),`<span class="u">${esc(x)}</span>`);
 return `<div class="value">${s.replace(/\n/g,'<br>')}</div>`;
}
function context(q){
 const c=q.context&&typeof q.context==='object'&&!Array.isArray(q.context)?q.context:{},sp=[];
 if(c.underlined)sp.push(String(c.underlined));if(Array.isArray(c.underlined_spans))sp.push(...c.underlined_spans.map(String));
 const skip=new Set(['underlined','underlined_spans','masked','chunks']);
 return Object.entries(c).filter(([k,v])=>!skip.has(k)&&v!=null&&v!=='').map(([k,v])=>`<div class="block"><div class="label">${esc(k.replace(/_/g,' '))}</div>${printable(v,sp)}</div>`).join('');
}
function base(q,body){const ctx=context(q);return `<div class="prompt">${esc(q.prompt_text||'Question')}</div>${ctx?`<div class="context">${ctx}</div>`:''}${body}<div class="feedback" id="feedback"></div>`}
function feedback(ok,text){const f=$('#feedback');if(!f)return;f.className=`feedback show ${ok?'ok':'bad'}`;f.innerHTML=text}
function renderChoice(q,multi){
 state.selected=[];$('#card').innerHTML=base(q,`<div class="choices">${(q.choices||[]).map((c,i)=>`<button class="choice" data-i="${i}"><b>${['①','②','③','④','⑤','⑥'][i]||i+1}</b> ${esc(typeof c==='object'?(c.text??c.label??c.value??JSON.stringify(c)):c)}</button>`).join('')}</div>`);
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(multi){state.selected.includes(i)?state.selected=state.selected.filter(x=>x!==i):state.selected.push(i);b.classList.toggle('selected')}else{state.selected=[i];document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))}});
}
function renderWrite(q){$('#card').innerHTML=base(q,String(q.section||'').toLowerCase()==='vocabulary'?'<input id="answer" autocomplete="off" spellcheck="false">':'<textarea id="answer" class="answer" autocomplete="off" spellcheck="false"></textarea>')}
function renderMultipart(q){const a=answers(q),marks=['ⓐ','ⓑ','ⓒ','ⓓ','ⓔ'];$('#card').innerHTML=base(q,`<div class="structured">${a.map((_,i)=>`<div class="part"><div class="mark">${marks[i]||i+1}</div><input class="partinput" autocomplete="off" spellcheck="false"></div>`).join('')}</div>`)}
function renderCorrection(q){const a=answers(q),marks=['ⓐ','ⓑ','ⓒ','ⓓ'];$('#card').innerHTML=base(q,`<div class="structured">${a.map((_,i)=>`<div class="correction"><div class="mark">${marks[i]||i+1}</div><input class="wrongpart" placeholder="wrong part"><div class="arrow">→</div><input class="rightpart" placeholder="correction"></div>`).join('')}</div>`)}
function renderOrder(q){
 const chips=(q.chips||[]).map((text,i)=>({text,i}));state.chosen=[];$('#card').innerHTML=base(q,`<div class="build" id="build"></div><div class="chips" id="pool">${chips.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div>`);
 const draw=()=>{$('#build').innerHTML=state.chosen.map((x,j)=>`<button class="chip" data-j="${j}">${esc(x.text)}</button>`).join('');document.querySelectorAll('#pool .chip').forEach(x=>x.classList.toggle('used',state.chosen.some(c=>c.i===Number(x.dataset.i))));document.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{state.chosen.splice(Number(x.dataset.j),1);draw()})};
 document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(!state.chosen.some(c=>c.i===i)){state.chosen.push(chips.find(c=>c.i===i));draw()}});draw();
}
function renderBlanks(q){
 const chips=(q.chips||[]).map((text,i)=>({text,i}));state.chosen=[];$('#card').innerHTML=base(q,`<div class="masked">${esc(q.context?.masked||'')}</div><div class="build" id="build"></div><div class="chips" id="pool">${chips.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div>`);
 document.querySelectorAll('#pool .chip').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.i);if(!state.chosen.some(c=>c.i===i)){state.chosen.push(chips.find(c=>c.i===i));x.classList.add('used');$('#build').textContent=state.chosen.map(c=>c.text).join(' · ')}});
}
function renderLearn(q){$('#card').innerHTML=base(q,`<div class="learn">${esc(answers(q)[0]||'')}</div>${Array.isArray(q.context?.chunks)?`<div class="chips">${q.context.chunks.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}`)}
function sourceLetter(q){const s=String(q?.student_source_label||'').toLowerCase();if(s.includes('z reference')||s.includes('zocbo'))return'Z';if(s.includes('willena'))return'W';if(s.includes('b reference')||s.includes('textbook reference')||s.includes('textbook practice')||s.includes('book reference')||s.includes('서술형'))return'B';return''}
function render(){
 const q=visible[index],f=$('#form').value;state={};
 const letter=sourceLetter(q),badge=$('#bookBadge');badge.hidden=!letter;badge.textContent=letter;badge.title=letter==='Z'?'Zocbo':letter==='W'?'Willena authored':letter==='B'?'Book reference':'';
 $('#bookTitle').textContent=q?.book_id?books.get(String(q.book_id))||'':'';$('#countPill').textContent=`${visible.length} question${visible.length===1?'':'s'}`;$('#position').textContent=q?`Question ${index+1} of ${visible.length}`:'Question —';
 $('#prev').disabled=index<=0;$('#next').disabled=!q||index>=visible.length-1;$('#check').disabled=!q||['learn','unsupported'].includes(f);
 if(!q){$('#card').innerHTML='<div class="empty">No questions with this form.</div>';return}
 if(f==='choice')return renderChoice(q,false);if(f==='multi')return renderChoice(q,true);if(f==='write')return renderWrite(q);if(f==='multipart')return renderMultipart(q);if(f==='correction')return renderCorrection(q);if(f==='order'||f==='chunks')return renderOrder(q);if(f==='blanks')return renderBlanks(q);if(f==='learn')return renderLearn(q);
 $('#card').innerHTML=base(q,'<div class="empty">Unsupported data shape</div>');
}
function correctChoiceIndexes(q){
 const cs=(q.choices||[]).map(c=>String(typeof c==='object'?(c.text??c.label??c.value??''):c));
 return answers(q).map(a=>{const n=Number(a);if(Number.isInteger(n)&&n>=1&&n<=cs.length)return n-1;return cs.findIndex(c=>norm(c)===norm(a))}).filter(i=>i>=0).sort((a,b)=>a-b);
}
function check(){
 const q=visible[index],f=$('#form').value,a=answers(q);if(!q)return;
 if(f==='choice'||f==='multi'){const mine=[...(state.selected||[])].sort((x,y)=>x-y),right=correctChoiceIndexes(q),ok=mine.length===right.length&&mine.every((x,i)=>x===right[i]);document.querySelectorAll('.choice').forEach(b=>{const i=Number(b.dataset.i);b.classList.toggle('right',right.includes(i));b.classList.toggle('wrong',mine.includes(i)&&!right.includes(i))});return feedback(ok,ok?'Correct ✓':`Answer: ${right.map(i=>'①②③④⑤⑥'[i]||i+1).join(', ')}`)}
 if(f==='write'){const mine=$('#answer')?.value||'',ok=a.some(x=>norm(x)===norm(mine));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' / '))}`)}
 if(f==='multipart'){const mine=[...document.querySelectorAll('.partinput')].map(x=>x.value),ok=mine.length===a.length&&mine.every((x,i)=>norm(x)===norm(a[i]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}
 if(f==='correction'){const w=[...document.querySelectorAll('.wrongpart')],r=[...document.querySelectorAll('.rightpart')],pairs=a.map(correction),ok=pairs.every((m,i)=>m&&norm(w[i]?.value)===norm(m[1])&&norm(r[i]?.value)===norm(m[2]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}
 if(f==='order'||f==='chunks'){const mine=(state.chosen||[]).map(x=>x.text).join(' ').replace(/\s+([,.!?])/g,'$1'),ok=a.some(x=>norm(x)===norm(mine));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' / '))}`)}
 if(f==='blanks'){const mine=(state.chosen||[]).map(x=>x.text),ok=mine.length===a.length&&mine.every((x,i)=>norm(x)===norm(a[i]));return feedback(ok,ok?'Correct ✓':`Answer: ${esc(a.join(' · '))}`)}
}
function setForms(){
 const counts={};for(const q of all){const f=formOf(q);counts[f]=(counts[f]||0)+1}
 const order=['choice','multi','write','multipart','correction','order','chunks','blanks','learn','unsupported'],available=order.filter(f=>counts[f]);
 $('#form').innerHTML=available.map(f=>`<option value="${f}">${forms[f]} · ${counts[f]}</option>`).join('');applyForm();
}
function applyForm(){const f=$('#form').value;visible=all.filter(q=>formOf(q)===f);index=0;render()}
async function loadSkill(){
 const s=skill();$('#card').innerHTML='<div class="empty">Loading…</div>';
 if(s.kind==='vocab')all=await loadVocabulary();
 else if(s.kind==='written')all=await fetchRows('','text');
 else if(s.kind==='performance')all=await loadPerformance();
 else if(s.kind==='sentences')all=await loadSentences();
 else all=await fetchRows(s.id);
 setForms();
}
async function init(){
 middleBooks=await fetchMiddleBooks();books=new Map(middleBooks.map(x=>[String(x.id),String(x.title||'')]));
 $('#book').innerHTML='<option value="*">All middle school</option>'+middleBooks.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
 $('#skill').innerHTML=skills.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#skill').value='grammar';await loadSkill();
}
$('#skill').onchange=()=>loadSkill().catch(e=>{$('#card').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
$('#book').onchange=()=>loadSkill().catch(e=>{$('#card').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
$('#form').onchange=applyForm;$('#prev').onclick=()=>{if(index>0){index--;render()}};$('#check').onclick=check;$('#next').onclick=()=>{if(index<visible.length-1){index++;render()}};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='Enter')$('#check').click()});
init().catch(e=>{$('#card').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
})();
</script>
</body>
</html>
