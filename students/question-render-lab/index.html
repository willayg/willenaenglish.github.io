<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Question Renderer Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#engine{display:block;width:100%;height:calc(100% - 62px);border:0;background:#f4f6f7}.skipbar{height:62px;border-top:1px solid #d8dee1;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));position:relative;z-index:10}.skipbar button{font:inherit;border:1px solid #cfd7da;background:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;min-width:130px}.skipbar button.primary{background:#172126;color:#fff;border-color:#172126;min-width:190px}.skipbar button:disabled{opacity:.35;cursor:default}.count{position:absolute;left:14px;color:#6c777c;font-size:12px;font-weight:700}@media(max-width:620px){#engine{height:calc(100% - 66px)}.skipbar{height:66px}.count{display:none}.skipbar button{min-width:110px;flex:1}.skipbar button.primary{min-width:0;flex:1.4}}
</style>
</head>
<body>
<iframe id="engine" src="./engine.html" title="Question renderer engine"></iframe>
<div class="skipbar">
  <span class="count" id="count">Question —</span>
  <button id="previous">← Previous</button>
  <button class="primary" id="nextQuestion">Next Question →</button>
</div>
<script>
(()=>{
 const frame=document.getElementById('engine');
 const prev=document.getElementById('previous');
 const next=document.getElementById('nextQuestion');
 const count=document.getElementById('count');
 function doc(){try{return frame.contentDocument}catch(_){return null}}
 function sync(){const d=doc();if(!d)return;const p=d.querySelector('#prev'),n=d.querySelector('#next'),id=d.querySelector('#idPill');prev.disabled=!p||p.disabled;next.disabled=!n||n.disabled;count.textContent=id?.textContent||'Question —'}
 function clickInside(selector){const d=doc(),b=d?.querySelector(selector);if(b&&!b.disabled){b.click();requestAnimationFrame(sync);setTimeout(sync,50)}}
 prev.onclick=()=>clickInside('#prev');
 next.onclick=()=>clickInside('#next');
 frame.addEventListener('load',()=>{sync();setInterval(sync,300)});
 addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){e.preventDefault();clickInside('#next')}if(e.key==='ArrowLeft'&&!(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){e.preventDefault();clickInside('#prev')}});
})();
</script>
</body>
</html>
