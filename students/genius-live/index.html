<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Genius Live · Students</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ed5ca6;--cyan:#76d8e1;--ink:#294653;--muted:#758d97;--line:#d9edf0}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 90% 0%,#e1fbff,transparent 36%),radial-gradient(circle at 10% 0%,#ffeff7,transparent 35%),#f8fcfd;font:14px Poppins,Arial,sans-serif;color:var(--ink)}
header{padding:17px 20px;background:#fff;border-bottom:2px solid #dcf2f6;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:23px;font-weight:800;letter-spacing:-.5px}header strong span{color:var(--pink)}main{max-width:940px;margin:25px auto;padding:0 16px}
.card{background:white;border:2px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px #2557670b}.card.pink{border-color:#ffbedf}.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}
h1{font-size:clamp(27px,5vw,44px);margin:0 0 10px}h2{margin:0 0 12px;font-size:21px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;padding:6px 11px;background:#e4f8fb;color:#378492;border-radius:30px;font-size:12px;font-weight:700}
input,button{font:inherit}input{width:100%;padding:13px;border:2px solid #c7e9ef;border-radius:12px;background:#fff;font-size:17px}
button{padding:12px 17px;font-weight:700;border-radius:12px;border:2px solid var(--cyan);background:white;color:#bd387d;cursor:pointer}button.primary{color:white;background:var(--pink);border-color:var(--pink)}button:disabled{opacity:.5;cursor:not-allowed}
.pin{font-size:clamp(40px,6vw,65px);font-weight:800;color:#d94894;letter-spacing:8px}.question{font-size:clamp(23px,3vw,35px);line-height:1.4;font-weight:800;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{border:0;color:white;text-align:left;padding:19px 17px;min-height:100px;font-size:17px;display:flex;align-items:center;gap:12px}
.answer:nth-child(4n+1){background:#eb6197}.answer:nth-child(4n+2){background:#3db5d1}.answer:nth-child(4n+3){background:#e9a746}.answer:nth-child(4n+4){background:#8978d2}.answer.chosen{outline:5px solid #2c6179;outline-offset:2px}.answer.correct{outline:5px solid #2ba36c;outline-offset:2px}.answer.dim{opacity:.4}.letter{width:32px;height:32px;flex:none;border:1px solid #fff9;border-radius:9px;display:grid;place-items:center}
.timer{font-size:33px;color:var(--pink);font-weight:800;font-variant-numeric:tabular-nums}.bar{height:9px;border-radius:9px;overflow:hidden;background:#e4f1f3}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.notice{border:1px solid #f4dba5;background:#fff8e7;border-radius:12px;padding:13px;margin:12px 0}.notice.error{border-color:#f2b6cf;background:#fff0f5}.score{display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid #e7eff0;padding:11px 0}.score:last-child{border:0}
@media(max-width:700px){.grid,.answers{grid-template-columns:1fr}.card{padding:16px}.answer{min-height:77px}.pin{letter-spacing:5px}}
</style></head><body><header><strong>Genius <span>Live</span></strong><span class="pill">Willena Students</span></header><main><div id="message" class="notice" hidden></div><div id="app"></div></main>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(action,body={})=>{const r=await fetch("/api/genius-live",{method:"POST",credentials:"include",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){const e=new Error(d.error||"Game server error");e.status=r.status;throw e}return d};
const teamName=n=>["Pink Dragons","Blue Sharks","Green Tigers","Yellow Stars"][n]||"Team";
let pin=sessionStorage.getItem("genius.live.student.pin")||new URLSearchParams(location.search).get("pin")||"",state=null,working=false,last="";
function notice(t,err=false){const m=$("#message");m.hidden=!t;m.className="notice"+(err?" error":"");m.textContent=t}
function scores(){let list=state.mode==="team"?Array.from({length:state.teamCount},(_,i)=>({name:teamName(i),score:state.players.filter(p=>p.team===i).reduce((n,p)=>n+p.score,0)})):state.players.map(p=>({name:p.name,score:p.score}));list.sort((a,b)=>b.score-a.score);return list.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>'+p.score.toLocaleString()+' pts</b></div>').join("")}
function joinForm(){return '<div class="grid"><section class="card pink"><span class="pill">Classroom game</span><h1>Join Genius Live</h1><p class="muted">Ask your teacher for the six-digit game PIN.</p>'+
 '<form id="joinForm"><label for="pinInput" style="font-weight:700">Game PIN</label><input id="pinInput" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required value="'+esc(pin)+'" placeholder="123456" style="margin:8px 0 15px"><button class="primary">Join Game</button></form>'+
 '<p class="small muted">Your English name comes automatically from your Willena account.</p></section>'+
 '<section class="card"><h2>How to play</h2><p>1. Sign into your Willena student account.</p><p>2. Enter the PIN.</p><p>3. Read the vocabulary question and tap your answer.</p><p>4. Earn points for correct, quick answers.</p><a href="/students/dashboard">Student Dashboard</a></section></div>'}
function lobby(){const own=state.players.find(p=>p.id===state.myPlayerId);return '<section class="card pink" style="text-align:center"><span class="pill">Joined successfully · '+esc(state.className||"Class")+'</span><h1>Waiting for your teacher</h1><div class="pin">'+esc(pin)+'</div><p>You are playing as <b>'+esc(own?.name||"Student")+'</b>.</p><p class="muted">'+state.players.length+' players ready'+(state.mode==="team"?" · "+teamName(own?.team):"")+'</p><div class="notice">The game will begin when your teacher presses Start.</div></section>'}
function quiz(){const q=state.question,done=state.myAnswer!==null,reveal=state.status==="reveal";return '<div class="grid"><section class="card pink"><div class="row between"><span class="pill">'+esc(q.book)+' · Unit '+q.unit+'</span><b>'+state.questionNumber+' / '+state.total+'</b></div>'+
 '<div class="row between" style="margin:15px 0 8px"><div class="timer" id="timer">—</div><span class="small muted">'+state.answeredCount+' / '+state.players.length+' answered</span></div><div class="bar"><i id="timerBar"></i></div>'+
 '<div class="question">'+esc(q.prompt)+'</div><div class="answers">'+q.options.map((s,i)=>'<button data-answer="'+i+'" class="answer '+(done&&state.myAnswer===i?"chosen ":"")+(reveal?(i===q.correct?"correct":"dim"):"")+'" '+(done||reveal||Date.now()>=Date.parse(state.deadline)?"disabled":"")+'><span class="letter">'+["A","B","C","D"][i]+'</span>'+esc(s)+'</button>').join("")+'</div>'+
 (reveal?'<div class="notice"><b>'+esc(q.options[q.correct])+'</b> = '+esc(q.explanation)+'<p>You earned '+state.myPoints+' points this round.</p></div>':done?'<p class="notice">Answer locked! Wait for the teacher to reveal the answer.</p>':'<p class="muted small">Choose one answer before time runs out.</p>')+'</section>'+
 '<section class="card"><h2>'+ (state.mode==="team"?"Team scores":"Leaderboard")+'</h2>'+scores()+'</section></div>'}
function finish(){return '<div class="grid"><section class="card pink"><h1>Game complete!</h1><p>Great work playing '+state.total+' vocabulary questions.</p><h2>Results</h2>'+scores()+'<p><button class="primary" id="leave">Join another game</button></p></section><section class="card"><h2>Thanks for playing!</h2><p>Your live quiz score does not change your regular Genius points or homework.</p></section></div>'}
function paint(){const key=state?state.status+"|"+state.questionNumber+"|"+state.answeredCount+"|"+state.players.length+"|"+state.myAnswer+"|"+state.myPoints:"join";if(last===key)return;last=key;$("#app").innerHTML=!state?joinForm():state.status==="lobby"?lobby():["question","reveal"].includes(state.status)?quiz():finish();
 const join=$("#joinForm");if(join)join.onsubmit=e=>{e.preventDefault();pin=$("#pinInput").value.trim();joinGame()};
 document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
 const leave=$("#leave");if(leave)leave.onclick=()=>{pin="";state=null;last="";sessionStorage.removeItem("genius.live.student.pin");sessionStorage.removeItem("genius.live.student.joined");paint()};
 tick()}
async function joinGame(){if(working)return;working=true;notice("Joining…");try{state=await api("join",{pin});sessionStorage.setItem("genius.live.student.pin",pin);sessionStorage.setItem("genius.live.student.joined","1");last="";notice("");paint()}catch(e){notice(e.message,true);if(e.status===401)showLogin()}finally{working=false}}
function showLogin(){const link=document.createElement("a");link.href="/students/signin.html?redirect="+encodeURIComponent(location.pathname+location.search);link.textContent=" Sign in to Willena";$("#message").append(" · ",link)}
async function refresh(){if(!pin||working)return;try{const fresh=await api("state",{pin});state=fresh;notice("");paint()}catch(e){if(e.status===401){notice("Please sign in to your Willena account.",true);showLogin()}else if(/not found|expired|cancelled|not joined/i.test(e.message)){state=null;last="";sessionStorage.removeItem("genius.live.student.pin");sessionStorage.removeItem("genius.live.student.joined");notice(e.message,true);paint()}else notice(e.message,true)}}
async function answer(choice){if(working||!state||state.myAnswer!==null||state.status!=="question")return;working=true;try{await api("answer",{pin,choice,questionIndex:state.questionNumber-1});await refreshDirect()}catch(e){notice(e.message,true)}finally{working=false}}
async function refreshDirect(){const fresh=await api("state",{pin});state=fresh;last="";paint()}
function tick(){if(!state||state.status!=="question")return;const rem=Math.max(0,Date.parse(state.deadline)-Date.now()),t=$("#timer"),b=$("#timerBar");if(t)t.textContent=Math.ceil(rem/1000)+"s";if(b)b.style.width=(100*rem/(state.seconds*1000))+"%";if(rem===0)document.querySelectorAll("[data-answer]").forEach(b=>b.disabled=true)}
setInterval(()=>{if(pin&&state&&document.visibilityState==="visible")refresh()},1900);
setInterval(tick,200);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pin)refresh()});
paint();if(pin&&sessionStorage.getItem("genius.live.student.joined")==="1")refresh();
</script></body></html>
