*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e3eaeb;display:flex;align-items:center;padding:0 max(18px,4vw);position:sticky;top:0;z-index:30}.brand{font-weight:900}.top small{margin-left:10px;color:var(--muted);font-weight:700}.picker{position:sticky;top:68px;z-index:29;display:flex;gap:7px;overflow:auto;padding:10px max(14px,4vw);background:rgba(246,249,249,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e2e9ea}.picker button{flex:0 0 auto;width:40px;height:40px;border:2px solid #d0dfe1;border-radius:12px;background:#fff;color:#60787d;font-weight:900}.picker button.on{border-color:var(--pink);background:#fff2f8;color:#d84e90}.wrap{width:min(1180px,calc(100% - 28px));margin:22px auto 60px;display:grid;gap:22px}.daily{border:2px solid var(--pink);border-radius:28px;background:#fff;display:grid;grid-template-columns:260px 1fr;overflow:hidden}.daily-left{padding:22px;background:linear-gradient(180deg,#fff3f8,#fff);border-right:1px solid #f2dae5}.today{font-size:.7rem;font-weight:900;letter-spacing:.14em;color:var(--pink)}.daily h1{margin:7px 0 2px;font-size:1.55rem}.daily small{color:var(--muted);font-weight:800}.ring{width:120px;height:120px;margin:15px auto 0;border-radius:50%;background:conic-gradient(var(--pink) 0 35%,#f1d7e3 35%);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff}.ring b{z-index:1;color:#d84f90}.daily-main{padding:26px 29px;display:flex;flex-direction:column;justify-content:center}.daily-main h2{margin:0 0 5px;font-size:1.72rem}.daily-main p{margin:0 0 15px;color:var(--muted);font-weight:700}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick span{padding:11px;border:2px solid #cae8ea;border-radius:14px;text-align:center;font-size:.8rem;font-weight:900}.label{display:flex;justify-content:space-between;align-items:end;gap:12px}.label h2{margin:0;font-size:1.08rem}.label p{margin:0;color:var(--muted);font-size:.75rem;font-weight:700}.stage{min-height:390px}.concept{display:none;min-height:390px;border-radius:28px;overflow:hidden;box-shadow:0 16px 42px rgba(33,63,68,.09)}.concept.on{display:block}.coachmark{width:58px;height:58px;flex:0 0 58px}.coachmark.big{width:92px;height:92px}.kicker{font-size:.67rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.muted{opacity:.72}.button{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer}.button.ghost{background:transparent;border:1px solid currentColor}.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:var(--accent)}.chatbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px;padding:7px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(10,25,28,.16)}.chatbox input{min-width:0;border:0;outline:0;background:transparent;color:inherit;padding:8px 9px;font-weight:700}.chatbox input::placeholder{color:currentColor;opacity:.55}.chatbox button{border:0;border-radius:11px;padding:9px 13px;background:var(--accent);color:var(--accentInk);font-weight:900}.toggle{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:rgba(0,0,0,.15)}.toggle b{padding:7px 11px;border-radius:9px;font-size:.7rem}.toggle b.on{background:var(--accent);color:var(--accentInk)}
/* shared shell */
.dark{color:#eefafa;border:3px solid var(--edge);background:var(--base)}.dark .panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:18px}.light{color:#29494f;border:3px solid var(--edge);background:var(--base)}.light .panel{background:var(--panel);border:1px solid rgba(45,83,89,.11);border-radius:18px}.shell{padding:26px;min-height:390px}.head{display:flex;align-items:center;gap:14px}.head h2{margin:2px 0 0}.head .toggle{margin-left:auto}.briefgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:20px}.lead{padding:22px}.lead h3{margin:7px 0 6px;font-size:1.65rem;line-height:1.15}.lead p{margin:0}.side{display:grid;gap:10px}.stat{padding:15px}.stat-top{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;font-weight:800}.stat .meter{margin-top:9px}.bubble{padding:15px 17px;border-radius:8px 18px 18px 18px;margin-top:14px;background:rgba(255,255,255,.08);font-size:.85rem;font-weight:700}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chips span{padding:8px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.15);font-size:.7rem;font-weight:900}
/* palettes */
.p1{--base:#294a50;--panel:#345a60;--edge:#1d393e;--accent:#63d4dc;--accentInk:#173b40}.p2{--base:#173f45;--panel:#22525a;--edge:#0e3035;--accent:#83e1d1;--accentInk:#163d3a}.p3{--base:#263f50;--panel:#324f62;--edge:#1b3140;--accent:#7fd4ff;--accentInk:#173548}.p4{--base:#39494a;--panel:#46595a;--edge:#2b393a;--accent:#b6e1c2;--accentInk:#28412e}.p5{--base:#514553;--panel:#625265;--edge:#3b313d;--accent:#ff9bc8;--accentInk:#4f2340}.p6{--base:#fff;--panel:#f0f8f7;--edge:#c5dedb;--accent:#2fb5a9;--accentInk:#fff}.p7{--base:#f8f6f0;--panel:#fff;--edge:#d9d3c5;--accent:#d79a3d;--accentInk:#fff}.p8{--base:#233f3a;--panel:#2f534c;--edge:#17302c;--accent:#72d9b1;--accentInk:#153b2e}.p9{--base:#20374c;--panel:#2a4964;--edge:#14293a;--accent:#8cc8ff;--accentInk:#183552}.p10{--base:#304448;--panel:#3b565b;--edge:#223437;--accent:#ff8bbd;--accentInk:#47223a}
/* 1 existing console */.c1 .shell{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.c1 .lead{display:flex;flex-direction:column;justify-content:center}.c1 .head{margin-bottom:15px}.c1 .side{padding:0}.c1 .stat{background:rgba(255,255,255,.06)}
/* 2 mission brief */.c2 .shell{display:grid;grid-template-columns:auto 1fr 310px;gap:20px;align-items:center}.c2 .mission h2{font-size:2rem;margin:5px 0}.c2 .mission p{margin:0}.c2 .side{padding:17px}.c2 .coachmark{width:86px;height:86px}
/* 3 chat terminal */.c3 .shell{padding:22px}.terminal{height:100%;min-height:342px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(0,0,0,.18);overflow:hidden}.terminaltop{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.12)}.terminaltop .coachmark{width:44px;height:44px}.log{padding:18px;display:grid;gap:10px}.line{padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.07)}.line.ai{border-left:4px solid var(--accent)}
/* 4 existing brief/radar */.c4 .shell{display:grid;grid-template-columns:270px 1fr;gap:16px}.radar{padding:20px;text-align:center}.orb{width:158px;height:158px;border-radius:50%;border:2px solid rgba(255,255,255,.18);margin:17px auto;display:grid;place-items:center;box-shadow:inset 0 0 0 28px rgba(0,0,0,.12)}.focus{display:grid;gap:9px}.focus .stat{padding:16px}.focus .hot{outline:1px solid var(--accent)}
/* 5 compact deck */.c5 .shell{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:19px}.deckcopy h2{margin:4px 0;font-size:1.7rem}.deckactions{display:grid;grid-template-columns:1fr;gap:8px}.deckactions .button{min-width:150px;background:var(--accent);color:var(--accentInk)}
/* NEW 6 split brief + chat */.c6 .briefgrid{grid-template-columns:1fr 360px}.c6 .chatpanel{padding:18px}.c6 .chatpanel .bubble{background:#fff;border:1px solid #d7e7e4}.c6 .chips span{border-color:#cbdedb}
/* NEW 7 conversation first */.c7 .shell{display:grid;grid-template-columns:1fr 310px;gap:14px}.c7 .conversation{padding:20px}.c7 .conversation .bubble{background:#fff;border:1px solid #e5dfd2}.c7 .coachbrief{padding:20px}.c7 .coachbrief h3{font-size:1.45rem;margin:8px 0}.c7 .chips span{border-color:#ded7ca}
/* NEW 8 coach inbox */.c8 .shell{display:grid;grid-template-columns:260px 1fr;gap:14px}.c8 .summary{padding:20px}.c8 .summary h2{margin:8px 0}.c8 .thread{padding:19px}.c8 .thread .bubble{background:rgba(255,255,255,.08)}
/* NEW 9 briefing cards */.c9 .cards{display:grid;grid-template-columns:1.2fr repeat(2,.7fr);gap:11px;margin-top:20px}.c9 .cards .panel{padding:18px}.c9 .cards h3{margin:7px 0}.c9 .chatbox{margin-top:18px}
/* NEW 10 recommendation + drawer */.c10 .shell{display:grid;grid-template-columns:1fr 330px;gap:14px}.c10 .recommend{padding:24px}.c10 .recommend h2{font-size:1.85rem;margin:8px 0}.c10 .drawer{padding:18px}.c10 .drawer .stat{background:rgba(255,255,255,.05);margin-top:8px}
/* NEW 11 soft light brief */.c11 .briefgrid{grid-template-columns:1fr 1fr}.c11 .bubble{background:#fff;border:1px solid #d6e6e3}.c11 .chips span{border-color:#c8ded9}.c11 .meter{background:#dce9e7}
/* NEW 12 status wall */.c12 .wall{display:grid;grid-template-columns:1.35fr .65fr .65fr;gap:10px;margin-top:18px}.c12 .wall .panel{padding:17px}.c12 .wall .hero{grid-row:span 2;padding:23px}.c12 .hero h3{font-size:1.6rem;margin:8px 0}.c12 .wall .chat{grid-column:2/4}
/* NEW 13 guided chat */.c13 .shell{display:grid;grid-template-columns:320px 1fr;gap:14px}.c13 .profile{padding:20px;text-align:center}.c13 .profile .coachmark{margin:0 auto}.c13 .profile h2{margin:12px 0 5px}.c13 .chatstream{padding:20px}.c13 .chatstream .bubble:nth-child(even){margin-left:15%;border-radius:18px 8px 18px 18px;background:rgba(255,255,255,.12)}
/* NEW 14 action brief */.c14 .actionrow{display:grid;grid-template-columns:1.3fr repeat(3,.55fr);gap:10px;margin-top:20px}.c14 .actionrow .panel{padding:17px}.c14 .actionrow .hero{padding:22px}.c14 .hero h3{font-size:1.55rem;margin:7px 0}.c14 .actionrow strong{font-size:1.2rem}
/* NEW 15 calm coach */.c15 .shell{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}.c15 .main{padding:22px}.c15 .main h2{margin:7px 0;font-size:1.65rem}.c15 .minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.c15 .minirow .panel{padding:13px}.c15 .chatbox{margin-top:16px}

<body>
<header class="top"><div class="brand">Willena Study · AI Coach Lab</div><small>15 directions · same page, coach only</small></header>
<nav class="picker" id="picker"></nav>
<main class="wrap">
<section class="daily"><div class="daily-left"><div class="today">TODAY</div><h1>오늘의 학습</h1><small>1일 연속 학습</small><div class="ring"><b>7 / 20</b></div></div><div class="daily-main"><h2>오늘은 13문제만 더 하면 끝!</h2><p>Daily Study context stays the same. Only the Coach below changes.</p><div class="quick"><span>AI 코치</span><span>교재 공부</span><span>교재 연습</span></div></div></section>
<div class="label"><div><h2 id="conceptName">01 · Command Console</h2><p id="conceptNote">Existing direction reference</p></div><p>Use the numbered buttons to compare quickly.</p></div>
<section class="stage" id="stage"></section>
</main>
<script>
const mark='<img class="coachmark" src="./assets/ai-coach-mark.svg" alt="AI Coach">';
const big='<img class="coachmark big" src="./assets/ai-coach-mark.svg" alt="AI Coach">';
const chat='<div class="chatbox"><input placeholder="Ask your coach…"><button>Send</button></div>';
const stat=(label,val,w)=>`<div class="stat panel"><div class="stat-top"><span>${label}</span><strong>${val}</strong></div><div class="meter"><i style="width:${w}%"></i></div></div>`;
const data=[
['Command Console','Existing #1 direction',`<div class="concept dark p1 c1"><div class="shell"><div class="lead panel"><div class="head">${mark}<div><div class="kicker">AI COACH</div><h2>Ready when you are.</h2></div></div><div class="kicker">NEXT BEST MOVE</div><h3>Review Unit 5 grammar for 6 minutes.</h3><p class="muted">You missed 3 condition questions yesterday.</p><div class="chips"><span>Why this?</span><span>Change task</span><span>Start now</span></div></div><div class="side">${stat('Grammar','68%',68)}${stat('Vocabulary','84%',84)}${stat('Daily goal','7 / 20',35)}</div></div></div>`],
['Mission Brief','Existing direction',`<div class="concept dark p2 c2"><div class="shell">${big}<div class="mission"><div class="kicker">TODAY\'S COACH BRIEF</div><h2>One weak spot. One quick win.</h2><p class="muted">Fix comparatives, then go back to Daily Study.</p><div class="chips"><span>6 min</span><span>Unit 5</span><span>Grammar</span></div></div><div class="side panel">${stat('Confidence','72%',72)}${stat('Recent accuracy','64%',64)}<button class="button" style="background:var(--accent);color:var(--accentInk)">Start coach task</button></div></div></div>`],
['Coach Terminal','Existing chat-heavy direction',`<div class="concept dark p3 c3"><div class="shell"><div class="terminal"><div class="terminaltop">${mark}<div><b>Willena Coach</b><div class="kicker">ONLINE</div></div></div><div class="log"><div class="line ai">I noticed Unit 5 grammar is slowing you down. Want a quick explanation or a 5-question warm-up?</div><div class="chips"><span>Explain it</span><span>Quiz me</span><span>Later</span></div>${chat}</div></div></div></div>`],
['Daily Focus Radar','Existing #4 direction',`<div class="concept dark p4 c4"><div class="shell"><div class="radar panel"><div class="kicker">LEARNING RADAR</div><div class="orb">${big}</div><b>3 signals found</b></div><div class="focus">${stat('Vocabulary · Unit 5','Strong',88)}${stat('Grammar · Unit 5','Needs work',61)}${stat('Sentence building','Improving',74)}<div class="panel" style="padding:16px"><b>Coach says:</b><div class="bubble">Let\'s fix grammar first. It will make the rest of today easier.</div></div></div></div></div>`],
['Compact Coach Deck','Existing compact direction',`<div class="concept dark p5 c5"><div class="shell">${big}<div class="deckcopy"><div class="kicker">AI COACH</div><h2>You\'re close on Unit 5.</h2><p class="muted">A short grammar reset should be enough.</p></div><div class="deckactions"><button class="button">Explain</button><button class="button">Practice</button><button class="button">Chat</button></div></div></div>`],
['Brief + Chat Drawer','NEW · light mint/teal',`<div class="concept light p6 c6"><div class="shell"><div class="head">${mark}<div><div class="kicker">AI DAILY BRIEF</div><h2>Here\'s what I\'d do next.</h2></div><div class="toggle"><b class="on">Brief</b><b>Chat</b></div></div><div class="briefgrid"><div class="lead panel"><div class="kicker">RECOMMENDATION</div><h3>Do a 5-minute Unit 5 grammar repair.</h3><p class="muted">You already know the vocabulary. Grammar is the only thing holding this unit back.</p><div class="chips"><span>Start 5 min</span><span>Skip</span><span>Why?</span></div></div><div class="chatpanel panel"><b>Ask the coach</b><div class="bubble">“Why am I getting these wrong?”</div>${chat}</div></div></div></div>`],
['Conversation First','NEW · warm sand/amber',`<div class="concept light p7 c7"><div class="shell"><div class="conversation panel"><div class="head">${mark}<div><div class="kicker">COACH CHAT</div><h2>What do you want help with?</h2></div></div><div class="bubble">I can explain today\'s weak point, quiz you, or help you choose what to study next.</div><div class="chips"><span>What should I study?</span><span>Explain Unit 5</span><span>Quiz me</span></div>${chat}</div><div class="coachbrief panel"><div class="kicker">TODAY\'S SIGNAL</div><h3>Grammar is the best use of your next 6 minutes.</h3>${stat('Unit 5 grammar','64%',64)}</div></div></div>`],
['Coach Inbox','NEW · forest green',`<div class="concept dark p8 c8"><div class="shell"><div class="summary panel">${big}<div class="kicker">COACH INBOX</div><h2>2 things worth your attention</h2><p class="muted">Nothing urgent. Just useful.</p>${stat('Daily goal','7 / 20',35)}</div><div class="thread panel"><div class="bubble"><b>1 · Unit 5 grammar</b><br>You are repeating the same comparative mistake. I can fix that quickly.</div><div class="bubble"><b>2 · Reading Lab 5</b><br>Your vocabulary recall is strong enough to move on.</div><div class="chips"><span>Open #1</span><span>Open #2</span><span>Chat instead</span></div>${chat}</div></div></div>`],
['Three-Card Briefing','NEW · navy/cool blue',`<div class="concept dark p9 c9"><div class="shell"><div class="head">${mark}<div><div class="kicker">AI COACH</div><h2>Your learning briefing</h2></div><div class="toggle"><b class="on">Brief</b><b>Chat</b></div></div><div class="cards"><div class="panel"><div class="kicker">DO NEXT</div><h3>Unit 5 Grammar</h3><p class="muted">6-minute targeted practice</p><button class="button" style="background:var(--accent);color:var(--accentInk)">Start</button></div><div class="panel"><div class="kicker">STRONG</div><h3>84%</h3><p>Vocabulary</p></div><div class="panel"><div class="kicker">WATCH</div><h3>64%</h3><p>Grammar</p></div></div>${chat}</div></div>`],
['Recommendation + Detail Drawer','NEW · charcoal + pink',`<div class="concept dark p10 c10"><div class="shell"><div class="recommend panel"><div class="head">${mark}<div><div class="kicker">COACH RECOMMENDS</div><h2>Fix one grammar pattern before Daily Study.</h2></div></div><p class="muted">This is based on your last 12 answers, not the whole book.</p><div class="chips"><span>Start</span><span>Explain</span><span>Chat about it</span></div>${chat}</div><div class="drawer panel"><div class="kicker">WHY THIS?</div>${stat('Recent accuracy','64%',64)}${stat('Repeated mistake','3×',48)}${stat('Time needed','6 min',75)}</div></div></div>`],
['Soft Coach Brief','NEW · pale mint',`<div class="concept light p6 c11"><div class="shell"><div class="head">${mark}<div><div class="kicker">GOOD MORNING</div><h2>I found one useful thing to work on.</h2></div><div class="toggle"><b class="on">Plan</b><b>Chat</b></div></div><div class="briefgrid"><div class="lead panel"><div class="kicker">YOUR NEXT STEP</div><h3>Practice comparatives for 5 minutes.</h3><p class="muted">Then continue the Daily Study exactly where you left off.</p><div class="chips"><span>Start</span><span>Not now</span></div></div><div class="panel" style="padding:18px"><b>Want to ask why?</b><div class="bubble">I can show the exact mistakes I noticed.</div>${chat}</div></div></div></div>`],
['Status Wall','NEW · green control room',`<div class="concept dark p8 c12"><div class="shell"><div class="head">${mark}<div><div class="kicker">COACH STATUS</div><h2>Today at a glance</h2></div></div><div class="wall"><div class="panel hero"><div class="kicker">BEST NEXT ACTION</div><h3>Repair Unit 5 grammar</h3><p class="muted">5–6 minutes. High impact.</p><button class="button" style="background:var(--accent);color:var(--accentInk)">Start</button></div><div class="panel"><b>84%</b><br><span class="muted">Vocab</span></div><div class="panel"><b>64%</b><br><span class="muted">Grammar</span></div><div class="panel chat"><b>Switch to chat</b>${chat}</div></div></div></div>`],
['Guided Coach Chat','NEW · conversation-led blue',`<div class="concept dark p3 c13"><div class="shell"><div class="profile panel">${big}<div class="kicker">WILLENA COACH</div><h2>Ask me anything</h2><p class="muted">Or use one of my suggestions.</p><div class="chips"><span>What next?</span><span>Explain a mistake</span></div></div><div class="chatstream panel"><div class="bubble">You\'ve done well with Unit 5 vocabulary.</div><div class="bubble">So I should keep doing vocab?</div><div class="bubble">Actually, no. Grammar is the better next move. Want me to show you why?</div><div class="chips"><span>Show me</span><span>Quiz me</span></div>${chat}</div></div></div>`],
['Action Brief','NEW · slate/green',`<div class="concept dark p4 c14"><div class="shell"><div class="head">${mark}<div><div class="kicker">AI ACTION BRIEF</div><h2>Choose how you want help.</h2></div></div><div class="actionrow"><div class="panel hero"><div class="kicker">RECOMMENDED</div><h3>Unit 5 grammar reset</h3><p class="muted">Best match for your current progress.</p></div><div class="panel"><strong>5 min</strong><br><span class="muted">Practice</span></div><div class="panel"><strong>2 min</strong><br><span class="muted">Explain</span></div><div class="panel"><strong>Open</strong><br><span class="muted">Chat</span></div></div>${chat}</div></div>`],
['Calm Personal Coach','NEW · charcoal/pink accent',`<div class="concept dark p10 c15"><div class="shell">${big}<div class="main panel"><div class="head"><div><div class="kicker">YOUR COACH</div><h2>You don\'t need to do everything.</h2></div><div class="toggle"><b class="on">Plan</b><b>Chat</b></div></div><p class="muted">One small grammar task is enough before you continue today.</p><div class="minirow"><div class="panel"><b>6 min</b><br><span class="muted">Time</span></div><div class="panel"><b>Unit 5</b><br><span class="muted">Target</span></div><div class="panel"><b>High</b><br><span class="muted">Impact</span></div></div>${chat}</div></div></div>`]
];
const picker=document.getElementById('picker'),stage=document.getElementById('stage'),name=document.getElementById('conceptName'),note=document.getElementById('conceptNote');
data.forEach((d,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>show(i);picker.appendChild(b)});
function show(i){picker.querySelectorAll('button').forEach((b,n)=>b.classList.toggle('on',n===i));stage.innerHTML=data[i][2];stage.querySelector('.concept').classList.add('on');name.textContent=String(i+1).padStart(2,'0')+' · '+data[i][0];note.textContent=data[i][1]}
show(0);
</script>
</body>
</html>
