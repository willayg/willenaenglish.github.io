<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Study V2 · Full Card Streak Concepts</title>
<style>
:root{--pink:#ff6fb0;--cyan:#21b3be;--orange:#d9923b;--blue:#5b7fe5;--ink:#244d53;--muted:#73878c;--bg:#eef5f6;--line:#dce8ea;--sp:#fff3f8;--sc:#eefafb;--so:#fff8ee;--sb:#f3f5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe9eb;color:var(--ink)}button{font:inherit}.shell{min-height:100vh;padding:12px}.top{max-width:520px;margin:0 auto 10px;padding:12px;border:2px solid var(--cyan);border-radius:20px;background:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.top strong{font-size:16px}.top small{font-size:10px;color:var(--muted);font-weight:800}.tabs{display:flex;gap:7px;margin-top:10px}.tab{flex:1;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:8px 10px;font-size:11px;font-weight:900}.tab.active{border-color:var(--pink);background:var(--sp);color:var(--pink)}
.phone{max-width:430px;min-height:780px;margin:0 auto;border:2px solid #c7d6d9;border-radius:30px;background:var(--bg);overflow:hidden;box-shadow:0 18px 50px rgba(35,73,79,.14)}.bar{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);font-weight:900}.points{display:flex;gap:6px}.pill{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.pill.c{background:var(--sc);color:var(--cyan)}.pill.p{background:var(--sp);color:var(--pink)}.avatar{width:32px;height:32px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;background:#fff}.screen{padding:12px 12px 28px}.label{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}.label h1{margin:0;font-size:17px}.label span{font-size:29px;font-weight:950;color:#bfd0d3}.card{background:#fff;border:3px solid var(--line);border-radius:24px}.hero{position:relative;overflow:hidden;min-height:430px;padding:18px}.head{position:relative;z-index:4;display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:950}.hero-title{font-size:28px;line-height:1.05;font-weight:950;letter-spacing:-.04em}.ring{position:relative;z-index:4;width:160px;height:160px;margin:23px auto 0;border-radius:50%;background:conic-gradient(var(--pink) 0 70%,#f3d8e4 70%);box-shadow:0 12px 28px rgba(36,77,83,.08)}.ring:after{content:"";position:absolute;inset:19px;border-radius:50%;background:#fff}.ring span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:var(--pink);font-size:23px;font-weight:950}.hero-sub{position:relative;z-index:4;text-align:center;margin-top:14px;font-size:13px;line-height:1.45;color:var(--muted);font-weight:900}.strip{position:relative;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px}.seg{height:10px;border-radius:99px;background:#e7edef}.seg.done{background:var(--pink)}
.streak{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:950;white-space:nowrap;background:#fff}.streak svg{width:27px;height:27px;flex:0 0 27px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.card-art{position:absolute;z-index:1;pointer-events:none}.card-art svg{width:100%;height:100%;overflow:visible}.card-art path,.card-art circle,.card-art line,.card-art polyline,.card-art polygon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
/* BOLT — whole card is an electric blue/pink Daily card. */
.hero.bolt-card{border-color:var(--blue);background:linear-gradient(145deg,#fff 0 54%,var(--sb) 100%);box-shadow:0 12px 30px rgba(91,127,229,.12)}.bolt-card .eyebrow{color:var(--blue)}.bolt-card .streak{color:var(--blue);border:2px solid #cbd5ff;background:#fff}.bolt-card .card-art{right:-23px;top:63px;width:158px;height:245px;color:rgba(91,127,229,.20);transform:rotate(4deg)}.bolt-card .card-art svg{stroke-width:8}.bolt-card:after{content:"";position:absolute;z-index:2;width:115px;height:115px;border-radius:50%;right:-43px;bottom:-36px;background:rgba(255,111,176,.11)}
/* SPARK — the card itself carries a field of pink/cyan sparks. */
.hero.spark-card{border-color:var(--pink);background:linear-gradient(160deg,#fff 0 58%,var(--sp) 100%);box-shadow:0 12px 30px rgba(255,111,176,.12)}.spark-card .eyebrow{color:var(--pink)}.spark-card .streak{color:#d44e8d;border:2px solid #ffc6df;background:#fff}.spark-card .card-art.main{left:-28px;top:125px;width:128px;height:128px;color:rgba(255,111,176,.21)}.spark-card .card-art.mini{right:18px;bottom:62px;width:78px;height:78px;color:rgba(33,179,190,.18)}.spark-card .card-art svg{stroke-width:4}.spark-card:after{content:"";position:absolute;z-index:2;width:135px;height:135px;border-radius:50%;right:-55px;top:-50px;background:rgba(33,179,190,.08)}
/* ROCKET — whole card becomes a launch/trajectory visual. */
.hero.rocket-card{border-color:var(--orange);background:linear-gradient(160deg,#fff 0 54%,var(--so) 100%);box-shadow:0 12px 30px rgba(217,146,59,.13)}.rocket-card .eyebrow{color:var(--orange)}.rocket-card .streak{color:#bf7b29;border:2px solid #f2d7ad;background:#fff}.rocket-card .card-art.rocket{right:-7px;top:78px;width:142px;height:196px;color:rgba(217,146,59,.22);transform:rotate(8deg)}.rocket-card .card-art.trail{left:5px;bottom:38px;width:210px;height:104px;color:rgba(91,127,229,.16)}.rocket-card .card-art svg{stroke-width:4}.rocket-card:after{content:"";position:absolute;z-index:2;width:105px;height:105px;border-radius:50%;left:-36px;top:-32px;background:rgba(91,127,229,.08)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.action{min-height:64px;padding:10px 12px;border:3px solid;border-radius:19px;background:#fff;display:flex;align-items:center;gap:10px;font-weight:900}.action.c{border-color:var(--cyan);grid-column:1/-1}.action.o{border-color:var(--orange)}.action.b{border-color:var(--blue)}.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px}.c .ico{background:var(--sc);color:var(--cyan)}.o .ico{background:var(--so);color:var(--orange)}.b .ico{background:var(--sb);color:var(--blue)}.book{margin-top:10px;padding:14px;border-color:var(--cyan)}.book-tabs{display:flex;gap:8px;overflow:hidden;font-size:10px;font-weight:900}.book-tabs span:first-child{color:var(--pink);border-bottom:3px solid var(--cyan)}.book-name{margin:22px 0 5px;text-align:center;font-size:clamp(27px,8.3vw,38px);line-height:1.02;font-weight:950;letter-spacing:-.045em}.unit{text-align:center;color:var(--cyan);font-size:13px;font-weight:900}.pips{display:flex;justify-content:center;gap:5px;margin-top:13px}.pips i{width:9px;height:9px;border-radius:50%;background:#d9ecee}.pips i.on{width:26px;border-radius:99px;background:var(--pink)}
@media(max-width:430px){.shell{padding:0}.top{border-radius:0;border-left:0;border-right:0;margin:0;max-width:none}.phone{border-radius:0;border-left:0;border-right:0;max-width:none;min-height:calc(100vh - 95px);box-shadow:none}.screen{padding:10px 10px 24px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="topline"><div><strong>Study V2 · Full Daily Card Concepts</strong><br><small>Bolt · Spark · Rocket</small></div><small id="count">Bolt</small></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="phone">
    <div class="bar"><div class="points"><span class="pill c">● 4775</span><span class="pill p">★ 763</span></div><span>Study</span><span class="avatar">🐯</span></div>
    <div class="screen" id="screen"></div>
  </div>
</div>
<script>
const icons={
 bolt:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18.5 3 8.5 17h7l-2 12L24 14h-7z"/></svg>`,
 spark:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l2.1 6.1L24 12l-5.9 2.9L16 21l-2.1-6.1L8 12l5.9-2.9L16 3z"/><path d="M25 21l1.1 3 2.9 1.4-2.9 1.4-1.1 3-1.1-3-2.9-1.4 2.9-1.4L25 21z"/></svg>`,
 rocket:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 6c4-4 8-3 8-3s1 4-3 8l-8 8-6-6 9-7z"/><circle cx="21" cy="8" r="2.3"/><path d="M10 14 6 15l-3 4 7-1M14 18l-1 7-4 3 1-8M8 24l-3 3M11 25l-3 4"/></svg>`
};
const art={
 bolt:`<div class="card-art"><svg viewBox="0 0 120 220"><polyline points="76,4 35,85 67,85 32,216 101,112 66,112 101,45 76,45 76,4"/></svg></div>`,
 spark:`<div class="card-art main"><svg viewBox="0 0 100 100"><path d="M50 5 59 38 92 50 59 62 50 95 41 62 8 50 41 38Z"/></svg></div><div class="card-art mini"><svg viewBox="0 0 70 70"><path d="M35 7 41 29 63 35 41 41 35 63 29 41 7 35 29 29Z"/></svg></div>`,
 rocket:`<div class="card-art rocket"><svg viewBox="0 0 120 170"><path d="M74 18c25-22 39-15 39-15s8 22-17 44L59 82 36 60Z"/><circle cx="88" cy="31" r="10"/><path d="M39 61 17 66 3 88l37-9M58 83l-4 37-23 18 9-42"/></svg></div><div class="card-art trail"><svg viewBox="0 0 210 100"><path d="M15 86c31-43 63-29 86-49 24-21 47-28 91-18"/><path d="M8 74c25-30 49-20 67-36"/></svg></div>`
};
const action=`<div class="actions"><div class="action c"><span class="ico">🤖</span><span>AI 코치</span></div><div class="action o"><span class="ico">↗</span><span>교재 연습</span></div><div class="action b"><span class="ico">▣</span><span>교재 공부</span></div></div>`;
const book=`<div class="book card"><div class="book-tabs"><span>Come On Everyone 4</span><span>Willena Reading Lab 5</span></div><div class="book-name">Come On Everyone 4</div><div class="unit">Unit 3 · In Town</div><div class="pips"><i class="on"></i><i></i></div></div>`;
const data=[
 {name:'Bolt',key:'bolt',cls:'bolt-card'},
 {name:'Spark',key:'spark',cls:'spark-card'},
 {name:'Rocket',key:'rocket',cls:'rocket-card'}
];
function hero(d){return `<div class="hero card ${d.cls}">${art[d.key]}<div class="head"><div><div class="eyebrow">TODAY</div><div class="hero-title">오늘의 학습</div></div><span class="streak">${icons[d.key]}<span>4일 연속</span></span></div><div class="ring"><span>14/20</span></div><div class="hero-sub">오늘은 6문제만 더 하면 끝!</div><div class="strip"><i class="seg done"></i><i class="seg done"></i><i class="seg done"></i><i class="seg"></i><i class="seg"></i></div></div>`}
const tabs=document.getElementById('tabs'),screen=document.getElementById('screen'),count=document.getElementById('count');
data.forEach((d,i)=>{let b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=d.name;b.onclick=()=>show(i);tabs.appendChild(b)});
function show(i){[...tabs.children].forEach((b,n)=>b.classList.toggle('active',n===i));const d=data[i];count.textContent=d.name;screen.innerHTML=`<div class="label"><h1>${d.name} Daily Card</h1><span>${String(i+1).padStart(2,'0')}</span></div>${hero(d)}${action}${book}`;history.replaceState(null,'','#'+(i+1))}
let start=Math.max(0,Math.min(2,(parseInt(location.hash.slice(1),10)||1)-1));show(start);
</script>
</body>
</html>
