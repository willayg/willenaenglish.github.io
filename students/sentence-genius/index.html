<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Genius · Willena</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f4fbff;color:#16354b}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;padding:13px 0 23px}h1{margin:0;font-size:27px;color:#116c91}small{color:#68859a}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;background:#19afd3;color:white;font-weight:800;padding:13px 18px}button:disabled{opacity:.35;cursor:default}.ghost{background:white;color:#127b9f;border:2px solid #c4e6f1}.card{background:white;border:2px solid #d3edf5;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 19px #d6ebf46b}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px}select{padding:12px;border:2px solid #cfeaf4;border-radius:12px;width:100%;background:#fff}label{display:block;font-size:12px;font-weight:800;color:#618093;margin-bottom:5px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{background:#f5fbfe;color:#24576f;border:2px solid #d4edf4;padding:15px 6px;border-radius:16px;text-align:center}.mode.active{background:#d7f7ff;border-color:#16acce}.mode b{display:block}.mode small{display:block;margin-top:5px;font-size:11px}.optional{color:#b17521}.gold{color:#b2830b;background:#fff5cf;padding:4px 10px;border-radius:20px;font-weight:800}.prompt{text-align:center;padding:34px 10px}.ko{font-size:clamp(22px,5vw,32px);font-weight:800;margin:8px 0 20px}.en{font-size:clamp(20px,5vw,30px);color:#148cbb;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;min-height:62px;padding:14px;border-radius:12px;background:#f5fbff;margin:12px 0}.chips button{background:#fff;color:#187ea3;border:2px solid #bfe4ef}.answer{border:2px dashed #9dd6e7;min-height:72px}.answer button{background:#dff9ff}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.mic{height:82px;width:82px;border-radius:50%;font-size:34px}.result{text-align:center;font-size:20px;font-weight:800;min-height:26px}.right{color:#188c50}.wrong{color:#c34e56}.progress{background:#dbecf2;height:10px;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#19b5d3;transition:width .2s}footer{text-align:center;color:#7996a5;font-size:12px;padding:20px}.hidden{display:none}#notice{color:#9a5518}.pill{font-size:12px;color:#718f9c}a{color:#137d9c}</style></head><body><main>
<header><div><h1>✦ Sentence Genius</h1><small>문장 지니어스 · Willena English</small></div><a href="/students/">⌂ Home</a></header>
<section class="card"><div class="selectors"><div><label>BOOK · 교재</label><select id="book"><option>Loading books…</option></select></div><div><label>UNIT · 단원</label><select id="unit"></select></div></div><p id="notice" role="status"></p><div style="display:flex;justify-content:space-between;align-items:center"><span id="count" class="pill"></span><span class="gold" id="gold">☆ Unit in progress</span></div></section>
<section class="card"><div class="modes"><button class="mode active" data-mode="coach"><b>🎧 Practice Coach</b><small class="optional">Optional · Gold not required</small></button><button class="mode" data-mode="unscramble"><b>🧩 Unscramble</b><small>+4 ★ per correct</small></button><button class="mode" data-mode="speaking"><b>🎙 Speaking</b><small>+4 ★ per correct</small></button></div></section>
<section class="card"><div style="display:flex;justify-content:space-between"><b id="position">Sentence 1</b><span id="stars" class="gold">0 ★</span></div><div class="progress"><div id="bar" style="width:0"></div></div><div class="prompt"><div class="pill">한국어</div><div class="ko" id="korean"></div><div class="en" id="english"></div></div><div id="coachArea" class="toolbar"><button id="listen" class="ghost">🔊 Listen</button><button id="coachMic">🎙 Speak</button></div><div id="scrambleArea" class="hidden"><div class="chips answer" id="answer"></div><div class="chips" id="tokens"></div><div class="toolbar"><button id="reset" class="ghost">↺ Reset</button><button id="check">Check ✓</button></div></div><div id="speechArea" class="hidden" style="text-align:center"><button class="mic" id="mic" aria-label="Start speaking">🎙</button><p class="pill">Speak the full English sentence</p></div><div class="result" id="feedback"></div><div class="toolbar" style="margin-top:18px"><button id="prev" class="ghost">← Back</button><button id="next">Next →</button></div></section>
<footer>Practice Coach is optional. Golden Units require perfect Unscramble and Speaking scores. <span id="source"></span></footer>
</main><script>
const ROOT='https://gxwfsqxyuufqtitspfqg.supabase.co/rest/v1/',KEY='sb_publishable_G-FYhHfDL4OGdL892gY1Zg_epdbEeqO';
const $=id=>document.getElementById(id);let books=[],units=[],items=[],index=0,mode='coach',selected=[],remaining=[],state={};
const headers={apikey:KEY,Authorization:'Bearer '+KEY};
const safe=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){let r=await fetch(ROOT+path,{headers});if(!r.ok)throw Error('Content API '+r.status);return r.json()}
function key(){return 'sentence-genius-v1:'+ $('unit').value}
function save(){localStorage.setItem(key(),JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(key())||'{}')}catch{state={}}}
function record(correct){let item=items[index];if(!item)return;let k=mode+':'+item.id;if(!state[k])state[k]={first:null,done:false};if(state[k].first===null)state[k].first=!!correct;if(correct)state[k].done=true;save();feedback(correct);stats()}
function feedback(correct){$('feedback').textContent=correct?'✓ Great job!':'Try again!';$('feedback').className='result '+(correct?'right':'wrong')}
function stats(){let total=items.length;let grade=m=>items.filter(x=>state[m+':'+x.id]?.first===true).length;let u=grade('unscramble'),s=grade('speaking'),gold=total>0&&u===total&&s===total;$('stars').textContent=(u*4+s*4)+' ★';$('gold').textContent=gold?'🏆 GOLDEN UNIT':'☆ Unit in progress';$('bar').style.width=(total?Math.round(((u+s)/(total*2))*100):0)+'%';$('count').textContent=total+' sentences · Unscramble '+u+'/'+total+' · Speaking '+s+'/'+total}
function tokenize(t){return (t.match(/[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)?|[^\s]/gu)||[])}
function norm(t){return String(t).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,'').replace(/'/g,'')}
function render(){let x=items[index];$('position').textContent=x?'Sentence '+(index+1)+' / '+items.length:'No sentences';$('korean').textContent=x?.ko||'No translated sentences available for this unit.';$('english').textContent=(mode==='coach')?x?.en||'':'';$('feedback').textContent='';$('coachArea').classList.toggle('hidden',mode!=='coach');$('scrambleArea').classList.toggle('hidden',mode!=='unscramble');$('speechArea').classList.toggle('hidden',mode!=='speaking');$('prev').disabled=index===0;$('next').disabled=index>=items.length-1;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(x&&mode==='unscramble'){selected=[];remaining=tokenize(x.en).map((word,i)=>({word,i})).sort(()=>Math.random()-.5);drawChips()}stats()}
function drawChips(){for(let [id,arr,move] of [['answer',selected,'back'],['tokens',remaining,'take']]){$(id).innerHTML='';arr.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o.word;b.onclick=()=>{if(move==='take'){selected.push(...remaining.splice(i,1))}else{remaining.push(...selected.splice(i,1))}drawChips();};$(id).appendChild(b)})}}
async function setBook(){let id=$('book').value;units=await api('content_units?select=id,title,unit_number&book_id=eq.'+encodeURIComponent(id)+'&order=unit_number.asc&limit=200');$('unit').innerHTML=units.map(u=>'<option value="'+safe(u.id)+'">Unit '+safe(u.unit_number||'')+' · '+safe(u.title||'')+'</option>').join('');await setUnit()}
async function setUnit(){items=[];index=0;$('notice').textContent='Loading textbook sentences…';render();let unit=$('unit').value;if(!unit)return;try{let occurrences=await api('source_content_occurrences?select=sentence_id&unit_id=eq.'+encodeURIComponent(unit)+'&sentence_id=not.is.null&limit=500');let ids=[...new Set(occurrences.map(x=>x.sentence_id).filter(Boolean))];if(!ids.length){$('notice').textContent='This unit has no linked sentences yet.';return}let result=[];for(let i=0;i<ids.length;i+=50){result.push(...await api('sentences?select=id,text,translation_ko&translation_ko=not.is.null&id=in.('+ids.slice(i,i+50).join(',')+')&limit=100'))}items=result.filter(x=>x.text&&x.translation_ko).map(x=>({id:x.id,en:x.text,ko:x.translation_ko}));$('notice').textContent=items.length?'':'No complete English/Korean sentence pairs in this unit.'}catch(e){$('notice').textContent='Could not load sentences: '+e.message}finally{load();render()}}
async function init(){try{books=await api('content_books?select=id,title&status=eq.active&order=title.asc&limit=500');if(!books.length)books=await api('content_books?select=id,title&order=title.asc&limit=500');$('book').innerHTML=books.map(b=>'<option value="'+safe(b.id)+'">'+safe(b.title)+'</option>').join('');await setBook()}catch(e){$('notice').textContent='Could not load the books: '+e.message;$('book').innerHTML='<option>Unavailable</option>'}}
function listen(){let x=items[index];if(!x)return;if(!speechSynthesis){feedback(false);return}speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(x.en);s.lang='en-US';s.rate=1;speechSynthesis.speak(s)}
function speak(){let x=items[index];if(!x)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('feedback').textContent='Speech recognition is unavailable in this browser.';return}let rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onresult=e=>{let said=e.results[0][0].transcript;let yes=norm(said)===norm(x.en);$('feedback').textContent='Heard: '+said;record(yes)};rec.onerror=e=>$('feedback').textContent='Microphone: '+e.error;rec.start();$('feedback').textContent='Listening…'}
$('book').onchange=setBook;$('unit').onchange=setUnit;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=()=>{index=Math.min(items.length-1,index+1);render()};$('reset').onclick=()=>{render()};$('check').onclick=()=>{if(!items[index])return;record(norm(selected.map(x=>x.word).join(' '))===norm(items[index].en))};$('listen').onclick=listen;$('mic').onclick=speak;$('coachMic').onclick=speak;init();
</script></body></html>
