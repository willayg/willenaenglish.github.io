der-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.context-title{font-weight:900;margin-bottom:8px}.line{display:block}.line+.line{margin-top:2px}.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.items,.segments,.claims{display:grid;gap:8px;margin-top:8px}.item,.segment,.claim{background:#fff;border:1px solid #e6e7ec;border-radius:10px;padding:9px 10px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;background:#fff;border:1.5px solid #dedfe6;border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}.choice.selected{border-color:var(--pink);background:var(--soft)}.choice.correct{border-color:#75c98f;background:#effaf3}.choice.wrong{border-color:#ef9b9e;background:#fff1f1}.choice .n{font-weight:900;min-width:22px}.choice .t{line-height:1.5}.actions{display:flex;gap:10px;margin-top:16px}.primary,.secondary{border:0;border-radius:14px;padding:13px 16px;font-weight:900}.primary{background:var(--ink);color:#fff;flex:1}.primary:disabled{opacity:.35}.secondary{background:#eeeef2;color:#333}.feedback{margin-top:13px;padding:12px;border-radius:13px;font-weight:800;font-size:13px;display:none}.feedback.ok{display:block;background:#effaf3;color:var(--ok)}.feedback.bad{display:block;background:#fff0f0;color:var(--bad)}.explanation{display:none;margin-top:10px;background:#fff8ea;border:1px solid #f2d9a4;border-radius:14px;padding:14px;color:#54462d;font-size:13px;line-height:1.7}.explanation.show{display:block}.explanation strong{display:block;margin-bottom:5px}.loading,.empty{padding:42px 20px;text-align:center;color:var(--muted);font-weight:700}.result{text-align:center;padding:32px 22px}.score{font-size:54px;font-weight:950}.overlay{position:fixed;inset:0;background:rgba(20,22,29,.38);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.overlay.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:2 const U='https://gxwfsqxyuufqtitspfqg.supabase.co',K=['sb_publishable_','G-FYhHfDL4OGdL892gY1Zg_','epdbEeqO'].join(''),H={apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'};const card=document.getElementById('card'),bar=document.getElementById('bar'),heroTitle=document.getElementById('heroTitle'),heroSub=document.getElementById('heroSub'),overlay=document.getElementById('overlay'),reasonsEl=document.getElementById('reasons'),flagNote=document.getElementById('flagNote');let section='communication',sourceFilter='all',bank=[],questions=[],index=0,selected=new Set(),checked=false,score=0,wrongIds=[],flagReason='';const flagReasons=['정답이 이상함','문제가 애매함','영어가 이상함','시험 범위와 안 맞음','너무 쉬움','너무 어려움','반복 문제','화면/표시 문제','기타'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(v){let s=String(v??'').replace(/\r\n?/g,'\n');for(let i=0;i<4;i++)s=s.replace(/\\+n/g,'\n');return s}function markedLine(v,spans=[]){let s=String(v??''),hits=[];if(!Array.isArray(spans))spans=[spans];spans.filter(Boolean).forEach((x,i)=>{const t=`__U${i}__`,p=s.indexOf(x);if(p>=0){s=s.slice(0,p)+t+s.slice(p+x.length);hits.push([t,x])}});s=esc(s);hits.forEach(([t,x])=>s=s.replace(t,`<span class="u">${esc(x)}</span>`));return s}function text(v,spans=[]){return norm(v).split('\n').map(x=>`<span class="line">${markedLine(x,spans)}</span>`).join('')}function spans(c){const a=[];if(c.underlined)a.push(c.underlined);if(Array.isArray(c.underlined_spans))a.push(...c.underlined_spans);return a}function block(title,v,u=[]){if(v==null||v==='')return'';return `<div class="context">${title?`<div class="context-title">${esc(title)}</div>`:''}${text(v,u)}</div>`}function arr(title,a){if(!Array.isArray(a)||!a.length)return'';return `<div class="context">${title?`<div class="context-title">${esc(title)}</div>`:''}<div class="items">${a.map(x=>`<div class="item">${Array.isArray(x)?x.map(y=>text(y)).join('<hr>'):text(x)}</div>`).join('')}</div></div>`}function obj(title,o,cls='segment'){if(!o||typeof o!=='object'||Array.isArray(o))return'';return `<div class="context"><div class="context-title">${esc(title)}</div><div class="${cls==='claim'?'claims':'segments'}">${Object.entries(o).map(([k,v])=>`<div class="${cls}"><b>${esc(k)}</b> ${text(v)}</div>`).join('')}</div></div>`}function ctx(q){const c=q.context||{},u=spans(c);let o='';if(c.passage)o+=block('',c.passage,u);if(c.passage_start)o+=block('',c.passage_start,u)+obj('A–D',c.segments)+block('',c.passage_end,u);if(c.source_passage)o+=block('원문',c.source_passage,u);if(c.rewritten)o+=block('바꿔 쓴 글',c.rewritten,u);if(c.dialogue)o+=block('대화',c.dialogue,u);if(c.dialogue_start)o+=block('',c.dialogue_start,u)+obj('A–D',c.segments)+block('',c.dialogue_end,u);if(c.dialogue_a)o+=block('대화 A',c.dialogue_a,u);if(c.dialogue_b)o+=block('대화 B',c.dialogue_b,u);if(c.dialogue1)o+=block('대화 1',c.dialogue1,u);if(c.dialogue2)o+=block('대화 2',c.dialogue2,u);if(c.given_sentence)o+=block('<보기>',c.given_sentence);if(c.bank)o+=Array.isArray(c.bank)?arr('<보기>',c.bank):typeof c.bank==='object'?obj('<보기>',c.bank):block('<보기>',c.bank);o+=arr('',c.items);o+=arr('',c.pairs);o+=arr('문제 단서',c.clues);o+=arr('',c.statements);o+=obj('설명',c.claims,'claim');if(c.table)o+=obj('표',c.table);if(c.definition)o+=block('정의',c.definition);if(c.korean)o+=block('우리말',c.korean);if(c.pattern)o+=block('형식',c.pattern);if(c.target)o+=block('대상',c.target);if(c.A)o+=block('(A)',c.A);if(c.B)o+=block('(B)',c.B);if(c.proposed_pairs)o+=arr('',c.proposed_pairs);return o}const shuffle=a=>[...a].sort(()=>Math.random()-.5);function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function isW(q){return q.content_status==='willena_published'}function sourceLabel(q){return isW(q)?'응용 문제':'유형별 문제'}function sourceNumber(q){return isW(q)?`W${q.metadata?.willena_question_number||q.source_question_number}`:`Q${q.source_question_number}`}function applyFilter(){questions=shuffle(bank.filter(q=>sourceFilter==='all'||(sourceFilter==='willena'&&isW(q))||(sourceFilter==='z'&&!isW(q))));index=0;score=0;wrongIds=[];selected=new Set();checked=false;const z=bank.filter(q=>!isW(q)).length,w=bank.filter(isW).length;heroSub.textContent=`${questions.length}문제 · 유형별 문제 ${z} · 응용 문제 ${w} · 이상한 문제는 🚩`;render()}function render(){if(!questions.length){card.innerHTML='<div class="empty">이 필터에 해당하는 문제가 없습니다.</div>';bar.style.width='0';return}if(index>=questions.length)return result();const q=questions[index];selected=new Set();checked=false;bar.style.width=`${index/questions.length*100}%`;const w=isW(q);card.innerHTML=`<div class="card-head"><div class="qnum">${index+1} / ${questions.length}</div><div style="display:flex;align-items:center;gap:4px"><span class="source ${w?'w':''}">${sourceLabel(q)} · ${sourceNumber(q)}</span><button class="flag" id="flagBtn">🚩</button></div></div><div class="body"><div class="prompt">${esc(q.prompt_text||'')}</div>${ctx(q)}<div class="choices">${(q.choices||[]).map((x,i)=>`<button class="choice" data-i="${i+1}"><span class="n">${['①','②','③','④','⑤','⑥'][i]||i+1}</span><span class="t">${text(typeof x==='string'?x:(x.text||JSON.stringify(x)))}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="explanation" id="explanation"></div><div class="actions"><button class="primary" id="check" disabled>정답 확인</button></div></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b,q));document.getElementById('check').onclick=()=>check(q);document.getElementById('flagBtn').onclick=openFlag}function choose(b,q){if(checked)return;const n=b.dataset.i;if(q.answer_mode==='multi_select'){selected.has(n)?selected.delete(n):selected.add(n);b.classList.toggle('selected')}else{selected=new Set([n]);card.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}document.getElementById('check').disabled=!selected.size}function same(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}function check(q){if(checked){index++;return render()}checked=true;const ans=(q.correct_answer||[]).map(String),mine=[...selected].map(String),ok=same(mine,ans);if(ok)score++;else wrongIds.push(q.id);window.WillenaTestPrepAuth?.recordAttempt({practice_type:section,question_id:q.id,selected_answer:mine,correct_answer:ans,is_correct:ok,source_question_number:q.source_question_number,question_type:q.question_type,source_label:q.student_source_label});card.querySelectorAll('.choice').forEach(b=>{const n=b.dataset.i;if(ans.includes(n))b.classList.add('correct');else if(selected.has(n))b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'정답입니다!':'정답: '+ans.join(', ')+'번';if(!ok&&q.metadata?.source_explanation_ko){const e=document.getElementById('explanation');e.innerHTML=`<strong>해설</strong>${text(q.metadata.source_explanation_ko)}`;e.classList.add('show')}const c=document.getElementById('check');c.disabled=false;c.textContent=index===questions.length-1?'결과 보기':'다음 문제'}function result(){window.WillenaTestPrepAuth?.completeSession(score,questions.length,wrongIds);bar.style.width='100%';const pct=Math.round(score/questions.length*100);card.innerHTML=`<div class="result"><div class="score">${score}/${questions.length}</div><h2>${pct>=80?'좋아요! 시험 준비가 잘 되고 있어요.':'틀린 문제를 한 번 더 보면 좋아요.'}</h2><p>정답률 ${pct}% · 틀린 문제 ${wrongIds.length}개</p><div class="actions"><button class="secondary" id="again">처음부터</button>${wrongIds.length?'<button class="primary" id="retry">틀린 문제 다시</button>':''}</div></div>`;document.getElementById('again').onclick=applyFilter;if(wrongIds.length)document.getElementById('retry').onclick=()=>{questions=shuffle(questions.filter(q=>wrongIds.includes(q.id)));index=0;score=0;wrongIds=[];render()}}function openFlag(){flagReason='';flagNote.value='';reasonsEl.innerHTML=flagReasons.map(r=>`<button class="reason">${r}</button>`).join('');reasonsEl.querySelectorAll('.reason').forEach(b=>b.onclick=()=>{flagReason=b.textContent;reasonsEl.querySelectorAll('.reason').forEach(x=>x.classList.toggle('on',x===b))});overlay.classList.add('open')}document.getElementById('cancelFlag').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.getElementById('sendFlag').onclick=async()=>{if(!flagReason)return toast('이유를 하나 골라 주세요');const q=questions[index],payload={question_id:q.id,reason:flagReason,note:flagNote.value.trim()||null,selected_answer:[...selected],correct_answer_snapshot:q.correct_answer||[],status:'open',metadata:{source_label:q.student_source_label,source_question_number:q.source_question_number,question_type:q.question_type,section,source_filter:sourceFilter,page:location.pathname}};try{const r=await fetch(`${U}/rest/v1/test_prep_question_flags`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw Error(await r.text());overlay.classList.remove('open');toast('신고했습니다. 고마워요!')}catch(e){console.error(e);toast('신고 저장에 실패했습니다')}};async function load(){card.innerHTML='<div class="loading">문제를 불러오는 중...</div>';heroTitle.textContent=section[0].toUpperCase()+section.slice(1)+' 시험 대비';const sel='id,source_question_number,source_page,question_type,prompt_text,context,choices,correct_answer,targets,answer_mode,context_type,difficulty,student_source_label,content_status,metadata';try{const aq=window.WillenaAssignedTestPrep?.questionQuery?.()||'';const r=await fetch(`${U}/rest/v1/test_prep_questions?select=${encodeURIComponent(sel)}&student_usable=eq.true&section=eq.${section}${aq}&order=source_question_number.asc`,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());bank=await r.json();applyFilter()}catch(e){card.innerHTML=`<div class="empty">문제를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=b.dataset.section;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{sourceFilter=b.dataset.source;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));applyFilter()});window.WillenaTestPrepAuth.ready.then(ok=>{if(ok)window.WillenaAssignedTestPrep.init();});
