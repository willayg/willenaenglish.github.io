<body>
<header class="student-header tp-v1-header">
  <div class="header-orb"></div>
  <div class="header-inner">
    <div class="header-profile">
      <div class="student-name" id="user">Student</div>
      <div class="header-counters" aria-label="Student rewards">
        <span class="header-pill header-points"><span class="header-symbol" aria-hidden="true">P</span><span id="headerPoints">—</span></span>
        <span class="header-pill header-stars"><span class="header-star" aria-hidden="true">★</span><span id="headerStars">—</span></span>
      </div>
    </div>
    <div class="header-brand">
      <div class="header-title">Willena Test Prep</div>
      <div class="profile-menu-wrap">
        <button class="header-avatar" id="studentAvatar" type="button" aria-label="Student menu" aria-expanded="false" aria-controls="studentProfileMenu">S</button>
        <div class="profile-menu" id="studentProfileMenu" hidden>
          <button class="profile-menu-item" id="studentProfileOpen" type="button"><span class="profile-menu-icon" aria-hidden="true">☺</span><span>Profile</span></button>
          <button class="profile-menu-item" id="studentDashboardOpen" type="button"><span class="profile-menu-icon" aria-hidden="true">⌂</span><span>Dashboard</span></button>
          <button class="profile-menu-item" id="studentBigTextToggle" type="button" aria-pressed="false"><span class="profile-menu-icon" aria-hidden="true">Aa</span><span id="studentBigTextLabel">큰 글자 꺼짐</span></button>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item" id="studentTestPrepA" type="button"><span class="profile-menu-icon" aria-hidden="true">A</span><span>Test Prep A</span></button>
          <button class="profile-menu-item" id="studentTestPrepB" type="button"><span class="profile-menu-icon" aria-hidden="true">B</span><span>Test Prep B</span></button>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item profile-logout" id="studentLogout" type="button"><span class="profile-menu-icon" aria-hidden="true">↪</span><span>Log out</span></button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-curve"></div>
</header>
<div class="app">
  <main class="screen" id="screen"><div class="loading">Loading…</div></main>

import {QuestionRenderer} from './question-renderer.js?v=2.20.6';
import {trackingState} from './tracking-client.js?v=2.17a';
import {currentRoute} from './navigation.js?v=2.21.3';
import {installWillenaKeyboard} from '../shared/willena-keyboard.js?v=1.5.0';
import {installQuestionFlags} from '../shared/question-flags.js?v=1.0.0';
installWillenaKeyboard({submitSelector:'#bottom button.primary,.vp-next'});
installQuestionFlags({Renderer:QuestionRenderer,contextProvider:()=>{const t=trackingState(),r=currentRoute?.()||{};return{studentId:t.user?.id||null,planId:r.planId||t.plan?.id||null,lesson:r.lesson||t.lesson||null,practiceType:r.practice||t.practice||null,reviewMode:r.view==='review',appRevision:'2.25.96'};}});
</script>
