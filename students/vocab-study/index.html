<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Willena Vocabulary Study</title>
<link rel="icon" href="/Assets/Images/Logo.png?v=20260730-3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/students/study/study.css?v=20260808-7">
<link rel="stylesheet" href="/students/study/study-overrides.css?v=20260808-1">
<link rel="stylesheet" href="/students/study-v2/v2.css?v=20260814-daily1">
<link rel="stylesheet" href="/students/shared/willena-keyboard-safe.css?v=1.0.0">
<link rel="stylesheet" href="./vocab-study.css?v=20260926-v0099">
<link rel="stylesheet" href="./theme-pips.css?v=20260927-v0004">
<script src="/students/api-gateway.js?v=20260926-progress-summary-cf1"></script>
<script src="/students/study/study-progress.js?v=20260926-assignment-canonical1"></script>
<script src="/js/api-config.js?v=20260926-reverted-auth1"></script>
<script src="./auth-guard.js?v=20260925-v0004"></script>
<script type="module" src="/students/components/student-header.js?v=20260926-pointfeedback1"></script>
<script type="module" src="/students/components/student-reward-celebration.js?v=20260926-v0005"></script>
</head>
<body>
<div class="study-app">
  <student-header title="단어 지니어스" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
  <div id="vocabThemeDock" class="vocab-theme-dock" role="group" aria-label="색상 테마">
    <button type="button" class="vocab-theme-pip" data-theme="cyan" aria-label="Cyan 테마" title="Cyan" aria-pressed="false"></button>
    <button type="button" class="vocab-theme-pip" data-theme="sunbeam" aria-label="Sunbeam 테마" title="Sunbeam" aria-pressed="false"></button>
    <button type="button" class="vocab-theme-pip" data-theme="pink" aria-label="Pink 테마" title="Pink" aria-pressed="false"></button>
    <button type="button" class="vocab-theme-pip" data-theme="paper" aria-label="Paper 테마" title="Paper" aria-pressed="false"></button>
    <button type="button" class="vocab-theme-pip" data-theme="dark" aria-label="Dark 테마" title="Dark" aria-pressed="false"></button>
    <button type="button" class="vocab-theme-pip" data-theme="cyberpunk" aria-label="Cyberpunk 테마" title="Cyberpunk" aria-pressed="false"></button>
  </div>

  <main class="vocab-page">
    <section id="vocabStartupError" hidden role="alert" style="padding:20px;margin-bottom:16px;border:3px solid #efb7d4;border-radius:20px;background:#fff;color:#214951">
      <strong>앱을 불러오지 못했어요.</strong>
      <p data-startup-message style="overflow-wrap:anywhere"></p>
      <button type="button" onclick="location.reload()">다시 불러오기</button>
    </section>
    <section id="vocabFrontMenu" class="vocab-front-menu">
      <section id="vocabAdminPicker" class="vocab-admin" hidden>
        <span class="eyebrow">ADMIN PREVIEW</span>
        <select id="vocabAdminBookSelect" aria-label="Choose book">
          <option value="">Choose a book…</option>
        </select>
      </section>

      <button id="vocabFrontWordTestCard" class="vocab-front-wordtest" type="button" hidden>
        <span class="vocab-front-card-main">          <span class="vocab-front-card-copy">
              <strong>워드 테스트 연습</strong>
            <small id="vocabFrontWordTestMeta"></small>
          </span>
        </span>
        <span class="vocab-front-wordtest-side">
          <span id="vocabFrontWordTestRing" class="vocab-front-progress-ring" style="--progress:0" aria-label="0% 완료"><span>0%</span></span>
          <span class="vocab-front-arrow" aria-hidden="true">›</span>
        </span>
      </button>

      <div class="vocab-front-divider" aria-hidden="true"></div>

      <section class="vocab-front-books" aria-label="Your books">
        <div class="vocab-front-section-head">
          <div><span class="eyebrow">내 교재</span><strong>교재를 선택하세요</strong></div>
        </div>
        <div id="vocabFrontBookList" class="vocab-front-book-list"></div>
      </section>

      <section id="vocabFrontAchievements" class="vocab-front-achievements" hidden aria-label="Vocabulary achievements">
        <div class="vocab-front-achievement">
          <img src="/shared/svgs/streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabFrontStreakCurrent">0</strong><small>day streak</small></div>
        </div>
        <div class="vocab-front-achievement">
          <img src="/shared/svgs/best-streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabFrontStreakBest">0</strong><small>best streak</small></div>
        </div>
        <div class="vocab-front-achievement vocab-front-achievement-gold">
          <img src="/shared/svgs/golden-unit.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabFrontGoldenCount">0</strong><small>gold units</small></div>
        </div>
      </section>
    </section>

    <section id="vocabBookScreen" class="vocab-home-card vocab-subscreen" hidden>
      <div class="vocab-subscreen-head">
        <button id="vocabBookBack" class="vocab-screen-back" type="button">← 홈</button>
        <span>교재 공부</span>
      </div>

      <section id="vocabBookPicker" class="vocab-book-picker" hidden>
        <div id="vocabBookChoices" class="vocab-book-choices" role="group" aria-label="Choose assigned book"></div>
      </section>

      <div class="study-v2-units vocab-unit-selector">
        <div id="vocabUnitStrip" class="study-v2-unit-strip" aria-label="Vocabulary units"></div>
      </div>

      <div class="vocab-unit-summary">
        <h2 id="vocabUnitTitle">Loading…</h2>
        <button class="vocab-word-card" id="vocabWordListOpen" type="button" disabled>
          <span id="vocabItemCount">—</span>
        </button>
      </div>

      <section class="vocab-skill-grid" aria-label="Unit skills">
        <button id="vocabStudyStart" class="vocab-skill-card vocab-skill-quiz" type="button" disabled>
          <span class="vocab-skill-ring" style="--progress:0"><span>—</span></span>
          <span class="vocab-skill-copy">
            <small class="vocab-skill-step">STEP 1</small>
            <strong>퀴즈</strong>
            <span id="vocabQuizStars" class="vocab-card-stars" aria-label="0 out of 5 stars">★ 0/5</span>
          </span>
        </button>

        <button id="vocabSpellingPreview" class="vocab-skill-card vocab-skill-spelling" type="button" disabled>
          <span class="vocab-skill-ring" style="--progress:0"><span>—</span></span>
          <span class="vocab-skill-copy">
            <small class="vocab-skill-step">STEP 2</small>
            <strong>철자</strong>
            <span id="vocabSpellingStars" class="vocab-card-stars" aria-label="0 out of 5 stars">★ 0/5</span>
          </span>
        </button>

        <button id="vocabPronunciationStart" class="vocab-skill-card vocab-skill-pronunciation" type="button" disabled>
          <span class="vocab-skill-ring" style="--progress:0"><span>—</span></span>
          <span class="vocab-skill-copy">
            <small class="vocab-skill-step">STEP 3</small>
            <strong>말하기</strong>
            <span id="vocabSpeakingStars" class="vocab-card-stars" aria-label="0 out of 5 stars">★ 0/5</span>
          </span>
        </button>
      </section>

      <section id="vocabMotivation" class="vocab-motivation vocab-achievements" hidden aria-label="Vocabulary achievements">
        <div class="vocab-motivation-stat">
          <img class="vocab-motivation-icon" src="/shared/svgs/streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabStreakCurrent">0</strong><small>day streak</small></div>
        </div>
        <div class="vocab-motivation-stat">
          <img class="vocab-motivation-icon" src="/shared/svgs/best-streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabStreakBest">0</strong><small>best streak</small></div>
        </div>
        <div class="vocab-motivation-stat vocab-motivation-gold">
          <img class="vocab-motivation-icon" src="/shared/svgs/golden-unit.svg?v=20260927-icons1" alt="" aria-hidden="true">
          <div><strong id="vocabGoldenCount">0</strong><small>gold units</small></div>
        </div>
      </section>
    </section>

    <section id="vocabWordTestScreen" class="vocab-home-card vocab-subscreen" hidden>
      <div class="vocab-subscreen-head">
        <button id="vocabWordTestBack" class="vocab-screen-back" type="button">← 홈</button>
        <span>워드 테스트 연습</span>
      </div>

      <section id="vocabTeacherPractice" class="vocab-teacher-practice" hidden aria-label="Word Test Study">
        <div id="vocabTeacherPracticeList" class="vocab-teacher-practice-list"></div>
      </section>

      <section id="vocabWordTestEmpty" class="vocab-wordtest-empty" hidden>
        <strong>진행 중인 단어 시험이 없어요</strong>
        <span>지난 단어 시험은 아래에서 다시 볼 수 있어요.</span>
      </section>

      <section class="vocab-old-tests">
        <button id="vocabOldTestsOpen" class="vocab-old-tests-card" type="button">
          <span class="vocab-front-card-main">            <span>
            <span class="eyebrow">복습</span>
            <strong>지난 단어 시험</strong>
            <small id="vocabOldTestsMeta">교재별로 지난 시험 복습하기</small>
            </span>
          </span>
          <span class="vocab-front-arrow" aria-hidden="true">›</span>
        </button>
        <div id="vocabOldTestsPanel" class="vocab-old-tests-panel" hidden>
          <div id="vocabOldTestsBooks" class="vocab-old-tests-books"></div>
          <div id="vocabOldTestsList" class="vocab-old-tests-list"></div>
        </div>
      </section>
    </section>

    <div class="vocab-version">v0.111</div>
  </main>

  <section id="vocabLoading" class="vocab-loading" hidden aria-hidden="true" aria-live="polite">
    <div class="vocab-loading-card">
      <div class="vocab-loading-logo" aria-hidden="true"></div>
      <div class="vocab-loading-sweep" aria-hidden="true"></div>
      <strong id="vocabLoadingText">불러오는 중...</strong>
    </div>
  </section>

  <section id="vocabWordModal" class="vocab-word-modal" hidden aria-hidden="true">
    <div class="vocab-word-modal-card" role="dialog" aria-modal="true" aria-labelledby="vocabWordModalTitle">
      <div class="vocab-word-modal-head">
        <div>
          <strong id="vocabWordModalTitle">단어 목록</strong>
          <small id="vocabWordModalMeta"></small>
        </div>
        <button id="vocabWordModalClose" class="vocab-word-modal-close" type="button" aria-label="닫기">×</button>
      </div>
      <div id="vocabWordModalList" class="vocab-word-modal-list"></div>
    </div>
  </section>

  <section id="vocabStudySession" class="vocab-session" hidden>
    <header class="vocab-session-top">
      <div class="vocab-session-topline">
        <button id="vocabStudyClose" class="vocab-back" type="button" aria-label="뒤로">←</button>
        <div class="vocab-progress-copy">
          <strong id="vocabStudyTitle">단어 공부</strong>
          <small id="vocabStudyProgress">1 / 12</small>
        </div>
        <span aria-hidden="true"></span>
      </div>
      <div class="vocab-progress-track"><div id="vocabProgressFill" class="vocab-progress-fill"></div></div>
    </header>

    <main id="vocabSessionMain" class="vocab-session-main" data-willena-keyboard-safe>
      <div id="vocabQuestionStage" class="vocab-question-wrap">
        <div id="vocabInstruction" class="vocab-instruction"></div>
        <div id="vocabActivityRoot"></div>
        <div id="vocabAnswerNote" class="vocab-answer-note" hidden></div>
      </div>
    </main>

    <footer id="vocabSessionBottom" class="vocab-session-bottom">
      <div class="vocab-action-row">
        <button id="vocabSpeakingSkip" class="vocab-skip-action" type="button" hidden>Skip</button>
        <button id="vocabStudyAction" class="vocab-action" type="button" disabled>Check Answer</button>
      </div>
    </footer>
  </section>
</div>

<script src="/students/study/study-question-bank.js?v=20260822-conversationfix1"></script>
<script type="module" src="./theme-pips.js?v=20260927-v0001"></script>
<script type="module">
import('./vocab-study.js?v=20260927-v0108').catch(error=>{
  console.error('[Vocab Study] module load',error);
  const panel=document.getElementById('vocabStartupError');
  if(panel){panel.hidden=false;panel.querySelector('[data-startup-message]').textContent=error?.message||'Please refresh and try again.';}
  const loader=document.getElementById('vocabLoading');
  if(loader){loader.hidden=true;loader.setAttribute('aria-hidden','true');}
});
</script>
</body>
</html>
