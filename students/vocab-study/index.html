<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Willena Vocabulary Study</title>
<link rel="icon" href="/Assets/Images/Logo.png?v=20260730-3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Shared Study family styles. -->
<link rel="stylesheet" href="/students/study/study.css?v=20260808-7">
<link rel="stylesheet" href="/students/study/study-overrides.css?v=20260808-1">
<link rel="stylesheet" href="/students/study-v2/v2.css?v=20260814-daily1">
<link rel="stylesheet" href="/students/study-v2/v2-background.css?v=20260817-railrestore1">
<link rel="stylesheet" href="/students/study-v2/v2-activity-ux.css?v=20260822-tabletcompact2">

<script src="/students/api-gateway.js?v=20260808-study1"></script>
<script src="/js/api-config.js?v=20260113c"></script>
<script src="./auth-guard.js?v=20260923-p1"></script>
<script type="module" src="/students/components/student-header.js?v=20260814-studyv2header2"></script>
</head>
<body>
<div class="study-app">
  <student-header
    title="Vocabulary Study"
    show-id="false"
    show-home="true"
    home-href="/students/"
    home-label="Home"
    show-points="true"
    show-logout="true">
  </student-header>

  <main class="dashboard" id="app">
    <section class="book-hero">
      <div class="hero-copy">
        <span class="eyebrow">VOCABULARY STUDY</span>
        <h1>단어 공부</h1>
        <p class="section-note" id="vocabStudyStatus">불러오는 중...</p>
      </div>
    </section>

    <section id="vocabAdminPicker" class="unit-progress-card" hidden>
      <span class="eyebrow">ADMIN PREVIEW</span>
      <h2>Book override</h2>
      <p class="section-note">Choose any published/review book for Vocabulary Study testing.</p>
      <select id="vocabAdminBookSelect" class="activity-input" aria-label="Choose book">
        <option value="">Choose a book…</option>
      </select>
    </section>

    <section id="vocabStudyHome" class="unit-progress-card">
      <span class="eyebrow">CURRENT BOOK</span>
      <h2 id="vocabBookTitle">Loading…</h2>
      <p id="vocabUnitTitle">Finding your assigned unit</p>
      <p class="section-note" id="vocabItemCount"></p>
      <button id="vocabStudyStart" class="primary-button" type="button" disabled>시작</button>
    </section>

    <section id="vocabStudySession" class="practice-panel" hidden>
      <div class="practice-toolbar">
        <button id="vocabStudyClose" class="ghost-button" type="button">← 뒤로</button>
        <div>
          <span class="eyebrow">VOCABULARY</span>
          <h2 id="vocabStudyTitle">단어 공부</h2>
          <small id="vocabStudyProgress" class="section-note"></small>
        </div>
      </div>
      <div id="vocabActivityRoot"></div>
      <button id="vocabStudyNext" class="primary-button" type="button" hidden>다음</button>
    </section>
  </main>
</div>

<script src="/shared/learning-engine/activity-schema.js?v=20260816-sharedengine1"></script>
<script src="/shared/learning-engine/scoring.js?v=20260810-chunkspelling1"></script>
<script src="/shared/learning-engine/engine.js?v=20260816-sharedengine1"></script>
<script src="/students/study/study-question-bank.js?v=20260822-conversationfix1"></script>

<script src="./vocab-study.js?v=20260923-adminpreview-rolefix1"></script>
</body>
</html>
