<style id="bf-demo-styles">
/* Demo only: normal app styles, progress and recording workflow remain shared. */
#ftCharacter {visibility:hidden!important;position:absolute!important;pointer-events:none!important}
#ftTurnCircle {overflow:visible!important;isolation:isolate}
#ftTurnCircle .ft-orbit-visual,#ftTurnCircle .ft-circle-ai,#ftTurnCircle .ft-circle-mic,#ftTurnCircle .ft-circle-thinking {opacity:0!important}
#ftTurnCircle .bf-actor {position:absolute;z-index:3;top:50%;left:50%;width:clamp(185px,28vw,245px);height:clamp(185px,28vw,245px);transform:translate(-50%,-50%);pointer-events:none;display:block}
.bf-svg {width:100%;height:100%;overflow:visible}
.bf-svg g{transform-box:view-box}
.bf-ear-left{transform-origin:158px 254px;animation:bfEarLeft 5.3s ease-in-out infinite}
.bf-ear-right{transform-origin:456px 260px;animation:bfEarRight 6.1s ease-in-out infinite}
.bf-tail{transform-origin:515px 715px;animation:bfTail 3.6s ease-in-out infinite}
.bf-body{transform-origin:342px 743px;animation:bfBreathe 3.25s ease-in-out infinite}
.bf-head{transform-origin:301px 478px;animation:bfHead 5s ease-in-out infinite}
.bf-eyes{transform-origin:300px 330px;animation:bfBlink 5.2s infinite}
.bf-talk-mouth {opacity:0}.bf-blush{opacity:0;transition:opacity .2s}
@keyframes bfEarLeft {0%,77%,100%{transform:rotate(0)}81%{transform:rotate(-7deg)}86%{transform:rotate(3deg)}}
@keyframes bfEarRight {0%,73%,100%{transform:rotate(0)}78%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}
@keyframes bfTail{0%,100%{transform:rotate(-2deg)}45%{transform:rotate(5deg)}73%{transform:rotate(-5deg)}}
@keyframes bfBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.013,.989)}}
@keyframes bfHead{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg) translateY(-3px)}}
@keyframes bfBlink{0%,27%,29%,74%,76%,100%{transform:scaleY(1)}28%,75%{transform:scaleY(.07)}}
@keyframes bfListen{0%,100%{transform:rotate(-8deg) translate(-3px,-6px)}50%{transform:rotate(-5deg) translate(1px,-4px)}}
@keyframes bfThink{0%,100%{transform:rotate(9deg) translateY(-2px)}50%{transform:rotate(11deg) translateY(1px)}}
@keyframes bfJump{0%,100%{transform:translateY(0)}30%{transform:translateY(-25px)}55%{transform:translateY(0)}75%{transform:translateY(-12px)}}
@keyframes bfTalk{0%,100%{transform:scaleY(.3)}25%{transform:scaleY(1.5)}55%{transform:scaleY(.5)}80%{transform:scaleY(1.8)}}
.bf-actor[data-state="listening"] .bf-head{animation:bfListen 2.1s ease-in-out infinite}
.bf-actor[data-state="thinking"] .bf-head{animation:bfThink 2.6s ease-in-out infinite}
.bf-actor[data-state="speaking"] .bf-talk-mouth{opacity:1}
.bf-actor[data-state="speaking"] .bf-rest-mouth{opacity:0}
.bf-actor[data-state="speaking"] .bf-talk-mouth ellipse{transform-box:fill-box;transform-origin:center;animation:bfTalk .5s infinite}
.bf-actor[data-state="celebrating"] .bf-svg{animation:bfJump 1.1s}
.bf-actor[data-state="celebrating"] .bf-blush{opacity:.7}
.bf-demo-ribbon{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff4fa;border:2px solid #f5c0df;border-radius:16px;color:#8d316c;padding:10px 16px;margin:8px 0 16px;font-weight:800}
.bf-demo-ribbon small{font-size:12px;font-weight:500}
@media(max-width:600px){#ftTurnCircle .bf-actor{width:185px;height:185px}.bf-demo-ribbon{font-size:13px}}
@media(prefers-reduced-motion:reduce){.bf-svg *{animation:none!important}}

/* V2: remove legacy orbit/countdown/score overlays from Bunny's face. */
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-glow,
.free-talking-genius #ftSession #ftTurnCircle .ft-orbit-visual,
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-start,
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-ai,
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-mic,
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-thinking,
.free-talking-genius #ftSession #ftTurnCircle .ft-circle-score,
.free-talking-genius #ftSession #ftTurnCircle .ft-record-countdown {display:none!important;visibility:hidden!important;opacity:0!important}
.free-talking-genius #ftSession #ftTurnCircle{
  background:transparent!important;background-image:none!important;border:0!important;
  box-shadow:none!important;outline-offset:7px;overflow:visible!important;
  width:clamp(205px,35vw,255px);height:clamp(205px,35vw,255px);
  animation:none!important;touch-action:manipulation;
}
.free-talking-genius #ftSession #ftTurnCircle[data-phase]{
  background:transparent!important;background-image:none!important;
  border:0!important;box-shadow:none!important;animation:none!important;
}
.free-talking-genius #ftSession #ftTurnCircle .bf-actor{
  width:100%!important;height:100%!important;z-index:10!important;
}
.free-talking-genius #ftSession #ftTurnCircle[data-phase="student"][data-listening="false"] .bf-actor{
  filter:drop-shadow(0 0 11px #f8a9d5);
}
.free-talking-genius #ftSession #ftTurnCircle[data-phase="student"][data-listening="false"]{
  cursor:pointer;
}
.bf-tap-guide {
  border:0;display:flex;align-items:center;justify-content:center;gap:8px;
  margin:12px auto 0;padding:12px 20px;border-radius:999px;
  font:800 16px/1.25 Poppins,sans-serif;background:#fce1f1;color:#a51e72;
  box-shadow:0 4px 0 #efb5d4;max-width:min(94%,330px);
  transition:background .18s,transform .18s;cursor:pointer;touch-action:manipulation;
}
.bf-tap-guide[hidden]{display:none!important}
.bf-tap-guide[data-kind="recording"]{background:#dbf9f6;color:#087e87;box-shadow:0 4px 0 #a8e9e6}
.bf-tap-guide[data-kind="thinking"]{background:#f1eaff;color:#6856a9;box-shadow:none;cursor:default}
.bf-tap-guide[data-kind="ai"]{background:#edf9fa;color:#47828a;box-shadow:none;cursor:default}
.bf-tap-guide[data-kind="ready"]{background:#e4f8fb;color:#197b87}
.bf-tap-guide[data-kind="feedback"]{background:#fff6d6;color:#977113;box-shadow:none}
.bf-tap-guide[data-kind="student"]{animation:bfCall 1.7s ease-in-out infinite}
@keyframes bfCall{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@media(max-width:600px){
 .free-talking-genius #ftSession #ftTurnCircle{width:220px!important;height:220px!important}
 .bf-tap-guide{font-size:15px;padding:11px 18px}
}


/* Bunny demo buttons: clean white fill with pink/cyan outlines. */
.free-talking-genius #ftBook button:not(.vocab-theme-pip),
.free-talking-genius #ftSession button:not(#ftTurnCircle):not(.vocab-theme-pip),
.free-talking-genius #ftFinish button:not(.vocab-theme-pip),
.free-talking-genius .bf-tap-guide {
  background:#fff!important;background-image:none!important;
  border:2px solid #b9e9ed!important;color:#20525a!important;
  box-shadow:none!important;
}
.free-talking-genius #ftBook button:is(.is-active,.active,[aria-selected="true"],[aria-pressed="true"]),
.free-talking-genius #ftSession button:is(.is-active,.active,[aria-pressed="true"]),
.free-talking-genius .bf-tap-guide[data-kind="student"],
.free-talking-genius .bf-tap-guide[data-kind="recording"] {
  background:#fff!important;border-color:#f09ccc!important;color:#a42a76!important;
}
.free-talking-genius #ftBook button:disabled,
.free-talking-genius #ftSession button:disabled:not(#ftTurnCircle),
.free-talking-genius #ftFinish button:disabled {
  background:#fff!important;border-color:#d4e9eb!important;color:#98aeb1!important;
}
.free-talking-genius .bf-tap-guide {border-radius:999px!important}
.free-talking-genius #ftSession button:not(#ftTurnCircle):focus-visible,
.free-talking-genius #ftBook button:focus-visible {
  outline:3px solid #f09ccc;outline-offset:2px;
}


/* Bunny only: soft cyan silhouette glow, no circular recording ring. */
.free-talking-genius #ftSession #ftTurnCircle .bf-actor {
  filter:drop-shadow(0 0 8px rgba(108,229,240,.65)) drop-shadow(0 0 18px rgba(151,244,249,.48))!important;
  transition:filter .24s ease;
}
.free-talking-genius #ftSession #ftTurnCircle[data-phase="student"] .bf-actor,
.free-talking-genius #ftSession #ftTurnCircle[data-listening="true"] .bf-actor {
  filter:drop-shadow(0 0 10px rgba(92,227,238,.85)) drop-shadow(0 0 23px rgba(137,241,248,.65))!important;
}


/* Character switcher, scoped exclusively to this demo page. */
.pf-choice {display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px auto 13px}
.pf-choice button {appearance:none;min-width:105px;border:2px solid #b4e7ed!important;background:#fff!important;color:#315b62!important;border-radius:999px!important;padding:10px 17px!important;font:800 14px Poppins,sans-serif;cursor:pointer}
.pf-choice button[aria-pressed="true"] {border-color:#ef8fc1!important;color:#bb247e!important;background:#fff!important}
.pf-choice button:focus-visible{outline:3px solid #7ad4df;outline-offset:3px}
.pf-svg{overflow:visible}
.pf-svg .pf-tail{transform-origin:808px 554px;animation:pfWag 2.7s ease-in-out infinite}
.pf-svg .pf-fins{transform-origin:490px 200px;animation:pfFin 3.4s ease-in-out infinite}
.pf-svg .pf-front-fin{transform-origin:591px 622px;animation:pfFin 1.55s ease-in-out infinite}
.pf-svg .pf-float{animation:pfSwim 3.4s ease-in-out infinite}
.pf-svg .pf-eyes{transform-origin:215px 397px;animation:pfBlink 5.4s infinite}
.pf-svg .pf-talk-mouth {opacity:0}
.pf-svg .pf-rest-mouth{opacity:1}
.bf-actor[data-state="speaking"] .pf-svg .pf-talk-mouth{opacity:1}
.bf-actor[data-state="speaking"] .pf-svg .pf-rest-mouth{opacity:0}
.bf-actor[data-state="speaking"] .pf-svg .pf-talk-mouth{transform-origin:175px 649px;animation:pfTalk .35s ease-in-out infinite}
.bf-actor[data-state="listening"] .pf-svg .pf-float{animation:pfListen 2.1s ease-in-out infinite}
.bf-actor[data-state="thinking"] .pf-svg .pf-float{animation:pfThink 2.5s ease-in-out infinite}
.bf-actor[data-state="celebrating"] .pf-svg{animation:pfCelebrate 1.1s ease-in-out}
@keyframes pfSwim{0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes pfWag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes pfFin{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
@keyframes pfBlink{0%,33%,35%,82%,84%,100%{transform:scaleY(1)}34%,83%{transform:scaleY(.08)}}
@keyframes pfTalk{0%,100%{transform:scaleY(.45)}42%{transform:scaleY(1.4)}72%{transform:scaleY(.7)}}
@keyframes pfListen{0%,100%{transform:rotate(-5deg) translateY(-4px)}50%{transform:rotate(-2deg) translateY(1px)}}
@keyframes pfThink{0%,100%{transform:rotate(3deg)}50%{transform:rotate(7deg) translateY(-4px)}}
@keyframes pfCelebrate{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-20px) rotate(-7deg)}65%{transform:translateY(-7px) rotate(7deg)}}
@media(prefers-reduced-motion:reduce){.pf-svg *{animation:none!important}}

</style></head><body>

<script id="bf-demo-controller">
/* Separate Bunny demo page. No app.js / shared CSS / API / scoring code is modified. */

        sound.__bfQuietDone=true;
        window.BunnyFox?.setState('idle');

      };
      sound.addEventListener('playing',start,{once:true});
      sound.addEventListener('ended',finish,{once:true});
      sound.addEventListener('error',finish,{once:true});

    }
    return nativePlay.apply(this,args);

73 501 L190 490 Q188 515 200 534 L213 516 Q230 537 251 551 Q272 577 301 595 Q328 579 354 560 Q375 549 393 516 L414 533 Q424 513 418 487 L439 503\"/><path d=\"M494 401 Q510 397 519 407\" fill=\"none\" stroke=\"#211a15\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n<g class=\"bf-eyes\" fill=\"#1c1511\"><ellipse cx=\"218\" cy=\"330\" rx=\"39\" ry=\"47\"/><ellipse cx=\"388\" cy=\"332\" rx=\"39\" ry=\"47\"/><circle fill=\"white\" cx=\"231\" cy=\"315\" r=\"12\"/><circle fill=\"white\" cx=\"401\" cy=\"316\" r=\"12\"/></g><path d=\"M275 369 Q290 361 313 366 Q331 368 326 378 L302 400 L278 382 Q271 376 275 369Z\" fill=\"#f398b0\" stroke=\"#211a15\" stroke-width=\"7\" stroke-linejoin=\"round\"/><path class=\"bf-rest-mouth\" d=\"M301 401 V422 M301 422 C288 435 270 432 260 416 M301 422 C318 435 334 430 343 416\" fill=\"none\" stroke=\"#211a15\" stroke-width=\"7\" stroke-linecap=\"round\"/><g class=\"bf-talk-mouth\"><ellipse cx=\"301\" cy=\"426\" rx=\"16\" ry=\"12\" fill=\"#4c2631\" stroke=\"#211a15\" stroke-width=\"5\"/><ellipse cx=\"301\" cy=\"434\" rx=\"10\" ry=\"4\" fill=\"#f49caf\"/></g><g class=\"bf-blush\" fill=\"#ffa5b8\"><ellipse cx=\"166\" cy=\"392\" rx=\"21\" ry=\"10\"/><ellipse cx=\"446\" cy=\"392\" rx=\"21\" ry=\"10\"/></g></g></svg>";
    circle.appendChild(actor);
    const bunnyArt=actor.innerHTML;
    const pigArt="<svg class=\"bf-svg pf-svg\" viewBox=\"0 0 1024 1024\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<defs><linearGradient id=\"pigBody\" x1=\"0\" y1=\"0\" x2=\".5\" y2=\"1\"><stop stop-color=\"#ff89a0\"/><stop offset=\"1\" stop-color=\"#ed5982\"/></linearGradient><linearGradient id=\"pigBelly\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop stop-color=\"#ffced6\"/><stop offset=\"1\" stop-color=\"#ffb7c6\"/></linearGradient></defs>\n<g class=\"pf-tail\" stroke=\"#211715\" stroke-width=\"13\" stroke-linejoin=\"round\"><path fill=\"#f47797\" d=\"M786 486 C859 426 897 328 995 327 C1018 327 999 407 974 453 Q955 501 908 547 C954 599 990 673 1000 740 C1004 779 959 742 932 721 C885 691 862 651 842 614 C818 639 811 650 788 654Z\"/></g>\n<g class=\"pf-fins\" stroke=\"#211715\" stroke-width=\"13\" stroke-linejoin=\"round\"><path fill=\"#f87798\" d=\"M392 164 Q487 51 616 33 Q657 23 626 93 L577 225Z\"/><path fill=\"#f47799\" d=\"M159 256 Q104 176 89 161 C43 120 71 226 98 337Z\"/><path fill=\"#ee648b\" d=\"M440 823 Q504 916 570 940 C643 972 660 939 638 914 L574 833Z\"/></g>\n<g class=\"pf-float\"><g class=\"pf-body\" stroke=\"#211715\" stroke-width=\"13\" stroke-linejoin=\"round\"><path fill=\"url(#pigBody)\" d=\"M160 225 C242 129 385 116 505 149 C626 180 700 247 751 335 C802 426 818 466 870 478 C885 528 855 579 819 641 C749 771 655 866 531 884 C385 909 227 850 128 744 C39 650 0 514 37 379 C51 323 93 267 160 225Z\"/><path fill=\"url(#pigBelly)\" stroke=\"none\" d=\"M45 572 C130 584 209 635 315 709 C419 780 533 793 641 763 C720 742 767 705 806 663 C744 778 653 861 532 883 C388 905 226 846 128 744 C81 693 54 636 45 572Z\"/><path fill=\"#e94878\" stroke=\"none\" d=\"M345 775 C474 797 587 794 708 735 C674 769 640 785 606 795 C510 820 412 804 345 775Z\"/></g>\n<g class=\"pf-front-fin\" fill=\"#f46f93\" stroke=\"#211715\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M584 568 C641 586 664 621 667 651 Q666 689 627 683 C581 677 537 652 521 614\"/></g>\n<g class=\"pf-head\">\n<g class=\"pf-eyes\" stroke=\"#211715\" stroke-width=\"12\">\n<ellipse cx=\"107\" cy=\"385\" rx=\"66\" ry=\"88\" fill=\"#fffdf9\" transform=\"rotate(9 107 385)\"/><ellipse cx=\"108\" cy=\"393\" rx=\"42\" ry=\"60\" fill=\"#1a1111\"/><circle cx=\"126\" cy=\"363\" r=\"15\" fill=\"white\" stroke=\"none\"/>\n<ellipse cx=\"309\" cy=\"398\" rx=\"70\" ry=\"89\" fill=\"#fffdf9\" transform=\"rotate(6 309 398)\"/><ellipse cx=\"319\" cy=\"412\" rx=\"43\" ry=\"59\" fill=\"#1a1111\"/><circle cx=\"342\" cy=\"378\" r=\"14\" fill=\"white\" stroke=\"none\"/>\n</g>\n<g class=\"pf-mouth-at-snout\"><path class=\"pf-rest-mouth\" d=\"M135 638 Q176 678 220 637\" fill=\"none\" stroke=\"#211715\" stroke-width=\"12\" stroke-linecap=\"round\"/><g class=\"pf-talk-mouth\"><ellipse cx=\"175\" cy=\"649\" rx=\"42\" ry=\"30\" fill=\"#96304f\" stroke=\"#211715\" stroke-width=\"10\"/><path d=\"M150 658 Q174 671 198 658\" fill=\"none\" stroke=\"#ffb8c8\" stroke-width=\"9\" stroke-linecap=\"round\"/></g></g>\n<g class=\"pf-snout\" stroke=\"#211715\" stroke-width=\"12\" stroke-linejoin=\"round\"><path fill=\"#ffabba\" d=\"M55 468 C101 437 194 434 254 465 C307 495 314 562 286 604 C260 643 211 651 167 631 C113 639 65 628 46 591 C21 548 23 493 55 468Z\"/><ellipse fill=\"#211715\" stroke=\"none\" cx=\"101\" cy=\"547\" rx=\"24\" ry=\"34\"/><ellipse fill=\"#211715\" stroke=\"none\" cx=\"208\" cy=\"557\" rx=\"24\" ry=\"34\"/></g>\n<path class=\"pf-eyebrow\" d=\"M367 224 C402 184 435 188 458 228 C474 260 460 298 443 324 C425 306 414 290 394 281\" fill=\"none\" stroke=\"#211715\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n\n</g></g></svg>";
    let activeCharacter='bunny';
    const charName=()=>activeCharacter==='pigfish'?'Pigfish':'Bunny Fox';
    function applyCharacter(name){
      activeCharacter=name==='pigfish'?'pigfish':'bunny';
      const oldState=actor.dataset.state;
      actor.innerHTML=activeCharacter==='pigfish'?pigArt:bunnyArt;
      actor.dataset.state=oldState;
      document.querySelectorAll('.pf-choice button').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.character===activeCharacter)));
      const title=document.querySelector('.bf-demo-ribbon span');
      if(title)title.textContent=charName()+' · DEMO';
      const guide=document.querySelector('.bf-tap-guide');
      if(guide){guide.dispatchEvent(new Event('bf:character-changed'))}
      try{localStorage.setItem('willena-ftg-demo-character',activeCharacter)}catch(_){}
      window.dispatchEvent(new CustomEvent('ft-demo-character',{detail:{character:activeCharacter}}));
    }
    function makeChooser(){
      const wrap=document.createElement('div');
      wrap.className='pf-choice';wrap.setAttribute('role','group');wrap.setAttribute('aria-label','Choose animated character');
      for(const [id,title] of [['bunny','Bunny Fox'],['pigfish','Pigfish']]){
        const btn=document.createElement('button');btn.type='button';btn.dataset.character=id;
        btn.textContent=title;btn.setAttribute('aria-pressed',String(id===activeCharacter));
        btn.addEventListener('click',()=>applyCharacter(id));wrap.appendChild(btn);
      }
      return wrap;
    }
    const bookChooser=makeChooser();
    $('ftBook')?.insertBefore(bookChooser,$('ftBookPicker'));
    voice.parentElement?.insertBefore(makeChooser(),voice);
    try{if(localStorage.getItem('willena-ftg-demo-character')==='pigfish')applyCharacter('pigfish')}catch(_){}

    const ribbon=document.createElement('div');ribbon.className='bf-demo-ribbon';
    ribbon.innerHTML='<span>🐰 Bunny Fox · DEMO</span><small>AI Lili voice · same lessons and progress</small>';
    $('ftBook')?.insertBefore(ribbon,$('ftBookPicker'));
    function setState(value){if(actor.dataset.state!==value)actor.dataset.state=value}
    let autoSelecting=false;
    function selectBunny(){
      if(choice.hidden||autoSelecting)return;
      autoSelecting=true;
      try{
        $('ftChooseLili')?.click();
        const button=$('ftCharacterContinue');
        if(button&&!button.disabled)button.click();
      }finally{setTimeout(()=>{autoSelecting=false},120)}
    }
    const characterObserver=new MutationObserver(selectBunny);
    characterObserver.observe(choice,{attributes:true,attributeFilter:['hidden']});
    const activeObserver=new MutationObserver(()=>{
      if(!$('ftSession')?.hidden){
        if(circle.dataset.aiRecording==='true'||circle.dataset.listening==='true')setState('listening');
        else if(circle.dataset.transcribing==='true'||circle.dataset.phase==='thinking')setState('thinking');
        else if(actor.dataset.state!=='speaking')setState('idle');
      }else setState('idle');
    });
    activeObserver.observe(circle,{attributes:true,attributeFilter:['data-ai-recording','data-listening','data-transcribing','data-phase']});
    activeObserver.observe($('ftSession'),{attributes:true,attributeFilter:['hidden']});
    voice.addEventListener('ft:voice-playing',event=>{
      if(event.detail?.playing){setState('speaking');return}
      setState(circle.dataset.listening==='true'?'listening':'idle');
    });
    const finishObserver=new MutationObserver(()=>{
      if(!$('ftFinish')?.hidden){setState('celebrating');setTimeout(()=>setState('idle'),1500)}
    });
    if($('ftFinish'))finishObserver.observe($('ftFinish'),{attributes:true,attributeFilter:['hidden']});

    // Dedicated call-to-action for children. It clicks the real app button,
    // so recording, permissions, grading and session logic remain unchanged.
    const guide=document.createElement('button');
    guide.type='button';guide.className='bf-tap-guide';guide.dataset.kind='ready';
    guide.textContent='Tap your character to hear the question';
    voice.insertBefore(guide,circle.nextSibling);
    const mode=()=> $('ftSession')?.dataset.mode || 'speaking';
    function updateGuide(){
      if($('ftSession')?.hidden){guide.hidden=true;return}
      guide.hidden=false;
      const phase=circle.dataset.phase||'ready';
      const recording=circle.dataset.aiRecording==='true'||circle.dataset.listening==='true';
      const thinking=circle.dataset.transcribing==='true';
      const writing=mode()==='writing';
      if(thinking){guide.dataset.kind='thinking';guide.textContent='⏳ 목소리를 확인하고 있어요';}
      else if(recording){guide.dataset.kind='recording';guide.textContent='🎙️ 듣고 있어요 · 다시 눌러 끝내기';}
      else if(phase==='student'){guide.dataset.kind='student';guide.textContent=writing?'답변을 써 보세요':charName()+'를 눌러 영어로 말하기';}
      else if(phase==='ai'){guide.dataset.kind='ai';guide.textContent=charName()+'가 말하고 있어요';}
      else if(phase==='thinking'){guide.dataset.kind='thinking';guide.textContent=charName()+'가 생각하고 있어요';}
      else if(phase==='feedback'){guide.dataset.kind='feedback';guide.textContent='⭐ 피드백을 확인해 보세요';}
      else {guide.dataset.kind='ready';guide.textContent=charName()+'를 눌러 질문 듣기';}
      guide.disabled=guide.dataset.kind==='thinking'||guide.dataset.kind==='ai'||guide.dataset.kind==='feedback'||(writing&&phase==='student');
    }
    guide.addEventListener('click',()=>{if(!guide.disabled)circle.click()});
    guide.addEventListener('bf:quiet-ended',updateGuide);
    guide.addEventListener('bf:character-changed',updateGuide);
    const guideObserver=new MutationObserver(updateGuide);
    guideObserver.observe(circle,{attributes:true,attributeFilter:['data-phase','data-listening','data-ai-recording','data-transcribing']});
    guideObserver.observe($('ftSession'),{attributes:true,attributeFilter:['hidden','data-mode']});
    voice.addEventListener('ft:voice-playing',updateGuide);
    updateGuide();

    selectBunny();
    window.BunnyFox={setState,actor};
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onReady,{once:true});else onReady();
})();
