<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Free Talking Genius | Willena</title><link rel="icon" href="/Assets/Images/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/students/study/study.css?v=20260808-7">
<link rel="stylesheet" href="/students/study/study-overrides.css?v=20260808-1">
<link rel="stylesheet" href="/students/study-v2/v2.css?v=20260814-daily1">
<link rel="stylesheet" href="/students/vocab-study/vocab-study.css?v=20261024-home-navigation4">
<link rel="stylesheet" href="/students/vocab-study/theme-pips.css?v=20261101-footer1">
<link rel="stylesheet" href="/students/shared/willena-keyboard-safe.css?v=1.0.0">
<link rel="stylesheet" href="./styles.css?v=20261106-clean-conversation1">
<link rel="stylesheet" href="/students/dashboard-v2/mission-basket.css?v=20261105-overdue-missions1">
<script src="/students/api-gateway.js?v=20260926-progress-summary-cf1"></script>
<script src="/js/api-config.js?v=20260926-reverted-auth1"></script>
<script type="module" src="/students/components/student-header.js?v=20261101-menu-prominent1"></script>
<script type="module" src="/students/components/student-reward-celebration.js?v=20260926-v0005"></script>
</head><body>
<div class="study-app free-talking-genius">
<div id="vocabThemeDock" class="vocab-theme-dock" role="group" aria-label="색상 테마">
 <button type="button" class="vocab-theme-pip" data-theme="cyan" aria-label="Cyan 테마" title="Cyan" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="sunbeam" aria-label="Sunbeam 테마" title="Sunbeam" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="pink" aria-label="Pink 테마" title="Pink" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="paper" aria-label="Paper 테마" title="Paper" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="dark" aria-label="Dark 테마" title="Dark" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="cyberpunk" aria-label="Cyberpunk 테마" title="Cyberpunk" aria-pressed="false"></button>
</div>
<student-header title="프리토킹 지니어스" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
<main class="ft-page">
<div id="ftError" class="ft-error" role="alert" hidden></div>
<section id="ftHome" class="vocab-front-menu ft-home">
 <section id="appMissionBasket" class="app-mission-basket-slot" aria-label="미션 바구니"></section>
 <section class="vocab-front-books" aria-label="My Free Talking textbooks">
  <div class="vocab-front-section-head">
   <div><span class="eyebrow">내 교재</span><strong>교재를 선택하세요</strong></div>
  </div>
  <div id="ftBookChoices" class="vocab-front-book-list ft-book-list"></div>
 </section>
 <p id="ftLoading" class="ft-status" role="status">교재와 학습 기록을 확인하는 중…</p>
 <section id="ftFrontAchievements" data-shared-achievements class="vocab-front-achievements" hidden aria-label="Shared learning streaks and medals">
  <div class="vocab-front-achievement">
   <img src="/shared/svgs/streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftStreakCurrent">–</strong><small>연속 학습</small></div>
  </div>
  <div class="vocab-front-achievement">
   <img src="/shared/svgs/best-streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftStreakBest">–</strong><small>최고 연속</small></div>
  </div>
  <div class="vocab-front-achievement vocab-front-achievement-gold">
   <img src="/shared/svgs/golden-unit.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftMedalCount">–</strong><small>gold medals</small></div>
  </div>
 </section>
</section>
<section id="ftBook" class="ft-shell" hidden>
 <div class="vocab-subscreen-head ft-book-nav"><button id="ftBackHome" class="vocab-screen-back" type="button">← 홈</button><span>교재 공부</span></div>
 <section id="ftBookPicker" class="vocab-book-picker" aria-label="My textbooks">
  <div id="ftBookTabs" class="vocab-book-choices" role="group" aria-label="Choose textbook"></div>
 </section>
 <div id="ftUnitStrip" class="ft-units" aria-label="Units"></div>
 <h3 id="ftUnitTitle"></h3>
 <div class="ft-mode-grid">
  <button type="button" id="ftSpeakingCard" class="vocab-skill-card vocab-skill-pronunciation" data-mode="speaking">
   <span class="vocab-skill-ring" style="--progress:0"><span>0%</span></span>
   <span class="vocab-skill-copy"><small class="vocab-skill-step">STEP 1</small><strong>말하기 · Speaking</strong><span class="vocab-card-stars">8 questions</span></span>
  </button>
  <button type="button" id="ftWritingCard" class="vocab-skill-card vocab-skill-spelling" data-mode="writing">
   <span class="vocab-skill-ring" style="--progress:0"><span>0%</span></span>
   <span class="vocab-skill-copy"><small class="vocab-skill-step">STEP 2</small><strong>쓰기 · Writing</strong><span class="vocab-card-stars">8 questions</span></span>
  </button>
 </div>
</section>
<section id="ftSession" class="vocab-session ft-conversation" hidden>
 <div class="ft-screen-data" hidden aria-hidden="true">
  <strong id="ftSessionTitle"></strong><span id="ftSessionProgress"></span><div id="ftProgressFill"></div>
  <span id="ftPromptLabel"></span><button id="ftSessionHome" type="button"></button>
 </div>
 <main id="ftQuestionStage" class="vocab-session-main" data-willena-keyboard-safe>
  <h2 id="ftQuestionText" class="ft-question-title"></h2>
  <section id="ftWilliVoice" class="ft-willi-voice" aria-label="Free Talking conversation">
   <button type="button" id="ftTurnCircle" class="ft-turn-circle" data-ft-avatar data-phase="ready" aria-label="Listen to the question">
    <span class="ft-circle-glow"></span>
    <span class="ft-circle-ai" aria-hidden="true"><span class="ft-circle-bars"><i></i><i></i><i></i><i></i><i></i></span></span>
    <span class="ft-circle-mic" aria-hidden="true"><svg viewBox="0 0 48 48" width="72" height="72"><rect x="17" y="5" width="14" height="26" rx="7" fill="currentColor"/><path d="M11 22a13 13 0 0 0 26 0M24 35v8M16 43h16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></span>
    <span class="ft-circle-thinking" aria-hidden="true">···</span>
    <span id="ftCircleScore" class="ft-circle-score" aria-hidden="true">★</span>
   </button>
   <div class="ft-voice-engine" hidden aria-hidden="true">
    <span data-ft-character-name></span>
    <button type="button" data-ft-listen disabled></button>
    <select id="ftVoicePicker" data-ft-voice-picker>
     <option value="marin">AI Willi</option><option value="bunny-v3">AI Lili</option>
    </select>
    <span data-ft-voice-status></span><span data-ft-voice-model></span><span data-ft-voice-preload></span>
   </div>
  </section>
  <p id="ftTurnStatus" class="ft-turn-status" role="status" aria-live="polite">질문을 듣고 답해 보세요.</p>
  <div class="ft-hint-actions">
   <button id="ftHintTranslation" type="button" class="ft-hint-button">한국어 뜻 <small>−1</small></button>
   <button id="ftHintStarter" type="button" class="ft-hint-button">문장 시작 힌트 <small>−2</small></button>
  </div>
  <div id="ftHintTranslationText" class="ft-hint-result" hidden></div>
  <div id="ftHintStarterText" class="ft-hint-result" hidden></div>
  <p id="ftHintCap" class="ft-hint-cap" hidden></p>
  <div id="ftQuestionHost" class="vocab-question-wrap"></div>
  <div id="ftTranscriptRow" class="ft-transcript-row" hidden>
   <label for="ftTranscriptEdit">내 답변</label>
   <textarea id="ftTranscriptEdit" rows="3" lang="en" placeholder="말한 문장을 확인하거나 직접 입력하세요."></textarea>
  </div>
  <div id="ftFeedback" class="ft-feedback" hidden>
   <h3 id="ftFeedbackTitle"></h3>
   <div id="ftFeedbackTotal" class="ft-feedback-total">0/10</div>
   <div id="ftFeedbackGrid" class="ft-feedback-grid"></div>
   <p id="ftHintSummary" class="ft-hint-cap"></p>
   <div class="ft-correction"><strong>Better English</strong><p id="ftCorrection"></p></div>
  </div>
  <p id="ftAttemptStatus" class="ft-status" role="status"></p>
 </main>
 <footer class="vocab-session-bottom"><div class="vocab-action-row">
  <button id="ftSessionExit" type="button" class="vocab-skip-action">← Units</button>
  <button id="ftListenAgain" type="button" class="vocab-skip-action">Listen again</button>
  <button id="ftSkip" type="button" class="vocab-skip-action">Next question</button>
  <button id="ftRetry" type="button" class="vocab-skip-action" hidden>Try again</button>
  <button id="ftSubmit" type="button" class="vocab-action" disabled>Check Answer</button>
  <button id="ftNext" type="button" class="vocab-action" hidden>Next →</button>
 </div></footer>
</section>
<section id="ftFinish" class="ft-shell" hidden><div id="ftFinishContent"></div><div id="ftFinishStatus" class="ft-status" role="status"></div>
 <div class="ft-finish-actions"><button id="ftRetrySync" class="vocab-action" hidden type="button">Retry points sync</button><button id="ftFinishHome" class="vocab-action" type="button">Back to Units</button></div>
</section>
<div class="ft-footer-version">Free Talking Genius · 10-point conversation · v2.3</div>
</main></div>
<script type="module" src="./app.js?v=20261106-clean-conversation1"></script>
<script type="module" src="/students/vocab-study/theme-pips.js?v=20261101-footer1"></script>
<script src="/students/components/mission-basket.js?v=20261105-overdue-missions1"></script>
<script src="/students/components/student-achievements.js?v=20261031-goldcache2"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const slot=document.getElementById('appMissionBasket');if(slot)window.WillenaMissionBasket?.mount(slot,{app:'Free Talking Genius'})});</script>
<script defer src="/students/components/live-presence.js?v=20261103-p3b"></script>
<script defer src="/students/components/idle-identity-check.js?v=20261103-idle1"></script>
</body></html>
