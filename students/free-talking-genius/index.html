<link rel="stylesheet" href="/students/vocab-study/theme-pips.css?v=20261101-footer1">

<link rel="stylesheet" href="./character-animations.css?v=20261113-willy-actor1">

</head><body>
<div class="study-app free-talking-genius">
<div id="vocabThemeDock" class="vocab-theme-dock" role="group" aria-label="색상 테마">
 <button type="button" class="vocab-theme-pip" data-theme="cyan" aria-label="Cyan 테마" title="Cyan" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="sunbeam" aria-label="Sunbeam 테마" title="Sunbeam" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="pink" aria-label="Pink 테마" title="Pink" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="paper" aria-label="Paper 테마" title="Paper" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="dark" aria-label="Dark 테마" title="Dark" aria-pressed="false"></button>
 <button type="button" class="vocab-theme-pip" data-theme="cyberpunk" aria-label="Cyberpunk 테마" title="Cyberpunk" aria-pressed="false"></button>
</div>
<student-header title="프리토킹 지니어스" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
<main class="ft-page">
<div id="ftError" class="ft-error" role="alert" hidden></div>
<section id="ftHome" class="vocab-front-menu ft-home">
 <section id="appMissionBasket" class="app-mission-basket-slot" aria-label="미션 바구니"></section>
 <section class="vocab-front-books" aria-label="My Free Talking textbooks">
  <div class="vocab-front-section-head">
   <div><span class="eyebrow">내 교재</span><strong>교재를 선택하세요</strong></div>
  </div>
  <div id="ftBookChoices" class="vocab-front-book-list ft-book-list"></div>
 </section>
 <p id="ftLoading" class="ft-status" role="status">교재와 학습 기록을 확인하는 중…</p>
 <section id="ftFrontAchievements" data-shared-achievements class="vocab-front-achievements" hidden aria-label="Shared learning streaks and medals">
  <div class="vocab-front-achievement">
   <img src="/shared/svgs/streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftStreakCurrent">–</strong><small>연속 학습</small></div>
  </div>
  <div class="vocab-front-achievement">
   <img src="/shared/svgs/best-streak.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftStreakBest">–</strong><small>최고 연속</small></div>
  </div>
  <div class="vocab-front-achievement vocab-front-achievement-gold">
   <img src="/shared/svgs/golden-unit.svg?v=20260927-icons1" alt="" aria-hidden="true">
   <div><strong id="ftMedalCount">–</strong><small>gold</small></div>
  </div>
 </section>
</section>
<section id="ftBook" class="ft-shell" hidden>
 <div class="vocab-subscreen-head ft-book-nav"><button id="ftBackHome" class="vocab-screen-back" type="button">← 홈</button><span>교재 공부</span></div>
 <section id="ftBookPicker" class="vocab-book-picker" aria-label="My textbooks">
  <div id="ftBookTabs" class="vocab-book-choices" role="group" aria-label="Choose textbook"></div>
 </section>
 <div id="ftUnitStrip" class="ft-units" aria-label="Units"></div>
 <h3 id="ftUnitTitle"></h3>
 <div class="ft-mode-grid">
  <button type="button" id="ftSpeakingCard" class="vocab-skill-card vocab-skill-pronunciation" data-mode="speaking">
   <span class="vocab-skill-ring" style="--progress:0"><span>0%</span></span>
   <span class="vocab-skill-copy"><small class="vocab-skill-step">STEP 1</small><strong>말하기 · Speaking</strong><span class="vocab-card-stars">8 questions</span></span>
  </button>
  <button type="button" id="ftFreeTalkingCard" class="vocab-skill-card" aria-label="Free Talking">
   <span class="vocab-skill-ring" style="--progress:0"><span>0%</span></span>
   <span class="vocab-skill-copy"><small class="vocab-skill-step">STEP 2</small><strong>Free Talking</strong><span class="vocab-card-stars" hidden></span></span>
  </button>
 </div>
</section>
<section id="ftCharacter" class="ft-character-screen" hidden aria-label="캐릭터 선택">
 <div class="ft-character-panel">
  <h2>친구를 골라요!</h2>
  <p id="ftCharacterRound" hidden></p>
  <div class="ft-character-options" role="group" aria-label="대화 친구 선택">
   <button id="ftChooseLili" class="ft-character-option ft-character-lili" type="button" data-voice="bunny-v3" aria-pressed="false">
    <span class="ft-character-symbol" aria-hidden="true"></span><strong>Bunny Fox</strong>
   </button>
   <button id="ftChooseWilli" class="ft-character-option ft-character-willi" type="button" data-voice="marin" aria-pressed="false">
    <span class="ft-character-symbol ft-willi-portrait" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#69d7df" stroke-width="7"/><circle cx="50" cy="50" r="19" fill="none" stroke="#d6f2f4" stroke-width="8"/><path d="M50 31 A19 19 0 0 1 67 42" fill="none" stroke="#69c1cc" stroke-width="7" stroke-linecap="round"/><path d="M33 57 A19 19 0 0 0 47 69" fill="none" stroke="#efadce" stroke-width="7" stroke-linecap="round"/></svg></span><strong>Willo</strong>
   </button>
   <button id="ftChoosePigfish" class="ft-character-option ft-character-pigfish" type="button" data-voice="pigfish" aria-pressed="false">
    <span class="ft-character-symbol" aria-hidden="true"></span><strong>Pigfish</strong>
   </button>
  </div>
  <div class="ft-character-start-container"><button id="ftCharacterContinue" class="ft-character-continue" type="button" disabled>시작하기</button></div>
  <button id="ftCharacterBack" class="ft-character-back" type="button" aria-label="교재로 돌아가기" hidden>교재로 돌아가기</button>
 </div>
</section>
<section id="ftSession" class="vocab-session ft-conversation" hidden>
 <div class="ft-screen-data" hidden aria-hidden="true">
  <strong id="ftSessionTitle"></strong><span id="ftSessionProgress"></span><div id="ftProgressFill"></div>
  <span id="ftPromptLabel"></span><button id="ftSessionHome" type="button"></button>
 </div>
 <div id="ftQuestionStage" class="vocab-session-main" data-willena-keyboard-safe>
  <div id="ftGameCard" class="ft-game-card">
  <div id="ftHintActions" class="ft-hint-actions is-concealed" aria-hidden="true" inert>
   <button id="ftHintEnglish" type="button" class="ft-hint-button">영어 질문 <small>무료</small></button>
   <button id="ftHintTranslation" type="button" class="ft-hint-button">한국어 뜻 <small>무료</small></button>
   <button id="ftHintStarter" type="button" class="ft-hint-button">문장 힌트 <small>무료</small></button>
   <button id="ftEditTranscript" class="ft-hint-button" type="button" hidden aria-expanded="false" aria-controls="ftTranscriptRow">답변 수정 <small>무료</small></button>
  </div>
  <section id="ftWilliVoice" class="ft-willi-voice" aria-label="Free Talking conversation">
   <button type="button" id="ftTurnCircle" class="ft-turn-circle" data-ft-avatar data-phase="ready" aria-label="Listen to the question">
    <span class="ft-circle-glow"></span>
    <svg class="ft-record-countdown" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
     <circle class="ft-record-countdown-track" cx="50" cy="50" r="44" pathLength="100"/>
    </svg>
    <span class="ft-circle-start ft-orbit-visual" aria-hidden="true">
     <svg class="ft-orbit-art" viewBox="0 0 120 120" width="120" height="120" fill="none">
      <circle cx="60" cy="60" r="29" stroke="#e3f6f7" stroke-width="7"/>
      <g class="ft-orbit-arc ft-orbit-arc-cyan"><path d="M60 31 A29 29 0 0 1 87.2 70" stroke="#80ccd6" stroke-width="7" stroke-linecap="round"/></g>
      <g class="ft-orbit-arc ft-orbit-arc-pink"><path d="M60 89 A29 29 0 0 1 32.8 50" stroke="#edb1d0" stroke-width="7" stroke-linecap="round"/></g>
      <circle cx="60" cy="60" r="11" fill="#f8e6f1"/>
     </svg>
    </span>
    <span class="ft-circle-ai" aria-hidden="true"><span class="ft-circle-bars"><i></i><i></i><i></i><i></i><i></i></span></span>
    <span class="ft-circle-mic" aria-hidden="true"><svg viewBox="0 0 48 48" width="72" height="72"><rect x="17" y="5" width="14" height="26" rx="7" fill="currentColor"/><path d="M11 22a13 13 0 0 0 26 0M24 35v8M16 43h16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></span>
    <span class="ft-circle-thinking" aria-hidden="true"><span class="ft-thinking-swirl"></span></span>
    <span id="ftCircleScore" class="ft-circle-score" aria-hidden="true">★</span>
   </button>
   <div class="ft-voice-engine" hidden aria-hidden="true">
    <span data-ft-character-name></span>
    <button type="button" data-ft-listen disabled></button>
    <select id="ftVoicePicker" data-ft-voice-picker>
     <option value="marin">Willo</option><option value="bunny-v3">Bunny Fox</option><option value="pigfish">Pigfish</option><option value="willy">AI Willy</option>
    </select>
    <span data-ft-voice-status></span><span data-ft-voice-model></span><span data-ft-voice-preload></span>
   </div>
  </section>
  <p id="ftRecordStatus" class="ft-record-status" role="status" aria-live="polite" hidden></p>
  <p id="ftTurnStatus" class="ft-turn-status" role="status" aria-live="polite" hidden></p>
  <div id="ftHeardSentence" class="ft-heard-sentence" hidden aria-live="polite"><span id="ftHeardText"></span></div>
  <h2 id="ftQuestionText" class="ft-question-title" hidden></h2>
   <button id="ftChallengeSplash" class="ft-challenge-splash" type="button" hidden aria-label="도전 목표 확인하고 시작">
    <span class="ft-challenge-card">
     <strong>도전!</strong>
     <span id="ftChallengeSplashText"></span>
     <small>터치해서 시작</small>
    </span>
   </button>
   <div id="ftLanguageChallenge" class="ft-language-challenge" hidden><strong>도전</strong><p id="ftChallengeText"></p></div>
  <button id="ftHintViewer" type="button" class="ft-hint-viewer" hidden aria-label="열어 본 힌트 보기" aria-live="polite">
   <span class="ft-hint-viewer-top"><strong id="ftHintViewerTitle"></strong><span id="ftHintViewerCount"></span></span>
   <span id="ftHintViewerValue" class="ft-hint-viewer-value"></span>
   <span id="ftHintViewerGuide" class="ft-hint-viewer-guide"></span>
  </button>
  <p id="ftHintCap" class="ft-hint-cap" hidden></p>
  <div id="ftQuestionHost" class="vocab-question-wrap"></div>
  <div id="ftTranscriptRow" class="ft-transcript-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ftEditTitle">
   <div class="ft-transcript-dialog">
    <div class="ft-modal-head"><h3 id="ftEditTitle">답변 수정</h3><button type="button" id="ftCloseTranscript" class="ft-modal-close" aria-label="닫기">×</button></div>
    <label for="ftTranscriptEdit">내가 말한 문장</label>
    <textarea id="ftTranscriptEdit" rows="4" lang="en" placeholder="말한 문장을 확인하거나 직접 입력하세요."></textarea>
    <button type="button" id="ftSaveTranscript" class="ft-modal-save">확인</button>
   </div>
  </div>
  <div id="ftFeedback" class="ft-feedback" hidden>
   <section id="ftScoreSplash" class="ft-score-splash">
    <div id="ftSplashSkills" class="ft-splash-skills" aria-label="Skill scores"></div>
    <div id="ftSplashScore" class="ft-splash-score" aria-live="polite">0 out of 10</div>
    <div id="ftSplashSymbol" class="ft-splash-symbol" aria-hidden="true">
     <svg id="ftSplashPassIcon" viewBox="0 0 100 100" hidden><circle cx="50" cy="50" r="43" fill="#E5F8F5"/><path d="M25 50l18 17 31-34" fill="none" stroke="#30AC96" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
     <svg id="ftSplashRetryIcon" viewBox="0 0 100 100" hidden><circle cx="50" cy="50" r="43" fill="#FFF0F6"/><path d="M33 33l34 34M67 33L33 67" stroke="#D95399" stroke-width="8" stroke-linecap="round"/></svg>
    </div>
    <h3 id="ftSplashTitle">다시 도전</h3>
   </section>
   <section id="ftRepeatScreen" class="ft-repeat-screen" hidden>
    <div class="ft-repeat-sentence"><small>내 문장</small><p id="ftOriginalAnswer"></p></div>
    <div class="ft-repeat-sentence is-corrected"><small>고친 문장</small><p id="ftCorrection"></p></div>
    <div class="ft-repeat-choice-row"><button id="ftRepeatFixedAction" class="ft-repeat-choice-action" type="button">고친 문장 녹음</button><button id="ftRepeatNewIdea" class="ft-repeat-choice-action" type="button" hidden>새 아이디어</button></div>
    <div id="ftRepeatCircleMount" class="ft-repeat-circle-mount"></div>
    <p id="ftRepeatMessage" class="ft-repeat-message" role="status">원을 눌러 다시 말하세요.</p>
   </section>
  </div>
  <p id="ftAttemptStatus" class="ft-status" role="status"></p>
  </div>
 </div>
 <footer class="vocab-session-bottom"><div class="vocab-action-row">
  <button id="ftSessionExit" type="button" class="vocab-skip-action">← Units</button>
  <button id="ftListenAgain" type="button" class="vocab-skip-action" disabled aria-label="질문 다시 듣기"><span class="ft-replay-icon" aria-hidden="true">↻</span><span>다시 듣기</span></button>
  <button id="ftSkip" type="button" class="vocab-skip-action">Next question</button>
  <button id="ftRetry" type="button" class="vocab-skip-action" hidden>Try again</button>
  <button id="ftSubmit" type="button" class="vocab-action" disabled>Check Answer</button>
  <button id="ftNext" type="button" class="vocab-action" hidden>Next →</button>
 </div></footer>
</section>
<section id="ftFinish" class="ft-shell" hidden><div id="ftFinishContent"></div><div id="ftFinishStatus" class="ft-status" role="status"></div>
 <div class="ft-finish-actions"><button id="ftRetrySync" class="vocab-action" hidden type="button">Retry points sync</button><button id="ftFinishHome" class="vocab-action" type="button">Back to Units</button></div>
</section>
<div class="ft-footer-version">Free Talking Genius · 10-point conversation · v2.3</div>
</main></div>
