<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profile · Willena English</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/students/dashboard-v2/dashboard-header-p4.css?v=20260915p4c">
<link rel="stylesheet" href="/students/dashboard-v2/dashboard-theme-pips.css?v=20260915p6d">
<link rel="stylesheet" href="/students/profile-v2.css?v=20260915p1">
<script src="/students/api-gateway.js"></script>
<script src="/js/api-config.js?v=20260113c"></script>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-left">
      <div class="header-metrics">
        <div class="points-pill stars-pill" id="headerStars">⭐ —</div>
        <div class="points-pill" id="headerPoints">+ —</div>
      </div>
    </div>
    <div class="header-identity">
      <strong id="headerName">Student</strong>
      <span id="headerClass">Willena English</span>
    </div>
    <button class="avatar" type="button" aria-label="Change avatar">🙂</button>
  </header>

  <main class="profile-main">
    <section class="profile-intro">
      <h1>Profile</h1>
      <p>Your Willena account</p>
    </section>

    <section class="profile-frame pink">
      <div class="profile-card">
        <div class="profile-top">
          <button class="profile-avatar-button skeleton" id="profileAvatar" type="button" aria-label="Change avatar">🙂</button>
          <div class="profile-summary">
            <strong class="skeleton" id="profileName">Student</strong>
            <span class="skeleton" id="profileClassSummary">Willena English</span>
            <button class="change-avatar" id="changeAvatar" type="button">Change avatar</button>
          </div>
        </div>
        <div class="profile-fields">
          <div class="profile-row"><span class="label">English Name</span><span class="value skeleton" id="pfNameEn">Loading</span></div>
          <div class="profile-row"><span class="label">Korean Name</span><span class="value skeleton" id="pfNameKo">Loading</span></div>
          <div class="profile-row"><span class="label">Class</span><span class="value skeleton" id="pfClass">Loading</span></div>
          <div class="profile-row"><span class="label">Email</span><span class="value skeleton" id="pfEmail">Loading</span></div>
        </div>
        <div class="status" id="profileStatus" aria-live="polite"></div>
      </div>
    </section>

    <section class="profile-frame cyan">
      <div class="profile-card">
        <h2 class="section-title">Account</h2>
        <p class="account-note">Your name, class and email are managed by Willena. You can change your avatar here anytime.</p>
        <div class="action-row">
          <button class="profile-action primary" id="backDashboard" type="button">Back to dashboard</button>
        </div>
      </div>
    </section>
  </main>

  <div class="footer-logo" role="img" aria-label="Willena English"></div>
  <div class="profile-revision">profile v2.0 · rev1</div>
</div>

<div class="avatar-modal" id="avatarModal" aria-hidden="true">
  <div class="avatar-dialog" role="dialog" aria-modal="true" aria-labelledby="avatarTitle">
    <div class="avatar-dialog-head">
      <h2 id="avatarTitle">Choose your avatar</h2>
      <button class="avatar-close" id="avatarClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="avatar-actions">
      <button class="avatar-cancel" id="avatarCancel" type="button">Cancel</button>
      <button class="avatar-save" id="avatarSave" type="button">Save</button>
    </div>
  </div>
</div>

<script src="/students/dashboard-v2/dashboard-theme-pips.js?v=20260915p6b"></script>
<script src="/students/profile-v2.js?v=20260915p1"></script>
</body>
</html>
