<style>
/* Retain legacy header IDs for the existing Grammar Genius engine; shared header is visible. */
.student-header.tp-v1-header{display:none!important}
.gf-genius-shell{min-height:100vh;display:flex;flex-direction:column}
.gf-genius-shell .gf-app{flex:1;width:100%}
.gf-genius-shell .vocab-theme-footer{margin-top:auto}
.gf-genius-shell .vocab-theme-dock{margin:12px auto}
.gf-book-browser{display:grid;gap:12px;max-width:850px;margin:20px auto}
.gf-book-header{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:2px solid var(--vocab-border,#b6eaf1);border-radius:18px;padding:18px;color:var(--vocab-heading,#315e64)}
.gf-book-header span{font-size:12px;color:var(--muted,#64748b)}
.gf-book-chapter{background:var(--vocab-card,#fff);border:2px solid var(--vocab-border,#b6eaf1);border-radius:18px;overflow:hidden}
.gf-book-chapter summary{cursor:pointer;font-weight:800;padding:16px;color:var(--pink,#cf4c96)}
.gf-book-unit{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--vocab-border,#e4f0f2);padding:12px 16px}
.gf-book-unit small{white-space:nowrap;color:var(--muted,#78828c)}
.gf-book-note{max-width:850px;margin:20px auto;font-size:13px;color:var(--muted,#64748b)}
</style><style>
/* Textbook path only: match Word / Sentence Genius book-card hierarchy. */
.gf-book-home{max-width:920px;margin:0 auto;padding:20px 16px 65px}
.gf-book-kicker{color:var(--pink,#ee4c9b);font-size:12px;font-weight:900;letter-spacing:.14em;text-align:center}
.gf-book-home .gf-title,.gf-book-home .gf-subtitle{text-align:center}
.gf-book-tile{display:flex;align-items:center;gap:18px;border:2px solid var(--vocab-border,#c9f1f4);border-radius:22px;background:var(--vocab-card,#fff);padding:20px;margin:26px auto 16px;box-shadow:0 10px 28px rgba(40,100,110,.07)}
.gf-book-tile-icon{width:68px;height:68px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--vocab-border,#c9f1f4);border-radius:18px;color:var(--pink,#ff0a8a);background:var(--vocab-card,#fff)}
.gf-book-tile-icon svg{width:43px;height:43px}
.gf-book-tile-label{color:var(--pink,#ff0a8a);font-size:11px;font-weight:900;letter-spacing:.12em}
.gf-book-tile h2{margin:4px 0;color:var(--vocab-heading,#244f56);font-size:clamp(19px,4vw,25px)}
.gf-book-tile p{margin:0;color:var(--muted,#6f8190);font-size:13px}
.gf-book-browser{display:grid;gap:12px;max-width:none;margin:16px auto}
.gf-book-chapter{margin:0;background:var(--vocab-card,#fff);border:2px solid var(--vocab-border,#c9f1f4);border-radius:17px;overflow:hidden}
.gf-book-chapter summary{display:flex;align-items:center;gap:12px;padding:16px;color:var(--vocab-heading,#244f56);font-size:15px}
.gf-book-chapter-number{font-size:11px;color:var(--pink,#ff0a8a);font-weight:900;white-space:nowrap}
.gf-book-chapter-count{margin-left:auto;color:var(--muted,#6f8190);font-size:12px;white-space:nowrap}
.gf-book-unit{align-items:center;background:var(--vocab-card,#fff);color:var(--ink,#173f46)}
.gf-book-unit strong{color:var(--pink,#ff0a8a);font-size:11px;white-space:nowrap}
.gf-book-unit span{flex:1}
@media(max-width:480px){.gf-book-tile{padding:14px;gap:12px}.gf-book-tile-icon{width:52px;height:52px}.gf-book-tile-icon svg{width:34px;height:34px}.gf-book-chapter summary{font-size:13px;gap:8px}.gf-book-unit{gap:8px;padding:12px}.gf-book-unit span{font-size:13px}}
</style></head>

<div class="study-app gf-genius-shell">
<student-header title="문법 지니어스" show-id="false" show-home="false" show-points="true" show-logout="true"></student-header>
<div id="vocabThemeDock" class="vocab-theme-dock" role="group" aria-label="색상 테마"><button type="button" class="vocab-theme-pip" data-theme="cyan" aria-label="cyan 테마" title="cyan" aria-pressed="false"></button><button type="button" class="vocab-theme-pip" data-theme="sunbeam" aria-label="sunbeam 테마" title="sunbeam" aria-pressed="false"></button><button type="button" class="vocab-theme-pip" data-theme="pink" aria-label="pink 테마" title="pink" aria-pressed="false"></button><button type="button" class="vocab-theme-pip" data-theme="paper" aria-label="paper 테마" title="paper" aria-pressed="false"></button><button type="button" class="vocab-theme-pip" data-theme="dark" aria-label="dark 테마" title="dark" aria-pressed="false"></button><button type="button" class="vocab-theme-pip" data-theme="cyberpunk" aria-label="cyberpunk 테마" title="cyberpunk" aria-pressed="false"></button></div>

      <div class="student-name" id="user">Student</div>

        <span class="header-pill header-stars"><span class="header-star" aria-hidden="true">★</span><span id="headerStars">—</span></span>
      </div>
    </div>
    <div class="header-brand">
      <div class="header-title">Grammar Genius</div>
      <div class="profile-menu-wrap">
        <button class="header-avatar" id="studentAvatar" type="button" aria-label="Student menu" aria-expanded="false" aria-controls="studentProfileMenu">S</button>
        <div class="profile-menu" id="studentProfileMenu" hidden>
          <button class="profile-menu-item" id="studentProfileOpen" type="button"><span class="profile-menu-icon" aria-hidden="true">☺</span><span>Profile</span></button>
          <button class="profile-menu-item" id="studentDashboardOpen" type="button"><span class="profile-menu-icon" aria-hidden="true">⌂</span><span>Dashboard</span></button>
          <button class="profile-menu-item" id="studentBigTextToggle" type="button" aria-pressed="false"><span class="profile-menu-icon" aria-hidden="true">Aa</span><span id="studentBigTextLabel">큰 글자 꺼짐</span></button>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item" id="studentTestPrepA" type="button"><span class="profile-menu-icon" aria-hidden="true">A</span><span>Test Prep A</span></button>
          <button class="profile-menu-item" id="studentTestPrepB" type="button"><span class="profile-menu-icon" aria-hidden="true">B</span><span>Test Prep B</span></button>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item profile-logout" id="studentLogout" type="button"><span class="profile-menu-icon" aria-hidden="true">↪</span><span>Log out</span></button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-curve"></div>
</header>
<button type="button" class="gf-home-button" id="gfHomeButton" aria-label="Grammar Genius Home menu"><span class="gf-home-button-icon" aria-hidden="true">⌂</span><span class="gf-home-button-label">홈 Home</span></button>
