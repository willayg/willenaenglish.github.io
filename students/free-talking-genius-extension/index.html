<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Free Talking Genius · Realtime Extension Demo</title>
<link rel="stylesheet" href="/students/free-talking-genius/styles.css?v=20261108-golden-actions3">
<link rel="stylesheet" href="/students/free-talking-genius/character-animations.css?v=20261107-layer-fin3">
<link rel="stylesheet" href="/students/free-talking-genius/live-animal-ui.css?v=20261107-live-animals1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Poppins,Arial,sans-serif;color:#263c50}
#original{border:0;display:block;width:100%;height:100dvh;background:#fff}
#demo{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at top,#e8fbfd,#f8fafc 60%,#fef6fa);overflow:auto;padding:16px}
#demo[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:18px 0 40px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.back{background:white;border:2px solid #d4edf0;border-radius:16px;padding:11px 15px;font-weight:800;color:#267f89;cursor:pointer}.tag{font-size:10px;letter-spacing:1.4px;color:#65909b;font-weight:900}
h1{font-size:clamp(23px,5vw,32px);line-height:1.25;margin:6px 0}.sub{color:#607685;font-size:13px;margin:7px 0 20px}
.panel{background:#fff;border:1px solid #dcecf0;box-shadow:0 12px 38px #245b7612;border-radius:25px;padding:23px;margin-bottom:15px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.character{background:#fff;border:2px solid #dcebf0;border-radius:23px;padding:13px 5px 16px;min-width:0;cursor:pointer;font:800 12px Poppins,Arial;color:#385569;transition:transform .15s,border .15s}
.character[aria-pressed=true]{border-color:#25b8c6;background:#f0fcfd;box-shadow:0 0 0 3px #d6f6f8}
.character .portrait{height:clamp(85px,20vw,155px);display:flex;align-items:center;justify-content:center;position:relative}.portrait svg{height:100%;width:100%}.portrait .bf-svg{width:100%;height:100%}
.character strong{display:block;white-space:nowrap;margin-top:8px;font-size:clamp(11px,2.5vw,15px)}
.willi-icon{width:74%;height:74%;border:12px solid #7de0e8;border-radius:50%;box-shadow:inset 0 0 0 8px #e4f9fb;position:relative}.willi-icon::after{content:"";position:absolute;inset:28%;border-radius:50%;background:#35c2d0}
.primary{border:2px solid #4dc5d1;border-radius:17px;background:#d8f9fc;color:#087987;font:900 15px Poppins;padding:14px 20px;min-height:48px;cursor:pointer}.primary:disabled{opacity:.45}
.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.secondary{border:2px solid #d0e4e8;background:white;border-radius:16px;padding:11px 16px;color:#396b7a;font:800 13px Poppins;cursor:pointer}
#start{width:100%;margin-top:20px}
#talk{display:none}#talk.is-visible{display:block}#choose.is-hidden{display:none}
.actor-stage{height:260px;display:grid;place-items:center;position:relative}
.demo-actor{width:min(260px,72vw);height:min(260px,72vw);display:block;position:relative;filter:drop-shadow(0 7px 18px #31a3bb40)}
.demo-actor .bf-svg{width:100%;height:100%}
.demo-actor[data-state=speaking] .bf-talk-mouth,.demo-actor[data-state=speaking] .pf-talk-mouth{opacity:1}
.demo-actor[data-state=speaking] .bf-rest-mouth,.demo-actor[data-state=speaking] .pf-rest-mouth{opacity:0}
.willi-stage{width:190px;height:190px;background:radial-gradient(circle at 30% 20%,#efffff,#85e1ec 54%,#1da7bf);border:6px solid white;border-radius:50%;box-shadow:0 5px 35px #43ccd459;display:grid;place-items:center}
.willi-stage i{display:block;width:66px;height:66px;border:16px solid #b9f8fb;border-radius:50%}
[data-phase=speaking] .willi-stage{animation:pulse 1s alternate infinite}
@keyframes pulse{to{transform:scale(1.05);box-shadow:0 0 35px #17b4c9}}
.time{font-size:35px;letter-spacing:1px;font-weight:900;color:#198c9b;text-align:center}
#status{text-align:center;color:#60808c;font-size:13px;min-height:24px;margin:8px 0 16px}
#log{max-height:165px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:18px 0}
.entry{font-size:13px;padding:9px 11px;border-radius:13px;background:#f1f9fb}.entry.me{background:#fff1f5}.entry b{display:block;font-size:10px;color:#6c8b96}
.small{font-size:11px;color:#778b96;line-height:1.6}
#error{font-size:12px;color:#b03454;text-align:center;min-height:22px}
#volumeBox{display:flex;align-items:center;justify-content:center;gap:12px;color:#597685;font-size:12px;font-weight:800;margin:12px 0}
#volume{width:min(240px,55vw);accent-color:#1aa9b8}.lesson-focus{margin:0 auto 12px;padding:8px 12px;border-radius:12px;background:#eef9fb;color:#35727d;font-size:12px;text-align:center;max-width:560px}
/* Keep the EXACT Free Talking speaking circle, SVG art and character animation.
   Only the enclosing experimental layout is new. No replacement actor graphics. */
#actorStage .free-talking-genius{width:100%;display:flex;align-items:center;justify-content:center}
#actorStage #ftExtensionOriginalShell #ftSession{
  width:100%!important;max-width:none!important;margin:0!important;padding:0!important;
  border:0!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;overflow:visible!important;display:flex!important;
  align-items:center!important;justify-content:center!important
}
#actorStage #ftWilliVoice{padding:0!important;margin:0!important;min-height:0!important;
  width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  border:0!important;background:transparent!important;box-shadow:none!important}
#actorStage #ftTurnCircle{pointer-events:none!important;cursor:default!important;
  width:min(240px,56vw)!important;height:min(240px,56vw)!important}
#actorStage #ftTurnCircle .bf-actor{width:100%!important;height:100%!important}
#actorStage #ftTurnCircle:disabled{opacity:1!important;filter:none!important}
#actorStage #ftSession[data-character="bunny-v3"] #ftTurnCircle,
#actorStage #ftSession[data-character="pigfish"] #ftTurnCircle{
  background:transparent!important;border-color:transparent!important;box-shadow:none!important;overflow:visible!important
}
#actorStage #ftSession[data-character="bunny-v3"] #ftTurnCircle > :not(.bf-actor),
#actorStage #ftSession[data-character="pigfish"] #ftTurnCircle > :not(.bf-actor){display:none!important}
#actorStage #ftTurnCircle .ft-circle-start{display:none!important}
#actorStage #ftTurnCircle[data-phase="ai"] .ft-circle-ai{display:flex!important}
#actorStage #ftTurnCircle[data-phase="student"] .ft-circle-ai{display:none!important}
#actorStage #ftTurnCircle[data-phase="student"] .ft-circle-mic{display:flex!important}
#demo{padding:0!important;overscroll-behavior:contain}
#demo .wrap{padding:0 12px 190px}
#demo .top{position:sticky;top:0;z-index:30;background:#f8fcfd;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 10px!important;border-bottom:1px solid #d8eef1;box-shadow:0 3px 12px #1d66810b}
#demo .top .back{flex:none}
#demo #talk{margin-top:12px}
#demo #talk .actor-stage{height:min(240px,32dvh)}
#demo .control-dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid #caebee;background:#fffffffb;box-shadow:0 -9px 35px #153f621c;display:grid;gap:9px}
#demo .control-dock .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
#demo .control-dock .row button{min-height:46px}
#demo .control-dock #volumeBox{margin:0}
#demo #micLevel{display:inline-block;min-width:140px;text-align:center;color:#447687;font-size:12px;font-weight:750}
#demo #listenCheck{display:block;color:#447687;font-size:12px;min-height:19px;text-align:center}
#demo #restart{border-color:#81d2da;background:#e6fbfd}
#demo .top{position:sticky;top:0;z-index:25;background:#f8fcfdf2;padding:8px 0 14px;
  border-radius:15px}

@media(max-width:450px){.panel{padding:17px}.character{padding:8px 2px 12px}.chars{gap:7px}.actor-stage{height:220px}}
</style></head><body>
<iframe id="original" title="The original Free Talking Genius application" src="/students/free-talking-genius/"></iframe>
<div id="demo" hidden><main class="wrap"><div class="top"><div><div class="tag">FREE TALKING GENIUS · EXPERIMENT</div><h1 id="heading">Choose your conversation friend</h1><p class="sub" id="lesson">Loading lesson…</p></div><button id="back" class="back" type="button">Back</button></div>
<div class="panel" id="talk"><div id="actorStage" class="actor-stage" data-phase="ready"></div><div class="time" id="clock">03:00</div><div id="status" role="status">Starting…</div><div id="lessonFocus" class="lesson-focus">Lesson focus: loading current unit…</div>
<div class="control-dock">
<div id="listenCheck" role="status">Microphone: waiting to connect</div>
<div class="row"><span id="micLevel">Mic level: —</span><button id="restart" class="secondary" type="button" disabled>Start / Retry</button></div>
<div class="row"><button type="button" class="secondary" id="mute" disabled>Mute microphone</button><button type="button" class="secondary" id="end">End conversation</button></div>
<label id="volumeBox">AI voice volume <input id="volume" type="range" min="0" max="100" value="25" step="5"><output id="volumeNumber">25%</output></label>
<div class="row"><button type="button" class="secondary" id="soundFallback">Use phone speaker</button></div>
</div><div id="log" aria-live="polite"></div><p class="small" style="text-align:center">Free Talking practice: no homework, stars, or golden-unit credit.</p></div>
<p id="error" role="alert"></p>
</main></div>
<script src="/students/api-gateway.js?v=20260926-progress-summary-cf1"></script>
<script type="module" src="./extension.js?v=20261108-lesson-mic-controls8"></script></body></html>
