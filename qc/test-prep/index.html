<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Willena 내신 QC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="tpThemeSystem" rel="stylesheet" href="/students/test-prep-app/theme-system.css?v=20260829-width1">
<style>
body{background:#f4f8f8}.qc-gate{min-height:70vh;display:grid;place-items:center;padding:24px}.qc-gatebox{width:min(520px,100%);background:#fff;border:1px solid #dce7e8;border-radius:24px;padding:30px;text-align:center}.qc-spin{width:34px;height:34px;border:4px solid #d9e9e9;border-top-color:#19777e;border-radius:50%;animation:qcs 1s linear infinite;margin:20px auto}@keyframes qcs{to{transform:rotate(360deg)}}
.qc-shell{max-width:1180px;margin:0 auto;padding:16px}.qc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.qc-brand{display:flex;align-items:center;gap:10px}.qc-mark{width:42px;height:42px;border-radius:13px;background:#19777e;color:#fff;display:grid;place-items:center;font-weight:900}.qc-brand h1{font-size:20px;margin:0;color:#163236}.qc-brand small,.qc-who{color:#718085}.qc-who{font-size:12px}.qc-panel{background:#fff;border:1px solid #dce7e8;border-radius:20px;padding:15px;margin-bottom:14px}.qc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.qc-field label{display:block;font-size:10px;font-weight:800;color:#607276;margin:0 0 5px;text-transform:uppercase}.qc-field select,.qc-field input{width:100%;min-height:42px;border:1px solid #cfdedf;border-radius:10px;padding:8px 10px;background:#fff;font:inherit;color:#163236}.qc-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.qc-btn{border:1px solid #cfdedf;background:#fff;color:#163236;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.qc-btn.primary{background:#19777e;color:#fff;border-color:#19777e}.qc-note{margin-left:auto;font-size:11px;color:#718085}.qc-summary{font-size:12px;color:#607276;margin:0 0 8px}.qc-play{max-width:900px;margin:0 auto}.qc-panel.compact{padding:10px 12px}.qc-panel.compact .qc-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.qc-panel.compact .qc-field label{font-size:9px}.qc-panel.compact .qc-field select,.qc-panel.compact .qc-field input{min-height:36px;padding:6px 8px;font-size:12px}.qc-panel.compact .qc-actions{margin-top:8px}#playPane[hidden],#qcApp[hidden],#gate[hidden]{display:none!important}
@media(max-width:900px){.qc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.qc-panel.compact .qc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.qc-note{width:100%;margin-left:0}}@media(max-width:520px){.qc-shell{padding:9px}.qc-grid,.qc-panel.compact .qc-grid{grid-template-columns:1fr}.qc-top{align-items:flex-start}.qc-who{max-width:140px;text-align:right}.qc-brand small{display:none}}
</style>
</head>
<body>
<div id="gate" class="qc-gate"><div class="qc-gatebox"><div class="qc-mark" style="margin:auto">QC</div><h1>내신 QC</h1><p id="gateText">교사 계정을 확인하고 있습니다.</p><div id="spinner" class="qc-spin"></div></div></div>
<div id="qcApp" class="qc-shell" hidden>
  <div class="qc-top"><div class="qc-brand"><div class="qc-mark">QC</div><div><h1>내신 Student Play QC</h1><small>학생 문제 엔진 그대로 검수</small></div></div><div id="who" class="qc-who">Teacher</div></div>
  <section id="filtersPane" class="qc-panel">
    <div class="qc-grid">
      <div class="qc-field"><label>Grade</label><select id="grade"><option value="">전체 학년</option></select></div>
      <div class="qc-field"><label>Book</label><select id="book"><option value="">전체 교재</option></select></div>
      <div class="qc-field"><label>Lesson</label><select id="unit"><option value="">전체 Lesson</option></select></div>
      <div class="qc-field"><label>Skill</label><select id="section"><option value="communication">Communication</option><option value="grammar">Grammar</option><option value="reading">Reading</option><option value="vocabulary">Vocabulary questions</option></select></div>
      <div class="qc-field"><label>Grammar target</label><select id="grammarTarget"><option value="">Grammar 선택 시 사용</option></select></div>
      <div class="qc-field"><label>Pattern</label><select id="pattern"><option value="">전체 Pattern</option></select></div>
      <div class="qc-field"><label>Source</label><select id="sourceMode"><option value="rotate">Reference ↔ Willena 회전</option><option value="reference">Reference만</option><option value="willena">Willena Published만</option><option value="all">전부</option></select></div>
      <div class="qc-field"><label>Usability</label><select id="usable"><option value="all">전체 — 비활성 포함</option><option value="true">Student usable</option><option value="false">Not usable</option></select></div>
      <div class="qc-field"><label>Created from</label><input id="from" type="date"></div>
      <div class="qc-field"><label>Created to</label><input id="to" type="date"></div>
    </div>
    <div class="qc-actions"><button id="start" class="qc-btn primary" type="button">학생처럼 시작</button><button id="reset" class="qc-btn" type="button">초기화</button><span class="qc-note">답변 기록은 학생 진도에 저장되지 않습니다. 🚩 신고는 QC DB에 저장됩니다.</span></div>
  </section>
  <section id="playPane" class="qc-play" hidden>
    <div id="summary" class="qc-summary"></div>
    <div class="app">
      <div class="engine-shell" id="engineShell">
        <div class="engine-progress" aria-hidden="true"><i id="bar"></i></div>
        <main class="card" id="card"></main>
      </div>
    </div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="modal"><h3>이 문제에 문제가 있나요? 🚩</h3><p>이유를 골라 주세요.</p><div class="reasons" id="reasons"></div><textarea class="note" id="flagNote" placeholder="추가 메모 (선택)"></textarea><div class="modal-actions"><button class="secondary" id="cancelFlag">취소</button><button class="primary" id="sendFlag">보내기</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="./qc-play.js?v=20260829-target3"></script>
</body>
</html>
